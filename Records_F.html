<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .rec-filter {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      padding: 8px 12px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 103px;
      z-index: 85;
    }
    .rec-filter input[type="date"],
    .rec-filter input[type="search"] {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      -webkit-appearance: none;
    }
    .rec-filter input[type="date"]   { width: 130px; }
    .rec-filter input[type="search"] { flex: 1; min-width: 120px; }
    .rec-filter input:focus { outline: none; border-color: var(--navy); }
    .rec-filter .btn-filter {
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .rec-filter .btn-clear {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .rec-list {
      padding: 8px 10px 80px;
    }

    .rec-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      padding: 11px 12px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: box-shadow 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .rec-card:hover  { box-shadow: var(--shadow-2); }
    .rec-card:active { background: var(--navy-light); }

    .rec-card-accent {
      width: 4px;
      border-radius: 4px;
      align-self: stretch;
      flex-shrink: 0;
    }
    .rec-card[data-type="GRN"]      .rec-card-accent { background: #1D4ED8; }
    .rec-card[data-type="IQC"]      .rec-card-accent { background: var(--navy); }
    .rec-card[data-type="OQC"]      .rec-card-accent { background: #BE185D; }
    .rec-card[data-type="IPQC"]     .rec-card-accent { background: var(--hold); }
    .rec-card[data-type="Gatepass"] .rec-card-accent { background: var(--success); }

    .rec-main { flex: 1; min-width: 0; }
    .rec-docno {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .rec-name {
      font-size: 12px;
      color: var(--text);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .rec-chevron { font-size: 18px; color: var(--muted); }

    .state-box {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .state-box .icon { font-size: 40px; display: block; margin-bottom: 10px; }
    .state-box .msg  { font-size: 13px; font-weight: 500; }
    .state-box .sub  { font-size: 11px; margin-top: 4px; }

    .badge-accepted { background: #DCFCE7; color: #15803D; }
    .badge-released { background: #DCFCE7; color: #15803D; }
    .badge-rejected { background: #FEE2E2; color: #B91C1C; }
    .badge-open     { background: #FFF3CD; color: #B45309; }
    .badge-closed   { background: #DCFCE7; color: #15803D; }
    .badge-issued   { background: #DBEAFE; color: #1D4ED8; }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      white-space: nowrap;
      max-width: 88vw;
      text-align: center;
    }
    .toast.show    { opacity: 1; pointer-events: auto; }
    .toast.error   { background: var(--danger); }
    .toast.success { background: var(--success); }
  </style>
</head>
<body>

<div class="pm-header">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 20 20">
      <path d="M12 4l-6 6 6 6"/>
    </svg>
  </button>
  <span class="page-title">Records</span>
  <span class="doc-badge" id="totalBadge" style="display:none;"></span>
</div>

<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-type="GRN">GRN <span class="tab-count" id="cnt-GRN">—</span></button>
  <button class="tab-btn"        data-type="IQC">IQC <span class="tab-count" id="cnt-IQC">—</span></button>
  <button class="tab-btn"        data-type="IPQC">IPQC <span class="tab-count" id="cnt-IPQC">—</span></button>
  <button class="tab-btn"        data-type="OQC">OQC <span class="tab-count" id="cnt-OQC">—</span></button>
  <button class="tab-btn"        data-type="Gatepass">Gatepass <span class="tab-count" id="cnt-Gatepass">—</span></button>
</div>

<div class="rec-filter">
  <input type="date" id="fFrom" title="From date">
  <input type="date" id="fTo"   title="To date">
  <input type="search" id="fSearch" placeholder="Search doc no. or name…">
  <button class="btn-filter" id="btnFilter">Filter</button>
  <button class="btn-clear"  id="btnClear">Clear</button>
</div>

<div class="rec-list" id="recList">
  <div class="state-box">
    <span class="icon">⏳</span>
    <div class="msg">Loading records…</div>
  </div>
</div>

<div class="toast" id="pmToast"></div>

<script>
var sessionId   = sessionStorage.getItem('dwmSessionId') || '';
var currentTab  = 'GRN';
var searchTimer = null;

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('backBtn').addEventListener('click', function() {
    if (typeof goHome === 'function') goHome();
  });

  document.getElementById('btnFilter').addEventListener('click', loadList);

  document.getElementById('btnClear').addEventListener('click', function() {
    document.getElementById('fFrom').value   = '';
    document.getElementById('fTo').value     = '';
    document.getElementById('fSearch').value = '';
    loadList();
  });

  document.getElementById('fSearch').addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadList, 400);
  });

  document.getElementById('tabBar').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn || !btn.dataset.type) return;
    switchTab(btn.dataset.type);
  });

  document.getElementById('recList').addEventListener('click', function(e) {
    var card = e.target.closest('.rec-card');
    if (!card) return;
    openRecord(card.dataset.docno);
  });

  loadCounts();
  loadList();
});

function switchTab(type) {
  if (type === currentTab) return;
  var prev = document.querySelector('#tabBar .tab-btn.active');
  if (prev) prev.classList.remove('active');
  var next = document.querySelector('#tabBar .tab-btn[data-type="' + type + '"]');
  if (next) next.classList.add('active');
  currentTab = type;
  loadList();
}

function loadCounts() {
  google.script.run
    .withSuccessHandler(function(counts) {
      if (!counts) return;
      setCount('GRN',      counts.grn);
      setCount('IQC',      counts.iqc);
      setCount('OQC',      counts.oqc);
      setCount('Gatepass', counts.gp);
      setCount('IPQC',     counts.ipqc);
    })
    .withFailureHandler(function() {})
    .getRecordsCounts();
}

function setCount(type, n) {
  var el = document.getElementById('cnt-' + type);
  if (el) el.textContent = (n !== undefined && n !== null) ? n : '—';
}

function loadList() {
  showLoading();
  var filters = {
    fromDate: document.getElementById('fFrom').value,
    toDate:   document.getElementById('fTo').value,
    search:   document.getElementById('fSearch').value.trim()
  };
  google.script.run
    .withSuccessHandler(renderList)
    .withFailureHandler(showError)
    .getRecordsList(currentTab, filters);
}

function showLoading() {
  document.getElementById('recList').innerHTML =
    '<div class="state-box"><span class="spinner"></span>' +
    '<div class="msg" style="margin-top:8px;">Loading…</div></div>';
  document.getElementById('totalBadge').style.display = 'none';
}

function showError(err) {
  document.getElementById('recList').innerHTML =
    '<div class="state-box"><span class="icon">⚠️</span>' +
    '<div class="msg">Could not load records</div>' +
    '<div class="sub">' + esc((err && err.message) || String(err)) + '</div></div>';
}

function renderList(rows) {
  var badge = document.getElementById('totalBadge');

  if (!rows || rows.length === 0) {
    document.getElementById('recList').innerHTML =
      '<div class="empty-state"><span class="icon">📭</span>' +
      '<div>No records found</div>' +
      '<div style="font-size:11px;margin-top:4px;">Try adjusting filters or date range</div></div>';
    badge.style.display = 'none';
    return;
  }

  badge.textContent = rows.length;
  badge.style.display = 'inline-block';

  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    html +=
      '<div class="rec-card" data-type="' + esc(currentTab) + '" data-docno="' + esc(r.docNo) + '">' +
        '<div class="rec-card-accent"></div>' +
        '<div class="rec-main">' +
          '<div class="rec-docno">' + esc(r.docNo) + '</div>' +
          '<div class="rec-meta">' + esc(r.date) + '</div>' +
          '<div class="rec-name">' + esc(r.name) + '</div>' +
        '</div>' +
        '<div class="rec-right">' +
          statusBadge(r.status) +
          '<span class="rec-chevron">›</span>' +
        '</div>' +
      '</div>';
  }

  document.getElementById('recList').innerHTML = html;
}

function statusBadge(status) {
  var s = (status || 'PENDING').toUpperCase();
  var cls = 'badge-pending';
  if      (s === 'ACCEPTED' || s === 'RELEASED' || s === 'PASS') cls = 'badge-accepted';
  else if (s === 'REJECTED' || s === 'FAIL')                      cls = 'badge-rejected';
  else if (s === 'HOLD')                                          cls = 'badge-hold';
  else if (s === 'OPEN')                                          cls = 'badge-open';
  else if (s === 'CLOSED')                                        cls = 'badge-closed';
  else if (s === 'ISSUED')                                        cls = 'badge-issued';
  return '<span class="badge ' + cls + '">' + esc(status || 'PENDING') + '</span>';
}

function openRecord(docNo) {
  if (currentTab === 'IPQC') {
    showToast('Document view not available for IPQC sessions.');
    return;
  }
  google.script.run
    .withSuccessHandler(function(html) {
      if (html) { document.open(); document.write(html); document.close(); }
    })
    .withFailureHandler(function(err) {
      showToast('Could not open record: ' + ((err && err.message) || String(err)), 'error');
    })
    .getDocViewHtml(currentTab, docNo);
}

function showToast(msg, type) {
  var t = document.getElementById('pmToast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._tmr);
  t._tmr = setTimeout(function() { t.className = 'toast'; }, 3000);
}

function esc(s) {
  if (!s && s !== 0) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>

</body>
</html>
