<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ── */
    .pm-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: var(--navy);
      display: flex;
      align-items: center;
      padding: 0 14px;
    }
    .pm-header .logo {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .pm-header .screen-label {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
    }
    .pm-header .role-chip {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      background: #fff;
      border-radius: 12px;
      padding: 3px 9px;
      white-space: nowrap;
    }

    /* ── Filter Bar ── */
    .filter-bar {
      position: sticky;
      top: 56px;
      z-index: 99;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px 8px;
    }
    .filter-bar .date-row {
      display: flex;
      gap: 4%;
      margin-bottom: 8px;
    }
    .filter-bar .date-field {
      flex: 0 0 48%;
    }
    .filter-bar label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 3px;
      letter-spacing: 0.5px;
    }
    .filter-bar input[type="date"],
    .filter-bar input[type="search"] {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--white);
      -webkit-appearance: none;
    }
    .filter-bar input[type="date"]:focus,
    .filter-bar input[type="search"]:focus {
      outline: none;
      border-color: var(--navy);
    }
    .filter-bar input[type="search"]::placeholder { color: var(--muted); }
    .search-wrap { position: relative; }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--muted);
      cursor: pointer;
      display: none;
      line-height: 1;
      padding: 2px;
    }

    /* ── Tab Bar ── */
    .tab-bar {
      position: sticky;
      top: calc(56px + 108px);
      z-index: 98;
      height: 44px;
      background: var(--navy-light);
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 44px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tab-btn.active {
      background: var(--white);
      color: var(--navy);
      font-weight: 700;
      border-bottom-color: var(--navy);
      border-radius: 4px 4px 0 0;
    }
    .tab-count {
      font-size: 10px;
      font-weight: 700;
      color: var(--navy);
      background: var(--navy-light);
      border-radius: 10px;
      padding: 1px 6px;
      min-width: 18px;
      text-align: center;
    }
    .tab-btn.active .tab-count {
      background: var(--border);
    }

    /* ── Content area ── */
    .content-area {
      padding: 10px;
    }

    /* ── Table section ── */
    .table-section {
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    thead tr {
      background: var(--navy-light);
    }
    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      text-transform: uppercase;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr.data-row {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    tbody tr.data-row:nth-child(even) { background: #FAFBFF; }
    tbody tr.data-row:nth-child(odd)  { background: var(--white); }
    tbody tr.data-row.fail-row  { background: #FEF2F2 !important; }
    tbody tr.data-row.pending-row { background: #FFFBEB !important; }
    tbody tr.data-row:active { background: var(--navy-light) !important; }
    td {
      padding: 8px 10px;
      vertical-align: middle;
      font-size: 12px;
      color: var(--text);
    }
    td.dt-cell .dt-date { font-size: 12px; font-weight: 600; display: block; }
    td.dt-cell .dt-time { font-size: 10px; color: var(--muted); display: block; margin-top: 1px; }

    /* Operator col hidden on mobile */
    .col-op { display: none; }
    @media (min-width: 600px) { .col-op { display: table-cell; } }

    /* ── Status chip ── */
    .chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .chip-pass, .chip-accepted { background: #DCFCE7; color: #15803D; }
    .chip-fail, .chip-rejected { background: #FEE2E2; color: #B91C1C; }
    .chip-pending, .chip-open  { background: #FEF9C3; color: #92400E; }
    .chip-issued               { background: #DBEAFE; color: #1E40AF; }
    .chip-default              { background: var(--navy-light); color: var(--navy); }

    /* ── Inline detail panel ── */
    tr.detail-row td {
      padding: 0;
      background: var(--navy-light);
    }
    .detail-inner {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.2s ease, opacity 0.2s ease;
    }
    .detail-inner.open {
      max-height: 500px;
      opacity: 1;
    }
    .detail-body {
      padding: 12px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }
    .detail-field label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--navy);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .detail-field span {
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
    }
    .detail-close {
      display: block;
      text-align: right;
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      cursor: pointer;
      margin-top: 8px;
    }

    /* ── Empty state ── */
    .empty-row td {
      text-align: center;
      padding: 32px 16px;
    }
    .empty-row .empty-main { font-size: 13px; color: var(--muted); }
    .empty-row .empty-sub  { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* ── Skeleton ── */
    @keyframes skeleton-pulse {
      0%   { opacity: 0.4; }
      50%  { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .skeleton-row td { padding: 10px; }
    .skel-bar {
      height: 16px;
      border-radius: 4px;
      background: var(--navy-light);
      animation: skeleton-pulse 0.8s ease-in-out infinite;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #B91C1C;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 200;
      cursor: pointer;
      display: none;
      white-space: nowrap;
    }
    .toast.show { display: block; }

    /* ── Loading dim ── */
    .table-loading { opacity: 0.5; pointer-events: none; transition: opacity 0.1s; }

    /* ── Fade in for new content ── */
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fade-in 0.2s ease forwards; }

    /* ── Desktop: filter bar rows inline ── */
    @media (min-width: 900px) {
      .filter-bar .date-row { margin-bottom: 0; flex: 1; }
      .filter-bar .filter-desktop-row {
        display: flex;
        align-items: flex-end;
        gap: 12px;
      }
      .filter-bar .search-wrap { flex: 1; }
    }
  </style>
</head>

<script>
(function() {
  'use strict';

  // ── XSS helper ──
  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ── State ──
  var state = {
    module: 'GRN',
    fromDate: '',
    toDate: '',
    search: '',
    openDocNo: null,
    requestId: 0
  };

  // ── Role chip ──
  var roleEl = document.getElementById('roleChip');
  if (roleEl) roleEl.style.display = 'none';

  // ── Logo → back to Landing ──
  document.getElementById('logoBtn').addEventListener('click', function() {
    google.script.run
      .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
      .withFailureHandler(function() {})
      .getFormHtml('Landing');
  });

  // ── Date defaults: 7 days ago → today ──
  function toYMD(d) {
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  var today = new Date();
  var weekAgo = new Date(today); weekAgo.setDate(today.getDate() - 7);
  var fromEl = document.getElementById('fromDate');
  var toEl   = document.getElementById('toDate');
  fromEl.value = toYMD(weekAgo);
  toEl.value   = toYMD(today);
  state.fromDate = fromEl.value;
  state.toDate   = toEl.value;

  // ── Date inputs ──
  fromEl.addEventListener('change', function() { state.fromDate = this.value; load(); });
  toEl.addEventListener('change',   function() { state.toDate   = this.value; load(); });

  // ── Search input with debounce ──
  var searchEl    = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var debTimer    = null;
  searchEl.addEventListener('input', function() {
    searchClear.style.display = this.value ? 'block' : 'none';
    clearTimeout(debTimer);
    debTimer = setTimeout(function() {
      state.search = searchEl.value.trim();
      load();
    }, 400);
  });
  searchClear.addEventListener('click', function() {
    searchEl.value = '';
    searchClear.style.display = 'none';
    state.search = '';
    load();
  });

  // ── Tab bar ──
  document.getElementById('tabBar').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    var mod = btn.getAttribute('data-module');
    if (mod === state.module) return;
    state.module = mod;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    state.openDocNo = null;
    load();
  });

  // ── Column definitions per module ──
  var COLS = {
    GRN:      ['Date', 'GRN ID', 'Supplier', 'Status', 'OP'],
    IQC:      ['Date', 'IQC ID', 'GRN · Material', 'Result', 'OP'],
    IPQC:     ['Date', 'IPQC ID', 'Product · Batch', 'Status', 'OP'],
    OQC:      ['Date', 'OQC ID', 'Customer', 'Result', 'OP'],
    Gatepass: ['Date', 'GP ID', 'Type · Party', 'Status', 'OP'],
    PO:       ['Date', 'PO No.', 'Supplier', 'Status', 'Total']
  };

  // ── Render table header ──
  function renderHead(module) {
    var cols = COLS[module] || COLS.GRN;
    var html = '<tr>';
    cols.forEach(function(c, i) {
      var cls = (i === 4) ? ' class="col-op"' : '';
      html += '<th' + cls + '>' + esc(c) + '</th>';
    });
    html += '</tr>';
    document.getElementById('tableHead').innerHTML = html;
  }

  // ── Status chip ──
  function chipHtml(status) {
    var s = (status || '').toUpperCase();
    var cls = 'chip-default';
    if (s === 'PASS' || s === 'ACCEPTED') cls = 'chip-pass';
    else if (s === 'FAIL' || s === 'REJECTED') cls = 'chip-fail';
    else if (s === 'PENDING' || s === 'OPEN') cls = 'chip-pending';
    else if (s === 'ISSUED') cls = 'chip-issued';
    return '<span class="chip ' + cls + '">' + esc(status || '—') + '</span>';
  }

  // ── Row class based on status ──
  function rowClass(status) {
    var s = (status || '').toUpperCase();
    if (s === 'FAIL' || s === 'REJECTED') return ' fail-row';
    if (s === 'PENDING' || s === 'OPEN')  return ' pending-row';
    return '';
  }

  // ── Parse date string into two lines ──
  function dtCell(dateStr) {
    // dateStr from backend: 'dd-MMM-yyyy' e.g. '14-Mar-2026'
    return '<td class="dt-cell">'
      + '<span class="dt-date">' + esc(dateStr || '—') + '</span>'
      + '</td>';
  }

  // ── Detail fields per record ──
  function detailFields(rec) {
    var fields = [];
    fields.push({ label: 'Doc No', value: rec.docNo });
    fields.push({ label: 'Date',   value: rec.date  });
    fields.push({ label: 'Name',   value: rec.name  });
    fields.push({ label: 'Status', value: rec.status });
    return fields;
  }

  // ── Detail row HTML ──
  function detailRowHtml(rec, colCount) {
    var flds = detailFields(rec);
    var gridHtml = flds.map(function(f) {
      return '<div class="detail-field"><label>' + esc(f.label) + '</label>'
           + '<span>' + esc(f.value) + '</span></div>';
    }).join('');
    return '<tr class="detail-row" data-detail="' + esc(rec.docNo) + '">'
         + '<td colspan="' + colCount + '">'
         + '<div class="detail-inner" id="di-' + esc(rec.docNo.replace(/[^a-zA-Z0-9]/g, '_')) + '">'
         + '<div class="detail-body">'
         + '<div class="detail-grid">' + gridHtml + '</div>'
         + '<span class="detail-close" data-closedoc="' + esc(rec.docNo) + '">Close ×</span>'
         + '</div></div></td></tr>';
  }

  // ── Skeleton rows ──
  function renderSkeleton() {
    var html = '';
    for (var i = 0; i < 8; i++) {
      html += '<tr class="skeleton-row"><td colspan="5"><div class="skel-bar"></div></td></tr>';
    }
    document.getElementById('tableBody').innerHTML = html;
  }

  // ── Render records ──
  function renderRecords(records) {
    var module = state.module;
    var tbody  = document.getElementById('tableBody');
    var colCount = 5;

    if (!records || records.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="' + colCount + '">'
        + '<div class="empty-main">No records match your search.</div>'
        + '<div class="empty-sub">Try adjusting the date range or clearing the search.</div>'
        + '</td></tr>';
      document.getElementById('tableSection').classList.remove('table-loading');
      return;
    }

    var html = '';
    records.forEach(function(rec) {
      var rc = rowClass(rec.status);
      var docSafe = esc(rec.docNo.replace(/[^a-zA-Z0-9]/g, '_'));
      html += '<tr class="data-row' + rc + ' fade-in" data-docno="' + esc(rec.docNo) + '">'
            + dtCell(rec.date)
            + '<td>' + esc(rec.docNo) + '</td>'
            + '<td>' + esc(rec.name)  + '</td>'
            + '<td>' + chipHtml(rec.status) + '</td>'
            + '<td class="col-op">—</td>'
            + '</tr>'
            + detailRowHtml(rec, colCount);
    });

    tbody.innerHTML = html;
    document.getElementById('tableSection').classList.remove('table-loading');

    // Re-attach row tap listeners
    attachRowTaps();

    // Restore open panel if same doc is still in results
    if (state.openDocNo) {
      var key = state.openDocNo.replace(/[^a-zA-Z0-9]/g, '_');
      var panel = document.getElementById('di-' + key);
      if (panel) panel.classList.add('open');
    }
  }

  // ── Row tap: open/close detail ──
  function attachRowTaps() {
    var tbody = document.getElementById('tableBody');

    if (tbody._tapsAttached) return;
    tbody._tapsAttached = true;
    tbody.addEventListener('click', function(e) {
      // Close button
      var closeBtn = e.target.closest('[data-closedoc]');
      if (closeBtn) {
        var docNo = closeBtn.getAttribute('data-closedoc');
        closeDetail(docNo);
        if (state.openDocNo === docNo) state.openDocNo = null;
        return;
      }

      // Data row tap
      var row = e.target.closest('tr.data-row');
      if (!row) return;
      var docNo = row.getAttribute('data-docno');
      if (!docNo) return;

      if (state.openDocNo === docNo) {
        closeDetail(docNo);
        state.openDocNo = null;
      } else {
        if (state.openDocNo) closeDetail(state.openDocNo);
        state.openDocNo = docNo;
        openDetail(docNo);
      }
    });
  }

  function openDetail(docNo) {
    var key   = docNo.replace(/[^a-zA-Z0-9]/g, '_');
    var panel = document.getElementById('di-' + key);
    if (panel) panel.classList.add('open');
  }

  function closeDetail(docNo) {
    var key   = docNo.replace(/[^a-zA-Z0-9]/g, '_');
    var panel = document.getElementById('di-' + key);
    if (panel) panel.classList.remove('open');
  }

  // ── Toast ──
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
  }
  function hideToast() {
    document.getElementById('toast').classList.remove('show');
  }
  document.getElementById('toast').addEventListener('click', function() {
    hideToast();
    load();
  });

  // ── Main load ──
  function load() {
    hideToast();
    state.openDocNo = null;
    var reqId = ++state.requestId;

    var filters = {
      fromDate: state.fromDate,
      toDate:   state.toDate,
      search:   state.search
    };

    // Dim existing content or show skeleton on first load
    var tbody = document.getElementById('tableBody');
    if (tbody.children.length === 0 || tbody.querySelector('.skeleton-row')) {
      renderHead(state.module);
      renderSkeleton();
    } else {
      document.getElementById('tableSection').classList.add('table-loading');
    }

    // PO tab: use getRecentPOs and render differently
    if (state.module === 'PO') {
      google.script.run
        .withSuccessHandler(function(poList) {
          if (reqId !== state.requestId) return;
          renderHead('PO');
          renderPOList(poList || []);
        })
        .withFailureHandler(function(err) {
          if (reqId !== state.requestId) return;
          document.getElementById('tableSection').classList.remove('table-loading');
          showToast('Could not load PO records. Tap to retry.');
        })
        .getRecentPOs(200);
      return;
    }

    google.script.run
      .withSuccessHandler(function(records) {
        if (reqId !== state.requestId) return; // stale
        renderHead(state.module);
        renderRecords(records);
      })
      .withFailureHandler(function(err) {
        if (reqId !== state.requestId) return;
        document.getElementById('tableSection').classList.remove('table-loading');
        showToast('Could not load records. Tap to retry.');
      })
      .getRecordsList(state.module, filters);
  }

  // ── PO list renderer ──
  function fmtInr(n) { return 'INR ' + Number(n || 0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }

  function poStatusChip(st) {
    var cls = 'chip-default';
    if (st === 'OPEN' || st === 'PARTIAL_RECEIVED') cls = 'chip-pending';
    else if (st === 'CLOSED') cls = 'chip-pass';
    else if (st === 'CANCELLED') cls = 'chip-fail';
    return '<span class="chip ' + cls + '">' + esc(st || '—') + '</span>';
  }

  function renderPOList(poList) {
    var tbody = document.getElementById('tableBody');
    var cntEl = document.getElementById('cnt-PO');
    if (cntEl) cntEl.textContent = poList.length;

    // Filter by search / date
    var from = state.fromDate ? new Date(state.fromDate) : null;
    var to   = state.toDate   ? new Date(state.toDate + 'T23:59:59') : null;
    var srch = (state.search || '').toLowerCase();

    var filtered = poList.filter(function(po) {
      if (from || to) {
        var d = po.date ? new Date(po.date) : null;
        if (d) {
          if (from && d < from) return false;
          if (to   && d > to)   return false;
        }
      }
      if (srch) {
        var hay = (po.poNo + ' ' + po.supplierName + ' ' + po.supplierCode + ' ' + po.status).toLowerCase();
        if (hay.indexOf(srch) === -1) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5"><div class="empty-main">No PO records match.</div><div class="empty-sub">Adjust filters or create a new PO.</div></td></tr>';
      document.getElementById('tableSection').classList.remove('table-loading');
      return;
    }

    var html = '';
    filtered.forEach(function(po) {
      var rc = po.status === 'PARTIAL_RECEIVED' || po.status === 'OPEN' ? ' pending-row' : po.status === 'CANCELLED' ? ' fail-row' : '';
      html += '<tr class="data-row' + rc + ' fade-in po-row" data-pono="' + esc(po.poNo) + '">' +
        dtCell(po.date) +
        '<td>' + esc(po.poNo) + '</td>' +
        '<td>' + esc(po.supplierName || po.supplierCode) + '</td>' +
        '<td>' + poStatusChip(po.status) + '</td>' +
        '<td style="font-size:11px;font-weight:600;">' + fmtInr(po.grandTotal) + '</td>' +
        '</tr>';
    });
    tbody.innerHTML = html;
    document.getElementById('tableSection').classList.remove('table-loading');

    // Row click → open PO detail modal
    tbody.removeEventListener('click', handlePORowClick);
    tbody.addEventListener('click', handlePORowClick);
  }

  function handlePORowClick(e) {
    var row = e.target.closest('tr.po-row');
    if (!row) return;
    var poNo = row.getAttribute('data-pono');
    if (!poNo) return;
    openPODetail(poNo);
  }

  function openPODetail(poNo) {
    var modal = document.getElementById('poDetailModal');
    var content = document.getElementById('poDetailContent');
    var title   = document.getElementById('poModalTitle');
    title.textContent = 'Loading ' + poNo + '…';
    content.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">Loading…</p>';
    modal.style.display = 'block';

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result) { content.innerHTML = '<p style="color:#c62828;">PO not found.</p>'; return; }
        renderPODetail(result);
      })
      .withFailureHandler(function(e) {
        content.innerHTML = '<p style="color:#c62828;">Error: ' + esc(e.message) + '</p>';
      })
      .getPOById(poNo);
  }

  function renderPODetail(result) {
    var h = result.header;
    var title = document.getElementById('poModalTitle');
    title.textContent = h.poNo + ' — ' + h.supplierName;

    var html = '';
    // Status row + action buttons
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">';
    html += poStatusChip(h.status);
    html += '<span style="font-size:11px;color:#777;margin-left:4px;">Due: ' + esc(h.dueDate || '—') + '</span>';
    html += '<span style="flex:1;"></span>';
    // Cancel button: visible for any active status. Server enforces the
    // "has receipts" guard and returns the specific GRN docNo blocking cancel.
    if (h.status !== 'CANCELLED' && h.status !== 'CLOSED') {
      html += '<button onclick="doCancelPO(\'' + esc(h.poNo) + '\')" style="background:#c62828;color:#fff;border:none;padding:6px 12px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;">Cancel PO</button>';
    }
    // Edit-as-draft: not implemented yet (would need getPOById wire-up + form pre-fill).
    // Plan §5 says edit-as-draft re-opens POP_F with draft loaded; deferred to polish bundle.
    html += '</div>';

    // Header fields
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">';
    var hdrFields = [
      ['PO Date', h.poDate], ['Supplier', h.supplierName],
      ['Currency', h.currency], ['GST %', h.gstPct + '%'],
      ['Payment Terms', h.paymentTerms || '—'], ['Sub Total', fmtInr(h.subTotal)],
      ['GST Amount', fmtInr(h.gstAmount)], ['Grand Total', fmtInr(h.grandTotal)],
      ['Created By', h.createdBy], ['Created At', h.createdAt]
    ];
    if (h.cancelledReason) hdrFields.push(['Cancelled Reason', h.cancelledReason]);
    hdrFields.forEach(function(f) {
      html += '<div><div style="font-size:10px;font-weight:600;color:#0D1B6E;text-transform:uppercase;margin-bottom:2px;">' + esc(f[0]) + '</div>';
      html += '<div style="font-size:12px;">' + esc(f[1] || '—') + '</div></div>';
    });
    html += '</div>';

    // Lines
    html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#0D1B6E;margin-bottom:6px;">Lines</div>';
    html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:11px;">';
    html += '<thead><tr style="background:#f0f0f5;">';
    ['#','Material','Qty Ord','Qty Rcvd','Qty Pend','Unit Price','Status','Promised'].forEach(function(c) {
      html += '<th style="padding:5px 7px;text-align:left;font-size:10px;text-transform:uppercase;">' + esc(c) + '</th>';
    });
    html += '</tr></thead><tbody>';
    (result.lines || []).forEach(function(l) {
      html += '<tr style="border-bottom:1px solid #f0f0f0;">' +
        '<td style="padding:4px 7px;">' + l.lineNo + '</td>' +
        '<td style="padding:4px 7px;">' + esc(l.materialCode) + '<br><span style="color:#999;font-size:10px;">' + esc(l.materialDesc) + '</span></td>' +
        '<td style="padding:4px 7px;">' + l.qtyOrdered + ' ' + esc(l.unit) + '</td>' +
        '<td style="padding:4px 7px;">' + l.qtyReceived + '</td>' +
        '<td style="padding:4px 7px;font-weight:' + (l.qtyPending > 0 ? '700' : '400') + ';color:' + (l.qtyPending > 0 ? '#c65c00' : '#555') + ';">' + l.qtyPending + '</td>' +
        '<td style="padding:4px 7px;">INR ' + Number(l.unitPrice).toFixed(2) + '</td>' +
        '<td style="padding:4px 7px;">' + poStatusChip(l.lineStatus) + '</td>' +
        '<td style="padding:4px 7px;color:#777;">' + esc(l.promisedDate || '—') + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';

    // Linked GRNs
    if (result.linkedGrns && result.linkedGrns.length > 0) {
      html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#0D1B6E;margin:12px 0 6px;">Linked GRNs</div>';
      html += '<div style="font-size:12px;">';
      result.linkedGrns.forEach(function(g) {
        html += '<span style="display:inline-block;background:#e8f0fe;color:#0D1B6E;padding:3px 8px;border-radius:10px;margin:2px;font-weight:600;">' + esc(g.grnNo) + ' (' + esc(g.date) + ')</span>';
      });
      html += '</div>';
    }

    document.getElementById('poDetailContent').innerHTML = html;
  }

  window.doCancelPO = function(poNo) {
    var reason = prompt('Reason for cancellation:');
    if (reason === null) return;
    google.script.run
      .withSuccessHandler(function(r) {
        if (r.success) { document.getElementById('poDetailModal').style.display='none'; load(); }
        else alert('Cancel failed: ' + r.error);
      })
      .withFailureHandler(function(e) { alert('Error: ' + e.message); })
      .cancelPO(poNo, reason);
  };

  window.openPOForm = function() {
    google.script.run
      .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
      .getFormHtml('PO');
  };

  // ── Load counts ──
  function loadCounts() {
    google.script.run
      .withSuccessHandler(function(counts) {
        if (!counts) return;
        var map = { GRN: counts.grn, IQC: counts.iqc, IPQC: counts.ipqc, OQC: counts.oqc, Gatepass: counts.gp };
        Object.keys(map).forEach(function(mod) {
          var el = document.getElementById('cnt-' + mod);
          if (el && map[mod] != null) el.textContent = map[mod];
        });
      })
      .withFailureHandler(function() {})
      .getRecordsCounts();
    // PO count from getRecentPOs
    google.script.run
      .withSuccessHandler(function(poList) {
        var el = document.getElementById('cnt-PO');
        if (el && poList) el.textContent = poList.length;
      })
      .withFailureHandler(function() {})
      .getRecentPOs(500);
  }

  // ── URL param pre-population (MUST-FIX #4) ──
  // KPI dashboard routes here with ?type=&from=&to=&supplier=&dispoFilter=&filter=
  // Supports both location.search (web-app) and location.hash (iframe fallback).
  function setFiltersFromURL_() {
    try {
      var raw = '';
      if (window.location && window.location.search && window.location.search.length > 1) {
        raw = window.location.search;
      } else if (window.location && window.location.hash && window.location.hash.indexOf('?') >= 0) {
        raw = '?' + window.location.hash.split('?')[1];
      }
      if (!raw || raw.length < 2) return;
      var params = new URLSearchParams(raw);

      // type → switch tab
      var type = params.get('type');
      if (type) {
        // Map sheet names → tab module names
        var typeMap = {
          'NCR_LOG':             'NCR',
          'CUSTOMER_RETURN_LOG': 'CustomerReturn',
          'GRN_LOG':             'GRN',
          'IQC_LOG':             'IQC',
          'OQC_LOG':             'OQC',
          'GATEPASS_LOG':        'Gatepass'
        };
        var mod = typeMap[type] || type;
        // Find matching tab button
        var tabBtn = document.querySelector('.tab-btn[data-module="' + mod + '"]');
        if (!tabBtn) {
          // Try direct match (e.g. type=NCR)
          tabBtn = document.querySelector('.tab-btn[data-module="' + type + '"]');
        }
        if (tabBtn && mod !== state.module) {
          document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
          tabBtn.classList.add('active');
          state.module = tabBtn.getAttribute('data-module');
        }
      }

      // from / to dates
      var from = params.get('from');
      var to   = params.get('to');
      if (from) { fromEl.value = from; state.fromDate = from; }
      if (to)   { toEl.value   = to;   state.toDate   = to;   }

      // supplier → append to search
      var supplier = params.get('supplier');
      if (supplier) {
        searchEl.value = supplier;
        searchClear.style.display = 'block';
        state.search = supplier;
      }

      // dispoFilter → append to search if no supplier
      var dispoFilter = params.get('dispoFilter');
      if (dispoFilter && !supplier) {
        searchEl.value = dispoFilter;
        searchClear.style.display = 'block';
        state.search = dispoFilter;
      }

      // generic filter (e.g. filter=poNo:X)
      var filter = params.get('filter');
      if (filter && !supplier && !dispoFilter) {
        // Strip "poNo:" prefix for plain search
        var filterVal = filter.indexOf(':') >= 0 ? filter.split(':')[1] : filter;
        searchEl.value = filterVal;
        searchClear.style.display = 'block';
        state.search = filterVal;
      }
    } catch(e) {
      // URL parsing errors must never break the page
    }
  }

  setFiltersFromURL_();

  // ── Init ──
  renderHead(state.module);
  renderSkeleton();
  load();
  loadCounts();

})();
</script>
</body>
</html>
