  <style>
    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      background: var(--white);
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      flex: 1;
      min-width: 64px;
      padding: 10px 6px 8px;
      border: none;
      border-bottom: 3px solid transparent;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: var(--navy);
      border-bottom-color: var(--amber);
    }
    .tab-count {
      display: inline-block;
      background: var(--border);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
      line-height: 1.4;
    }
    .tab-btn.active .tab-count {
      background: var(--amber);
      color: var(--navy);
    }

    /* ── Filter bar (records page) ── */
    .rec-filter {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      padding: 8px 12px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }
    .rec-filter input[type="date"],
    .rec-filter input[type="search"] {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      -webkit-appearance: none;
    }
    .rec-filter input[type="date"] { width: 130px; }
    .rec-filter input[type="search"] { flex: 1; min-width: 120px; }
    .rec-filter input:focus { outline: none; border-color: var(--navy); }
    .rec-filter .btn-filter {
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .rec-filter .btn-clear {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── Record list ── */
    .rec-list {
      padding: 8px 10px 80px;
    }
    .rec-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 12px;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.12s, box-shadow 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .rec-card:hover  { border-color: var(--navy); box-shadow: var(--shadow); }
    .rec-card:active { background: #F0F4FF; }

    .rec-main { flex: 1; min-width: 0; }
    .rec-docno {
      font-size: 13px;
      font-weight: 700;

      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-name {
      font-size: 12px;
      color: var(--text);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .rec-chevron { font-size: 18px; color: var(--muted); }

    /* ── Status badge overrides ── */
    .badge-accepted  { background: #DCFCE7; color: #15803D; }
    .badge-released  { background: #DCFCE7; color: #15803D; }
    .badge-rejected  { background: #FEE2E2; color: #B91C1C; }
    .badge-hold      { background: #FEF3C7; color: #B45309; }
    .badge-pending   { background: #F3F4F6; color: #6B7280; }
    .badge-pass      { background: #DCFCE7; color: #15803D; }

    .badge-open      { background: #FFF3CD; color: #B45309; }
    .badge-closed    { background: #E8F5E9; color: #16A34A; }

    /* ── Loading / Empty states ── */
    .state-box {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .state-box .icon { font-size: 40px; display: block; margin-bottom: 10px; }
    .state-box .msg  { font-size: 13px; font-weight: 500; }
    .state-box .sub  { font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>

<!-- Header -->
<div class="pm-header">
  <a onclick="goHome()" style="color:rgba(255,255,255,0.7);font-size:20px;cursor:pointer;margin-right:4px;text-decoration:none;line-height:1;">‹</a>
  <span class="logo-text">📋 Records</span>
  <span class="doc-badge" id="totalBadge" style="display:none;">0</span>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-GRN"      onclick="switchTab('GRN')">GRN <span class="tab-count" id="cnt-GRN">—</span></button>
  <button class="tab-btn"        id="tab-IQC"      onclick="switchTab('IQC')">IQC <span class="tab-count" id="cnt-IQC">—</span></button>
  <button class="tab-btn"        id="tab-OQC"      onclick="switchTab('OQC')">OQC <span class="tab-count" id="cnt-OQC">—</span></button>
  <button class="tab-btn"        id="tab-Gatepass" onclick="switchTab('Gatepass')">Gatepass <span class="tab-count" id="cnt-Gatepass">—</span></button>
  <button class="tab-btn"        id="tab-IPQC"     onclick="switchTab('IPQC')">IPQC <span class="tab-count" id="cnt-IPQC">—</span></button>
</div>

<!-- Filter bar -->
<div class="rec-filter">
  <input type="date" id="fFrom" placeholder="From" title="From date">
  <input type="date" id="fTo"   placeholder="To"   title="To date">
  <input type="search" id="fSearch" placeholder="Search doc no. or name…" oninput="onSearchInput()">
  <button class="btn-filter" onclick="loadList()">Filter</button>
  <button class="btn-clear"  onclick="clearFilters()">Clear</button>
</div>

<!-- Record list -->
<div class="rec-list" id="recList">
  <div class="state-box">
    <span class="icon">⏳</span>
    <div class="msg">Loading records…</div>
  </div>
</div>

<script>
  var currentTab = 'GRN';
  var searchTimer = null;

  // ── Initialise ──────────────────────────────────────────────
  window.onload = function() {
    loadCounts();
    loadList();
  };

  // ── Tab switching ────────────────────────────────────────────
  function switchTab(type) {
    if (type === currentTab) return;
    document.getElementById('tab-' + currentTab).classList.remove('active');
    currentTab = type;
    document.getElementById('tab-' + type).classList.add('active');
    loadList();
  }

  // ── Debounced search ─────────────────────────────────────────
  function onSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadList, 400);
  }

  // ── Clear filters ────────────────────────────────────────────
  function clearFilters() {
    document.getElementById('fFrom').value = '';
    document.getElementById('fTo').value   = '';
    document.getElementById('fSearch').value = '';
    loadList();
  }

  // ── Load counts for all tabs ─────────────────────────────────
  function loadCounts() {
    google.script.run
      .withSuccessHandler(function(counts) {
        if (!counts) return;
        setCount('GRN',      counts.grn);
        setCount('IQC',      counts.iqc);
        setCount('OQC',      counts.oqc);
        setCount('Gatepass', counts.gp);
        setCount('IPQC',     counts.ipqc);
      })
      .withFailureHandler(function() {})
      .getRecordsCounts();
  }

  function setCount(type, n) {
    var el = document.getElementById('cnt-' + type);
    if (el) el.textContent = (n !== undefined && n !== null) ? n : '—';
  }

  // ── Load list for current tab ────────────────────────────────
  function loadList() {
    showLoading();
    var filters = {
      fromDate: document.getElementById('fFrom').value,
      toDate:   document.getElementById('fTo').value,
      search:   document.getElementById('fSearch').value.trim()
    };
    google.script.run
      .withSuccessHandler(renderList)
      .withFailureHandler(showError)
      .getRecordsList(currentTab, filters);
  }

  function showLoading() {
    document.getElementById('recList').innerHTML =
      '<div class="state-box"><span class="spinner"></span><div class="msg" style="margin-top:8px;">Loading…</div></div>';
    document.getElementById('totalBadge').style.display = 'none';
  }

  function showError(err) {
    document.getElementById('recList').innerHTML =
      '<div class="state-box"><span class="icon">⚠️</span>' +
      '<div class="msg">Could not load records</div>' +
      '<div class="sub">' + (err && err.message ? err.message : String(err)) + '</div></div>';
  }

  // ── Render list of records ───────────────────────────────────
  function renderList(rows) {
    var badge = document.getElementById('totalBadge');

    if (!rows || rows.length === 0) {
      document.getElementById('recList').innerHTML =
        '<div class="state-box"><span class="icon">📭</span>' +
        '<div class="msg">No records found</div>' +
        '<div class="sub">Try adjusting your filters or date range</div></div>';
      badge.style.display = 'none';
      return;
    }

    badge.textContent = rows.length;
    badge.style.display = 'inline-block';

    var html = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += '<div class="rec-card" onclick="openRecord(\'' + esc(r.docNo) + '\')">' +
        '<div class="rec-main">' +
          '<div class="rec-docno">' + esc(r.docNo) + '</div>' +
          '<div class="rec-meta">' + esc(r.date) + '</div>' +
          '<div class="rec-name">' + esc(r.name) + '</div>' +
        '</div>' +
        '<div class="rec-right">' +
          statusBadge(r.status) +
          '<span class="rec-chevron">›</span>' +
        '</div>' +
      '</div>';
    }

    document.getElementById('recList').innerHTML = html;
  }

  // ── Status badge ─────────────────────────────────────────────
  function statusBadge(status) {
    var s = (status || 'PENDING').toUpperCase();
    var cls = 'badge-pending';
    if (s === 'ACCEPTED' || s === 'RELEASED' || s === 'PASS')  cls = 'badge-accepted';
    else if (s === 'REJECTED' || s === 'FAIL')                 cls = 'badge-rejected';
    else if (s === 'HOLD')                                     cls = 'badge-hold';
    else if (s === 'OPEN')                                     cls = 'badge-open';
    else if (s === 'CLOSED')                                   cls = 'badge-closed';
    return '<span class="badge ' + cls + '">' + s + '</span>';
  }

  // ── Open a record ────────────────────────────────────────────
  function openRecord(docNo) {
    if (currentTab === 'IPQC') {
      showToast('Document view not available for IPQC sessions.');
      return;
    }
    google.script.run
      .withSuccessHandler(function(html) {
        if (html) {
          document.open();
          document.write(html);
          document.close();
        }
      })
      .withFailureHandler(function(err) {
        alert('Could not open record: ' + (err && err.message ? err.message : String(err)));
      })
      .getDocViewHtml(currentTab, docNo);
  }

  // ── Toast notification ───────────────────────────────────────
  function showToast(msg, duration) {
    var t = document.getElementById('pmToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'pmToast';
      t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);' +
        'background:rgba(30,41,59,0.92);color:#fff;padding:10px 18px;border-radius:8px;' +
        'font-size:13px;font-family:inherit;z-index:9999;pointer-events:none;' +
        'opacity:0;transition:opacity 0.2s;max-width:88vw;text-align:center;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._tmr);
    t._tmr = setTimeout(function() { t.style.opacity = '0'; }, duration || 3000);
  }

  // ── Utility: HTML-escape ─────────────────────────────────────
  function esc(s) {
    if (!s && s !== 0) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>

</body>
</html>
