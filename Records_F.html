  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Tab bar sticky below header (top: 56px from Theme) ── */
    /* Tab bar z-index: 90, filter bar z-index: 85 */

    /* ── Filter bar ── */
    .rec-filter {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      padding: 8px 12px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 103px; /* 56px header + 47px tab-bar */
      z-index: 85;
    }
    .rec-filter input[type="date"],
    .rec-filter input[type="search"] {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      -webkit-appearance: none;
    }
    .rec-filter input[type="date"]   { width: 130px; }
    .rec-filter input[type="search"] { flex: 1; min-width: 120px; }
    .rec-filter input:focus { outline: none; border-color: var(--navy); }
    .rec-filter .btn-filter {
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .rec-filter .btn-clear {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── Record list ── */
    .rec-list {
      padding: 8px 10px 80px;
    }

    /* ── Record card ── */
    .rec-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--navy);
      border-radius: var(--radius);
      padding: 11px 12px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.12s, box-shadow 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .rec-card:hover  { border-color: var(--navy); box-shadow: var(--shadow-1); }
    .rec-card:active { background: #F0F4FF; }

    /* Module accent colors — left border */
    .rec-card[data-type="GRN"]      { border-left-color: #1D4ED8; }
    .rec-card[data-type="IQC"]      { border-left-color: #0D1B6E; }
    .rec-card[data-type="OQC"]      { border-left-color: #BE185D; }
    .rec-card[data-type="IPQC"]     { border-left-color: #D97706; }
    .rec-card[data-type="Gatepass"] { border-left-color: #059669; }

    .rec-main { flex: 1; min-width: 0; }
    .rec-docno {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .rec-name {
      font-size: 12px;
      color: var(--text);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .rec-chevron { font-size: 18px; color: var(--muted); }

    /* ── Loading / empty states ── */
    .state-box {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);

    .state-box .icon { font-size: 40px; display: block; margin-bottom: 10px; }
    .state-box .msg  { font-size: 13px; font-weight: 500; }
    .state-box .sub  { font-size: 11px; margin-top: 4px; }

    /* ── Status badge overrides ── */
    .badge-accepted { background: #DCFCE7; color: #15803D; }
    .badge-released { background: #DCFCE7; color: #15803D; }
    .badge-rejected { background: #FEE2E2; color: #B91C1C; }
    .badge-hold     { background: #FEF3C7; color: #B45309; }
    .badge-pending  { background: #F3F4F6; color: #6B7280; }
    .badge-pass     { background: #DCFCE7; color: #15803D; }
    .badge-fail     { background: #FEE2E2; color: #B91C1C; }
    .badge-open     { background: #FFF3CD; color: #B45309; }
    .badge-closed   { background: #DCFCE7; color: #15803D; }
    .badge-issued   { background: #DBEAFE; color: #1D4ED8; }
  </style>
</head>
<body>

<!-- Header -->
<div class="pm-header">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4l-6 6 6 6"/>
    </svg>
  </button>
  <span class="page-title">Records</span>
  <span class="doc-badge" id="totalBadge" style="display:none;"></span>
</div>

<!-- Module tab bar (sticky at top:56px from Theme) -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-GRN"      data-type="GRN">GRN <span class="tab-count" id="cnt-GRN">—</span></button>
  <button class="tab-btn"        id="tab-IQC"      data-type="IQC">IQC <span class="tab-count" id="cnt-IQC">—</span></button>
  <button class="tab-btn"        id="tab-IPQC"     data-type="IPQC">IPQC <span class="tab-count" id="cnt-IPQC">—</span></button>
  <button class="tab-btn"        id="tab-OQC"      data-type="OQC">OQC <span class="tab-count" id="cnt-OQC">—</span></button>
  <button class="tab-btn"        id="tab-Gatepass" data-type="Gatepass">Gatepass <span class="tab-count" id="cnt-Gatepass">—</span></button>
</div>

<!-- Filter bar -->
<div class="rec-filter">
  <input type="date" id="fFrom" title="From date">
  <input type="date" id="fTo"   title="To date">
  <input type="search" id="fSearch" placeholder="Search doc no. or name…">
  <button class="btn-filter" id="btnFilter">Filter</button>
  <button class="btn-clear"  id="btnClear">Clear</button>
</div>

<!-- Record list -->
<div class="rec-list" id="recList">
  <div class="state-box">
    <span class="icon">⏳</span>
    <div class="msg">Loading records…</div>
  </div>
</div>

<script>
// ── Session bridge ────────────────────────────────────────
var sessionId = sessionStorage.getItem('dwmSessionId') || '';

// ── State ─────────────────────────────────────────────────
var currentTab  = 'GRN';
var searchTimer = null;

// ── Init ──────────────────────────────────────────────────
document.getElementById('backBtn').addEventListener('click', function() {
  if (typeof goHome === 'function') goHome();
});
document.getElementById('btnFilter').addEventListener('click', loadList);
document.getElementById('btnClear').addEventListener('click', clearFilters);
document.getElementById('fSearch').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadList, 400);
});

// Tab delegation
document.querySelector('.tab-bar').addEventListener('click', function(e) {
  var btn = e.target.closest('.tab-btn');
  if (!btn || !btn.dataset.type) return;
  switchTab(btn.dataset.type);
});

window.addEventListener('load', function() {
  loadCounts();
  loadList();
});

// ── Tab switch ────────────────────────────────────────────
function switchTab(type) {
  if (type === currentTab) return;
  document.getElementById('tab-' + currentTab).classList.remove('active');
  currentTab = type;
  document.getElementById('tab-' + type).classList.add('active');
  loadList();
}

// ── Clear filters ─────────────────────────────────────────
function clearFilters() {
  document.getElementById('fFrom').value   = '';
  document.getElementById('fTo').value     = '';
  document.getElementById('fSearch').value = '';
  loadList();
}

// ── Tab counts ────────────────────────────────────────────
function loadCounts() {
  google.script.run
    .withSuccessHandler(function(counts) {
      if (!counts) return;
      setCount('GRN',      counts.grn);
      setCount('IQC',      counts.iqc);
      setCount('OQC',      counts.oqc);
      setCount('Gatepass', counts.gp);
      setCount('IPQC',     counts.ipqc);
    })
    .withFailureHandler(function() {})
    .getRecordsCounts();
}

function setCount(type, n) {
  var el = document.getElementById('cnt-' + type);
  if (el) el.textContent = (n !== undefined && n !== null) ? n : '—';
}

// ── Load list ─────────────────────────────────────────────
function loadList() {
  showLoading();
  var filters = {
    fromDate: document.getElementById('fFrom').value,
    toDate:   document.getElementById('fTo').value,
    search:   document.getElementById('fSearch').value.trim()
  };
  google.script.run
    .withSuccessHandler(renderList)
    .withFailureHandler(showError)
    .getRecordsList(currentTab, filters);
}

function showLoading() {
  document.getElementById('recList').innerHTML =
    '<div class="state-box"><span class="spinner"></span>' +
    '<div class="msg" style="margin-top:8px;">Loading…</div></div>';
  document.getElementById('totalBadge').style.display = 'none';
}

function showError(err) {
  document.getElementById('recList').innerHTML =
    '<div class="state-box"><span class="icon">⚠️</span>' +
    '<div class="msg">Could not load records</div>' +
    '<div class="sub">' + esc((err && err.message) || String(err)) + '</div></div>';
}

// ── Render list ───────────────────────────────────────────
function renderList(rows) {
  var badge = document.getElementById('totalBadge');

  if (!rows || rows.length === 0) {
    document.getElementById('recList').innerHTML =
      '<div class="state-box"><span class="icon">📭</span>' +
      '<div class="msg">No records found</div>' +
      '<div class="sub">Try adjusting filters or date range</div></div>';
    badge.style.display = 'none';
    return;
  }

  badge.textContent = rows.length;
  badge.style.display = 'inline-block';

  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    html +=
      '<div class="rec-card" data-type="' + esc(currentTab) + '" data-docno="' + esc(r.docNo) + '">' +
        '<div class="rec-main">' +
          '<div class="rec-docno">' + esc(r.docNo) + '</div>' +
          '<div class="rec-meta">' + esc(r.date) + '</div>' +
          '<div class="rec-name">' + esc(r.name) + '</div>' +
        '</div>' +
        '<div class="rec-right">' +
          statusBadge(r.status) +
          '<span class="rec-chevron">›</span>' +
        '</div>' +
      '</div>';
  }

  document.getElementById('recList').innerHTML = html;

  // Event delegation — open record on tap
  document.getElementById('recList').addEventListener('click', function(e) {
    var card = e.target.closest('.rec-card');
    if (!card) return;
    openRecord(card.dataset.docno);
  });
}

// ── Status badge ──────────────────────────────────────────
function statusBadge(status) {
  var s = (status || 'PENDING').toUpperCase();
  var cls = 'badge-pending';
  if      (s === 'ACCEPTED' || s === 'RELEASED' || s === 'PASS') cls = 'badge-accepted';
  else if (s === 'REJECTED' || s === 'FAIL')                      cls = 'badge-rejected';
  else if (s === 'HOLD')                                          cls = 'badge-hold';
  else if (s === 'OPEN')                                          cls = 'badge-open';
  else if (s === 'CLOSED')                                        cls = 'badge-closed';
  else if (s === 'ISSUED')                                        cls = 'badge-issued';
  return '<span class="badge ' + cls + '">' + esc(status || 'PENDING') + '</span>';
}

// ── Open record (document view) ───────────────────────────
function openRecord(docNo) {
  if (currentTab === 'IPQC') {
    showToast('Document view not available for IPQC sessions.');
    return;
  }
  google.script.run
    .withSuccessHandler(function(html) {
      if (html) { document.open(); document.write(html); document.close(); }
    })
    .withFailureHandler(function(err) {
      showToast('Could not open record: ' + ((err && err.message) || String(err)), 'error');
    })
    .getDocViewHtml(currentTab, docNo);
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg, type) {
  var t = document.getElementById('pmToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'pmToast';
    t.style.cssText =
      'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);' +
      'background:rgba(30,41,59,0.92);color:#fff;padding:10px 18px;border-radius:8px;' +
      'font-size:13px;font-family:inherit;z-index:9999;pointer-events:none;' +
      'opacity:0;transition:opacity 0.2s;max-width:88vw;text-align:center;';
    document.body.appendChild(t);
  }
  if (type === 'error') t.style.background = '#DC2626';
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._tmr);
  t._tmr = setTimeout(function() { t.style.opacity = '0'; }, 3000);
}

// ── HTML escape ───────────────────────────────────────────
function esc(s) {
  if (!s && s !== 0) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>

</body>
</html>
