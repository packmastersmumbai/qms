  <style>
    * { box-sizing: border-box; }
    html, body {
      overflow-x: hidden;
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
      color: #0f172a;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
    }
    body { min-height: max(884px, 100dvh); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Search input ── */
    .search-wrap { position: relative; }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #94a3b8;
      cursor: pointer;
      display: none;
      line-height: 1;
    }

    /* ── Status chip ── */
    .chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }
    .chip-pass, .chip-accepted    { background: #16a34a; color: #fff; }
    .chip-fail, .chip-rejected    { background: #dc2626; color: #fff; }
    .chip-pending, .chip-open     { background: #d97706; color: #fff; }
    .chip-issued                  { background: #2563eb; color: #fff; }
    .chip-default                 { background: #0D1B6E; color: #fff; }

    /* ── Card row status (DESIGN.md: 3px left bar via pseudo so the 12px
       border-radius doesn't soften the signal). The card itself keeps a
       single 1px hairline; the bar sits flush at x=0. ── */
    .rec-card { position: relative; }
    .rec-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: transparent;
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }
    .rec-card.card-fail::before    { background: #dc2626; }
    .rec-card.card-pending::before { background: #d97706; }
    .rec-card.card-pass::before    { background: #16a34a; }
    .rec-card.card-prog::before    { background: #2563eb; }

    /* ── Tab pills (legacy class .tab-btn lived on the row buttons here.
       Theme.html owns a .tab-btn for in-page tab bars; scope ours so the
       Theme version doesn't bleed in.) ── */
    #tabBar .tab-btn { font-family: 'Inter', sans-serif; }
    #tabBar .tab-btn.is-active {
      background: #0D1B6E !important;
      color: #fff !important;
      border-color: #0D1B6E !important;
    }
    #tabBar .tab-btn.is-active .tab-count { background: rgba(255,255,255,0.22); color: #fff; }
    .tab-count {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 6px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px; font-weight: 700;
      background: #EEF1FA;
      color: #0D1B6E;
      min-width: 18px; text-align: center;
    }
    .tab-count.is-loading {
      background: #e2e8f0;
      color: transparent;
      animation: skeleton-pulse 1s ease-in-out infinite;
    }

    /* ── Custom date expander ── */
    .date-expander {
      max-height: 0;
      overflow: hidden;
      transition: max-height .2s ease;
    }
    .date-expander.is-open { max-height: 90px; }

    /* ── Detail panel ── */
    .detail-inner {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.25s ease, opacity 0.2s ease;
    }
    .detail-inner.open {
      max-height: 600px;
      opacity: 1;
    }

    /* ── Skeleton pulse ── */
    @keyframes skeleton-pulse {
      0%   { opacity: 0.35; }
      50%  { opacity: 0.8; }
      100% { opacity: 0.35; }
    }
    .skel-bar {
      height: 14px;
      border-radius: 6px;
      background: #e2e8f0;
      animation: skeleton-pulse 1s ease-in-out infinite;
    }

    /* ── Fade in ── */
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fade-in 0.2s ease forwards; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc2626;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 500;
      cursor: pointer;
      display: none;
      white-space: nowrap;
    }
    .toast.show { display: block; }

    /* ── Table loading dim ── */
    .table-loading { opacity: 0.45; pointer-events: none; transition: opacity 0.1s; }

<script>
(function() {
  'use strict';

  // ── XSS helper ──
  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ── State ──
  // Read optional module filter + auto-open docNo + period/pendingOnly hints set by Landing
  var _initialModule = 'ALL';
  var _autoOpenDocNo = null;
  var _initialPeriod = null;
  var _initialPendingOnly = false;
  try {
    var pmf = sessionStorage.getItem('pmRecordsFilter');
    if (pmf) {
      _initialModule = pmf;
      sessionStorage.removeItem('pmRecordsFilter');
    }
    var pmd = sessionStorage.getItem('pmRecordsOpen');
    if (pmd) {
      _autoOpenDocNo = pmd;
      sessionStorage.removeItem('pmRecordsOpen');
    }
    var pmp = sessionStorage.getItem('pmRecordsPeriod');
    if (pmp) {
      _initialPeriod = pmp;
      sessionStorage.removeItem('pmRecordsPeriod');
    }
    var pmpo = sessionStorage.getItem('pmRecordsPendingOnly');
    if (pmpo) {
      _initialPendingOnly = true;
      sessionStorage.removeItem('pmRecordsPendingOnly');
    }
  } catch (e) {}
  var state = {
    module: _initialModule,
    fromDate: '',
    toDate: '',
    search: '',
    openDocNo: _autoOpenDocNo,
    requestId: 0
  };

  // ── Role chip (hidden until populated) ──
  var roleEl = document.getElementById('roleChip');
  if (roleEl) roleEl.classList.add('hidden');

  // ── Logo / back → Landing (uses PMHtmlCache for instant nav when cached) ──
  function goLanding() {
    if (window.PMHtmlCache) { window.PMHtmlCache.navigate('Landing'); return; }
    google.script.run
      .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
      .withFailureHandler(function() {})
      .getFormHtml('Landing');
  }
  document.getElementById('logoBtn').addEventListener('click', goLanding);
  document.getElementById('logoBtnText').addEventListener('click', goLanding);
  document.getElementById('navHome').addEventListener('click', goLanding);

  // Bottom-nav routes
  function gotoForm(name) {
    if (window.PMHtmlCache) { window.PMHtmlCache.navigate(name); return; }
    google.script.run
      .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
      .withFailureHandler(function() {})
      .getFormHtml(name);
  }
  function bindNav(id, target) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', function() { gotoForm(target); });
  }
  bindNav('navKPI',     'KPI');
  bindNav('navMasters', 'Masters');

  // More menu
  var navMoreBtn = document.getElementById('navMore');
  if (navMoreBtn) {
    navMoreBtn.addEventListener('click', function() {
      var existing = document.getElementById('recMoreSheet');
      if (existing) { existing.remove(); return; }
      var items = [
        { label: 'Warehouse',       form: 'Warehouse' },
        { label: 'Customer Return', form: 'CustomerReturn' },
        { label: 'Dispatch',        form: 'Dispatch' },
        { label: 'Import CSV',      form: 'ImportCSV' }
      ];
      var html = items.map(function(i) {
        return '<button class="recMoreItem" data-form="' + i.form + '" style="width:100%;display:block;padding:14px 16px;font-size:14px;font-weight:600;color:#0f172a;background:transparent;border:0;border-bottom:1px solid #e2e8f0;text-align:left;cursor:pointer;font-family:inherit;">' + i.label + '</button>';
      }).join('');
      var sheet = document.createElement('div');
      sheet.id = 'recMoreSheet';
      sheet.style.cssText = 'position:fixed;inset:0;z-index:9998;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,58,95,0.55);';
      sheet.innerHTML = '<div style="background:#fff;width:100%;max-width:600px;border-radius:14px 14px 0 0;overflow:hidden;">' +
        '<div style="padding:12px 14px;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1.4px;border-bottom:1px solid #e2e8f0;">More modules</div>' +
        html + '</div>';
      sheet.addEventListener('click', function(e) {
        if (e.target === sheet) { sheet.remove(); return; }
        var b = e.target.closest('.recMoreItem');
        if (b) { var f = b.getAttribute('data-form'); sheet.remove(); gotoForm(f); }
      });
      document.body.appendChild(sheet);
    });
  }

  // ── Date defaults: 7 days ago → today ──
  function toYMD(d) {
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  var today   = new Date();
  var weekAgo = new Date(today); weekAgo.setDate(today.getDate() - 7);
  var fromEl  = document.getElementById('fromDate');
  var toEl    = document.getElementById('toDate');
  fromEl.value = toYMD(weekAgo);
  toEl.value   = toYMD(today);
  state.fromDate = fromEl.value;
  state.toDate   = toEl.value;

  fromEl.addEventListener('change', function() { state.fromDate = this.value; clearTimePill(); load(); });
  toEl.addEventListener('change',   function() { state.toDate   = this.value; clearTimePill(); load(); });

  function clearTimePill() {
    document.querySelectorAll('.time-pill').forEach(function(b) {
      b.className = 'time-pill h-[28px] px-4 rounded-full text-[12px] font-semibold border border-[#e2e8f0] bg-white text-[#64748b] hover:border-[#0D1B6E] hover:text-[#0D1B6E] transition-all whitespace-nowrap active:scale-95';
    });
  }

  function setTimePeriod(period) {
    var now = new Date();
    var from, to;
    to = toYMD(now);
    if (period === 'TODAY') {
      from = to;
    } else if (period === 'WEEK') {
      var w = new Date(now); w.setDate(now.getDate() - 7);
      from = toYMD(w);
    } else if (period === 'MONTH') {
      var m = new Date(now); m.setDate(now.getDate() - 30);
      from = toYMD(m);
    } else {
      from = '2020-01-01';
      to   = toYMD(now);
    }
    fromEl.value = from; state.fromDate = from;
    toEl.value   = to;   state.toDate   = to;
    document.querySelectorAll('.time-pill').forEach(function(b) {
      var isActive = b.dataset.period === period;
      b.className = 'time-pill h-[28px] px-4 rounded-full text-[12px] font-semibold border transition-all whitespace-nowrap active:scale-95 ' +
        (isActive ? 'border-[#0D1B6E] bg-[#0D1B6E] text-white' : 'border-[#e2e8f0] bg-white text-[#64748b] hover:border-[#0D1B6E] hover:text-[#0D1B6E]');
    });
    load();
  }

  // ── Search with debounce ──
  var searchEl    = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var debTimer    = null;
  searchEl.addEventListener('input', function() {
    searchClear.style.display = this.value ? 'block' : 'none';
    clearTimeout(debTimer);
    debTimer = setTimeout(function() {
      state.search = searchEl.value.trim();
      load();
    }, 400);
  });
  searchClear.addEventListener('click', function() {
    searchEl.value = '';
    searchClear.style.display = 'none';
    state.search = '';
    load();
  });

  // ── Tab bar (single .is-active class; CSS in <style> owns the look) ──
  function setActiveTab(mod) {
    var all = document.querySelectorAll('#tabBar .tab-btn');
    var hit = null;
    all.forEach(function(b) {
      if (b.getAttribute('data-module') === mod) { b.classList.add('is-active'); hit = b; }
      else                                        { b.classList.remove('is-active'); }
    });
    if (hit) setTimeout(function () { hit.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }, 60);
  }
  document.getElementById('tabBar').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    var mod = btn.getAttribute('data-module');
    if (mod === state.module) return;
    state.module = mod;
    setActiveTab(mod);
    state.openDocNo = null;
    load();
  });
  // Apply initial active tab if Landing passed a module filter
  setActiveTab(state.module);

  // ── Custom date expander ──
  window.toggleCustomDate = function () {
    var el = document.getElementById('customDate');
    var btn = document.getElementById('customDateBtn');
    if (!el || !btn) return;
    var open = el.classList.toggle('is-open');
    if (open) { btn.style.background = '#0D1B6E'; btn.style.color = '#fff'; btn.style.borderColor = '#0D1B6E'; }
    else      { btn.style.background = '#fff';    btn.style.color = '#6B7280'; btn.style.borderColor = '#e2e8f0'; }
    syncMainOffset();
  };

  // Keep main content's top padding in sync with the actual sticky strip
  // height (filter strip can grow when the custom-date drawer opens).
  function syncMainOffset() {
    var strip = document.getElementById('filterStrip');
    var main  = document.getElementById('mainContent');
    if (!strip || !main) return;
    // 56px top bar + strip height + 8px breathing room.
    var h = 56 + strip.offsetHeight + 8;
    main.style.paddingTop = h + 'px';
  }
  window.addEventListener('resize', syncMainOffset);
  // Run after first paint and after fonts load (icon font shifts row heights).
  setTimeout(syncMainOffset, 0);
  setTimeout(syncMainOffset, 300);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncMainOffset);

  // ── Status chip HTML ──
  function chipHtml(status) {
    var s = (status || '').toUpperCase();
    var cls = 'chip-default';
    if (s === 'PASS' || s === 'ACCEPTED')  cls = 'chip-pass';
    else if (s === 'FAIL' || s === 'REJECTED') cls = 'chip-fail';
    else if (s.indexOf('PENDING') !== -1 || s === 'OPEN')  cls = 'chip-pending'; // matches 'IQC PENDING' etc.
    else if (s === 'ISSUED')               cls = 'chip-issued';
    return '<span class="chip ' + cls + '">' + esc(status || '—') + '</span>';
  }

  // ── PO status chip ──
  function poStatusChip(st) {
    var cls = 'chip-default';
    if (st === 'OPEN' || st === 'PARTIAL_RECEIVED') cls = 'chip-pending';
    else if (st === 'CLOSED')     cls = 'chip-pass';
    else if (st === 'CANCELLED')  cls = 'chip-fail';
    return '<span class="chip ' + cls + '">' + esc(st || '—') + '</span>';
  }

  // ── Module label badge color per module (fix #72) ──
  function moduleColor(module) {
    var m = (module || '').toUpperCase();
    if (m === 'GRN') return '#0d9488';
    if (m === 'IQC') return '#2563eb';
    if (m === 'IPQC') return '#7c3aed';
    if (m === 'OQC') return '#9333ea';
    if (m === 'NCR') return '#dc2626';
    if (m === 'GATEPASS' || m === 'GP') return '#64748b';
    if (m === 'PO') return '#0ea5e9';
    return '#0D1B6E';
  }

  // ── Status bar class (via ::before, see .rec-card in <style>) ──
  function cardExtraClass(status) {
    var s = (status || '').toUpperCase();
    if (s === 'FAIL' || s === 'REJECTED' || s === 'CANCELLED')        return 'card-fail';
    if (s === 'PASS' || s === 'ACCEPTED' || s === 'RELEASED' ||
        s === 'CLOSED' || s === 'DELIVERED' || s === 'PRODUCED')      return 'card-pass';
    if (s === 'IN_PROGRESS' || s === 'ISSUED')                        return 'card-prog';
    if (s.indexOf('PENDING') !== -1 || s === 'OPEN' || s === 'PARTIAL_RECEIVED' || s.indexOf('HOLD') !== -1) return 'card-pending';
    return '';
  }

  // ── Skeleton cards ──
  function renderSkeleton() {
    var html = '';
    for (var i = 0; i < 6; i++) {
      html += '<div class="bg-white rounded-[12px] p-[16px] border border-[#e2e8f0] shadow-[0_2px_8px_rgba(0,0,0,0.07)]">'
            + '<div class="skel-bar mb-3 w-2/3"></div>'
            + '<div class="skel-bar mb-2 w-1/2" style="height:10px;"></div>'
            + '<div class="skel-bar w-1/3" style="height:10px;"></div>'
            + '</div>';
    }
    document.getElementById('cardList').innerHTML = html;
    document.getElementById('recordCountLabel').textContent = '';
  }

  // ── Detail fields ──
  function detailFields(rec) {
    return [
      { label: 'Doc No', value: rec.docNo },
      { label: 'Date',   value: rec.date  },
      { label: 'Name',   value: rec.name  },
      { label: 'Status', value: rec.status }
    ];
  }

  // ── Render records as cards ──
  function renderRecords(records) {
    var module  = state.module;
    var cardList = document.getElementById('cardList');
    var countLbl = document.getElementById('recordCountLabel');
    document.getElementById('mainContent').classList.remove('table-loading');

    // Filter to pending only if Landing requested it
    if (state.pendingOnly && records && records.length) {
      records = records.filter(function(r){
        var s = String(r.status || '').toUpperCase().trim();
        // "Pending" = anything that's not a terminal/passed state
        if (s === '') return true;
        if (s === 'ACCEPTED' || s === 'PASS' || s === 'PASSED') return false;
        if (s === 'RELEASED' || s === 'COMPLETE' || s === 'COMPLETED' || s === 'CLOSED') return false;
        if (s === 'DELIVERED' || s === 'PRODUCED') return false;
        if (s === 'REJECTED' || s === 'FAIL' || s === 'FAILED' || s === 'CANCELLED') return false;
        return true;
      });
    }

    if (!records || records.length === 0) {
      // Distinguish "no records ever" vs "no matches under current filter".
      var hasAnyFilter =
        (state.searchQuery && state.searchQuery.trim() !== '') ||
        (state.fromDate && state.fromDate !== '') ||
        (state.toDate && state.toDate !== '') ||
        (state.period && state.period !== 'ALL') ||
        (state.pendingOnly === true);
      var moduleLabel = state.module === 'ALL' ? 'records' : state.module + ' records';
      var headline, hint, action;
      if (hasAnyFilter) {
        headline = 'No ' + moduleLabel + ' match the current filter.';
        hint     = 'Try TODAY/WEEK/MONTH/ALL, widen the date range, or clear search.';
        action   = '<button onclick="clearAllFilters()" class="mt-3 h-[36px] px-4 rounded-[8px] bg-[#0D1B6E] text-white text-[12px] font-semibold active:scale-95">Clear filters</button>';
      } else {
        headline = 'No ' + moduleLabel + ' yet.';
        hint     = (state.module === 'ALL')
          ? 'Records will appear here once any module starts capturing data.'
          : 'Open the ' + state.module + ' form from Home to create the first record.';
        action   = '';
      }
      cardList.innerHTML =
        '<div class="bg-white rounded-[12px] p-8 border border-[#e2e8f0] shadow-[0_2px_8px_rgba(0,0,0,0.07)] text-center">'
        + '<span class="material-symbols-outlined text-[40px] text-[#cbd5e1] block mb-3" style="font-variation-settings:\'FILL\' 0;">inbox</span>'
        + '<p class="font-body text-[14px] font-semibold text-[#0F172A]">' + esc(headline) + '</p>'
        + '<p class="font-body text-[12px] text-[#6B7280] mt-1">' + esc(hint) + '</p>'
        + action
        + '</div>';
      countLbl.textContent = '';
      return;
    }

    countLbl.textContent = 'Showing ' + records.length + ' record' + (records.length !== 1 ? 's' : '');

    var html = '';
    var lastDate = '';
    records.forEach(function(rec) {
      var dateKey = rec.date || '';
      if (dateKey && dateKey !== lastDate) {
        html += '<div class="sticky top-0 z-10 bg-[#f8fafc]/90 backdrop-blur px-1 py-2 text-[11px] font-bold text-[#64748b] uppercase tracking-widest">' + esc(dateKey) + '</div>';
        lastDate = dateKey;
      }
      var borderCls = cardExtraClass(rec.status);
      var recType = rec.type || module;
      html += '<div class="rec-card bg-white rounded-[12px] border border-[#e2e8f0] shadow-[0_2px_8px_rgba(0,0,0,0.07)] overflow-hidden fade-in ' + borderCls + '">'
            + '<div class="p-[16px] cursor-pointer active:bg-gray-50 transition-colors data-row" '
            +      'data-docno="' + esc(rec.docNo) + '" data-rectype="' + esc(recType) + '">'
            +   '<div class="flex justify-between items-start mb-1.5">'
            +     '<h2 class="font-headline text-[14px] font-bold text-[#0D1B6E]">' + esc(rec.docNo) + '</h2>'
            +     '<div class="flex gap-2 items-center">'
            +       '<span style="background:' + moduleColor(recType) + ';color:#fff;" class="px-2 py-0.5 rounded-[4px] font-label text-[10px] font-bold tracking-wider">' + esc(recType) + '</span>'
            +       chipHtml(rec.status)
            +     '</div>'
            +   '</div>'
            +   '<div class="flex justify-between items-end">'
            +     '<p class="font-body text-[13px] font-medium text-[#374151] truncate pr-4">' + esc(rec.name) + '</p>'
            +     '<div class="flex items-center gap-1 shrink-0">'
            +       '<span class="font-body text-[11px] text-[#64748b]">' + esc(rec.date || '—') + '</span>'
            +       '<span class="material-symbols-outlined text-[16px] text-[#94a3b8]">chevron_right</span>'
            +     '</div>'
            +   '</div>'
            + '</div>'
            + '</div>';
    });

    cardList.innerHTML = html;
    attachRowTaps();

    // Auto-open requested doc: route straight to DocView_F
    if (state.openDocNo) {
      var pendingDoc = state.openDocNo;
      state.openDocNo = null;  // clear so we don't loop
      var card = document.querySelector('[data-docno="' + pendingDoc + '"]');
      var recType = card ? card.getAttribute('data-rectype') : (state.module !== 'ALL' ? state.module : '');
      if (card) setTimeout(function () { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
      openDoc(recType, pendingDoc);
    }
  }

  // ── Row taps (delegated on cardList) — open DocView directly ──
  function attachRowTaps() {
    var list = document.getElementById('cardList');
    if (list._tapsAttached) return;
    list._tapsAttached = true;
    list.addEventListener('click', function(e) {
      var row = e.target.closest('.data-row');
      if (!row) return;
      var docNo = row.getAttribute('data-docno');
      if (!docNo) return;
      var recType = row.getAttribute('data-rectype') || (state.module !== 'ALL' ? state.module : '');
      openDoc(recType, docNo);
    });
  }

  /* Navigate to the document detail page */
  var DOCVIEW_TYPES = { GRN: 1, IQC: 1, OQC: 1, Gatepass: 1, PO: 1 };
  function openDoc(type, docNo) {
    if (!docNo) return;
    if (DOCVIEW_TYPES[type]) {
      google.script.run
        .withSuccessHandler(function (html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function (e) { showToast('Could not open ' + docNo); })
        .getDocViewHtml(type, docNo);
    } else {
      // NCR / IPQC / CustomerReturn — open the module form. These forms read
      // sessionStorage.pmAutoOpenDoc on boot and auto-expand the matching
      // record detail sheet (see NCR_F.html maybeAutoOpen pattern).
      try { sessionStorage.setItem('pmAutoOpenDoc', docNo); } catch (e) {}
      google.script.run
        .withSuccessHandler(function (html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function (e) { showToast('Could not open ' + type); })
        .getFormHtml(type);
    }
  }

  // ── Toast ──
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
  }
  function hideToast() {
    document.getElementById('toast').classList.remove('show');
  }
  document.getElementById('toast').addEventListener('click', function() { hideToast(); load(); });

  // ── INR formatter ──
  function fmtInr(n) {
    return 'INR ' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // ── PO list renderer ──
  function renderPOList(poList) {
    var cardList = document.getElementById('cardList');
    var countLbl = document.getElementById('recordCountLabel');
    document.getElementById('mainContent').classList.remove('table-loading');
    var cntEl = document.getElementById('cnt-PO');
    if (cntEl) cntEl.textContent = poList.length;

    // Client-side filter by date / search
    var from = state.fromDate ? new Date(state.fromDate) : null;
    var to   = state.toDate   ? new Date(state.toDate + 'T23:59:59') : null;
    var srch = (state.search || '').toLowerCase();

    var filtered = poList.filter(function(po) {
      if (from || to) {
        var d = po.date ? new Date(po.date) : null;
        if (d) {
          if (from && d < from) return false;
          if (to   && d > to)   return false;
        }
      }
      if (srch) {
        var hay = (po.poNo + ' ' + po.supplierName + ' ' + po.supplierCode + ' ' + po.status).toLowerCase();
        if (hay.indexOf(srch) === -1) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      cardList.innerHTML =
        '<div class="bg-white rounded-[12px] p-8 border border-[#e2e8f0] shadow-[0_2px_8px_rgba(0,0,0,0.07)] text-center">'
        + '<p class="font-body text-[14px] text-[#64748b]">No PO records match.</p>'
        + '<p class="font-body text-[12px] text-[#94a3b8] mt-1">Adjust filters or create a new PO.</p>'
        + '</div>';
      countLbl.textContent = '';
      return;
    }

    countLbl.textContent = 'Showing ' + filtered.length + ' PO' + (filtered.length !== 1 ? 's' : '');

    var html = '';
    filtered.forEach(function(po) {
      var borderCls = cardExtraClass(po.status);
      html += '<div class="rec-card bg-white rounded-[12px] border border-[#e2e8f0] shadow-[0_2px_8px_rgba(0,0,0,0.07)] p-[16px] cursor-pointer active:bg-gray-50 transition-colors po-row fade-in ' + borderCls + '" data-pono="' + esc(po.poNo) + '">'
            +   '<div class="flex justify-between items-start mb-2">'
            +     '<h2 class="font-headline text-[14px] font-bold text-[#0D1B6E]">' + esc(po.poNo) + '</h2>'
            +     '<div class="flex gap-2 items-center">'
            +       '<span style="background:#0D1B6E;color:#fff;" class="px-2 py-0.5 rounded-[4px] font-label text-[10px] font-bold tracking-wider">PO</span>'
            +       poStatusChip(po.status)
            +     '</div>'
            +   '</div>'
            +   '<div class="flex justify-between items-end">'
            +     '<p class="font-body text-[14px] font-medium text-[#374151] truncate pr-4">' + esc(po.supplierName || po.supplierCode) + '</p>'
            +     '<span class="font-body text-[11px] font-semibold text-[#0f172a] shrink-0">' + fmtInr(po.grandTotal) + '</span>'
            +   '</div>'
            +   '<div class="mt-1 font-body text-[12px] text-[#64748b]">' + esc(po.date || '—') + '</div>'
            + '</div>';
    });
    cardList.innerHTML = html;

    // PO row → modal
    cardList.removeEventListener('click', handlePORowClick);
    cardList.addEventListener('click', handlePORowClick);
  }

  function handlePORowClick(e) {
    var row = e.target.closest('tr.po-row, div.po-row');
    if (!row) return;
    var poNo = row.getAttribute('data-pono');
    if (!poNo) return;
    openPODetail(poNo);
  }

  function openPODetail(poNo) {
    var modal   = document.getElementById('poDetailModal');
    var content = document.getElementById('poDetailContent');
    var title   = document.getElementById('poModalTitle');
    title.textContent = 'Loading ' + poNo + '…';
    content.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:24px 0;">Loading…</p>';
    modal.style.display = 'block';

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result) { content.innerHTML = '<p style="color:#dc2626;">PO not found.</p>'; return; }
        renderPODetail(result);
      })
      .withFailureHandler(function(e) {
        content.innerHTML = '<p style="color:#dc2626;">Error: ' + esc(e.message) + '</p>';
      })
      .getPOById(poNo);
  }

  function renderPODetail(result) {
    var h     = result.header;
    var title = document.getElementById('poModalTitle');
    title.textContent = h.poNo + ' — ' + h.supplierName;

    var html = '';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">';
    html += poStatusChip(h.status);
    html += '<span style="font-size:11px;color:#64748b;margin-left:4px;">Due: ' + esc(h.dueDate || '—') + '</span>';
    html += '<span style="flex:1;"></span>';
    if (h.status !== 'CANCELLED' && h.status !== 'CLOSED') {
      html += '<button onclick="doCancelPO(\'' + esc(h.poNo) + '\')" style="background:#dc2626;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">Cancel PO</button>';
    }
    html += '</div>';

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">';
    var hdrFields = [
      ['PO Date', h.poDate], ['Supplier', h.supplierName],
      ['Currency', h.currency], ['GST %', h.gstPct + '%'],
      ['Payment Terms', h.paymentTerms || '—'], ['Sub Total', fmtInr(h.subTotal)],
      ['GST Amount', fmtInr(h.gstAmount)], ['Grand Total', fmtInr(h.grandTotal)],
      ['Created By', h.createdBy], ['Created At', h.createdAt]
    ];
    if (h.cancelledReason) hdrFields.push(['Cancelled Reason', h.cancelledReason]);
    hdrFields.forEach(function(f) {
      html += '<div><div style="font-size:10px;font-weight:600;color:#0D1B6E;text-transform:uppercase;margin-bottom:2px;">' + esc(f[0]) + '</div>';
      html += '<div style="font-size:12px;">' + esc(f[1] || '—') + '</div></div>';
    });
    html += '</div>';

    html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#0D1B6E;margin-bottom:6px;">Lines</div>';
    html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:11px;">';
    html += '<thead><tr style="background:#f0f4f8;">';
    ['#','Material','Qty Ord','Qty Rcvd','Qty Pend','Unit Price','Status','Promised'].forEach(function(c) {
      html += '<th style="padding:5px 7px;text-align:left;font-size:10px;text-transform:uppercase;color:#0D1B6E;">' + esc(c) + '</th>';
    });
    html += '</tr></thead><tbody>';
    (result.lines || []).forEach(function(l) {
      html += '<tr style="border-bottom:1px solid #f0f0f0;">'
        + '<td style="padding:4px 7px;">' + l.lineNo + '</td>'
        + '<td style="padding:4px 7px;">' + esc(l.materialCode) + '<br><span style="color:#94a3b8;font-size:10px;">' + esc(l.materialDesc) + '</span></td>'
        + '<td style="padding:4px 7px;">' + l.qtyOrdered + ' ' + esc(l.unit) + '</td>'
        + '<td style="padding:4px 7px;">' + l.qtyReceived + '</td>'
        + '<td style="padding:4px 7px;font-weight:' + (l.qtyPending > 0 ? '700' : '400') + ';color:' + (l.qtyPending > 0 ? '#d97706' : '#64748b') + ';">' + l.qtyPending + '</td>'
        + '<td style="padding:4px 7px;">INR ' + Number(l.unitPrice).toFixed(2) + '</td>'
        + '<td style="padding:4px 7px;">' + poStatusChip(l.lineStatus) + '</td>'
        + '<td style="padding:4px 7px;color:#94a3b8;">' + esc(l.promisedDate || '—') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';

    if (result.linkedGrns && result.linkedGrns.length > 0) {
      html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#0D1B6E;margin:12px 0 6px;">Linked GRNs</div>';
      html += '<div style="font-size:12px;">';
      result.linkedGrns.forEach(function(g) {
        html += '<span style="display:inline-block;background:#e0f2fe;color:#0D1B6E;padding:3px 8px;border-radius:8px;margin:2px;font-weight:600;">' + esc(g.grnNo) + ' (' + esc(g.date) + ')</span>';
      });
      html += '</div>';
    }

    document.getElementById('poDetailContent').innerHTML = html;
  }

  window.doCancelPO = function(poNo) {
    var reason = prompt('Reason for cancellation:');
    if (reason === null) return;
    google.script.run
      .withSuccessHandler(function(r) {
        if (r.success) { document.getElementById('poDetailModal').style.display = 'none'; load(); }
        else alert('Cancel failed: ' + r.error);
      })
      .withFailureHandler(function(e) { alert('Error: ' + e.message); })
      .cancelPO(poNo, reason);
  };

  window.openPOForm = function() {
    google.script.run
      .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
      .getFormHtml('PO');
  };

  // ── Load counts ──
  // Tab counts now reflect PENDING (matches Landing tile semantics).
  function loadCounts() {
    google.script.run
      .withSuccessHandler(function(counts) {
        if (!counts) return;
        var map = { GRN: counts.grn, IQC: counts.iqc, IPQC: counts.ipqc, OQC: counts.oqc, Gatepass: counts.gp };
        Object.keys(map).forEach(function(mod) {
          var el = document.getElementById('cnt-' + mod);
          if (el && map[mod] != null) { el.textContent = map[mod]; el.classList.remove('is-loading'); }
        });
        // ALL = sum of all pending
        var allEl = document.getElementById('cnt-ALL');
        if (allEl) {
          var sum = (counts.grn||0)+(counts.iqc||0)+(counts.ipqc||0)+(counts.oqc||0)+(counts.gp||0);
          allEl.textContent = sum;
          allEl.classList.remove('is-loading');
        }
      })
      .withFailureHandler(function() {})
      .getRecordsCounts();
    // PO pending count (separate server call to keep it cheap)
    google.script.run
      .withSuccessHandler(function(payload) {
        var el = document.getElementById('cnt-PO');
        if (el && payload && payload.PO != null) { el.textContent = payload.PO; el.classList.remove('is-loading'); }
      })
      .withFailureHandler(function() {
        // Fallback to old behavior — total recent POs
        google.script.run
          .withSuccessHandler(function(poList) {
            var el = document.getElementById('cnt-PO');
            if (el && poList) { el.textContent = poList.length; el.classList.remove('is-loading'); }
          })
          .withFailureHandler(function() {})
          .getRecentPOs(500);
      })
      .getPendingCountsJSON();
  }

  // ── Filter reset (used by empty-state action button) ──
  window.clearAllFilters = function () {
    state.searchQuery = '';
    state.fromDate = '';
    state.toDate = '';
    state.period = 'ALL';
    state.pendingOnly = false;
    var s = document.getElementById('searchInput'); if (s) s.value = '';
    var f = document.getElementById('fromDate');    if (f) f.value = '';
    var t = document.getElementById('toDate');      if (t) t.value = '';
    var sc = document.getElementById('searchClear');if (sc) sc.style.display = 'none';
    document.querySelectorAll('.time-pill').forEach(function(b){
      var on = b.getAttribute('data-period') === 'ALL';
      b.classList.toggle('bg-[#0D1B6E]', on);
      b.classList.toggle('text-white', on);
      b.classList.toggle('border-[#0D1B6E]', on);
      b.classList.toggle('bg-white', !on);
      b.classList.toggle('text-[#6B7280]', !on);
      b.classList.toggle('border-[#e2e8f0]', !on);
    });
    load();
  };

  // ── URL param pre-population ──
  function setFiltersFromURL_() {
    try {
      var raw = '';
      if (window.location && window.location.search && window.location.search.length > 1) {
        raw = window.location.search;
      } else if (window.location && window.location.hash && window.location.hash.indexOf('?') >= 0) {
        raw = '?' + window.location.hash.split('?')[1];
      }
      if (!raw || raw.length < 2) return;
      var params = new URLSearchParams(raw);

      var type = params.get('type');
      if (type) {
        var typeMap = {
          'NCR_LOG':             'NCR',
          'CUSTOMER_RETURN_LOG': 'CustomerReturn',
          'GRN_LOG':             'GRN',
          'IQC_LOG':             'IQC',
          'OQC_LOG':             'OQC',
          'GATEPASS_LOG':        'Gatepass'
        };
        var mod = typeMap[type] || type;
        var tabBtn = document.querySelector('.tab-btn[data-module="' + mod + '"]');
        if (!tabBtn) tabBtn = document.querySelector('.tab-btn[data-module="' + type + '"]');
        if (tabBtn && mod !== state.module) {
          state.module = tabBtn.getAttribute('data-module');
          setActiveTab(state.module);
        }
      }

      var from = params.get('from');
      var to   = params.get('to');
      if (from) { fromEl.value = from; state.fromDate = from; }
      if (to)   { toEl.value   = to;   state.toDate   = to;   }

      var supplier = params.get('supplier');
      if (supplier) {
        searchEl.value = supplier;
        searchClear.style.display = 'block';
        state.search = supplier;
      }

      var dispoFilter = params.get('dispoFilter');
      if (dispoFilter && !supplier) {
        searchEl.value = dispoFilter;
        searchClear.style.display = 'block';
        state.search = dispoFilter;
      }

      var filter = params.get('filter');
      if (filter && !supplier && !dispoFilter) {
        var filterVal = filter.indexOf(':') >= 0 ? filter.split(':')[1] : filter;
        searchEl.value = filterVal;
        searchClear.style.display = 'block';
        state.search = filterVal;
      }
    } catch(e) {
      // URL parsing errors must never break the page
    }
  }

  // ── Main load ──
  function load() {
    hideToast();
    // Preserve auto-open docNo on first load; clear only on subsequent loads
    if (load._hasRun) state.openDocNo = null;
    load._hasRun = true;
    var reqId = ++state.requestId;

    var filters = {
      fromDate: state.fromDate,
      toDate:   state.toDate,
      search:   state.search
    };

    var cardList = document.getElementById('cardList');
    if (cardList.children.length === 0) {
      renderSkeleton();
    } else {
      document.getElementById('mainContent').classList.add('table-loading');
    }

    if (state.module === 'PO') {
      google.script.run
        .withSuccessHandler(function(poList) {
          if (reqId !== state.requestId) return;
          renderPOList(poList || []);
        })
        .withFailureHandler(function(err) {
          if (reqId !== state.requestId) return;
          document.getElementById('mainContent').classList.remove('table-loading');
          showToast('Could not load PO records. Tap to retry.');
        })
        .getRecentPOs(200);
      return;
    }

    google.script.run
      .withSuccessHandler(function(records) {
        if (reqId !== state.requestId) return;
        renderRecords(records);
      })
      .withFailureHandler(function(err) {
        if (reqId !== state.requestId) return;
        document.getElementById('mainContent').classList.remove('table-loading');
        showToast('Could not load records. Tap to retry.');
      })
      .getRecordsList(state.module, filters);
  }

  // ── Init ──
  setFiltersFromURL_();
  // Apply period hint from Landing (so tile→Records shows ALL not MONTH)
  if (_initialPeriod && typeof setTimePeriod === 'function') {
    try { setTimePeriod(_initialPeriod); } catch(e) {}
  }
  // Pending-only hint: store on state; backend filtering will be applied client-side at render time
  state.pendingOnly = _initialPendingOnly;
  if (state.pendingOnly) {
    var hint = document.createElement('div');
    hint.style.cssText = 'background:#fff8e1;border-left:3px solid #f5a623;padding:6px 14px;font-size:11px;color:#5a4500;display:flex;justify-content:space-between;align-items:center;';
    hint.innerHTML = '<span><b>Showing PENDING only</b> — click to show all</span>' +
      '<button onclick="window.__togglePending()" style="background:#f5a623;color:#fff;border:0;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;">Show all</button>';
    hint.id = 'pendingOnlyHint';
    var bar = document.getElementById('timePills');
    if (bar && bar.parentNode) bar.parentNode.insertBefore(hint, bar.nextSibling);
    window.__togglePending = function(){
      state.pendingOnly = false;
      var h = document.getElementById('pendingOnlyHint');
      if (h) h.remove();
      load();
    };
  }
  renderSkeleton();
  load();
  loadCounts();

})();
</script>
<?!= include('BottomNav') ?>
</body>
</html>
