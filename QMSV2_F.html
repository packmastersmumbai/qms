  <script>
    // ============ data + state ============
    // GAS web-app exec URL (for opening a record's standalone DocView in a new tab via ?doc=).
    var SCRIPT_URL = '<?= scriptUrl ?>';
    var LS_KEY = 'pmQmsOperator';
    var DOC_TYPES = ['GRN','IQC','IPQC','OQC','Dispatch','Production','NCR'];
    var TAB_ICONS = { GRN:'inventory_2', IQC:'biotech', IPQC:'precision_manufacturing', OQC:'verified', Dispatch:'local_shipping', Production:'factory', NCR:'report_problem' };
    var STAGE_LABELS = ['GRN','IQC','PUTAWAY','ISSUE','OQC','DISP'];
    var STAGE_SHORT  = ['GRN','IQC','PUT','ISS','OQC','DISP'];
    var DOC_TITLES = { ALL:'All Records', GRN:'Goods Receipt Notes (GRN)', IQC:'Incoming QC (IQC)', IPQC:'In-Process QC (IPQC)', OQC:'Outgoing QC (OQC)', Dispatch:'Dispatch', Production:'Production Jobs', NCR:'Non-Conformance (NCR)' };
    var TYPE_BADGE = { GRN:'bg-blue-500/15 text-blue-600', IQC:'bg-purple-500/15 text-purple-600', IPQC:'bg-amber-500/15 text-amber-600', OQC:'bg-green-600/15 text-green-700', Dispatch:'bg-cyan-500/15 text-cyan-600', Production:'bg-orange-500/15 text-orange-600', NCR:'bg-red-500/15 text-red-600' };

    var roleStageMap = null, operators = [], currentOp = null;
    var currentRole = 'manager', currentType = 'ALL', currentFilter = 'all';
    var currentView = 'kanban';   // 'kanban' | 'list' | 'timeline'
    var actionRegistry = null, formData = null, lastBoard = null;

    var root = document.getElementById('qmsv2Root');
    var sel = document.getElementById('opSelect');
    var roleEl = document.getElementById('whoRole');
    var tabRow = document.getElementById('tabRow');
    var sideTabs = document.getElementById('typeChips');   // desktop type-chip row (sidebar removed)
    var backdrop = document.getElementById('sheetBackdrop');
    var sheet = document.getElementById('sheet');

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function primaryTabFor(role){ var t = roleStageMap && roleStageMap[role]; return (t && t.length) ? t[0] : 'GRN'; }

    // ============ navigation (full-page swap; navigateTo not in form scope) ============
    function launchForm(formName){
      // Mark that the launched legacy form should return to the cockpit (not Landing)
      // when the user goes "home"/back. Theme.html reads this flag. Home/Records/Trace/KPI
      // chrome buttons intentionally leave the cockpit, so they clear it first.
      try {
        if (['Landing','Records','Trace','KPI'].indexOf(formName) !== -1) window.localStorage.removeItem('qmsReturnTo');
        else window.localStorage.setItem('qmsReturnTo', 'QMSV2');
      } catch (e) {}
      google.script.run
        .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
        .withFailureHandler(function(){ alert('Could not open ' + formName); })
        .getFormHtml(formName);
    }

    // ============ type chips (All + each record type) ============
    var CHIP_TYPES = ['ALL'].concat(DOC_TYPES);
    // Per-type icon accent color (inactive chips) — mirrors old Landing's colored module cards.
    var TYPE_ICON_COLOR = { GRN:'text-blue-600', IQC:'text-purple-600', IPQC:'text-amber-600', OQC:'text-green-700', Dispatch:'text-cyan-600', Production:'text-orange-600', NCR:'text-red-600', ALL:'text-primary' };
    function tabBtn(t, mobile){
      var active = t === currentType;
      var label = t === 'ALL' ? 'All' : t;
      var icon = t === 'ALL' ? 'apps' : (TAB_ICONS[t] || 'tab');
      var iconCls = active ? '' : (' ' + (TYPE_ICON_COLOR[t] || 'text-on-surface-variant'));
      var b = document.createElement('button');
      if (mobile){
        b.className = 'min-w-fit px-3.5 h-9 rounded-full flex items-center gap-1.5 text-[13px] font-medium whitespace-nowrap transition ' +
          (active ? 'bg-primary text-on-primary shadow-sm' : 'bg-surface-container-high text-on-surface-variant');
      } else {
        b.className = 'shrink-0 flex items-center gap-1.5 px-3 h-8 rounded-full border transition ' +
          (active ? 'bg-primary text-on-primary border-primary shadow-sm font-semibold' : 'bg-surface text-on-surface-variant border-outline-variant hover:bg-surface-container-low');
      }
      b.innerHTML = '<span class="material-symbols-outlined text-[18px]' + iconCls + '">' + icon + '</span>' +
        '<span class="font-label-caps text-[13px]">' + label + '</span>';
      b.addEventListener('click', function(){ currentType = t; renderTabs(); loadBoard(); });
      return b;
    }
    function renderTabs(){
      tabRow.innerHTML = ''; sideTabs.innerHTML = '';
      CHIP_TYPES.forEach(function(t){ tabRow.appendChild(tabBtn(t, true)); sideTabs.appendChild(tabBtn(t, false)); });
    }

    // ============ mini segmented pipeline bar — Stitch desktop card (01b) ============
    function pipelineHtml(stage){
      var n = STAGE_LABELS.length;
      var segs = '', labels = '';
      for (var i = 0; i < n; i++){
        var done = i < stage, on = i === stage;
        segs += '<div class="' + (done||on ? 'bg-primary-container' : 'bg-outline') + ' w-1/6' + (i < n-1 ? ' border-r border-surface' : '') + '"></div>';
        labels += '<span class="' + (on ? 'font-bold text-primary' : '') + '">' + STAGE_SHORT[i] + '</span>';
      }
      return '<div class="w-full flex h-1.5 rounded-full overflow-hidden bg-surface-container-high mb-1.5 mt-2">' + segs + '</div>' +
        '<div class="flex justify-between text-[9px] text-on-surface-variant font-medium uppercase tracking-wide">' + labels + '</div>';
    }

    // tone -> status accent strip color (Stitch desktop)
    function stripColor(tone, overdue){
      if (tone === 'reject') return 'bg-error';
      if (overdue) return 'bg-error';
      if (tone === 'pass') return 'bg-[#16a34a]';
      if (tone === 'hold') return 'bg-tertiary';
      if (tone === 'prog') return 'bg-secondary';
      return 'bg-tertiary-fixed-dim';
    }
    // Compact card: docNo + OVERDUE/age on row 1, name on row 2, mini pipeline (which already
    // shows the current stage) — no separate status text line (it duplicated the pipeline).
    function typeBadge(t){
      if (!t) return '';
      return '<span class="font-label-caps text-[9px] font-bold uppercase px-1.5 py-0.5 rounded ' + (TYPE_BADGE[t]||'bg-surface-container-high text-on-surface-variant') + '">' + esc(t) + '</span>';
    }
    // Per-type Material icon (colored) — shown beside the doc number on cards/list rows.
    function typeIcon(t){
      if (!t) return '';
      var icon = TAB_ICONS[t] || 'description';
      var color = (typeof TYPE_ICON_COLOR !== 'undefined' && TYPE_ICON_COLOR[t]) || 'text-on-surface-variant';
      return '<span class="material-symbols-outlined text-[16px] shrink-0 ' + color + '" title="' + esc(t) + '">' + icon + '</span>';
    }
    function cardHtml(card, tone, idx){
      var age = card.ageDays != null ? (card.ageDays + 'd') : '';
      var topRight = card.overdue
        ? '<span class="text-[10px] font-bold text-error bg-error-container px-1.5 py-0.5 rounded shrink-0">OVERDUE</span>'
        : (age ? '<span class="text-[11px] text-on-surface-variant shrink-0">' + age + '</span>' : '');
      // meta line: qty · date · status (TYPE now shown as the icon beside docNo, not a badge)
      var meta = [];
      if (card.qty)  meta.push('<span class="font-medium text-on-surface">' + esc(card.qty) + '</span>');
      if (card.date) meta.push(esc(card.date));
      if (card.status) meta.push('<span class="truncate">' + esc(card.status) + '</span>');
      var metaLine = '<div class="flex items-center gap-1.5 text-[11px] text-on-surface-variant mt-1 truncate">' +
        '<span class="truncate">' + meta.join(' · ') + '</span></div>';
      return '<button type="button" class="js-card card-in text-left w-full bg-surface border border-outline-variant rounded shadow-sm hover:shadow-md transition-shadow relative overflow-hidden cursor-pointer pl-3 pr-2.5 py-2" ' +
        'data-doc="' + esc(card.docNo) + '" data-type="' + esc(card.type||'') + '" data-stage="' + (card.stage||0) + '" data-status="' + esc(card.status) + '" data-name="' + esc(card.name||'') + '" ' +
        'style="animation-delay:' + (idx*30) + 'ms">' +
        '<div class="absolute left-0 top-0 bottom-0 w-1 ' + stripColor(tone, card.overdue) + '"></div>' +
        '<div class="flex justify-between items-center gap-2">' +
          '<span class="flex items-center gap-1 min-w-0">' + typeIcon(card.type) +
            '<span class="font-label-caps text-[11px] text-primary tracking-wider truncate">' + esc(card.docNo) + '</span></span>' +
          topRight +
        '</div>' +
        '<h4 class="font-interactive-label text-[13px] text-on-surface truncate mt-0.5">' + esc(card.name || '—') + '</h4>' +
        metaLine +
      '</button>';
    }

    var searchTerm = '';
    // Rolling-window time filter (by record age in days). 'all' = no limit.
    var currentRange = 'all';
    var RANGE_MAX = { day: 1, week: 7, month: 30, all: Infinity };
    function applyFilter(cards){
      var out = currentFilter === 'urgent' ? cards.filter(function(c){ return c.overdue; }) : cards;
      var max = RANGE_MAX[currentRange];
      if (max !== Infinity) out = out.filter(function(c){ return (c.ageDays != null ? c.ageDays : 0) <= max; });
      if (searchTerm){ out = out.filter(function(c){ return ((c.docNo||'') + ' ' + (c.name||'')).toLowerCase().indexOf(searchTerm) !== -1; }); }
      return out;
    }

    // One kanban column: header (dot + title + count) + scrollable card area.
    function columnHtml(title, dotColor, cards, tone, startIdx){
      var inner = cards.length
        ? cards.map(function(c, i){ return cardHtml(c, tone, startIdx + i); }).join('')
        : '<div class="flex flex-col items-center justify-center text-center text-on-surface-variant/60 py-12 gap-2">' +
          '<span class="material-symbols-outlined text-3xl">inbox</span><span class="text-sm">Nothing here</span></div>';
      return '<div class="w-80 md:w-auto flex flex-col h-full min-h-0 bg-surface-container-lowest border border-outline-variant rounded-lg shrink-0">' +
        '<div class="p-3 border-b border-outline-variant flex justify-between items-center bg-surface-bright rounded-t-lg">' +
          '<h3 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">' +
            '<div class="w-3 h-3 rounded-full ' + dotColor + '"></div>' + title + '</h3>' +
          '<span class="text-on-surface-variant font-medium bg-surface-container px-2 py-0.5 rounded text-sm">' + cards.length + '</span>' +
        '</div>' +
        '<div class="flex-1 overflow-y-auto p-2 space-y-2">' + inner + '</div></div>';
    }

    // Use the server's REAL buckets {pending,rejected,hold,completed} as-is — no synthetic
    // Completed/Verified split (that regex left a permanently-empty 4th column for
    // every type without a release step). The done column is titled "Verified" only
    // for types that genuinely end in a release/dispatch decision; "Done" otherwise.
    // Four-column status model: Pending · Rejected · Hold · Completed.
    function splitColumns(board){
      var c = board.columns || {};
      return {
        pending:   applyFilter(c.pending   || []),
        rejected:  applyFilter(c.rejected  || []),
        hold:      applyFilter(c.hold      || []),
        completed: applyFilter(c.completed || [])
      };
    }

    function renderKanban(board){
      var s = splitColumns(board);
      var i = 0, html = '<div class="flex gap-gutter h-full min-h-0 min-w-max md:min-w-0 md:grid md:grid-cols-4">';
      html += columnHtml('Pending',   'bg-outline',     s.pending,   'pending', i); i += s.pending.length;
      html += columnHtml('Rejected',  'bg-error',       s.rejected,  'reject',  i); i += s.rejected.length;
      html += columnHtml('Hold',      'bg-tertiary',    s.hold,      'hold',    i); i += s.hold.length;
      html += columnHtml('Completed', 'bg-[#16a34a]',   s.completed, 'pass',    i);
      html += '</div>';
      return html;
    }

    // Flat stream of every card (used by list + timeline). Default newest-first by age.
    function listRows(board){
      var s = splitColumns(board);
      return s.pending.concat(s.rejected, s.hold, s.completed)
        .sort(function(a,b){ return (a.ageDays||0) - (b.ageDays||0); });
    }
    // List sort state — resets to Date-desc on each board reload (see renderBoard).
    var listSort = { key: 'date', dir: -1 };   // dir: 1 asc, -1 desc
    function parseListDate(s){
      // getRecordsList emits "DD-Mmm-YYYY"; Date() parses it. Fall back to 0.
      var t = new Date(String(s||'')).getTime();
      return isNaN(t) ? 0 : t;
    }
    function sortedListRows(board){
      var rows = listRows(board).slice();
      var k = listSort.key, dir = listSort.dir;
      rows.sort(function(a,b){
        var av, bv;
        if (k === 'date'){ av = parseListDate(a.date); bv = parseListDate(b.date); }
        else if (k === 'age'){ av = a.ageDays||0; bv = b.ageDays||0; }
        else if (k === 'qty'){ av = parseFloat(a.qty)||0; bv = parseFloat(b.qty)||0; }
        else { av = String(a[k]||'').toLowerCase(); bv = String(b[k]||'').toLowerCase(); }
        return av < bv ? -1*dir : av > bv ? 1*dir : 0;
      });
      return rows;
    }
    // Map a card's status to a tone (pending | reject | hold | pass).
    function toneFor(card){
      var s = String(card.status||'').toUpperCase();
      if (/REJECT/.test(s)) return 'reject';
      if (/HOLD/.test(s)) return 'hold';
      if (/ACCEPT|PASS|RELEAS|DISPATCH|CLOSED|COMPLETE|DONE|PRODUCED|VERIFI/.test(s)) return 'pass';
      return 'pending';
    }
    // List view — a real data table (TYPE · DOC NO · NAME · QTY · DATE · STATUS · AGE).
    // Rows carry .js-card data-* so the existing click handler opens detail unchanged.
    function statusChip(card){
      var t = toneFor(card);
      var cls = t === 'pass' ? 'bg-green-600/15 text-green-700'
        : t === 'reject' ? 'bg-error-container text-error'
        : t === 'hold' ? 'bg-tertiary/20 text-tertiary'
        : card.overdue ? 'bg-error-container text-error'
        : 'bg-secondary-container/30 text-secondary';
      return '<span class="font-label-caps text-[10px] font-bold uppercase px-2 py-0.5 rounded ' + cls + '">' + esc(card.status||'—') + '</span>';
    }
    var LIST_COLS = [
      { key:'type',   label:'Type' },
      { key:'docNo',  label:'Doc No' },
      { key:'name',   label:'Name' },
      { key:'qty',    label:'Qty' },
      { key:'date',   label:'Date' },
      { key:'status', label:'Status' },
      { key:'age',    label:'Age', right:true }
    ];
    function listHeaderCell(col){
      var active = listSort.key === col.key;
      var arrow = active ? (listSort.dir === 1 ? ' ↑' : ' ↓') : '';
      return '<th class="js-list-sort px-3 py-2 cursor-pointer select-none hover:text-on-surface ' + (col.right?'text-right':'') + (active?' text-primary':'') + '" data-key="' + col.key + '">' + esc(col.label) + arrow + '</th>';
    }
    function renderList(board){
      var rows = sortedListRows(board);
      if (!rows.length) return emptyState();
      var head = '<thead class="sticky top-0 bg-surface-container z-10"><tr class="text-left font-label-caps text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">' +
        LIST_COLS.map(listHeaderCell).join('') + '</tr></thead>';
      var body = rows.map(function(c){
        var ageCell = c.overdue ? '<span class="text-error font-bold">' + (c.ageDays||0) + 'd</span>' : ((c.ageDays!=null?c.ageDays+'d':'—'));
        return '<tr class="js-card border-t border-outline-variant hover:bg-surface-container-low cursor-pointer transition-colors" ' +
          'data-doc="' + esc(c.docNo) + '" data-type="' + esc(c.type||'') + '" data-stage="' + (c.stage||0) + '" data-status="' + esc(c.status) + '" data-name="' + esc(c.name||'') + '">' +
          '<td class="px-3 py-2">' + (c.type?('<span class="flex items-center gap-1">' + typeIcon(c.type) + '<span class="text-[11px] text-on-surface-variant">' + esc(c.type) + '</span></span>'):'') + '</td>' +
          '<td class="px-3 py-2 font-mono text-[12px] text-primary whitespace-nowrap">' + esc(c.docNo) + '</td>' +
          '<td class="px-3 py-2 text-on-surface max-w-[260px] truncate">' + esc(c.name||'—') + '</td>' +
          '<td class="px-3 py-2 whitespace-nowrap">' + esc(c.qty||'—') + '</td>' +
          '<td class="px-3 py-2 whitespace-nowrap text-on-surface-variant">' + esc(c.date||'—') + '</td>' +
          '<td class="px-3 py-2">' + statusChip(c) + '</td>' +
          '<td class="px-3 py-2 text-right whitespace-nowrap">' + ageCell + '</td></tr>';
      }).join('');
      return '<div class="overflow-x-auto"><table class="w-full text-[13px] border-collapse">' + head + '<tbody>' + body + '</tbody></table></div>';
    }

    // Timeline view — rows = record TYPES, columns = DATES (newest first).
    // Each cell lists every record of that type on that date as a "docNo · status"
    // chip. Click → openable types open in a new window (?doc=), others open the
    // in-app detail sheet. Horizontally scrollable; type column is sticky.
    function ymd(dateStr){ return String(dateStr||''); }
    function toneChipCls(t){
      return t==='pass' ? 'bg-green-600/15 text-green-700'
        : t==='reject' ? 'bg-error-container text-error'
        : t==='hold' ? 'bg-tertiary/20 text-tertiary'
        : 'bg-secondary-container/25 text-secondary';
    }
    function tlChip(c){
      var openable = laneDocOpenable(c.docNo);
      var cls = toneChipCls(toneFor(c));
      return '<button class="js-tl-chip block w-full text-left rounded px-1.5 py-1 mb-1 ' + cls + ' hover:brightness-95 active:scale-[0.99] transition" ' +
        'data-open="' + (openable?'1':'0') + '" data-doc="' + esc(c.docNo) + '" data-type="' + esc(c.type||'') + '" data-stage="' + (c.stage||0) + '" data-status="' + esc(c.status) + '" data-name="' + esc(c.name||'') + '">' +
        '<div class="flex items-center gap-1 font-mono text-[11px] font-semibold leading-tight truncate">' + esc(c.docNo) +
          (openable ? '<span class="material-symbols-outlined text-[13px] shrink-0">open_in_new</span>' : '') + '</div>' +
        '<div class="font-label-caps text-[9px] font-bold uppercase truncate">' + esc(c.status||'') + '</div>' +
      '</button>';
    }
    function renderTimeline(board){
      var rows = listRows(board);
      if (!rows.length) return emptyState();
      // distinct dates → columns (newest first)
      var dateSet = {}, dates = [];
      rows.forEach(function(c){ var d = ymd(c.date); if (d && !dateSet[d]){ dateSet[d]=1; dates.push(d); } });
      dates.sort(function(a,b){ return new Date(b) - new Date(a); });
      // group by type → date → [records]
      var byType = {};
      rows.forEach(function(c){
        var ty = c.type || '—', d = ymd(c.date) || '—';
        (byType[ty] = byType[ty] || {});
        (byType[ty][d] = byType[ty][d] || []).push(c);
      });
      // type rows in canonical DOC_TYPES order, only those present
      var typeRows = DOC_TYPES.filter(function(t){ return byType[t]; });
      Object.keys(byType).forEach(function(t){ if (typeRows.indexOf(t) === -1) typeRows.push(t); });

      var colW = 150;
      var headCells = dates.map(function(d){ return '<th class="px-2 py-2 text-center font-label-caps text-[10px] font-bold uppercase text-on-surface-variant whitespace-nowrap border-l border-outline-variant/40" style="min-width:' + colW + 'px">' + esc(d) + '</th>'; }).join('');
      var head = '<thead class="sticky top-0 bg-surface-container z-20"><tr>' +
        '<th class="px-3 py-2 text-left font-label-caps text-[10px] font-bold uppercase text-on-surface-variant sticky left-0 bg-surface-container z-30" style="min-width:140px">Type</th>' +
        headCells + '</tr></thead>';
      var body = typeRows.map(function(ty){
        var cells = dates.map(function(d){
          var recs = (byType[ty] && byType[ty][d]) || [];
          var inner = recs.length ? recs.map(tlChip).join('') : '';
          return '<td class="border-l border-t border-outline-variant/40 px-1.5 py-1.5 align-top" style="min-width:' + colW + 'px">' + inner + '</td>';
        }).join('');
        return '<tr><td class="px-3 py-2 sticky left-0 bg-surface z-10 align-top border-t border-outline-variant" style="min-width:140px">' +
          '<div class="flex items-center gap-1.5">' + typeBadge(ty) +
            '<span class="text-[11px] text-on-surface-variant">' + recs_count(byType[ty]) + '</span></div></td>' + cells + '</tr>';
      }).join('');
      return '<div class="overflow-auto h-full"><table class="text-[13px] border-collapse">' + head + '<tbody>' + body + '</tbody></table></div>';
    }
    function recs_count(dateMap){
      var n = 0; if (dateMap) Object.keys(dateMap).forEach(function(d){ n += dateMap[d].length; }); return n;
    }
    function emptyState(){
      return '<div class="flex flex-col items-center justify-center text-center text-on-surface-variant/60 py-20 gap-2">' +
        '<span class="material-symbols-outlined text-4xl">inbox</span><span class="text-sm">Nothing here</span></div>';
    }
    // Open a record's standalone DocView in a NEW window (?doc=). Returns false if blocked.
    function openDocNewWindow(docNo){
      var url = SCRIPT_URL + (SCRIPT_URL.indexOf('?')===-1?'?':'&') + 'doc=' + encodeURIComponent(docNo);
      var w = null;
      try { w = window.open(url, '_blank', 'noopener'); } catch(e){}
      if (!w) { try { w = window.top.open(url, '_blank', 'noopener'); } catch(e){} }
      if (!w) alert('Pop-up blocked. Allow pop-ups for this site to open ' + docNo + ' in a new tab.');
      return !!w;
    }

    function renderBoard(board){
      var scrollCls = currentView === 'kanban'
        ? 'flex-1 overflow-x-auto overflow-y-hidden'
        : 'flex-1 overflow-y-auto overflow-x-hidden';
      root.className = scrollCls + ' p-gutter md:p-margin-desktop pb-28 md:pb-8';
      root.innerHTML = currentView === 'list' ? renderList(board)
        : currentView === 'timeline' ? renderTimeline(board)
        : renderKanban(board);
      paintViewSwitch();
      // title bar counts (desktop)
      var bt = document.getElementById('boardTitle'); if (bt) bt.textContent = DOC_TITLES[currentType] || currentType;
      var ba = document.getElementById('boardActive'); if (ba) ba.textContent = (board.counts ? board.counts.total : 0) + ' Active';
    }

    // Tag every card in a board with its record type (for badge + detail open).
    function tagBoard(board, type){
      ['pending','rejected','hold','completed'].forEach(function(col){
        (board.columns[col]||[]).forEach(function(c){ c.type = type; });
      });
      return board;
    }
    // Merge several single-type boards into one combined board (for the "All" chip).
    function mergeBoards(boards){
      var cols = ['pending','rejected','hold','completed'];
      var out = { type:'ALL', columns:{ pending:[], rejected:[], hold:[], completed:[] }, counts:{ total:0 } };
      boards.forEach(function(b){
        if (!b || !b.columns) return;
        cols.forEach(function(k){ out.columns[k] = out.columns[k].concat(b.columns[k]||[]); });
      });
      out.counts.total = cols.reduce(function(n,k){ return n + out.columns[k].length; }, 0);
      return out;
    }

    function loadBoard(){
      if (typeof exitSelectMode === 'function' && selectMode) exitSelectMode();
      listSort = { key:'date', dir:-1 };   // reset list sort to Date newest-first on every reload
      root.innerHTML = '<div class="text-on-surface-variant text-[14px] text-center py-16">Loading board…</div>';
      if (currentType === 'ALL'){ loadAllBoards(); return; }
      google.script.run
        .withSuccessHandler(function(board){ if (!board || !board.columns){ root.textContent='No board data.'; return; } lastBoard = tagBoard(board, currentType); renderBoard(lastBoard); })
        .withFailureHandler(function(err){ root.innerHTML = '<div class="text-error text-[13px] text-center py-12">Board load failed: ' + esc(err && err.message ? err.message : err) + '</div>'; })
        .getQmsv2Board(currentType, currentRole);
    }

    // "All" — fetch each type sequentially (google.script.run serializes anyway) and merge.
    function loadAllBoards(){
      var token = (loadAllBoards._t = (loadAllBoards._t||0) + 1);
      var pending = DOC_TYPES.slice(), collected = [];
      root.innerHTML = '<div class="text-on-surface-variant text-[14px] text-center py-16">Loading all records…</div>';
      (function next(){
        if (token !== loadAllBoards._t) return;            // a newer load superseded this one
        if (!pending.length){ lastBoard = mergeBoards(collected); renderBoard(lastBoard); return; }
        var t = pending.shift();
        google.script.run
          .withSuccessHandler(function(b){ if (b && b.columns) collected.push(tagBoard(b, t)); next(); })
          .withFailureHandler(function(){ next(); })       // skip a failed type, keep going
          .getQmsv2Board(t, currentRole);
      })();
    }

    // ============ pipeline detail (card tap) ============
    // Reuses the existing Trace engine (traceBatch) — no new server code.
    function traceLane(title, rows, render){
      if (!rows || !rows.length) return '';
      return '<div class="mt-4"><div class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-surface-variant mb-2">' + title + '</div>' +
        '<div class="flex flex-col gap-1.5">' + rows.map(render).join('') + '</div></div>';
    }
    function laneRow(docNo, sub, badge){
      // A row is openable ONLY if its docNo is a type DocView can render — GRN/IQC/OQC/PO
      // (DOC_FIELD_MAPS). IPQC/Dispatch/NCR/Production/FG-jobs/materials have no DocView and
      // throw "Unknown document type", so those render as plain (non-link) rows.
      var openable = laneDocOpenable(docNo);
      var tag = openable ? 'button' : 'div';
      var cls = openable
        ? 'js-lane-open w-full text-left flex items-center justify-between gap-2 px-2.5 py-1.5 bg-surface-container-low rounded hover:bg-surface-container active:scale-[0.99] transition cursor-pointer'
        : 'flex items-center justify-between gap-2 px-2.5 py-1.5 bg-surface-container-low rounded';
      return '<' + tag + (openable ? ' data-doc="' + esc(docNo) + '"' : '') + ' class="' + cls + '">' +
        '<div class="min-w-0"><div class="font-mono text-[12px] text-on-surface truncate">' + esc(docNo) + '</div>' +
        (sub ? '<div class="text-[11px] text-on-surface-variant truncate">' + esc(sub) + '</div>' : '') + '</div>' +
        '<div class="flex items-center gap-1.5 shrink-0">' +
        (badge ? '<span class="font-label-caps text-[9px] font-bold uppercase px-2 py-0.5 rounded bg-secondary-container/15 text-secondary">' + esc(badge) + '</span>' : '') +
        (openable ? '<span class="material-symbols-outlined text-[16px] text-secondary">open_in_new</span>' : '') +
        '</div></' + tag + '>';
    }
    // DocView prefixes with a DOC_FIELD_MAPS entry (server). PO routes to Records. Others
    // (PROD/IPQC/SCR/SMP/FGL/materials) have no document view → render as plain rows.
    var DOCVIEW_OPENABLE = { GRN:1, IQC:1, OQC:1, GP:1, NCR:1, RTN:1, PO:1 };
    function laneDocOpenable(docNo){
      var d = String(docNo||'').trim();
      var parts = d.split('/');
      if (parts.length < 2) return false;                 // bare material/component/lot code
      var type = parts[parts.length - 2].toUpperCase();   // PM/<TYPE>/nnn
      return !!DOCVIEW_OPENABLE[type];
    }
    function renderDetail(meta, trace, pending){
      var t = trace || {};
      var up = (t.upstream && t.upstream.components) || [];
      var ipqc = (t.thisBatch && t.thisBatch.ipqc) || [];
      var dn = t.downstream || {};
      var iss = t.issues || {};
      var html = '<div class="flex justify-between items-start mb-1">' +
        '<div><span class="font-label-caps text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-secondary-container/15 text-secondary">' + esc(meta.status) + '</span>' +
        '<div class="font-mono text-[15px] font-semibold text-on-surface mt-1">' + esc(meta.doc) + '</div></div>' +
        '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant">close</button></div>' +
        '<p class="text-[13px] text-on-surface-variant mb-3">' + esc(meta.name || '—') + '</p>' +
        '<div class="bg-surface-container-low rounded-lg p-3">' + pipelineHtml(meta.stage) + '</div>' +
        '<div id="nextActions"></div>';

      if (pending){
        // Initial shell pass — openDetail auto-loads the trace immediately after, so show the
        // loading state (not a button). Cached traces resolve in ~2s; cold first-trace briefly.
        html += '<div class="flex items-center gap-2 text-[12px] text-on-surface-variant mt-4"><span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>Loading trace…</div>';
      } else if (trace && trace.__loading){
        html += '<div class="flex items-center gap-2 text-[12px] text-on-surface-variant mt-4"><span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>Loading trace…</div>';
      } else if (!trace || trace.success === false){
        html += '<div class="text-[12px] text-on-surface-variant mt-4">' + esc((trace && trace.message) || 'Trace unavailable.') + ' <button id="loadTrace" class="text-secondary underline ml-1">Retry</button></div>';
      } else {
        // Field names verified against Trace.js _computeTrace_ shapes.
        html += traceLane('Upstream components', up, function(c){
          var sub = (c.compDesc || '') + (c.totalIssued != null ? ' · ' + c.totalIssued + ' ' + (c.unit||'') : '');
          return laneRow(c.compCode || '—', sub, c.type); });
        html += traceLane('IPQC rounds', ipqc, function(r){ return laneRow(r.docNo, (r.inspector ? r.inspector + ' · ' : '') + (r.rounds ? r.rounds + ' rounds' : ''), r.status); });
        html += traceLane('Downstream · OQC', dn.oqc || [], function(r){ return laneRow(r.docNo, r.customer || '', r.status); });
        html += traceLane('Downstream · Dispatch', dn.dispatch || [], function(r){ return laneRow(r.docNo, r.customer || '', r.status); });
        html += traceLane('Downstream · FG jobs', dn.fgJobs || [], function(r){ return laneRow(r.jobId, (r.fgCode || '') + (r.fgDesc ? ' · ' + r.fgDesc : ''), r.status); });
        html += traceLane('Issues · NCR', iss.ncr || [], function(r){ return laneRow(r.docNo, r.source || '', r.status); });
        html += traceLane('Issues · Returns', iss.customerReturn || [], function(r){ return laneRow(r.docNo, r.customer || '', r.status); });
        var hasAny = up.length || ipqc.length || (dn.oqc||[]).length || (dn.dispatch||[]).length || (dn.fgJobs||[]).length || (iss.ncr||[]).length || (iss.customerReturn||[]).length;
        if (!hasAny) html += '<div class="text-[12px] text-on-surface-variant mt-4">No linked records in trace window.</div>';
      }
      sheet.innerHTML = html;
      document.getElementById('sheetClose').addEventListener('click', closeSheet);

      // Lazy-trace button (shown on the pending pass and on failure/retry).
      var lt = document.getElementById('loadTrace');
      if (lt) lt.addEventListener('click', function(){ loadTrace(meta); });

      // Drill into a linked record from any trace lane row (Both: detail rows are openable).
      Array.prototype.forEach.call(sheet.querySelectorAll('.js-lane-open'), function(el){
        el.addEventListener('click', function(){
          var d = el.getAttribute('data-doc'); if (!d) return;
          // Open the record's standalone view in a NEW tab (DocView via ?doc=). Never reload the
          // trace in-place. window.open from the GAS inner frame can be blocked, so fall back to
          // window.top and finally to a synthetic <a target=_blank> click.
          var url = SCRIPT_URL + (SCRIPT_URL.indexOf('?')===-1?'?':'&') + 'doc=' + encodeURIComponent(d);
          var w = null;
          try { w = window.open(url, '_blank', 'noopener'); } catch(e){}
          if (!w) { try { w = window.top.open(url, '_blank', 'noopener'); } catch(e){} }
          // Do NOT fall back to in-frame navigation (that "reloads" the cockpit). If the popup
          // was blocked, tell the user instead of replacing the cockpit.
          if (!w) alert('Pop-up blocked. Allow pop-ups for this site to open ' + d + ' in a new tab.');
        });
      });

      // Next actions — stage-aware (needs only meta.stage/status, not the trace), so render
      // them on EVERY pass. Previously skipped on the initial pass to avoid competing with the
      // trace RPC; trace is now lazy (no auto-fetch on open), so there's nothing to compete
      // with — rendering immediately removes the hide/reappear flicker. The trace anchor only
      // enriches the prefill, so use it when present (post-trace pass) and fall back otherwise.
      var anchor = (trace && trace.anchor) || {};
      var preset = {};
      if (anchor.materialCode) preset.material = String(anchor.materialCode);
      if (anchor.batchOrLot)   preset.lot = String(anchor.batchOrLot);
      renderNextActions(meta, preset);
    }

    // Fetch + render the stage-appropriate action buttons inside an open detail.
    // openDetail re-renders the sheet up to 3× (shell → loading → trace), each building a
    // fresh empty #nextActions. Next-actions depend only on meta (type/stage/status), never
    // the trace — so fetch ONCE per open record and repaint synchronously from cache on the
    // later passes. Previously each pass fired its own getNextActions RPC; the overlapping
    // async responses repainted out of order → the hide/reappear flicker + duplicate loads.
    var _nextActions = { key: null, acts: null };   // cache for the currently-open record
    function _paintNextActions(host, acts, preset){
      if (!acts || !acts.length){ host.innerHTML = ''; return; }
      var btns = acts.map(function(a){
        var crit = a.critical;
        var cls = crit ? 'border-error/40 text-error bg-error-container/40'
                       : a.id==='sample' ? 'border-secondary/40 text-secondary bg-secondary-container/10'
                       : 'border-outline-variant text-primary bg-surface';
        return '<button class="js-next h-touch-target-min px-4 rounded border ' + cls + ' font-interactive-label text-interactive-label font-bold flex items-center gap-2 active:scale-95 transition" data-act="' + a.id + '">' +
          '<span class="material-symbols-outlined text-[20px]">' + (crit?'delete':'arrow_forward') + '</span>' + esc(a.label) + '</button>';
      }).join('');
      host.innerHTML = '<div class="mt-5"><div class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-surface-variant mb-2">Next actions</div>' +
        '<div class="flex flex-wrap gap-2">' + btns + '</div></div>';
      Array.prototype.forEach.call(host.querySelectorAll('.js-next'), function(b){
        b.addEventListener('click', function(){ startRecordAction(b.getAttribute('data-act'), preset); });
      });
    }
    function renderNextActions(meta, preset){
      var host = document.getElementById('nextActions'); if (!host) return;
      var key = String(meta.doc || '') + '|' + meta.stage + '|' + meta.status;
      // Repaint pass: same record, actions already fetched → paint from cache, no RPC, no flicker.
      if (_nextActions.key === key && _nextActions.acts){ _paintNextActions(host, _nextActions.acts, preset); return; }
      // First open of this record: fetch once, cache, then paint.
      _nextActions = { key: key, acts: null };
      google.script.run.withSuccessHandler(function(acts){
        if (_nextActions.key !== key) return;         // record changed while in flight → drop stale response
        _nextActions.acts = acts || [];
        var h = document.getElementById('nextActions'); if (!h) return;   // re-grab: sheet may have re-rendered
        _paintNextActions(h, _nextActions.acts, preset);
      }).withFailureHandler(function(){
        if (_nextActions.key === key) _nextActions.acts = [];
        var h = document.getElementById('nextActions'); if (h) h.innerHTML = '';
      }).getNextActions(meta.type || currentType, meta.stage, meta.status);
    }

    // Dispatch a next-action from an open record: route by kind, carry prefill.
    function startRecordAction(actionId, preset){
      var a = actionById(actionId); if (!a) return;
      closeSheet();
      if (a.kind==='launch'){ launchForm(a.form); return; }
      if (a.kind==='checklist'){ openPutaway(); return; }
      openInlineForm(a, preset);
    }

    function openDetail(meta){
      // Render the actionable shell instantly from card meta (header, pipeline, Next actions —
      // none need the trace), THEN auto-load the full trace. Trace is now server-cached 6h
      // (fingerprint-invalidated), so a re-opened record returns in ~2s; the first-ever trace
      // for a doc shows "Loading trace…" briefly. The fetch is deferred off the click event
      // stack (setTimeout 0) — the documented fix for the GAS RPC stall when a google.script.run
      // is issued from inside the click handler's call stack.
      openSheet();
      renderDetail(meta, null, true);            // instant shell (with "Loading trace…" affordance)
      setTimeout(function(){ loadTrace(meta); }, 0);
    }
    // On-demand trace fetch. CRITICAL: issue google.script.run OFF the click event stack —
    // a direct probe fired at the same instant returns in ~2.8s, but the identical call built
    // inside the button's handler stack stalls ~15s. setTimeout(…,0) detaches it to a clean
    // task where the callback dispatches promptly.
    function loadTrace(meta){
      renderDetail(meta, { __loading: true });
      var settled = false;
      // First trace for a doc is slow (_computeTrace_ scans ~26 sheets, ~20-30s) but the result
      // is server-cached, so re-opening the same record is instant. Allow 45s for the cold call.
      var watchdog = setTimeout(function(){
        if (settled) return; settled = true;
        renderDetail(meta, { success:false, message:'Trace timed out.' });
      }, 45000);
      google.script.run
        .withSuccessHandler(function(trace){ if (settled) return; settled = true; clearTimeout(watchdog); renderDetail(meta, trace); })
        .withFailureHandler(function(){ if (settled) return; settled = true; clearTimeout(watchdog); renderDetail(meta, { success:false, message:'Trace unavailable.' }); })
        .getQmsv2TraceLite(meta.doc, 5);   // lean, capped projection — transmits reliably (full traceBatch payload drops)
    }
    // ============ multi-select (Stitch Batch Mode; SHELL — batch write is P2) ============
    var selectMode = false;
    var selected = {};   // docNo -> true
    var selBar = document.getElementById('selectBar');

    function selCount(){ return Object.keys(selected).length; }
    function paintSelection(){
      var n = selCount();
      document.getElementById('selectCount').textContent = n + ' Selected';
      var act = document.getElementById('selectAction'); act.disabled = n === 0;
      Array.prototype.forEach.call(root.querySelectorAll('.js-card'), function(c){
        var box = c.querySelector('.js-selbox'); if (!box) return;
        var on = !!selected[c.getAttribute('data-doc')];
        box.textContent = on ? 'check_box' : 'check_box_outline_blank';
        box.className = 'js-selbox material-symbols-outlined ' + (on ? 'text-primary' : 'text-outline-variant');
        c.classList.toggle('ring-2', on); c.classList.toggle('ring-primary', on);
      });
    }
    function enterSelectMode(){
      selectMode = true; selected = {};
      selBar.classList.remove('hidden'); selBar.classList.add('flex');
      // Inject a checkbox into each card (prepended in the header area).
      Array.prototype.forEach.call(root.querySelectorAll('.js-card'), function(c){
        if (c.querySelector('.js-selbox')) return;
        var box = document.createElement('span');
        box.className = 'js-selbox material-symbols-outlined text-outline-variant absolute top-2 right-2 bg-surface rounded';
        box.textContent = 'check_box_outline_blank';
        c.appendChild(box);
      });
      paintSelection();
    }
    function exitSelectMode(){
      selectMode = false; selected = {};
      selBar.classList.add('hidden'); selBar.classList.remove('flex');
      Array.prototype.forEach.call(root.querySelectorAll('.js-selbox'), function(b){ b.remove(); });
      Array.prototype.forEach.call(root.querySelectorAll('.js-card'), function(c){ c.classList.remove('ring-2','ring-primary'); });
    }
    function toggleSelect(){ selectMode ? exitSelectMode() : enterSelectMode(); }
    ['selectToggle','selectToggleM'].forEach(function(id){ var b = document.getElementById(id); if (b) b.addEventListener('click', toggleSelect); });
    // Desktop "Urgent" Filter button mirrors the mobile filter pill.
    var urgentBtn = document.getElementById('urgentToggle');
    if (urgentBtn) urgentBtn.addEventListener('click', function(){
      currentFilter = currentFilter === 'urgent' ? 'all' : 'urgent';
      var lbl = document.getElementById('urgentLabel'); if (lbl) lbl.textContent = currentFilter === 'urgent' ? 'Urgent ✓' : 'Urgent';
      paintFilters(); loadBoard();
    });
    document.getElementById('selectCancel').addEventListener('click', exitSelectMode);
    document.getElementById('selectAll').addEventListener('click', function(){
      Array.prototype.forEach.call(root.querySelectorAll('.js-card'), function(c){ selected[c.getAttribute('data-doc')] = true; });
      paintSelection();
    });
    document.getElementById('selectAction').addEventListener('click', function(){
      alert('Batch actions on ' + selCount() + ' selected items land in P2.');
    });
    document.getElementById('selectShare').addEventListener('click', function(){ alert('Share / export of selected items lands in P2.'); });
    document.getElementById('selectMore').addEventListener('click', function(){ alert('More batch options land in P2.'); });

    root.addEventListener('click', function(e){
      // List column sort: toggle dir if same key, else sort that key (date/age desc-first).
      var th = e.target.closest('.js-list-sort');
      if (th){
        var k = th.getAttribute('data-key');
        if (listSort.key === k) listSort.dir *= -1;
        else { listSort.key = k; listSort.dir = (k === 'date' || k === 'age') ? -1 : 1; }
        if (lastBoard) renderBoard(lastBoard);
        return;
      }
      // Timeline cell chip: openable types → new window; others → in-app detail sheet.
      var chip = e.target.closest('.js-tl-chip');
      if (chip){
        if (chip.getAttribute('data-open') === '1'){ openDocNewWindow(chip.getAttribute('data-doc')); return; }
        openDetail({ doc: chip.getAttribute('data-doc'), stage: Number(chip.getAttribute('data-stage')) || 0,
          status: chip.getAttribute('data-status'), name: chip.getAttribute('data-name'),
          type: chip.getAttribute('data-type') || currentType });
        return;
      }
      var c = e.target.closest('.js-card'); if (!c) return;
      if (selectMode){
        var doc = c.getAttribute('data-doc');
        if (selected[doc]) delete selected[doc]; else selected[doc] = true;
        paintSelection();
        return;
      }
      openDetail({ doc: c.getAttribute('data-doc'), stage: Number(c.getAttribute('data-stage')) || 0,
        status: c.getAttribute('data-status'), name: c.getAttribute('data-name'),
        type: c.getAttribute('data-type') || currentType });
    });

    // ============ identity ============
    function applyOperator(op){
      currentOp = op;
      currentRole = (op && op.cockpitRole) || 'manager';
      currentType = 'ALL';   // default to the All chip (was role's primary tab)
      roleEl.textContent = currentRole;
      // mirror into the sidebar persona card (Stitch desktop)
      var sn = document.getElementById('sideOpName'); if (sn) sn.textContent = op ? op.name : '—';
      var srl = document.getElementById('sideOpRole'); if (srl) srl.textContent = op ? ((op.role || currentRole) + '') : '—';
      try { if (op) localStorage.setItem(LS_KEY, op.name); } catch(e){}
      renderTabs(); loadBoard();
    }
    // Sidebar "switch operator" focuses the (topbar) select dropdown.
    (function(){ var sw = document.getElementById('opSwitch'); if (sw) sw.addEventListener('click', function(){ try { sel.focus(); sel.click(); } catch(e){} }); })();
    sel.addEventListener('change', function(){
      var op = operators.filter(function(o){ return o.name === sel.value; })[0];
      if (op) applyOperator(op);
    });
    function loadOperators(){
      google.script.run
        .withSuccessHandler(function(ops){
          operators = ops || []; sel.innerHTML = '';
          if (!operators.length){ sel.innerHTML = '<option value="">No operators</option>'; return; }
          operators.forEach(function(o){ var opt = document.createElement('option'); opt.value=o.name; opt.textContent=o.name; sel.appendChild(opt); });
          var saved = null; try { saved = localStorage.getItem(LS_KEY); } catch(e){}
          var chosen = (saved && operators.filter(function(o){ return o.name===saved; })[0]) || operators[0];
          sel.value = chosen.name; applyOperator(chosen);
        })
        .withFailureHandler(function(err){ root.innerHTML = '<div class="text-error text-center py-12">Operator load failed: ' + esc(err && err.message) + '</div>'; })
        .getQmsv2Operators();
    }

    // ============ view switch (Kanban / List / Timeline) ============
    function paintViewSwitch(){
      Array.prototype.forEach.call(document.querySelectorAll('.view-btn'), function(b){
        var on = b.getAttribute('data-view') === currentView;
        var base = b.className.replace(/\s*(bg-surface shadow-sm text-primary|text-on-surface-variant hover:text-on-surface)\s*/g, ' ').trim();
        b.className = base + (on ? ' bg-surface shadow-sm text-primary' : ' text-on-surface-variant hover:text-on-surface');
      });
    }
    (function(){
      ['viewSwitch','viewSwitchM'].forEach(function(id){
        var el = document.getElementById(id); if (!el) return;
        el.addEventListener('click', function(e){
          var b = e.target.closest('.view-btn'); if (!b) return;
          currentView = b.getAttribute('data-view');
          if (lastBoard) renderBoard(lastBoard); else paintViewSwitch();
        });
      });
    })();

    // ============ time range switch (Day / Week / Month / All) ============
    function paintRangeSwitch(){
      Array.prototype.forEach.call(document.querySelectorAll('.range-btn'), function(b){
        var on = b.getAttribute('data-range') === currentRange;
        var base = b.className.replace(/\s*(bg-surface shadow-sm text-primary|bg-primary text-on-primary shadow-sm|text-on-surface-variant hover:text-on-surface)\s*/g, ' ').trim();
        b.className = base + (on ? ' bg-primary text-on-primary shadow-sm' : ' text-on-surface-variant hover:text-on-surface');
      });
    }
    (function(){
      ['rangeSwitch','rangeSwitchM'].forEach(function(id){
        var el = document.getElementById(id); if (!el) return;
        el.addEventListener('click', function(e){
          var b = e.target.closest('.range-btn'); if (!b) return;
          currentRange = b.getAttribute('data-range');
          paintRangeSwitch();
          if (lastBoard) renderBoard(lastBoard);
        });
      });
    })();

    // ============ filter pills ============
    function paintFilters(){
      Array.prototype.forEach.call(document.querySelectorAll('.filter-pill'), function(p){
        var on = p.getAttribute('data-filter') === currentFilter;
        p.className = 'filter-pill px-4 py-1.5 rounded-full text-[14px] font-medium transition ' +
          (on ? 'bg-primary text-on-primary shadow-sm' : 'text-on-surface-variant hover:bg-surface-variant');
      });
    }
    document.getElementById('filterRow').addEventListener('click', function(e){
      var b = e.target.closest('.filter-pill'); if (!b) return;
      currentFilter = b.getAttribute('data-filter'); paintFilters(); loadBoard();
    });
    // Sidebar search — re-render the cached board (no re-fetch).
    (function(){
      var si = document.getElementById('boardSearch');
      if (si) si.addEventListener('input', function(){ searchTerm = si.value.trim().toLowerCase(); if (lastBoard) renderBoard(lastBoard); });
    })();
    // My Work / All toggle (sidebar) — All clears the role-tab default emphasis.
    (function(){
      var mw = document.getElementById('myWorkBtn'), al = document.getElementById('allBtn');
      function paintMW(active){
        if (!mw || !al) return;
        mw.className = 'flex-1 py-2 text-sm font-medium flex items-center justify-center gap-2 rounded ' + (active ? 'bg-surface shadow-sm text-primary' : 'text-on-surface-variant hover:text-on-surface');
        al.className = 'flex-1 py-2 text-sm font-medium flex items-center justify-center gap-2 rounded ' + (!active ? 'bg-surface shadow-sm text-primary' : 'text-on-surface-variant hover:text-on-surface');
      }
      if (mw) mw.addEventListener('click', function(){ paintMW(true); currentType = primaryTabFor(currentRole); renderTabs(); loadBoard(); });
      if (al) al.addEventListener('click', function(){ paintMW(false); });
    })();

    // ============ action picker ============
    function openSheet(){ backdrop.classList.remove('hidden'); backdrop.classList.add('flex'); }
    function closeSheet(){ backdrop.classList.add('hidden'); backdrop.classList.remove('flex'); sheet.innerHTML=''; }

    // Group metadata — verbatim from Stitch 02-action-picker (icon + subtitle).
    var GROUP_META = {
      Receive: { icon:'inventory',                sub:'Inbound materials & GRN' },
      Inspect: { icon:'biotech',                  sub:'IQC, IPQC, OQC forms' },
      Make:    { icon:'precision_manufacturing',  sub:'Production runs & batches' },
      Ship:    { icon:'local_shipping',           sub:'Dispatch & logistics' },
      Move:    { icon:'swap_horiz',               sub:'Internal transfers & putaway' },
      Resolve: { icon:'report_problem',           sub:'Address non-conformances' }
    };

    // Level 1 — group rows (verbatim Stitch markup; Receive=navy fill, Resolve=error).
    function renderPicker(){
      if (!actionRegistry){ sheet.innerHTML = '<h2 class="font-display-lg-mobile text-display-lg-mobile text-primary">Loading…</h2>'; return; }
      var html = '<div class="flex justify-between items-start mb-4"><div>' +
        '<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-1">Quick Actions</h1>' +
        '<p class="font-body-sm text-body-sm text-on-surface-variant">Select an operation to begin.</p></div>' +
        '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant">close</button></div>' +
        '<div class="flex flex-col gap-base">';
      actionRegistry.groups.forEach(function(g){
        var inG = actionRegistry.actions.filter(function(a){ return a.group===g; });
        if (!inG.length) return;
        var m = GROUP_META[g] || { icon:'tab', sub:'' };
        var isReceive = g === 'Receive', isResolve = g === 'Resolve';
        var shell = isReceive ? 'bg-primary-container text-on-primary hover:bg-primary-fixed-variant'
                  : isResolve ? 'bg-error-container text-on-error-container border border-error/20 hover:bg-error-container/80 mt-2'
                  : 'bg-surface text-primary border border-outline-variant hover:bg-surface-variant';
        var tile = isReceive ? 'bg-on-primary/10' : isResolve ? 'bg-error/10' : 'bg-surface-container-high';
        var ico  = isReceive ? '' : isResolve ? 'text-error' : 'text-primary';
        var subc = isReceive ? 'text-on-primary-container' : isResolve ? 'text-error/80' : 'text-on-surface-variant';
        var chev = isReceive ? 'text-on-primary-container' : isResolve ? 'text-error/60' : 'text-outline';
        var lbl  = isResolve ? 'Resolve NCR' : g;
        html += '<button data-group="' + g + '" class="js-group w-full flex items-center p-4 rounded-lg min-h-[64px] shadow-sm group active:scale-95 transition ' + shell + '">' +
          '<div class="w-12 h-12 rounded flex items-center justify-center mr-4 ' + tile + '">' +
            '<span class="material-symbols-outlined text-[28px] ' + ico + '">' + m.icon + '</span></div>' +
          '<div class="flex flex-col items-start flex-grow">' +
            '<span class="font-interactive-label text-interactive-label font-bold">' + esc(lbl) + '</span>' +
            '<span class="font-body-sm text-body-sm ' + subc + '">' + esc(m.sub) + '</span></div>' +
          '<span class="material-symbols-outlined ' + chev + '">chevron_right</span></button>';
      });
      html += '</div>';
      sheet.innerHTML = html;
      document.getElementById('sheetClose').addEventListener('click', closeSheet);
    }

    // Level 2 — the chosen group's actions (back arrow → picker).
    function renderGroupActions(g){
      var inG = actionRegistry.actions.filter(function(a){ return a.group===g; });
      var html = '<div class="flex items-center gap-2 mb-4">' +
        '<button id="grpBack" class="material-symbols-outlined text-on-surface-variant">arrow_back</button>' +
        '<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">' + esc(g==='Resolve'?'Resolve':g) + '</h1>' +
        '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant ml-auto">close</button></div>' +
        '<div class="flex flex-col gap-base">';
      inG.forEach(function(a){
        var kindLabel = a.kind==='launch' ? 'Opens form' : a.kind==='checklist' ? 'Checklist' : 'Quick entry';
        html += '<button data-id="' + a.id + '" class="tile w-full bg-surface text-primary border border-outline-variant flex items-center p-4 rounded-lg min-h-[64px] hover:bg-surface-variant shadow-sm active:scale-95 transition text-left">' +
          '<div class="flex flex-col items-start flex-grow">' +
            '<span class="font-interactive-label text-interactive-label font-bold text-primary">' + esc(a.label) + '</span>' +

    function wireInlineSubmit(action){
      var onhandEl = document.getElementById('onhand');
      var matEl = document.getElementById('f_material'), fromEl = document.getElementById('f_fromLoc'), lotEl = document.getElementById('f_lot');
      function refreshOnHand(){
        if (!onhandEl || !matEl || !fromEl) return;
        var m = matEl.value, f = fromEl.value, lot = lotEl ? lotEl.value : '';
        if (!m || !f){ onhandEl.textContent=''; return; }
        onhandEl.textContent = 'On-hand at source: …';
        google.script.run.withSuccessHandler(function(bal){ onhandEl.textContent = 'On-hand at source: ' + bal; })
          .withFailureHandler(function(){ onhandEl.textContent=''; }).getOnHand(m, lot, f);
      }
      if (matEl) matEl.addEventListener('change', refreshOnHand);
      if (fromEl) fromEl.addEventListener('change', refreshOnHand);
      if (lotEl) lotEl.addEventListener('change', refreshOnHand);

      var btn = document.getElementById('submitAct');
      var origLabel = btn.textContent;
      btn.addEventListener('click', function(){
        var payload = { by: currentOp ? currentOp.name : '' }, ok = true;
        (action.fields||[]).forEach(function(f){ var el = document.getElementById('f_'+f.name); var v = el?el.value:''; payload[f.name]=v; if (f.type!=='text' && !v) ok=false; });
        if (!ok){ alert('Please fill all fields.'); return; }
        if (action.id==='move' && payload.fromLoc===payload.toLoc){ alert('Source and destination must differ.'); return; }
        btn.disabled = true; btn.textContent = 'Working…';
        google.script.run
          .withSuccessHandler(function(res){
            btn.disabled=false; btn.textContent=origLabel;
            if (res && res.success){ closeFull(); formData=null; loadBoard(); alert(action.label + ' done' + (res.transferId?' · '+res.transferId : res.scrapId?' · '+res.scrapId : res.sampleId?' · '+res.sampleId : res.issueId?' · '+res.issueId : '')); }
            else { alert('Failed: ' + ((res&&res.error)||'unknown error')); }
          })
          .withFailureHandler(function(err){ btn.disabled=false; btn.textContent=origLabel; alert('Error: ' + (err&&err.message?err.message:err)); })
          .runAction(action.id, payload);
      });
    }

    // ============ KPI Dashboard (Stitch 12-kpi-dashboard; wired to getQmsKpis) ============
    // Health: emerald on-target / red breached / amber warn / gray no-data — derived from value vs target.
    function kpiHealth(k){
      if (k.status === 'error' || k.value == null || k.value === '') return 'gray';
      var t = k.target;
      if (t == null || isNaN(Number(t))) return 'blue';        // no numeric target → informational
      var v = Number(k.value); t = Number(t);
      // For "lower is better" KPIs, target is a ceiling; others a floor. Heuristic by unit/key.
      var lowerBetter = /TAT|MTTR|REJECT|RETURN|AGED|DWELL|COST|CR_RATE|OTD|OPEN_NCR|ON_HOLD|WIP_AGEING|HOLD/i.test(k.key) || /d$|lots|u$/.test(k.unit||'');
      var ok = lowerBetter ? (v <= t) : (v >= t);
      var near = lowerBetter ? (v <= t*1.1) : (v >= t*0.9);
      return ok ? 'green' : (near ? 'amber' : 'red');
    }
    function kpiStrip(h){ return ({green:'#16a34a',amber:'#d97706',red:'#ba1a1a',blue:'#0070f3',gray:'#9ca3af'})[h]; }
    function kpiFmt(k){
      if (k.value == null || k.value === '') return '—';
      if (k.format === 'pct') return k.value + '%';
      if (k.format === 'text') return esc(String(k.value));
      return esc(String(k.value)) + (k.unit && k.unit.length<=3 ? esc(k.unit) : '');
    }
    // Sparkline SVG path from a numeric series (nulls skipped). Returns '' if <2 points.
    function kpiSparkPath(series){
      var pts = (series||[]).map(function(v,i){ return { i:i, v:(v==null||isNaN(v))?null:Number(v) }; }).filter(function(p){ return p.v!=null; });
      if (pts.length < 2) return '';
      var n = (series||[]).length - 1 || 1;
      var vals = pts.map(function(p){ return p.v; });
      var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), span = (mx-mn)||1;
      return pts.map(function(p, idx){
        var x = (p.i / n) * 100;
        var y = 18 - ((p.v - mn) / span) * 16; // 2..18 viewbox band
        return (idx?'L':'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      }).join(' ');
    }
    // Delta from the last two valid sparkline points (Stitch shows ▲/▼ + value).
    function kpiDelta(k){
      var s = (k.sparkline||[]).filter(function(v){ return v!=null && !isNaN(v); });
      if (s.length < 2) return null;
      var d = Math.round((s[s.length-1] - s[s.length-2]) * 10) / 10;
      if (!d) return null;
      return { up: d > 0, val: Math.abs(d) };
    }
    // Full-page KPI card (Stitch 12-kpi-dashboard).
    function kpiCard(k){
      var h = kpiHealth(k), strip = kpiStrip(h);
      var dlt = kpiDelta(k);
      var dColor = dlt ? (dlt.up ? '#16a34a' : '#ba1a1a') : '';
      var deltaHtml = dlt ? '<div class="flex items-center font-bold text-sm" style="color:' + dColor + '">' +
          '<span class="material-symbols-outlined text-[16px]">' + (dlt.up?'arrow_drop_up':'arrow_drop_down') + '</span><span>' + dlt.val + '</span></div>' : '';
      var path = kpiSparkPath(k.sparkline);
      var spark = path ? '<div class="mt-4 h-8 w-full opacity-70"><svg class="w-full h-full" viewBox="0 0 100 20" preserveAspectRatio="none" fill="none" stroke="' + strip + '" stroke-width="2"><path d="' + path + '"/></svg></div>'
                       : '<div class="mt-4 h-8 w-full"></div>';
      return '<button class="col-span-12 sm:col-span-6 lg:col-span-3 text-left bg-surface-container-lowest border border-outline-variant rounded-lg relative overflow-hidden flex flex-col p-4 pt-5 hover:-translate-y-1 hover:shadow-lg transition" ' +
          'style="border-top:4px solid ' + strip + ';">' +
        '<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-2 truncate">' + esc(k.label) + '</span>' +
        '<div class="flex items-baseline justify-between gap-2">' +
          '<span class="font-headline-md text-[32px] leading-none text-primary truncate">' + kpiFmt(k) + '</span>' + deltaHtml +
        '</div>' +
        (k.message ? '<div class="font-body-sm text-[11px] text-error mt-1 truncate">' + esc(k.message) + '</div>'
                   : '<div class="font-body-sm text-[11px] text-on-surface-variant mt-1">' + (k.target!=null && k.target!=='' ? 'Target ' + esc(String(k.target)) + esc(k.unit||'') : '&nbsp;') + '</div>') +
        spark +
      '</button>';
    }
    // KPI period filter. Engine presets (KpiConfig.js): TODAY, LAST_7, THIS_MONTH, THIS_FY.
    var KPI_PERIODS = [
      { preset:'TODAY',      label:'Day' },

    function kpiPersona(){ return currentRole === 'operator' ? 'Operator' : 'Manager'; }

    // Compact (drill) KPI card.
    function kpiCardCompact(k){
      var h = kpiHealth(k), strip = kpiStrip(h);
      return '<button class="text-left bg-surface-container-lowest border border-outline-variant rounded-lg p-3 flex flex-col gap-1 hover:shadow-md transition" style="border-left:4px solid ' + strip + ';">' +
        '<span class="font-label-caps text-[10px] text-on-surface-variant uppercase truncate">' + esc(k.label) + '</span>' +
        '<span class="font-headline-md text-[22px] leading-none text-primary truncate">' + kpiFmt(k) + '</span>' +
        (k.message ? '<span class="text-[10px] text-on-surface-variant truncate">' + esc(k.message) + '</span>'

      '</button>';

    function renderKpiDashboard(kpis){
      kpis = kpis || [];
      if (!kpis.length){ fullBody.innerHTML = '<div class="font-body-sm text-on-surface-variant text-center py-16">No KPIs available for this role.</div>'; return; }
      // Hero strip: emphasised tier across all categories.
      var heroes = kpis.filter(function(k){ return k.tier === 'hero'; });
      var heroHtml = heroes.length
        ? '<div class="grid grid-cols-12 gap-4 mb-6">' + heroes.map(kpiCard).join('') + '</div>' : '';
      // Per-category sections (drill cards).
      var sections = '';

      });
      // Trend panel: First-Pass Yield 7-day sparkline.
      var fpy = kpis.filter(function(k){ return k.key==='FPY'; })[0];
      var trendPath = fpy ? kpiSparkPath(fpy.sparkline) : '';
      var trend = '<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5">' +
          '<div class="font-headline-md text-headline-md text-primary mb-1">First-Pass Yield Trend</div>' +
          '<div class="font-body-sm text-body-sm text-on-surface-variant mb-4">Last 7 days</div>' +
          (trendPath ? '<div class="h-40 w-full"><svg class="w-full h-full" viewBox="0 0 100 20" preserveAspectRatio="none" fill="none" stroke="' + kpiStrip(kpiHealth(fpy||{})) + '" stroke-width="1.5"><path d="' + trendPath + '"/></svg></div>'
                     : '<div class="h-40 w-full grid place-items-center text-on-surface-variant font-body-sm">No trend data for this period.</div>') +
        '</div>';
      fullBody.innerHTML = '<div class="p-gutter md:p-margin-desktop">' +
        (heroes.length ? '<div class="flex items-center gap-2 mb-3"><span class="material-symbols-outlined text-[20px] text-primary">star</span><h3 class="font-headline-md text-headline-md text-on-surface">Key Metrics</h3></div>' : '') +
        heroHtml + sections + trend + '</div>';
    }
    function kpiPeriodBar(){
      return '<div id="kpiPeriodBar" class="flex items-center gap-1 bg-on-primary/10 rounded-full p-1">' +
        KPI_PERIODS.map(function(p){
          var on = p.preset === kpiPeriod;
          return '<button data-preset="' + p.preset + '" class="kpi-period-btn h-8 px-3 rounded-full text-[12px] font-medium transition ' +
            (on ? 'bg-on-primary text-primary shadow-sm' : 'text-on-primary/80') + '">' + p.label + '</button>';
        }).join('') + '</div>';
    }
    function loadKpis(){
      fullBody.innerHTML = '<div class="text-on-surface-variant text-[13px] py-16 text-center">Loading KPIs…</div>';
      google.script.run
        .withSuccessHandler(function(kpis){ renderKpiDashboard(kpis || []); })
        .withFailureHandler(function(err){ fullBody.innerHTML = '<div class="text-error text-[13px] py-16 text-center">KPIs unavailable: ' + esc(err&&err.message?err.message:err) + '</div>'; })
        .getQmsKpis(kpiPersona(), { preset: kpiPeriod });
    }
    function onKpiPeriodClick(e){
      var b = e.target.closest('.kpi-period-btn'); if (!b) return;
      kpiPeriod = b.getAttribute('data-preset');
      fullTopRight.innerHTML = kpiPeriodBar();
      var nb = document.getElementById('kpiPeriodBar'); if (nb) nb.addEventListener('click', onKpiPeriodClick);
      loadKpis();
    }
    function openKpiDashboard(){
      openFull('Quality KPIs', kpiPeriodBar());
      var bar = document.getElementById('kpiPeriodBar'); if (bar) bar.addEventListener('click', onKpiPeriodClick);
      loadKpis();
    }

    function openPutaway(){
      sheet.innerHTML = '<div class="text-on-surface-variant text-[13px] py-6 text-center">Loading putaway queue…</div>'; openSheet();
      google.script.run
        .withSuccessHandler(function(q){ renderPutaway(q || []); })
        .withFailureHandler(function(){ renderPutaway([]); })
        .getPutawayQueue();
    }

    function handlePick(id){
      var a = actionById(id); if (!a) return;
      if (a.kind==='launch'){ closeSheet(); launchForm(a.form); return; }
      if (a.kind==='checklist'){ openPutaway(); return; }
      openInlineForm(a);
    }

    function openPicker(){ renderPicker(); openSheet(); }
    document.getElementById('fab').addEventListener('click', openPicker);
    ['sideNew','newBtn'].forEach(function(id){ var b = document.getElementById(id); if (b) b.addEventListener('click', openPicker); });
    backdrop.addEventListener('click', function(e){ if (e.target===backdrop) closeSheet(); });
    sheet.addEventListener('click', function(e){
      var grp = e.target.closest('.js-group'); if (grp){ renderGroupActions(grp.getAttribute('data-group')); return; }
      var t = e.target.closest('.tile'); if (t) handlePick(t.getAttribute('data-id'));
    });

    // ============ nav buttons + module nav (full parity with old Landing menu) ============
    // type:'form' → launchForm(target) (returns to cockpit); 'kpi' → in-cockpit KPI view;
    // 'home' → old Landing; 'switch' → operator switcher.
    var NAV_ITEMS = [
      { icon:'space_dashboard', label:'KPIs',            kind:'kpi' },
      { icon:'account_tree',    label:'Trace',           kind:'form', target:'Trace' },
      { icon:'warehouse',       label:'Warehouse',       kind:'form', target:'Warehouse' },
      { icon:'map',             label:'Warehouse Floorplan', kind:'form', target:'WarehouseFloorplan' },
      { icon:'move_to_inbox',   label:'Putaway Queue',   kind:'form', target:'PutawayQueue' },
      { icon:'category',        label:'Masters',         kind:'form', target:'Masters' },
      { icon:'fact_check',      label:'Control Plan',    kind:'form', target:'ControlPlan' },
      { icon:'receipt_long',    label:'Purchase Orders', kind:'form', target:'PO' },
      { icon:'assignment_return', label:'Customer Returns', kind:'form', target:'CustomerReturn' },
      { icon:'upload_file',     label:'Import CSV',      kind:'form', target:'ImportCSV' },
      { icon:'settings',        label:'Settings',        kind:'form', target:'Settings' },
      { icon:'switch_account',  label:'Switch role',     kind:'switch' },
      { icon:'home',            label:'Classic Home',    kind:'home' }
    ];
    function navGo(item){
      closeNavMenu();
      if (item.kind==='kpi'){ openKpiDashboard(); return; }
      if (item.kind==='home'){ launchForm('Landing'); return; }
      if (item.kind==='switch'){ var sw=document.getElementById('opSwitch'); if (sw) sw.click(); return; }
      launchForm(item.target);
    }
    // Row form (mobile drawer) — icon + label.
    function navRowHtml(item){
      return '<button class="js-nav w-full flex items-center gap-3 px-3 h-12 rounded text-on-surface hover:bg-surface-container-low active:scale-[0.99] transition text-left" data-nav="' + esc(item.label) + '">' +
        '<span class="material-symbols-outlined text-[20px] text-on-surface-variant">' + item.icon + '</span>' +
        '<span class="font-interactive-label text-interactive-label">' + esc(item.label) + '</span></button>';
    }
    // Icon form (top tools bar) — compact icon tile + tiny label, horizontal scroll.
    function navIconHtml(item){
      return '<button class="js-nav shrink-0 flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 px-2 rounded hover:bg-surface-container-low active:scale-95 transition" data-nav="' + esc(item.label) + '" title="' + esc(item.label) + '">' +
        '<span class="material-symbols-outlined text-[20px] text-primary">' + item.icon + '</span>' +
        '<span class="font-label-caps text-[10px] uppercase tracking-wide text-on-surface-variant whitespace-nowrap">' + esc(item.label) + '</span></button>';
    }
    function bindNav(host, mode){
      if (!host) return;
      host.innerHTML = NAV_ITEMS.map(function(it){ return mode==='icon' ? navIconHtml(it) : navRowHtml(it); }).join('');
      Array.prototype.forEach.call(host.querySelectorAll('.js-nav'), function(b){
        b.addEventListener('click', function(){
          var it = NAV_ITEMS.filter(function(x){ return x.label===b.getAttribute('data-nav'); })[0];
          if (it) navGo(it);
        });
      });
    }
    function renderNav(){ bindNav(document.getElementById('toolsBarInner'), 'icon'); bindNav(document.getElementById('navMenu'), 'row'); }
    renderNav();

    // Mobile nav drawer open/close
    var navBd = document.getElementById('navMenuBackdrop');
    function openNavMenu(){ if (navBd) navBd.classList.remove('hidden'); }
    function closeNavMenu(){ if (navBd) navBd.classList.add('hidden'); }
    var nmb = document.getElementById('navMenuBtn'); if (nmb) nmb.addEventListener('click', openNavMenu);
    var nmc = document.getElementById('navMenuClose'); if (nmc) nmc.addEventListener('click', closeNavMenu);
    if (navBd) navBd.addEventListener('click', function(e){ if (e.target===navBd) closeNavMenu(); });

    document.getElementById('homeBtn').addEventListener('click', function(){ launchForm('Landing'); });
    document.getElementById('bnHome').addEventListener('click', function(){ launchForm('Landing'); });
    document.getElementById('bnWarehouse').addEventListener('click', function(){ launchForm('Warehouse'); });
    document.getElementById('bnTrace').addEventListener('click', function(){ launchForm('Trace'); });
    document.getElementById('bnKpi').addEventListener('click', openKpiDashboard);

    // ============ init ============
    (function init(){
      paintFilters(); paintViewSwitch(); paintRangeSwitch();
      google.script.run.withSuccessHandler(function(reg){ actionRegistry = reg; }).getQmsv2Actions();
      google.script.run
        .withSuccessHandler(function(map){ roleStageMap = map || {}; loadOperators(); })
        .withFailureHandler(function(){ roleStageMap = {}; loadOperators(); })
        .getRoleStageMap();
    })();
  </script>
</body>
</html>
