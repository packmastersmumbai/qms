<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cockpit — Pack Masters QMS</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Public+Sans:wght@500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <script>
    // VERBATIM from the Stitch design-system "Industrial Quality Management System"
    // (asset f1c072ac30ee4901b96547757f18a349) design-md. Do NOT hand-tune these —
    // primary is #000747 (NOT #0d1b6e; that is primary-container). See DESIGN.md authority.
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          "surface": "#f9f9ff",
          "surface-dim": "#d3daea",
          "surface-bright": "#f9f9ff",
          "surface-container-lowest": "#ffffff",
          "surface-container-low": "#f0f3ff",
          "surface-container": "#e7eefe",
          "surface-container-high": "#e2e8f8",
          "surface-container-highest": "#dce2f3",
          "on-surface": "#151c27",
          "on-surface-variant": "#454651",
          "inverse-surface": "#2a313d",
          "inverse-on-surface": "#ebf1ff",
          "outline": "#767682",
          "outline-variant": "#c6c5d3",
          "surface-tint": "#4c57a9",
          "primary": "#000747",
          "on-primary": "#ffffff",
          "primary-container": "#0d1b6e",
          "on-primary-container": "#7c88dc",
          "inverse-primary": "#bbc3ff",
          "secondary": "#0057c0",
          "on-secondary": "#ffffff",
          "secondary-container": "#006ff0",
          "on-secondary-container": "#fefcff",
          "tertiary": "#2a0500",
          "on-tertiary": "#ffffff",
          "tertiary-container": "#4e1000",
          "on-tertiary-container": "#d27458",
          "error": "#ba1a1a",
          "on-error": "#ffffff",
          "error-container": "#ffdad6",
          "on-error-container": "#93000a",
          "primary-fixed": "#dfe0ff",
          "primary-fixed-dim": "#bbc3ff",
          "on-primary-fixed": "#000d60",
          "on-primary-fixed-variant": "#333f8f",
          "secondary-fixed": "#d8e2ff",
          "secondary-fixed-dim": "#aec6ff",
          "on-secondary-fixed": "#001a43",
          "on-secondary-fixed-variant": "#004397",
          "background": "#f9f9ff",
          "on-background": "#151c27",
          "surface-variant": "#dce2f3",
          "pass": "#16a34a",
          "warn": "#d97706"
        },
        borderRadius: { "sm": "0.25rem", "DEFAULT": "0.5rem", "md": "0.75rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
        spacing: { "base": "8px", "touch-target-min": "48px", "gutter": "16px", "margin-mobile": "16px", "margin-desktop": "32px", "pipeline-gap": "4px" },
        fontFamily: {
          "display": ["Plus Jakarta Sans", "system-ui", "sans-serif"],
          "headline": ["Plus Jakarta Sans", "system-ui", "sans-serif"],
          "label-caps": ["Public Sans", "system-ui", "sans-serif"],
          "interactive": ["Public Sans", "system-ui", "sans-serif"],
          "body": ["Inter", "system-ui", "sans-serif"],
          "mono": ["JetBrains Mono", "monospace"]
        },
        fontSize: {
          "display-lg": ["32px", { lineHeight: "40px", fontWeight: "700", letterSpacing: "-0.02em" }],
          "display-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
          "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
          "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
          "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
          "label-caps": ["12px", { lineHeight: "16px", fontWeight: "700", letterSpacing: "0.05em" }],
          "interactive-label": ["16px", { lineHeight: "24px", fontWeight: "500" }]
        }
      }}
    };
  </script>
  <style>
    body { min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* staggered card reveal */
    @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card-in { animation: cardIn .28s cubic-bezier(.2,.7,.3,1) both; }
  </style>
</head>
<body class="bg-background text-on-background font-body text-[14px] flex flex-col h-screen">

  <!-- Top bar -->
  <header class="bg-primary text-on-primary flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-touch-target-min sticky top-0 z-50 shrink-0">
    <button id="homeBtn" class="flex items-center gap-2 font-headline text-[18px] font-bold active:scale-95 transition-transform" title="Back to Home">
      <span class="material-symbols-outlined">arrow_back</span>
      <span class="hidden sm:inline">PM QMS</span>
      <span class="text-on-primary/60 text-[12px] font-body font-medium hidden md:inline">v2 · Cockpit</span>
    </button>
    <div class="flex items-center gap-2">
      <span id="whoRole" class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-primary/60"></span>
      <div class="flex items-center bg-primary-container rounded-full pl-3 pr-1 py-1 gap-1 border border-white/20">
        <span class="material-symbols-outlined text-[18px] text-on-primary/70">person</span>
        <select id="opSelect" aria-label="Select operator"
          class="bg-transparent text-on-primary text-[13px] font-medium border-0 focus:ring-0 py-1 pr-7 max-w-[130px] cursor-pointer">
          <option value="">Loading…</option>
        </select>
      </div>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">

    <!-- Side nav (desktop) — Stitch desktop sidebar (01b) -->
    <nav class="hidden md:flex flex-col h-full w-64 bg-surface border-r border-outline-variant shrink-0 p-gutter pt-4">
      <div class="flex items-center gap-3 px-4 mb-6">
        <div class="w-10 h-10 rounded bg-primary-container text-on-primary grid place-items-center font-display font-extrabold text-[18px]">PM</div>
        <div>
          <h2 class="font-headline-md text-headline-md font-extrabold text-primary leading-none">PM QMS v2</h2>
          <p class="font-body-sm text-body-sm text-on-surface-variant">Quality Cockpit</p>
        </div>
      </div>
      <!-- Search -->
      <div class="relative px-2 mb-4">
        <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
        <input id="boardSearch" type="text" placeholder="Find lot / GRN"
          class="w-full h-11 pl-10 pr-4 bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary text-sm transition-all">
      </div>
      <!-- Doc-type nav -->
      <div id="sideTabs" class="flex-1 overflow-y-auto flex flex-col gap-1 px-2"></div>
      <!-- Footer: My Work/All + persona + New -->
      <div class="mt-auto px-2 pt-4 border-t border-outline-variant flex flex-col gap-3">
        <div class="flex bg-surface-container p-1 rounded">
          <button id="myWorkBtn" class="flex-1 py-2 text-sm font-medium bg-surface shadow-sm rounded text-primary flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">person</span>My Work</button>
          <button id="allBtn" class="flex-1 py-2 text-sm font-medium text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">groups</span>All</button>
        </div>
        <div class="w-full flex items-center justify-between p-2 rounded border border-outline-variant bg-surface">
          <div class="flex items-center gap-2 overflow-hidden">
            <div class="w-8 h-8 rounded-full bg-primary-container text-on-primary grid place-items-center shrink-0"><span class="material-symbols-outlined text-[18px]">person</span></div>
            <div class="text-left flex flex-col min-w-0">
              <span id="sideOpName" class="text-sm font-bold text-on-surface truncate">—</span>
              <span id="sideOpRole" class="text-xs text-on-surface-variant truncate">—</span>
            </div>
          </div>
          <button id="opSwitch" class="material-symbols-outlined text-on-surface-variant text-[20px]" title="Switch operator">unfold_more</button>
        </div>
        <button id="sideNew" class="w-full h-touch-target-min bg-primary text-on-primary rounded font-bold flex items-center justify-center gap-2 hover:bg-opacity-90 transition-all shadow-sm">
          <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">add</span> New
        </button>
      </div>
    </nav>

    <!-- Main -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-background">

      <!-- Desktop title bar (Stitch): doc name + Active chip + Filter/Export -->
      <header class="hidden md:flex justify-between items-center px-margin-desktop py-4 bg-surface border-b border-outline-variant shrink-0">
        <h2 class="font-display-lg text-display-lg text-on-surface flex items-center gap-3">
          <span id="boardTitle">Board</span>
          <span id="boardActive" class="bg-surface-container-high text-on-surface-variant text-sm px-2 py-1 rounded font-medium">0 Active</span>
        </h2>
        <div class="flex gap-2">
          <button id="selectToggle" class="h-touch-target-min px-4 border border-outline-variant bg-surface text-primary rounded font-medium flex items-center gap-2 hover:bg-surface-container-low transition-colors">
            <span class="material-symbols-outlined">checklist</span> Select</button>
          <button id="urgentToggle" class="h-touch-target-min px-4 border border-outline-variant bg-surface text-primary rounded font-medium flex items-center gap-2 hover:bg-surface-container-low transition-colors">
            <span class="material-symbols-outlined">filter_list</span> <span id="urgentLabel">Urgent</span></button>
        </div>
      </header>

      <!-- Mobile doc-type tabs + filter pills -->
      <div class="md:hidden sticky top-0 bg-background/95 backdrop-blur z-30 border-b border-outline-variant">
        <div class="px-margin-mobile py-3 flex items-center justify-between gap-2">
          <div id="filterRow" class="inline-flex bg-surface-container-high rounded-full p-1 border border-outline-variant/50 gap-0.5">
            <button data-filter="all" class="filter-pill px-4 py-1.5 rounded-full text-[14px] font-medium transition">All</button>
            <button data-filter="urgent" class="filter-pill px-4 py-1.5 rounded-full text-[14px] font-medium transition">Urgent</button>
          </div>
          <button id="selectToggleM" class="flex items-center gap-1.5 px-3 h-9 rounded-full border border-outline-variant text-[13px] font-semibold text-on-surface-variant hover:bg-surface-variant transition">
            <span class="material-symbols-outlined text-[18px]">checklist</span><span class="hidden sm:inline">Select</span>
          </button>
        </div>
        <div id="tabRow" class="px-margin-mobile flex overflow-x-auto hide-scrollbar border-t border-outline-variant/30"></div>
      </div>

      <!-- Kanban board area (horizontal columns) -->
      <div id="qmsv2Root" class="flex-1 overflow-x-auto overflow-y-hidden p-gutter md:p-margin-desktop pb-28 md:pb-8">
        <div class="text-on-surface-variant text-[14px] text-center py-16">Loading board…</div>
      </div>
    </main>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center h-[68px] px-margin-mobile bg-surface-container-highest border-t border-outline-variant z-40 shadow-[0_-2px_8px_rgba(21,28,39,.06)]">
    <button id="bnHome" class="flex flex-col items-center justify-center text-on-surface-variant min-w-[56px] gap-0.5">
      <span class="material-symbols-outlined">home</span><span class="text-[10px] font-label-caps">Home</span>
    </button>
    <button id="bnRecords" class="flex flex-col items-center justify-center text-on-surface-variant min-w-[56px] gap-0.5">
      <span class="material-symbols-outlined">history</span><span class="text-[10px] font-label-caps">Records</span>
    </button>
    <div class="w-14"></div>
    <button id="bnTrace" class="flex flex-col items-center justify-center text-on-surface-variant min-w-[56px] gap-0.5">
      <span class="material-symbols-outlined">analytics</span><span class="text-[10px] font-label-caps">Trace</span>
    </button>
    <button id="bnKpi" class="flex flex-col items-center justify-center text-on-surface-variant min-w-[56px] gap-0.5">
      <span class="material-symbols-outlined">insert_chart</span><span class="text-[10px] font-label-caps">KPIs</span>
    </button>
  </nav>

  <!-- Multi-select action bar (shown only in select mode) -->
  <!-- Multi-select action bar — verbatim Stitch (Multi-Select Batch Mode) -->
  <div id="selectBar" class="hidden fixed bottom-0 left-0 w-full md:left-60 md:w-[calc(100%-15rem)] z-50 bg-primary text-on-primary px-margin-mobile h-touch-target-min flex items-center justify-between gap-3 shadow-[0_-2px_12px_rgba(0,7,71,.35)]">
    <div class="flex items-center gap-3">
      <button id="selectCancel" class="material-symbols-outlined w-touch-target-min h-touch-target-min flex items-center justify-center -ml-2 hover:bg-primary-container rounded-full transition-colors">close</button>
      <span id="selectCount" class="font-interactive-label text-interactive-label font-bold">0 Selected</span>
    </div>
    <div class="flex items-center gap-1">
      <button id="selectAll" class="h-10 px-3 rounded-full bg-on-primary/10 font-label-caps text-label-caps active:scale-95 transition">Select all</button>
      <button id="selectAction" class="h-10 px-4 ml-1 rounded-full bg-on-primary text-primary font-interactive-label text-interactive-label font-bold active:scale-95 transition disabled:opacity-50" disabled>Batch action</button>
      <button id="selectShare" class="material-symbols-outlined w-10 h-10 flex items-center justify-center hover:bg-primary-container rounded-full transition-colors">ios_share</button>
      <button id="selectMore" class="material-symbols-outlined w-10 h-10 flex items-center justify-center hover:bg-primary-container rounded-full transition-colors">more_vert</button>
    </div>
  </div>

  <!-- FAB (mobile) -->
  <button id="fab" aria-label="New action"
    class="md:hidden fixed bottom-[52px] left-1/2 -translate-x-1/2 w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg grid place-items-center z-50 active:scale-95 transition border-4 border-background">
    <span class="material-symbols-outlined text-[28px]" style="font-variation-settings:'FILL' 1;">add</span>
  </button>

  <!-- Action sheet / inline form -->
  <div id="sheetBackdrop" class="fixed inset-0 z-[60] bg-on-background/40 hidden items-end md:items-center justify-center">
    <div id="sheet" class="bg-surface-container-lowest w-full max-w-lg max-h-[86vh] overflow-y-auto rounded-t-2xl md:rounded-2xl p-5 pb-8"></div>
  </div>

  <script>
    // ============ data + state ============
    var LS_KEY = 'pmQmsOperator';
    var DOC_TYPES = ['GRN','IQC','IPQC','OQC','Dispatch','Production','NCR'];
    var TAB_ICONS = { GRN:'inventory_2', IQC:'biotech', IPQC:'precision_manufacturing', OQC:'verified', Dispatch:'local_shipping', Production:'factory', NCR:'report_problem' };
    var STAGE_LABELS = ['GRN','IQC','PUTAWAY','ISSUE','OQC','DISP'];
    var STAGE_SHORT  = ['GRN','IQC','PUT','ISS','OQC','DISP'];
    var DOC_TITLES = { GRN:'Goods Receipt Notes (GRN)', IQC:'Incoming QC (IQC)', IPQC:'In-Process QC (IPQC)', OQC:'Outgoing QC (OQC)', Dispatch:'Dispatch', Production:'Production Jobs', NCR:'Non-Conformance (NCR)' };

    var roleStageMap = null, operators = [], currentOp = null;
    var currentRole = 'manager', currentType = 'GRN', currentFilter = 'all';
    var actionRegistry = null, formData = null, lastBoard = null;

    var root = document.getElementById('qmsv2Root');
    var sel = document.getElementById('opSelect');
    var roleEl = document.getElementById('whoRole');
    var tabRow = document.getElementById('tabRow');
    var sideTabs = document.getElementById('sideTabs');
    var backdrop = document.getElementById('sheetBackdrop');
    var sheet = document.getElementById('sheet');

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function primaryTabFor(role){ var t = roleStageMap && roleStageMap[role]; return (t && t.length) ? t[0] : 'GRN'; }

    // ============ navigation (full-page swap; navigateTo not in form scope) ============
    function launchForm(formName){
      google.script.run
        .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
        .withFailureHandler(function(){ alert('Could not open ' + formName); })
        .getFormHtml(formName);
    }

    // ============ tabs ============
    function tabBtn(t, mobile){
      var active = t === currentType;
      var b = document.createElement('button');
      if (mobile){
        b.className = 'min-w-fit px-4 h-touch-target-min flex items-center gap-1.5 text-[14px] font-medium whitespace-nowrap border-b-2 ' +
          (active ? 'text-primary border-primary font-semibold' : 'text-on-surface-variant border-transparent');
      } else {
        b.className = 'flex items-center gap-3 px-3 h-11 rounded-lg transition ' +
          (active ? 'bg-secondary-container/15 text-primary font-bold' : 'text-on-surface-variant hover:bg-surface-container-low');
      }
      b.innerHTML = '<span class="material-symbols-outlined text-[20px]">' + (TAB_ICONS[t]||'tab') + '</span>' +
        '<span class="font-label-caps text-[14px]">' + t + '</span>';
      b.addEventListener('click', function(){ currentType = t; renderTabs(); loadBoard(); });
      return b;
    }
    function renderTabs(){
      tabRow.innerHTML = ''; sideTabs.innerHTML = '';
      DOC_TYPES.forEach(function(t){ tabRow.appendChild(tabBtn(t, true)); sideTabs.appendChild(tabBtn(t, false)); });
    }

    // ============ mini segmented pipeline bar — Stitch desktop card (01b) ============
    function pipelineHtml(stage){
      var n = STAGE_LABELS.length;
      var segs = '', labels = '';
      for (var i = 0; i < n; i++){
        var done = i < stage, on = i === stage;
        segs += '<div class="' + (done||on ? 'bg-primary-container' : 'bg-outline') + ' w-1/6' + (i < n-1 ? ' border-r border-surface' : '') + '"></div>';
        labels += '<span class="' + (on ? 'font-bold text-primary' : '') + '">' + STAGE_SHORT[i] + '</span>';
      }
      return '<div class="w-full flex h-1.5 rounded-full overflow-hidden bg-surface-container-high mb-3 mt-3">' + segs + '</div>' +
        '<div class="flex justify-between text-[10px] text-on-surface-variant font-medium uppercase tracking-wide">' + labels + '</div>';
    }

    // tone -> status accent strip color (Stitch desktop)
    function stripColor(tone, overdue){
      if (overdue) return 'bg-error';
      if (tone === 'pass') return 'bg-[#16a34a]';
      if (tone === 'prog') return 'bg-secondary';
      return 'bg-tertiary-fixed-dim';
    }
    // Stitch desktop card: docNo top-left, OVERDUE/age top-right, name, supplier, mini pipeline.
    function cardHtml(card, tone, idx){
      var age = card.ageDays != null ? (card.ageDays + 'd ago') : '';
      var topRight = card.overdue
        ? '<span class="text-xs font-bold text-error bg-error-container px-1.5 py-0.5 rounded">OVERDUE</span>'
        : (age ? '<span class="text-xs text-on-surface-variant">' + age + '</span>' : '');
      return '<button type="button" class="js-card card-in text-left w-full bg-surface border border-outline-variant rounded shadow-sm hover:shadow-md transition-shadow relative overflow-hidden cursor-pointer p-4" ' +
        'data-doc="' + esc(card.docNo) + '" data-stage="' + (card.stage||0) + '" data-status="' + esc(card.status) + '" data-name="' + esc(card.name||'') + '" ' +
        'style="animation-delay:' + (idx*30) + 'ms">' +
        '<div class="absolute left-0 top-0 bottom-0 w-1 ' + stripColor(tone, card.overdue) + '"></div>' +
        '<div class="flex justify-between items-start mb-2 pl-1">' +
          '<span class="font-label-caps text-label-caps text-primary tracking-wider">' + esc(card.docNo) + '</span>' +
          topRight +
        '</div>' +
        '<h4 class="font-interactive-label text-interactive-label text-on-surface mb-1 pl-1 truncate">' + esc(card.name || '—') + '</h4>' +
        '<p class="font-body-sm text-body-sm text-on-surface-variant mb-1 pl-1">' + esc(card.status) + '</p>' +
        pipelineHtml(card.stage || 0) +
      '</button>';
    }

    var searchTerm = '';
    function applyFilter(cards){
      var out = currentFilter === 'urgent' ? cards.filter(function(c){ return c.overdue; }) : cards;
      if (searchTerm){ out = out.filter(function(c){ return ((c.docNo||'') + ' ' + (c.name||'')).toLowerCase().indexOf(searchTerm) !== -1; }); }
      return out;
    }

    // One kanban column: header (dot + title + count) + scrollable card area.
    function columnHtml(title, dotColor, cards, tone, startIdx){
      var inner = cards.length
        ? cards.map(function(c, i){ return cardHtml(c, tone, startIdx + i); }).join('')
        : '<div class="flex flex-col items-center justify-center text-center text-on-surface-variant/60 py-12 gap-2">' +
          '<span class="material-symbols-outlined text-3xl">inbox</span><span class="text-sm">Nothing here</span></div>';
      return '<div class="w-80 md:w-auto flex flex-col h-full bg-surface-container-lowest border border-outline-variant rounded-lg shrink-0">' +
        '<div class="p-3 border-b border-outline-variant flex justify-between items-center bg-surface-bright rounded-t-lg">' +
          '<h3 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">' +
            '<div class="w-3 h-3 rounded-full ' + dotColor + '"></div>' + title + '</h3>' +
          '<span class="text-on-surface-variant font-medium bg-surface-container px-2 py-0.5 rounded text-sm">' + cards.length + '</span>' +
        '</div>' +
        '<div class="flex-1 overflow-y-auto p-2 space-y-3">' + inner + '</div></div>';
    }

    // Split server's {pending,inProgress,done} into Stitch's 4 columns.
    // Completed = done but not terminal-released; Verified = released/dispatched/verified.
    function splitColumns(board){
      var c = board.columns;
      var pending = applyFilter(c.pending);
      var inProg = applyFilter(c.inProgress);
      var doneAll = applyFilter(c.done);
      var verified = doneAll.filter(function(x){ return /RELEAS|DISPATCH|VERIFI/i.test(x.status||''); });
      var completed = doneAll.filter(function(x){ return !/RELEAS|DISPATCH|VERIFI/i.test(x.status||''); });
      return { pending: pending, inProgress: inProg, completed: completed, verified: verified };
    }

    function renderBoard(board){
      var s = splitColumns(board);
      var i = 0, html = '<div class="flex gap-gutter h-full min-w-max md:min-w-0 md:grid md:grid-cols-4">';
      html += columnHtml('Pending',     'bg-outline',  s.pending,    'pending', i); i += s.pending.length;
      html += columnHtml('In Progress', 'bg-secondary',s.inProgress, 'prog',    i); i += s.inProgress.length;
      html += columnHtml('Completed',   'bg-outline',  s.completed,  'prog',    i); i += s.completed.length;
      html += columnHtml('Verified',    'bg-[#16a34a]',s.verified,   'pass',    i);
      html += '</div>';
      root.innerHTML = html;

      google.script.run

        .withFailureHandler(function(err){ root.innerHTML = '<div class="text-error text-[13px] text-center py-12">Board load failed: ' + esc(err && err.message ? err.message : err) + '</div>'; })

    // ============ pipeline detail (card tap) ============
    // Reuses the existing Trace engine (traceBatch) — no new server code.
    function traceLane(title, rows, render){
      if (!rows || !rows.length) return '';
      return '<div class="mt-4"><div class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-surface-variant mb-2">' + title + '</div>' +
        '<div class="flex flex-col gap-1.5">' + rows.map(render).join('') + '</div></div>';

    function laneRow(docNo, sub, badge){
      return '<div class="flex items-center justify-between gap-2 px-3 py-2 bg-surface-container-low rounded-lg">' +
        '<div class="min-w-0"><div class="font-mono text-[12px] text-on-surface">' + esc(docNo) + '</div>' +
        (sub ? '<div class="text-[11px] text-on-surface-variant truncate">' + esc(sub) + '</div>' : '') + '</div>' +
        (badge ? '<span class="font-label-caps text-[9px] font-bold uppercase px-2 py-0.5 rounded bg-secondary-container/15 text-secondary shrink-0">' + esc(badge) + '</span>' : '') +
        '</div>';
    }
    function renderDetail(meta, trace){
      var t = trace || {};
      var up = (t.upstream && t.upstream.components) || [];
      var ipqc = (t.thisBatch && t.thisBatch.ipqc) || [];
      var dn = t.downstream || {};
      var iss = t.issues || {};
      var html = '<div class="flex justify-between items-start mb-1">' +
        '<div><span class="font-label-caps text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-secondary-container/15 text-secondary">' + esc(meta.status) + '</span>' +
        '<div class="font-mono text-[15px] font-semibold text-on-surface mt-1">' + esc(meta.doc) + '</div></div>' +
        '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant">close</button></div>' +
        '<p class="text-[13px] text-on-surface-variant mb-3">' + esc(meta.name || '—') + '</p>' +
        '<div class="bg-surface-container-low rounded-lg p-3">' + pipelineHtml(meta.stage) + '</div>';

      if (!trace || trace.success === false){
        html += '<div class="text-[12px] text-on-surface-variant mt-4">Trace unavailable.</div>';
      } else {
        // Field names verified against Trace.js _computeTrace_ shapes.
        html += traceLane('Upstream components', up, function(c){
          var sub = (c.compDesc || '') + (c.totalIssued != null ? ' · ' + c.totalIssued + ' ' + (c.unit||'') : '');
          return laneRow(c.compCode || '—', sub, c.type); });
        html += traceLane('IPQC rounds', ipqc, function(r){ return laneRow(r.docNo, (r.inspector ? r.inspector + ' · ' : '') + (r.rounds ? r.rounds + ' rounds' : ''), r.status); });
        html += traceLane('Downstream · OQC', dn.oqc || [], function(r){ return laneRow(r.docNo, r.customer || '', r.status); });
        html += traceLane('Downstream · Dispatch', dn.dispatch || [], function(r){ return laneRow(r.docNo, r.customer || '', r.status); });
        html += traceLane('Downstream · FG jobs', dn.fgJobs || [], function(r){ return laneRow(r.jobId, (r.fgCode || '') + (r.fgDesc ? ' · ' + r.fgDesc : ''), r.status); });
        html += traceLane('Issues · NCR', iss.ncr || [], function(r){ return laneRow(r.docNo, r.source || '', r.status); });
        html += traceLane('Issues · Returns', iss.customerReturn || [], function(r){ return laneRow(r.docNo, r.customer || '', r.status); });
        var hasAny = up.length || ipqc.length || (dn.oqc||[]).length || (dn.dispatch||[]).length || (dn.fgJobs||[]).length || (iss.ncr||[]).length || (iss.customerReturn||[]).length;
        if (!hasAny) html += '<div class="text-[12px] text-on-surface-variant mt-4">No linked records in trace window.</div>';
      }
      sheet.innerHTML = html;
      document.getElementById('sheetClose').addEventListener('click', closeSheet);
    }
    function openDetail(meta){
      sheet.innerHTML = '<div class="flex justify-between items-center mb-3"><h2 class="font-headline text-[18px] font-bold">' + esc(meta.doc) + '</h2>' +
        '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant">close</button></div>' +
        '<div class="text-on-surface-variant text-[13px] py-6 text-center">Loading trace…</div>';
      openSheet();
      var x = document.getElementById('sheetClose'); if (x) x.addEventListener('click', closeSheet);
      google.script.run
        .withSuccessHandler(function(trace){ renderDetail(meta, trace); })

    // ============ multi-select (Stitch Batch Mode; SHELL — batch write is P2) ============
    var selectMode = false;
    var selected = {};   // docNo -> true
    var selBar = document.getElementById('selectBar');

    function selCount(){ return Object.keys(selected).length; }
    function paintSelection(){
      var n = selCount();
      document.getElementById('selectCount').textContent = n + ' Selected';
      var act = document.getElementById('selectAction'); act.disabled = n === 0;
      Array.prototype.forEach.call(root.querySelectorAll('.js-card'), function(c){

    function enterSelectMode(){
      selectMode = true; selected = {};

    // Desktop "Urgent" Filter button mirrors the mobile filter pill.

    // ============ identity ============
    function applyOperator(op){
      currentOp = op;
      currentRole = (op && op.cockpitRole) || 'manager';

      roleEl.textContent = currentRole;

      var srl = document.getElementById('sideOpRole'); if (srl) srl.textContent = op ? ((op.role || currentRole) + '') : '—';
      try { if (op) localStorage.setItem(LS_KEY, op.name); } catch(e){}

    // Sidebar "switch operator" focuses the (topbar) select dropdown.
    (function(){ var sw = document.getElementById('opSwitch'); if (sw) sw.addEventListener('click', function(){ try { sel.focus(); sel.click(); } catch(e){} }); })();
    sel.addEventListener('change', function(){
      var op = operators.filter(function(o){ return o.name === sel.value; })[0];
      if (op) applyOperator(op);
    });
    function loadOperators(){
      google.script.run
        .withSuccessHandler(function(ops){
          operators = ops || []; sel.innerHTML = '';
          if (!operators.length){ sel.innerHTML = '<option value="">No operators</option>'; return; }
          operators.forEach(function(o){ var opt = document.createElement('option'); opt.value=o.name; opt.textContent=o.name; sel.appendChild(opt); });
          var saved = null; try { saved = localStorage.getItem(LS_KEY); } catch(e){}
          var chosen = (saved && operators.filter(function(o){ return o.name===saved; })[0]) || operators[0];
          sel.value = chosen.name; applyOperator(chosen);
        })
        .withFailureHandler(function(err){ root.innerHTML = '<div class="text-error text-center py-12">Operator load failed: ' + esc(err && err.message) + '</div>'; })
        .getQmsv2Operators();
    }

    // ============ filter pills ============
    function paintFilters(){
      Array.prototype.forEach.call(document.querySelectorAll('.filter-pill'), function(p){
        var on = p.getAttribute('data-filter') === currentFilter;
        p.className = 'filter-pill px-4 py-1.5 rounded-full text-[14px] font-medium transition ' +

    document.getElementById('filterRow').addEventListener('click', function(e){

    // Sidebar search — re-render the cached board (no re-fetch).
    (function(){
      var si = document.getElementById('boardSearch');
      if (si) si.addEventListener('input', function(){ searchTerm = si.value.trim().toLowerCase(); if (lastBoard) renderBoard(lastBoard); });
    })();
    // My Work / All toggle (sidebar) — All clears the role-tab default emphasis.
    (function(){
      var mw = document.getElementById('myWorkBtn'), al = document.getElementById('allBtn');
      function paintMW(active){
        if (!mw || !al) return;

        al.className = 'flex-1 py-2 text-sm font-medium flex items-center justify-center gap-2 rounded ' + (!active ? 'bg-surface shadow-sm text-primary' : 'text-on-surface-variant hover:text-on-surface');
      }
      if (mw) mw.addEventListener('click', function(){ paintMW(true); currentType = primaryTabFor(currentRole); renderTabs(); loadBoard(); });

    // ============ action picker ============
    function openSheet(){ backdrop.classList.remove('hidden'); backdrop.classList.add('flex'); }
    function closeSheet(){ backdrop.classList.add('hidden'); backdrop.classList.remove('flex'); sheet.innerHTML=''; }

    // Group metadata — verbatim from Stitch 02-action-picker (icon + subtitle).
    var GROUP_META = {
      Receive: { icon:'inventory',                sub:'Inbound materials & GRN' },
      Inspect: { icon:'biotech',                  sub:'IQC, IPQC, OQC forms' },
      Make:    { icon:'precision_manufacturing',  sub:'Production runs & batches' },
      Ship:    { icon:'local_shipping',           sub:'Dispatch & logistics' },
      Move:    { icon:'swap_horiz',               sub:'Internal transfers & putaway' },
      Resolve: { icon:'report_problem',           sub:'Address non-conformances' }
    };

    // Level 1 — group rows (verbatim Stitch markup; Receive=navy fill, Resolve=error).
    function renderPicker(){
      if (!actionRegistry){ sheet.innerHTML = '<h2 class="font-display-lg-mobile text-display-lg-mobile text-primary">Loading…</h2>'; return; }
      var html = '<div class="flex justify-between items-start mb-4"><div>' +
        '<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-1">Quick Actions</h1>' +
        '<p class="font-body-sm text-body-sm text-on-surface-variant">Select an operation to begin.</p></div>' +
        '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant">close</button></div>' +
        '<div class="flex flex-col gap-base">';

        var inG = actionRegistry.actions.filter(function(a){ return a.group===g; });

                  : 'bg-surface text-primary border border-outline-variant hover:bg-surface-variant';
        var tile = isReceive ? 'bg-on-primary/10' : isResolve ? 'bg-error/10' : 'bg-surface-container-high';
        var ico  = isReceive ? '' : isResolve ? 'text-error' : 'text-primary';
        var subc = isReceive ? 'text-on-primary-container' : isResolve ? 'text-error/80' : 'text-on-surface-variant';
        var chev = isReceive ? 'text-on-primary-container' : isResolve ? 'text-error/60' : 'text-outline';
        var lbl  = isResolve ? 'Resolve NCR' : g;
        html += '<button data-group="' + g + '" class="js-group w-full flex items-center p-4 rounded-lg min-h-[64px] shadow-sm group active:scale-95 transition ' + shell + '">' +
          '<div class="w-12 h-12 rounded flex items-center justify-center mr-4 ' + tile + '">' +
            '<span class="material-symbols-outlined text-[28px] ' + ico + '">' + m.icon + '</span></div>' +
          '<div class="flex flex-col items-start flex-grow">' +
            '<span class="font-interactive-label text-interactive-label font-bold">' + esc(lbl) + '</span>' +
            '<span class="font-body-sm text-body-sm ' + subc + '">' + esc(m.sub) + '</span></div>' +
          '<span class="material-symbols-outlined ' + chev + '">chevron_right</span></button>';
      });
      html += '</div>';
      sheet.innerHTML = html;
      document.getElementById('sheetClose').addEventListener('click', closeSheet);
    }

    // Level 2 — the chosen group's actions (back arrow → picker).
    function renderGroupActions(g){
      var inG = actionRegistry.actions.filter(function(a){ return a.group===g; });
      var html = '<div class="flex items-center gap-2 mb-4">' +
        '<button id="grpBack" class="material-symbols-outlined text-on-surface-variant">arrow_back</button>' +

        '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant ml-auto">close</button></div>' +
        '<div class="flex flex-col gap-base">';

        html += '<button data-id="' + a.id + '" class="tile w-full bg-surface text-primary border border-outline-variant flex items-center p-4 rounded-lg min-h-[64px] hover:bg-surface-variant shadow-sm active:scale-95 transition text-left">' +
          '<div class="flex flex-col items-start flex-grow">' +

    function actionById(id){ return actionRegistry.actions.filter(function(a){ return a.id===id; })[0]; }

    // Inline form — field styling verbatim from Stitch 03-action-form-move.
    function renderInlineForm(action){
      // label nicer than the raw field name
      var LABELS = { material:'Material', lot:'Lot / Batch', fromLoc:'From Location', toLoc:'To Location', qty:'Quantity' };
      var SEL = 'w-full h-[48px] px-4 rounded border border-outline bg-surface-container-low text-on-surface font-body-lg focus:outline-none focus:border-2 focus:border-primary';
      var html = '<div class="flex justify-between items-center mb-5"><h2 class="font-headline-md text-headline-md font-bold text-primary">' + esc(action.label) + '</h2>' +
        '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant">close</button></div>' +
        '<div class="flex flex-col gap-6">';

      (action.fields || []).forEach(function(f){
        var lbl = LABELS[f.name] || f.name;
        if (f.type === 'number'){
          // Big centered quantity input (Stitch hero field).
          html += '<div class="flex flex-col gap-3 mt-1"><label class="font-interactive-label text-interactive-label text-on-surface text-center">' + esc(lbl) + '</label>' +
            '<div class="relative w-full max-w-[220px] mx-auto">' +
            '<input type="number" inputmode="decimal" min="0" step="any" data-field="' + f.name + '" id="f_' + f.name + '" value="" placeholder="0" ' +
            'class="w-full h-[64px] rounded border-2 border-primary bg-surface-container-lowest text-on-surface font-display-lg-mobile text-display-lg-mobile text-center focus:outline-none shadow-inner" style="appearance:textfield;"></div></div>';
          return;
        }
        html += '<div class="flex flex-col gap-2"><label class="font-interactive-label text-interactive-label text-on-surface">' + esc(lbl) + '</label>';

          html += '<div class="relative"><select data-field="' + f.name + '" id="f_' + f.name + '" class="' + SEL + ' appearance-none pr-10"><option value="">Select material…</option>' +
            ((formData&&formData.materials)||[]).map(function(m){ return '<option value="' + esc(m.code) + '">' + esc(m.code) + '</option>'; }).join('') +

          var emphasised = f.name === 'toLoc';
          var selCls = emphasised ? SEL.replace('border border-outline', 'border-2 border-primary').replace('bg-surface-container-low', 'bg-surface-container-lowest') : SEL;
          var qrCls = emphasised ? 'bg-primary-container text-on-primary-container shadow-md' : 'bg-surface-container-high border border-outline-variant text-primary';
          html += '<div class="flex gap-3"><div class="relative flex-1"><select data-field="' + f.name + '" id="f_' + f.name + '" class="' + selCls + ' appearance-none pr-10"><option value="">Select location…</option>' +
            ((formData&&formData.locations)||[]).map(function(l){ return '<option value="' + esc(l.id) + '">' + esc(l.label) + '</option>'; }).join('') +
            '</select><span class="material-symbols-outlined absolute right-3 top-3 text-outline pointer-events-none">arrow_drop_down</span></div>' +
            '<button type="button" aria-label="Scan ' + esc(lbl) + '" class="h-[48px] w-[48px] flex-shrink-0 rounded flex items-center justify-center active:scale-95 transition ' + qrCls + '" onclick="alert(\'QR scan is coming in P2.\')">' +
            '<span class="material-symbols-outlined">qr_code_scanner</span></button></div>';

          html += '<input type="text" data-field="' + f.name + '" id="f_' + f.name + '" class="' + SEL + '">';

        '<button id="submitAct" data-id="' + action.id + '" class="flex-1 h-[48px] rounded bg-primary text-on-primary font-interactive-label text-interactive-label font-bold active:scale-95 transition">Confirm</button>' +
        '</div>';
      sheet.innerHTML = html;
      document.getElementById('sheetClose').addEventListener('click', closeSheet);
      document.getElementById('cancelAct').addEventListener('click', closeSheet);

    function wireInlineSubmit(action){
      var onhandEl = document.getElementById('onhand');
      var matEl = document.getElementById('f_material'), fromEl = document.getElementById('f_fromLoc'), lotEl = document.getElementById('f_lot');
      function refreshOnHand(){
        if (!onhandEl || !matEl || !fromEl) return;
        var m = matEl.value, f = fromEl.value, lot = lotEl ? lotEl.value : '';
        if (!m || !f){ onhandEl.textContent=''; return; }
        onhandEl.textContent = 'On-hand at source: …';
        google.script.run.withSuccessHandler(function(bal){ onhandEl.textContent = 'On-hand at source: ' + bal; })
          .withFailureHandler(function(){ onhandEl.textContent=''; }).getOnHand(m, lot, f);
      }
      if (matEl) matEl.addEventListener('change', refreshOnHand);
      if (fromEl) fromEl.addEventListener('change', refreshOnHand);
      if (lotEl) lotEl.addEventListener('change', refreshOnHand);

      var btn = document.getElementById('submitAct');
      btn.addEventListener('click', function(){
        var payload = { by: currentOp ? currentOp.name : '' }, ok = true;
        (action.fields||[]).forEach(function(f){ var el = document.getElementById('f_'+f.name); var v = el?el.value:''; payload[f.name]=v; if (f.type!=='text' && !v) ok=false; });
        if (!ok){ alert('Please fill all fields.'); return; }
        if (action.id==='move' && payload.fromLoc===payload.toLoc){ alert('Source and destination must differ.'); return; }
        btn.disabled = true; btn.textContent = 'Working…';
        google.script.run
          .withSuccessHandler(function(res){
            btn.disabled=false; btn.textContent='Confirm';
            if (res && res.success){ closeSheet(); formData=null; loadBoard(); alert(action.label + ' done' + (res.transferId?' · '+res.transferId:'')); }
            else { alert('Failed: ' + ((res&&res.error)||'unknown error')); }
          })
          .withFailureHandler(function(err){ btn.disabled=false; btn.textContent='Confirm'; alert('Error: ' + (err&&err.message?err.message:err)); })
          .runAction(action.id, payload);
      });
    }

    function openInlineForm(action){
      sheet.innerHTML = '<h2 class="font-headline text-[18px] font-bold">Loading…</h2>'; openSheet();
      if (formData){ renderInlineForm(action); return; }
      google.script.run
        .withSuccessHandler(function(fd){ formData = fd || {}; renderInlineForm(action); })
        .withFailureHandler(function(){ formData = { materials:[], locations:[] }; renderInlineForm(action); })
        .getActionFormData();
    }

    // ============ Putaway checklist (Stitch layout; SHELL — write wiring is P2) ============
    // Putaway Checklist — verbatim Stitch markup (05-putaway-checklist).
    function renderPutaway(queue){
      var items = queue || [];
      function row(it, i){
        return '<div class="flex items-center gap-3 py-3 ' + (i ? 'border-t border-outline-variant/40' : '') + '">' +
          '<span class="js-pa-check material-symbols-outlined text-outline text-[28px]" data-i="' + i + '" style="cursor:pointer;">radio_button_unchecked</span>' +
          '<div class="flex-grow min-w-0">' +
            '<div class="font-interactive-label text-interactive-label text-on-surface truncate">' + esc(it.material || '—') + '</div>' +
            '<div class="font-body-sm text-body-sm text-on-surface-variant flex items-center mt-0.5">' +
              '<span class="font-mono text-xs bg-surface-container px-1 py-0.5 rounded text-on-surface">' + esc(it.lot || '—') + '</span>' +
              '<span class="mx-1.5">·</span><span>' + esc(it.qty) + '</span></div>' +
          '</div>' +
          // placed pill (hidden until checked) + scan button (hidden when checked)
          '<div class="js-pa-placed hidden items-center bg-[#e6f4ea] text-[#137333] px-2 py-1.5 rounded border border-[#ceead6]" data-i="' + i + '">' +
            '<span class="font-mono text-xs mr-1 font-medium">→ ' + esc(it.from || 'RACK') + '</span>' +
            '<span class="material-symbols-outlined text-[14px]">check</span></div>' +
          '<button class="js-pa-scan h-9 px-3 border-2 border-primary-container text-primary-container rounded flex items-center font-interactive-label text-sm active:bg-surface-container transition-colors" data-i="' + i + '">' +
            '<span class="material-symbols-outlined text-[18px] mr-1.5">qr_code_scanner</span>Scan rack</button>' +
        '</div>';
      }
      var rowsHtml = items.map(row).join('');

      sheet.innerHTML =
        '<div class="flex justify-between items-start mb-3"><div>' +
          '<h2 class="font-headline-md text-headline-md font-bold text-primary">Putaway</h2>' +
          '<p class="font-body-sm text-body-sm text-on-surface-variant">' + items.length + ' item' + (items.length===1?'':'s') + ' to store</p></div>' +
          '<button id="sheetClose" class="material-symbols-outlined text-on-surface-variant">close</button></div>' +
        // progress strip (Stitch)
        '<div class="mb-4"><div class="flex justify-between items-end mb-1">' +
          '<span id="paProgress" class="font-interactive-label text-interactive-label text-on-surface">0 of ' + items.length + ' placed</span>' +
          '<span id="paPct" class="font-label-caps text-label-caps text-primary-container">0%</span></div>' +
          '<div class="h-1.5 w-full bg-outline-variant rounded-full overflow-hidden">' +
          '<div id="paBar" class="h-full bg-primary-container rounded-full transition-all duration-500" style="width:0%"></div></div></div>' +
        (items.length ? rowsHtml : '<div class="font-body-sm text-body-sm text-on-surface-variant text-center py-8">Nothing awaiting putaway.</div>') +
        (items.length ? '<button id="paSameRack" class="h-touch-target-min px-4 text-secondary flex items-center font-interactive-label text-interactive-label active:bg-surface-container rounded transition-colors mt-1">' +
          '<span class="material-symbols-outlined text-[20px] mr-2">copy_all</span>Same rack for all remaining</button>' : '') +
        '<button id="paConfirm" class="w-full h-touch-target-min rounded bg-primary text-on-primary font-interactive-label text-interactive-label font-bold mt-4 opacity-60" disabled>Confirm putaways (P2)</button>';

      document.getElementById('sheetClose').addEventListener('click', closeSheet);
      var placed = 0;
      function repaint(){
        var pct = items.length ? Math.round(placed/items.length*100) : 0;
        document.getElementById('paProgress').textContent = placed + ' of ' + items.length + ' placed';
        document.getElementById('paPct').textContent = pct + '%';
        document.getElementById('paBar').style.width = pct + '%';
        var c = document.getElementById('paConfirm');
        c.disabled = placed < items.length || !items.length;
        c.classList.toggle('opacity-60', c.disabled);
        c.textContent = (placed && placed === items.length) ? 'Confirm putaways (P2)' : 'Confirm putaways (P2)';
      }
      function toggle(i){
        var check = sheet.querySelector('.js-pa-check[data-i="' + i + '"]');
        var placedPill = sheet.querySelector('.js-pa-placed[data-i="' + i + '"]');
        var scan = sheet.querySelector('.js-pa-scan[data-i="' + i + '"]');
        var on = check.textContent.trim() === 'check_circle';
        if (on){
          check.textContent = 'radio_button_unchecked';
          check.className = 'js-pa-check material-symbols-outlined text-outline text-[28px]'; check.style.cursor='pointer';
          placedPill.classList.add('hidden'); placedPill.classList.remove('flex'); scan.classList.remove('hidden'); scan.classList.add('flex');
          placed--;
        } else {
          check.textContent = 'check_circle';
          check.className = 'js-pa-check material-symbols-outlined text-primary-container text-[28px]'; check.style.fontVariationSettings="'FILL' 1"; check.style.cursor='pointer';
          placedPill.classList.remove('hidden'); placedPill.classList.add('flex'); scan.classList.add('hidden'); scan.classList.remove('flex');
          placed++;
        }
        repaint();
      }
      Array.prototype.forEach.call(sheet.querySelectorAll('.js-pa-check'), function(el){ el.addEventListener('click', function(){ toggle(el.getAttribute('data-i')); }); });
      Array.prototype.forEach.call(sheet.querySelectorAll('.js-pa-scan'), function(el){ el.addEventListener('click', function(){ alert('QR rack scan is coming in P2.'); }); });
      var same = document.getElementById('paSameRack'); if (same) same.addEventListener('click', function(){ alert('Same-rack assignment is coming in P2.'); });
    }
    function openPutaway(){
      sheet.innerHTML = '<div class="text-on-surface-variant text-[13px] py-6 text-center">Loading putaway queue…</div>'; openSheet();
      google.script.run
        .withSuccessHandler(function(q){ renderPutaway(q || []); })
        .withFailureHandler(function(){ renderPutaway([]); })
        .getPutawayQueue();
    }

    function handlePick(id){
      var a = actionById(id); if (!a) return;
      if (a.kind==='launch'){ closeSheet(); launchForm(a.form); return; }
      if (a.kind==='checklist'){ openPutaway(); return; }
      openInlineForm(a);
    }

    function openPicker(){ renderPicker(); openSheet(); }
    document.getElementById('fab').addEventListener('click', openPicker);
    document.getElementById('sideNew').addEventListener('click', openPicker);
    backdrop.addEventListener('click', function(e){ if (e.target===backdrop) closeSheet(); });
    sheet.addEventListener('click', function(e){
      var grp = e.target.closest('.js-group'); if (grp){ renderGroupActions(grp.getAttribute('data-group')); return; }
      var t = e.target.closest('.tile'); if (t) handlePick(t.getAttribute('data-id'));
    });

    // ============ nav buttons ============
    document.getElementById('homeBtn').addEventListener('click', function(){ launchForm('Landing'); });
    document.getElementById('bnHome').addEventListener('click', function(){ launchForm('Landing'); });
    document.getElementById('bnRecords').addEventListener('click', function(){ launchForm('Records'); });
    document.getElementById('bnTrace').addEventListener('click', function(){ launchForm('Trace'); });
    document.getElementById('bnKpi').addEventListener('click', function(){ launchForm('KPI'); });

    // ============ init ============
    (function init(){
      paintFilters();
      google.script.run.withSuccessHandler(function(reg){ actionRegistry = reg; }).getQmsv2Actions();
      google.script.run
        .withSuccessHandler(function(map){ roleStageMap = map || {}; loadOperators(); })
        .withFailureHandler(function(){ roleStageMap = {}; loadOperators(); })
        .getRoleStageMap();
    })();
  </script>
</body>
</html>
