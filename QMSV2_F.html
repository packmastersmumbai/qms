<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cockpit — Pack Masters QMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    /* DESIGN.md tokens (authority) — white canvas, navy anchor, electric-blue link. */
    :root{
      --primary:#0D1B6E; --on-primary:#FFFFFF; --link:#0070F3;
      --ink:#0F172A; --body:#374151; --muted:#6B7280; --faint:#94A3B8;
      --canvas:#F5F7FA; --surface:#FFFFFF; --hairline:#E5E7EB;
      --fail:#DC2626;
    }
    *{box-sizing:border-box;}
    body{font-family:'Inter',system-ui,sans-serif; background:var(--canvas); color:var(--ink);
      margin:0; min-height:100dvh; -webkit-tap-highlight-color:transparent;}
    .topbar{position:sticky; top:0; z-index:10; background:var(--primary); color:var(--on-primary);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; height:52px;}
    .topbar h1{font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; font-weight:700;
      letter-spacing:-0.3px; margin:0;}
    .who{min-height:44px; display:flex; align-items:center; gap:8px;}
    .who select{font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
      color:var(--on-primary); background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.25); border-radius:8px;
      padding:8px 10px; min-height:36px; max-width:170px; -webkit-appearance:none;}
    .who-role{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
      color:var(--on-primary); opacity:.7; white-space:nowrap;}
    .wrap{max-width:760px; margin:0 auto; padding:0 16px 96px;}
    .board-empty{color:var(--muted); font-size:14px; text-align:center; padding:48px 16px;
      border:1px dashed var(--hairline); border-radius:12px; background:var(--surface); margin-top:16px;}
    .mono{font-family:'JetBrains Mono',monospace;}

    /* Doc-type tab row */
    .tabs{position:sticky; top:52px; z-index:9; background:var(--canvas);
      display:flex; overflow-x:auto; border-bottom:1px solid var(--hairline);
      -ms-overflow-style:none; scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex:0 0 auto; min-height:44px; padding:0 16px; display:flex; align-items:center;
      font-size:14px; font-weight:600; color:var(--muted); background:none; border:none;
      border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer;}
    .tab.active{color:var(--primary); border-bottom-color:var(--primary);}
    .tab .cnt{margin-left:6px; font-size:11px; font-weight:700; color:var(--faint);}

    /* Card-level filter pills */
    .filters{display:flex; gap:6px; padding:12px 0 4px;}
    .pill{min-height:32px; padding:6px 14px; border-radius:9999px; border:1px solid var(--hairline);
      background:var(--surface); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer;}
    .pill.active{background:var(--primary); color:var(--on-primary); border-color:var(--primary);}

    /* Status sections */
    .section{margin-top:20px;}
    .section h3{font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
      color:var(--muted); margin:0 0 10px; display:flex; align-items:center; gap:8px;}
    .dot{width:8px; height:8px; border-radius:9999px;}
    .dot.fail{background:var(--fail);} .dot.prog{background:var(--link);} .dot.pass{background:#16A34A;}
    .grid{display:grid; grid-template-columns:1fr; gap:12px;}
    @media(min-width:640px){ .grid{grid-template-columns:1fr 1fr;} }

    /* Card */
    .card{position:relative; background:var(--surface); border:1px solid var(--hairline);
      border-radius:12px; padding:14px 14px 14px 16px; overflow:hidden;
      box-shadow:0 1px 2px rgba(15,23,42,.04);}
    .card.overdue::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--fail);}
    .card .hd{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
    .badge{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
      padding:2px 8px; border-radius:4px; width:fit-content;}
    .badge.fail{color:var(--fail); background:#FEE2E2;}
    .badge.prog{color:var(--link); background:#D3E5FF;}
    .badge.pass{color:#15803D; background:#DCFCE7;}
    .docno{font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:500; color:var(--ink); margin-top:4px;}
    .desc{font-size:13px; color:var(--body); margin:8px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .age{font-size:11px; color:var(--faint); margin-top:2px;}

    /* Pipeline tracker */
    .pipe{display:flex; justify-content:space-between; align-items:flex-start;
      margin-top:12px; padding-top:10px; border-top:1px solid var(--hairline);}
    .node{display:flex; flex-direction:column; align-items:center; gap:4px; flex:1;}
    .node .bead{width:11px; height:11px; border-radius:9999px; background:#E2E8F0; border:1px solid var(--hairline);}
    .node.done .bead{background:var(--primary); border-color:var(--primary);}
    .node.current .bead{background:var(--surface); border:2px solid var(--link);}
    .node span{font-family:'JetBrains Mono',monospace; font-size:8px; text-transform:uppercase;
      color:var(--faint); letter-spacing:.02em;}
    .node.current span{color:var(--link); font-weight:700;}
    .node.done span{color:var(--body);}

    /* FAB + action picker */
    .fab{position:fixed; right:18px; bottom:24px; z-index:20; width:56px; height:56px;
      border-radius:9999px; background:var(--primary); color:var(--on-primary); border:none;
      font-size:28px; line-height:1; cursor:pointer; box-shadow:0 6px 16px rgba(13,27,110,.35);}
    .sheet-backdrop{position:fixed; inset:0; z-index:30; background:rgba(15,23,42,.45);
      display:none; align-items:flex-end; justify-content:center;}
    .sheet-backdrop.open{display:flex;}
    .sheet{background:var(--surface); width:100%; max-width:760px; max-height:82vh; overflow-y:auto;
      border-radius:16px 16px 0 0; padding:16px 16px 28px;}
    .sheet h2{font-family:'Plus Jakarta Sans',sans-serif; font-size:18px; font-weight:700;
      margin:4px 0 14px;}
    .grp-label{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
      color:var(--muted); margin:16px 0 8px;}
    .tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
    @media(min-width:480px){ .tiles{grid-template-columns:1fr 1fr 1fr;} }
    .tile{min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:12px; border:1px solid var(--hairline); border-radius:10px; background:var(--surface);
      font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; text-align:left;}
    .tile .kind{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
      color:var(--faint);}
    .tile.inline .kind{color:var(--link);}
    .field{margin-top:12px;}
    .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px;}
    .field input, .field select{width:100%; min-height:44px; padding:10px 12px; font-size:15px;
      border:1px solid var(--hairline-strong,#CBD5E1); border-radius:10px; background:var(--surface);
      color:var(--ink); -webkit-appearance:none;}
    .sheet-actions{display:flex; gap:10px; margin-top:18px;}
    .btn{flex:1; min-height:48px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer;}
    .btn-primary{background:var(--primary); color:var(--on-primary);}
    .btn-ghost{background:var(--surface); color:var(--body); border:1px solid var(--hairline);}
    .onhand{font-size:12px; color:var(--muted); margin-top:4px;}
  </style>
</head>
<body>
  <header class="topbar">
    <h1 id="homeBtn" style="cursor:pointer;" title="Back to Home">← QMS Cockpit</h1>
    <div class="who" id="whoSlot">
      <span class="who-role" id="whoRole"></span>
      <select id="opSelect" aria-label="Select operator"><option value="">Loading…</option></select>
    </div>
  </header>

  <div class="tabs" id="tabRow"></div>

  <main class="wrap">
    <div class="filters" id="filterRow">
      <button class="pill active" data-filter="all">All</button>
      <button class="pill" data-filter="urgent">Urgent</button>
    </div>
    <!-- Board render target -->
    <div id="qmsv2Root" class="board-empty">Loading board…</div>
  </main>

  <button class="fab" id="fab" aria-label="New action">+</button>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet" id="sheet"><!-- picker or inline form rendered here --></div>
  </div>

  <script>
    // T3: identity dropdown (from getQmsv2Operators) → currentRole → board.
    // Selection persists to localStorage; switching re-requests the board for
    // that role's primary tab ("My Work"). Kanban render lands in T4.
    var LS_KEY = 'pmQmsOperator';
    // All 7 doc-type tabs for every user (locked decision); role only defaults + filters.
    var DOC_TYPES = ['GRN','IQC','IPQC','OQC','Dispatch','Production','NCR'];
    var STAGE_LABELS = ['GRN','IQC','PUTAWAY','ISSUE','OQC','DISP'];

    var roleStageMap = null;   // cockpitRole -> [docTypes]
    var operators = [];        // [{name, role, shift, cockpitRole}]
    var currentOp = null;
    var currentRole = 'manager';
    var currentType = 'GRN';
    var currentFilter = 'all';

    var root   = document.getElementById('qmsv2Root');
    var sel    = document.getElementById('opSelect');
    var roleEl = document.getElementById('whoRole');
    var tabRow = document.getElementById('tabRow');

    function primaryTabFor(role){
      var tabs = roleStageMap && roleStageMap[role];
      return (tabs && tabs.length) ? tabs[0] : 'GRN';
    }

    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    function renderTabs(){
      tabRow.innerHTML = '';
      DOC_TYPES.forEach(function(t){
        var b = document.createElement('button');
        b.className = 'tab' + (t === currentType ? ' active' : '');
        b.textContent = t;
        b.addEventListener('click', function(){ currentType = t; renderTabs(); loadBoard(); });
        tabRow.appendChild(b);
      });
    }

    // Build a 6-node pipeline tracker from a card's stage index.
    function pipelineHtml(stage){
      var html = '<div class="pipe">';
      for (var i = 0; i < STAGE_LABELS.length; i++){
        var cls = i < stage ? 'done' : (i === stage ? 'current' : '');
        html += '<div class="node ' + cls + '"><div class="bead"></div><span>' +
          STAGE_LABELS[i] + '</span></div>';
      }
      return html + '</div>';
    }

    function cardHtml(card, tone){
      var overdue = card.overdue ? ' overdue' : '';
      var age = card.ageDays != null ? (card.ageDays + 'd ago') : '';
      return '<div class="card' + overdue + '">' +
        '<div class="hd"><div>' +
          '<span class="badge ' + tone + '">' + esc(card.status) + '</span>' +
          '<div class="docno">' + esc(card.docNo) + '</div>' +
        '</div></div>' +
        '<p class="desc">' + esc(card.name || '—') + '</p>' +
        (age ? '<div class="age">' + age + '</div>' : '') +
        pipelineHtml(card.stage || 0) +
      '</div>';
    }

    function sectionHtml(title, dotCls, cards, tone){
      if (!cards.length) return '';
      var inner = cards.map(function(c){ return cardHtml(c, tone); }).join('');
      return '<section class="section"><h3><span class="dot ' + dotCls + '"></span>' +
        title + ' · ' + cards.length + '</h3><div class="grid">' + inner + '</div></section>';
    }

    function applyFilter(cards){
      if (currentFilter === 'urgent') return cards.filter(function(c){ return c.overdue; });
      return cards;
    }

    function renderBoard(board){
      var cols = board.columns;
      // ACTION REQUIRED = overdue pending first, then remaining pending.
      var pending = applyFilter(cols.pending);
      var overdue = pending.filter(function(c){ return c.overdue; });
      var pendingRest = pending.filter(function(c){ return !c.overdue; });
      var inProg = applyFilter(cols.inProgress);
      var done = applyFilter(cols.done);

      var html = '';
      html += sectionHtml('Action Required', 'fail', overdue, 'fail');
      html += sectionHtml('Pending', 'prog', pendingRest, 'prog');
      html += sectionHtml('In Progress', 'prog', inProg, 'prog');
      html += sectionHtml('Done', 'pass', done, 'pass');

      if (!html){
        root.className = 'board-empty';
        root.textContent = currentFilter === 'urgent'
          ? 'Nothing urgent in ' + currentType + '.'
          : 'No ' + currentType + ' records.';
        return;
      }
      root.className = '';
      root.innerHTML = html;
    }

    function loadBoard(){
      root.className = 'board-empty';
      root.textContent = 'Loading board…';
      google.script.run
        .withSuccessHandler(function(board){
          if (!board || !board.columns){ root.textContent = 'No board data.'; return; }
          renderBoard(board);
        })
        .withFailureHandler(function(err){
          root.className = 'board-empty';
          root.textContent = 'Board load failed: ' + (err && err.message ? err.message : err);
        })
        .getQmsv2Board(currentType, currentRole);
    }

    function applyOperator(op){
      currentOp = op;
      currentRole = (op && op.cockpitRole) || 'manager';
      currentType = primaryTabFor(currentRole);
      roleEl.textContent = currentRole;
      try { if (op) localStorage.setItem(LS_KEY, op.name); } catch(e){}
      renderTabs();
      loadBoard();
    }

    // Filter pills
    document.getElementById('filterRow').addEventListener('click', function(e){
      var btn = e.target.closest('.pill'); if (!btn) return;
      currentFilter = btn.getAttribute('data-filter');
      Array.prototype.forEach.call(this.children, function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      loadBoard();
    });

    sel.addEventListener('change', function(){
      var op = operators.filter(function(o){ return o.name === sel.value; })[0];
      if (op) applyOperator(op);
    });

    function loadOperators(){
      google.script.run
        .withSuccessHandler(function(ops){
          operators = ops || [];
          sel.innerHTML = '';
          if (!operators.length){
            sel.innerHTML = '<option value="">No operators</option>';
            root.textContent = 'No operators configured.';
            return;
          }
          operators.forEach(function(o){
            var opt = document.createElement('option');
            opt.value = o.name; opt.textContent = o.name;
            sel.appendChild(opt);
          });
          // Restore prior selection; else first operator.
          var saved = null;
          try { saved = localStorage.getItem(LS_KEY); } catch(e){}
          var chosen = (saved && operators.filter(function(o){ return o.name === saved; })[0]) || operators[0];
          sel.value = chosen.name;
          applyOperator(chosen);
        })
        .withFailureHandler(function(err){
          root.textContent = 'Operator load failed: ' + (err && err.message ? err.message : err);
        })
        .getQmsv2Operators();
    }

    // ---- Action picker (T5) ----
    var actionRegistry = null;   // { groups:[], actions:[] }
    var formData = null;         // { materials, locations, stock } — lazy
    var backdrop = document.getElementById('sheetBackdrop');
    var sheet = document.getElementById('sheet');

    function openSheet(){ backdrop.classList.add('open'); }
    function closeSheet(){ backdrop.classList.remove('open'); sheet.innerHTML = ''; }

    function renderPicker(){
      if (!actionRegistry){ sheet.innerHTML = '<h2>Loading actions…</h2>'; return; }
      var html = '<h2>New Action</h2>';
      actionRegistry.groups.forEach(function(g){
        var inGroup = actionRegistry.actions.filter(function(a){ return a.group === g; });
        if (!inGroup.length) return;
        html += '<div class="grp-label">' + g + '</div><div class="tiles">';
        inGroup.forEach(function(a){
          html += '<button class="tile ' + a.kind + '" data-id="' + a.id + '">' +
            '<span>' + esc(a.label) + '</span>' +
            '<span class="kind">' + (a.kind === 'launch' ? 'open' : 'inline') + '</span>' +
          '</button>';
        });
        html += '</div>';
      });
      sheet.innerHTML = html;
    }

    function actionById(id){
      return actionRegistry.actions.filter(function(a){ return a.id === id; })[0];
    }

    // T5: render a config-driven inline form. T6 wires Move's real submit.
    function renderInlineForm(action){
      var html = '<h2>' + esc(action.label) + '</h2>';
      (action.fields || []).forEach(function(f){
        html += '<div class="field"><label>' + esc(f.name) + '</label>';
        if (f.type === 'material'){
          html += '<select data-field="' + f.name + '" id="f_' + f.name + '"><option value="">Select material…</option>' +
            ((formData && formData.materials) || []).map(function(m){
              return '<option value="' + esc(m.code) + '">' + esc(m.code) + '</option>'; }).join('') +
            '</select>';
        } else if (f.type === 'location'){
          html += '<select data-field="' + f.name + '" id="f_' + f.name + '"><option value="">Select location…</option>' +
            ((formData && formData.locations) || []).map(function(l){
              return '<option value="' + esc(l.id) + '">' + esc(l.label) + '</option>'; }).join('') +
            '</select>';
        } else if (f.type === 'number'){
          html += '<input type="number" inputmode="decimal" data-field="' + f.name + '" id="f_' + f.name + '" min="0" step="any">';
        } else {
          html += '<input type="text" data-field="' + f.name + '" id="f_' + f.name + '">';
        }
        html += '</div>';
      });
      html += '<div class="onhand" id="onhand"></div>';
      html += '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" id="cancelAct">Cancel</button>' +
        '<button class="btn btn-primary" id="submitAct" data-id="' + action.id + '">Confirm</button>' +
      '</div>';
      sheet.innerHTML = html;
      document.getElementById('cancelAct').addEventListener('click', closeSheet);
      // T6 attaches the real submit + on-hand for 'move'; placeholder otherwise.
      if (typeof wireInlineSubmit === 'function') wireInlineSubmit(action);
    }

    function openInlineForm(action){
      sheet.innerHTML = '<h2>Loading…</h2>';
      if (formData){ renderInlineForm(action); return; }
      google.script.run
        .withSuccessHandler(function(fd){ formData = fd || {}; renderInlineForm(action); })
        .withFailureHandler(function(){ formData = { materials:[], locations:[] }; renderInlineForm(action); })
        .getActionFormData();
    }

    // Launch a Tier-2 form the same way other forms route: fetch its HTML and
    // full-page swap (getFormHtml + document.write). navigateTo is NOT in scope
    // here — each form is a full page, not an in-SPA injection.
    function launchForm(formName){
      google.script.run
        .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
        .withFailureHandler(function(){ closeSheet(); alert('Could not open ' + formName); })
        .getFormHtml(formName);
    }

    // T6: wire the inline form's submit. P1 enables 'move' end-to-end; other
    // inline actions confirm but the server guards them as not-yet-enabled.
    function wireInlineSubmit(action){
      var onhandEl = document.getElementById('onhand');
      var matEl  = document.getElementById('f_material');
      var fromEl = document.getElementById('f_fromLoc');
      var lotEl  = document.getElementById('f_lot');

      // Live on-hand reference for the chosen material + source location.
      function refreshOnHand(){
        if (!onhandEl || !matEl || !fromEl) return;
        var m = matEl.value, f = fromEl.value, lot = lotEl ? lotEl.value : '';
        if (!m || !f){ onhandEl.textContent = ''; return; }
        onhandEl.textContent = 'On-hand: …';
        google.script.run
          .withSuccessHandler(function(bal){ onhandEl.textContent = 'On-hand at source: ' + bal; })
          .withFailureHandler(function(){ onhandEl.textContent = ''; })
          .getOnHand(m, lot, f);
      }
      if (matEl)  matEl.addEventListener('change', refreshOnHand);
      if (fromEl) fromEl.addEventListener('change', refreshOnHand);
      if (lotEl)  lotEl.addEventListener('change', refreshOnHand);

      var submitBtn = document.getElementById('submitAct');
      submitBtn.addEventListener('click', function(){
        var payload = { by: currentOp ? currentOp.name : '' };
        var ok = true;
        (action.fields || []).forEach(function(f){
          var el = document.getElementById('f_' + f.name);
          var v = el ? el.value : '';
          payload[f.name] = v;
          if (f.type !== 'text' && !v) ok = false;   // required (lot optional/text)
        });
        if (!ok){ alert('Please fill all fields.'); return; }
        if (action.id === 'move' && payload.fromLoc === payload.toLoc){
          alert('Source and destination must differ.'); return;
        }
        submitBtn.disabled = true; submitBtn.textContent = 'Working…';
        google.script.run
          .withSuccessHandler(function(res){
            submitBtn.disabled = false; submitBtn.textContent = 'Confirm';
            if (res && res.success){
              closeSheet();
              formData = null;  // stock changed → refresh dropdown source next open
              loadBoard();
              alert((action.label) + ' done' + (res.transferId ? ' · ' + res.transferId : ''));
            } else {
              alert('Failed: ' + ((res && res.error) || 'unknown error'));
            }
          })
          .withFailureHandler(function(err){
            submitBtn.disabled = false; submitBtn.textContent = 'Confirm';
            alert('Error: ' + (err && err.message ? err.message : err));
          })
          .runAction(action.id, payload);
      });
    }

    function handlePick(id){
      var a = actionById(id); if (!a) return;
      if (a.kind === 'launch'){ closeSheet(); launchForm(a.form); return; }
      openInlineForm(a);
    }

    document.getElementById('fab').addEventListener('click', function(){
      renderPicker(); openSheet();
    });
    document.getElementById('homeBtn').addEventListener('click', function(){ launchForm('Landing'); });
    backdrop.addEventListener('click', function(e){ if (e.target === backdrop) closeSheet(); });
    sheet.addEventListener('click', function(e){
      var tile = e.target.closest('.tile'); if (tile){ handlePick(tile.getAttribute('data-id')); }
    });

    // Load the role→tab map first (so primaryTabFor is correct), then operators.
    (function init(){
      google.script.run
        .withSuccessHandler(function(reg){ actionRegistry = reg; })
        .getQmsv2Actions();

      google.script.run
        .withSuccessHandler(function(map){ roleStageMap = map || {}; loadOperators(); })
        .withFailureHandler(function(){ roleStageMap = {}; loadOperators(); })
        .getRoleStageMap();
    })();
  </script>
</body>
</html>
