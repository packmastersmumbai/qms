    /* DESIGN.md tokens (authority) — white canvas, navy anchor, electric-blue link. */
    :root{
      --primary:#0D1B6E; --on-primary:#FFFFFF; --link:#0070F3;
      --ink:#0F172A; --body:#374151; --muted:#6B7280; --faint:#94A3B8;
      --canvas:#F5F7FA; --surface:#FFFFFF; --hairline:#E5E7EB;
      --fail:#DC2626;
    }
    *{box-sizing:border-box;}
    body{font-family:'Inter',system-ui,sans-serif; background:var(--canvas); color:var(--ink);
      margin:0; min-height:100dvh; -webkit-tap-highlight-color:transparent;}
    .topbar{position:sticky; top:0; z-index:10; background:var(--primary); color:var(--on-primary);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; height:52px;}

      letter-spacing:-0.3px; margin:0;}

      color:var(--on-primary); opacity:.85;}
    .wrap{max-width:560px; margin:0 auto; padding:16px;}
    .board-empty{color:var(--muted); font-size:14px; text-align:center; padding:48px 16px;

<body>
  <header class="topbar">
    <h1>QMS Cockpit</h1>
    <div class="who" id="whoSlot">—</div>
  </header>

  <main class="wrap">
    <!-- Board mount point — kanban + cards land here in T3/T4. -->
    <div id="qmsv2Root" class="board-empty">Loading board…</div>
  </main>

  <script>
    // T2: prove the page mounts and the server RPC wiring is live.
    // Role/identity dropdown (T3) and kanban render (T4) build on this root.
    (function init(){
      var root = document.getElementById('qmsv2Root');
      google.script.run
        .withSuccessHandler(function(board){
          if (!board || !board.columns){ root.textContent = 'No board data.'; return; }
          var c = board.counts || {};
          root.innerHTML = 'Board OK · <span class="mono">' + board.type + '</span> · ' +
            (c.total||0) + ' records (' + (c.pending||0) + ' pending, ' +
            (c.inProgress||0) + ' in-progress, ' + (c.done||0) + ' done)';
        })
        .withFailureHandler(function(err){
          root.textContent = 'Board load failed: ' + (err && err.message ? err.message : err);
        })
        .getQmsv2Board('GRN', 'manager');
    })();
  </script>
</body>
