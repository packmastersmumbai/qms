<style>
  /* ═══════════════════════════════════════════════════════════════
   * Pack Masters QMS — Theme.html
   * Single source of CSS tokens, generated from DESIGN.md.
   * Every form (*_F.html) must include this file.
   * Do not edit tokens here; edit DESIGN.md and regenerate.
   * ═══════════════════════════════════════════════════════════════ */

  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  /* ── Tokens (mirror of DESIGN.md YAML) ────────────────────────── */
  :root {
    /* Brand */
    --pm-primary:         #0D1B6E;
    --pm-on-primary:      #FFFFFF;
    --pm-primary-hover:   #1A2D9E;
    --pm-primary-pressed: #0A1450;
    --pm-primary-soft:    #EEF1FA;

    /* Interactive accent */
    --pm-link:            #0070F3;
    --pm-link-hover:      #0761D1;
    --pm-link-soft:       #D3E5FF;

    /* Ink */
    --pm-ink:             #0F172A;
    --pm-ink-2:           #1A1A2E;
    --pm-body:            #374151;
    --pm-muted:           #6B7280;
    /* #94A3B8 is 2.56:1 on white — below the WCAG AA 4.5:1 floor. FormKit's
       --fk-faint was corrected to #64748B (4.76:1) on 2026-08-02, but this token
       kept the failing value and Theme.html reaches 23 forms vs FormKit's 7, so
       the fix had far less coverage than it appeared. Same slate hue, one step
       darker. Do not lighten past #6B7280 (4.83:1) without re-checking contrast. */
    --pm-faint:           #64748B;

    /* Surface */
    --pm-canvas:          #F5F7FA;
    --pm-canvas-soft:     #FAFBFC;
    --pm-surface:         #FFFFFF;

    /* Lines */
    --pm-hairline:        #E5E7EB;
    --pm-hairline-strong: #CBD5E1;
    --pm-rule:            #EEF1F5;
    /* Neutral/surface ramp — added 2026-08-03 by /impeccable extract.
       The SIGNAL ramp was already fully tokenised; these were the real gap. Each
       appears 13+ times as a raw literal across the forms (#E2E8F0 alone: 178).
       Named for ROLE, not value, so a palette change is one edit.
       Declared HERE rather than in FormKit because Theme.html is included by all
       23 forms while FormKit reaches only 7 — the tokens have to exist where the
       literals actually are. FormKit mirrors these as --fk-* for its own grammar. */
    --pm-border:          #E2E8F0;   /* default 1px card/input border */
    --pm-page:            #F8FAFC;   /* page canvas behind cards */
    --pm-input-line:      #D1D5DB;   /* heavier 1.5px input border */
    --pm-chip:            #F1F5F9;   /* unselected pill/chip fill */
    --pm-info-soft:       #EFF6FF;   /* informational tint */
    --pm-header-ink:      #0B2A4A;   /* sheet/table header fill */

    /* Signal */
    --pm-pass:            #16A34A;
    --pm-pass-soft:       #DCFCE7;
    --pm-pass-deep:       #15803D;
    --pm-fail:            #DC2626;
    --pm-fail-soft:       #FEE2E2;
    --pm-fail-deep:       #B91C1C;
    --pm-hold:            #D97706;
    --pm-hold-soft:       #FEF3C7;
    --pm-hold-deep:       #B45309;
    --pm-warn:            #F97316;
    --pm-warn-soft:       #FFEDD5;
    --pm-warn-deep:       #9A3412;
    --pm-prog:            #2563EB;
    --pm-prog-soft:       #DBEAFE;
    --pm-prog-deep:       #1E40AF;
    --pm-whatsapp:        #25D366;

    /* Radius */
    --pm-r-xs:            4px;
    --pm-r-sm:            6px;
    --pm-r-md:            8px;
    --pm-r-lg:            10px;
    --pm-r-xl:            14px;
    --pm-r-pill:          999px;

    /* Spacing */
    --pm-s-xs:            4px;
    --pm-s-sm:            6px;
    --pm-s-md:            8px;
    --pm-s-lg:            10px;
    --pm-s-xl:            14px;
    --pm-s-2xl:           20px;
    --pm-s-3xl:           28px;

    /* Elevation */
    --pm-shadow-1:        0 1px 4px rgba(13,27,110,0.08), 0 2px 8px rgba(13,27,110,0.06);

    /* Type families */
    --pm-ff-display:      'Plus Jakarta Sans', system-ui, sans-serif;
    --pm-ff-body:         'Inter', system-ui, sans-serif;
    --pm-ff-mono:         'JetBrains Mono', ui-monospace, monospace;

    /* Legacy aliases — keep until all forms migrate.
     * Existing forms reference --navy, --amber, --bg etc. Theme.html maps them
     * to the new token names so no form breaks during the migration. */
    --navy:               var(--pm-primary);
    --navy-light:         var(--pm-primary-soft);
    --amber:              var(--pm-primary);   /* retired — alias to navy */
    --bg:                 var(--pm-canvas);
    --white:              var(--pm-surface);
    --text:               var(--pm-ink-2);
    --muted:              var(--pm-muted);
    --border:             var(--pm-hairline);
    --success:            var(--pm-pass);
    --danger:             var(--pm-fail);
    --hold:               var(--pm-hold);
    --deviation:          var(--pm-warn);
    --shadow-1:           var(--pm-shadow-1);
    --shadow-2:           var(--pm-shadow-1);  /* shadow-2 retired — alias */
    --radius:             var(--pm-r-lg);
  }

  /* ── Reset ────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    font-family: var(--pm-ff-body);
    font-size: 13px;
    line-height: 1.5;
    background: var(--pm-canvas);
    color: var(--pm-ink);
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 80px;
  }

  /* ── Type utilities ───────────────────────────────────────────── */
  .pm-mono       { font-family: var(--pm-ff-mono); font-variant-numeric: tabular-nums; }
  .pm-display    { font-family: var(--pm-ff-display); font-weight: 700; }
  .pm-sec-label  {
    font-family: var(--pm-ff-display);
    font-size: 10px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--pm-muted);
  }

  /* ── Keyframes ────────────────────────────────────────────────── */
  @keyframes pm-spin   { to { transform: rotate(360deg); } }
  @keyframes pm-shake  { 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-4px);} 75%{ transform:translateX(4px);} }
  @keyframes pm-rise   { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:translateY(0);} }

  /* ── Header ───────────────────────────────────────────────────── */
  .pm-header {
    background: var(--pm-primary);
    color: var(--pm-on-primary);
    padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 100;
    min-height: 48px;
  }
  .pm-header .logo-box {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: var(--pm-r-md);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-family: var(--pm-ff-display);
    font-size: 14px; font-weight: 700;
    color: var(--pm-on-primary);
  }
  .pm-header .header-text { display: flex; flex-direction: column; gap: 0; }
  .pm-header .logo-text   {
    font-family: var(--pm-ff-display);
    font-size: 14px; font-weight: 700;
    color: var(--pm-on-primary);
    line-height: 1.2;
  }
  .pm-header .logo-sub    {
    font-size: 10px; font-weight: 500;
    color: rgba(255,255,255,0.65);
    line-height: 1.2;
    letter-spacing: 0.4px;
  }
  .pm-header .back-btn {
    width: 36px; height: 36px;
    margin-left: -4px;
    background: transparent; border: 0;
    color: var(--pm-on-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: var(--pm-r-md);
    transition: background .12s ease;
  }
  .pm-header .back-btn:hover { background: rgba(255,255,255,0.10); }
  .pm-header .back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pm-header .page-title {
    font-family: var(--pm-ff-display);
    font-size: 14px; font-weight: 700;
    color: var(--pm-on-primary);
    flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.2px;
  }
  .pm-header .doc-badge {
    margin-left: auto;
    background: rgba(255,255,255,0.12);
    color: var(--pm-on-primary);
    font-family: var(--pm-ff-mono);
    font-size: 10px; font-weight: 700;
    padding: 3px 8px;
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: var(--pm-r-xs);
    letter-spacing: 0.5px;
    white-space: nowrap; flex-shrink: 0;
  }

  /* ── Section card ─────────────────────────────────────────────── */
  .section {
    background: var(--pm-surface);
    border: 1px solid var(--pm-hairline);
    border-radius: var(--pm-r-lg);
    margin: 10px;
    overflow: hidden;
  }
  .section-title {
    background: var(--pm-canvas-soft);
    color: var(--pm-muted);
    font-family: var(--pm-ff-display);
    font-size: 10px; font-weight: 700;
    padding: 7px 12px;
    letter-spacing: 1.2px; text-transform: uppercase;
    border-bottom: 1px solid var(--pm-rule);
  }
  .section-body { padding: 10px 12px; }

  /* ── Field ────────────────────────────────────────────────────── */
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 500;
    color: var(--pm-muted);
    margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .field label .ccp {
    color: var(--pm-primary);
    font-size: 10px;
    margin-left: 3px;
  }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    border: 1.5px solid var(--pm-hairline);
    border-radius: var(--pm-r-sm);
    padding: 8px 10px;
    min-height: 40px;
    font-family: var(--pm-ff-body);
    font-size: 16px;            /* 16px to defeat iOS zoom-on-focus */
    color: var(--pm-ink-2);
    background: var(--pm-surface);
    transition: border-color .15s ease, box-shadow .15s ease;
    -webkit-appearance: none;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--pm-primary);
    box-shadow: 0 0 0 3px var(--pm-primary-soft);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field .hint {
    font-size: 10px; color: var(--pm-muted);
    margin-top: 2px;
  }

  /* ── Doc number display ───────────────────────────────────────── */
  .doc-number {
    font-family: var(--pm-ff-mono);
    font-size: 16px; font-weight: 700;
    color: var(--pm-primary);
    background: var(--pm-primary-soft);
    border: 1.5px dashed var(--pm-primary);
    border-radius: var(--pm-r-sm);
    padding: 8px 12px;
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  /* ── Toggle row (PASS / FAIL / N/A) ───────────────────────────── */
  .toggle-row { display: flex; gap: 6px; }
  .toggle-row button {
    flex: 1; min-height: 44px;
    padding: 10px 4px;
    border: 1.5px solid var(--pm-hairline);
    border-radius: var(--pm-r-md);
    background: var(--pm-surface);
    font-family: var(--pm-ff-body);
    font-size: 12px; font-weight: 700;
    color: var(--pm-ink-2);
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
    touch-action: manipulation;
  }
  .toggle-row button:active { transform: scale(0.97); transition: transform .08s; }
  .toggle-row button:focus-visible { outline: 2px solid var(--pm-primary); outline-offset: 2px; }
  .toggle-row button.active-yes,
  .toggle-row button.active-pass {
    background: var(--pm-pass-soft);
    border-color: var(--pm-pass);
    color: var(--pm-pass-deep);
  }
  .toggle-row button.active-no,
  .toggle-row button.active-fail {
    background: var(--pm-fail-soft);
    border-color: var(--pm-fail);
    color: var(--pm-fail-deep);
    animation: pm-shake 0.3s ease;
  }
  .toggle-row button.active-na {
    background: var(--pm-canvas);
    border-color: var(--pm-hairline-strong);
    color: var(--pm-muted);
  }

  /* ── Disposition grid (Accept / Reject / Hold / Await-MRB) ────── */
  .disp-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-top: 4px;
  }
  .disp-btn {
    min-height: 52px;
    padding: 12px 6px;
    border: 1.5px solid var(--pm-hairline);
    border-radius: var(--pm-r-lg);
    background: var(--pm-surface);
    font-family: var(--pm-ff-body);
    font-size: 13px; font-weight: 700;
    color: var(--pm-ink-2);
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, transform .08s;
    text-align: center;
    touch-action: manipulation;
  }
  .disp-btn:active { transform: scale(0.97); }
  .disp-btn:focus-visible { outline: 2px solid var(--pm-primary); outline-offset: 2px; }
  .disp-btn.active-acc { background: var(--pm-pass-soft); border-color: var(--pm-pass); color: var(--pm-pass-deep); }
  .disp-btn.active-rej { background: var(--pm-fail-soft); border-color: var(--pm-fail); color: var(--pm-fail-deep); }
  .disp-btn.active-hld { background: var(--pm-hold-soft); border-color: var(--pm-hold); color: var(--pm-hold-deep); }
  .disp-btn.active-awd { background: var(--pm-warn-soft); border-color: var(--pm-warn); color: var(--pm-warn-deep); }

  /* ── Buttons ──────────────────────────────────────────────────── */
  .btn-submit {
    width: 100%; min-height: 48px;
    background: var(--pm-primary);
    color: var(--pm-on-primary);
    border: 0;
    border-radius: var(--pm-r-md);
    padding: 13px 16px;
    font-family: var(--pm-ff-body);
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    margin-top: 4px;
    transition: background .15s, opacity .15s;
    touch-action: manipulation;
  }
  .btn-submit:hover  { background: var(--pm-primary-hover); }
  .btn-submit:active { background: var(--pm-primary-pressed); transform: scale(0.99); }
  .btn-submit:focus-visible { outline: 2px solid var(--pm-link); outline-offset: 2px; }
  .btn-submit:disabled { background: var(--pm-faint); cursor: not-allowed; opacity: 0.7; }

  .btn-link {
    background: transparent;
    color: var(--pm-link);
    border: 0;
    font-family: var(--pm-ff-body);
    font-size: 13px; font-weight: 600;
    padding: 6px 8px;
    cursor: pointer;
  }
  .btn-link:hover { color: var(--pm-link-hover); text-decoration: underline; }

  .btn-wa {
    width: 100%; min-height: 44px;
    background: var(--pm-whatsapp);
    color: #FFFFFF; border: 0;
    border-radius: var(--pm-r-md);
    padding: 11px 16px;
    font-family: var(--pm-ff-body);
    font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 8px;
    transition: background .15s;
    touch-action: manipulation;
  }
  .btn-wa:hover  { background: #1EBA59; }
  .btn-wa:active { background: #17a34a; transform: scale(0.99); }

  /* ── Badges ───────────────────────────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: var(--pm-r-pill);
    font-family: var(--pm-ff-body);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.3px;
  }
  .badge-pass    { background: var(--pm-pass-soft); color: var(--pm-pass-deep); }
  .badge-fail    { background: var(--pm-fail-soft); color: var(--pm-fail-deep); }
  .badge-hold    { background: var(--pm-hold-soft); color: var(--pm-hold-deep); }
  .badge-pending { background: var(--pm-canvas);    color: var(--pm-muted); }
  .badge-awd     { background: var(--pm-warn-soft); color: var(--pm-warn-deep); }
  .badge-grn     { background: var(--pm-link-soft); color: var(--pm-link-hover); }
  .badge-iqc     { background: var(--pm-link-soft); color: var(--pm-link-hover); }
  .badge-oqc     { background: var(--pm-link-soft); color: var(--pm-link-hover); }
  .badge-ipqc    { background: var(--pm-link-soft); color: var(--pm-link-hover); }

  /* ── Spinner ──────────────────────────────────────────────────── */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--pm-hairline);
    border-top-color: var(--pm-primary);
    border-radius: 50%;
    animation: pm-spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  /* ── Toast ────────────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 16px;
    left: 50%; transform: translateX(-50%);
    background: var(--pm-primary);
    color: var(--pm-on-primary);
    padding: 10px 20px;
    border-radius: var(--pm-r-md);
    font-size: 13px; font-weight: 600;
    z-index: 9999;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
    white-space: nowrap;
    box-shadow: var(--pm-shadow-1);
  }
  .toast.show    { opacity: 1; pointer-events: auto; }
  .toast.error   { background: var(--pm-fail); }
  .toast.success { background: var(--pm-pass); }

  /* ── Param row (IPQC / IQC) ───────────────────────────────────── */
  .param-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--pm-rule);
  }
  .param-row:last-child { border-bottom: none; }
  .param-num {
    width: 20px;
    font-family: var(--pm-ff-mono);
    font-size: 11px; color: var(--pm-muted);
    flex-shrink: 0; text-align: center;
  }
  .param-label {
    flex: 1; font-size: 12px; font-weight: 500;
    color: var(--pm-ink-2);
  }
  .param-label .ccp-dot {
    display: inline-block; width: 6px; height: 6px;
    background: var(--pm-primary); border-radius: 50%;
    margin-left: 4px; vertical-align: middle;
  }
  .param-pf { display: flex; gap: 5px; flex-shrink: 0; }
  .param-pf button {
    min-height: 44px; min-width: 44px;
    padding: 6px 12px;
    border: 1.5px solid var(--pm-hairline);
    border-radius: var(--pm-r-sm);
    background: var(--pm-surface);
    font-family: var(--pm-ff-body);
    font-size: 11px; font-weight: 600;
    color: var(--pm-ink-2);
    cursor: pointer; touch-action: manipulation;
    transition: background .15s, border-color .15s, color .15s;
  }
  .param-pf button:active { transform: scale(0.95); transition: transform .08s; }
  .param-pf button.pass { background: var(--pm-pass-soft); border-color: var(--pm-pass); color: var(--pm-pass-deep); }
  .param-pf button.fail { background: var(--pm-fail-soft); border-color: var(--pm-fail); color: var(--pm-fail-deep); }
  .param-pf button.na   { background: var(--pm-canvas);    border-color: var(--pm-hairline-strong); color: var(--pm-muted); }

  /* ── Filter bar ───────────────────────────────────────────────── */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 8px 12px;
    background: var(--pm-surface);
    border-bottom: 1px solid var(--pm-hairline);
    position: sticky; top: 48px; z-index: 95;
  }
  .filter-bar select {
    min-height: 36px;
    border: 1.5px solid var(--pm-hairline);
    border-radius: var(--pm-r-sm);
    padding: 6px 10px;
    font-size: 12px;
    font-family: var(--pm-ff-body);
    background: var(--pm-surface);
    color: var(--pm-ink-2);
    -webkit-appearance: none; cursor: pointer;
  }
  .filter-bar select:focus { outline: none; border-color: var(--pm-primary); }
  .filter-bar button {
    min-height: 36px;
    background: var(--pm-primary);
    color: var(--pm-on-primary);
    border: 0; border-radius: var(--pm-r-sm);
    padding: 6px 16px;
    font-family: var(--pm-ff-body);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .filter-bar button:hover  { background: var(--pm-primary-hover); }
  .filter-bar button:active { background: var(--pm-primary-pressed); }

  /* ── Dashboard table ──────────────────────────────────────────── */
  .dash-table { width: 100%; border-collapse: collapse; }
  .dash-table thead th {
    background: var(--pm-canvas-soft);
    color: var(--pm-muted);
    font-family: var(--pm-ff-display);
    font-size: 10px; font-weight: 700;
    padding: 8px 10px;
    text-align: left;
    letter-spacing: 1px; text-transform: uppercase;
    border-bottom: 1px solid var(--pm-hairline);
  }
  .dash-table tbody tr {
    border-bottom: 1px solid var(--pm-rule);
    cursor: pointer;
    transition: background .1s;
  }
  .dash-table tbody tr:hover { background: var(--pm-canvas-soft); }
  .dash-table tbody td {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--pm-ink-2);
  }
  .dash-table tbody td.pm-mono { font-family: var(--pm-ff-mono); }

  /* ── Detail panel ─────────────────────────────────────────────── */
  .detail-panel {
    background: var(--pm-surface);
    border: 1px solid var(--pm-hairline);
    border-left: 3px solid var(--pm-primary);
    padding: 14px;
    margin-top: 10px;
    border-radius: var(--pm-r-lg);
  }
  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 12px;
  }
  .detail-item .di-label {
    font-size: 11px; font-weight: 600;
    color: var(--pm-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .detail-item .di-value {
    font-size: 13px; font-weight: 600;
    color: var(--pm-ink-2);
    margin-top: 2px;
  }
  .detail-item .di-value.pm-mono { font-family: var(--pm-ff-mono); }

  /* ── Summary cards ────────────────────────────────────────────── */
  .summary-cards {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 10px 12px;
    background: var(--pm-canvas);
    border-bottom: 1px solid var(--pm-hairline);
  }
  @media (max-width: 480px) {
    .summary-cards { grid-template-columns: repeat(2, 1fr); }
  }
  .sum-card {
    background: var(--pm-surface);
    border: 1px solid var(--pm-hairline);
    border-left-width: 3px;
    border-radius: var(--pm-r-lg);
    padding: 10px 12px;
    text-align: left;
  }
  .sum-card .sc-num {
    font-family: var(--pm-ff-mono);
    font-size: 28px; font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .sum-card .sc-lbl {
    font-family: var(--pm-ff-display);
    font-size: 10px; font-weight: 700;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--pm-muted);
  }
  .sum-card.total   { border-left-color: var(--pm-primary);  }
  .sum-card.total   .sc-num { color: var(--pm-primary); }
  .sum-card.pass    { border-left-color: var(--pm-pass);     }
  .sum-card.pass    .sc-num { color: var(--pm-pass-deep); }
  .sum-card.fail    { border-left-color: var(--pm-fail);     }
  .sum-card.fail    .sc-num { color: var(--pm-fail-deep); }
  .sum-card.hold    { border-left-color: var(--pm-hold);     }
  .sum-card.hold    .sc-num { color: var(--pm-hold-deep); }
  .sum-card.pending { border-left-color: var(--pm-hairline-strong); }
  .sum-card.pending .sc-num { color: var(--pm-muted); }

  /* ── Empty state ──────────────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--pm-muted);
    font-size: 13px;
  }
  .empty-state svg { display: block; margin: 0 auto 10px; opacity: 0.4; }

  /* ── Tab bar ──────────────────────────────────────────────────── */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid var(--pm-hairline);
    background: var(--pm-surface);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    position: sticky; top: 48px; z-index: 90;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    min-height: 40px;
    padding: 10px 14px 8px;
    font-family: var(--pm-ff-body);
    font-size: 12px; font-weight: 600;
    color: var(--pm-muted);
    background: transparent; border: 0;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: color .15s, border-color .15s;
  }
  .tab-btn.active {
    color: var(--pm-primary);
    border-bottom-color: var(--pm-primary);
  }
  .tab-count {
    display: inline-block;
    padding: 1px 6px;
    border-radius: var(--pm-r-pill);
    font-family: var(--pm-ff-mono);
    font-size: 10px; font-weight: 700;
    margin-left: 4px;
    background: var(--pm-primary-soft);
    color: var(--pm-primary);
  }
  .tab-btn.active .tab-count {
    background: var(--pm-primary);
    color: var(--pm-on-primary);
  }

  /* ── Centering width modes ─────────────────────────────────────
     Three opt-in modes; body picks one via class:
       .pm-narrow  (forms): 600px max at >=640px viewport.
       .pm-wide    (tables/dashboards): 1280px max at >=1024px viewport.
       (no class) (Landing): full viewport, page owns its own layout.
     ─────────────────────────────────────────────────────────────── */
  @media (min-width: 640px) {
    body.pm-narrow { max-width: 600px; margin-left: auto; margin-right: auto; }
    body.pm-narrow .pm-header,
    body.pm-narrow .filter-bar,
    body.pm-narrow .tab-bar {
      max-width: 600px;
      left: 50%; transform: translateX(-50%);
      width: 100%;
    }
  }
  @media (min-width: 1024px) {
    /* Wide pages: body stays full-viewport (so fixed top chrome and the
       bottom nav can span edge to edge). Any element with .pm-page-wrap
       becomes the centered 1280px content container.
       Pages that don't add .pm-page-wrap fall back to full-bleed content;
       this is intentional — pages with their own grid systems (Landing,
       full-bleed tables) shouldn't be constrained twice. */
    body.pm-wide { max-width: none; margin: 0; }
    body.pm-wide .pm-page-wrap {
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 16px;
      padding-right: 16px;
    }
  }

  /* ── Operator picker modal ────────────────────────────────────── */
  #opModal {
    position: fixed; inset: 0;
    background: rgba(13,27,110,0.55);
    z-index: 99999;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 0 env(safe-area-inset-bottom);
  }
  #opModal.hidden { display: none; }
  .op-sheet {
    background: var(--pm-surface);
    border-radius: var(--pm-r-xl) var(--pm-r-xl) 0 0;
    width: 100%; max-width: 600px;
    padding: 20px 16px 32px;
  }
  .op-sheet-title {
    font-family: var(--pm-ff-display);
    font-size: 15px; font-weight: 700;
    color: var(--pm-primary);
    margin-bottom: 4px;
  }
  .op-sheet-sub {
    font-size: 12px; color: var(--pm-muted);
    margin-bottom: 16px;
  }
  .op-names-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px;
    max-height: 260px; overflow-y: auto;
    margin-bottom: 14px;
  }
  .op-name-btn {
    min-height: 48px;
    border: 1.5px solid var(--pm-hairline);
    border-radius: var(--pm-r-md);
    background: var(--pm-surface);
    font-family: var(--pm-ff-body);
    font-size: 13px; font-weight: 600;
    color: var(--pm-ink-2);
    cursor: pointer;
    text-align: left;
    padding: 10px 12px;
    transition: background .12s, border-color .12s;
  }
  .op-name-btn:active, .op-name-btn.op-selected {
    background: var(--pm-primary-soft);
    border-color: var(--pm-primary);
    color: var(--pm-primary);
  }
  .op-confirm-btn {
    width: 100%; min-height: 48px;
    background: var(--pm-primary);
    color: var(--pm-on-primary);
    border: 0; border-radius: var(--pm-r-md);
    font-family: var(--pm-ff-body);
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .op-confirm-btn:disabled { background: var(--pm-faint); cursor: not-allowed; }

  /* ── Reduced motion ───────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
<script>
  // ── Global error trap (loads in every form via Theme) ─────────────────────────
  // In the GAS document.write double-iframe, an UNCAUGHT JS error tears down the frame
  // and the shell bounces the operator to the homepage — the recurring "form redirects
  // to home after a selection" bug. This catches those errors, shows a non-blocking
  // banner, and KEEPS THE FORM OPEN so a stray null-access can't lose the operator's work.
  // It never navigates and never throws itself.
  (function () {
    var shown = 0;
    function showFormError(msg) {
      try {
        if (shown > 3) return;            // don't spam on an error storm
        shown++;
        var bar = document.getElementById('__pm_errbar__');
        if (!bar) {
          bar = document.createElement('div');
          bar.id = '__pm_errbar__';
          bar.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;' +
            'background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:10px;font:600 12px/1.4 system-ui,sans-serif;' +
            'box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;';
          document.body.appendChild(bar);
        }
        bar.innerHTML = '<span style="flex:1">Something hiccuped — your entry is safe, please continue. ' +
          '<span style="opacity:.75;font-weight:400">(' + String(msg || 'error').slice(0, 90) + ')</span></span>' +
          '<button onclick="var e=document.getElementById(\'__pm_errbar__\');if(e)e.remove();" ' +
          'style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;line-height:1;padding:0 2px;">&times;</button>';
      } catch (e) { /* the error handler must never throw */ }
    }
    window.addEventListener('error', function (ev) {
      showFormError(ev && ev.message ? ev.message : 'script error');
      // returning true would suppress the default; we let it log to console too.
    });
    window.addEventListener('unhandledrejection', function (ev) {
      var r = ev && ev.reason; showFormError(r && r.message ? r.message : String(r || 'promise error'));
    });
    window.PMShowFormError = showFormError;   // forms can surface caught errors the same way
  })();

  // ── pmReady — run init whether or not DOMContentLoaded already fired ───────────
  // GAS injects forms via document.write, so DOMContentLoaded may have ALREADY fired
  // by the time a form's inline <script> attaches its listener — meaning the init
  // (which wires every button/select) NEVER runs, and taps do nothing. This is the
  // "sometimes the buttons don't work" bug. pmReady() runs the fn immediately if the
  // DOM is already parsed, else on DOMContentLoaded — so init always happens.
  window.pmReady = function (fn) {
    try {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fn);
      } else {
        // already parsed — run on next tick so the rest of the inline script finishes first
        setTimeout(fn, 0);
      }
    } catch (e) { try { fn(); } catch (_) {} }
  };

  function goHome() {
    google.script.run
      .withSuccessHandler(function(html) {
        document.open(); document.write(html); document.close();
      })
      .getLandingHtml();
  }

  function getOperatorName() {
    try { return sessionStorage.getItem('pmOperatorName') || ''; } catch(e) { return ''; }
  }
  function setOperatorName(name) {
    try { sessionStorage.setItem('pmOperatorName', name); } catch(e) {}
  }
  function showOperatorPicker(inspectorsList, onConfirm) {
    var existing = document.getElementById('opModal');
    if (existing) existing.remove();
    var modal = document.createElement('div');
    modal.id = 'opModal';
    var names = (inspectorsList && inspectorsList.length) ? inspectorsList : [];
    var nameButtons = names.map(function(n) {
      var name = typeof n === 'string' ? n : (n.name || String(n));
      return '<button class="op-name-btn" data-name="' + name.replace(/"/g, '&quot;') + '">' + name + '</button>';
    }).join('');
    modal.innerHTML =
      '<div class="op-sheet">' +
        '<div class="op-sheet-title">Who are you?</div>' +
        '<div class="op-sheet-sub">Select your name &mdash; required for the shift record</div>' +
        '<div class="op-names-grid" id="opNamesGrid">' + nameButtons + '</div>' +
        '<button class="op-confirm-btn" id="opConfirmBtn" disabled>Confirm &rarr;</button>' +
      '</div>';
    document.body.appendChild(modal);
    var selected = '';
    modal.querySelector('#opNamesGrid').addEventListener('click', function(e) {
      var btn = e.target.closest('.op-name-btn');
      if (!btn) return;
      modal.querySelectorAll('.op-name-btn').forEach(function(b) { b.classList.remove('op-selected'); });
      btn.classList.add('op-selected');
      selected = btn.dataset.name;
      modal.querySelector('#opConfirmBtn').disabled = false;
    });
    modal.querySelector('#opConfirmBtn').addEventListener('click', function() {
      if (!selected) return;
      setOperatorName(selected);
      modal.remove();
      if (typeof onConfirm === 'function') onConfirm(selected);
    });
  }
  function requireOperator(inspectorsList, callback) {
    var name = getOperatorName();
    if (name) { callback(name); return; }
    showOperatorPicker(inspectorsList, callback);
  }
  window.QMS = window.QMS || {};
  window.QMS.getOperatorName    = getOperatorName;
  window.QMS.setOperatorName    = setOperatorName;
  window.QMS.requireOperator    = requireOperator;
  window.QMS.showOperatorPicker = showOperatorPicker;

  // Suppress Google Apps Script "Report abuse / Learn more / created using
  // Google" chrome. GAS now renders this at BOTH top and bottom of the
  // iframe in some embed contexts, so we cover both edges and kill any
  // matching DOM node we can find.
  (function() {
    var COVER_BOTTOM = '__gas_cover_bottom__';
    var COVER_TOP    = '__gas_cover_top__';
    function addCovers() {
      if (!document.getElementById(COVER_BOTTOM)) {
        var b = document.createElement('div');
        b.id = COVER_BOTTOM;
        b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;height:30px;' +
          'background:#F5F7FA;z-index:2147483647;pointer-events:none;';
        document.body.appendChild(b);
      }
      // No top cover here — GAS "Report abuse" bar that appears at the
      // top of some embeds lives in the parent frame, outside our DOM.
      // We CAN'T hide it from inside the iframe. The user has to access
      // the app via the bare /exec URL (not the GAS preview wrapper) to
      // avoid that chrome. The killBanner scan below still tries to nuke
      // any in-document instances.
    }
    function killBanner(node) {
      if (!node || node.nodeType !== 1) return;
      if (node.id === COVER_BOTTOM || node.id === COVER_TOP) return;
      var t = (node.textContent || node.innerText || '');
      if (t.indexOf('Google Apps Script') !== -1 ||
          t.indexOf('created using Google') !== -1 ||
          t.indexOf('Report abuse') !== -1 ||
          t.indexOf('Learn more') !== -1) {
        node.style.cssText = 'display:none!important';
      }
    }
    function scan() {
      addCovers();
      var kids = document.body.children;
      for (var i = 0; i < kids.length; i++) killBanner(kids[i]);
    }
    var obs = new MutationObserver(function(muts) {
      muts.forEach(function(m) { m.addedNodes.forEach(killBanner); });
    });
    function start() {
      scan();
      obs.observe(document.body, { childList: true });
    }
    if (document.body) { start(); }
    else { document.addEventListener('DOMContentLoaded', start); }
    window.addEventListener('load', scan);
  })();

  // ── Return-to-cockpit shim ───────────────────────────────────────────
  // When the QMS v2 cockpit launches a legacy form (GRN/IQC/OQC/…), it sets
  // localStorage.qmsReturnTo='QMSV2'. Forms navigate "home" by calling
  // google.script.run...getFormHtml('Landing'). This shim rewrites that single
  // 'Landing' target to 'QMSV2' so the user lands back in the cockpit instead
  // of the legacy Landing — without editing each form's varied nav code.
  // One-shot: the flag is consumed on the navigation that leaves this form.
  (function () {
    try {
      if (!window.google || !google.script || !google.script.run) return;
      var want = null;
      try { want = window.localStorage.getItem('qmsReturnTo'); } catch (e) {}
      if (want !== 'QMSV2') return;            // only active right after a cockpit launch

      // google.script.run chains: each .withSuccessHandler()/.withFailureHandler()
      // returns a NEW runner object that carries its OWN getFormHtml (not on the
      // prototype). So we must (a) rewrite getFormHtml on each runner, and
      // (b) wrap the chain factories so every derived runner is patched too.
      function patchRunner(run) {
        if (!run || run.__qmsReturnWrapped) return run;
        run.__qmsReturnWrapped = true;
        if (typeof run.getFormHtml === 'function') {
          var origForm = run.getFormHtml;
          run.getFormHtml = function (type) {
            if (type === 'Landing') {
              try { window.localStorage.removeItem('qmsReturnTo'); } catch (e) {}
              return origForm.call(this, 'QMSV2');   // home → cockpit
            }
            return origForm.apply(this, arguments);
          };
        }
        ['withSuccessHandler', 'withFailureHandler', 'withUserObject'].forEach(function (m) {
          if (typeof run[m] !== 'function') return;
          var origChain = run[m];
          run[m] = function () { return patchRunner(origChain.apply(this, arguments)); };
        });
        return run;
      }
      patchRunner(google.script.run);
    } catch (e) {}
  })();
</script>
