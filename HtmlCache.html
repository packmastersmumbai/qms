<!-- Shared HTML cache & prefetch utility. Include via: <?!= include('HtmlCache') ?> in <head>.
     Provides:
       window.PMHtmlCache.navigate(formName)   — instant nav if cached, else server fetch
       window.PMHtmlCache.prefetch(formNames)  — background fetch + store in sessionStorage
       window.PMHtmlCache.invalidate()         — clear all cached HTML
-->
<script>
(function(){
  var PFX = 'pmqms_html_v111_'; // bump on breaking layout changes to force cache reset
  var TTL_MS = 5 * 60 * 1000; // 5 min — HTML is largely static; CacheService handles data freshness

  // One-time sweep: remove any older-version cache keys lingering in sessionStorage.
  try {
    var stale = [];
    for (var si = 0; si < sessionStorage.length; si++) {
      var sk = sessionStorage.key(si);
      if (sk && /^pmqms_html_v\d+_/.test(sk) && sk.indexOf(PFX) !== 0) stale.push(sk);
    }
    stale.forEach(function(k){ sessionStorage.removeItem(k); });
  } catch (e) {}

  function readCache(form) {
    try {
      var raw = sessionStorage.getItem(PFX + form);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || !obj.ts || (Date.now() - obj.ts) > TTL_MS) {
        sessionStorage.removeItem(PFX + form);
        return null;
      }
      return obj.html;
    } catch (e) { return null; }
  }
  function writeCache(form, html) {
    try {
      // Don't cache massive HTML (sessionStorage limit ~5MB total)
      if (html && html.length < 800000) {
        sessionStorage.setItem(PFX + form, JSON.stringify({ ts: Date.now(), html: html }));
      }
    } catch (e) { /* quota exceeded — silently skip */ }
  }
  function clearAll() {
    try {
      var keys = [];
      for (var i = 0; i < sessionStorage.length; i++) {
        var k = sessionStorage.key(i);
        if (k && k.indexOf(PFX) === 0) keys.push(k);
      }
      keys.forEach(function(k){ sessionStorage.removeItem(k); });
    } catch(e) {}
  }

  // ── SPA history ────────────────────────────────────────────────────────────
  // Navigation replaces the document via document.write(), which creates NO
  // history entry. The browser/Android Back button therefore never stepped back a
  // screen — it left the SPA entirely, landing on the last real page load (the
  // old v1 landing page). Verified in the GAS sandboxed iframe: pushState and
  // popstate both work (e2e-histtest.js), despite the double-iframe.
  //
  // Each navigate() pushes an entry tagged with the form name; popstate then
  // re-navigates INTERNALLY instead of unloading the app. pushHistory is false on
  // the popstate path so going back does not itself push a new entry.
  function pushHistory_(form) {
    try {
      if (!history.state || history.state.pmForm !== form) {
        history.pushState({ pmForm: form }, '', location.href);
      }
    } catch (e) { /* sandbox refused — Back simply behaves as before */ }
  }

  try {
    // Seed an entry for the screen we start on, so the FIRST Back has somewhere
    // to land instead of exiting immediately.
    if (!history.state || !history.state.pmForm) {
      history.replaceState({ pmForm: '__start__' }, '', location.href);
    }
    window.addEventListener('popstate', function (ev) {
      var form = ev.state && ev.state.pmForm;
      if (!form || form === '__start__') return;   // let the browser do its thing
      navigate(form, { push: false });
    });
  } catch (e) {}

  function navigate(form, opts) {
    var push = !(opts && opts.push === false);
    if (push) pushHistory_(form);

    var cached = readCache(form);
    if (cached) {
      // Render immediately, then background-refresh to keep cache warm
      document.open(); document.write(cached); document.close();
      // Best-effort background refresh — fires from the NEW page after load if possible
      return;
    }
    // Cold path — show loader, fetch from server
    showInlineLoader(form);
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      window.location.reload();
      return;
    }
    // Watchdog: google.script.run can hang indefinitely when the page's bridge
    // is stale (e.g. the tab was open across a deploy) — neither handler ever
    // fires and the loader sits on "Opening …" forever with no way out.
    // A hard reload re-establishes the bridge and picks up the new version.
    var settled = false;
    var watchdog = setTimeout(function () {
      if (settled) return;
      settled = true;
      try { clearAll(); } catch (e) {}          // drop any stale cached HTML
      window.location.reload();
    }, 15000);

    google.script.run
      .withSuccessHandler(function(html){
        if (settled) return;
        settled = true; clearTimeout(watchdog);
        writeCache(form, html);
        document.open(); document.write(html); document.close();
      })
      .withFailureHandler(function(e){
        if (settled) return;
        settled = true; clearTimeout(watchdog);
        hideInlineLoader();
        showLoadError(form, (e && e.message) || 'Connection problem');
      })
      .getFormHtml(form);
  }

  // Recoverable error panel — alert() is unreliable inside the GAS double-iframe,
  // and a bare alert left the user on a dead page with no way to retry.
  function showLoadError(form, msg) {
    var d = document.createElement('div');
    d.id = '__pmqms_err__';
    d.style.cssText = 'position:fixed;inset:0;background:#f8fafc;color:#0f172a;display:flex;' +
      'flex-direction:column;align-items:center;justify-content:center;z-index:99999;gap:14px;' +
      'font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center;';
    d.innerHTML =
      '<div style="font-size:15px;font-weight:700;">Could not open ' + form + '</div>' +
      '<div style="font-size:13px;color:#6B7280;max-width:340px;">' + msg + '</div>' +
      '<button type="button" id="__pmqms_retry__" style="min-height:44px;padding:0 22px;border:0;' +
      'border-radius:8px;background:#0D1B6E;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">' +
      'Reload</button>';
    document.body.appendChild(d);
    var btn = document.getElementById('__pmqms_retry__');
    if (btn) btn.addEventListener('click', function () {
      try { clearAll(); } catch (e) {}
      window.location.reload();
    });
  }

  function prefetch(forms) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) return;
    var idle = window.requestIdleCallback || function(cb){ return setTimeout(cb, 1500); };
    (forms || []).forEach(function(form, i){
      if (readCache(form)) return; // already cached and fresh
      idle(function(){
        google.script.run
          .withSuccessHandler(function(html){ writeCache(form, html); })
          .withFailureHandler(function(){})
          .getFormHtml(form);
      }, { timeout: 2000 + i * 400 });
    });
  }

  function showInlineLoader(form) {
    var d = document.createElement('div');
    d.id = '__pmqms_loader__';
    // New QMS v2 loader — matches cockpit palette (surface bg, primary accent, clean type).
    d.style.cssText = 'position:fixed;inset:0;background:#f8fafc;color:#0d1b6e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:Manrope,system-ui,sans-serif;gap:18px;';
    d.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;">' +
        '<div style="width:40px;height:40px;border-radius:10px;background:#0d1b6e;color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:.5px;">PM</div>' +
        '<div style="display:flex;flex-direction:column;line-height:1.1;">' +
          '<span style="font-weight:800;font-size:17px;color:#0d1b6e;">PM QMS v2</span>' +
          '<span style="font-size:12px;color:#64748b;">Opening ' + (form||'…') + '</span>' +
        '</div>' +
      '</div>' +
      '<div style="width:30px;height:30px;border:3px solid rgba(13,27,110,0.15);border-top-color:#0d1b6e;border-radius:50%;animation:__pmsp .7s linear infinite;"></div>' +
      '<style>@keyframes __pmsp{to{transform:rotate(360deg);}}</style>';
    document.body.appendChild(d);
  }
  function hideInlineLoader() {
    var d = document.getElementById('__pmqms_loader__');
    if (d) d.remove();
  }

  // Shared Back for form headers. Steps back inside the SPA when there is an
  // internal entry to return to, otherwise goes to Landing — so a directly-opened
  // form still has a sane Back instead of falling out of the app.
  window.pmGoBack_ = function () {
    try {
      if (history.state && history.state.pmForm && history.state.pmForm !== '__start__') {
        history.back();
        return;
      }
    } catch (e) {}
    navigate('Landing');
  };

  window.PMHtmlCache = {
    navigate: navigate,
    prefetch: prefetch,
    invalidate: clearAll,
    _read: readCache,
    _write: writeCache
  };
})();
</script>
