  <style>
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

    .progress-bar-wrap {
      background: var(--border);
      border-radius: 4px;
      height: 6px;
      margin: 8px 0 4px;
      overflow: hidden;
    }

      height: 100%;

      border-radius: 4px;

    .progress-label {

      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-next-item:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }

    .param-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .param-card.card-active {
      border-color: var(--navy);
      box-shadow: var(--shadow-1);
    }
    .param-card.card-pass {
      border-color: var(--success);
      background: #F0FDF4;
    }
    .param-card.card-fail {
      border-color: var(--danger);
      background: #FFF5F5;
    }
    .param-card.card-na {
      border-color: #9CA3AF;
      background: #F9FAFB;
    }
    .param-card-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .param-card-num {
      width: 22px;
      height: 22px;
      background: var(--navy-light);

      font-size: 10px;
      font-weight: 700;

      align-items: center;
      justify-content: center;

    .param-card-info {
      flex: 1;
    }

    }

      font-size: 10px;

      color: var(--danger);

      padding: 1px 6px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .param-card-status {
      flex-shrink: 0;
    }
    .chip-pass {
      display: inline-block;
      background: #DCFCE7;
      color: #15803D;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .chip-fail {
      display: inline-block;
      background: #FEE2E2;
      color: #B91C1C;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;

    }
    .chip-na {
      display: inline-block;

    .param-card-actions {

    .pf-btn {
      flex: 1;
      padding: 8px 6px;
      border: 1.5px solid var(--border);
      border-radius: 6px;

      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      transition: all 0.1s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .pf-btn:active { transform: scale(0.96); }
    .pf-btn.pass { background: #E8F5E9; border-color: var(--success); color: var(--success); }
    .pf-btn.fail { background: #FFEBEE; border-color: var(--danger); color: var(--danger); }
    .pf-btn.na   { background: #F3F4F6; border-color: #9CA3AF; color: var(--muted); }

    .param-card-remarks input {
      width: 100%;
      border: 1.5px solid var(--border);

    }
  </style>
</head>

    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>WhatsApp
  </button>

<div class="toast" id="toast"></div>

<script>
var sessionId   = sessionStorage.getItem('dwmSessionId') || '';
var PARAMS      = [];
var INSPECTORS  = [];
var GRNS        = [];
var GRN_MAP     = {};
var currentItems = [];
var currentItemIndex = 0;
var itemData    = [];
var disposition = '';
var savedRecord = null;
var formSubmitted = false;

window.addEventListener('beforeunload', function() {
  if (!formSubmitted && sessionId) {
    try { google.script.run.pauseDwmTimer(sessionId); } catch(e) {}
  }
});

function init() {
  var today = new Date();
  document.getElementById('date').value = today.toISOString().split('T')[0];

  var prefillRaw = sessionStorage.getItem('iqcPrefill');
  if (prefillRaw) {
    try {
      var pf = JSON.parse(prefillRaw);
      if (pf.supplierName) document.getElementById('supplierName').value = pf.supplierName;
      if (pf.grnRef)       document.getElementById('grnRef').value       = pf.grnRef;
      window._prefillGrnNo = pf.grnNo || '';
      window._prefillBatch = pf.batchNo || '';
    } catch(e) {}
    sessionStorage.removeItem('iqcPrefill');
  }

  google.script.run
    .withSuccessHandler(function(d) {
      document.getElementById('docBadge').textContent = d.docNumber;
      PARAMS     = d.params;
      INSPECTORS = d.inspectors;
      GRNS       = d.recentGRNs || [];

      var iSel = document.getElementById('inspector');
      INSPECTORS.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.name;
        o.textContent = p.name + ' — ' + p.role;
        iSel.appendChild(o);
      });

      var gSel = document.getElementById('grnNo');
      GRNS.forEach(function(g) {
        GRN_MAP[g.grnNo] = g;
        var o = document.createElement('option');
        o.value = g.grnNo;
        o.textContent = g.grnNo + ' | ' + (g.material || '').substring(0, 28) +
          (g.iqcStatus && g.iqcStatus !== 'PENDING' ? ' [' + g.iqcStatus + ']' : '');
        gSel.appendChild(o);
      });

      if (window._prefillGrnNo) {
        gSel.value = window._prefillGrnNo;
        if (gSel.value) onGRNChange();
      }
    })
    .withFailureHandler(function(e) { showToast(e.message, 'error'); })
    .getIQCFormInit();

  document.getElementById('grnNo').addEventListener('change', onGRNChange);

  ['sampleSize','acceptedQty','rejectedQty'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', calcShortage);
  });

  document.getElementById('d_acc').addEventListener('click', function() { setDisp('ACCEPTED'); });
  document.getElementById('d_hld').addEventListener('click', function() { setDisp('HOLD'); });
  document.getElementById('d_rej').addEventListener('click', function() { setDisp('REJECTED'); });
  document.getElementById('d_awd').addEventListener('click', function() { setDisp('ACCEPTED WITH DEVIATION'); });

  document.getElementById('btnSubmit').addEventListener('click', submitIQC);
  document.getElementById('btnWA').addEventListener('click', sendWA);
  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('btnNextItem').addEventListener('click', nextItem);
}

function onGRNChange() {
  var grnNo = document.getElementById('grnNo').value;
  var g = GRN_MAP[grnNo];
  document.getElementById('supplierName').value = g ? (g.supplierName || '') : '';
  document.getElementById('grnRef').value       = grnNo || '';

  currentItems     = [];
  currentItemIndex = 0;
  itemData         = [];
  clearParamCards();

  if (!grnNo) return;

  google.script.run
    .withSuccessHandler(function(items) {
      if (!items || items.length === 0) {
        showToast('No items found for this GRN.', 'error');
        return;
      }
      currentItems = items;
      items.forEach(function() {
        itemData.push({ paramVals: {}, paramRemarks: {},
                        sampleSize: 0, acceptedQty: 0, rejectedQty: 0 });
      });
      currentItemIndex = 0;
      renderCurrentItem();
    })
    .withFailureHandler(function(e) { showToast(e.message, 'error'); })
    .getGRNItems(grnNo);
}

function renderCurrentItem() {
  var item = currentItems[currentItemIndex];
  var total = currentItems.length;

  if (total > 1) {
    document.getElementById('itemNavWrap').style.display = '';
    document.getElementById('singleProgressWrap').style.display = 'none';
    document.getElementById('itemNavLabel').textContent =
      'Item ' + (currentItemIndex + 1) + ' of ' + total;
    document.getElementById('itemNavSub').textContent =
      (item.materialDesc || 'Material') + (item.batchNo ? ' · Batch: ' + item.batchNo : '');
    document.getElementById('btnNextItem').disabled = (currentItemIndex >= total - 1);
  } else {
    document.getElementById('itemNavWrap').style.display = 'none';
    document.getElementById('singleProgressWrap').style.display = '';
    document.getElementById('singleItemLabel').textContent =
      (item.materialDesc || 'Material') + (item.batchNo ? ' · Batch: ' + item.batchNo : '');
  }

  document.getElementById('qtySection').style.display = '';
  document.getElementById('dispositionSection').style.display = '';
  document.getElementById('qtySectionTitle').textContent =
    'Quantities — ' + (item.materialDesc || 'Item ' + (currentItemIndex + 1));

  var d = itemData[currentItemIndex];
  document.getElementById('sampleSize').value  = d.sampleSize  || '';
  document.getElementById('acceptedQty').value = d.acceptedQty || '';
  document.getElementById('rejectedQty').value = d.rejectedQty || '';
  calcShortage();

  buildParamCards();
  updateProgress();
}

function buildParamCards() {
  var body = document.getElementById('paramCardsBody');
  body.innerHTML = '';

  var d = itemData[currentItemIndex];

  PARAMS.forEach(function(p, pi) {
    var card = document.createElement('div');
    card.id        = 'pcard_' + p.id;
    card.className = 'param-card';
    var currentVal = d.paramVals[p.id] || '';
    if (currentVal === 'PASS')      card.className += ' card-pass';
    else if (currentVal === 'FAIL') card.className += ' card-fail';
    else if (currentVal === 'NA')   card.className += ' card-na';

    var headerDiv = document.createElement('div');
    headerDiv.className = 'param-card-header';

    var numDiv = document.createElement('div');
    numDiv.className = 'param-card-num';
    numDiv.textContent = pi + 1;

    var infoDiv = document.createElement('div');
    infoDiv.className = 'param-card-info';

    var nameDiv = document.createElement('div');
    nameDiv.className = 'param-card-name';
    nameDiv.textContent = p.label;
    if (p.ccp) {
      var dot = document.createElement('span');
      dot.className = 'ccp-dot';
      nameDiv.appendChild(dot);
    }

    var specDiv = document.createElement('div');
    specDiv.className = 'param-card-spec';
    specDiv.textContent = p.spec || '';

    infoDiv.appendChild(nameDiv);
    infoDiv.appendChild(specDiv);

    headerDiv.appendChild(numDiv);
    headerDiv.appendChild(infoDiv);

    if (p.ccp) {
      var ccpSpan = document.createElement('span');
      ccpSpan.className = 'param-card-ccp';
      ccpSpan.textContent = '★ CCP';
      headerDiv.appendChild(ccpSpan);
    }

    var chipDiv = document.createElement('div');
    chipDiv.className = 'param-card-status';
    chipDiv.id = 'chip_' + p.id;
    if (currentVal === 'PASS') {
      chipDiv.innerHTML = '<span class="chip-pass">PASS</span>';
    } else if (currentVal === 'FAIL') {
      chipDiv.innerHTML = '<span class="chip-fail">FAIL</span>';
    } else if (currentVal === 'NA') {
      chipDiv.innerHTML = '<span class="chip-na">N/A</span>';
    }
    headerDiv.appendChild(chipDiv);

    card.appendChild(headerDiv);

    var actionsDiv = document.createElement('div');
    actionsDiv.className = 'param-card-actions';

    var passBtn = document.createElement('button');
    passBtn.className = 'pf-btn' + (currentVal === 'PASS' ? ' pass' : '');
    passBtn.textContent = 'Pass';
    passBtn.addEventListener('click', (function(paramId) {
      return function() { setPF(paramId, 'PASS'); };
    })(p.id));

    var failBtn = document.createElement('button');
    failBtn.className = 'pf-btn' + (currentVal === 'FAIL' ? ' fail' : '');
    failBtn.textContent = 'Fail';
    failBtn.addEventListener('click', (function(paramId) {
      return function() { setPF(paramId, 'FAIL'); };
    })(p.id));

    actionsDiv.appendChild(passBtn);
    actionsDiv.appendChild(failBtn);

    if (p.id === 'msds') {
      var naBtn = document.createElement('button');
      naBtn.className = 'pf-btn' + (currentVal === 'NA' ? ' na' : '');
      naBtn.textContent = 'N/A';
      naBtn.addEventListener('click', (function(paramId) {
        return function() { setPF(paramId, 'NA'); };
      })(p.id));
      actionsDiv.appendChild(naBtn);
    }

    card.appendChild(actionsDiv);

    var rmkDiv = document.createElement('div');
    rmkDiv.className = 'param-card-remarks';
    var rmkInput = document.createElement('input');
    rmkInput.type        = 'text';
    rmkInput.id          = 'rmk_' + p.id;
    rmkInput.placeholder = 'Remarks (optional)';
    rmkInput.value       = d.paramRemarks[p.id] || '';
    rmkInput.addEventListener('input', (function(paramId) {
      return function() {
        itemData[currentItemIndex].paramRemarks[paramId] = this.value;
      };
    })(p.id));
    rmkDiv.appendChild(rmkInput);
    card.appendChild(rmkDiv);

    body.appendChild(card);
  });
}

function setPF(paramId, val) {
  var d = itemData[currentItemIndex];
  d.paramVals[paramId] = val;

  var card = document.getElementById('pcard_' + paramId);
  if (card) {
    card.className = 'param-card ' +
      (val === 'PASS' ? 'card-pass' : val === 'FAIL' ? 'card-fail' : 'card-na');
  }

  var chip = document.getElementById('chip_' + paramId);
  if (chip) {
    chip.innerHTML = val === 'PASS'
      ? '<span class="chip-pass">PASS</span>'
      : val === 'FAIL'
        ? '<span class="chip-fail">FAIL</span>'
        : '<span class="chip-na">N/A</span>';
  }

  if (card) {
    var btns = card.querySelectorAll('.pf-btn');
    btns.forEach(function(btn) {
      var t = btn.textContent.trim();
      btn.className = 'pf-btn' +
        (t === 'Pass' && val === 'PASS' ? ' pass' :
         t === 'Fail' && val === 'FAIL' ? ' fail' :
         t === 'N/A'  && val === 'NA'   ? ' na' : '');
    });
  }

  updateProgress();
  autoSuggestDisp();
}

function updateProgress() {
  if (!PARAMS.length) return;
  var d = itemData[currentItemIndex];
  var done = 0;
  PARAMS.forEach(function(p) { if (d.paramVals[p.id]) done++; });
  var total = PARAMS.length;
  var pct   = Math.round(done / total * 100) + '%';

  document.getElementById('progressLabel').textContent  = done + ' / ' + total;
  document.getElementById('progressFill').style.width   = pct;
  document.getElementById('progressLabel2').textContent = done + ' / ' + total;
  document.getElementById('progressFill2').style.width  = pct;
}

function calcShortage() {
  var ss  = parseFloat(document.getElementById('sampleSize').value)  || 0;
  var acc = parseFloat(document.getElementById('acceptedQty').value) || 0;
  var rej = parseFloat(document.getElementById('rejectedQty').value) || 0;

  if (itemData[currentItemIndex]) {
    itemData[currentItemIndex].sampleSize  = ss;
    itemData[currentItemIndex].acceptedQty = acc;
    itemData[currentItemIndex].rejectedQty = rej;
  }

  var el = document.getElementById('shortageDisplay');
  el.textContent = (ss === 0 && acc === 0 && rej === 0)
    ? 'Shortage: —'
    : 'Shortage: ' + (ss - acc - rej);
}

var CCP_IDS = ['qty', 'colour', 'dims', 'weight', 'clean', 'shelf', 'coa'];
function autoSuggestDisp() {
  var anyFail = itemData.some(function(d) {
    return CCP_IDS.some(function(id) { return d.paramVals[id] === 'FAIL'; });
  });
  if (anyFail && !disposition) setDisp('REJECTED');
}

function nextItem() {
  if (currentItemIndex >= currentItems.length - 1) return;
  currentItemIndex++;
  renderCurrentItem();
  document.getElementById('paramCardsBody').scrollIntoView({ behavior: 'smooth' });
}

function clearParamCards() {
  var body = document.getElementById('paramCardsBody');
  body.innerHTML = '';
  var ph = document.createElement('div');
  ph.className = 'params-placeholder';
  ph.id = 'paramPlaceholder';
  ph.textContent = 'Select a GRN to load inspection parameters.';
  body.appendChild(ph);

  document.getElementById('itemNavWrap').style.display        = 'none';
  document.getElementById('singleProgressWrap').style.display = 'none';
  document.getElementById('qtySection').style.display         = 'none';
  document.getElementById('dispositionSection').style.display = 'none';
}

function setDisp(val) {
  disposition = val;
  ['d_acc','d_hld','d_rej','d_awd'].forEach(function(id) {
    document.getElementById(id).className = 'disp-btn';
  });
  if      (val === 'ACCEPTED')                document.getElementById('d_acc').className = 'disp-btn active-acc';
  else if (val === 'HOLD')                    document.getElementById('d_hld').className = 'disp-btn active-hld';
  else if (val === 'REJECTED')                document.getElementById('d_rej').className = 'disp-btn active-rej';
  else if (val === 'ACCEPTED WITH DEVIATION') document.getElementById('d_awd').className = 'disp-btn active-awd';
}

function submitIQC() {
  if (!document.getElementById('grnNo').value)     { showToast('Please select a GRN.', 'error'); return; }
  if (!document.getElementById('inspector').value) { showToast('Please select an Inspector.', 'error'); return; }
  if (!disposition)                                { showToast('Please select a Disposition.', 'error'); return; }
  if (currentItems.length === 0)                   { showToast('No items loaded. Select a GRN first.', 'error'); return; }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  var items = currentItems.map(function(item, ci) {
    var d = itemData[ci] || {};
    return {
      materialDesc: item.materialDesc || '',
      batchNo:      item.batchNo      || '',
      sampleSize:   d.sampleSize  || 0,
      acceptedQty:  d.acceptedQty || 0,
      rejectedQty:  d.rejectedQty || 0,
      params:       d.paramVals   || {},
      paramRemarks: d.paramRemarks || {}
    };
  });

  var data = {
    date:         document.getElementById('date').value,
    inspector:    document.getElementById('inspector').value,
    aqlLevel:     document.getElementById('aqlLevel').value,
    sampleId:     document.getElementById('sampleId').value,
    disposition:  disposition,
    ncrRef:       document.getElementById('ncrRef').value,
    deviationRef: document.getElementById('deviationRef').value,
    remarks:      document.getElementById('remarks').value,
    grnNo:        document.getElementById('grnNo').value,
    supplierName: document.getElementById('supplierName').value,
    sessionId:    sessionId,
    items:        items
  };

  var materialName = currentItems[0] ? (currentItems[0].materialDesc || '') : '';
  var batchNo      = currentItems[0] ? (currentItems[0].batchNo      || '') : '';

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        formSubmitted = true;
        savedRecord = {
          type:        'IQC',
          docNo:       res.docNos[0],
          date:        data.date,
          grnNo:       data.grnNo,
          supplier:    data.supplierName,
          material:    materialName,
          batch:       batchNo,
          inspector:   data.inspector,
          disposition: data.disposition,
          ncrRef:      document.getElementById('ncrRef').value
        };

        autoQmsTask_(sessionId, 'IQC', 'IQC: ' + materialName + ' — ' + batchNo, res.docNos[0]);

        showToast('Saved: ' + res.docNos.join(', '), 'success');
        document.getElementById('btnWA').style.display = 'block';
        btn.innerHTML = 'Saved';
        setTimeout(function() { goHome(); }, 2500);
      } else {
        showToast('Error: ' + res.error, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Save IQC Record';
      }
    })
    .withFailureHandler(function(e) {
      showToast(e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Save IQC Record';
    })
    .saveIQC(data);
}

function autoQmsTask_(sid, type, title, linkedRecord) {
  if (!sid) return;
  google.script.run
    .withFailureHandler(function() {})
    .autoQmsTask_(sid, type, title, linkedRecord);
}

function sendWA() {
  if (!savedRecord) return;
  google.script.run
    .withSuccessHandler(function(url) { window.open(url, '_blank'); })
    .withFailureHandler(function(e) { showToast(e.message, 'error'); })
    .getWhatsAppURLForRecord(savedRecord);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
