  <style>

      0%   { box-shadow: 0 0 0 0 rgba(232,160,32,0.6); }

    /* Parameter row */
    .param-row-iqc {

      border-color: var(--navy);

    /* Disposition card */
    .disp-card {
      background: var(--white);
      border-radius: var(--radius);

<script>
/* ────────────────────────────────────────────────
   CONSTANTS
──────────────────────────────────────────────── */
var IQC_PARAMS = [
  {id:'qty',   label:'Quantity',             spec:'As per PO'},
  {id:'pkg',   label:'Packaging Condition',  spec:'Intact / Undamaged'},
  {id:'colour',label:'Colour',               spec:'Per approved sample'},
  {id:'shape', label:'Shape / Form',         spec:'Per specification'},
  {id:'dims',  label:'Size / Dimensions',    spec:'Per spec sheet'},
  {id:'weight',label:'Net Weight',           spec:'Per spec (calibrated balance)'},
  {id:'clean', label:'Cleanliness',          spec:'No contamination'},
  {id:'odour', label:'Odour',                spec:'Normal / None'},
  {id:'label', label:'Label Accuracy',       spec:'Matches PO / Spec'},
  {id:'msds',  label:'MSDS / SDS Available', spec:'Received'},
  {id:'shelf', label:'Shelf Life / Expiry',  spec:'Min 75% remaining'},
  {id:'coa',   label:'COA / Test Report',    spec:'Received & Verified'}
];

/* ────────────────────────────────────────────────
   STATE
──────────────────────────────────────────────── */
var sessionId    = sessionStorage.getItem('dwmSessionId') || null;
var taskId       = null;
var formSaved    = false;

/* Prefill data (from sessionStorage.grnPrefill) */
var prefill      = null;   /* { supplierId, supplierName, itemCode, itemName, batchNo, grnId } */

/* Form init data */
var initData     = null;   /* { docNumber, recentGRNs, inspectors, aqlLevels, defaultAql, today } */
var GRN_MAP      = {};

/* Item state */
var currentItems = [];     /* [{materialDesc, batchNo, qtyReceived, unit}] */
var currentIdx   = 0;      /* index of item being inspected */
var itemData     = [];     /* per-item: {params:{}, sampleSize, acceptedQty, rejectedQty, disp} */

/* Summary */
var overallDisp  = '';

/* ────────────────────────────────────────────────
   INIT
──────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  /* Read and clear prefill immediately */
  var pfRaw = sessionStorage.getItem('grnPrefill');
  if (pfRaw) {
    sessionStorage.removeItem('grnPrefill');
    try { prefill = JSON.parse(pfRaw); } catch(e) { prefill = null; }
  }

  /* Set today's date */
  var today = new Date();
  var yyyy  = today.getFullYear();
  var mm    = ('0' + (today.getMonth() + 1)).slice(-2);
  var dd    = ('0' + today.getDate()).slice(-2);
  var todayStr = yyyy + '-' + mm + '-' + dd;
  document.getElementById('dateField').value = todayStr;

  /* Wire static events */
  document.getElementById('s1BackBtn').addEventListener('click', onScreen1Back);
  document.getElementById('s2BackBtn').addEventListener('click', onScreen2Back);
  document.getElementById('grnNo').addEventListener('change', onGRNChange);
  document.getElementById('sampleSize').addEventListener('input', saveQtyState);
  document.getElementById('acceptedQty').addEventListener('input', saveQtyState);
  document.getElementById('rejectedQty').addEventListener('input', saveQtyState);

  /* Load init data */
  google.script.run
    .withSuccessHandler(onInitLoaded)
    .withFailureHandler(function(e) { showToast(e.message || 'Load error', 'error'); })
    .getIQCFormInit();
});

window.addEventListener('beforeunload', function() {
  if (!formSaved && taskId && sessionId) {
    try { google.script.run.stopTimer(taskId, sessionId); } catch(e) {}
  }
});

/* ────────────────────────────────────────────────
   INIT LOADED
──────────────────────────────────────────────── */
function onInitLoaded(d) {
  initData = d;
  document.getElementById('docBadge').textContent = d.docNumber || 'IQC';

  /* Populate inspector select */
  var iSel = document.getElementById('inspector');
  var inspectors = d.inspectors || [];
  for (var i = 0; i < inspectors.length; i++) {
    var ins = inspectors[i];
    var o = document.createElement('option');
    o.value = ins.name || ins;
    o.textContent = ins.name ? (ins.name + (ins.role ? ' — ' + ins.role : '')) : ins;
    iSel.appendChild(o);
  }

  /* Populate AQL select */
  var aqlSel = document.getElementById('aqlLevel');
  var aqlLevels = d.aqlLevels || [];
  if (aqlLevels.length) {
    aqlSel.innerHTML = '';
    for (var j = 0; j < aqlLevels.length; j++) {
      var ao = document.createElement('option');
      ao.value = aqlLevels[j];
      ao.textContent = aqlLevels[j];
      if (aqlLevels[j] === d.defaultAql) ao.selected = true;
      aqlSel.appendChild(ao);
    }
  }

  /* Build GRN map */
  var grns = d.recentGRNs || [];
  var gSel = document.getElementById('grnNo');
  for (var k = 0; k < grns.length; k++) {
    var g = grns[k];
    GRN_MAP[g.grnNo] = g;
    var go = document.createElement('option');
    go.value = g.grnNo;
    go.textContent = g.grnNo + ' | ' + (g.supplierName || '').substring(0, 24) +
      (g.date ? ' (' + g.date + ')' : '');
    gSel.appendChild(go);
  }

  /* Set today date from server if provided */
  if (d.today) {
    document.getElementById('dateField').value = d.today;
  }

  /* Handle prefill vs manual */
  if (prefill && prefill.grnId) {
    renderPrefill();
  } else {
    /* manual mode - show form fields, nothing more until GRN selected */
  }

  /* DWM task */
  if (sessionId) {
    var title = 'IQC Inspection' + (prefill && prefill.itemName ? ' — ' + prefill.itemName : '');
    var grnId = prefill ? (prefill.grnId || '') : '';
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.taskId) taskId = res.taskId;
      })
      .withFailureHandler(function() {})
      .autoQmsTask_(sessionId, 'IQC', title, grnId);
  }
}

/* ────────────────────────────────────────────────
   PREFILL MODE
──────────────────────────────────────────────── */
function renderPrefill() {
  document.getElementById('prefillStrip').style.display = '';
  document.getElementById('manualSection').style.display = 'none';

  var pf = prefill;
  document.getElementById('pfItemName').textContent = pf.itemName || pf.itemCode || 'Item';
  document.getElementById('pfMeta').textContent =
    (pf.supplierName || '') +
    (pf.batchNo ? '  ·  Batch: ' + pf.batchNo : '') +
    (pf.grnId   ? '  ·  GRN #' + pf.grnId : '');

  /* Build single synthetic item */
  var item = {
    materialDesc: pf.itemName || pf.itemCode || 'Item',
    batchNo:      pf.batchNo  || '',
    qtyReceived:  '',
    unit:         ''
  };
  currentItems = [item];
  itemData = [makeBlankItemData()];
  currentIdx = 0;
  renderCurrentItem();
}

/* ────────────────────────────────────────────────
   GRN CHANGE
──────────────────────────────────────────────── */
function onGRNChange() {
  var grnNo = document.getElementById('grnNo').value;
  var g     = GRN_MAP[grnNo];
  document.getElementById('supplierField').value = g ? (g.supplierName || '') : '';

  currentItems = [];
  currentIdx   = 0;
  itemData     = [];
  document.getElementById('paramSectionWrap').innerHTML = '';
  document.getElementById('dispCard').style.display = 'none';
  document.getElementById('itemProgressWrap').style.display = 'none';
  document.getElementById('stickyBtn').disabled = true;
  document.getElementById('stickyLabel').textContent = '—';

  if (!grnNo) return;

  google.script.run
    .withSuccessHandler(function(items) {
      if (!items || items.length === 0) {
        showToast('No items found for this GRN.', 'error');
        return;
      }
      currentItems = items;
      for (var i = 0; i < items.length; i++) {
        itemData.push(makeBlankItemData());
      }
      currentIdx = 0;
      renderCurrentItem();
    })
    .withFailureHandler(function(e) { showToast(e.message || 'Error loading GRN items', 'error'); })
    .getGRNItems(grnNo);
}

/* ────────────────────────────────────────────────
   ITEM RENDERING
──────────────────────────────────────────────── */
function makeBlankItemData() {
  return {params: {}, sampleSize: 0, acceptedQty: 0, rejectedQty: 0, disp: ''};
}

function renderCurrentItem() {
  var item  = currentItems[currentIdx];
  var total = currentItems.length;

  /* Item progress bar */
  var wrap = document.getElementById('itemProgressWrap');
  wrap.style.display = '';
  var pct = Math.round((currentIdx + 1) / total * 100);
  document.getElementById('itemProgressLabel').textContent =
    'Item ' + (currentIdx + 1) + ' of ' + total +
    (item.materialDesc ? '  ·  ' + item.materialDesc : '') +
    (item.batchNo ? '  (Batch: ' + item.batchNo + ')' : '');
  document.getElementById('itemProgFill').style.width = pct + '%';

  /* Restore qty fields */
  var d = itemData[currentIdx];
  document.getElementById('sampleSize').value  = d.sampleSize  || '';
  document.getElementById('acceptedQty').value = d.acceptedQty || '';
  document.getElementById('rejectedQty').value = d.rejectedQty || '';

  /* Build param cards */
  buildParamSection();

  /* Update disposition card */
  updateDispCard();

  /* Sticky bar */
  updateStickyBar();
}

function buildParamSection() {
  var wrap = document.getElementById('paramSectionWrap');
  wrap.innerHTML = '';

  var sec = document.createElement('div');
  sec.className = 'params-section';

  var titleBar = document.createElement('div');
  titleBar.className = 'params-section-title';
  titleBar.id = 'paramSectionTitle';
  titleBar.textContent = 'INSPECTION PARAMETERS';
  sec.appendChild(titleBar);

  var d = itemData[currentIdx];

  for (var i = 0; i < IQC_PARAMS.length; i++) {
    var p    = IQC_PARAMS[i];
    var val  = d.params[p.id] || '';

    var row = document.createElement('div');
    row.className = 'param-row-iqc' + getRowClass(val);
    row.id = 'paramRow_' + p.id;

    var nameDiv = document.createElement('div');
    nameDiv.className = 'param-name';
    nameDiv.textContent = p.label;

    var specDiv = document.createElement('div');
    specDiv.className = 'param-spec';
    specDiv.textContent = p.spec;

    var toggleDiv = document.createElement('div');
    toggleDiv.className = 'param-toggle';

    var passBtn = document.createElement('button');
    passBtn.textContent = 'PASS';
    passBtn.className = val === 'PASS' ? 'sel-pass' : '';
    passBtn.setAttribute('data-param', p.id);
    passBtn.setAttribute('data-val', 'PASS');
    passBtn.onclick = makeParamHandler(p.id, 'PASS');

    var failBtn = document.createElement('button');
    failBtn.textContent = 'FAIL';
    failBtn.className = val === 'FAIL' ? 'sel-fail' : '';
    failBtn.setAttribute('data-param', p.id);
    failBtn.setAttribute('data-val', 'FAIL');
    failBtn.onclick = makeParamHandler(p.id, 'FAIL');

    var naBtn = document.createElement('button');
    naBtn.textContent = 'NA';
    naBtn.className = val === 'NA' ? 'sel-na' : '';
    naBtn.setAttribute('data-param', p.id);
    naBtn.setAttribute('data-val', 'NA');
    naBtn.onclick = makeParamHandler(p.id, 'NA');

    toggleDiv.appendChild(passBtn);
    toggleDiv.appendChild(failBtn);
    toggleDiv.appendChild(naBtn);

    row.appendChild(nameDiv);
    row.appendChild(specDiv);
    row.appendChild(toggleDiv);

    sec.appendChild(row);
  }

  wrap.appendChild(sec);

  document.getElementById('dispCard').style.display = '';
  updateParamSectionTitle();
}

function makeParamHandler(paramId, val) {
  return function() { setParam(paramId, val); };
}

function setParam(paramId, val) {
  var d = itemData[currentIdx];
  d.params[paramId] = val;

  /* Update row class */
  var row = document.getElementById('paramRow_' + paramId);
  if (row) {
    row.className = 'param-row-iqc' + getRowClass(val);
    if (val === 'FAIL') {
      /* Trigger shake by toggling a class */
      row.style.animation = 'none';
      /* Force reflow */
      void row.offsetHeight;
      row.style.animation = 'shake 0.3s ease';
    }
  }

  /* Update button states */
  var btns = row ? row.querySelectorAll('.param-toggle button') : [];
  for (var i = 0; i < btns.length; i++) {
    var bv = btns[i].getAttribute('data-val');
    btns[i].className = bv === val ? getSelClass(val) : '';
  }

  updateParamSectionTitle();
  updateDispCard();
  updateStickyBar();
}

function getRowClass(val) {
  if (val === 'PASS') return ' row-pass';
  if (val === 'FAIL') return ' row-fail';
  if (val === 'NA')   return ' row-na';
  return '';
}

function getSelClass(val) {
  if (val === 'PASS') return 'sel-pass';
  if (val === 'FAIL') return 'sel-fail';
  if (val === 'NA')   return 'sel-na';
  return '';
}

function allParamsFilled() {
  var d = itemData[currentIdx];
  for (var i = 0; i < IQC_PARAMS.length; i++) {
    if (!d.params[IQC_PARAMS[i].id]) return false;
  }
  return true;
}

function updateParamSectionTitle() {
  var titleBar = document.getElementById('paramSectionTitle');
  if (!titleBar) return;
  if (allParamsFilled()) {
    titleBar.className = 'params-section-title all-done';
    titleBar.textContent = 'INSPECTION PARAMETERS';
  } else {
    titleBar.className = 'params-section-title';
    titleBar.textContent = 'INSPECTION PARAMETERS';
  }
}

function countFilled() {
  var d = itemData[currentIdx];
  var n = 0;
  for (var i = 0; i < IQC_PARAMS.length; i++) {
    if (d.params[IQC_PARAMS[i].id]) n++;
  }
  return n;
}

/* ────────────────────────────────────────────────
   DISPOSITION CARD (per item)
──────────────────────────────────────────────── */
function updateDispCard() {
  var locked   = document.getElementById('dispLocked');
  var grid     = document.getElementById('dispGrid');
  var allFilled = allParamsFilled();

  if (!allFilled) {
    locked.style.display = '';
    grid.style.display   = 'none';
    return;
  }

  locked.style.display = 'none';
  grid.style.display   = '';

  /* Auto-select if not already chosen for this item */
  var d = itemData[currentIdx];
  if (!d.disp) {
    var anyFail = false;
    var anyPass = false;
    for (var i = 0; i < IQC_PARAMS.length; i++) {
      var v = d.params[IQC_PARAMS[i].id];
      if (v === 'FAIL') { anyFail = true; break; }
      if (v === 'PASS') anyPass = true;
    }
    var autoDisp = anyFail ? 'REJECTED' : (anyPass ? 'ACCEPTED' : 'HOLD');
    d.disp = autoDisp;
  }
  renderItemDispButtons(d.disp);
}

function setItemDisp(val) {
  itemData[currentIdx].disp = val;
  renderItemDispButtons(val);
  updateStickyBar();
}

function renderItemDispButtons(val) {
  var map = {dAcc:'ACCEPTED', dRej:'REJECTED', dHld:'HOLD', dAwd:'AWD'};
  var activeMap = {ACCEPTED:'active-acc', REJECTED:'active-rej', HOLD:'active-hld', AWD:'active-awd'};
  for (var id in map) {
    var el = document.getElementById(id);
    if (el) el.className = 'disp-btn' + (map[id] === val ? ' ' + (activeMap[val] || '') : '');
  }
}

function saveQtyState() {
  var d = itemData[currentIdx];
  if (!d) return;
  d.sampleSize  = parseFloat(document.getElementById('sampleSize').value)  || 0;
  d.acceptedQty = parseFloat(document.getElementById('acceptedQty').value) || 0;
  d.rejectedQty = parseFloat(document.getElementById('rejectedQty').value) || 0;
}

/* ────────────────────────────────────────────────
   STICKY BAR
──────────────────────────────────────────────── */
function updateStickyBar() {
  var total   = currentItems.length;
  var label   = document.getElementById('stickyLabel');
  var btn     = document.getElementById('stickyBtn');

  label.textContent = 'Item ' + (currentIdx + 1) + ' of ' + total;

  var isLast  = currentIdx >= total - 1;
  btn.textContent = isLast ? 'Review Summary →' : 'Next Item →';

  var d = itemData[currentIdx];
  var dispSet = allParamsFilled() && d.disp;
  btn.disabled = !dispSet;
}

function onStickyTap() {
  saveQtyState();

  var d = itemData[currentIdx];
  if (!d.disp) {
    /* Pulse amber on disp card */
    var card = document.getElementById('dispCard');
    if (card) {
      card.classList.remove('pulse-amber');
      void card.offsetHeight;
      card.classList.add('pulse-amber');
      setTimeout(function() { card.classList.remove('pulse-amber'); }, 500);
    }
    return;
  }

  var total  = currentItems.length;
  var isLast = currentIdx >= total - 1;

  if (isLast) {
    showSummary();
  } else {
    currentIdx++;
    renderCurrentItem();
    window.scrollTo(0, 0);
  }
}

/* ────────────────────────────────────────────────
   BACK NAVIGATION
──────────────────────────────────────────────── */
function onScreen1Back() {
  if (!formSaved && currentItems.length > 0) {
    if (!confirm('Leave IQC? Unsaved data will be lost.')) return;
  }
  goHome();
}

function onScreen2Back() {
  /* Return to last item */
  currentIdx = currentItems.length - 1;
  document.getElementById('screen2').style.display = 'none';
  document.getElementById('screen1').style.display = '';
  renderCurrentItem();
  window.scrollTo(0, 0);
}

/* ────────────────────────────────────────────────
   SUMMARY SCREEN
──────────────────────────────────────────────── */
function showSummary() {
  /* Batch info */
  var firstItem = currentItems[0] || {};
  var sup = prefill ? (prefill.supplierName || '') :
    (document.getElementById('supplierField').value || '');
  var batchNo = prefill ? (prefill.batchNo || '') : (firstItem.batchNo || '');
  var itemName = prefill ? (prefill.itemName || firstItem.materialDesc || '') : (firstItem.materialDesc || '');

  document.getElementById('sumBatchName').textContent =
    itemName + (sup ? ' — ' + sup : '');

  var today = document.getElementById('dateField').value || '';
  document.getElementById('sumBatchMeta').textContent =
    'Batch ' + (batchNo || '—') +
    ' · ' + currentItems.length + ' item' + (currentItems.length !== 1 ? 's' : '') +
    ' · ' + today;

  /* Items list */
  var listEl = document.getElementById('sumItemsList');
  listEl.innerHTML = '';
  for (var i = 0; i < currentItems.length; i++) {
    listEl.appendChild(makeSummaryItemRow(i));
  }

  /* Auto-select overall disposition (worst-case) */
  var hasReject = false;
  var hasHold   = false;
  var hasAwd    = false;
  for (var j = 0; j < itemData.length; j++) {
    var dv = itemData[j].disp;
    if (dv === 'REJECTED') { hasReject = true; break; }
    if (dv === 'HOLD')     hasHold = true;
    if (dv === 'AWD')      hasAwd  = true;
  }
  var autoOD = hasReject ? 'REJECTED' :
               hasHold   ? 'HOLD' :
               hasAwd    ? 'AWD' : 'ACCEPTED';
  setOverallDisp(autoOD);

  document.getElementById('screen1').style.display = 'none';
  document.getElementById('screen2').style.display = '';
  window.scrollTo(0, 0);
}

function makeSummaryItemRow(idx) {
  var item = currentItems[idx];
  var d    = itemData[idx];

  /* Count pass percentage */
  var passCount = 0;
  var total     = IQC_PARAMS.length;
  for (var i = 0; i < total; i++) {
    if (d.params[IQC_PARAMS[i].id] === 'PASS') passCount++;
  }
  var passPct = total > 0 ? Math.round(passCount / total * 100) : 0;

  var row = document.createElement('div');
  row.className = 'item-row-summary';
  (function(capturedIdx) {
    row.onclick = function() { goToItem(capturedIdx); };
  })(idx);

  var labelEl = document.createElement('div');
  labelEl.className = 'sum-item-label';
  labelEl.textContent = 'Item ' + (idx + 1);

  var barWrap = document.createElement('div');
  barWrap.className = 'sum-item-bar-wrap';
  var barFill = document.createElement('div');
  barFill.className = 'sum-item-bar-fill';
  barFill.style.width = passPct + '%';
  barWrap.appendChild(barFill);

  var right = document.createElement('div');
  right.className = 'sum-item-right';

  var badge = document.createElement('span');
  badge.className = 'disp-badge ' + getDispBadgeClass(d.disp);
  badge.textContent = dispLabel(d.disp);

  var editIcon = document.createElement('span');
  editIcon.className = 'sum-edit-icon';
  editIcon.textContent = '✎';

  right.appendChild(badge);
  right.appendChild(editIcon);

  row.appendChild(labelEl);
  row.appendChild(barWrap);
  row.appendChild(right);

  return row;
}

function goToItem(idx) {
  currentIdx = idx;
  document.getElementById('screen2').style.display = 'none';
  document.getElementById('screen1').style.display = '';
  renderCurrentItem();
  window.scrollTo(0, 0);
}

function getDispBadgeClass(disp) {
  if (disp === 'ACCEPTED') return 'disp-badge-acc';
  if (disp === 'REJECTED') return 'disp-badge-rej';
  if (disp === 'HOLD')     return 'disp-badge-hld';
  if (disp === 'AWD')      return 'disp-badge-awd';
  return 'disp-badge-none';
}

function dispLabel(disp) {
  if (disp === 'ACCEPTED') return 'ACCEPT';
  if (disp === 'REJECTED') return 'REJECT';
  if (disp === 'HOLD')     return 'HOLD';
  if (disp === 'AWD')      return 'AWD';
  return '—';
}

/* ────────────────────────────────────────────────
   OVERALL DISPOSITION
──────────────────────────────────────────────── */
function setOverallDisp(val) {
  overallDisp = val;
  var map = {odAcc:'ACCEPTED', odRej:'REJECTED', odHld:'HOLD', odAwd:'AWD'};
  var activeMap = {ACCEPTED:'active-acc', REJECTED:'active-rej', HOLD:'active-hld', AWD:'active-awd'};
  for (var id in map) {
    var el = document.getElementById(id);
    if (el) el.className = 'disp-btn' + (map[id] === val ? ' ' + (activeMap[val] || '') : '');
  }
  document.getElementById('saveBtn').disabled = false;
}

/* ────────────────────────────────────────────────
   SAVE
──────────────────────────────────────────────── */
function saveIQC() {
  if (!overallDisp) { showToast('Please select overall disposition.', 'error'); return; }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  /* Stop timer first (best-effort) */
  if (taskId && sessionId) {
    try { google.script.run.stopTimer(taskId, sessionId); } catch(e) {}
  }

  /* Build items array */
  var items = [];
  for (var i = 0; i < currentItems.length; i++) {
    var ci   = currentItems[i];
    var d    = itemData[i] || {};
    var pmap = d.params || {};
    items.push({
      materialDesc: ci.materialDesc || '',
      batchNo:      ci.batchNo      || '',
      sampleSize:   d.sampleSize    || 0,
      acceptedQty:  d.acceptedQty   || 0,
      rejectedQty:  d.rejectedQty   || 0,
      params: {
        qty:    pmap.qty    || 'NA',
        pkg:    pmap.pkg    || 'NA',
        colour: pmap.colour || 'NA',
        shape:  pmap.shape  || 'NA',
        dims:   pmap.dims   || 'NA',
        weight: pmap.weight || 'NA',
        clean:  pmap.clean  || 'NA',
        odour:  pmap.odour  || 'NA',
        label:  pmap.label  || 'NA',
        msds:   pmap.msds   || 'NA',
        shelf:  pmap.shelf  || 'NA',
        coa:    pmap.coa    || 'NA'
      }
    });
  }

  var firstItem = currentItems[0] || {};
  var grnNoVal  = prefill ? (prefill.grnId || '') : document.getElementById('grnNo').value;
  var supVal    = prefill ? (prefill.supplierName || '') : document.getElementById('supplierField').value;

  var data = {
    date:         document.getElementById('dateField').value,
    grnNo:        grnNoVal,
    supplierName: supVal,
    inspector:    document.getElementById('inspector').value,
    aqlLevel:     document.getElementById('aqlLevel').value,
    sampleId:     document.getElementById('sampleId').value,
    disposition:  overallDisp,
    remarks:      document.getElementById('remarks').value,
    ncrRef:       document.getElementById('ncrRef').value,
    deviationRef: document.getElementById('deviationRef').value,
    items:        items
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        formSaved = true;
        showToast('IQC record saved', 'success');
        setTimeout(function() { goHome(); }, 1500);
      } else {
        showToast('Error: ' + ((res && res.error) || 'Unknown error'), 'error');
        btn.disabled = false;
        btn.textContent = 'SAVE IQC RECORD';
      }
    })
    .withFailureHandler(function(e) {
      showToast(e.message || 'Save failed', 'error');
      btn.disabled = false;
      btn.textContent = 'SAVE IQC RECORD';
    })
    .saveIQC(data, sessionId);
}

/* ────────────────────────────────────────────────
   UTILITIES
──────────────────────────────────────────────── */
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}
</script>
</body>
</html>
