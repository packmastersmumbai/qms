<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <style>
    body { min-width: 580px; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ccp-legend { font-size:10px; color:var(--muted); margin-bottom:6px; }
    .ccp-legend span { color:var(--danger); font-weight:700; }

    /* Matrix table */
    .matrix-th-label {
      position: sticky;
      left: 0;
      background: var(--white);
      z-index: 2;
      min-width: 200px;
      text-align: left;
      padding: 6px 10px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }
    .matrix-td-label {
      position: sticky;
      left: 0;
      background: var(--white);
      z-index: 1;
      min-width: 200px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }
    .matrix-th-item {
      min-width: 130px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      background: #F8FAFC;
      vertical-align: top;
      line-height: 1.4;
    }
    .matrix-td {
      min-width: 130px;
      padding: 5px 6px;
      border: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
    }
    .matrix-td input[type=number] {
      width: 80px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    .matrix-shortage {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .matrix-qty-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .ccp-star { color: var(--danger); font-weight: 700; margin-left: 3px; }
    .param-num-sm { color: var(--muted); font-size: 10px; margin-right: 4px; }

    /* Matrix P/F/NA buttons */
    .matrix-td button {
      padding: 4px 10px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      background: var(--white);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .matrix-td button.pass { background:#E8F5E9; border-color:var(--success); color:var(--success); }
    .matrix-td button.fail { background:#FFEBEE; border-color:var(--danger);  color:var(--danger);  }
    .matrix-td button.na   { background:#F3F4F6; border-color:#9CA3AF;        color:#6B7280;        }
  </style>
</head>
<body>

<div class="pm-header"><a onclick="goHome()" style="color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;margin-right:4px;text-decoration:none;">‹</a>
  <span class="logo-text">🔍 Incoming Quality Check</span>
  <span class="doc-badge" id="docBadge">Loading…</span>
</div>

<div style="padding-bottom:80px; overflow-y:auto;">

  <!-- Header Info -->
  <div class="section">
    <div class="section-title">Inspection Details</div>
    <div class="section-body">
      <div class="two-col">
        <div class="field">
          <label>Date</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label>Inspector</label>
          <select id="inspector">
            <option value="">— Select —</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Linked GRN No.</label>
        <select id="grnNo" onchange="onGRNChange()">
          <option value="">— Select GRN —</option>
        </select>
      </div>

      <div class="field">
        <label>Supplier</label>
        <input type="text" id="supplierName" readonly placeholder="Auto-filled from GRN">
      </div>
    </div>
  </div>

  <!-- Sampling (shared) -->
  <div class="section">
    <div class="section-title">Sampling</div>
    <div class="section-body">
      <div class="two-col">
        <div class="field">
          <label>AQL Level</label>
          <select id="aqlLevel">
            <option value="AQL 2.5">AQL 2.5 (Default)</option>
            <option value="AQL 0.65">AQL 0.65</option>
            <option value="AQL 1.0">AQL 1.0</option>
            <option value="AQL 4.0">AQL 4.0</option>
            <option value="AQL 6.5">AQL 6.5</option>
          </select>
        </div>
        <div class="field">
          <label>Sample ID</label>
          <input type="text" id="sampleId" placeholder="Sample ref">
        </div>
      </div>
    </div>
  </div>

  <!-- Inspection Matrix -->
  <div class="section">
    <div class="section-title">Inspection Parameters
      <span style="font-size:10px;font-weight:400;color:var(--muted);margin-left:8px;">
        ★ = Critical Control Point
      </span>
    </div>
    <div class="section-body" style="padding:0;">
      <div id="matrixWrap" style="overflow-x:auto;">
        <div id="matrixPlaceholder" style="padding:16px;color:var(--muted);font-size:13px;">
          Select a GRN to load inspection items.
        </div>
        <table id="matrixTable" style="display:none;border-collapse:collapse;width:100%;min-width:400px;">
          <thead id="matrixHead"></thead>
          <tbody id="matrixBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Disposition -->
  <div class="section">
    <div class="section-title">Disposition</div>
    <div class="section-body">
      <div class="disp-grid">
        <button class="disp-btn" id="d_acc" onclick="setDisp('ACCEPTED')">✅ ACCEPT</button>
        <button class="disp-btn" id="d_hld" onclick="setDisp('HOLD')">⏸ HOLD</button>
        <button class="disp-btn" id="d_rej" onclick="setDisp('REJECTED')">❌ REJECT</button>
        <button class="disp-btn" id="d_awd" onclick="setDisp('ACCEPTED WITH DEVIATION')">⚠️ WITH DEVIATION</button>
      </div>
      <div class="two-col" style="margin-top:10px;">
        <div class="field">
          <label>NCR Ref <span style="font-size:10px;font-weight:400;">(if reject)</span></label>
          <input type="text" id="ncrRef" placeholder="Auto-generated if blank">
        </div>
        <div class="field">
          <label>Deviation Ref <span style="font-size:10px;font-weight:400;">(if deviation)</span></label>
          <input type="text" id="deviationRef" placeholder="Deviation ref no.">
        </div>
      </div>
      <div class="field">
        <label>Remarks</label>
        <textarea id="remarks" placeholder="Inspector observations…"></textarea>
      </div>
    </div>
  </div>

</div>

<!-- Sticky footer -->
<div style="position:fixed;bottom:0;left:0;right:0;background:var(--white);padding:10px 14px;border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,0.06);display:flex;gap:8px;">
  <button class="btn-submit" id="btnSubmit" onclick="submitIQC()" style="flex:2;">Save IQC Record</button>
  <button class="btn-wa" id="btnWA" onclick="sendWA()" style="flex:1;margin-top:0;display:none;">📲 WhatsApp</button>
</div>

<div class="toast" id="toast"></div>

<script>
var PARAMS = [], INSPECTORS = [], GRNS = [], GRN_MAP = {};
var disposition = '', savedRecord = null;

// itemParamVals[colIndex][paramId] = 'PASS' | 'FAIL' | 'NA' | ''
var itemParamVals = [];
// currentItems holds the array returned by getGRNItems for the selected GRN
var currentItems = [];

function init() {
  var today = new Date();
  document.getElementById('date').value = today.toISOString().split('T')[0];

  google.script.run
    .withSuccessHandler(function(d) {
      document.getElementById('docBadge').textContent = d.docNumber;
      PARAMS     = d.params;
      INSPECTORS = d.inspectors;
      GRNS       = d.recentGRNs;

      // Populate inspectors dropdown
      var iSel = document.getElementById('inspector');
      INSPECTORS.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.name;
        o.textContent = p.name + ' — ' + p.role;
        iSel.appendChild(o);
      });

      // Populate GRN dropdown (now deduplicated by grnNo)
      var gSel = document.getElementById('grnNo');
      GRNS.forEach(function(g) {
        GRN_MAP[g.grnNo] = g;
        var o = document.createElement('option');
        o.value = g.grnNo;
        o.textContent = g.grnNo + ' | ' + g.material.substring(0, 30) +
          (g.iqcStatus !== 'PENDING' ? ' [' + g.iqcStatus + ']' : '');
        gSel.appendChild(o);
      });
    })
    .withFailureHandler(function(e) { showToast(e.message, 'error'); })
    .getIQCFormInit();
}

// Called when GRN dropdown changes
function onGRNChange() {
  var grnNo = document.getElementById('grnNo').value;
  var g = GRN_MAP[grnNo];

  // Auto-fill supplier using renamed key
  document.getElementById('supplierName').value = g ? (g.supplierName || '') : '';

  // Reset matrix state
  currentItems = [];
  itemParamVals = [];
  clearMatrix();

  if (!grnNo) return;

  // Fetch all items for this GRN and build the matrix
  google.script.run
    .withSuccessHandler(function(items) {
      if (!items || items.length === 0) {
        showToast('No items found for this GRN.', 'error');
        return;
      }
      currentItems = items;
      items.forEach(function() { itemParamVals.push({}); });
      buildMatrix(items);
    })
    .withFailureHandler(function(e) { showToast(e.message, 'error'); })
    .getGRNItems(grnNo);
}

function clearMatrix() {
  document.getElementById('matrixTable').style.display = 'none';
  document.getElementById('matrixPlaceholder').style.display = 'block';
  document.getElementById('matrixPlaceholder').textContent = 'Select a GRN to load inspection items.';
  document.getElementById('matrixHead').innerHTML = '';
  document.getElementById('matrixBody').innerHTML = '';
}

// Builds the parameter matrix table given an array of GRN items
function buildMatrix(items) {
  var head = document.getElementById('matrixHead');
  var body = document.getElementById('matrixBody');
  head.innerHTML = '';
  body.innerHTML = '';

  // --- Header row ---
  var hRow = document.createElement('tr');

  // Sticky label column header
  var thLabel = document.createElement('th');
  thLabel.className = 'matrix-th-label';
  thLabel.textContent = '# Parameter';
  hRow.appendChild(thLabel);

  // One column header per item
  items.forEach(function(item, ci) {
    var th = document.createElement('th');
    th.className = 'matrix-th-item';
    var name  = item.materialDesc ? item.materialDesc.substring(0, 20) : 'Item ' + (ci + 1);
    var batch = item.batchNo ? item.batchNo : '—';
    var rcvd  = (item.qtyReceived && item.qtyReceived > 0)
      ? 'Rcvd: ' + item.qtyReceived + (item.unit ? ' ' + item.unit : '')
      : '';
    th.innerHTML = '<div>' + name + '</div>' +
                   '<div style="font-weight:400;color:var(--muted)">Batch: ' + batch + '</div>' +
                   (rcvd ? '<div style="font-weight:400;color:var(--muted)">' + rcvd + '</div>' : '');
    hRow.appendChild(th);
  });
  head.appendChild(hRow);

  // --- Parameter rows ---
  PARAMS.forEach(function(p, pi) {
    var tr = document.createElement('tr');

    // Sticky label cell
    var tdLabel = document.createElement('td');
    tdLabel.className = 'matrix-td-label';
    tdLabel.innerHTML = '<span class="param-num-sm">' + (pi + 1) + '</span>' +
      p.label + (p.ccp ? '<span class="ccp-star" title="Critical Control Point">★</span>' : '');
    tr.appendChild(tdLabel);

    // One P/F cell per item
    items.forEach(function(item, ci) {
      itemParamVals[ci][p.id] = '';
      var td = document.createElement('td');
      td.className = 'matrix-td';

      var passBtn = document.createElement('button');
      passBtn.id  = 'pf_pass_' + ci + '_' + p.id;
      passBtn.textContent = 'P';
      passBtn.onclick = (function(colI, paramId) {
        return function() { setParam(colI, paramId, 'PASS', this); };
      })(ci, p.id);

      var failBtn = document.createElement('button');
      failBtn.id  = 'pf_fail_' + ci + '_' + p.id;
      failBtn.textContent = 'F';
      failBtn.onclick = (function(colI, paramId) {
        return function() { setParam(colI, paramId, 'FAIL', this); };
      })(ci, p.id);

      td.appendChild(passBtn);
      td.appendChild(document.createTextNode(' '));
      td.appendChild(failBtn);

      // N/A only for MSDS
      if (p.id === 'msds') {
        var naBtn = document.createElement('button');
        naBtn.id  = 'pf_na_' + ci + '_' + p.id;
        naBtn.textContent = 'N/A';
        naBtn.onclick = (function(colI, paramId) {
          return function() { setParam(colI, paramId, 'NA', this); };
        })(ci, p.id);
        td.appendChild(document.createTextNode(' '));
        td.appendChild(naBtn);
      }

      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  // --- Quantity rows ---
  var qtyRows = [
    { key: 'sampleSize',  label: 'Sample Size',  editable: true  },
    { key: 'acceptedQty', label: 'Accepted Qty', editable: true  },
    { key: 'rejectedQty', label: 'Rejected Qty', editable: true  },
    { key: 'shortage',    label: 'Shortage',      editable: false }
  ];

  qtyRows.forEach(function(qr) {
    var tr = document.createElement('tr');

    var tdLabel = document.createElement('td');
    tdLabel.className = 'matrix-td-label matrix-qty-label';
    tdLabel.textContent = qr.label;
    tr.appendChild(tdLabel);

    items.forEach(function(item, ci) {
      var td = document.createElement('td');
      td.className = 'matrix-td';

      if (qr.editable) {
        var inp = document.createElement('input');
        inp.type = 'number';
        inp.id   = qr.key + '_' + ci;
        inp.min  = '0';
        inp.placeholder = '0';
        inp.oninput = (function(colI) {
          return function() { calcShortage(colI); };
        })(ci);
        td.appendChild(inp);
      } else {
        // Shortage — readonly display
        var span = document.createElement('span');
        span.id = 'shortage_' + ci;
        span.className = 'matrix-shortage';
        span.textContent = '—';
        td.appendChild(span);
      }

      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  // Show table, hide placeholder
  document.getElementById('matrixPlaceholder').style.display = 'none';
  document.getElementById('matrixTable').style.display = 'table';
}

// Sets a P/F/NA value for a specific column+parameter and triggers CCP check
function setParam(colIndex, paramId, val, btn) {
  itemParamVals[colIndex][paramId] = val;

  // Reset button styles for this cell
  ['pass', 'fail', 'na'].forEach(function(t) {
    var el = document.getElementById('pf_' + t + '_' + colIndex + '_' + paramId);
    if (el) el.className = '';
  });
  btn.className = val === 'PASS' ? 'pass' : val === 'FAIL' ? 'fail' : 'na';

  autoSuggestDisp();
}

// Suggests REJECTED if any CCP fails in any column
function autoSuggestDisp() {
  var ccpIds = ['qty', 'colour', 'dims', 'weight', 'clean', 'shelf', 'coa'];
  var anyFail = itemParamVals.some(function(colVals) {
    return ccpIds.some(function(id) { return colVals[id] === 'FAIL'; });
  });
  if (anyFail && !disposition) setDisp('REJECTED');
}

// Recalculates shortage for one column: shortage = sampleSize - accepted - rejected
function calcShortage(colIndex) {
  var ss  = parseFloat((document.getElementById('sampleSize_'  + colIndex) || {}).value) || 0;
  var acc = parseFloat((document.getElementById('acceptedQty_' + colIndex) || {}).value) || 0;
  var rej = parseFloat((document.getElementById('rejectedQty_' + colIndex) || {}).value) || 0;
  var el  = document.getElementById('shortage_' + colIndex);
  if (!el) return;
  if (ss === 0 && acc === 0 && rej === 0) {
    el.textContent = '—';
  } else {
    el.textContent = ss - acc - rej;
  }
}

function setDisp(val) {
  disposition = val;
  ['d_acc', 'd_hld', 'd_rej', 'd_awd'].forEach(function(id) {
    document.getElementById(id).className = 'disp-btn';
  });
  if      (val === 'ACCEPTED')               document.getElementById('d_acc').className = 'disp-btn active-acc';
  else if (val === 'HOLD')                   document.getElementById('d_hld').className = 'disp-btn active-hld';
  else if (val === 'REJECTED')               document.getElementById('d_rej').className = 'disp-btn active-rej';
  else if (val === 'ACCEPTED WITH DEVIATION') document.getElementById('d_awd').className = 'disp-btn active-awd';
}

function submitIQC() {
  if (!document.getElementById('grnNo').value)     { showToast('Please select a GRN.', 'error'); return; }
  if (!disposition)                                 { showToast('Please select a Disposition.', 'error'); return; }
  if (!document.getElementById('inspector').value) { showToast('Please select an Inspector.', 'error'); return; }
  if (currentItems.length === 0)                   { showToast('No items loaded. Select a GRN first.', 'error'); return; }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  // Build items array from matrix state
  var items = currentItems.map(function(item, ci) {
    return {
      materialDesc: item.materialDesc || '',
      batchNo:      item.batchNo      || '',
      sampleSize:   parseFloat((document.getElementById('sampleSize_'  + ci) || {}).value) || 0,
      acceptedQty:  parseFloat((document.getElementById('acceptedQty_' + ci) || {}).value) || 0,
      rejectedQty:  parseFloat((document.getElementById('rejectedQty_' + ci) || {}).value) || 0,
      params:       itemParamVals[ci] || {}
    };
  });

  var data = {
    date:         document.getElementById('date').value,
    inspector:    document.getElementById('inspector').value,
    aqlLevel:     document.getElementById('aqlLevel').value,
    sampleId:     document.getElementById('sampleId').value,
    disposition:  disposition,
    ncrRef:       document.getElementById('ncrRef').value,
    deviationRef: document.getElementById('deviationRef').value,
    remarks:      document.getElementById('remarks').value,
    grnNo:        document.getElementById('grnNo').value,
    supplierName: document.getElementById('supplierName').value,
    items:        items
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        savedRecord = {
          type:        'IQC',
          docNo:       res.docNos[0],
          date:        data.date,
          grnNo:       data.grnNo,
          supplier:    data.supplierName,
          material:    currentItems[0] ? currentItems[0].materialDesc : '',
          batch:       currentItems[0] ? currentItems[0].batchNo : '',
          inspector:   data.inspector,
          disposition: data.disposition,
          ncrRef:      document.getElementById('ncrRef').value
        };
        showToast('✅ Saved: ' + res.docNos.join(', '), 'success');
        document.getElementById('btnWA').style.display = 'block';
        btn.innerHTML = '✅ Saved';
        setTimeout(function() { goHome(); }, 2500);
      } else {
        showToast('Error: ' + res.error, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Save IQC Record';
      }
    })
    .withFailureHandler(function(e) {
      showToast(e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Save IQC Record';
    })
    .saveIQC(data);
}

function sendWA() {
  if (!savedRecord) return;
  google.script.run
    .withSuccessHandler(function(url) { window.open(url, '_blank'); })
    .getWhatsAppURLForRecord(savedRecord);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

window.onload = init;
</script>
</body>
</html>
