<script>
/* ── Constants ── */
var IQC_PARAMS = [
  {id:'qty',    label:'Quantity',             spec:'As per PO'},
  {id:'pkg',    label:'Packaging Condition',  spec:'Intact / Undamaged'},
  {id:'colour', label:'Colour',               spec:'Per approved sample'},
  {id:'shape',  label:'Shape / Form',         spec:'Per specification'},
  {id:'dims',   label:'Size / Dimensions',    spec:'Per spec sheet'},
  {id:'weight', label:'Net Weight',           spec:'Per spec (calibrated balance)'},
  {id:'clean',  label:'Cleanliness',          spec:'No contamination'},
  {id:'odour',  label:'Odour',                spec:'Normal / None'},
  {id:'label',  label:'Label Accuracy',       spec:'Matches PO / Spec'},
  {id:'msds',   label:'MSDS / SDS Available', spec:'Received'},
  {id:'shelf',  label:'Shelf Life / Expiry',  spec:'Min 75% remaining'},
  {id:'coa',    label:'COA / Test Report',    spec:'Received & Verified'}
];

/* ── State ── */
var formSaved    = false;
var prefill      = null;
var initData     = null;
var GRN_MAP      = {};
var currentItems = [];
var currentIdx   = 0;
var itemData     = [];
var overallDisp  = '';

/* ── Init ── */
document.addEventListener('DOMContentLoaded', function() {
  var pfRaw = sessionStorage.getItem('grnPrefill');
  if (pfRaw) {
    sessionStorage.removeItem('grnPrefill');
    try { prefill = JSON.parse(pfRaw); } catch(e) { prefill = null; }
  }

  var today = new Date();
  document.getElementById('dateField').value =
    today.getFullYear() + '-' +
    ('0'+(today.getMonth()+1)).slice(-2) + '-' +
    ('0'+today.getDate()).slice(-2);

  document.getElementById('s1BackBtn').addEventListener('click', onScreen1Back);
  document.getElementById('s2BackBtn').addEventListener('click', onScreen2Back);
  document.getElementById('grnNo').addEventListener('change', onGRNChange);
  document.getElementById('sampleSize').addEventListener('input', saveQtyState);
  document.getElementById('acceptedQty').addEventListener('input', saveQtyState);
  document.getElementById('rejectedQty').addEventListener('input', saveQtyState);

  google.script.run
    .withSuccessHandler(onInitLoaded)
    .withFailureHandler(function(e) { showToast(e.message || 'Load error', 'error'); })
    .getIQCFormInit();
});

/* ── Init loaded ── */
function onInitLoaded(d) {
  initData = d;
  if (d.docNumber) {
    document.getElementById('docBadge').textContent = d.docNumber;
    var dn = document.getElementById('iqcDocNo');
    dn.textContent = 'IQC No. ' + d.docNumber;
    dn.classList.remove('hidden');
  }

  var iSel = document.getElementById('inspector');
  (d.inspectors || []).forEach(function(ins) {
    var o = document.createElement('option');
    o.value = ins.name || ins;
    o.textContent = ins.name ? (ins.name + (ins.role ? ' — ' + ins.role : '')) : ins;
    iSel.appendChild(o);
  });
  var opName = window.QMS ? window.QMS.getOperatorName() : '';
  if (opName) iSel.value = opName;

  var aqlSel = document.getElementById('aqlLevel');
  if ((d.aqlLevels || []).length) {
    aqlSel.innerHTML = '';
    d.aqlLevels.forEach(function(a) {
      var ao = document.createElement('option');
      ao.value = a; ao.textContent = a;
      if (a === d.defaultAql) ao.selected = true;
      aqlSel.appendChild(ao);
    });
  }

  var gSel = document.getElementById('grnNo');
  (d.recentGRNs || []).forEach(function(g) {
    GRN_MAP[g.grnNo] = g;
    var go = document.createElement('option');
    go.value = g.grnNo;
    go.textContent = g.grnNo + ' — ' + (g.supplierName || '').substring(0,24) + (g.date ? ' (' + g.date + ')' : '');
    gSel.appendChild(go);
  });

  if (d.today) document.getElementById('dateField').value = d.today;

  if (prefill && prefill.grnId) renderPrefill();
}

/* ── Prefill mode ── */
function renderPrefill() {
  document.getElementById('prefillStrip').style.display = '';
  document.getElementById('manualSection').style.display = 'none';
  document.getElementById('pfItemName').textContent = prefill.itemName || prefill.itemCode || 'Item';
  document.getElementById('pfMeta').textContent =
    (prefill.supplierName || '') +
    (prefill.batchNo ? ' · Batch: ' + prefill.batchNo : '') +
    (prefill.grnId   ? ' · GRN #' + prefill.grnId    : '');

  // Fetch full GRN items list — handles multi-item GRNs from the prefill path
  if (prefill.grnId) {
    google.script.run
      .withSuccessHandler(function(items){
        if (!items || !items.length) {
          // Fallback: single-item synthesis from prefill payload
          currentItems = [{
            materialCode: prefill.itemCode || '',
            materialDesc: prefill.itemName || prefill.itemCode || 'Item',
            batchNo:      prefill.batchNo  || '',
            qtyReceived:  '', unit: ''
          }];
        } else {
          currentItems = items;
        }
        itemData   = currentItems.map(function(){ return makeBlankItemData(); });
        currentIdx = 0;
        document.getElementById('pfMeta').textContent =
          (prefill.supplierName || '') +
          ' · GRN #' + (prefill.grnId || '') +
          ' · ' + currentItems.length + ' item' + (currentItems.length > 1 ? 's' : '');
        renderMaterialChips();
        renderCurrentItem();
      })
      .withFailureHandler(function(){
        currentItems = [{
          materialCode: prefill.itemCode || '',
          materialDesc: prefill.itemName || prefill.itemCode || 'Item',
          batchNo:      prefill.batchNo  || '', qtyReceived: '', unit: ''
        }];
        itemData = [makeBlankItemData()];
        currentIdx = 0;
        renderCurrentItem();
      })
      .getGRNItems(prefill.grnId);
    return;
  }

  currentItems = [{
    materialCode: prefill.itemCode || '',
    materialDesc: prefill.itemName || prefill.itemCode || 'Item',
    batchNo:      prefill.batchNo  || '',
    qtyReceived:  '', unit: ''
  }];
  itemData    = [makeBlankItemData()];
  currentIdx  = 0;
  renderCurrentItem();
}

function renderMaterialChips() {
  var chips = document.getElementById('materialChips');
  if (!chips) return;
  chips.innerHTML = '';
  currentItems.forEach(function(it, idx) {
    var c = document.createElement('span');
    c.className = 'inline-flex items-center px-3 py-1.5 rounded-md bg-slate-100 text-text-field text-[13px] font-medium cursor-pointer';
    c.style.cssText = 'gap:6px;border:1px solid #cbd5e1;';
    c.title = 'Click to inspect this item';
    c.onclick = function(){ currentIdx = idx; renderCurrentItem(); };
    var qty = (it.qtyReceived || 0) + ' ' + (it.unit || '');
    c.innerHTML =
      '<span class="material-symbols-outlined" style="font-size:16px;color:#64748b;">category</span>' +
      '<span><b>' + (it.materialCode || '') + '</b> ' + (it.materialDesc || '') +
      ' &nbsp;<span style="color:#64748b;">· ' + (it.batchNo || '—') + ' · ' + qty + '</span></span>';
    chips.appendChild(c);
  });
}

/* ── GRN change ── */
function onGRNChange() {
  var grnNo = document.getElementById('grnNo').value;
  var g = GRN_MAP[grnNo];
  document.getElementById('supplierField').value = g ? (g.supplierName || '') : '';
  document.getElementById('materialChips').innerHTML = '';
  currentItems = []; currentIdx = 0; itemData = [];
  document.getElementById('paramSectionWrap').innerHTML = '';
  document.getElementById('dispCard').style.display = 'none';
  document.getElementById('itemProgressWrap').style.display = 'none';
  document.getElementById('stickyBtn').disabled = true;
  document.getElementById('stickyLabel').textContent = '—';
  if (!grnNo) return;

  google.script.run
    .withSuccessHandler(function(items) {
      if (!items || !items.length) { showToast('No items found for this GRN.', 'error'); return; }
      currentItems = items;
      itemData = items.map(function() { return makeBlankItemData(); });
      currentIdx = 0;
      renderMaterialChips();
      renderCurrentItem();
    })
    .withFailureHandler(function(e) { showToast(e.message || 'Error loading GRN items', 'error'); })
    .getGRNItems(grnNo);
}

/* ── Item rendering ── */
function makeBlankItemData() {
  return {params:{}, sampleSize:0, acceptedQty:0, rejectedQty:0, disp:''};
}

function renderCurrentItem() {
  var item  = currentItems[currentIdx];
  var total = currentItems.length;

  // Progress bar
  var wrap = document.getElementById('itemProgressWrap');
  wrap.style.display = '';
  document.getElementById('itemProgressLabel').textContent =
    'Item ' + (currentIdx+1) + ' of ' + total +
    (item.materialDesc ? ' · ' + item.materialDesc : '') +
    (item.batchNo ? ' (Batch: ' + item.batchNo + ')' : '') +
    (item.qtyReceived ? ' · GRN qty ' + item.qtyReceived + ' ' + (item.unit || '') : '');
  document.getElementById('itemProgFill').style.width =
    Math.round((currentIdx+1)/total*100) + '%';

  // Restore qty fields
  var d = itemData[currentIdx];
  document.getElementById('sampleSize').value  = d.sampleSize  || '';
  document.getElementById('acceptedQty').value = d.acceptedQty || '';
  document.getElementById('rejectedQty').value = d.rejectedQty || '';

  buildParamSection();
  updateDispCard();
  updateStickyBar();
}

function buildParamSection() {
  var wrap = document.getElementById('paramSectionWrap');
  wrap.innerHTML = '';
  var d = itemData[currentIdx];

  var card = document.createElement('section');
  card.className = 'bg-card rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-border border-l-4 border-l-accent flex flex-col gap-3 p-4';

  // Material info chips
  var item = currentItems[currentIdx];
  var infoRow = document.createElement('div');
  infoRow.className = 'flex flex-wrap gap-2';
  [item.materialCode, item.materialDesc, item.batchNo ? 'Batch: '+item.batchNo : null, item.qtyReceived ? item.qtyReceived+' '+(item.unit||'') : null]
    .filter(Boolean).forEach(function(t) {
      var s = document.createElement('span');
      s.className = 'bg-slate-100 text-text-field px-2.5 py-1 rounded text-[13px] font-medium';
      s.textContent = t;
      infoRow.appendChild(s);
    });
  card.appendChild(infoRow);

  // Parameters heading
  var h = document.createElement('h3');
  h.id = 'paramSectionTitle';
  h.className = 'font-headline text-[16px] font-semibold text-text-heading';
  h.textContent = 'Inspection Parameters';
  card.appendChild(h);

  // Bulk-set bar: Set ALL PASS / FAIL / NA
  var bulkRow = document.createElement('div');
  bulkRow.setAttribute('style', 'display:flex;align-items:center;justify-content:space-between;background:#f0f6ff;border:1px dashed #94a3b8;border-radius:8px;padding:8px 12px;margin-bottom:4px;');
  bulkRow.innerHTML =
    '<span style="font-size:12px;font-weight:600;color:#0B2A4A;">Set All:</span>' +
    '<div style="display:flex;gap:6px;">' +
      '<button type="button" onclick="setAllParams(\'PASS\')" style="font-size:13px;font-weight:700;color:#16a34a;background:#fff;border:1.5px solid #16a34a;border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer;">PASS</button>' +
      '<button type="button" onclick="setAllParams(\'FAIL\')" style="font-size:13px;font-weight:700;color:#dc2626;background:#fff;border:1.5px solid #dc2626;border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer;">FAIL</button>' +
      '<button type="button" onclick="setAllParams(\'NA\')"   style="font-size:13px;font-weight:700;color:#64748b;background:#fff;border:1.5px solid #64748b;border-radius:6px;padding:10px 16px;min-height:44px;cursor:pointer;">NA</button>' +
    '</div>';
  card.appendChild(bulkRow);

  // Parameter rows
  var grid = document.createElement('div');
  grid.className = 'grid grid-cols-1 gap-3';

  IQC_PARAMS.forEach(function(p, i) {
    var val = d.params[p.id] || '';
    var row = document.createElement('div');
    row.id = 'paramRow_' + p.id;
    row.className = 'flex items-center justify-between h-[48px] bg-white border border-slate-200 rounded-lg px-3' +
      (val === 'PASS' ? ' param-row-pass' : val === 'FAIL' ? ' param-row-fail' : val === 'NA' ? ' param-row-na' : '');

    var lbl = document.createElement('span');
    lbl.className = 'text-[14px] font-medium text-text-field truncate pr-2' + (val === 'FAIL' ? ' text-status-fail' : '');
    lbl.textContent = (i+1) + '. ' + p.label;

    var btns = document.createElement('div');
    btns.className = 'flex gap-1 shrink-0';

    ['PASS','FAIL','NA'].forEach(function(v) {
      var b = document.createElement('button');
      b.textContent = v;
      b.className = 'min-w-[44px] min-h-[44px] px-3 py-2 rounded-md text-[13px] font-semibold border transition-all active:scale-95 ' +
        (val === v
          ? (v==='PASS' ? 'btn-pass-active' : v==='FAIL' ? 'btn-fail-active' : 'btn-na-active')
          : 'bg-slate-100 text-text-helper border-slate-200');
      b.onclick = makeParamHandler(p.id, v);
      btns.appendChild(b);
    });

    row.appendChild(lbl);
    row.appendChild(btns);
    grid.appendChild(row);
  });

  card.appendChild(grid);
  wrap.appendChild(card);
  document.getElementById('dispCard').style.display = '';
  updateParamSectionTitle();
}

function makeParamHandler(paramId, val) {
  return function() { setParam(paramId, val); };
}

function setParam(paramId, val) {
  itemData[currentIdx].params[paramId] = val;
  var row = document.getElementById('paramRow_' + paramId);
  if (row) {
    row.className = 'flex items-center justify-between h-[48px] bg-white border border-slate-200 rounded-lg px-3' +
      (val==='PASS' ? ' param-row-pass' : val==='FAIL' ? ' param-row-fail' : val==='NA' ? ' param-row-na' : '');
    var lbl = row.querySelector('span');
    if (lbl) lbl.className = 'text-[14px] font-medium truncate pr-2' + (val==='FAIL' ? ' text-status-fail' : ' text-text-field');
    row.querySelectorAll('button').forEach(function(b) {
      var bv = b.textContent.trim();
      b.className = 'min-w-[44px] min-h-[44px] px-3 py-2 rounded-md text-[13px] font-semibold border transition-all active:scale-95 ' +
        (bv === val
          ? (val==='PASS' ? 'btn-pass-active' : val==='FAIL' ? 'btn-fail-active' : 'btn-na-active')
          : 'bg-slate-100 text-text-helper border-slate-200');
    });
  }
  updateParamSectionTitle();
  updateDispCard();
  updateStickyBar();
}

function setAllParams(val) {
  IQC_PARAMS.forEach(function(p){ setParam(p.id, val); });
}

function allParamsFilled() {
  var d = itemData[currentIdx];
  return IQC_PARAMS.every(function(p) { return !!d.params[p.id]; });
}

function updateParamSectionTitle() {
  var t = document.getElementById('paramSectionTitle');
  if (!t) return;
  var filled = IQC_PARAMS.filter(function(p) { return !!itemData[currentIdx].params[p.id]; }).length;
  t.textContent = 'Inspection Parameters (' + filled + '/' + IQC_PARAMS.length + ')';
  t.style.color = allParamsFilled() ? '#16a34a' : '';
}

/* ── Disposition card ── */
function updateDispCard() {
  var locked   = document.getElementById('dispLocked');
  var grid     = document.getElementById('dispGrid');
  if (!allParamsFilled()) { locked.style.display=''; grid.style.display='none'; return; }
  locked.style.display = 'none'; grid.style.display = '';
  var d = itemData[currentIdx];
  if (!d.disp) {
    var anyFail = IQC_PARAMS.some(function(p) { return d.params[p.id]==='FAIL'; });
    var anyPass = IQC_PARAMS.some(function(p) { return d.params[p.id]==='PASS'; });
    d.disp = anyFail ? 'REJECTED' : (anyPass ? 'ACCEPTED' : 'HOLD');
  }
  renderItemDispButtons(d.disp);
}

function setItemDisp(val) {
  itemData[currentIdx].disp = val;
  renderItemDispButtons(val);
  updateStickyBar();
}

function renderItemDispButtons(val) {
  var map = {dAcc:'ACCEPTED', dRej:'REJECTED', dHld:'HOLD', dAwd:'AWD'};
  var cls = {ACCEPTED:'disp-acc-active', REJECTED:'disp-rej-active', HOLD:'disp-hld-active', AWD:'disp-awd-active'};
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var base = el.className.replace(/disp-\w+-active/g,'').trim();
    el.className = base + (map[id]===val ? ' ' + (cls[val]||'') : '');
  });
}

function saveQtyState() {
  var d = itemData[currentIdx];
  if (!d) return;
  d.sampleSize  = parseFloat(document.getElementById('sampleSize').value)  || 0;
  d.acceptedQty = parseFloat(document.getElementById('acceptedQty').value) || 0;
  d.rejectedQty = parseFloat(document.getElementById('rejectedQty').value) || 0;
}

/* ── Sticky bar ── */
function updateStickyBar() {
  var total  = currentItems.length;
  var label  = document.getElementById('stickyLabel');
  var btn    = document.getElementById('stickyBtn');
  label.textContent = 'Item ' + (currentIdx+1) + ' of ' + total;
  var isLast = currentIdx >= total - 1;
  btn.innerHTML = isLast
    ? 'Review Summary <span class="material-symbols-outlined text-[18px]">arrow_forward</span>'
    : 'Next Item <span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
  var d = itemData[currentIdx];
  btn.disabled = !(allParamsFilled() && d.disp);
}

function onStickyTap() {
  saveQtyState();
  var d = itemData[currentIdx];
  if (!d.disp) {
    var card = document.getElementById('dispCard');
    if (card) { card.classList.remove('pulse-amber'); void card.offsetHeight; card.classList.add('pulse-amber'); setTimeout(function(){card.classList.remove('pulse-amber');},500); }
    return;
  }
  if (currentIdx >= currentItems.length - 1) { showSummary(); }
  else { currentIdx++; renderCurrentItem(); window.scrollTo(0,0); }
}

/* ── Back navigation ── */
function onScreen1Back() {
  if (!formSaved && currentItems.length > 0) {
    if (!confirm('Leave IQC? Unsaved data will be lost.')) return;
  }
  goHome();
}
function onScreen2Back() {
  currentIdx = currentItems.length - 1;
  document.getElementById('screen2').style.display = 'none';
  document.getElementById('screen1').style.display = '';
  renderCurrentItem();
  window.scrollTo(0,0);
}

/* ── Summary ── */
function showSummary() {
  var firstItem = currentItems[0] || {};
  var sup = prefill ? (prefill.supplierName||'') : document.getElementById('supplierField').value;
  var batchNo  = prefill ? (prefill.batchNo||'') : (firstItem.batchNo||'');
  var itemName = prefill ? (prefill.itemName||firstItem.materialDesc||'') : (firstItem.materialDesc||'');
  document.getElementById('sumBatchName').textContent = itemName + (sup ? ' — '+sup : '');
  document.getElementById('sumBatchMeta').textContent =
    'Batch '+(batchNo||'—')+' · '+currentItems.length+' item'+(currentItems.length!==1?'s':'')+' · '+(document.getElementById('dateField').value||'');

  var listEl = document.getElementById('sumItemsList');
  listEl.innerHTML = '';
  currentItems.forEach(function(_, i) { listEl.appendChild(makeSummaryItemRow(i)); });

  var hasReject = itemData.some(function(d){ return d.disp==='REJECTED'; });
  var hasHold   = itemData.some(function(d){ return d.disp==='HOLD'; });
  var hasAwd    = itemData.some(function(d){ return d.disp==='AWD'; });
  setOverallDisp(hasReject?'REJECTED':hasHold?'HOLD':hasAwd?'AWD':'ACCEPTED');

  document.getElementById('screen1').style.display = 'none';
  document.getElementById('screen2').style.display = '';
  window.scrollTo(0,0);
}

function makeSummaryItemRow(idx) {
  var d = itemData[idx];
  var passCount = IQC_PARAMS.filter(function(p){ return d.params[p.id]==='PASS'; }).length;
  var passPct   = Math.round(passCount/IQC_PARAMS.length*100);

  var row = document.createElement('div');
  row.className = 'flex items-center gap-3 px-4 py-3 border-b border-border last:border-b-0 cursor-pointer hover:bg-slate-50 active:bg-slate-100';
  row.onclick = (function(i){ return function(){ goToItem(i); }; })(idx);

  var lbl = document.createElement('div');
  lbl.className = 'text-[13px] font-semibold text-text-field w-14 shrink-0';
  lbl.textContent = 'Item '+(idx+1);

  var barWrap = document.createElement('div');
  barWrap.className = 'flex-1 bg-slate-200 rounded-full h-1.5 overflow-hidden';
  var barFill = document.createElement('div');
  barFill.className = 'h-full bg-status-pass rounded-full';
  barFill.style.width = passPct+'%';
  barWrap.appendChild(barFill);

  var right = document.createElement('div');
  right.className = 'flex items-center gap-2 shrink-0';
  var badge = document.createElement('span');
  badge.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full ' + getDispBadgeClass(d.disp);
  badge.textContent = dispLabel(d.disp);
  var editIco = document.createElement('span');
  editIco.className = 'material-symbols-outlined text-[16px] text-text-helper';
  editIco.textContent = 'edit';
  right.appendChild(badge); right.appendChild(editIco);

  row.appendChild(lbl); row.appendChild(barWrap); row.appendChild(right);
  return row;
}

function goToItem(idx) {
  currentIdx = idx;
  document.getElementById('screen2').style.display = 'none';
  document.getElementById('screen1').style.display = '';
  renderCurrentItem(); window.scrollTo(0,0);
}

function getDispBadgeClass(disp) {
  return disp==='ACCEPTED'?'badge-acc':disp==='REJECTED'?'badge-rej':disp==='HOLD'?'badge-hld':disp==='AWD'?'badge-awd':'badge-none';
}
function dispLabel(disp) {
  return disp==='ACCEPTED'?'ACCEPT':disp==='REJECTED'?'REJECT':disp==='HOLD'?'HOLD':disp==='AWD'?'AWD':'—';
}

/* ── Overall disposition ── */
function setOverallDisp(val) {
  overallDisp = val;
  var map = {odAcc:'ACCEPTED', odRej:'REJECTED', odHld:'HOLD', odAwd:'AWD'};
  var cls = {ACCEPTED:'disp-acc-active', REJECTED:'disp-rej-active', HOLD:'disp-hld-active', AWD:'disp-awd-active'};
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var base = el.className.replace(/disp-\w+-active/g,'').trim();
    el.className = base + (map[id]===val ? ' '+(cls[val]||'') : '');
  });
  document.getElementById('saveBtn').disabled = false;
}

/* ── Save ── */
function saveIQC() {
  if (!overallDisp) { showToast('Please select overall disposition.', 'error'); return; }
  if (window.QMS && !window.QMS.getOperatorName()) {
    var inspList = (initData && initData.inspectors) ? initData.inspectors.map(function(i){ return i.name||i; }) : [];
    window.QMS.requireOperator(inspList, function(){ doSaveIQC(); });
    return;
  }
  doSaveIQC();
}

function doSaveIQC() {
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  var items = currentItems.map(function(ci, i) {
    var d = itemData[i] || {};
    var pmap = d.params || {};
    return {
      materialCode: ci.materialCode||'',
      materialDesc: ci.materialDesc||'',
      batchNo:      ci.batchNo||'',
      qtyReceived:  ci.qtyReceived||0,
      sampleSize:   d.sampleSize||0,
      acceptedQty:  d.acceptedQty||0,
      rejectedQty:  d.rejectedQty||0,
      params: {
        qty:    pmap.qty    ||'NA', pkg:    pmap.pkg    ||'NA',
        colour: pmap.colour ||'NA', shape:  pmap.shape  ||'NA',
        dims:   pmap.dims   ||'NA', weight: pmap.weight ||'NA',
        clean:  pmap.clean  ||'NA', odour:  pmap.odour  ||'NA',
        label:  pmap.label  ||'NA', msds:   pmap.msds   ||'NA',
        shelf:  pmap.shelf  ||'NA', coa:    pmap.coa    ||'NA'
      }
    };
  });

  var data = {
    date:         document.getElementById('dateField').value,
    grnNo:        prefill ? (prefill.grnId||'') : document.getElementById('grnNo').value,
    supplierName: prefill ? (prefill.supplierName||'') : document.getElementById('supplierField').value,
    inspector:    document.getElementById('inspector').value,
    aqlLevel:     document.getElementById('aqlLevel').value,
    sampleId:     document.getElementById('sampleId').value,
    disposition:  (overallDisp === 'AWD' ? 'ACCEPTED WITH DEVIATION' : overallDisp),
    remarks:      document.getElementById('remarks').value,
    ncrRef:       document.getElementById('ncrRef').value,
    deviationRef: document.getElementById('deviationRef').value,
    operatorName: window.QMS ? window.QMS.getOperatorName() : '',
    items:        items
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        formSaved = true;
        showToast('IQC record saved', 'success');
        var hasWarnings = (res.warnings && res.warnings.length) || res.ncrError;
        if (hasWarnings) {
          var msgs = (res.warnings && res.warnings.length) ? res.warnings : [res.ncrError];
          setTimeout(function(){ showToast('⚠ ' + msgs.join(' | '), 'warning'); }, 600);
          setTimeout(function(){ goHome(); }, 5000);
        } else {
          setTimeout(function(){ goHome(); }, 1500);
        }
      } else {
        showToast('Error: '+((res&&res.error)||'Unknown error'), 'error');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined">save</span>Save IQC Result';
      }
    })
    .withFailureHandler(function(e) {
      showToast(e.message||'Save failed', 'error');
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined">save</span>Save IQC Result';
    })
    .saveIQC(data);
}

/* ── Utilities ── */
function goHome() {
  google.script.run
    .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
    .withFailureHandler(function(){})
    .getFormHtml('Landing');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(function(){ t.className = 'toast'; }, 3500);
}
</script>
</body>
</html>
