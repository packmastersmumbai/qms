<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
var FG_LIST = [];
var INSPECTORS = [];
var SESSION_ID = null;
var SESSION_PRODUCT_CODE = '';
var SESSION_PRODUCT_NAME = '';
var SESSION_BATCH = '';
var SESSION_INSPECTOR = '';
var SESSION_LINE = '';
var SESSION_START_TS = null;
var SESSION_ROUND_NO = 1;

var WEIGHT_ROWS = [];  // [{paramCode, paramName}]
var QUALITY_PARAMS = [];  // [{paramCode, paramName, methodType, stdValue, unit, tolMin, tolMax}]
var OPEN_SESSIONS = [];

var timerInterval = null;

// ─────────────────────────────────────────────
// Navigation helpers
// ─────────────────────────────────────────────
function showScreen(name) {
  var screens = ['screenA', 'screenB', 'screenC'];
  for (var i = 0; i < screens.length; i++) {
    document.getElementById(screens[i]).style.display = 'none';
  }
  document.getElementById('screen' + name).style.display = 'block';

  var backBtn = document.getElementById('headerBackBtn');
  if (name === 'A') {
    backBtn.style.display = 'none';
    document.getElementById('headerTitle').innerHTML = '&#9881; IPQC';
    document.getElementById('headerSub').textContent = 'In-Process Quality Check';
    stopTimer();
  } else if (name === 'B') {
    backBtn.style.display = 'inline';
    document.getElementById('headerTitle').innerHTML = '&#9881; IPQC';
    document.getElementById('headerSub').textContent = 'New Check Setup';
  } else if (name === 'C') {
    backBtn.style.display = 'none';
    document.getElementById('headerTitle').innerHTML = '&#9881; IPQC';
    document.getElementById('headerSub').textContent = 'Check in Progress';
  }
}

function headerBack() {
  showScreen('A');
}

// ─────────────────────────────────────────────
// Init — fetch FG list and inspectors
// ─────────────────────────────────────────────
function init() {
  showLoading('Loading…');
  google.script.run
    .withSuccessHandler(function(d) {
      FG_LIST = d.fgList || [];
      INSPECTORS = d.inspectors || [];

      var pSel = document.getElementById('setupProduct');
      FG_LIST.forEach(function(fg) {
        var o = document.createElement('option');
        var label = fg.name || fg.description || fg.code;
        o.value = fg.code;
        o.textContent = label.length > 40 ? label.substring(0, 40) + '…' : label;
        o.setAttribute('data-desc', label);
        pSel.appendChild(o);
      });

      var iSel = document.getElementById('setupInspector');
      INSPECTORS.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.name;
        o.textContent = p.name + (p.role ? ' — ' + p.role : '');
        iSel.appendChild(o);
      });

      hideLoading();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Failed to load form data: ' + e.message, 'error');
    })
    .getIPQCFormInit();
}

// ─────────────────────────────────────────────
// Screen A — Home
// ─────────────────────────────────────────────
function goToSetup() {
  showScreen('B');
}

function toggleResumeSessions() {
  var panel = document.getElementById('sessionsPanel');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    loadOpenSessions();
  } else {
    panel.style.display = 'none';
  }
}

function loadOpenSessions() {
  var list = document.getElementById('sessionsList');
  var empty = document.getElementById('sessionsEmpty');

  // Clear old items (keep header and empty msg)
  var kids = list.querySelectorAll('.session-item');
  for (var i = 0; i < kids.length; i++) { kids[i].parentNode.removeChild(kids[i]); }
  empty.style.display = 'none';

  showLoading('Loading sessions…');
  google.script.run
    .withSuccessHandler(function(sessions) {
      hideLoading();
      OPEN_SESSIONS = sessions || [];
      if (OPEN_SESSIONS.length === 0) {
        empty.style.display = 'block';
        return;
      }
      OPEN_SESSIONS.forEach(function(s, idx) {
        var item = document.createElement('div');
        item.className = 'session-item';

        var badge = document.createElement('span');
        badge.className = 'si-badge';
        badge.textContent = s.rounds + ' round' + (s.rounds !== 1 ? 's' : '');

        var name = document.createElement('div');
        name.className = 'si-name';
        name.textContent = s.productName || s.productCode;

        var meta = document.createElement('div');
        meta.className = 'si-meta';
        meta.textContent = 'Batch: ' + (s.batch || '—') + ' · ' +
          (s.inspector || '—') + ' · Line: ' + (s.line || '—') + ' · ' +
          (s.date || '—');

        item.appendChild(badge);
        item.appendChild(name);
        item.appendChild(meta);

        item.onclick = (function(sess) {
          return function() { resumeSession(sess); };
        })(s);

        list.appendChild(item);
      });
    })
    .withFailureHandler(function(e) {
      hideLoading();
      empty.style.display = 'block';
      empty.textContent = 'Error loading sessions.';
    })
    .getOpenSessions();
}

function resumeSession(sess) {
  SESSION_ID = sess.sessionId;
  SESSION_PRODUCT_CODE = sess.productCode;
  SESSION_PRODUCT_NAME = sess.productName;
  SESSION_BATCH = sess.batch;
  SESSION_INSPECTOR = sess.inspector;
  SESSION_LINE = sess.line;
  SESSION_ROUND_NO = (sess.rounds || 0) + 1;
  if (sess.date && sess.startTime) {
    SESSION_START_TS = new Date(sess.date + 'T' + sess.startTime);
    if (isNaN(SESSION_START_TS)) SESSION_START_TS = new Date();
  } else {
    SESSION_START_TS = new Date();
  }

  showToast('Resuming session — Round ' + SESSION_ROUND_NO, 'success');
  enterCheckScreen();
}

// ─────────────────────────────────────────────
// Screen B — Setup
// ─────────────────────────────────────────────
function onProductChange() {
  // Nothing needed — product selected for session start
}

function onLineChange() {
  var val = document.getElementById('setupLine').value;
  document.getElementById('setupLineOtherField').style.display = (val === 'Other') ? 'block' : 'none';
}

function startCheck() {
  var pSel = document.getElementById('setupProduct');
  var productCode = pSel.value;
  var productOpt = pSel.options[pSel.selectedIndex];
  var productName = productOpt ? (productOpt.getAttribute('data-desc') || productCode) : productCode;
  var batch = document.getElementById('setupBatch').value.trim();
  var lineVal = document.getElementById('setupLine').value;
  var line = lineVal === 'Other' ? document.getElementById('setupLineOther').value.trim() : lineVal;
  var inspector = document.getElementById('setupInspector').value;

  if (!productCode) { showToast('Please select a product.', 'error'); return; }
  if (!batch)       { showToast('Please enter a batch number.', 'error'); return; }
  if (!inspector)   { showToast('Please select an inspector.', 'error'); return; }
  if (lineVal === 'Other' && !line) { showToast('Please specify the line.', 'error'); return; }

  showLoading('Starting session…');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.ok) {
        showToast('Error: ' + (res.error || 'Could not start session.'), 'error');
        return;
      }
      SESSION_ID = res.sessionId;
      SESSION_PRODUCT_CODE = productCode;
      SESSION_PRODUCT_NAME = productName;
      SESSION_BATCH = batch;
      SESSION_INSPECTOR = inspector;
      SESSION_LINE = line;
      SESSION_ROUND_NO = res.resumed ? (res.rounds || 0) + 1 : 1;
      if (res.resumed && res.date && res.startTime) {
        SESSION_START_TS = new Date(res.date + 'T' + res.startTime);
        if (isNaN(SESSION_START_TS)) SESSION_START_TS = new Date();
      } else {
        SESSION_START_TS = new Date();
      }

      showToast(res.resumed ? 'Resuming session — Round ' + SESSION_ROUND_NO : 'Session started', 'success');
      enterCheckScreen();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Error: ' + e.message, 'error');
    })
    .startSession({
      productCode: productCode,
      productName: productName,
      batch: batch,
      inspector: inspector,
      line: line
    });
}

// ─────────────────────────────────────────────
// Screen C — Check screen entry
// ─────────────────────────────────────────────
function enterCheckScreen() {
  // Build weight rows (static W01–W10)
  WEIGHT_ROWS = [];
  for (var w = 1; w <= 10; w++) {
    var code = 'W' + (w < 10 ? '0' + w : '' + w);
    WEIGHT_ROWS.push({ paramCode: code, paramName: 'Weight Check ' + w });
  }

  // Update header
  var title = SESSION_PRODUCT_NAME;
  if (title.length > 28) title = title.substring(0, 28) + '…';
  document.getElementById('checkHdrTitle').textContent = title + ' · ' + SESSION_BATCH;
  updateRoundBadge();

  showScreen('C');
  startTimer();

  // Build weight section immediately
  buildWeightSection();

  // Load quality params
  showLoading('Loading parameters…');
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.warning) {
        document.getElementById('noCpBanner').style.display = 'block';
      } else {
        document.getElementById('noCpBanner').style.display = 'none';
      }
      QUALITY_PARAMS = result.params || [];
      buildParamsSection();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Warning: Could not load parameters. ' + e.message, 'error');
      QUALITY_PARAMS = [];
      buildParamsSection();
    })
    .getIPQCParams(SESSION_PRODUCT_CODE);
}

function updateRoundBadge() {
  document.getElementById('roundBadge').textContent = 'Round ' + SESSION_ROUND_NO;
}

// ─────────────────────────────────────────────
// Timer
// ─────────────────────────────────────────────
function startTimer() {
  stopTimer();
  timerInterval = setInterval(function() {
    if (!SESSION_START_TS) return;
    var elapsed = Math.floor((new Date() - SESSION_START_TS) / 1000);
    var h = Math.floor(elapsed / 3600);
    var m = Math.floor((elapsed % 3600) / 60);
    var s = elapsed % 60;
    document.getElementById('timerDisplay').textContent =
      pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

// ─────────────────────────────────────────────
// Build weight section
// ─────────────────────────────────────────────
function buildWeightSection() {
  var container = document.getElementById('weightSection');
  container.innerHTML = '';

  WEIGHT_ROWS.forEach(function(row) {
    var div = document.createElement('div');
    div.className = 'ipqc-row';
    div.id = 'row_' + row.paramCode;

    var top = document.createElement('div');
    top.className = 'ipqc-row-top';

    var labelWrap = document.createElement('div');
    labelWrap.style.flex = '1';
    var labelEl = document.createElement('div');
    labelEl.className = 'ipqc-row-label';
    labelEl.textContent = row.paramName;
    var stdEl = document.createElement('div');
    stdEl.className = 'ipqc-row-std';
    stdEl.textContent = 'Std: —';
    labelWrap.appendChild(labelEl);
    labelWrap.appendChild(stdEl);

    var inp = document.createElement('input');
    inp.type = 'number';
    inp.id = 'val_' + row.paramCode;
    inp.className = 'ipqc-row-input';
    inp.placeholder = '0.00';
    inp.step = '0.01';
    inp.setAttribute('data-paramcode', row.paramCode);
    inp.oninput = (function(code) {
      return function() { updateWeightResult(code); };
    })(row.paramCode);

    var badge = document.createElement('span');
    badge.id = 'badge_' + row.paramCode;
    badge.className = 'res-badge res-na';
    badge.textContent = 'NA';

    top.appendChild(labelWrap);
    top.appendChild(inp);
    top.appendChild(badge);
    div.appendChild(top);
    container.appendChild(div);
  });
}

function updateWeightResult(code) {
  var inp = document.getElementById('val_' + code);
  var badge = document.getElementById('badge_' + code);
  var val = inp.value.trim();
  if (val !== '') {
    badge.className = 'res-badge res-pass';
    badge.textContent = 'PASS';
  } else {
    badge.className = 'res-badge res-na';
    badge.textContent = 'NA';
  }
}

// ─────────────────────────────────────────────
// Build quality params section
// ─────────────────────────────────────────────
function buildParamsSection() {
  var section = document.getElementById('paramsSection');
  var body = document.getElementById('paramsBody');
  body.innerHTML = '';

  if (QUALITY_PARAMS.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';

  QUALITY_PARAMS.forEach(function(p) {
    var isVisual = (p.methodType === 'Visual');
    var div = buildParamRow(p, isVisual);
    body.appendChild(div);
  });
}

function buildParamRow(p, isVisual) {
  var div = document.createElement('div');
  div.className = 'ipqc-row';
  div.id = 'row_' + p.paramCode;

  var top = document.createElement('div');
  top.className = 'ipqc-row-top';

  // Label + std
  var labelWrap = document.createElement('div');
  labelWrap.style.flex = '1';
  labelWrap.style.minWidth = '0';

  var labelEl = document.createElement('div');
  labelEl.className = 'ipqc-row-label';
  labelEl.textContent = p.paramName;

  var stdEl = document.createElement('div');
  stdEl.className = 'ipqc-row-std';
  if (p.stdValue !== null && p.stdValue !== undefined && p.stdValue !== '') {
    var stdText = 'Std: ' + p.stdValue;
    if (p.unit) stdText += ' ' + p.unit;
    if (p.tolMin !== null && p.tolMin !== undefined && p.tolMax !== null && p.tolMax !== undefined) {
      stdText += ' (' + p.tolMin + '–' + p.tolMax + ')';
    }
    stdEl.textContent = stdText;
  } else {
    stdEl.textContent = 'Std: —';
  }

  labelWrap.appendChild(labelEl);
  labelWrap.appendChild(stdEl);
  top.appendChild(labelWrap);

  if (isVisual) {
    // Visual: PASS / FAIL / DEFECT / NA tap buttons
    var btns = document.createElement('div');
    btns.className = 'visual-btns';

    var options = [
      { val: 'PASS',   cls: 'active-pass',   label: 'P' },
      { val: 'FAIL',   cls: 'active-fail',   label: 'F' },
      { val: 'DEFECT', cls: 'active-defect', label: 'DEF' },
      { val: 'NA',     cls: 'active-na',     label: 'NA' }
    ];
    options.forEach(function(opt) {
      var btn = document.createElement('button');
      btn.className = 'vis-btn';
      btn.textContent = opt.label;
      btn.id = 'vbtn_' + p.paramCode + '_' + opt.val;
      btn.onclick = (function(code, v, cls) {
        return function() { setVisualResult(code, v, cls); };
      })(p.paramCode, opt.val, opt.cls);
      btns.appendChild(btn);
    });

    var badge = document.createElement('span');
    badge.id = 'badge_' + p.paramCode;
    badge.className = 'res-badge res-na';
    badge.textContent = 'NA';

    top.appendChild(btns);
    top.appendChild(badge);

  } else {
    // Measurement: number input + auto result badge
    var inp = document.createElement('input');
    inp.type = 'number';
    inp.id = 'val_' + p.paramCode;
    inp.className = 'ipqc-row-input';
    inp.placeholder = '—';
    inp.step = '0.01';
    inp.oninput = (function(code, tolMin, tolMax) {
      return function() { updateMeasurementResult(code, tolMin, tolMax); };
    })(p.paramCode, p.tolMin, p.tolMax);

    var badge = document.createElement('span');
    badge.id = 'badge_' + p.paramCode;
    badge.className = 'res-badge res-na';
    badge.textContent = 'NA';

    top.appendChild(inp);
    top.appendChild(badge);
  }

  div.appendChild(top);

  // Upgrade buttons area (for measurement FAIL)
  if (!isVisual) {
    var upgArea = document.createElement('div');
    upgArea.id = 'upg_' + p.paramCode;
    upgArea.className = 'upgrade-btns';
    upgArea.style.display = 'none';

    var devBtn = document.createElement('button');
    devBtn.className = 'btn-deviation';
    devBtn.id = 'devbtn_' + p.paramCode;
    devBtn.textContent = '&#9888; Deviation';
    devBtn.onclick = (function(code) {
      return function() { upgradeResult(code, 'DEVIATION'); };
    })(p.paramCode);

    var rejBtn = document.createElement('button');
    rejBtn.className = 'btn-reject';
    rejBtn.id = 'rejbtn_' + p.paramCode;
    rejBtn.textContent = '&#10005; Reject';
    rejBtn.onclick = (function(code) {
      return function() { upgradeResult(code, 'REJECT'); };
    })(p.paramCode);

    upgArea.appendChild(devBtn);
    upgArea.appendChild(rejBtn);
    div.appendChild(upgArea);
  }

  // Remark area (for FAIL / DEVIATION / REJECT / DEFECT)
  var remarkWrap = document.createElement('div');
  remarkWrap.id = 'remarkwrap_' + p.paramCode;
  remarkWrap.style.display = 'none';
  remarkWrap.style.marginTop = '4px';

  var remarkTa = document.createElement('textarea');
  remarkTa.id = 'remark_' + p.paramCode;
  remarkTa.className = 'remark-area';
  remarkTa.placeholder = 'Describe the issue…';

  var remarkReq = document.createElement('div');
  remarkReq.id = 'remarkreq_' + p.paramCode;
  remarkReq.className = 'remark-required';
  remarkReq.textContent = 'Remark is required for this result.';

  remarkWrap.appendChild(remarkTa);
  remarkWrap.appendChild(remarkReq);
  div.appendChild(remarkWrap);

  return div;
}

// Visual result setter
function setVisualResult(code, val, activeCls) {
  var options = ['PASS', 'FAIL', 'DEFECT', 'NA'];
  options.forEach(function(v) {
    var btn = document.getElementById('vbtn_' + code + '_' + v);
    if (btn) btn.className = 'vis-btn';
  });
  var activeBtn = document.getElementById('vbtn_' + code + '_' + val);
  if (activeBtn) activeBtn.className = 'vis-btn ' + activeCls;

  var badge = document.getElementById('badge_' + code);
  if (badge) {
    var cls = 'res-' + val.toLowerCase();
    badge.className = 'res-badge ' + cls;
    badge.textContent = val;
  }

  // Show remark area if FAIL or DEFECT
  var remarkWrap = document.getElementById('remarkwrap_' + code);
  if (remarkWrap) {
    remarkWrap.style.display = (val === 'FAIL' || val === 'DEFECT') ? 'block' : 'none';
  }
  // Clear error state
  var remarkReq = document.getElementById('remarkreq_' + code);
  var remarkTa = document.getElementById('remark_' + code);
  if (remarkReq) remarkReq.className = 'remark-required';
  if (remarkTa) remarkTa.className = 'remark-area';
}

// Measurement result auto-calc
function updateMeasurementResult(code, tolMin, tolMax) {
  var inp = document.getElementById('val_' + code);
  var badge = document.getElementById('badge_' + code);
  var upgArea = document.getElementById('upg_' + code);
  var remarkWrap = document.getElementById('remarkwrap_' + code);
  var devBtn = document.getElementById('devbtn_' + code);
  var rejBtn = document.getElementById('rejbtn_' + code);

  var rawVal = inp.value.trim();
  if (rawVal === '') {
    badge.className = 'res-badge res-na';
    badge.textContent = 'NA';
    if (upgArea) upgArea.style.display = 'none';
    if (remarkWrap) remarkWrap.style.display = 'none';
    return;
  }

  var val = parseFloat(rawVal);
  var result = 'PASS';
  if (tolMin !== null && tolMin !== undefined && tolMin !== '' && val < parseFloat(tolMin)) result = 'FAIL';
  if (tolMax !== null && tolMax !== undefined && tolMax !== '' && val > parseFloat(tolMax)) result = 'FAIL';

  badge.className = 'res-badge res-' + result.toLowerCase();
  badge.textContent = result;

  if (upgArea) {
    upgArea.style.display = result === 'FAIL' ? 'flex' : 'none';
    if (result !== 'FAIL') {
      if (devBtn) devBtn.className = 'btn-deviation';
      if (rejBtn) rejBtn.className = 'btn-reject';
      if (remarkWrap) remarkWrap.style.display = 'none';
    }
  }

  // Clear error state on change
  var remarkTa = document.getElementById('remark_' + code);
  var remarkReq = document.getElementById('remarkreq_' + code);
  if (remarkTa) remarkTa.className = 'remark-area';
  if (remarkReq) remarkReq.className = 'remark-required';
}

// Upgrade FAIL → DEVIATION or REJECT
function upgradeResult(code, newResult) {
  var badge = document.getElementById('badge_' + code);
  var devBtn = document.getElementById('devbtn_' + code);
  var rejBtn = document.getElementById('rejbtn_' + code);
  var remarkWrap = document.getElementById('remarkwrap_' + code);

  badge.className = 'res-badge res-' + newResult.toLowerCase();
  badge.textContent = newResult;
  badge.setAttribute('data-upgraded', newResult);

  if (devBtn) devBtn.className = newResult === 'DEVIATION' ? 'btn-deviation active' : 'btn-deviation';
  if (rejBtn) rejBtn.className = newResult === 'REJECT'    ? 'btn-reject active'    : 'btn-reject';

  if (remarkWrap) remarkWrap.style.display = 'block';
}

// ─────────────────────────────────────────────
// Get current result for a param code
// ─────────────────────────────────────────────
function getParamResult(code) {
  var badge = document.getElementById('badge_' + code);
  if (!badge) return 'NA';
  var cls = badge.className;
  if (cls.indexOf('res-pass') !== -1)      return 'PASS';
  if (cls.indexOf('res-fail') !== -1)      return 'FAIL';
  if (cls.indexOf('res-deviation') !== -1) return 'DEVIATION';
  if (cls.indexOf('res-reject') !== -1)    return 'REJECT';
  if (cls.indexOf('res-defect') !== -1)    return 'DEFECT';
  return 'NA';
}

// ─────────────────────────────────────────────
// Save Round
// ─────────────────────────────────────────────
function saveRoundData() {
  // Validate: FAIL/DEVIATION/REJECT/DEFECT need remarks
  var valid = true;
  var allParams = [];

  // Collect weight rows
  WEIGHT_ROWS.forEach(function(row) {
    var inp = document.getElementById('val_' + row.paramCode);
    var val = inp ? inp.value.trim() : '';
    var result = val !== '' ? 'PASS' : 'NA';
    allParams.push({
      paramCode: row.paramCode,
      paramName: row.paramName,
      stdValue: '',
      unit: 'g',
      actualValue: val,
      result: result,
      remark: ''
    });
  });

  // Collect quality params
  QUALITY_PARAMS.forEach(function(p) {
    var isVisual = (p.methodType === 'Visual');
    var result = getParamResult(p.paramCode);
    var actualVal = '';
    if (!isVisual) {
      var inp = document.getElementById('val_' + p.paramCode);
      actualVal = inp ? inp.value.trim() : '';
    }

    var remarkEl = document.getElementById('remark_' + p.paramCode);
    var remark = remarkEl ? remarkEl.value.trim() : '';

    // Validate remark required
    var needsRemark = (result === 'FAIL' || result === 'DEVIATION' || result === 'REJECT' || result === 'DEFECT');
    if (needsRemark && !remark) {
      valid = false;
      var remarkTa = document.getElementById('remark_' + p.paramCode);
      var remarkReq = document.getElementById('remarkreq_' + p.paramCode);
      if (remarkTa) remarkTa.className = 'remark-area error';
      if (remarkReq) remarkReq.className = 'remark-required show';
      // Show remark wrap if hidden
      var remarkWrap = document.getElementById('remarkwrap_' + p.paramCode);
      if (remarkWrap) remarkWrap.style.display = 'block';
    }

    allParams.push({
      paramCode: p.paramCode,
      paramName: p.paramName,
      stdValue: p.stdValue !== null && p.stdValue !== undefined ? String(p.stdValue) : '',
      unit: p.unit || '',
      actualValue: actualVal,
      result: result,
      remark: remark
    });
  });

  if (!valid) {
    showToast('Please add remarks for all failed checks.', 'error');
    return;
  }

  var btn = document.getElementById('btnSaveRound');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.innerHTML = '&#128190; Save Round';
      if (!res.ok) {
        showToast('Error: ' + (res.error || 'Save failed.'), 'error');
        return;
      }
      var savedRound = SESSION_ROUND_NO;
      SESSION_ROUND_NO++;
      updateRoundBadge();
      // Reset actual values
      resetCheckValues();
      showToast('Round ' + savedRound + ' saved.', 'success');
    })
    .withFailureHandler(function(e) {
      btn.disabled = false;
      btn.innerHTML = '&#128190; Save Round';
      showToast('Error: ' + e.message, 'error');
    })
    .saveRound(SESSION_ID, {
      productCode: SESSION_PRODUCT_CODE,
      batch: SESSION_BATCH,
      roundNo: SESSION_ROUND_NO,
      params: allParams,
      elapsedHms: document.getElementById('timerDisplay').textContent || ''
    });
}

function resetCheckValues() {
  // Reset weight inputs
  WEIGHT_ROWS.forEach(function(row) {
    var inp = document.getElementById('val_' + row.paramCode);
    if (inp) inp.value = '';
    var badge = document.getElementById('badge_' + row.paramCode);
    if (badge) { badge.className = 'res-badge res-na'; badge.textContent = 'NA'; }
  });

  // Reset quality params
  QUALITY_PARAMS.forEach(function(p) {
    var isVisual = (p.methodType === 'Visual');
    if (!isVisual) {
      var inp = document.getElementById('val_' + p.paramCode);
      if (inp) inp.value = '';
      var upgArea = document.getElementById('upg_' + p.paramCode);
      if (upgArea) upgArea.style.display = 'none';
      var devBtn = document.getElementById('devbtn_' + p.paramCode);
      var rejBtn = document.getElementById('rejbtn_' + p.paramCode);
      if (devBtn) devBtn.className = 'btn-deviation';
      if (rejBtn) rejBtn.className = 'btn-reject';
    } else {
      var opts = ['PASS', 'FAIL', 'DEFECT', 'NA'];
      opts.forEach(function(v) {
        var btn = document.getElementById('vbtn_' + p.paramCode + '_' + v);
        if (btn) btn.className = 'vis-btn';
      });
    }
    var badge = document.getElementById('badge_' + p.paramCode);
    if (badge) { badge.className = 'res-badge res-na'; badge.textContent = 'NA'; }
    var remarkWrap = document.getElementById('remarkwrap_' + p.paramCode);
    if (remarkWrap) remarkWrap.style.display = 'none';
    var remarkTa = document.getElementById('remark_' + p.paramCode);
    if (remarkTa) { remarkTa.value = ''; remarkTa.className = 'remark-area'; }
    var remarkReq = document.getElementById('remarkreq_' + p.paramCode);
    if (remarkReq) remarkReq.className = 'remark-required';
  });
}

// ─────────────────────────────────────────────
// Close session
// ─────────────────────────────────────────────
function confirmCloseSession() {
  if (!confirm('Close this IPQC session? This cannot be reopened.')) return;
  showLoading('Closing session…');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      stopTimer();
      showToast('Session closed.', 'success');
      SESSION_ID = null;
      showScreen('A');
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Error closing session: ' + e.message, 'error');
    })
    .closeSession(SESSION_ID);
}

// ─────────────────────────────────────────────
// Screen D — Report overlay
// ─────────────────────────────────────────────
function viewReport() {
  showLoading('Loading report…');
  google.script.run
    .withSuccessHandler(function(rounds) {
      hideLoading();
      buildReportOverlay(rounds.rounds || []);
      document.getElementById('screenD').style.display = 'flex';
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Error loading report: ' + e.message, 'error');
    })
    .getSessionRounds(SESSION_ID);
}

function closeReport() {
  document.getElementById('screenD').style.display = 'none';
}

function buildReportOverlay(rounds) {
  var title = 'IPQC Report — ' + SESSION_PRODUCT_NAME + ' · Batch ' + SESSION_BATCH;
  document.getElementById('reportTitle').textContent = title;

  var table = document.getElementById('reportTable');
  table.innerHTML = '';

  if (rounds.length === 0) {
    table.innerHTML = '<tr><td style="padding:20px;color:var(--muted);text-align:center;">No rounds saved yet.</td></tr>';
    return;
  }

  // Collect all param codes/names in order
  var paramOrder = [];
  var paramNameMap = {};
  // Use first round to determine params
  if (rounds[0] && rounds[0].params) {
    rounds[0].params.forEach(function(p) {
      paramOrder.push(p.paramCode);
      paramNameMap[p.paramCode] = p.paramName;
    });
  }

  // Build a quick lookup: roundIndex -> paramCode -> {actualValue, result}
  var roundData = [];
  rounds.forEach(function(rnd) {
    var map = {};
    if (rnd.params) {
      rnd.params.forEach(function(p) {
        map[p.paramCode] = { actualValue: p.actualValue, result: p.result };
        if (!paramNameMap[p.paramCode]) paramNameMap[p.paramCode] = p.paramName;
        if (paramOrder.indexOf(p.paramCode) === -1) paramOrder.push(p.paramCode);
      });
    }
    roundData.push(map);
  });

  // Header row
  var thead = document.createElement('thead');
  var hRow = document.createElement('tr');
  var thParam = document.createElement('th');
  thParam.className = 'rt-param-hdr';
  thParam.textContent = 'Parameter';
  hRow.appendChild(thParam);
  rounds.forEach(function(rnd, idx) {
    var th = document.createElement('th');
    th.textContent = 'Round ' + (rnd.roundNo || (idx + 1));
    hRow.appendChild(th);
  });
  thead.appendChild(hRow);
  table.appendChild(thead);

  // Body rows
  var tbody = document.createElement('tbody');
  paramOrder.forEach(function(code) {
    var tr = document.createElement('tr');
    var tdLabel = document.createElement('td');
    tdLabel.className = 'rt-param-cell';
    tdLabel.textContent = paramNameMap[code] || code;
    tr.appendChild(tdLabel);

    roundData.forEach(function(rMap) {
      var td = document.createElement('td');
      var entry = rMap[code];
      if (entry) {
        var result = entry.result || 'NA';
        var cls = 'res-badge res-' + result.toLowerCase();
        var badge = document.createElement('span');
        badge.className = cls;
        badge.textContent = result;
        td.appendChild(badge);
        if (entry.actualValue !== '' && entry.actualValue !== null && entry.actualValue !== undefined) {
          var valSpan = document.createElement('span');
          valSpan.className = 'rt-cell-val';
          valSpan.textContent = entry.actualValue;
          td.appendChild(valSpan);
        }
      } else {
        var naBadge = document.createElement('span');
        naBadge.className = 'res-badge res-na';
        naBadge.textContent = 'NA';
        td.appendChild(naBadge);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  // Summary row
  var sumTr = document.createElement('tr');
  sumTr.className = 'summary-row';
  var sumLabel = document.createElement('td');
  sumLabel.className = 'rt-param-cell';
  sumLabel.textContent = 'Summary';
  sumTr.appendChild(sumLabel);

  roundData.forEach(function(rMap) {
    var counts = { PASS: 0, FAIL: 0, DEVIATION: 0, REJECT: 0, DEFECT: 0, NA: 0 };
    paramOrder.forEach(function(code) {
      var entry = rMap[code];
      var r = entry ? (entry.result || 'NA') : 'NA';
      if (counts[r] !== undefined) counts[r]++;
      else counts.NA++;
    });
    var td = document.createElement('td');
    td.style.fontSize = '10px';
    td.style.lineHeight = '1.6';
    var lines = [];
    if (counts.PASS)      lines.push('<span style="color:#16A34A;font-weight:700;">P:' + counts.PASS + '</span>');
    if (counts.FAIL)      lines.push('<span style="color:#DC2626;font-weight:700;">F:' + counts.FAIL + '</span>');
    if (counts.DEVIATION) lines.push('<span style="color:#B45309;font-weight:700;">D:' + counts.DEVIATION + '</span>');
    if (counts.REJECT)    lines.push('<span style="color:#9B1C1C;font-weight:700;">R:' + counts.REJECT + '</span>');
    if (counts.DEFECT)    lines.push('<span style="color:#5B21B6;font-weight:700;">Def:' + counts.DEFECT + '</span>');
    td.innerHTML = lines.join(' ');
    sumTr.appendChild(td);
  });
  tbody.appendChild(sumTr);

  table.appendChild(tbody);
}

// ─────────────────────────────────────────────
// Loading overlay
// ─────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('loadingMsg').textContent = msg || 'Loading…';
  document.getElementById('loading').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

// ─────────────────────────────────────────────
// Toast
// ─────────────────────────────────────────────
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

// ─────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────
window.onload = function() {
  init();
};
</script>
</body>
</html>
