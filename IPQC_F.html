<script>
// ─────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────
var DWM_SESSION_ID = null;
var SESSION_ID = null;
var SESSION_PRODUCT_CODE = '';
var SESSION_PRODUCT_NAME = '';
var SESSION_BATCH = '';
var SESSION_INSPECTOR = '';
var SESSION_LINE = '';
var ROUND_NO = 1;

var PARAMS = [];           // [{paramCode, paramName, stdValue, unit, tolMin, tolMax, methodType}]
var ROUND_DATA = [];       // [{paramCode, paramName, stdValue, unit, result, remark}]
var CURRENT_PARAM_IDX = 0; // which card is focused

var timerInterval = null;
var ROUND_START_TS = null;
var ROUND_ELAPSED_S = 0;

var SESSION_TOTAL_OK = 0;
var SESSION_TOTAL_NG = 0;
var SESSION_TOTAL_NA = 0;

var MACHINES = ['Line 1', 'Line 2', 'Line 3', 'Other'];
var SELECTED_MACHINE = '';

// ─────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────
window.onload = function() {
  DWM_SESSION_ID = (typeof sessionStorage !== 'undefined')
    ? (sessionStorage.getItem('dwmSessionId') || null)
    : null;

  buildMachineGrid();

  showLoading('Loading…');
  google.script.run
    .withSuccessHandler(function(d) {
      hideLoading();
      var pSel = document.getElementById('setupProduct');
      (d.fgList || []).forEach(function(fg) {
        var o = document.createElement('option');
        var label = fg.name || fg.description || fg.code;
        o.value = fg.code;
        o.textContent = label.length > 40 ? label.substring(0, 40) + '…' : label;
        o.setAttribute('data-desc', label);
        pSel.appendChild(o);
      });

      var iSel = document.getElementById('setupInspector');
      (d.inspectors || []).forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.name;
        o.textContent = p.name + (p.role ? ' — ' + p.role : '');
        iSel.appendChild(o);
      });
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Failed to load form: ' + e.message, 'error');
    })
    .getIPQCFormInit();
};

// ─────────────────────────────────────────────────────────
// Machine grid
// ─────────────────────────────────────────────────────────
function buildMachineGrid() {
  var grid = document.getElementById('machineGrid');
  grid.innerHTML = '';
  MACHINES.forEach(function(m) {
    var btn = document.createElement('button');
    btn.className = 'machine-btn';
    btn.id = 'mbtn_' + m.replace(/\s+/g,'_');
    btn.innerHTML = '<span class="machine-icon">&#9881;</span>' + m;
    btn.onclick = (function(name) {
      return function() { selectMachine(name); };
    })(m);
    grid.appendChild(btn);
  });
}

function selectMachine(name) {
  SELECTED_MACHINE = name;
  MACHINES.forEach(function(m) {
    var btn = document.getElementById('mbtn_' + m.replace(/\s+/g,'_'));
    if (btn) btn.className = 'machine-btn' + (m === name ? ' active' : '');
  });
  var otherField = document.getElementById('machineOtherField');
  if (otherField) otherField.style.display = (name === 'Other') ? 'block' : 'none';
}

// ─────────────────────────────────────────────────────────
// State 1 → Start
// ─────────────────────────────────────────────────────────
function startCheck() {
  var pSel = document.getElementById('setupProduct');
  var productCode = pSel.value;
  var productOpt = pSel.options[pSel.selectedIndex];
  var productName = productOpt ? (productOpt.getAttribute('data-desc') || productCode) : productCode;
  var batch = document.getElementById('setupBatch').value.trim();
  var inspector = document.getElementById('setupInspector').value;
  var line = SELECTED_MACHINE;
  if (line === 'Other') {
    line = document.getElementById('machineOtherInput').value.trim();
  }

  if (!inspector)    { showToast('Please select an inspector.', 'error'); return; }
  if (!productCode)  { showToast('Please select a product.', 'error'); return; }
  if (!batch)        { showToast('Please enter a batch number.', 'error'); return; }
  if (!line)         { showToast('Please select a line / machine.', 'error'); return; }
  if (SELECTED_MACHINE === 'Other' && !line) {
    showToast('Please specify the line name.', 'error'); return;
  }

  SESSION_PRODUCT_CODE = productCode;
  SESSION_PRODUCT_NAME = productName;
  SESSION_BATCH = batch;
  SESSION_INSPECTOR = inspector;
  SESSION_LINE = line;

  showLoading('Starting session…');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.ok) { showToast('Error: ' + (res.error || 'Could not start session.'), 'error'); return; }
      SESSION_ID = res.sessionId;
      ROUND_NO = res.resumed ? (res.rounds || 0) + 1 : 1;
      showToast(res.resumed ? 'Resuming — Round ' + ROUND_NO : 'Session started', 'success');
      loadParamsAndBeginRound();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Error: ' + e.message, 'error');
    })
    .startSession({ productCode: productCode, productName: productName, batch: batch, inspector: inspector, line: line });
}

// ─────────────────────────────────────────────────────────
// Load params then enter round
// ─────────────────────────────────────────────────────────
function loadParamsAndBeginRound() {
  showLoading('Loading parameters…');
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      PARAMS = result.params || [];
      if (result.warning && PARAMS.length === 0) {
        showToast('No control plan for this product.', 'error');
      }
      enterRound();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      PARAMS = [];
      enterRound();
    })
    .getIPQCParams(SESSION_PRODUCT_CODE);
}

// ─────────────────────────────────────────────────────────
// State 2: Active Round
// ─────────────────────────────────────────────────────────
function enterRound() {
  ROUND_DATA = PARAMS.map(function(p) {
    return { paramCode: p.paramCode, paramName: p.paramName,
             stdValue: p.stdValue || '', unit: p.unit || '',
             result: '', remark: '' };
  });
  CURRENT_PARAM_IDX = 0;

  var shortName = SESSION_PRODUCT_NAME.length > 22
    ? SESSION_PRODUCT_NAME.substring(0, 22) + '…' : SESSION_PRODUCT_NAME;
  document.getElementById('roundHdrTitle').textContent = shortName + ' · ' + SESSION_BATCH;
  document.getElementById('roundHdrBadge').textContent = 'R' + ROUND_NO;
  document.getElementById('roundBadge').style.display = 'inline-block';
  document.getElementById('roundBadge').textContent = 'R' + ROUND_NO;

  buildParamCards();
  startTimer();
  showState(2);
}

function buildParamCards() {
  var container = document.getElementById('paramCards');
  container.innerHTML = '';

  if (PARAMS.length === 0) {
    container.innerHTML = '<div style="padding:30px;text-align:center;color:var(--muted);font-size:13px;">No parameters configured for this product.</div>';
    return;
  }

  PARAMS.forEach(function(p, idx) {
    var card = document.createElement('div');
    card.className = 'param-card' + (idx === 0 ? ' highlight' : '');
    card.id = 'pcard_' + idx;

    // Header
    var hdr = document.createElement('div');
    hdr.className = 'pc-header';

    var num = document.createElement('div');
    num.className = 'pc-num';
    num.textContent = idx + 1;

    var nameWrap = document.createElement('div');
    nameWrap.style.flex = '1';
    nameWrap.style.minWidth = '0';

    var nameEl = document.createElement('div');
    nameEl.className = 'pc-name';
    nameEl.textContent = p.paramName;

    var stdEl = document.createElement('div');
    stdEl.className = 'pc-std';
    if (p.stdValue !== '' && p.stdValue !== null && p.stdValue !== undefined) {
      var t = 'Std: ' + p.stdValue;
      if (p.unit) t += ' ' + p.unit;
      if (p.tolMin !== '' && p.tolMax !== '') t += ' (' + p.tolMin + '–' + p.tolMax + ')';
      stdEl.textContent = t;
    } else {
      stdEl.textContent = p.checkBrief || p.methodType || '';
    }
    nameWrap.appendChild(nameEl);
    nameWrap.appendChild(stdEl);

    var statusEl = document.createElement('div');
    statusEl.className = 'pc-status';
    statusEl.id = 'pcstatus_' + idx;
    statusEl.textContent = '○';

    hdr.appendChild(num);
    hdr.appendChild(nameWrap);
    hdr.appendChild(statusEl);
    card.appendChild(hdr);

    // Body: 3-tap buttons
    var body = document.createElement('div');
    body.className = 'pc-body';
    body.id = 'pcbody_' + idx;

    var tapRow = document.createElement('div');
    tapRow.className = 'tap-row';

    [
      { val: 'OK', cls: 'sel-ok', label: '✓ OK' },
      { val: 'NG', cls: 'sel-ng', label: '✗ NG' },
      { val: 'NA', cls: 'sel-na', label: '— NA' }
    ].forEach(function(opt) {
      var btn = document.createElement('button');
      btn.className = 'tap-btn';
      btn.id = 'tap_' + idx + '_' + opt.val;
      btn.textContent = opt.label;
      btn.onclick = (function(i, v, c) {
        return function() { tapResult(i, v, c); };
      })(idx, opt.val, opt.cls);
      tapRow.appendChild(btn);
    });
    body.appendChild(tapRow);

    // Remark (shown for NG)
    var remark = document.createElement('textarea');
    remark.className = 'pc-remark';
    remark.id = 'pcremark_' + idx;
    remark.placeholder = 'Describe the issue… (required for NG)';
    remark.rows = 2;
    body.appendChild(remark);

    var remarkHint = document.createElement('div');
    remarkHint.className = 'pc-remark-hint';
    remarkHint.id = 'pcremarkhint_' + idx;
    remarkHint.textContent = 'Remark required for NG.';
    body.appendChild(remarkHint);

    card.appendChild(body);
    container.appendChild(card);
  });

  updateProgress();
}

function tapResult(idx, val, cls) {
  // Set result in data
  ROUND_DATA[idx].result = val;

  // Update button styles
  ['OK','NG','NA'].forEach(function(v) {
    var btn = document.getElementById('tap_' + idx + '_' + v);
    if (btn) btn.className = 'tap-btn' + (v === val ? ' ' + cls : '');
  });

  // Update card status icon
  var statusEl = document.getElementById('pcstatus_' + idx);
  if (statusEl) {
    statusEl.textContent = val === 'OK' ? '✓' : (val === 'NG' ? '✗' : '—');
    statusEl.className = 'pc-status ' + val.toLowerCase();
  }

  // Show/hide remark
  var remarkEl = document.getElementById('pcremark_' + idx);
  var hintEl   = document.getElementById('pcremarkhint_' + idx);
  if (remarkEl) remarkEl.style.display = (val === 'NG') ? 'block' : 'none';
  if (val !== 'NG') { ROUND_DATA[idx].remark = ''; }

  // Remove highlight from this card
  var card = document.getElementById('pcard_' + idx);
  if (card) card.classList.remove('highlight');

  // Auto-advance to next unanswered param
  var nextIdx = -1;
  for (var i = idx + 1; i < PARAMS.length; i++) {
    if (!ROUND_DATA[i].result) { nextIdx = i; break; }
  }
  if (nextIdx === -1) {
    // check before idx too
    for (var j = 0; j < idx; j++) {
      if (!ROUND_DATA[j].result) { nextIdx = j; break; }
    }
  }
  if (nextIdx !== -1) {
    var nextCard = document.getElementById('pcard_' + nextIdx);
    if (nextCard) {
      nextCard.classList.add('highlight');
      setTimeout(function() {
        nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 80);
    }
  }

  updateProgress();
}

function updateProgress() {
  var answered = ROUND_DATA.filter(function(d) { return !!d.result; }).length;
  var total = PARAMS.length;
  var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
  var fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
}

// ─────────────────────────────────────────────────────────
// Timer
// ─────────────────────────────────────────────────────────
function startTimer() {
  stopTimer();
  ROUND_START_TS = new Date();
  ROUND_ELAPSED_S = 0;
  timerInterval = setInterval(function() {
    ROUND_ELAPSED_S = Math.floor((new Date() - ROUND_START_TS) / 1000);
    var m = Math.floor(ROUND_ELAPSED_S / 60);
    var s = ROUND_ELAPSED_S % 60;
    var el = document.getElementById('timerDisplay');
    if (el) el.textContent = pad2(m) + ':' + pad2(s);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function formatHms(s) {
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return pad2(h) + ':' + pad2(m) + ':' + pad2(sec);
}

function fmtTime(dt) {
  if (!dt) return '—';
  return pad2(dt.getHours()) + ':' + pad2(dt.getMinutes()) + ':' + pad2(dt.getSeconds());
}

// ─────────────────────────────────────────────────────────
// Save Round
// ─────────────────────────────────────────────────────────
function saveRound() {
  if (PARAMS.length === 0) {
    // No params — save empty round
    doSaveRound([]);
    return;
  }

  // Validate: all params must have a result
  var unanswered = [];
  ROUND_DATA.forEach(function(d, idx) {
    if (!d.result) unanswered.push(idx);
  });
  if (unanswered.length > 0) {
    showToast(unanswered.length + ' parameter(s) still need a result.', 'error');
    // Highlight first unanswered
    var card = document.getElementById('pcard_' + unanswered[0]);
    if (card) {
      card.classList.add('highlight');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }

  // Validate NG remarks
  var missingRemark = false;
  ROUND_DATA.forEach(function(d, idx) {
    if (d.result === 'NG') {
      var remarkEl = document.getElementById('pcremark_' + idx);
      var val = remarkEl ? remarkEl.value.trim() : '';
      d.remark = val;
      if (!val) {
        missingRemark = true;
        if (remarkEl) remarkEl.className = 'pc-remark req';
        var hintEl = document.getElementById('pcremarkhint_' + idx);
        if (hintEl) hintEl.className = 'pc-remark-hint show';
        remarkEl && remarkEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } else {
      var remarkEl2 = document.getElementById('pcremark_' + idx);
      d.remark = remarkEl2 ? remarkEl2.value.trim() : '';
    }
  });
  if (missingRemark) {
    showToast('Please add remarks for all NG parameters.', 'error');
    return;
  }

  doSaveRound(ROUND_DATA);
}

function doSaveRound(params) {
  stopTimer();
  var endTs = new Date();
  var startDisplay = ROUND_START_TS ? fmtTime(ROUND_START_TS) : '—';
  var endDisplay   = fmtTime(endTs);
  var elapsed      = ROUND_ELAPSED_S;

  var btn = document.getElementById('btnSaveRound');
  if (btn) btn.disabled = true;

  var roundPayload = {
    productCode:     SESSION_PRODUCT_CODE,
    batch:           SESSION_BATCH,
    params:          params,
    periodStartTime: startDisplay,
    periodEndTime:   endDisplay,
    elapsedHms:      formatHms(elapsed),
    avgWeight:       ''
  };

  showLoading('Saving round…');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (btn) btn.disabled = false;
      if (!res.ok) {
        showToast('Save error: ' + (res.error || 'Unknown error'), 'error');
        startTimer(); // resume
        return;
      }
      var savedRound = ROUND_NO;
      ROUND_NO = res.roundNo + 1;

      // Fire auto-task (DWM integration)
      if (DWM_SESSION_ID && SESSION_ID) {
        google.script.run.autoQmsTask_(
          DWM_SESSION_ID, 'IPQC',
          'IPQC: ' + SESSION_LINE + ' — Round ' + savedRound,
          SESSION_ID
        );
      }

      // Accumulate totals
      var ok = 0, ng = 0, na = 0;
      params.forEach(function(d) {
        if (d.result === 'OK') ok++;
        else if (d.result === 'NG') ng++;
        else na++;
      });
      SESSION_TOTAL_OK += ok;
      SESSION_TOTAL_NG += ng;
      SESSION_TOTAL_NA += na;

      showRoundSummary(savedRound, ok, ng, na, params);
    })
    .withFailureHandler(function(e) {
      hideLoading();
      if (btn) btn.disabled = false;
      showToast('Error: ' + e.message, 'error');
      startTimer();
    })
    .saveRound(SESSION_ID, roundPayload);
}

// ─────────────────────────────────────────────────────────
// State 3: Round Summary
// ─────────────────────────────────────────────────────────
function showRoundSummary(roundNo, ok, ng, na, params) {
  document.getElementById('rsSummaryMeta').textContent =
    SESSION_PRODUCT_NAME + ' · ' + SESSION_BATCH + ' · ' + SESSION_LINE;
  document.getElementById('rsCountOk').textContent = ok;
  document.getElementById('rsCountNg').textContent = ng;
  document.getElementById('rsCountNa').textContent = na;

  var hero = document.getElementById('rsSummaryHero');
  if (ng > 0) {
    hero.style.background = 'var(--danger)';
  } else {
    hero.style.background = 'var(--navy)';
  }

  var list = document.getElementById('rsParamList');
  list.innerHTML = '';
  if (params.length === 0) {
    list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px;">No parameters checked.</div>';
  } else {
    params.forEach(function(d) {
      var item = document.createElement('div');
      item.className = 'rs-param-item';

      var name = document.createElement('div');
      name.className = 'rs-param-name';
      name.textContent = d.paramName || d.paramCode;

      var res = document.createElement('span');
      res.className = 'rs-param-result ' +
        (d.result === 'OK' ? 'rs-result-ok' : (d.result === 'NG' ? 'rs-result-ng' : 'rs-result-na'));
      res.textContent = d.result || 'NA';

      item.appendChild(name);
      item.appendChild(res);
      list.appendChild(item);
    });
  }

  var rsBadge = document.getElementById('roundBadge');
  if (rsBadge) { rsBadge.textContent = 'R' + roundNo + ' Done'; }
  document.getElementById('headerTitle').textContent = 'Round ' + roundNo + ' Summary';

  showState(3);
}

// ─────────────────────────────────────────────────────────
// State 3 actions
// ─────────────────────────────────────────────────────────
function nextRound() {
  document.getElementById('headerTitle').textContent = '&#9881; IPQC';
  enterRound();
}

function endSessionFull() {
  if (!confirm('End this IPQC session? No further rounds can be added.')) return;
  closeIPQCSession();
}

function endSessionEarly() {
  if (!confirm('End session without saving current round? Unsaved data will be lost.')) return;
  closeIPQCSession();
}

function closeIPQCSession() {
  showLoading('Closing session…');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.ok) {
        showToast('Warning: ' + (res.error || 'Could not close session.'), 'error');
      }
      showFinalSummary();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Error closing session: ' + e.message, 'error');
      showFinalSummary();
    })
    .closeSession(SESSION_ID);
}

// ─────────────────────────────────────────────────────────
// State 4: Final Summary
// ─────────────────────────────────────────────────────────
function showFinalSummary() {
  stopTimer();
  var completedRounds = ROUND_NO - 1;
  document.getElementById('finalMeta').textContent =
    SESSION_PRODUCT_NAME + ' · Batch ' + SESSION_BATCH;
  document.getElementById('finalRounds').textContent = completedRounds;
  document.getElementById('finalOk').textContent = SESSION_TOTAL_OK;
  document.getElementById('finalNg').textContent = SESSION_TOTAL_NG;
  document.getElementById('finalNa').textContent = SESSION_TOTAL_NA;

  document.getElementById('roundBadge').style.display = 'none';
  document.getElementById('headerBackBtn').style.display = 'none';
  document.getElementById('headerTitle').textContent = 'Session Complete';
  showState(4);
}

function goHome() {
  google.script.run
    .withSuccessHandler(function(html) {
      document.open(); document.write(html); document.close();
    })
    .getLandingHtml();
}

// ─────────────────────────────────────────────────────────
// Navigation helpers
// ─────────────────────────────────────────────────────────
function showState(n) {
  [1, 2, 3, 4].forEach(function(i) {
    var el = document.getElementById('state' + i);
    if (el) el.style.display = (i === n) ? 'block' : 'none';
  });

  var backBtn = document.getElementById('headerBackBtn');
  if (n === 1) {
    backBtn.style.display = 'none';
    document.getElementById('headerTitle').textContent = '⚙ IPQC';
    document.getElementById('roundBadge').style.display = 'none';
  } else if (n === 2) {
    backBtn.style.display = 'none'; // no back during active round
    document.getElementById('roundBadge').style.display = 'inline-block';
  } else if (n === 3) {
    backBtn.style.display = 'none';
    document.getElementById('roundBadge').style.display = 'inline-block';
  }
  window.scrollTo(0, 0);
}

function headerBack() {
  // Only used on state 1 in future; currently back btn is hidden in all states
  showState(1);
}

// ─────────────────────────────────────────────────────────
// beforeunload guard
// ─────────────────────────────────────────────────────────
window.addEventListener('beforeunload', function(e) {
  // Stop DWM timer if active round is in progress
  if (timerInterval) { stopTimer(); }
  // Warn if round is in progress (state 2 visible)
  var s2 = document.getElementById('state2');
  if (s2 && s2.style.display !== 'none' && PARAMS.length > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ─────────────────────────────────────────────────────────
// Toast / Loading
// ─────────────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('loadingMsg').textContent = msg || 'Loading…';
  document.getElementById('loading').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}
</script>
