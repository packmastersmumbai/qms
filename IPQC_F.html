<script>
// ── App state ──────────────────────────────────────────────────────────────
var DWM_SESSION_ID = null;
var TASK_ID = null;
var SESSION_ID = null;
var SESSION_SAVED = false;

var SEL_PRODUCT_CODE = '';
var SEL_PRODUCT_NAME = '';
var BATCH_NO = '';
var INSPECTOR = '';

var PARAMS = [];         // [{paramCode, paramName, unit, stdValue, tolMin, tolMax, checkBrief}]
var CURRENT_PARAM_IDX = 0;
var ROUND_NO = 1;

// Each round: {roundNo, params: [{paramCode, paramName, result, remark, timestamp}]}
var ALL_ROUNDS = [];     // accumulated across session, written at close
var CURRENT_ROUND_RESULTS = [];  // [{result, remark}] index matches PARAMS

// ── Boot ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  DWM_SESSION_ID = (typeof sessionStorage !== 'undefined')
    ? (sessionStorage.getItem('dwmSessionId') || null) : null;

  showLoading('Loading products…');
  google.script.run
    .withSuccessHandler(function(d) {
      hideLoading();
      buildProductGrid(d.fgList || []);
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Failed to load: ' + e.message, 'error');
    })
    .getIPQCFormInit();
});

// ── State 1: Product grid ──────────────────────────────────────────────────
function buildProductGrid(fgList) {
  var grid = document.getElementById('productGrid');
  var empty = document.getElementById('s1Empty');
  grid.innerHTML = '';

  if (!fgList || fgList.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  fgList.forEach(function(fg) {
    var code = fg.code || '';
    var name = fg.name || fg.description || code;
    var btn = document.createElement('button');
    btn.className = 'product-btn';
    btn.setAttribute('data-code', code);
    btn.setAttribute('data-name', name);
    btn.innerHTML =
      '<span class="product-btn-name">' + escHtml(name) + '</span>' +
      '<span class="product-btn-code">' + escHtml(code) + '</span>';
    btn.addEventListener('click', (function(c, n) {
      return function() { selectProduct(c, n); };
    })(code, name));
    grid.appendChild(btn);
  });
}

function selectProduct(code, name) {
  SEL_PRODUCT_CODE = code;
  SEL_PRODUCT_NAME = name;

  // Visual feedback — briefly highlight then navigate
  var btns = document.querySelectorAll('.product-btn');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute('data-code') === code) {
      btns[i].classList.add('active');
    } else {
      btns[i].classList.remove('active');
    }
  }

  setTimeout(function() { goToState2(); }, 150);
}

// ── State 2: Enter batch ───────────────────────────────────────────────────
function goToState2() {
  document.getElementById('stripProductName').textContent = SEL_PRODUCT_NAME;
  document.getElementById('stripProductCode').textContent = SEL_PRODUCT_CODE;
  document.getElementById('headerTitle').textContent = 'IPQC — ' + truncate(SEL_PRODUCT_NAME, 24);
  document.getElementById('inputBatch').value = '';
  document.getElementById('inputInspector').value = '';
  document.getElementById('btnStartInsp').disabled = true;
  showState(2);
}

function checkS2Fields() {
  var batch = document.getElementById('inputBatch').value.trim();
  var insp  = document.getElementById('inputInspector').value.trim();
  document.getElementById('btnStartInsp').disabled = !(batch && insp);
}

function startInspection() {
  BATCH_NO  = document.getElementById('inputBatch').value.trim();
  INSPECTOR = document.getElementById('inputInspector').value.trim();

  if (!BATCH_NO)  { showToast('Enter a batch number.', 'error'); return; }
  if (!INSPECTOR) { showToast('Enter inspector name.', 'error'); return; }

  var btn = document.getElementById('btnStartInsp');
  btn.disabled = true;
  btn.textContent = 'Starting…';

  showLoading('Starting session…');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.ok) {
        hideLoading();
        btn.disabled = false;
        btn.textContent = 'START INSPECTION →';
        showToast(res.error || 'Could not start session.', 'error');
        return;
      }
      SESSION_ID = res.sessionId;
      ROUND_NO   = res.resumed ? ((res.rounds || 0) + 1) : 1;
      ALL_ROUNDS = [];
      SESSION_SAVED = false;

      // Load params then trigger DWM task
      google.script.run
        .withSuccessHandler(function(pr) {
          hideLoading();
          btn.disabled = false;
          btn.textContent = 'START INSPECTION →';

          PARAMS = pr.params || [];
          if (pr.warning && PARAMS.length === 0) {
            showToast('No control plan params for this product.', 'error');
          }

          // Fire DWM task (non-blocking)
          if (DWM_SESSION_ID) {
            google.script.run
              .withSuccessHandler(function(tr) {
                if (tr && tr.taskId) { TASK_ID = tr.taskId; }
              })
              .withFailureHandler(function() {})
              .autoQmsTask_(
                DWM_SESSION_ID,
                'IPQC',
                'IPQC: ' + SEL_PRODUCT_CODE + ' — Batch ' + BATCH_NO,
                SESSION_ID
              );
          }

          beginRound();
        })
        .withFailureHandler(function(e) {
          hideLoading();
          btn.disabled = false;
          btn.textContent = 'START INSPECTION →';
          showToast('Could not load params: ' + e.message, 'error');
          PARAMS = [];
          beginRound();
        })
        .getIPQCParams(SEL_PRODUCT_CODE);
    })
    .withFailureHandler(function(e) {
      hideLoading();
      btn.disabled = false;
      btn.textContent = 'START INSPECTION →';
      showToast('Error: ' + e.message, 'error');
    })
    .startSession({
      productCode: SEL_PRODUCT_CODE,
      productName: SEL_PRODUCT_NAME,
      batch:       BATCH_NO,
      inspector:   INSPECTOR,
      line:        SEL_PRODUCT_CODE
    });
}

// ── State 3: Record round ──────────────────────────────────────────────────
function beginRound() {
  CURRENT_PARAM_IDX = 0;
  CURRENT_ROUND_RESULTS = [];
  for (var i = 0; i < PARAMS.length; i++) {
    CURRENT_ROUND_RESULTS.push({ result: '', remark: '' });
  }
  renderParam(0);
  showState(3);
}

function renderParam(idx) {
  CURRENT_PARAM_IDX = idx;
  var total = PARAMS.length;

  // Sub-header
  document.getElementById('roundSubTitle').textContent =
    'Round ' + ROUND_NO + ' — ' + truncate(SEL_PRODUCT_NAME, 20);
  document.getElementById('progressPill').textContent = (idx + 1) + '/' + total;

  // Progress bar
  var pct = total > 0 ? Math.round((idx / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';

  // Param card content
  if (total === 0) {
    document.getElementById('paramName').textContent = 'No parameters configured';
    document.getElementById('paramSpec').textContent = '';
  } else {
    var p = PARAMS[idx];
    document.getElementById('paramName').textContent = p.paramName || p.paramCode;
    var spec = '';
    if (p.stdValue !== null && p.stdValue !== undefined && p.stdValue !== '') {
      spec = 'Std: ' + p.stdValue;
      if (p.unit) spec += ' ' + p.unit;
      if (p.tolMin !== '' && p.tolMin !== null && p.tolMax !== '' && p.tolMax !== null) {
        spec += ' (' + p.tolMin + '–' + p.tolMax + ')';
      }
    } else if (p.checkBrief) {
      spec = p.checkBrief;
    }
    document.getElementById('paramSpec').textContent = spec;
  }

  // Restore any previously recorded result for this param
  var saved = CURRENT_ROUND_RESULTS[idx];
  setToggleState(saved ? saved.result : '');
  document.getElementById('remarkTextarea').value = (saved && saved.remark) ? saved.remark : '';

  // Card fail state
  var card = document.getElementById('paramCard');
  if (saved && saved.result === 'FAIL') {
    card.classList.add('fail-state');
  } else {
    card.classList.remove('fail-state');
  }

  // Bottom bar
  document.getElementById('barParamLabel').textContent = 'Param ' + (idx + 1) + ' of ' + total;
  var isLast = (idx === total - 1);
  var nextBtn = document.getElementById('btnNext');
  nextBtn.textContent = isLast ? 'Review Round →' : 'Next →';
  nextBtn.disabled = !(saved && saved.result);
}

function setToggleState(result) {
  var btnPass = document.getElementById('btnPass');
  var btnFail = document.getElementById('btnFail');
  var btnNA   = document.getElementById('btnNA');
  btnPass.className = 'pf-toggle-btn' + (result === 'PASS' ? ' sel-pass' : '');
  btnFail.className = 'pf-toggle-btn' + (result === 'FAIL' ? ' sel-fail' : '');
  btnNA.className   = 'pf-toggle-btn' + (result === 'NA'   ? ' sel-na'   : '');
}

function selectResult(result) {
  var idx = CURRENT_PARAM_IDX;
  if (!CURRENT_ROUND_RESULTS[idx]) return;

  CURRENT_ROUND_RESULTS[idx].result    = result;
  CURRENT_ROUND_RESULTS[idx].timestamp = new Date().toISOString();

  setToggleState(result);

  var card = document.getElementById('paramCard');
  if (result === 'FAIL') {
    card.classList.add('fail-state');
  } else {
    card.classList.remove('fail-state');
  }

  document.getElementById('btnNext').disabled = false;
}

function handleNext() {
  var idx = CURRENT_PARAM_IDX;
  // Save remark
  if (CURRENT_ROUND_RESULTS[idx]) {
    CURRENT_ROUND_RESULTS[idx].remark = document.getElementById('remarkTextarea').value.trim();
  }

  var result = CURRENT_ROUND_RESULTS[idx] ? CURRENT_ROUND_RESULTS[idx].result : '';
  if (!result) {
    // Shake card
    shakeCard();
    return;
  }

  var total = PARAMS.length;
  if (idx < total - 1) {
    renderParam(idx + 1);
  } else {
    // Last param — go to summary
    showRoundSummary();
  }
}

function shakeCard() {
  var card = document.getElementById('paramCard');
  card.classList.remove('do-shake');
  // Force reflow
  void card.offsetWidth;
  card.classList.add('do-shake');
  setTimeout(function() { card.classList.remove('do-shake'); }, 350);
}

// ── State 4: Round summary ─────────────────────────────────────────────────
function showRoundSummary() {
  // Save last remark
  var idx = CURRENT_PARAM_IDX;
  if (CURRENT_ROUND_RESULTS[idx]) {
    CURRENT_ROUND_RESULTS[idx].remark = document.getElementById('remarkTextarea').value.trim();
  }

  var now = new Date();
  var timeStr = pad2(now.getHours()) + ':' + pad2(now.getMinutes());

  // Session strip
  document.getElementById('s4StripLine1').textContent =
    SEL_PRODUCT_NAME + ' — Batch ' + BATCH_NO;
  document.getElementById('s4StripLine2').textContent =
    'Round ' + ROUND_NO + '  ·  ' + INSPECTOR + '  ·  ' + timeStr;

  // Count results
  var passCount = 0, failCount = 0, naCount = 0;
  for (var i = 0; i < CURRENT_ROUND_RESULTS.length; i++) {
    var r = CURRENT_ROUND_RESULTS[i].result;
    if (r === 'PASS') passCount++;
    else if (r === 'FAIL') failCount++;
    else naCount++;
  }

  // Result banner
  var banner = document.getElementById('roundResultBanner');
  if (failCount > 0) {
    banner.className = 'round-result-banner fail';
    banner.textContent = 'Round ' + ROUND_NO + ': FAIL — ' +
      failCount + ' failed out of ' + PARAMS.length;
  } else {
    banner.className = 'round-result-banner pass';
    banner.textContent = 'Round ' + ROUND_NO + ': PASS — ' +
      passCount + ' passed' + (naCount > 0 ? ', ' + naCount + ' N/A' : '');
  }

  // Param rows
  var list = document.getElementById('paramsSummaryList');
  list.innerHTML = '';
  for (var j = 0; j < PARAMS.length; j++) {
    var p = PARAMS[j];
    var rr = CURRENT_ROUND_RESULTS[j] || { result: 'NA', remark: '' };
    var row = document.createElement('div');
    row.className = 'ps-param-row';
    row.style.animationDelay = (j * 30) + 'ms';

    var top = document.createElement('div');
    top.className = 'ps-param-top';

    var nameEl = document.createElement('div');
    nameEl.className = 'ps-param-name';
    nameEl.textContent = p.paramName || p.paramCode;

    var badge = document.createElement('span');
    var res = rr.result || 'NA';
    badge.className = 'ps-result-badge ' +
      (res === 'PASS' ? 'ps-result-pass' : (res === 'FAIL' ? 'ps-result-fail' : 'ps-result-na'));
    badge.textContent = res;

    top.appendChild(nameEl);
    top.appendChild(badge);
    row.appendChild(top);

    if (rr.remark) {
      var rem = document.createElement('div');
      rem.className = 'ps-param-remark';
      rem.textContent = rr.remark;
      row.appendChild(rem);
    }

    list.appendChild(row);
  }

  // Header
  document.getElementById('headerTitle').textContent = 'Round ' + ROUND_NO + ' Summary';

  showState(4);
}

function startAnotherRound() {
  // Stash completed round
  stashCurrentRound();
  ROUND_NO++;
  document.getElementById('headerTitle').textContent = 'IPQC';
  beginRound();
}

function stashCurrentRound() {
  var params = [];
  for (var i = 0; i < PARAMS.length; i++) {
    var p = PARAMS[i];
    var rr = CURRENT_ROUND_RESULTS[i] || { result: 'NA', remark: '' };
    params.push({
      paramCode: p.paramCode,
      paramName: p.paramName,
      result:    rr.result || 'NA',
      remark:    rr.remark || '',
      timestamp: rr.timestamp || new Date().toISOString()
    });
  }
  ALL_ROUNDS.push({ roundNo: ROUND_NO, params: params });
}

// ── Close Session flow ────────────────────────────────────────────────────
function closeSession() {
  // Stash the last round that was summarised
  stashCurrentRound();

  var btn = document.getElementById('btnCloseSession');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  // Step 1: stopTimer if DWM task exists
  if (TASK_ID && DWM_SESSION_ID) {
    try {
      google.script.run
        .withFailureHandler(function() {})
        .stopTimer(TASK_ID, DWM_SESSION_ID);
    } catch(e) {}
  }

  // Step 2: saveRound for each round sequentially, then closeSession
  showLoading('Saving session…');
  saveRoundSequential(0);
}

function saveRoundSequential(idx) {
  if (idx >= ALL_ROUNDS.length) {
    // All rounds saved — now close session
    doCloseSession();
    return;
  }

  var round = ALL_ROUNDS[idx];
  var roundPayload = {
    productCode: SEL_PRODUCT_CODE,
    batch:       BATCH_NO,
    params:      round.params,
    elapsedHms:  '',
    periodStartTime: '',
    periodEndTime:   '',
    avgWeight:   ''
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.ok) {
        // Non-fatal: log and continue
        showToast('Round ' + round.roundNo + ' warning: ' + (res.error || 'unknown'), 'error');
      }
      saveRoundSequential(idx + 1);
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Error saving round ' + round.roundNo + ': ' + e.message, 'error');
      // Restore button so user can retry
      var btn = document.getElementById('btnCloseSession');
      if (btn) { btn.disabled = false; btn.textContent = 'Close Session'; }
    })
    .saveRound(SESSION_ID, roundPayload);
}

function doCloseSession() {
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      SESSION_SAVED = true;
      showToast('IPQC session saved', 'success');
      setTimeout(function() { navigateToLanding(); }, 1500);
    })
    .withFailureHandler(function(e) {
      hideLoading();
      SESSION_SAVED = true; // don't re-save on unload
      showToast('Session saved (close warning: ' + e.message + ')', 'error');
      var btn = document.getElementById('btnCloseSession');
      if (btn) { btn.disabled = false; btn.textContent = 'Close Session'; }
    })
    .closeSession(SESSION_ID);
}

// ── Navigation ────────────────────────────────────────────────────────────
function handleHeaderBack() {
  var visible = getVisibleState();
  if (visible === 2) {
    showState(1);
    document.getElementById('headerTitle').textContent = 'IPQC';
  } else if (visible === 3) {
    if (CURRENT_PARAM_IDX > 0) {
      // Save current remark before going back
      var idx = CURRENT_PARAM_IDX;
      if (CURRENT_ROUND_RESULTS[idx]) {
        CURRENT_ROUND_RESULTS[idx].remark = document.getElementById('remarkTextarea').value.trim();
      }
      renderParam(CURRENT_PARAM_IDX - 1);
    } else {
      showState(2);
    }
  } else if (visible === 4) {
    // Back to last param of current round
    renderParam(PARAMS.length > 0 ? PARAMS.length - 1 : 0);
    showState(3);
  }
}

function getVisibleState() {
  for (var i = 1; i <= 4; i++) {
    var el = document.getElementById('state' + i);
    if (el && el.style.display !== 'none') return i;
  }
  return 1;
}

function showState(n) {
  for (var i = 1; i <= 4; i++) {
    var el = document.getElementById('state' + i);
    if (el) el.style.display = (i === n) ? 'block' : 'none';
  }
  var backBtn = document.getElementById('headerBackBtn');
  var badge   = document.getElementById('headerBadge');

  if (n === 1) {
    backBtn.style.display = 'none';
    badge.style.display   = 'inline-block';
    document.getElementById('headerTitle').textContent = 'IPQC';
  } else if (n === 2) {
    backBtn.style.display = 'flex';
    badge.style.display   = 'inline-block';
    // title set in goToState2
  } else if (n === 3) {
    backBtn.style.display = 'flex';
    badge.style.display   = 'none';
    // title set in renderParam / roundSubHdr
    document.getElementById('headerTitle').textContent = 'IPQC';
  } else if (n === 4) {
    backBtn.style.display = 'flex';
    badge.style.display   = 'inline-block';
  }

  window.scrollTo(0, 0);
}

function navigateToLanding() {
  google.script.run
    .withSuccessHandler(function(html) {
      document.open();
      document.write(html);
      document.close();
    })
    .withFailureHandler(function() {
      showToast('Could not navigate home.', 'error');
    })
    .getFormHtml('Landing');
}

// ── Beforeunload guard ────────────────────────────────────────────────────
window.addEventListener('beforeunload', function(e) {
  if (SESSION_SAVED) return;
  var state = getVisibleState();
  if (TASK_ID && DWM_SESSION_ID && !SESSION_SAVED) {
    try {
      google.script.run
        .withFailureHandler(function() {})
        .stopTimer(TASK_ID, DWM_SESSION_ID);
    } catch(ee) {}
  }
  if ((state === 3 || state === 4) && SESSION_ID) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ── Utilities ─────────────────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('loadingMsg').textContent = msg || 'Loading…';
  document.getElementById('loading').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.substring(0, max) + '…' : str;
}
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
