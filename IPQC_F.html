<script>
// ── State ──────────────────────────────────────────────────────────
var SESSION_ID   = null;
var SESSION_CODE = '';
var SESSION_NAME = '';
var SESSION_BATCH = '';
var SESSION_INSPECTOR = '';
var ROUND_NO = 1;
var SESSION_START_TS = null;
var PARAMS = [];   // [{paramCode, paramName, methodType, stdValue, unit, tolMin, tolMax, checkBrief}]
var timerInterval = null;

// ── Boot ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  showLoading('Loading…');
  google.script.run
    .withSuccessHandler(function(d) {
      hideLoading();
      populateProductSelect(d.fgList || []);
      prefillInspector(d.inspectors || []);
      renderOpenSessions(d.openSessions || []);
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Load error: ' + e.message, 'error');
    })
    .getIPQCFormInit();
});

function populateProductSelect(fgList) {
  var sel = document.getElementById('setupProduct');
  fgList.forEach(function(fg) {
    var o = document.createElement('option');
    o.value = fg.code;
    o.textContent = (fg.name || fg.description || fg.code);
    o.setAttribute('data-name', fg.name || fg.description || fg.code);
    sel.appendChild(o);
  });
}

function prefillInspector(inspectors) {
  var el = document.getElementById('setupInspector');
  var opName = window.QMS ? window.QMS.getOperatorName() : '';
  if (opName) {
    el.value = opName;
  }
}

function renderOpenSessions(sessions) {
  if (!sessions || sessions.length === 0) return;
  var card  = document.getElementById('openSessionsCard');
  var list  = document.getElementById('openSessionsList');
  var empty = document.getElementById('sessionsEmpty');
  empty.style.display = 'none';
  card.style.display = '';

  sessions.forEach(function(s) {
    var item = document.createElement('div');
    item.className = 'session-item';
    item.innerHTML =
      '<div class="si-top">' +
        '<div class="si-name">' + escHtml(s.productName || s.productCode) + '</div>' +
        '<span class="si-badge">' + (s.rounds || 0) + ' round' + ((s.rounds || 0) !== 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<div class="si-meta">Batch: ' + escHtml(s.batch || '—') + ' · ' + escHtml(s.inspector || '—') + ' · ' + escHtml(s.dateStarted || '—') + '</div>';
    item.onclick = (function(sess) { return function() { resumeSession(sess); }; })(s);
    list.appendChild(item);
  });
}

// ── Screen A → B ───────────────────────────────────────────────────
function goToSetup() {
  showScreen('B');
}

// ── Screen B: Start check ──────────────────────────────────────────
function startCheck() {
  var sel = document.getElementById('setupProduct');
  var productCode = sel.value;
  var productName = sel.options[sel.selectedIndex]
    ? (sel.options[sel.selectedIndex].getAttribute('data-name') || productCode) : productCode;
  var batch    = document.getElementById('setupBatch').value.trim();
  var inspector = document.getElementById('setupInspector').value.trim();

  if (!productCode) { showToast('Select a product.', 'error'); return; }
  if (!batch)       { showToast('Enter batch number.', 'error'); return; }
  if (!inspector)   { showToast('Enter inspector name.', 'error'); return; }

  var btn = document.getElementById('btnStartCheck');
  btn.disabled = true; btn.textContent = 'Starting…';

  showLoading('Starting session…');
  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = 'START INSPECTION →';
      if (!res.ok) {
        hideLoading();
        showToast(res.error || 'Could not start session.', 'error');
        return;
      }
      SESSION_ID        = res.sessionId;
      SESSION_CODE      = productCode;
      SESSION_NAME      = productName;
      SESSION_BATCH     = batch;
      SESSION_INSPECTOR = inspector;
      ROUND_NO          = res.resumed ? ((res.rounds || 0) + 1) : 1;
      SESSION_START_TS  = new Date();
      loadParamsAndEnterCheck();
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = 'START INSPECTION →';
      hideLoading();
      showToast('Error: ' + e.message, 'error');
    })
    .startSession({
      productCode: productCode,
      productName: productName,
      batch:       batch,
      inspector:   inspector,
      line:        productCode
    });
}

function resumeSession(sess) {
  SESSION_ID        = sess.sessionId;
  SESSION_CODE      = sess.productCode;
  SESSION_NAME      = sess.productName || sess.productCode;
  SESSION_BATCH     = sess.batch || '';
  SESSION_INSPECTOR = sess.inspector || '';
  ROUND_NO          = (sess.rounds || 0) + 1;
  SESSION_START_TS  = sess.startTs ? new Date(sess.startTs) : new Date();
  showToast('Resuming — Round ' + ROUND_NO, 'success');
  loadParamsAndEnterCheck();
}

function loadParamsAndEnterCheck() {
  google.script.run
    .withSuccessHandler(function(pr) {
      hideLoading();
      PARAMS = pr.params || [];
      if (pr.warning || PARAMS.length === 0) {
        document.getElementById('noCpBanner').style.display = '';
      } else {
        document.getElementById('noCpBanner').style.display = 'none';
      }
      buildMatrix();
      enterCheckScreen();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Params error: ' + e.message, 'error');
      PARAMS = [];
      buildMatrix();
      enterCheckScreen();
    })
    .getIPQCParams(SESSION_CODE);
}

function enterCheckScreen() {
  var title = truncate(SESSION_NAME, 22) + ' · ' + SESSION_BATCH;
  document.getElementById('checkSubTitle').textContent = title;
  document.getElementById('roundPill').textContent = 'Round ' + ROUND_NO;
  document.getElementById('headerTitle').textContent = 'IPQC — Round ' + ROUND_NO;
  showScreen('C');
  startTimer();
}

// ── Matrix builder ─────────────────────────────────────────────────
function buildMatrix() {
  var body = document.getElementById('paramsBody');
  body.innerHTML = '';

  if (PARAMS.length === 0) {
    document.getElementById('paramsSectionTitle').textContent = 'Quality Parameters';
    return;
  }

  PARAMS.forEach(function(p) {
    var isVisual = !p.methodType || p.methodType === 'Visual' || p.methodType === 'visual';
    body.appendChild(buildParamRow(p, isVisual));
  });
}

function buildParamRow(p, isVisual) {
  var div = document.createElement('div');
  div.className = 'ipqc-row';
  div.id = 'row_' + p.paramCode;

  /* Top row: label + controls + badge */
  var top = document.createElement('div');
  top.className = 'ipqc-row-top';

  var labelWrap = document.createElement('div');
  labelWrap.className = 'ipqc-row-label-wrap';

  var labelEl = document.createElement('div');
  labelEl.className = 'ipqc-row-label';
  labelEl.textContent = p.paramName || p.paramCode;

  var stdEl = document.createElement('div');
  stdEl.className = 'ipqc-row-std';
  if (p.stdValue !== null && p.stdValue !== undefined && p.stdValue !== '') {
    var txt = 'Std: ' + p.stdValue;
    if (p.unit) txt += ' ' + p.unit;
    if (p.tolMin !== null && p.tolMin !== '' && p.tolMax !== null && p.tolMax !== '') {
      txt += ' (' + p.tolMin + '–' + p.tolMax + ')';
    }
    stdEl.textContent = txt;
  } else if (p.checkBrief) {
    stdEl.textContent = p.checkBrief;
  } else {
    stdEl.textContent = 'Visual check';
  }

  labelWrap.appendChild(labelEl);
  labelWrap.appendChild(stdEl);
  top.appendChild(labelWrap);

  var badge = document.createElement('span');
  badge.id = 'badge_' + p.paramCode;
  badge.className = 'res-badge res-na';
  badge.textContent = 'NA';

  if (isVisual) {
    var btns = document.createElement('div');
    btns.className = 'vis-btns';
    [['PASS','sel-pass','P'], ['FAIL','sel-fail','F'], ['NA','sel-na','NA']].forEach(function(opt) {
      var btn = document.createElement('button');
      btn.className = 'vis-btn';
      btn.id = 'vb_' + p.paramCode + '_' + opt[0];
      btn.textContent = opt[2];
      btn.onclick = (function(code, val, selCls) {
        return function() { setVisual(code, val, selCls); };
      })(p.paramCode, opt[0], opt[1]);
      btns.appendChild(btn);
    });
    top.appendChild(btns);
  } else {
    var inp = document.createElement('input');
    inp.type = 'number';
    inp.id = 'val_' + p.paramCode;
    inp.className = 'ipqc-input';
    inp.placeholder = '—';
    inp.step = '0.01';
    inp.oninput = (function(code, tolMin, tolMax) {
      return function() { updateMeasurement(code, tolMin, tolMax); };
    })(p.paramCode, p.tolMin, p.tolMax);
    top.appendChild(inp);
  }

  top.appendChild(badge);
  div.appendChild(top);

  /* Remark row (shown on FAIL) */
  var remWrap = document.createElement('div');
  remWrap.className = 'ipqc-remark-wrap';
  remWrap.id = 'remwrap_' + p.paramCode;

  var remTa = document.createElement('textarea');
  remTa.id = 'remark_' + p.paramCode;
  remTa.className = 'ipqc-remark';
  remTa.placeholder = 'Describe the issue…';
  remTa.rows = 2;

  var remReq = document.createElement('div');
  remReq.id = 'remreq_' + p.paramCode;
  remReq.className = 'remark-req';
  remReq.textContent = 'Remark required for FAIL.';

  remWrap.appendChild(remTa);
  remWrap.appendChild(remReq);
  div.appendChild(remWrap);

  return div;
}

function setVisual(code, val, selCls) {
  ['PASS','FAIL','NA'].forEach(function(v) {
    var b = document.getElementById('vb_' + code + '_' + v);
    if (b) b.className = 'vis-btn';
  });
  var btn = document.getElementById('vb_' + code + '_' + val);
  if (btn) btn.className = 'vis-btn ' + selCls;

  var badge = document.getElementById('badge_' + code);
  badge.className = 'res-badge res-' + val.toLowerCase();
  badge.textContent = val;

  var remWrap = document.getElementById('remwrap_' + code);
  if (remWrap) remWrap.style.display = val === 'FAIL' ? 'block' : 'none';

  clearRemReq(code);
}

function updateMeasurement(code, tolMin, tolMax) {
  var inp   = document.getElementById('val_' + code);
  var badge = document.getElementById('badge_' + code);
  var remWrap = document.getElementById('remwrap_' + code);
  var raw   = inp.value.trim();

  if (raw === '') {
    badge.className = 'res-badge res-na'; badge.textContent = 'NA';
    if (remWrap) remWrap.style.display = 'none';
    return;
  }

  var v = parseFloat(raw);
  var result = 'PASS';
  if (tolMin !== null && tolMin !== '' && tolMin !== undefined && v < parseFloat(tolMin)) result = 'FAIL';
  if (tolMax !== null && tolMax !== '' && tolMax !== undefined && v > parseFloat(tolMax)) result = 'FAIL';

  badge.className = 'res-badge res-' + result.toLowerCase();
  badge.textContent = result;
  if (remWrap) remWrap.style.display = result === 'FAIL' ? 'block' : 'none';
  clearRemReq(code);
}

function clearRemReq(code) {
  var r = document.getElementById('remreq_' + code);
  var t = document.getElementById('remark_' + code);
  if (r) r.className = 'remark-req';
  if (t) t.style.borderColor = '';
}

function getBadgeResult(code) {
  var badge = document.getElementById('badge_' + code);
  if (!badge) return 'NA';
  var cls = badge.className;
  if (cls.indexOf('res-pass') !== -1) return 'PASS';
  if (cls.indexOf('res-fail') !== -1) return 'FAIL';
  return 'NA';
}

// ── Save Round ─────────────────────────────────────────────────────
function saveRound() {
  var valid = true;
  var params = [];

  PARAMS.forEach(function(p) {
    var isVisual = !p.methodType || p.methodType === 'Visual' || p.methodType === 'visual';
    var result = getBadgeResult(p.paramCode);
    var actual = '';
    if (!isVisual) {
      var inp = document.getElementById('val_' + p.paramCode);
      actual = inp ? inp.value.trim() : '';
    }
    var remTa = document.getElementById('remark_' + p.paramCode);
    var remark = remTa ? remTa.value.trim() : '';

    if (result === 'FAIL' && !remark) {
      valid = false;
      if (remTa) remTa.style.borderColor = 'var(--danger)';
      var remReq = document.getElementById('remreq_' + p.paramCode);
      if (remReq) remReq.className = 'remark-req show';
      var remWrap = document.getElementById('remwrap_' + p.paramCode);
      if (remWrap) remWrap.style.display = 'block';
    }

    params.push({
      paramCode:   p.paramCode,
      paramName:   p.paramName,
      stdValue:    p.stdValue !== null && p.stdValue !== undefined ? String(p.stdValue) : '',
      unit:        p.unit || '',
      actualValue: actual,
      result:      result,
      remark:      remark
    });
  });

  if (!valid) { showToast('Add remarks for all failed checks.', 'error'); return; }

  var btn = document.getElementById('btnSaveRound');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.innerHTML = '💾 Save Round';
      if (!res.ok) { showToast(res.error || 'Save failed.', 'error'); return; }
      var saved = ROUND_NO;
      ROUND_NO++;
      document.getElementById('roundPill').textContent = 'Round ' + ROUND_NO;
      document.getElementById('headerTitle').textContent = 'IPQC — Round ' + ROUND_NO;
      resetMatrix();
      showToast('Round ' + saved + ' saved.', 'success');
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.innerHTML = '💾 Save Round';
      showToast('Error: ' + e.message, 'error');
    })
    .saveRound(SESSION_ID, {
      productCode: SESSION_CODE,
      batch:       SESSION_BATCH,
      inspector:   SESSION_INSPECTOR,
      roundNo:     ROUND_NO,
      params:      params,
      elapsedHms:  getElapsed(),
      periodStartTime: '',
      periodEndTime:   '',
      avgWeight: ''
    });
}

function resetMatrix() {
  PARAMS.forEach(function(p) {
    var isVisual = !p.methodType || p.methodType === 'Visual' || p.methodType === 'visual';
    var badge = document.getElementById('badge_' + p.paramCode);
    if (badge) { badge.className = 'res-badge res-na'; badge.textContent = 'NA'; }

    if (isVisual) {
      ['PASS','FAIL','NA'].forEach(function(v) {
        var b = document.getElementById('vb_' + p.paramCode + '_' + v);
        if (b) b.className = 'vis-btn';
      });
    } else {
      var inp = document.getElementById('val_' + p.paramCode);
      if (inp) inp.value = '';
    }

    var remWrap = document.getElementById('remwrap_' + p.paramCode);
    if (remWrap) remWrap.style.display = 'none';
    var remTa = document.getElementById('remark_' + p.paramCode);
    if (remTa) { remTa.value = ''; remTa.style.borderColor = ''; }
    var remReq = document.getElementById('remreq_' + p.paramCode);
    if (remReq) remReq.className = 'remark-req';
  });
}

// ── Close Session ──────────────────────────────────────────────────
function confirmCloseSession() {
  if (!confirm('Close this IPQC session?')) return;
  showLoading('Closing session…');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      stopTimer();
      showToast('Session closed.', 'success');
      SESSION_ID = null;
      setTimeout(navigateHome, 1200);
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Error: ' + e.message, 'error');
    })
    .closeSession(SESSION_ID);
}

function navigateHome() {
  google.script.run
    .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
    .withFailureHandler(function() { showScreen('A'); })
    .getFormHtml('Landing');
}

// ── Report overlay ─────────────────────────────────────────────────
function viewReport() {
  showLoading('Loading report…');
  google.script.run
    .withSuccessHandler(function(d) {
      hideLoading();
      buildReport(d.rounds || []);
      document.getElementById('screenD').style.display = 'flex';
    })
    .withFailureHandler(function(e) {
      hideLoading();
      showToast('Report error: ' + e.message, 'error');
    })
    .getSessionRounds(SESSION_ID);
}

function closeReport() {
  document.getElementById('screenD').style.display = 'none';
}

function buildReport(rounds) {
  document.getElementById('reportTitle').textContent =
    'IPQC — ' + truncate(SESSION_NAME, 20) + ' · ' + SESSION_BATCH;

  var table = document.getElementById('reportTable');
  table.innerHTML = '';
  if (!rounds.length) {
    table.innerHTML = '<tr><td style="padding:20px;color:var(--muted);text-align:center;">No rounds saved yet.</td></tr>';
    return;
  }

  var paramOrder = [], nameMap = {};
  if (rounds[0] && rounds[0].params) {
    rounds[0].params.forEach(function(p) { paramOrder.push(p.paramCode); nameMap[p.paramCode] = p.paramName; });
  }
  var roundData = rounds.map(function(rnd) {
    var map = {};
    (rnd.params || []).forEach(function(p) {
      map[p.paramCode] = { actualValue: p.actualValue, result: p.result };
      if (!nameMap[p.paramCode]) nameMap[p.paramCode] = p.paramName;
      if (paramOrder.indexOf(p.paramCode) === -1) paramOrder.push(p.paramCode);
    });
    return map;
  });

  /* Header */
  var thead = document.createElement('thead');
  var hRow = document.createElement('tr');
  var thP = document.createElement('th');
  thP.className = 'rt-param-hdr'; thP.textContent = 'Parameter';
  hRow.appendChild(thP);
  rounds.forEach(function(rnd, i) {
    var th = document.createElement('th');
    th.textContent = 'Rnd ' + (rnd.roundNo || (i + 1));
    hRow.appendChild(th);
  });
  thead.appendChild(hRow);
  table.appendChild(thead);

  /* Body */
  var tbody = document.createElement('tbody');
  paramOrder.forEach(function(code) {
    var tr = document.createElement('tr');
    var tdL = document.createElement('td');
    tdL.className = 'rt-param-cell'; tdL.textContent = nameMap[code] || code;
    tr.appendChild(tdL);
    roundData.forEach(function(rMap) {
      var td = document.createElement('td');
      var entry = rMap[code];
      var res = entry ? (entry.result || 'NA') : 'NA';
      var badge = document.createElement('span');
      badge.className = 'res-badge res-' + res.toLowerCase();
      badge.textContent = res;
      td.appendChild(badge);
      if (entry && entry.actualValue !== '' && entry.actualValue !== null && entry.actualValue !== undefined) {
        var vs = document.createElement('span');
        vs.className = 'rt-cell-val'; vs.textContent = entry.actualValue;
        td.appendChild(vs);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  /* Summary row */
  var sumTr = document.createElement('tr');
  sumTr.className = 'summary-row';
  var sumL = document.createElement('td');
  sumL.className = 'rt-param-cell'; sumL.textContent = 'Summary';
  sumTr.appendChild(sumL);
  roundData.forEach(function(rMap) {
    var p = 0, f = 0, na = 0;
    paramOrder.forEach(function(code) { var r = (rMap[code] || {}).result || 'NA'; if (r === 'PASS') p++; else if (r === 'FAIL') f++; else na++; });
    var td = document.createElement('td');
    td.innerHTML = '<span style="color:var(--success);font-weight:700;">P:' + p + '</span> ' +
      (f ? '<span style="color:var(--danger);font-weight:700;">F:' + f + '</span>' : '');
    sumTr.appendChild(td);
  });
  tbody.appendChild(sumTr);
  table.appendChild(tbody);
}

// ── Navigation ─────────────────────────────────────────────────────
function showScreen(name) {
  ['A','B','C'].forEach(function(n) {
    var el = document.getElementById('screen' + n);
    if (el) el.style.display = (n === name) ? 'block' : 'none';
  });
  var back  = document.getElementById('headerBackBtn');
  var badge = document.getElementById('headerBadge');
  if (name === 'A') {
    back.style.display = 'none';
    badge.style.display = '';
    document.getElementById('headerTitle').textContent = 'IPQC';
    stopTimer();
  } else if (name === 'B') {
    back.style.display = 'flex';
    badge.style.display = '';
    document.getElementById('headerTitle').textContent = 'New Check';
  } else if (name === 'C') {
    back.style.display = 'none';
    badge.style.display = 'none';
  }
  window.scrollTo(0, 0);
}

function handleBack() {
  var vis = ['C','B','A'].find(function(n) {
    var el = document.getElementById('screen' + n);
    return el && el.style.display !== 'none';
  });
  if (vis === 'B') showScreen('A');
}

// ── Timer ──────────────────────────────────────────────────────────
function startTimer() {
  stopTimer();
  timerInterval = setInterval(function() {
    document.getElementById('timerDisplay').textContent = getElapsed();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function getElapsed() {
  if (!SESSION_START_TS) return '00:00';
  var s = Math.floor((new Date() - SESSION_START_TS) / 1000);
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  return (h > 0 ? pad2(h) + ':' : '') + pad2(m) + ':' + pad2(sec);
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

// ── Utilities ──────────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('loadingMsg').textContent = msg || 'Loading…';
  document.getElementById('loading').classList.remove('hidden');
}
function hideLoading() { document.getElementById('loading').classList.add('hidden'); }
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}
function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.substring(0, max) + '…' : str;
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
