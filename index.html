<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack Masters QMS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0D1B6E;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; font-family: system-ui, sans-serif;
    }
    .sp-logo  { font-size: 48px; }
    .sp-title { color: #fff; font-size: 20px; font-weight: 700; }
    .sp-sub   { color: rgba(255,255,255,0.55); font-size: 13px; }
    .sp-spin  {
      width: 36px; height: 36px; margin-top: 4px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #0070F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    var base = "https://script.google.com/macros/s/AKfycbxMFpeJOqF5_iARRCo7aHLg0Pw_XlqKdAzmDVck8DUdDfgr1nIIjbvTgrlyc0XtYRuaVQ/exec";
    var q = window.location.search;
    window.location.replace(base + (q || ''));
  </script>
</head>
<body>
  <div class="sp-logo">📦</div>
  <div class="sp-title">Pack Masters QMS</div>
  <div class="sp-sub">Redirecting…</div>
  <div class="sp-spin"></div>
</body>
</html>
