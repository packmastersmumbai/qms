<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pack Masters QMS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #0D1B6E; }
    #loader {
      position: fixed; inset: 0; background: #0D1B6E;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; font-family: system-ui, sans-serif; z-index: 10;
      transition: opacity 0.3s;
    }
    .sp-logo  { font-size: 48px; }
    .sp-title { color: #fff; font-size: 20px; font-weight: 700; }
    .sp-sub   { color: rgba(255,255,255,0.55); font-size: 13px; }
    .sp-spin  {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #0070F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #app {
      position: fixed; inset: 0;
      width: 100%; height: 100%; border: none;
      opacity: 0; transition: opacity 0.3s;
    }
    #app.ready { opacity: 1; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="sp-logo">📦</div>
    <div class="sp-title">Pack Masters QMS</div>
    <div class="sp-sub">Loading…</div>
    <div class="sp-spin"></div>
  </div>
  <iframe
    id="app"
    src=""
    allow="accelerometer; camera; encrypted-media; geolocation; gyroscope; microphone"
    allowfullscreen
  ></iframe>
  <script>
    var base = "https://script.google.com/macros/s/AKfycbxMFpeJOqF5_iARRCo7aHLg0Pw_XlqKdAzmDVck8DUdDfgr1nIIjbvTgrlyc0XtYRuaVQ/exec";
    document.getElementById('app').src = base + (window.location.search || '');
    var app = document.getElementById('app');
    var loader = document.getElementById('loader');
    app.addEventListener('load', function() {
      app.classList.add('ready');
      loader.style.opacity = '0';
      setTimeout(function(){ loader.style.display = 'none'; }, 300);
    });
    // Fallback: hide loader after 12s if iframe load event doesn't fire
    setTimeout(function() {
      app.classList.add('ready');
      loader.style.display = 'none';
    }, 12000);
  </script>
</body>
</html>
