  <style>

      --navy-hover:    #1A2D9E;
      --navy-active:   #0A1450;

      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;

      font-size: 12px;

      white-space: nowrap;
    }
    .product-bar select {
      flex: 1;
      min-width: 160px;
      max-width: 320px;
      font-size: 13px;
      border: 1.5px solid var(--border);

      padding: 8px 10px;
      font-family: inherit;

      font-weight: 600;

    }
    .btn-save-plan:hover  { background: var(--navy-hover); }
    .btn-save-plan:active { transform: scale(0.97); }
    .btn-save-plan:disabled { background: var(--disabled-bg); cursor: not-allowed; }

    .step-section {
      margin: 10px 12px 0;
    }
    .step-section:last-child { margin-bottom: 10px; }

    .step-header {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--navy);
      color: var(--white);
      padding: 7px 12px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;

    .step-header .step-count {
      margin-left: auto;
      background: rgba(255,255,255,0.2);
      color: var(--white);
      font-size: 10px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 10px;
    }
    .step-chevron {
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .step-section.collapsed .step-chevron { transform: rotate(-90deg); }

    .step-body {
      background: var(--white);
      border-radius: 0 0 8px 8px;
      box-shadow: var(--shadow-1);
      overflow: hidden;
    }
    .step-section.collapsed .step-body { display: none; }

    .matrix-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }
    .matrix-table thead th {
      background: var(--navy-light);
      color: var(--navy);
      font-size: 10px;
      font-weight: 700;
      padding: 6px 10px;
      text-align: left;
      letter-spacing: 0.4px;
      white-space: nowrap;
      border-bottom: 2px solid var(--border);
    }
    .matrix-table thead th:nth-child(2),
    .matrix-table tbody td:nth-child(2) {
      position: sticky;
      left: 0;
      z-index: 2;
      min-width: 130px;
      max-width: 180px;
    }
    .matrix-table thead th:nth-child(2) {
      background: var(--navy-light);
      z-index: 3;
    }
    .matrix-table tbody td:nth-child(2) {
      background: var(--white);
      font-weight: 600;
      box-shadow: 2px 0 4px rgba(0,0,0,0.05);
    }
    .matrix-table tbody tr.enabled-row td:nth-child(2) {
      background: var(--enabled-row);
    }
    .matrix-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .matrix-table tbody tr:last-child { border-bottom: none; }
    .matrix-table tbody tr.enabled-row { background: var(--enabled-row); }
    .matrix-table tbody td {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text);
      vertical-align: middle;
    }

    .param-toggle {
      padding: 3px 10px;
      border-radius: 12px;
      border: none;

      transition: all 0.15s ease;
    }
    .param-toggle.on  { background: var(--success); color: var(--white); }
    .param-toggle.off { background: var(--border);  color: var(--muted); }
    .param-toggle:active { transform: scale(0.97); }

    .override-input {
      width: 72px;
      padding: 5px 8px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      background: var(--white);
      color: var(--text);
    }
    .override-input:focus   { border-color: var(--navy); outline: none; }
    .override-input:disabled { background: var(--bg); color: var(--disabled-bg); }

    .param-cards { display: none; }
    .param-card {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .param-card:last-child { border-bottom: none; }
    .param-card-row {
      display: flex;
      align-items: flex-start;

      margin-bottom: 6px;
    }
    .param-card-name {
      flex: 1;

    .param-card-overrides {
      display: grid;

    .param-card-overrides .ov-group label {
      display: block;

      margin-bottom: 2px;
    }

    @media (max-width: 540px) {
      .matrix-scroll { display: none; }
      .param-cards   { display: block; }
      .product-bar   { top: 106px; }

    .skel-cell {
      height: 12px;

      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }

    .changes-notice {
      display: none;

      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-2);
      z-index: 200;
      white-space: nowrap;

    .changes-notice.show { display: block; }
  </style>

<body>

<div class="pm-header">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4l-6 6 6 6"/>
    </svg>
  </button>
  <span class="page-title">Control Plans</span>
  <span class="doc-badge">QMS-CP</span>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-rm">RM Control Plan</button>
  <button class="tab-btn" id="tab-fg">FG Control Plan</button>
</div>

<div class="tab-panel active" id="panel-rm">
  <div class="product-bar">
    <label>RM Item:</label>
    <select id="rm-product-select">
      <option value="">— Select Item —</option>
    </select>
    <button class="btn-save-plan" id="rm-save-btn" disabled>Save Plan</button>
  </div>
  <div id="rm-content">
    <div class="empty-state"><span class="icon">📋</span>Select an item above to view or edit its control plan.</div>
  </div>
</div>

<div class="tab-panel" id="panel-fg">
  <div class="product-bar">
    <label>FG:</label>
    <select id="fg-product-select">
      <option value="">— Select FG —</option>
    </select>
    <button class="btn-save-plan" id="fg-save-btn" disabled>Save Plan</button>
  </div>
  <div id="fg-content">
    <div class="empty-state"><span class="icon">📋</span>Select a finished good above to view or edit its control plan.</div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div class="changes-notice" id="rm-changes-notice">Unsaved changes — tap Save Plan</div>
<div class="changes-notice" id="fg-changes-notice">Unsaved changes — tap Save Plan</div>

<script>
  var allParameters = [];
  var allRM         = [];
  var allFG         = [];
  var rmPlanData    = {};
  var fgPlanData    = {};
  var activePlan    = 'rm';

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('backBtn').addEventListener('click', goHome);

    document.getElementById('tab-rm').addEventListener('click', function() { switchPlan('rm'); });
    document.getElementById('tab-fg').addEventListener('click', function() { switchPlan('fg'); });

    document.getElementById('rm-product-select').addEventListener('change', function() { loadPlan('rm'); });
    document.getElementById('fg-product-select').addEventListener('change', function() { loadPlan('fg'); });

    document.getElementById('rm-save-btn').addEventListener('click', function() { savePlan('rm'); });
    document.getElementById('fg-save-btn').addEventListener('click', function() { savePlan('fg'); });

    google.script.run
      .withSuccessHandler(function(data) {
        allParameters = data.parameters || [];
        allRM         = data.materials  || [];
        allFG         = data.fg         || [];
        populateSelect('rm-product-select', allRM, 'code', 'desc');
        populateSelect('fg-product-select', allFG, 'code', 'name');
      })
      .withFailureHandler(function(err) {
        showToast('Failed to load data: ' + (err.message || err), 'error');
      })
      .getMastersData();
  });

  function populateSelect(selectId, items, valField, labelField) {
    var sel = document.getElementById(selectId);
    items.forEach(function(item) {
      var opt = document.createElement('option');
      opt.value = item[valField];
      var label = item[labelField] || item['name'] || item['desc'] || item[valField];
      opt.textContent = item[valField] + ' — ' + label;
      sel.appendChild(opt);
    });
  }

  function switchPlan(plan) {
    activePlan = plan;
    ['rm', 'fg'].forEach(function(p) {
      document.getElementById('tab-' + p).classList.toggle('active', p === plan);
      document.getElementById('panel-' + p).classList.toggle('active', p === plan);
    });
  }

  function loadPlan(planType) {
    var itemCode  = document.getElementById(planType + '-product-select').value;
    var contentEl = document.getElementById(planType + '-content');

    if (!itemCode) {
      contentEl.innerHTML = '<div class="empty-state"><span class="icon">📋</span>Select an item above to view or edit its control plan.</div>';
      document.getElementById(planType + '-save-btn').disabled = true;
      hideNotice(planType);
      return;
    }

    contentEl.innerHTML = renderSkeletonSections();

    google.script.run
      .withSuccessHandler(function(rows) {
        var planData = {};
        rows.forEach(function(r) { planData[r.paramCode] = r; });
        if (planType === 'rm') rmPlanData = planData;
        else fgPlanData = planData;
        renderGroupedPlan(planType, itemCode);
        document.getElementById(planType + '-save-btn').disabled = false;
        hideNotice(planType);
      })
      .withFailureHandler(function(err) {
        showToast('Load failed: ' + (err.message || err), 'error');
      })
      .getControlPlan(planType, itemCode);
  }

  function groupByStep(params) {
    var groups = {};
    var order  = [];
    params.forEach(function(p) {
      var step = (p.methodType || 'General').trim();
      if (!groups[step]) { groups[step] = []; order.push(step); }
      groups[step].push(p);
    });
    return { groups: groups, order: order };
  }

  function renderGroupedPlan(planType, itemCode) {
    var planData  = planType === 'rm' ? rmPlanData : fgPlanData;
    var contentEl = document.getElementById(planType + '-content');

    if (!allParameters.length) {
      contentEl.innerHTML = '<div class="empty-state"><span class="icon">⚙️</span>No parameters defined yet. Add them in Masters → Parameters.</div>';
      return;
    }

    var grouped    = groupByStep(allParameters);
    var html       = '';
    var globalIdx  = 0;

    grouped.order.forEach(function(step) {
      var params       = grouped.groups[step];
      var enabledCount = params.filter(function(p) { return (planData[p.code] || {}).enabled; }).length;

      html += '<div class="step-section" id="step-' + planType + '-' + esc(step) + '">';
      html += '<div class="step-header">';
      html += '<svg class="step-chevron" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>';
      html += esc(step);
      if (enabledCount > 0) {
        html += '<span class="step-count">' + enabledCount + ' active</span>';
      }
      html += '</div>';
      html += '<div class="step-body">';

      html += '<div class="matrix-scroll">';
      html += '<table class="matrix-table">';
      html += '<thead><tr>' +
        '<th style="width:42px;"></th>' +
        '<th>Parameter</th>' +
        '<th>Unit</th>' +
        '<th>Std Value</th>' +
        '<th>Override Std</th>' +
        '<th>Min</th>' +
        '<th>Override Min</th>' +
        '<th>Max</th>' +
        '<th>Override Max</th>' +
        '<th>Tools</th>' +
        '<th>Check Brief</th>' +
        '</tr></thead>';
      html += '<tbody>';

      var cardsHtml = '<div class="param-cards">';

      params.forEach(function(p) {
        var existing = planData[p.code] || {};
        var enabled  = existing.enabled || false;
        var stdOvr   = existing.stdValueOverride || '';
        var minOvr   = existing.tolMinOverride   || '';
        var maxOvr   = existing.tolMaxOverride   || '';
        var rowClass = enabled ? 'enabled-row' : '';
        var dis      = enabled ? '' : 'disabled';
        var rowId    = planType + '-row-' + globalIdx;
        var btnCls   = enabled ? 'on' : 'off';
        var btnTxt   = enabled ? 'ON' : 'OFF';

        html += '<tr class="' + rowClass + '" id="' + rowId + '" data-code="' + esc(p.code) + '" data-enabled="' + (enabled ? '1' : '0') + '" data-plantype="' + planType + '">' +
          '<td style="text-align:center;">' +
            '<button class="param-toggle ' + btnCls + '" data-plantype="' + planType + '">' + btnTxt + '</button>' +
          '</td>' +
          '<td>' + esc(p.name) + ' <span style="font-size:10px;color:var(--muted);font-family:monospace;">' + esc(p.code) + '</span></td>' +
          '<td style="color:var(--muted);">' + esc(p.unit || '') + '</td>' +
          '<td style="color:var(--muted);">' + esc(p.stdValue || '') + '</td>' +
          '<td><input class="override-input ov-std" type="text" ' + dis + ' value="' + esc(stdOvr) + '" placeholder="—"></td>' +
          '<td style="color:var(--muted);">' + esc(p.tolMin || '') + '</td>' +
          '<td><input class="override-input ov-min" type="text" ' + dis + ' value="' + esc(minOvr) + '" placeholder="—"></td>' +
          '<td style="color:var(--muted);">' + esc(p.tolMax || '') + '</td>' +
          '<td><input class="override-input ov-max" type="text" ' + dis + ' value="' + esc(maxOvr) + '" placeholder="—"></td>' +
          '<td style="font-size:11px;color:var(--muted);">' + esc(p.tools || '') + '</td>' +
          '<td style="font-size:11px;color:var(--muted);max-width:160px;">' + esc(p.checkBrief || '') + '</td>' +
          '</tr>';

        cardsHtml += '<div class="param-card" id="card-' + rowId + '" data-code="' + esc(p.code) + '" data-enabled="' + (enabled ? '1' : '0') + '">' +
          '<div class="param-card-row">' +
            '<div class="param-card-name">' + esc(p.name) + ' <span style="font-size:10px;color:var(--muted);font-family:monospace;">' + esc(p.code) + '</span></div>' +
            '<button class="param-toggle ' + btnCls + '" data-rowid="' + rowId + '" data-plantype="' + planType + '">' + btnTxt + '</button>' +
          '</div>' +
          '<div class="param-card-meta">' +
            (p.unit     ? '<span>Unit: '  + esc(p.unit)     + '</span>' : '') +
            (p.stdValue ? '<span>Std: '   + esc(p.stdValue) + '</span>' : '') +
            (p.tolMin   ? '<span>Min: '   + esc(p.tolMin)   + '</span>' : '') +
            (p.tolMax   ? '<span>Max: '   + esc(p.tolMax)   + '</span>' : '') +
            (p.tools    ? '<span>Tools: ' + esc(p.tools)    + '</span>' : '') +
          '</div>' +
          '<div class="param-card-overrides">' +
            '<div class="ov-group"><label>Ovr Std</label><input class="override-input ov-std" type="text" ' + dis + ' value="' + esc(stdOvr) + '" placeholder="—"></div>' +
            '<div class="ov-group"><label>Ovr Min</label><input class="override-input ov-min" type="text" ' + dis + ' value="' + esc(minOvr) + '" placeholder="—"></div>' +
            '<div class="ov-group"><label>Ovr Max</label><input class="override-input ov-max" type="text" ' + dis + ' value="' + esc(maxOvr) + '" placeholder="—"></div>' +
          '</div>' +
        '</div>';

        globalIdx++;
      });

      cardsHtml += '</div>';
      html += '</tbody></table></div>';
      html += cardsHtml;
      html += '</div></div>';
    });

    contentEl.innerHTML = html;
    attachContentListeners(planType);
    attachToggleListeners(planType);
  }

  function attachContentListeners(planType) {
    var contentEl = document.getElementById(planType + '-content');
    if (!contentEl) return;

    contentEl.addEventListener('click', function(e) {
      var header = e.target.closest('.step-header');
      if (header) {
        toggleSection(header.parentNode);
      }
    });

    contentEl.addEventListener('input', function(e) {
      if (e.target.classList.contains('override-input')) {
        markChanged(planType);
      }
    });
  }

  function toggleSection(sectionEl) {
    sectionEl.classList.toggle('collapsed');
  }

  function attachToggleListeners(planType) {
    var contentEl = document.getElementById(planType + '-content');
    if (!contentEl) return;
    var buttons = contentEl.querySelectorAll('.param-toggle');
    for (var i = 0; i < buttons.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          var rowId = btn.getAttribute('data-rowid');
          var row, card;
          if (rowId) {
            row  = document.getElementById(rowId);
            card = document.getElementById('card-' + rowId);
          } else {
            row  = btn.parentNode.parentNode;
            var code = row.getAttribute('data-code');
            card = contentEl.querySelector('[id^="card-"][data-code="' + code + '"]');
          }

          var target = row || card;
          if (!target) return;
          var nowOn = target.getAttribute('data-enabled') !== '1';

          if (row) {
            row.setAttribute('data-enabled', nowOn ? '1' : '0');
            row.classList.toggle('enabled-row', nowOn);
            var rowBtn = row.querySelector('.param-toggle');
            if (rowBtn) {
              rowBtn.textContent = nowOn ? 'ON' : 'OFF';
              rowBtn.className   = 'param-toggle ' + (nowOn ? 'on' : 'off');
            }
            row.querySelectorAll('.override-input').forEach(function(inp) { inp.disabled = !nowOn; });
          }
          if (card) {
            card.setAttribute('data-enabled', nowOn ? '1' : '0');
            var cardBtn = card.querySelector('.param-toggle');
            if (cardBtn) {
              cardBtn.textContent = nowOn ? 'ON' : 'OFF';
              cardBtn.className   = 'param-toggle ' + (nowOn ? 'on' : 'off');
            }
            card.querySelectorAll('.override-input').forEach(function(inp) { inp.disabled = !nowOn; });
          }

          markChanged(planType);
        });
      })(buttons[i]);
    }
  }

  function markChanged(planType) {
    document.getElementById(planType + '-changes-notice').classList.add('show');
  }
  function hideNotice(planType) {
    document.getElementById(planType + '-changes-notice').classList.remove('show');
  }

  function collectPlanRows(planType, itemCode) {
    var contentEl = document.getElementById(planType + '-content');
    var rows      = contentEl ? contentEl.querySelectorAll('tr[data-code]') : [];
    var result    = [];
    rows.forEach(function(row) {
      if (row.getAttribute('data-enabled') !== '1') return;
      var stdInp = row.querySelector('.ov-std');
      var minInp = row.querySelector('.ov-min');
      var maxInp = row.querySelector('.ov-max');
      result.push({
        itemCode:         itemCode,
        paramCode:        row.getAttribute('data-code'),
        enabled:          true,
        stdValueOverride: stdInp ? stdInp.value.trim() : '',
        tolMinOverride:   minInp ? minInp.value.trim() : '',
        tolMaxOverride:   maxInp ? maxInp.value.trim() : ''
      });
    });
    return result;
  }

  function savePlan(planType) {
    var itemCode = document.getElementById(planType + '-product-select').value;
    if (!itemCode) return;
    var rows = collectPlanRows(planType, itemCode);
    var btn  = document.getElementById(planType + '-save-btn');
    btn.disabled    = true;
    btn.innerHTML   = '<span class="spinner"></span>Saving…';
    google.script.run
      .withSuccessHandler(function() {
        showToast('Control Plan saved (' + rows.length + ' parameters)', 'success');
        hideNotice(planType);
        btn.disabled  = false;
        btn.textContent = 'Save Plan';
      })
      .withFailureHandler(function(err) {
        showToast('Save failed: ' + (err.message || err), 'error');
        btn.disabled  = false;
        btn.textContent = 'Save Plan';
      })
      .saveControlPlan(planType, itemCode, rows);
  }

  function renderSkeletonSections() {
    var html = '';
    for (var s = 0; s < 2; s++) {
      html += '<div class="step-section"><div class="step-header" style="opacity:0.6;">Loading parameters…</div>';
      html += '<div class="step-body"><div class="matrix-scroll"><table class="matrix-table"><tbody>';
      for (var i = 0; i < 3; i++) {
        html += '<tr>';
        for (var j = 0; j < 9; j++) {
          html += '<td><div class="skel-cell" style="width:' + (40 + Math.floor(Math.random() * 40)) + '%"></div></td>';
        }
        html += '</tr>';
      }
      html += '</tbody></table></div></div></div>';
    }
    return html;
  }

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'toast show' + (type ? ' ' + type : '');
    setTimeout(function() { t.className = 'toast'; }, 2800);
  }

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>
</body>
</html>
