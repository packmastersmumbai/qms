<script>
(function(){
'use strict';

var _materials = [];
var _docNo = '';
var _dirty = false;
var _editPoNo = null;   // null = new PO; string = editing DRAFT

/* ── Init ── */
function init() {
  var today = new Date().toISOString().slice(0,10);
  document.getElementById('poDate').value = today;
  google.script.run
    .withSuccessHandler(function(d) {
      _docNo = d.docNumber || 'PM/PO/…';
      var poDocEl = document.getElementById('poDocNo');
      if (poDocEl) poDocEl.textContent = _docNo;
      var poDateEl = document.getElementById('poDateLabel');
      if (poDateEl) {
        var n = new Date();
        poDateEl.textContent = n.toLocaleDateString('en-IN', { day:'2-digit', month:'2-digit', year:'numeric' });
      }
      document.getElementById('docBadge').textContent = 'PO ' + _docNo;
      _materials = d.materials || [];
      var suppSel = document.getElementById('supplierCode');
      (d.suppliers || []).forEach(function(s) {
        var o = document.createElement('option');
        o.value = s.code; o.textContent = s.code + ' — ' + s.name;
        suppSel.appendChild(o);
      });
      document.getElementById('gstPct').value = d.defaultGstPct || 18;
      addLine();
      addLine();
    })
    .withFailureHandler(function(e) { showToast('Init failed: ' + e.message, true); })
    .getPOFormInit();
}

/* ── Supplier change ── */
window.onSupplierChange = function() { _dirty = true; };

/* ── Line management ── */
var lineCount = 0;

window.addLine = function() {
  lineCount++;
  var idx = lineCount;
  var container = document.getElementById('linesBody');
  var card = document.createElement('div');
  card.id = 'line-' + idx;
  card.className = 'line-card bg-white rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.08)] p-4 border border-[#e2e8f0]';
  card.innerHTML =
    '<div class="flex justify-between items-center mb-3">' +
      '<p class="text-[12px] font-bold uppercase tracking-wider text-[#1e3a5f]">Line ' + idx + '</p>' +
      '<button class="text-red-500 hover:text-red-700 active:scale-95 transition-all flex items-center gap-0.5 text-[12px] font-semibold" onclick="removeLine(' + idx + ')" type="button">' +
        '<span class="material-symbols-outlined text-[16px]">delete</span> Remove' +
      '</button>' +
    '</div>' +
    '<div class="mb-3">' +
      '<label class="block text-[12px] font-semibold text-[#374151] uppercase tracking-wide mb-1">Material *</label>' +
      '<div class="relative">' +
        '<select onchange="onMatChange(' + idx + ')" class="w-full h-[48px] border-[1.5px] border-[#d1d5db] rounded-[8px] text-[14px] text-[#0f172a] bg-white px-3 pr-9 appearance-none focus:border-[#0ea5e9] outline-none transition-all">' +
          '<option value="">— select material —</option>' +
          _materials.map(function(m){ return '<option value="' + m.code + '">' + m.code + ' — ' + (m.desc || '') + '</option>'; }).join('') +
        '</select>' +
        '<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-[#64748b] pointer-events-none text-[20px]">expand_more</span>' +
      '</div>' +
    '</div>' +
    '<div class="grid grid-cols-3 gap-3 mb-3">' +
      '<div>' +
        '<label class="block text-[12px] font-semibold text-[#374151] uppercase tracking-wide mb-1">Qty *</label>' +
        '<input type="number" id="qty-' + idx + '" min="0.001" step="any" placeholder="0" onchange="recomputeTotals()"' +
          ' class="w-full h-[48px] border-[1.5px] border-[#d1d5db] rounded-[8px] text-[14px] text-[#0f172a] bg-white px-3 focus:border-[#0ea5e9] outline-none transition-all">' +
      '</div>' +
      '<div>' +
        '<label class="block text-[12px] font-semibold text-[#374151] uppercase tracking-wide mb-1">Unit</label>' +
        '<input type="text" id="unit-' + idx + '" readonly' +
          ' class="w-full h-[48px] border-[1.5px] border-[#d1d5db] rounded-[8px] text-[14px] text-[#777] bg-[#f9f9f9] px-3 outline-none">' +
      '</div>' +
      '<div>' +
        '<label class="block text-[12px] font-semibold text-[#374151] uppercase tracking-wide mb-1 truncate">Unit Price</label>' +
        '<input type="number" id="price-' + idx + '" min="0" step="any" placeholder="0.00" onchange="recomputeTotals()"' +
          ' class="w-full h-[48px] border-[1.5px] border-[#d1d5db] rounded-[8px] text-[14px] text-[#0f172a] bg-white px-3 focus:border-[#0ea5e9] outline-none transition-all">' +
      '</div>' +
    '</div>' +
    '<div class="pdate-row">' +
      '<label class="block text-[12px] font-semibold text-[#374151] uppercase tracking-wide mb-1">Promised Date</label>' +
      '<input type="date" id="pdate-' + idx + '"' +
        ' class="w-full h-[48px] border-[1.5px] border-[#d1d5db] rounded-[8px] text-[14px] text-[#0f172a] bg-white px-3 focus:border-[#0ea5e9] outline-none transition-all">' +
    '</div>' +
    '<div class="border-t border-[#e2e8f0] pt-2 mt-3 text-right">' +
      '<p class="text-[13px] text-[#64748b]">Line Amount: <span id="amt-' + idx + '" class="font-semibold text-[#0f172a]">—</span></p>' +
    '</div>';
  container.appendChild(card);
  _dirty = true;
};

window.removeLine = function(idx) {
  var card = document.getElementById('line-' + idx);
  if (card) card.remove();
  recomputeTotals();
  _dirty = true;
};

window.onMatChange = function(idx) {
  var card = document.getElementById('line-' + idx);
  if (!card) return;
  var sel = card.querySelector('select');
  if (!sel) return;
  var code = sel.value;
  var mat = _materials.filter(function(m){ return m.code === code; })[0];
  if (mat) {
    document.getElementById('unit-' + idx).value = mat.unit || '';
  } else {
    document.getElementById('unit-' + idx).value = '';
  }
  recomputeTotals();
  _dirty = true;
};

/* ── Totals ── */
function fmt(n) { return 'INR ' + Number(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function recomputeTotals() {
  var subTotal = 0;
  var container = document.getElementById('linesBody');
  var cards = container.querySelectorAll('[id^="line-"]');
  cards.forEach(function(card) {
    var id = card.id.replace('line-','');
    var qtyEl   = document.getElementById('qty-'   + id);
    var priceEl = document.getElementById('price-' + id);
    var amtEl   = document.getElementById('amt-'   + id);
    if (!qtyEl || !priceEl || !amtEl) return;
    var qty   = parseFloat(qtyEl.value)   || 0;
    var price = parseFloat(priceEl.value) || 0;
    var amt   = qty * price;
    amtEl.textContent = amt ? ('INR ' + amt.toFixed(2)) : '—';
    subTotal += amt;
  });
  var gstPct    = parseFloat(document.getElementById('gstPct').value) || 0;
  var gstAmount = subTotal * gstPct / 100;
  var grand     = subTotal + gstAmount;
  document.getElementById('dispSubTotal').textContent   = fmt(subTotal);
  document.getElementById('dispGst').textContent        = fmt(gstAmount);
  document.getElementById('dispGrandTotal').textContent = fmt(grand);
}
window.recomputeTotals = recomputeTotals;

/* ── Build payload ── */
function buildPayload() {
  var container = document.getElementById('linesBody');
  var cards  = container.querySelectorAll('[id^="line-"]');
  var lines = [];
  cards.forEach(function(card) {
    var id  = card.id.replace('line-','');
    var sel = card.querySelector('select');
    var matCode = sel ? sel.value : '';
    var qty   = parseFloat(document.getElementById('qty-'  + id).value)  || 0;
    var price = parseFloat(document.getElementById('price-'+ id).value) || 0;
    var pdate = document.getElementById('pdate-' + id).value || '';
    var mat = _materials.filter(function(m){ return m.code === matCode; })[0];
    lines.push({ materialCode: matCode, materialDesc: (mat ? (mat.desc || '') : ''),
      unit: document.getElementById('unit-' + id).value,
      qtyOrdered: qty, unitPrice: price, promisedDate: pdate });
  });
  var suppSel = document.getElementById('supplierCode');
  var suppCode = suppSel.value;
  var suppOpt  = suppSel.options[suppSel.selectedIndex];
  var suppName = suppOpt ? suppOpt.textContent.replace(/^[^—]+— /, '') : '';
  return {
    supplierCode:  suppCode,
    supplierName:  suppName,
    poDate:        document.getElementById('poDate').value,
    dueDate:       document.getElementById('dueDate').value,
    gstPct:        parseFloat(document.getElementById('gstPct').value) || 0,
    paymentTerms:  document.getElementById('paymentTerms').value,
    remarks:       document.getElementById('remarks').value,
    lines:         lines
  };
}

/* ── Save draft ── */
window.saveDraft = function() {
  setBusy(true);
  var payload = buildPayload();
  payload.submit = false;
  var runner = google.script.run
    .withSuccessHandler(function(r) {
      setBusy(false);
      if (r.success) { _dirty = false; showToast('Draft saved: ' + r.poNo); setTimeout(goHome, 1200); }
      else showToast('Error: ' + r.error, true);
    })
    .withFailureHandler(function(e) { setBusy(false); showToast(e.message, true); });
  if (_editPoNo) runner.updateDraftPO(_editPoNo, payload);
  else           runner.savePO(payload);
};

/* ── Preview ── */
window.doPreview = function() {
  setBusy(true);
  google.script.run
    .withSuccessHandler(function(r) {
      setBusy(false);
      if (!r.ok) { showToast('Validation: ' + r.errors.join('; '), true); return; }
      showPreviewModal(r.preview);
    })
    .withFailureHandler(function(e) { setBusy(false); showToast(e.message, true); })
    .previewPO(buildPayload());
};

function showPreviewModal(prev) {
  var html = '<p class="text-[11px] font-bold uppercase tracking-wider text-[#64748b] mb-1">Supplier</p>';
  html += '<p class="text-[13px] border-b border-[#f0f0f0] pb-2 mb-2">' + prev.supplier + '</p>';
  html += '<p class="text-[11px] font-bold uppercase tracking-wider text-[#64748b] mb-1">Lines (' + prev.lines.length + ')</p>';
  prev.lines.forEach(function(l) {
    html += '<p class="text-[13px] border-b border-[#f0f0f0] py-1">' + l.line_no + '. ' + l.material_code +
      ' — Qty ' + l.qty_ordered + ' × INR ' + l.unit_price.toFixed(2) +
      ' = INR ' + l.line_amount.toFixed(2) + '</p>';
  });
  html += '<p class="text-[15px] font-bold text-[#1e3a5f] mt-3">Grand Total: INR ' + prev.totals.grandTotal.toFixed(2) + '</p>';
  if (prev.warnings && prev.warnings.length) {
    html += '<div class="bg-[#FFF3E0] border-l-4 border-amber-400 p-3 rounded mt-3 text-[12px]"><b>Warnings:</b><br>' + prev.warnings.join('<br>') + '</div>';
  }
  document.getElementById('previewContent').innerHTML = html;
  document.getElementById('previewModal').classList.remove('hidden');
  document.getElementById('previewModal').classList.add('flex');
}

window.closeModal = function() {
  document.getElementById('previewModal').classList.add('hidden');
  document.getElementById('previewModal').classList.remove('flex');
};

window.confirmSubmit = function() {
  document.getElementById('btnConfirm').disabled = true;
  var payload = buildPayload();
  payload.submit = true;
  var runner = google.script.run
    .withSuccessHandler(function(r) {
      closeModal();
      if (r.success) { _dirty = false; showToast('PO submitted: ' + r.poNo); setTimeout(goHome, 1400); }
      else { showToast('Error: ' + r.error, true); document.getElementById('btnConfirm').disabled = false; }
    })
    .withFailureHandler(function(e) {
      closeModal(); showToast(e.message, true);
      document.getElementById('btnConfirm').disabled = false;
    });
  if (_editPoNo) runner.updateDraftPO(_editPoNo, payload);
  else           runner.savePO(payload);
};

/* ── DRAFT picker ── */
window.openDraftPicker = function() {
  var list = document.getElementById('draftList');
  list.innerHTML = '<div class="draft-empty">Loading…</div>';
  var modal = document.getElementById('draftPickerModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  google.script.run
    .withSuccessHandler(function(drafts) {
      if (!drafts || !drafts.length) {
        list.innerHTML = '<div class="draft-empty">No DRAFT POs found.</div>';
        return;
      }
      list.innerHTML = drafts.map(function(d){
        return '<div class="draft-row" onclick="loadDraft(\'' + d.poNo + '\')">' +
          '<div class="dr-top"><span>' + d.poNo + '</span><span>INR ' + Number(d.grandTotal).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</span></div>' +
          '<div class="dr-sub">' + (d.supplierName || d.supplierCode || '—') + ' &middot; ' + d.poDate + ' &middot; by ' + (d.createdBy || '—') + '</div>' +
          '</div>';
      }).join('');
    })
    .withFailureHandler(function(e){ list.innerHTML = '<div class="draft-empty">Failed: ' + e.message + '</div>'; })
    .listDraftPOs();
};

window.closeDraftPicker = function() {
  var modal = document.getElementById('draftPickerModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
};

window.loadDraft = function(poNo) {
  closeDraftPicker();
  setBusy(true);
  google.script.run
    .withSuccessHandler(function(po) {
      setBusy(false);
      if (!po || !po.header) { showToast('Failed to load PO: ' + poNo, true); return; }
      hydrateFromPO(po);
    })
    .withFailureHandler(function(e){ setBusy(false); showToast(e.message, true); })
    .getPOById(poNo);
};

function hydrateFromPO(po) {
  var h = po.header;
  _editPoNo = h.poNo;
  document.getElementById('popTitle').textContent = 'Edit DRAFT PO';
  document.getElementById('docBadge').textContent = h.poNo;
  document.getElementById('supplierCode').value = h.supplierCode;
  document.getElementById('poDate').value  = isoFromDisplay_(h.poDate);
  document.getElementById('dueDate').value = isoFromDisplay_(h.dueDate);
  document.getElementById('gstPct').value  = h.gstPct;
  document.getElementById('paymentTerms').value = h.paymentTerms;
  document.getElementById('remarks').value = h.remarks;
  // Clear existing lines
  document.getElementById('linesBody').innerHTML = '';
  lineCount = 0;
  (po.lines || []).forEach(function(l) {
    addLine();
    var idx = lineCount;
    var card = document.getElementById('line-' + idx);
    if (!card) return;
    var sel = card.querySelector('select');
    if (sel) sel.value = l.materialCode;
    document.getElementById('unit-'  + idx).value = l.unit;
    document.getElementById('qty-'   + idx).value = l.qtyOrdered;
    document.getElementById('price-' + idx).value = l.unitPrice;
    document.getElementById('pdate-' + idx).value = isoFromDisplay_(l.promisedDate);
  });
  recomputeTotals();
  _dirty = false;
  document.getElementById('btnLoadDraft').style.display = 'none';
}

function isoFromDisplay_(s) {
  // Server fmtDate_ returns 'dd-MMM-yyyy' — convert to yyyy-MM-dd for <input type=date>
  if (!s) return '';
  var m = String(s).match(/^(\d{2})-([A-Za-z]{3})-(\d{4})$/);
  if (!m) return '';
  var months = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  return m[3] + '-' + (months[m[2]] || '01') + '-' + m[1];
}

/* ── Helpers ── */
function setBusy(b) {
  document.getElementById('btnDraft').disabled   = b;
  document.getElementById('btnPreview').disabled = b;
}

function showToast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  setTimeout(function(){ t.className = ''; }, 3000);
}

window.goHome = function() {
  if (_dirty) {
    if (!confirm('You have unsaved changes. Leave anyway?')) return;
  }
  google.script.run
    .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
    .getFormHtml('Landing');
};

window.addEventListener('beforeunload', function(e) {
  if (_dirty) { e.preventDefault(); e.returnValue = ''; }
});

init();
}());
</script>
