<head>

      margin-top: 6px;

    .param-card-remarks input {
      width: 100%;
      border: 1px solid var(--border);

    /* Qty row */

    /* Add item btn */
    .add-item-btn {

      border-radius: 6px;

<body>

<div class="pm-header">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4l-6 6 6 6"/>
    </svg>
  </button>
  <span class="page-title">Outgoing Quality Check</span>
  <span class="doc-badge" id="docBadge">Loading…</span>
</div>

<!-- Dispatch Details -->
<div class="section">
  <div class="section-title">Dispatch Details</div>
  <div class="section-body">
    <div class="two-col">
      <div class="field">
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label>Inspector</label>
        <select id="inspector"><option value="">— Select —</option></select>
      </div>
    </div>
    <div class="field">
      <label>Customer</label>
      <select id="customer"><option value="">— Select Customer —</option></select>
    </div>
  </div>
</div>

<!-- Sampling -->
<div class="section">
  <div class="section-title">Sampling</div>
  <div class="section-body">
    <div class="two-col">
      <div class="field">
        <label>IPQC Records Reviewed</label>
        <div class="toggle-row">
          <button id="ipqcY" onclick="setIPQC(this,'Y')" class="active-yes">Yes</button>
          <button id="ipqcN" onclick="setIPQC(this,'N')">No</button>
        </div>
      </div>
      <div class="field">
        <label>AQL Level</label>
        <select id="aqlLevel">
          <option value="AQL 2.5">AQL 2.5 (Default)</option>
          <option value="AQL 0.65">AQL 0.65</option>
          <option value="AQL 1.0">AQL 1.0</option>
          <option value="AQL 4.0">AQL 4.0</option>
          <option value="AQL 6.5">AQL 6.5</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- Items & Quality Checks -->
<div class="section">
  <div class="section-title">Items &amp; Quality Checks <span style="font-size:10px;font-weight:400;opacity:0.7;margin-left:6px;">★ = CCP</span></div>
  <div class="section-body">
    <button class="add-item-btn" onclick="addItem()">+ Add Item</button>
    <div id="itemsContainer">
      <div id="noItemsMsg" style="font-size:12px;color:var(--muted);text-align:center;padding:8px 0;">
        Click "+ Add Item" to add products for this dispatch.
      </div>
    </div>
  </div>
</div>

<!-- Release Decision -->
<div class="section">
  <div class="section-title">Release Decision</div>
  <div class="section-body">
    <div class="disp-grid">
      <button class="disp-btn" id="r_rel" onclick="setRelease('RELEASED')">RELEASE</button>
      <button class="disp-btn" id="r_hld" onclick="setRelease('HOLD')">HOLD</button>
      <button class="disp-btn" id="r_rej" onclick="setRelease('REJECTED')" style="grid-column:span 2;">REJECT</button>
    </div>
    <div class="field" style="margin-top:10px;">
      <label>Remarks</label>
      <textarea id="remarks" placeholder="Observations or notes…"></textarea>
    </div>
  </div>
</div>

<!-- Sticky footer -->
<div style="position:fixed;bottom:0;left:0;right:0;background:var(--white);padding:10px 14px;border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,0.06);display:flex;gap:8px;z-index:90;">
  <button class="btn-submit" id="btnSubmit" onclick="submitOQC()" style="flex:2;">Save OQC Record</button>
  <button class="btn-wa" id="btnWA" onclick="sendWA()" style="flex:1;margin-top:0;display:none;">WA</button>
</div>

<div class="toast" id="toast"></div>

<script>
var OQC_CHECKS = [
  { id: 'fillWeight',  label: 'Fill Weight',        spec: 'As per product spec',       ccp: true  },
  { id: 'label',       label: 'Label Accuracy',      spec: 'Correct labels, no errors', ccp: true  },
  { id: 'seal',        label: 'Seal Integrity',      spec: 'No leaks, proper seal',     ccp: true  },
  { id: 'appearance',  label: 'Appearance / Visual', spec: 'No damage, correct colour', ccp: false },
  { id: 'custSpec',    label: 'Customer Spec Met',   spec: 'All customer requirements', ccp: true  }
];

var FG_MATS = [], CUSTOMERS = [], INSPECTORS = [];
var currentItems    = [];   // [{materialCode, materialDesc, batchPO, checks:{}, remarks:{}, sampleSize, acceptedQty, rejectedQty, ipqcSessionRef}]
var ipqcVal = 'Y', releaseDecision = '', savedDocNos = [];
var customerSel = {};
var sessionId = sessionStorage.getItem('dwmSessionId') || '';
var _dirty = false;

function markDirty() { _dirty = true; }

window.addEventListener('beforeunload', function(e) {
  if (_dirty) {
    e.preventDefault();
    e.returnValue = 'You have unsaved changes. Leave anyway?';
  }
});

function init() {
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
  document.getElementById('backBtn').addEventListener('click', function() {
    if (_dirty && !confirm('Unsaved changes will be lost. Go back?')) return;
    goHome();
  });

  google.script.run
    .withSuccessHandler(function(d) {
      document.getElementById('docBadge').textContent = d.docNumber;
      FG_MATS    = d.materials  || [];
      CUSTOMERS  = d.customers  || [];
      INSPECTORS = d.inspectors || [];

      var cSel = document.getElementById('customer');
      CUSTOMERS.forEach(function(c) {
        var o = document.createElement('option');
        o.value = c.code; o.textContent = c.name;
        o.dataset.obj = JSON.stringify(c);
        cSel.appendChild(o);
      });

      var iSel = document.getElementById('inspector');
      INSPECTORS.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.name;
        o.textContent = p.name + ' — ' + p.role;
        iSel.appendChild(o);
      });

      // Bind change listeners for dirty tracking
      ['customer','inspector','aqlLevel','date','remarks'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', markDirty);
      });
    })
    .withFailureHandler(function(e) { showToast(e.message, 'error'); })
    .getOQCFormInit();
}

document.getElementById('customer').addEventListener('change', function() {
  var sel = this;
  var opt = sel.options[sel.selectedIndex];
  customerSel = opt && opt.dataset.obj ? JSON.parse(opt.dataset.obj) : {};
});

function addItem() {
  var idx = currentItems.length;
  currentItems.push({
    materialCode: '', materialDesc: '', batchPO: '',
    checks: {}, remarks: {},
    sampleSize: '', acceptedQty: '', rejectedQty: '',
    ipqcSessionRef: ''
  });
  renderItem(idx);
  document.getElementById('noItemsMsg').style.display = 'none';
  markDirty();
}

function removeItem(idx) {
  currentItems.splice(idx, 1);
  rebuildAllItems();
  markDirty();
}

function rebuildAllItems() {
  var container = document.getElementById('itemsContainer');
  // Remove all item blocks
  var blocks = container.querySelectorAll('.item-block');
  blocks.forEach(function(b) { b.parentNode.removeChild(b); });
  document.getElementById('noItemsMsg').style.display = currentItems.length === 0 ? 'block' : 'none';
  currentItems.forEach(function(_, i) { renderItem(i); });
}

function renderItem(idx) {
  var item = currentItems[idx];
  var container = document.getElementById('itemsContainer');

  var block = document.createElement('div');
  block.className = 'item-block';
  block.id = 'item_block_' + idx;

  // Header
  var header = document.createElement('div');
  header.className = 'item-block-header';
  header.innerHTML = '<span>Item ' + (idx + 1) + '</span>';
  var removeBtn = document.createElement('button');
  removeBtn.textContent = '×';
  removeBtn.title = 'Remove item';
  removeBtn.onclick = (function(i) { return function() { removeItem(i); }; })(idx);
  header.appendChild(removeBtn);
  block.appendChild(header);

  var body = document.createElement('div');
  body.className = 'item-block-body';

  // Material select
  var matField = document.createElement('div');
  matField.className = 'field';
  var matLabel = document.createElement('label');
  matLabel.textContent = 'Product / FG Material';
  var matSel = document.createElement('select');
  matSel.id = 'mat_sel_' + idx;
  var defOpt = document.createElement('option');
  defOpt.value = ''; defOpt.textContent = '— Select FG —';
  matSel.appendChild(defOpt);
  if (FG_MATS.length === 0) {
    var noOpt = document.createElement('option');
    noOpt.disabled = true; noOpt.textContent = '(No FG materials — add in Masters)';
    matSel.appendChild(noOpt);
  } else {
    FG_MATS.forEach(function(m) {
      var o = document.createElement('option');
      o.value = m.code;
      o.textContent = m.desc.length > 32 ? m.desc.substring(0, 32) + '…' : m.desc;
      o.dataset.desc = m.desc;
      if (m.code === item.materialCode) o.selected = true;
      matSel.appendChild(o);
    });
  }
  matSel.onchange = (function(i) {
    return function() {
      var opt = this.options[this.selectedIndex];
      currentItems[i].materialCode = this.value;
      currentItems[i].materialDesc = opt ? (opt.dataset.desc || this.value) : this.value;
      checkIPQCStatus(i);
      markDirty();
    };
  })(idx);
  matField.appendChild(matLabel);
  matField.appendChild(matSel);
  body.appendChild(matField);

  // Batch
  var batchField = document.createElement('div');
  batchField.className = 'field';
  var batchLabel = document.createElement('label');
  batchLabel.textContent = 'Batch / PO';
  var batchInp = document.createElement('input');
  batchInp.type = 'text'; batchInp.id = 'batch_inp_' + idx;
  batchInp.placeholder = 'Batch number or PO reference';
  batchInp.value = item.batchPO || '';
  batchInp.oninput  = (function(i) { return function() { currentItems[i].batchPO = this.value; markDirty(); }; })(idx);
  batchInp.onblur   = (function(i) { return function() { checkIPQCStatus(i); }; })(idx);
  batchField.appendChild(batchLabel);
  batchField.appendChild(batchInp);
  body.appendChild(batchField);

  // IPQC advisory
  var ipqcDiv = document.createElement('div');
  ipqcDiv.id = 'ipqc_info_' + idx;
  ipqcDiv.className = 'ipqc-info';
  body.appendChild(ipqcDiv);

  // Param cards
  OQC_CHECKS.forEach(function(chk) {
    var card = document.createElement('div');
    card.className = 'param-card';

    var top = document.createElement('div');
    top.className = 'param-card-top';

    var nameEl = document.createElement('div');
    nameEl.className = 'param-card-name';
    nameEl.textContent = chk.label;
    if (chk.ccp) {
      var star = document.createElement('span');
      star.className = 'ccp-star'; star.title = 'Critical Control Point'; star.textContent = '★';
      nameEl.appendChild(star);
    }
    top.appendChild(nameEl);
    card.appendChild(top);

    var specEl = document.createElement('div');
    specEl.className = 'param-card-spec';
    specEl.textContent = 'Spec: ' + chk.spec;
    card.appendChild(specEl);

    var btns = document.createElement('div');
    btns.className = 'param-card-btns';
    var curVal = (item.checks && item.checks[chk.id]) || '';

    ['Pass', 'Fail', 'NA'].forEach(function(opt) {
      var btn = document.createElement('button');
      btn.textContent = opt;
      btn.id = 'chk_' + idx + '_' + chk.id + '_' + opt.toLowerCase();
      if (curVal === opt.toUpperCase()) btn.className = opt.toLowerCase();
      btn.onclick = (function(i, cid, v, b) {
        return function() { setCheck(i, cid, v, b); };
      })(idx, chk.id, opt.toUpperCase(), btn);
      btns.appendChild(btn);
    });
    card.appendChild(btns);

    // Remarks input
    var remDiv = document.createElement('div');
    remDiv.className = 'param-card-remarks';
    var remInp = document.createElement('input');
    remInp.type = 'text';
    remInp.id = 'rem_' + idx + '_' + chk.id;
    remInp.placeholder = 'Remarks (optional)';
    remInp.value = (item.remarks && item.remarks[chk.id]) || '';
    remInp.oninput = (function(i, cid) {
      return function() {
        if (!currentItems[i].remarks) currentItems[i].remarks = {};
        currentItems[i].remarks[cid] = this.value;
        markDirty();
      };
    })(idx, chk.id);
    remDiv.appendChild(remInp);
    card.appendChild(remDiv);

    body.appendChild(card);
  });

  // Quantity row
  var qtyGrid = document.createElement('div');
  qtyGrid.className = 'qty-grid';
  [
    { key: 'sampleSize',  label: 'Sample Size',  editable: true  },
    { key: 'acceptedQty', label: 'Accepted',      editable: true  },
    { key: 'rejectedQty', label: 'Rejected',      editable: true  },
    { key: 'shortage',    label: 'Shortage',      editable: false }
  ].forEach(function(q) {
    var fld = document.createElement('div');
    fld.className = 'field';
    var lbl = document.createElement('label');
    lbl.textContent = q.label;
    fld.appendChild(lbl);
    if (q.editable) {
      var inp = document.createElement('input');
      inp.type = 'number'; inp.id = q.key + '_' + idx;
      inp.min = '0'; inp.placeholder = '0';
      inp.value = item[q.key] || '';
      inp.oninput = (function(i, k) {
        return function() { currentItems[i][k] = this.value; calcShortage(i); markDirty(); };
      })(idx, q.key);
      fld.appendChild(inp);
    } else {
      var span = document.createElement('span');
      span.id = 'shortage_' + idx;
      span.style.cssText = 'display:block;padding:8px 10px;font-size:14px;font-weight:600;color:var(--muted);';
      span.textContent = '—';
      fld.appendChild(span);
    }
    qtyGrid.appendChild(fld);
  });
  body.appendChild(qtyGrid);

  block.appendChild(body);

  // Insert before noItemsMsg
  var msg = document.getElementById('noItemsMsg');
  container.insertBefore(block, msg);
}

function setCheck(colIndex, checkId, val, clickedBtn) {
  if (!currentItems[colIndex]) return;
  if (!currentItems[colIndex].checks) currentItems[colIndex].checks = {};
  currentItems[colIndex].checks[checkId] = val;

  // Clear siblings
  ['pass','fail','na'].forEach(function(cls) {
    var el = document.getElementById('chk_' + colIndex + '_' + checkId + '_' + cls);
    if (el) el.className = '';
  });
  clickedBtn.className = val.toLowerCase();

  // Auto-suggest HOLD on any CCP fail
  var ccpIds = ['fillWeight','label','seal','custSpec'];
  var anyFail = currentItems.some(function(item) {
    return item.checks && ccpIds.some(function(id) { return item.checks[id] === 'FAIL'; });
  });
  if (anyFail && !releaseDecision) setRelease('HOLD');
  markDirty();
}

function calcShortage(idx) {
  var ss  = parseFloat((document.getElementById('sampleSize_'  + idx) || {}).value) || 0;
  var acc = parseFloat((document.getElementById('acceptedQty_' + idx) || {}).value) || 0;
  var rej = parseFloat((document.getElementById('rejectedQty_' + idx) || {}).value) || 0;
  var el  = document.getElementById('shortage_' + idx);
  if (el) el.textContent = (ss === 0 && acc === 0 && rej === 0) ? '—' : String(ss - acc - rej);
}

function checkIPQCStatus(colIndex) {
  var matSel  = document.getElementById('mat_sel_'   + colIndex);
  var batchInp= document.getElementById('batch_inp_' + colIndex);
  var infoDiv = document.getElementById('ipqc_info_' + colIndex);
  if (!matSel || !batchInp || !infoDiv) return;
  var productCode = matSel.value;
  var batch = batchInp.value.trim();
  if (!productCode || !batch) { infoDiv.style.display = 'none'; infoDiv.className = 'ipqc-info'; return; }

  google.script.run
    .withSuccessHandler((function(ci) {
      return function(res) {
        var div = document.getElementById('ipqc_info_' + ci);
        if (!div) return;
        if (!res.found) {
          currentItems[ci].ipqcSessionRef = '';
          div.className = 'ipqc-info amber';
          div.textContent = 'No IPQC session found for this batch — verify in-process checks were completed.';
          div.style.display = 'block';
        } else if (res.status === 'OPEN') {
          currentItems[ci].ipqcSessionRef = res.sessionId;
          div.className = 'ipqc-info amber';
          div.textContent = 'IPQC session is still OPEN for this batch — ensure it is closed before releasing.';
          div.style.display = 'block';
        } else {
          currentItems[ci].ipqcSessionRef = res.sessionId;
          div.className = 'ipqc-info green';
          div.textContent = 'IPQC completed for this batch (' + res.rounds + ' rounds).';
          div.style.display = 'block';
        }
      };
    })(colIndex))
    .withFailureHandler(function() {})
    .checkIPQCForBatch(productCode, batch);
}

function setIPQC(btn, val) {
  ipqcVal = val;
  document.getElementById('ipqcY').className = '';
  document.getElementById('ipqcN').className = '';
  btn.className = val === 'Y' ? 'active-yes' : 'active-no';
  markDirty();
}

function setRelease(val) {
  releaseDecision = val;
  ['r_rel','r_hld','r_rej'].forEach(function(id) { document.getElementById(id).className = 'disp-btn'; });
  if      (val === 'RELEASED') document.getElementById('r_rel').className = 'disp-btn active-acc';
  else if (val === 'HOLD')     document.getElementById('r_hld').className = 'disp-btn active-hld';
  else if (val === 'REJECTED') document.getElementById('r_rej').className = 'disp-btn active-rej';
  markDirty();
}

function submitOQC() {
  if (!document.getElementById('customer').value)  { showToast('Please select a Customer.', 'error'); return; }
  if (!document.getElementById('inspector').value) { showToast('Please select an Inspector.', 'error'); return; }
  if (!releaseDecision)                            { showToast('Please select a Release Decision.', 'error'); return; }
  if (currentItems.length === 0)                   { showToast('Add at least one item first.', 'error'); return; }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  // Sync any stale DOM values
  currentItems.forEach(function(item, ci) {
    var matSel  = document.getElementById('mat_sel_'   + ci);
    var batchInp= document.getElementById('batch_inp_' + ci);
    if (matSel) {
      var opt = matSel.options[matSel.selectedIndex];
      item.materialCode = matSel.value;
      item.materialDesc = opt ? (opt.dataset.desc || matSel.value) : matSel.value;
    }
    if (batchInp) item.batchPO = batchInp.value;
    item.sampleSize  = parseFloat((document.getElementById('sampleSize_'  + ci) || {}).value) || 0;
    item.acceptedQty = parseFloat((document.getElementById('acceptedQty_' + ci) || {}).value) || 0;
    item.rejectedQty = parseFloat((document.getElementById('rejectedQty_' + ci) || {}).value) || 0;
    OQC_CHECKS.forEach(function(chk) {
      var remEl = document.getElementById('rem_' + ci + '_' + chk.id);
      if (remEl) {
        if (!item.remarks) item.remarks = {};
        item.remarks[chk.id] = remEl.value;
      }
    });
  });

  var customerSel2 = {};
  var cSel = document.getElementById('customer');
  var cOpt = cSel.options[cSel.selectedIndex];
  if (cOpt && cOpt.dataset.obj) { try { customerSel2 = JSON.parse(cOpt.dataset.obj); } catch(e) {} }

  var data = {
    date:           document.getElementById('date').value,
    customerCode:   document.getElementById('customer').value,
    customerName:   customerSel2.name || customerSel.name || '',
    inspector:      document.getElementById('inspector').value,
    ipqcReviewed:   ipqcVal,
    aqlLevel:       document.getElementById('aqlLevel').value,
    releaseDecision:releaseDecision,
    remarks:        document.getElementById('remarks').value,
    sessionId:      sessionId,
    items: currentItems.map(function(item) {
      return {
        materialCode:   item.materialCode  || '',
        materialDesc:   item.materialDesc  || '',
        batchPO:        item.batchPO       || '',
        sampleSize:     item.sampleSize    || 0,
        acceptedQty:    item.acceptedQty   || 0,
        rejectedQty:    item.rejectedQty   || 0,
        checks:         item.checks        || {},
        remarks:        item.remarks       || {},
        ipqcSessionRef: item.ipqcSessionRef|| ''
      };
    })
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        savedDocNos = res.docNos || [];
        _dirty = false;
        var recordId = res.recordId || savedDocNos[0] || '';
        var productName = (currentItems[0] && currentItems[0].materialDesc) ? currentItems[0].materialDesc : '';
        var batchNo     = (currentItems[0] && currentItems[0].batchPO)       ? currentItems[0].batchPO       : '';
        if (sessionId) {
          autoQmsTask_(sessionId, 'OQC', 'OQC: ' + productName + ' — ' + batchNo, recordId);
        }
        showToast('Saved: ' + savedDocNos.join(', '), 'success');
        document.getElementById('btnWA').style.display = 'block';
        btn.innerHTML = 'Saved';
        setTimeout(function() { goHome(); }, 2500);
      } else {
        showToast('Error: ' + res.error, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Save OQC Record';
      }
    })
    .withFailureHandler(function(e) {
      showToast(e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Save OQC Record';
    })
    .saveOQC(data);
}

function autoQmsTask_(sid, type, title, linkedRecord) {
  if (!sid) return;
  google.script.run
    .withSuccessHandler(function() {})
    .withFailureHandler(function() {})
    .autoQmsTask_(sid, type, title, linkedRecord);
}

function sendWA() {
  if (!savedDocNos.length) return;
  var cSel = document.getElementById('customer');
  var cOpt = cSel.options[cSel.selectedIndex];
  var custName = (cOpt && cOpt.dataset.obj) ? (JSON.parse(cOpt.dataset.obj).name || '') : '';
  var rec = {
    type: 'OQC', docNo: savedDocNos[0],
    date: document.getElementById('date').value,
    customer: custName,
    releaseDecision: releaseDecision,
    inspector: document.getElementById('inspector').value
  };
  google.script.run
    .withSuccessHandler(function(url) { window.open(url, '_blank'); })
    .getWhatsAppURLForRecord(rec);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

window.onload = init;
</script>
</body>
</html>
