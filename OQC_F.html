<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <style>
    @keyframes pulse-amber {
      0%   { border-color: var(--border); box-shadow: none; }
      50%  { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(232,160,32,0.3); }
      100% { border-color: var(--border); box-shadow: none; }
    }
    @keyframes confirm-pop {
      0%   { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* ── Parameter rows ── */
    .param-row-oqc {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
    }
    .param-row-oqc:last-child { border-bottom: none; }
    .param-row-oqc.is-fail {
      background: #FEF2F2;
      border-left: 3px solid var(--danger);
    }
    .param-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .param-toggle {
      display: flex;
      gap: 6px;
    }
    .param-toggle button {
      flex: 1;
      min-height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: var(--white);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      color: var(--muted);
      transition: all 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .param-toggle button:active { transform: scale(0.97); }
    .param-toggle button.is-pass {
      background: #F0FDF4;
      border-color: var(--success);
      color: var(--success);
    }
    .param-toggle button.is-fail {
      background: #FEF2F2;
      border-color: var(--danger);
      color: var(--danger);
      animation: shake 0.3s ease;
    }
    .param-toggle button.is-na {
      background: var(--navy-light);
      border-color: var(--navy);
      color: var(--navy);
    }

    /* ── Section title check state ── */
    .section-title.all-done {
      background: #15803D;
      transition: background 0.2s ease;
    }

    /* ── Disposition card ── */
    .disp-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      margin: 10px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      transition: border-color 0.15s ease;
    }
    .disp-card.pulse-amber {
      animation: pulse-amber 0.4s ease;
    }
    .disp-collapsed {
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }
    .disp-expanded {
      padding: 10px 12px 12px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }
    .disp-expanded.open {
      max-height: 200px;
    }
    .disp-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .disp-grid-oqc {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .disp-btn-oqc {
      padding: 10px 6px 8px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-align: center;
      color: var(--text);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s ease;
      line-height: 1.2;
    }
    .disp-btn-oqc .disp-sub {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
    }
    .disp-btn-oqc:active { transform: scale(0.97); }
    .disp-btn-oqc.sel-acc {
      background: #E8F5E9;
      border-color: var(--success);
      color: var(--success);
    }
    .disp-btn-oqc.sel-acc .disp-sub { color: var(--success); opacity: 0.7; }
    .disp-btn-oqc.sel-rej {
      background: #FEF2F2;
      border-color: var(--danger);
      color: var(--danger);
    }
    .disp-btn-oqc.sel-rej .disp-sub { color: var(--danger); opacity: 0.7; }
    .disp-btn-oqc.sel-hld {
      background: #FEF3C7;
      border-color: var(--hold);
      color: var(--hold);
    }
    .disp-btn-oqc.sel-hld .disp-sub { color: var(--hold); opacity: 0.7; }
    .disp-btn-oqc.sel-awd {
      background: #FFEDD5;
      border-color: var(--deviation);
      color: var(--deviation);
    }
    .disp-btn-oqc.sel-awd .disp-sub { color: var(--deviation); opacity: 0.7; }

    /* ── Remarks area ── */
    .remarks-wrap {
      margin: 0 10px 10px;
    }
    .remarks-wrap label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .remarks-wrap textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      resize: vertical;
      min-height: 72px;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    .remarks-wrap textarea:focus {
      outline: none;
      border-color: var(--navy);
    }
    .remarks-wrap .hint {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── Sticky bottom bar ── */
    .sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--navy);
      padding: 8px 14px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 50;
      min-height: 56px;
    }
    .bar-batch-info {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .bar-save-btn {
      background: var(--amber);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      min-height: 44px;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease, opacity 0.15s ease;
      flex-shrink: 0;
    }
    .bar-save-btn:disabled {
      background: #9CA3AF;
      color: var(--white);
      cursor: not-allowed;
      opacity: 1;
    }

    /* ── Item name hint ── */
    .item-name-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      min-height: 16px;
      font-style: italic;
    }

    /* ── Confirmation screen ── */
    .confirm-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px 100px;
      text-align: center;
      background: var(--bg);
    }
    .confirm-icon-wrap {
      width: 80px;
      height: 80px;
      background: var(--amber);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: confirm-pop 0.3s ease both;
    }
    .confirm-icon-wrap svg {
      width: 40px;
      height: 40px;
      stroke: var(--white);
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .confirm-heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .confirm-id {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .confirm-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .chip {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip-navy  { background: var(--navy-light); color: var(--navy); }
    .chip-muted { background: #F3F4F6;           color: var(--muted); }
    .chip-acc   { background: #DCFCE7;           color: #15803D; }
    .chip-rej   { background: #FEE2E2;           color: #B91C1C; }
    .chip-hld   { background: #FEF3C7;           color: #B45309; }
    .chip-awd   { background: #FFEDD5;           color: #C2410C; }
    .confirm-home-btn {
      width: 100%;
      max-width: 320px;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
    }

    /* ── Amber underline on unfilled required field ── */
    .field-error input,
    .field-error select {
      border-color: var(--amber) !important;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     SCREEN 1: CAPTURE FORM
════════════════════════════════════════════ -->
<div id="screen1">

  <!-- Header -->
  <div class="pm-header">
    <button class="back-btn" id="backBtn">
      <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6"/></svg>
    </button>
    <span class="page-title">OQC Inspection</span>
    <span class="doc-badge" id="docBadge">OQC</span>
  </div>

  <!-- Batch Info Section -->
  <div class="section">
    <div class="section-title" id="batchSectionTitle">BATCH INFO</div>
    <div class="section-body">

      <div class="field" id="fieldIPQC">
        <label>From IPQC Session</label>
        <select id="selIPQC" style="font-size:16px!important;">
          <option value="">— Select closed IPQC session —</option>
        </select>
        <div class="item-name-hint" id="ipqcHint">Picking a session auto-fills item & batch.</div>
      </div>

      <div class="field" id="fieldMaterial">
        <label>Item / Material</label>
        <select id="selMaterial">
          <option value="">— Select FG Material —</option>
        </select>
        <div class="item-name-hint" id="itemNameHint"></div>
      </div>

      <div class="field" id="fieldBatch">
        <label>Batch No</label>
        <input type="text" id="inpBatch" placeholder="e.g. B2026-001" autocomplete="off" style="font-size:16px!important;">
      </div>

      <div class="field" id="fieldCustomer">
        <label>Customer</label>
        <select id="selCustomer" style="font-size:16px!important;">
          <option value="">— Select Customer —</option>
        </select>
      </div>

      <div class="field" id="fieldQty">
        <label>Qty Checked</label>
        <input type="number" id="inpQty" inputmode="numeric" min="1" placeholder="0" style="font-size:16px!important;">
      </div>

    </div>
  </div>

  <!-- Inspection Parameters Section -->
  <div class="section">
    <div class="section-title" id="inspSectionTitle">INSPECTION</div>
    <div id="paramRows">
      <!-- rows rendered by JS -->
    </div>
  </div>

  <!-- Disposition Card -->
  <div class="disp-card" id="dispCard">
    <div class="disp-collapsed" id="dispCollapsed">Disposition — fill all parameters above</div>
    <div class="disp-expanded" id="dispExpanded">
      <div class="disp-label">Release Decision</div>
      <div class="disp-grid-oqc">
        <button class="disp-btn-oqc" id="btnAcc"  data-val="ACCEPTED">ACCEPT</button>
        <button class="disp-btn-oqc" id="btnRej"  data-val="REJECTED">REJECT</button>
        <button class="disp-btn-oqc" id="btnHld"  data-val="HOLD">HOLD</button>
        <button class="disp-btn-oqc" id="btnAwd"  data-val="ACCEPTED WITH DEVIATION">AWD<span class="disp-sub">With deviation</span></button>
      </div>
    </div>
  </div>

  <!-- FG Location (P6 — required when decision is ACCEPTED / RELEASED / AWD) -->
  <div class="remarks-wrap" id="fieldFGLocation" style="display:none;">
    <label for="selFGLocation">FG Storage Location <span style="color:#B91C1C;">*</span></label>
    <select id="selFGLocation" style="width:100%;border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:16px;font-family:inherit;background:var(--white);">
      <option value="">— Select FG location —</option>
    </select>
    <div class="hint">Where this FG batch is being stored. Used for FIFO dispatch traceability.</div>
  </div>

  <!-- Remarks -->
  <div class="remarks-wrap">
    <label for="inpRemarks">Remarks</label>
    <textarea id="inpRemarks" rows="3" placeholder="Deviations, observations, or dispatch notes…"></textarea>
    <div class="hint">Optional</div>
  </div>

  <!-- Spacer for sticky bar -->
  <div style="height: 72px;"></div>

</div><!-- #screen1 -->

<!-- ═══════════════════════════════════════════
     SCREEN 2: CONFIRMATION
════════════════════════════════════════════ -->
<div id="screen2" style="display:none;">
  <div class="confirm-screen">
    <div class="confirm-icon-wrap">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="confirm-heading">OQC Saved</div>
    <div class="confirm-id" id="confirmId"></div>
    <div class="confirm-chips" id="confirmChips"></div>
    <button class="confirm-home-btn" id="btnHome">Back to Home</button>
  </div>
</div>

<!-- Sticky Bottom Bar -->
<div class="sticky-bar" id="stickyBar">
  <div class="bar-batch-info" id="barBatchInfo">Batch —</div>
  <button class="bar-save-btn" id="btnSave" disabled>Save OQC →</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// Constants
// ══════════════════════════════════════════════════════════
var OQC_CHECKS = [
  { id: 'fillWeight', label: 'Fill Weight / Qty' },
  { id: 'label',      label: 'Label Accuracy'    },
  { id: 'seal',       label: 'Seal / Closure'    },
  { id: 'appearance', label: 'Appearance'         },
  { id: 'custSpec',   label: 'Customer Spec'      }
];

var DISP_BTNS = [
  { id: 'btnAcc', val: 'ACCEPTED',              cls: 'sel-acc' },
  { id: 'btnRej', val: 'REJECTED',              cls: 'sel-rej' },
  { id: 'btnHld', val: 'HOLD',                  cls: 'sel-hld' },
  { id: 'btnAwd', val: 'ACCEPTED WITH DEVIATION', cls: 'sel-awd' }
];

// ══════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════
var gMaterials    = [];
var gCustomers    = [];
var gIPQCSessions = [];
var gFGLocations  = [];
var gIpqcRef      = '';
var gToday       = '';
var gChecks      = {};   // { fillWeight: 'PASS'|'FAIL'|'NA', ... }
var gDisposition = '';
var gSaved       = false;

// ══════════════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', function() {
  renderParamRows();
  bindEvents();
  loadInit();
});

function loadInit() {
  google.script.run
    .withSuccessHandler(function(d) {
      gToday        = d.today || '';
      gMaterials    = d.materials  || [];
      gCustomers    = d.customers  || [];
      gIPQCSessions = d.ipqcSessions || [];
      gFGLocations  = d.fgLocations || [];

      // Populate FG location dropdown
      var fgSel = document.getElementById('selFGLocation');
      if (fgSel) {
        // keep first placeholder option
        while (fgSel.options.length > 1) fgSel.remove(1);
        gFGLocations.forEach(function(loc) {
          var o = document.createElement('option');
          o.value = loc.id;
          o.textContent = loc.id + (loc.type ? ' (' + loc.type + ')' : '') + (loc.label && loc.label !== loc.id ? ' — ' + loc.label : '');
          o.dataset.type = loc.type || '';
          fgSel.appendChild(o);
        });
        fgSel.addEventListener('change', checkSaveReady);
      }

      document.getElementById('docBadge').textContent = d.docNumber || 'OQC';

      var matSel = document.getElementById('selMaterial');
      gMaterials.forEach(function(m) {
        var o = document.createElement('option');
        o.value = m.code;
        o.textContent = (m.desc && m.desc.length > 36) ? m.desc.substring(0, 36) + '…' : (m.desc || m.code);
        o.dataset.desc = m.desc || m.code;
        matSel.appendChild(o);
      });

      var custSel = document.getElementById('selCustomer');
      gCustomers.forEach(function(c) {
        var o = document.createElement('option');
        o.value = c.code;
        o.textContent = c.name;
        o.dataset.name = c.name;
        custSel.appendChild(o);
      });

      var ipqcSel = document.getElementById('selIPQC');
      gIPQCSessions.forEach(function(s) {
        var o = document.createElement('option');
        o.value = s.sessionId;
        o.textContent = s.label;
        o.dataset.productCode = s.productCode;
        o.dataset.productName = s.productName;
        o.dataset.batch       = s.batch;
        ipqcSel.appendChild(o);
      });
      if (!gIPQCSessions.length) {
        document.getElementById('ipqcHint').textContent = 'No closed IPQC sessions in last 30 days — fill manually below.';
      }

    })
    .withFailureHandler(function(e) {
      showToast(e.message || 'Load failed', 'error');
    })
    .getOQCFormInit();
}

// ══════════════════════════════════════════════════════════
// Render parameter rows
// ══════════════════════════════════════════════════════════
function renderParamRows() {
  var container = document.getElementById('paramRows');
  container.innerHTML = '';
  OQC_CHECKS.forEach(function(chk) {
    var row = document.createElement('div');
    row.className = 'param-row-oqc';
    row.id = 'prow_' + chk.id;

    var nameEl = document.createElement('div');
    nameEl.className = 'param-name';
    nameEl.textContent = chk.label;
    row.appendChild(nameEl);

    var tog = document.createElement('div');
    tog.className = 'param-toggle';

    ['PASS', 'FAIL', 'NA'].forEach(function(v) {
      var btn = document.createElement('button');
      btn.textContent = v;
      btn.id = 'ptog_' + chk.id + '_' + v;
      btn.addEventListener('click', (function(cid, val) {
        return function() { setCheck(cid, val); };
      })(chk.id, v));
      tog.appendChild(btn);
    });

    row.appendChild(tog);
    container.appendChild(row);
  });
}

// ══════════════════════════════════════════════════════════
// Events
// ══════════════════════════════════════════════════════════
function bindEvents() {
  document.getElementById('backBtn').addEventListener('click', function() {
    if (!gSaved && hasAnyInput()) {
      if (!confirm('Unsaved changes will be lost. Go back?')) return;
    }
    goHome();
  });

  document.getElementById('selMaterial').addEventListener('change', function() {
    var opt = this.options[this.selectedIndex];
    var hint = document.getElementById('itemNameHint');
    hint.textContent = (opt && opt.dataset.desc) ? opt.dataset.desc : '';
    updateBarBatch();
    checkSaveReady();
  });

  document.getElementById('selIPQC').addEventListener('change', function() {
    var opt = this.options[this.selectedIndex];
    gIpqcRef = this.value || '';
    if (!opt || !this.value) return;
    var pc = opt.dataset.productCode || '';
    var bt = opt.dataset.batch || '';
    var matSel = document.getElementById('selMaterial');
    for (var i = 0; i < matSel.options.length; i++) {
      if (matSel.options[i].value === pc) { matSel.selectedIndex = i; break; }
    }
    matSel.dispatchEvent(new Event('change'));
    document.getElementById('inpBatch').value = bt;
    updateBarBatch();
    checkSaveReady();
  });

  document.getElementById('inpBatch').addEventListener('input', function() {
    updateBarBatch();
    checkSaveReady();
  });

  document.getElementById('selCustomer').addEventListener('change', function() {
    checkSaveReady();
  });

  document.getElementById('inpQty').addEventListener('input', function() {
    checkSaveReady();
  });

  // Disposition buttons
  DISP_BTNS.forEach(function(db) {
    document.getElementById(db.id).addEventListener('click', function() {
      setDisposition(db.val);
    });
  });

  document.getElementById('btnSave').addEventListener('click', function() {
    onSaveTap();
  });

  document.getElementById('btnHome').addEventListener('click', function() {
    goHome();
  });

}

// ══════════════════════════════════════════════════════════
// Parameter toggle logic
// ══════════════════════════════════════════════════════════
function setCheck(checkId, val) {
  gChecks[checkId] = val;

  // Update button visual states
  ['PASS', 'FAIL', 'NA'].forEach(function(v) {
    var btn = document.getElementById('ptog_' + checkId + '_' + v);
    if (!btn) return;
    btn.className = (v === val) ? ('is-' + v.toLowerCase()) : '';
  });

  // Row background for FAIL
  var row = document.getElementById('prow_' + checkId);
  if (row) {
    if (val === 'FAIL') {
      row.className = 'param-row-oqc is-fail';
    } else {
      row.className = 'param-row-oqc';
    }
  }

  checkParamsDone();
  checkSaveReady();
}

function allParamsFilled() {
  for (var i = 0; i < OQC_CHECKS.length; i++) {
    if (!gChecks[OQC_CHECKS[i].id]) return false;
  }
  return true;
}

function checkParamsDone() {
  var done = allParamsFilled();
  var titleEl = document.getElementById('inspSectionTitle');

  if (done) {
    titleEl.className = 'section-title all-done';
    titleEl.textContent = '✓ INSPECTION';
    expandDisposition();
    autoSelectDisposition();
  } else {
    titleEl.className = 'section-title';
    titleEl.textContent = 'INSPECTION';
    collapseDisposition();
  }
}

// ══════════════════════════════════════════════════════════
// Disposition
// ══════════════════════════════════════════════════════════
function expandDisposition() {
  document.getElementById('dispCollapsed').style.display = 'none';
  var exp = document.getElementById('dispExpanded');
  exp.className = 'disp-expanded open';
}

function collapseDisposition() {
  document.getElementById('dispCollapsed').style.display = '';
  var exp = document.getElementById('dispExpanded');
  exp.className = 'disp-expanded';
  gDisposition = '';
  DISP_BTNS.forEach(function(db) {
    document.getElementById(db.id).className = 'disp-btn-oqc';
  });
}

function autoSelectDisposition() {
  var anyFail = false;
  var allPassOrNA = true;
  OQC_CHECKS.forEach(function(chk) {
    var v = gChecks[chk.id];
    if (v === 'FAIL') { anyFail = true; allPassOrNA = false; }
    if (v !== 'PASS' && v !== 'NA') { allPassOrNA = false; }
  });

  var auto = '';
  if (anyFail)      auto = 'REJECTED';
  else if (allPassOrNA) auto = 'ACCEPTED';
  else              auto = 'HOLD';

  setDisposition(auto);
}

function setDisposition(val) {
  gDisposition = val;
  DISP_BTNS.forEach(function(db) {
    var btn = document.getElementById(db.id);
    btn.className = 'disp-btn-oqc' + (db.val === val ? ' ' + db.cls : '');
  });
  // P6 — show FG Location when decision is released-equivalent
  var fgField = document.getElementById('fieldFGLocation');
  if (fgField) {
    var releasedLike = (val === 'ACCEPTED' || val === 'RELEASED' || val === 'ACCEPTED WITH DEVIATION');
    fgField.style.display = releasedLike ? '' : 'none';
  }
  checkSaveReady();
}

// ══════════════════════════════════════════════════════════
// Save readiness
// ══════════════════════════════════════════════════════════
function checkSaveReady() {
  var mat    = document.getElementById('selMaterial').value;
  var batch  = document.getElementById('inpBatch').value.trim();
  var cust   = document.getElementById('selCustomer').value;
  var qty    = parseFloat(document.getElementById('inpQty').value);
  var releasedLike = (gDisposition === 'ACCEPTED' || gDisposition === 'RELEASED' || gDisposition === 'ACCEPTED WITH DEVIATION');
  var fgLoc = document.getElementById('selFGLocation') ? document.getElementById('selFGLocation').value : '';
  var fgLocOK = !releasedLike || !!fgLoc;
  var ready  = mat && batch && cust && qty >= 1 && allParamsFilled() && gDisposition && fgLocOK;
  document.getElementById('btnSave').disabled = !ready;
}

function hasAnyInput() {
  var mat   = document.getElementById('selMaterial').value;
  var batch = document.getElementById('inpBatch').value.trim();
  var cust  = document.getElementById('selCustomer').value;
  return mat || batch || cust;
}

function updateBarBatch() {
  var batch = document.getElementById('inpBatch').value.trim();
  document.getElementById('barBatchInfo').textContent = batch ? 'Batch ' + batch : 'Batch —';
}

// ══════════════════════════════════════════════════════════
// Save tap — validate + highlight + save
// ══════════════════════════════════════════════════════════
function onSaveTap() {
  var matEl   = document.getElementById('selMaterial');
  var batchEl = document.getElementById('inpBatch');
  var custEl  = document.getElementById('selCustomer');
  var qtyEl   = document.getElementById('inpQty');
  var valid   = true;

  ['fieldMaterial', 'fieldBatch', 'fieldCustomer', 'fieldQty'].forEach(function(fid) {
    document.getElementById(fid).classList.remove('field-error');
  });

  if (!matEl.value)             { document.getElementById('fieldMaterial').classList.add('field-error'); valid = false; }
  if (!batchEl.value.trim())    { document.getElementById('fieldBatch').classList.add('field-error');    valid = false; }
  if (!custEl.value)            { document.getElementById('fieldCustomer').classList.add('field-error'); valid = false; }
  if (!(parseFloat(qtyEl.value) >= 1)) { document.getElementById('fieldQty').classList.add('field-error'); valid = false; }

  if (!valid) {
    showToast('Fill all required fields', 'error');
    return;
  }

  if (!allParamsFilled()) {
    showToast('Complete all inspection parameters', 'error');
    return;
  }

  if (!gDisposition) {
    var card = document.getElementById('dispCard');
    card.classList.add('pulse-amber');
    setTimeout(function() { card.classList.remove('pulse-amber'); }, 500);
    showToast('Select a disposition', 'error');
    return;
  }

  // P6 — block save if released decision without FG location
  var releasedLikeSave = (gDisposition === 'ACCEPTED' || gDisposition === 'RELEASED' || gDisposition === 'ACCEPTED WITH DEVIATION');
  var fgLocSel = document.getElementById('selFGLocation');
  if (releasedLikeSave && (!fgLocSel || !fgLocSel.value)) {
    showToast('Select FG storage location before releasing', 'error');
    if (fgLocSel) fgLocSel.focus();
    return;
  }

  doSave();
}

// ══════════════════════════════════════════════════════════
// doSave
// ══════════════════════════════════════════════════════════
function doSave() {
  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  var matSel  = document.getElementById('selMaterial');
  var matOpt  = matSel.options[matSel.selectedIndex];
  var matDesc = (matOpt && matOpt.dataset.desc) ? matOpt.dataset.desc : matSel.value;

  var custSel  = document.getElementById('selCustomer');
  var custOpt  = custSel.options[custSel.selectedIndex];
  var custName = (custOpt && custOpt.dataset.name) ? custOpt.dataset.name : custSel.value;

  var batchNo  = document.getElementById('inpBatch').value.trim();
  var qty      = parseFloat(document.getElementById('inpQty').value) || 0;

  var data = {
    date:            gToday || new Date().toISOString().split('T')[0],
    customerCode:    custSel.value,
    customerName:    custName,
    ipqcReviewed:    'Y',
    inspector:       (window.QMS ? window.QMS.getOperatorName() : '') || 'QA',
    releaseDecision: gDisposition,
    operatorName:    window.QMS ? window.QMS.getOperatorName() : '',
    remarks:         document.getElementById('inpRemarks').value,
    fgLocation:    (document.getElementById('selFGLocation') ? document.getElementById('selFGLocation').value : ''),
    items: [{
      batchPO:       batchNo,
      materialDesc:  matDesc,
      sampleSize:    qty,
      fgLocation:    (document.getElementById('selFGLocation') ? document.getElementById('selFGLocation').value : ''),
      acceptedQty:   (gDisposition === 'ACCEPTED' || gDisposition === 'RELEASED' || gDisposition === 'ACCEPTED WITH DEVIATION') ? qty : 0,
      rejectedQty:   gDisposition === 'REJECTED' ? qty : 0,
      checks: {
        fillWeight:  gChecks.fillWeight  || '',
        label:       gChecks.label       || '',
        seal:        gChecks.seal        || '',
        appearance:  gChecks.appearance  || '',
        custSpec:    gChecks.custSpec    || ''
      },
      ipqcSessionRef: gIpqcRef || ''
    }]
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        gSaved = true;
        var docNo = (res.docNos && res.docNos[0]) ? res.docNos[0] : '';
        showConfirm(docNo, matDesc, batchNo, custName, gDisposition);
      } else {
        var msg = (res && res.error) ? res.error : 'Save failed';
        showToast(msg, 'error');
        btn.disabled = false;
        btn.textContent = 'Save OQC →';
      }
    })
    .withFailureHandler(function(e) {
      showToast(e.message || 'Save failed', 'error');
      btn.disabled = false;
      btn.textContent = 'Save OQC →';
    })
    .saveOQC(data);
}

// ══════════════════════════════════════════════════════════
// Confirmation screen
// ══════════════════════════════════════════════════════════
function showConfirm(docNo, matDesc, batchNo, custName, disposition) {
  document.getElementById('screen1').style.display  = 'none';
  document.getElementById('stickyBar').style.display = 'none';
  document.getElementById('screen2').style.display  = '';

  document.getElementById('confirmId').textContent = docNo ? 'OQC #' + docNo : 'OQC Saved';

  var chipsEl = document.getElementById('confirmChips');
  chipsEl.innerHTML = '';

  function addChip(text, cls) {
    var c = document.createElement('span');
    c.className = 'chip ' + cls;
    c.textContent = text;
    chipsEl.appendChild(c);
  }

  addChip(matDesc, 'chip-navy');
  addChip('Batch: ' + batchNo, 'chip-muted');
  addChip(custName, 'chip-muted');

  var dispCls = 'chip-muted';
  if (disposition === 'ACCEPTED')               dispCls = 'chip-acc';
  else if (disposition === 'REJECTED')          dispCls = 'chip-rej';
  else if (disposition === 'HOLD')              dispCls = 'chip-hld';
  else if (disposition === 'ACCEPTED WITH DEVIATION') dispCls = 'chip-awd';

  var dispLabel = disposition === 'ACCEPTED WITH DEVIATION' ? 'AWD' : disposition;
  addChip('Disposition: ' + dispLabel, dispCls);
}

// ══════════════════════════════════════════════════════════
// Navigation
// ══════════════════════════════════════════════════════════
function goHome() {
  google.script.run
    .withSuccessHandler(function(html) {
      document.open();
      document.write(html);
      document.close();
    })
    .withFailureHandler(function() {})
    .getLandingHtml();
}

// ══════════════════════════════════════════════════════════
// Toast
// ══════════════════════════════════════════════════════════
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}
</script>
