<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <style>
    body { min-width: 580px; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

    /* Matrix table */
    .matrix-th-label {
      position:sticky; left:0; background:var(--white); z-index:2;
      min-width:190px; text-align:left; padding:6px 10px;
      border:1px solid var(--border); font-size:12px; font-weight:600;
      color:var(--text); white-space:nowrap;
    }
    .matrix-td-label {
      position:sticky; left:0; background:var(--white); z-index:1;
      min-width:190px; padding:6px 10px;
      border:1px solid var(--border); font-size:12px;
      color:var(--text); white-space:nowrap;
    }
    .matrix-th-item {
      min-width:160px; padding:6px 8px; border:1px solid var(--border);
      text-align:center; font-size:11px; background:#F8FAFC; vertical-align:top;
    }
    .matrix-td {
      min-width:160px; padding:5px 6px; border:1px solid var(--border);
      text-align:center; vertical-align:middle;
    }
    .matrix-td button {
      padding:4px 10px; border:1.5px solid var(--border); border-radius:4px;
      background:var(--white); font-size:11px; font-weight:600;
      cursor:pointer; font-family:inherit;
    }
    .matrix-td button.pass { background:#E8F5E9; border-color:var(--success); color:var(--success); }
    .matrix-td button.fail { background:#FFEBEE; border-color:var(--danger);  color:var(--danger);  }
    .matrix-td input[type=number] {
      width:80px; padding:4px 6px; border:1px solid var(--border);
      border-radius:4px; font-size:12px; text-align:center; font-family:inherit;
    }
    .matrix-shortage { font-size:12px; color:var(--muted); font-weight:600; }
    .matrix-qty-label { font-size:11px; font-weight:600; color:var(--muted); }
    .ccp-star { color:var(--danger); font-weight:700; margin-left:3px; }
    .param-num-sm { color:var(--muted); font-size:10px; margin-right:4px; }

    /* Column header inputs */
    .col-mat-sel {
      width:100%; padding:4px 6px; border:1px solid var(--border);
      border-radius:4px; font-size:11px; font-family:inherit; margin-bottom:4px;
    }
    .col-batch-inp {
      width:100%; padding:4px 6px; border:1px solid var(--border);
      border-radius:4px; font-size:11px; font-family:inherit;
    }
    .remove-col-btn {
      background:none; border:none; color:var(--muted); cursor:pointer;
      font-size:10px; padding:3px 0; display:block; width:100%; margin-top:4px;
    }
    .remove-col-btn:hover { color:var(--danger); }
  </style>
</head>
<body>

<div class="pm-header">
  <a onclick="goHome()" style="color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;margin-right:4px;text-decoration:none;">‹</a>
  <span class="logo-text">📤 Outgoing Quality Check</span>
  <span class="doc-badge" id="docBadge">Loading…</span>
</div>

<div style="padding-bottom:80px; overflow-y:auto;">

  <!-- Dispatch Details -->
  <div class="section">
    <div class="section-title">Dispatch Details</div>
    <div class="section-body">
      <div class="two-col">
        <div class="field">
          <label>Date</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label>Inspector</label>
          <select id="inspector"><option value="">— Select —</option></select>
        </div>
      </div>
      <div class="field">
        <label>Customer</label>
        <select id="customer" onchange="onCustomerChange()"><option value="">— Select Customer —</option></select>
      </div>
    </div>
  </div>

  <!-- Sampling -->
  <div class="section">
    <div class="section-title">Sampling</div>
    <div class="section-body">
      <div class="two-col">
        <div class="field">
          <label>IPQC Records Reviewed</label>
          <div class="toggle-row">
            <button onclick="setIPQC(this,'Y')" id="ipqcY" class="active-yes">Yes</button>
            <button onclick="setIPQC(this,'N')" id="ipqcN">No</button>
          </div>
        </div>
        <div class="field">
          <label>AQL Level</label>
          <select id="aqlLevel">
            <option value="AQL 2.5">AQL 2.5 (Default)</option>
            <option value="AQL 0.65">AQL 0.65</option>
            <option value="AQL 1.0">AQL 1.0</option>
            <option value="AQL 4.0">AQL 4.0</option>
            <option value="AQL 6.5">AQL 6.5</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Items & Checks Matrix -->
  <div class="section">
    <div class="section-title">
      Items &amp; Quality Checks
      <button onclick="addItem()" style="margin-left:8px;background:var(--amber);color:var(--navy);border:none;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;">+ Add Item</button>
      <span style="font-size:10px;font-weight:400;color:rgba(255,255,255,0.7);margin-left:6px;">★ = CCP</span>
    </div>
    <div class="section-body" style="padding:0;">
      <div id="matrixWrap" style="overflow-x:auto;">
        <div id="matrixPlaceholder" style="padding:16px;color:var(--muted);font-size:13px;">
          Click "+ Add Item" to add products for this dispatch.
        </div>
        <table id="matrixTable" style="display:none;border-collapse:collapse;width:100%;min-width:400px;">
          <thead id="matrixHead"></thead>
          <tbody id="matrixBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Release Decision -->
  <div class="section">
    <div class="section-title">Release Decision</div>
    <div class="section-body">
      <div class="disp-grid">
        <button class="disp-btn" id="r_rel" onclick="setRelease('RELEASED')">✅ RELEASE</button>
        <button class="disp-btn" id="r_hld" onclick="setRelease('HOLD')">⏸ HOLD</button>
        <button class="disp-btn" id="r_rej" onclick="setRelease('REJECTED')" style="grid-column:span 2;">❌ REJECT</button>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Remarks</label>
        <textarea id="remarks" placeholder="Observations or notes…"></textarea>
      </div>
    </div>
  </div>

</div>

<!-- Sticky footer -->
<div style="position:fixed;bottom:0;left:0;right:0;background:var(--white);padding:10px 14px;border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,0.06);display:flex;gap:8px;">
  <button class="btn-submit" id="btnSubmit" onclick="submitOQC()" style="flex:2;">Save OQC Record</button>
  <button class="btn-wa" id="btnWA" onclick="sendWA()" style="flex:1;margin-top:0;display:none;">📲 WA</button>
</div>

<div class="toast" id="toast"></div>

<script>
var OQC_CHECKS = [
  { id: 'fillWeight',  label: 'Fill Weight',       ccp: true  },
  { id: 'label',       label: 'Label Accuracy',     ccp: true  },
  { id: 'seal',        label: 'Seal Integrity',     ccp: true  },
  { id: 'appearance',  label: 'Appearance / Visual',ccp: false },
  { id: 'custSpec',    label: 'Customer Spec Met',  ccp: true  }
];

var FG_MATS = [], CUSTOMERS = [], INSPECTORS = [];
var currentItems  = [];  // [{materialCode, materialDesc, batchPO}]
var itemCheckVals = [];  // [{fillWeight, label, seal, appearance, custSpec}]
var ipqcVal = 'Y', releaseDecision = '', savedDocNos = [];
var customerSel = {};

function init() {
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
  google.script.run
    .withSuccessHandler(function(d) {
      document.getElementById('docBadge').textContent = d.docNumber;
      FG_MATS    = d.materials;
      CUSTOMERS  = d.customers;
      INSPECTORS = d.inspectors;

      var cSel = document.getElementById('customer');
      CUSTOMERS.forEach(function(c) {
        var o = document.createElement('option');
        o.value = c.code; o.textContent = c.name;
        o.dataset.obj = JSON.stringify(c);
        cSel.appendChild(o);
      });

      var iSel = document.getElementById('inspector');
      INSPECTORS.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.name;
        o.textContent = p.name + ' — ' + p.role;
        iSel.appendChild(o);
      });
    })
    .withFailureHandler(function(e) { showToast(e.message, 'error'); })
    .getOQCFormInit();
}

function onCustomerChange() {
  var sel = document.getElementById('customer');
  var opt = sel.options[sel.selectedIndex];
  customerSel = opt && opt.dataset.obj ? JSON.parse(opt.dataset.obj) : {};
}

function addItem() {
  currentItems.push({ materialCode: '', materialDesc: '', batchPO: '' });
  itemCheckVals.push({});
  buildMatrix();
}

function removeItem(ci) {
  syncDomToState();
  currentItems.splice(ci, 1);
  itemCheckVals.splice(ci, 1);
  buildMatrix();
}

// Save current DOM input values back into currentItems before rebuild
function syncDomToState() {
  currentItems.forEach(function(item, ci) {
    var matSel   = document.getElementById('mat_sel_'   + ci);
    var batchInp = document.getElementById('batch_inp_' + ci);
    if (matSel) {
      var opt = matSel.options[matSel.selectedIndex];
      item.materialCode = matSel.value;
      item.materialDesc = opt ? (opt.dataset.desc || matSel.value) : matSel.value;
    }
    if (batchInp) item.batchPO = batchInp.value;
  });
}

function buildMatrix() {
  var head = document.getElementById('matrixHead');
  var body = document.getElementById('matrixBody');
  head.innerHTML = '';
  body.innerHTML = '';

  if (currentItems.length === 0) {
    document.getElementById('matrixTable').style.display = 'none';
    document.getElementById('matrixPlaceholder').style.display = 'block';
    document.getElementById('matrixPlaceholder').textContent = 'Click "+ Add Item" to add products.';
    return;
  }

  // --- Header row ---
  var hRow = document.createElement('tr');
  var thLabel = document.createElement('th');
  thLabel.className = 'matrix-th-label';
  thLabel.textContent = '# Check';
  hRow.appendChild(thLabel);

  currentItems.forEach(function(item, ci) {
    var th = document.createElement('th');
    th.className = 'matrix-th-item';

    var matSel = document.createElement('select');
    matSel.id = 'mat_sel_' + ci;
    matSel.className = 'col-mat-sel';
    var defOpt = document.createElement('option');
    defOpt.value = ''; defOpt.textContent = '— Select FG —';
    matSel.appendChild(defOpt);
    if (FG_MATS.length === 0) {
      var noOpt = document.createElement('option');
      noOpt.disabled = true;
      noOpt.textContent = '(No FG materials — add in Masters)';
      matSel.appendChild(noOpt);
    } else {
      FG_MATS.forEach(function(m) {
        var o = document.createElement('option');
        o.value = m.code;
        o.textContent = m.desc.length > 28 ? m.desc.substring(0, 28) + '…' : m.desc;
        o.dataset.desc = m.desc;
        if (m.code === item.materialCode) o.selected = true;
        matSel.appendChild(o);
      });
    }
    matSel.onchange = (function(colI) {
      return function() {
        var opt = this.options[this.selectedIndex];
        currentItems[colI].materialCode = this.value;
        currentItems[colI].materialDesc = opt ? (opt.dataset.desc || this.value) : this.value;
      };
    })(ci);

    var batchInp = document.createElement('input');
    batchInp.type = 'text';
    batchInp.id = 'batch_inp_' + ci;
    batchInp.className = 'col-batch-inp';
    batchInp.placeholder = 'Batch / PO';
    batchInp.value = item.batchPO || '';
    batchInp.oninput = (function(colI) {
      return function() { currentItems[colI].batchPO = this.value; };
    })(ci);

    var removeBtn = document.createElement('button');
    removeBtn.className = 'remove-col-btn';
    removeBtn.textContent = '✕ Remove';
    removeBtn.onclick = (function(colI) {
      return function() { removeItem(colI); };
    })(ci);

    th.appendChild(matSel);
    th.appendChild(batchInp);
    th.appendChild(removeBtn);
    hRow.appendChild(th);
  });
  head.appendChild(hRow);

  // --- Check rows ---
  OQC_CHECKS.forEach(function(chk, pi) {
    var tr = document.createElement('tr');
    var tdLabel = document.createElement('td');
    tdLabel.className = 'matrix-td-label';
    tdLabel.innerHTML = '<span class="param-num-sm">' + (pi + 1) + '</span>' +
      chk.label + (chk.ccp ? '<span class="ccp-star" title="Critical Control Point">★</span>' : '');
    tr.appendChild(tdLabel);

    currentItems.forEach(function(item, ci) {
      if (!itemCheckVals[ci]) itemCheckVals[ci] = {};
      var curVal = itemCheckVals[ci][chk.id] || '';
      var td = document.createElement('td');
      td.className = 'matrix-td';

      var passBtn = document.createElement('button');
      passBtn.id = 'pf_pass_' + ci + '_' + chk.id;
      passBtn.textContent = 'P';
      if (curVal === 'PASS') passBtn.className = 'pass';
      passBtn.onclick = (function(colI, checkId) {
        return function() { setCheck(colI, checkId, 'PASS', this); };
      })(ci, chk.id);

      var failBtn = document.createElement('button');
      failBtn.id = 'pf_fail_' + ci + '_' + chk.id;
      failBtn.textContent = 'F';
      if (curVal === 'FAIL') failBtn.className = 'fail';
      failBtn.onclick = (function(colI, checkId) {
        return function() { setCheck(colI, checkId, 'FAIL', this); };
      })(ci, chk.id);

      td.appendChild(passBtn);
      td.appendChild(document.createTextNode(' '));
      td.appendChild(failBtn);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  // --- Quantity rows ---
  var qtyDefs = [
    { key: 'sampleSize',  label: 'Sample Size',  editable: true  },
    { key: 'acceptedQty', label: 'Accepted Qty', editable: true  },
    { key: 'rejectedQty', label: 'Rejected Qty', editable: true  },
    { key: 'shortage',    label: 'Shortage',     editable: false }
  ];
  qtyDefs.forEach(function(qr) {
    var tr = document.createElement('tr');
    var tdLabel = document.createElement('td');
    tdLabel.className = 'matrix-td-label matrix-qty-label';
    tdLabel.textContent = qr.label;
    tr.appendChild(tdLabel);

    currentItems.forEach(function(item, ci) {
      var td = document.createElement('td');
      td.className = 'matrix-td';
      if (qr.editable) {
        var inp = document.createElement('input');
        inp.type = 'number'; inp.id = qr.key + '_' + ci;
        inp.min = '0'; inp.placeholder = '0';
        inp.oninput = (function(colI) { return function() { calcShortage(colI); }; })(ci);
        td.appendChild(inp);
      } else {
        var span = document.createElement('span');
        span.id = 'shortage_' + ci;
        span.className = 'matrix-shortage';
        span.textContent = '—';
        td.appendChild(span);
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  document.getElementById('matrixPlaceholder').style.display = 'none';
  document.getElementById('matrixTable').style.display = 'table';
}

function setCheck(colIndex, checkId, val, btn) {
  if (!itemCheckVals[colIndex]) itemCheckVals[colIndex] = {};
  itemCheckVals[colIndex][checkId] = val;
  ['pass', 'fail'].forEach(function(t) {
    var el = document.getElementById('pf_' + t + '_' + colIndex + '_' + checkId);
    if (el) el.className = '';
  });
  btn.className = val === 'PASS' ? 'pass' : 'fail';
  // Auto-suggest HOLD if any CCP fails
  var ccpIds = ['fillWeight', 'label', 'seal', 'custSpec'];
  var anyFail = itemCheckVals.some(function(colVals) {
    return colVals && ccpIds.some(function(id) { return colVals[id] === 'FAIL'; });
  });
  if (anyFail && !releaseDecision) setRelease('HOLD');
}

function calcShortage(colIndex) {
  var ss  = parseFloat((document.getElementById('sampleSize_'  + colIndex) || {}).value) || 0;
  var acc = parseFloat((document.getElementById('acceptedQty_' + colIndex) || {}).value) || 0;
  var rej = parseFloat((document.getElementById('rejectedQty_' + colIndex) || {}).value) || 0;
  var el  = document.getElementById('shortage_' + colIndex);
  if (!el) return;
  el.textContent = (ss === 0 && acc === 0 && rej === 0) ? '—' : (ss - acc - rej);
}

function setIPQC(btn, val) {
  ipqcVal = val;
  document.getElementById('ipqcY').className = '';
  document.getElementById('ipqcN').className = '';
  btn.className = val === 'Y' ? 'active-yes' : 'active-no';
}

function setRelease(val) {
  releaseDecision = val;
  ['r_rel','r_hld','r_rej'].forEach(function(id) { document.getElementById(id).className = 'disp-btn'; });
  if      (val === 'RELEASED') document.getElementById('r_rel').className = 'disp-btn active-acc';
  else if (val === 'HOLD')     document.getElementById('r_hld').className = 'disp-btn active-hld';
  else if (val === 'REJECTED') document.getElementById('r_rej').className = 'disp-btn active-rej';
}

function submitOQC() {
  if (!document.getElementById('customer').value)  { showToast('Please select a Customer.', 'error'); return; }
  if (!document.getElementById('inspector').value) { showToast('Please select an Inspector.', 'error'); return; }
  if (!releaseDecision)                            { showToast('Please select a Release Decision.', 'error'); return; }
  if (currentItems.length === 0)                   { showToast('Add at least one item first.', 'error'); return; }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  var items = currentItems.map(function(item, ci) {
    var matSel   = document.getElementById('mat_sel_'   + ci);
    var batchInp = document.getElementById('batch_inp_' + ci);
    var matCode  = matSel   ? matSel.value   : item.materialCode;
    var matOpt   = matSel   ? matSel.options[matSel.selectedIndex] : null;
    var matDesc  = matOpt && matOpt.dataset.desc ? matOpt.dataset.desc : (item.materialDesc || matCode);
    return {
      materialCode: matCode  || '',
      materialDesc: matDesc  || '',
      batchPO:      batchInp ? batchInp.value : (item.batchPO || ''),
      sampleSize:   parseFloat((document.getElementById('sampleSize_'  + ci) || {}).value) || 0,
      acceptedQty:  parseFloat((document.getElementById('acceptedQty_' + ci) || {}).value) || 0,
      rejectedQty:  parseFloat((document.getElementById('rejectedQty_' + ci) || {}).value) || 0,
      checks:       itemCheckVals[ci] || {}
    };
  });

  var data = {
    date:           document.getElementById('date').value,
    customerCode:   document.getElementById('customer').value,
    customerName:   customerSel.name || '',
    inspector:      document.getElementById('inspector').value,
    ipqcReviewed:   ipqcVal,
    aqlLevel:       document.getElementById('aqlLevel').value,
    releaseDecision:releaseDecision,
    remarks:        document.getElementById('remarks').value,
    items:          items
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        savedDocNos = res.docNos;
        showToast('✅ Saved: ' + res.docNos.join(', '), 'success');
        document.getElementById('btnWA').style.display = 'block';
        btn.innerHTML = '✅ Saved';
        setTimeout(function() { goHome(); }, 2500);
      } else {
        showToast('Error: ' + res.error, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Save OQC Record';
      }
    })
    .withFailureHandler(function(e) {
      showToast(e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Save OQC Record';
    })
    .saveOQC(data);
}

function sendWA() {
  if (!savedDocNos.length) return;
  var rec = {
    type: 'OQC', docNo: savedDocNos[0],
    date: document.getElementById('date').value,
    customer: customerSel.name || '',
    releaseDecision: releaseDecision,
    inspector: document.getElementById('inspector').value
  };
  google.script.run
    .withSuccessHandler(function(url) { window.open(url, '_blank'); })
    .getWhatsAppURLForRecord(rec);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

window.onload = init;
</script>
</body>
</html>
