<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Pack Masters QMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <?!= include('Theme') ?>
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      padding-bottom: 32px;
    }

    /* ── Section ── */
    .lnd-section {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      margin: 10px;
      overflow: hidden;
    }
    .lnd-section-title {
      background: var(--navy);
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .lnd-section-title.success-bar {
      background: var(--success);
    }
    .lnd-count-badge {
      margin-left: auto;
      background: var(--amber);
      color: var(--navy);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
    }
    .lnd-section-body {
      padding: 10px 12px;
    }

    /* ── Pending tiles ── */
    .pending-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pending-tile {
      background: var(--white);
      border-left: 3px solid var(--amber);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      min-height: 80px;
      padding: 10px 12px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    .pending-tile:active {
      transform: scale(0.97);
    }
    .pending-tile.full-width {
      grid-column: 1 / -1;
    }
    .pending-tile-module {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
    }
    .pending-tile-detail {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Skeleton pending tiles */
    .skel-pending {
      background: var(--navy-light);
      border-radius: var(--radius);
      min-height: 80px;
      animation: skeleton-pulse 0.8s ease-in-out infinite;
    }

    /* ── All-clear body ── */
    .all-clear-body {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      padding: 12px;
    }

    /* ── Module groups ── */
    .module-group { margin-bottom: 14px; }
    .module-group:last-child { margin-bottom: 0; }
    .module-group-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 0 2px 6px;
    }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .module-tile {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      min-height: 80px;
      padding: 12px 8px 10px;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .module-tile:hover {
      box-shadow: var(--shadow-2);
      border-color: rgba(13,27,110,0.2);
      transform: translateY(-1px);
    }
    .module-tile:active {
      transform: scale(0.97);
      transition: transform 0.08s ease;
    }
    .module-tile-icon {
      display: block;
      width: 22px;
      height: 22px;
      color: var(--navy);
      flex-shrink: 0;
    }
    .module-tile-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--navy);
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .module-tile-name {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .module-count-chip {
      display: inline-block;
      background: var(--navy-light);
      color: var(--navy);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      min-width: 24px;
    }
    .module-count-chip.zero {
      background: #F3F4F6;
      color: var(--muted);
    }

    /* Skeleton module tiles */
    .skel-module {
      background: var(--navy-light);
      border-radius: var(--radius);
      min-height: 72px;
      animation: skeleton-pulse 0.8s ease-in-out infinite;
    }

    /* ── Fade-in animation ── */
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-in {
      animation: fade-in 0.2s ease forwards;
    }

    /* ── Skeleton pulse ── */
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1;   }
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--danger);
      color: var(--white);
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
      cursor: pointer;
    }
    #toast.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header class="pm-header" role="banner">
  <div class="logo-box" aria-hidden="true">PM</div>
  <div class="header-text" style="flex:1;display:flex;flex-direction:column;gap:2px;">
    <span class="logo-text">Pack Masters</span>
    <span id="headerSub" class="logo-sub"></span>
  </div>
</header>

<!-- ── Main content ── -->
<main role="main">

<!-- ── Pending Actions section ── -->
<div class="lnd-section" id="pendingSection">
  <div class="lnd-section-title">
    PENDING ACTIONS
    <span class="lnd-count-badge" id="pendingBadge">…</span>
  </div>
  <div class="lnd-section-body">
    <div class="pending-grid" id="pendingGrid">
      <!-- skeleton tiles -->
      <div class="skel-pending"></div>
      <div class="skel-pending"></div>
    </div>
  </div>
</div>

<!-- ── Modules section ── -->
<div class="lnd-section" id="modulesSection">
  <div class="lnd-section-title">MODULES</div>
  <div class="lnd-section-body" id="moduleGroups">
    <div class="module-group">
      <div class="module-grid">
        <div class="skel-module"></div>
        <div class="skel-module"></div>
        <div class="skel-module"></div>
        <div class="skel-module"></div>
        <div class="skel-module"></div>
        <div class="skel-module"></div>
      </div>
    </div>
  </div>
</div>

</main>

<!-- ── Toast ── -->
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ── helpers ── */

  function navigateTo(formName) {
    google.script.run
      .withSuccessHandler(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .withFailureHandler(function () {
        showToast('Could not open ' + formName + '. Tap to retry.', true);
      })
      .getFormHtml(formName);
  }


  function getShift(hour) {
    if (hour >= 6 && hour < 14) return 'A';
    if (hour >= 14 && hour < 22) return 'B';
    return 'C';
  }

  function formatDateLine() {
    var now = new Date();
    var days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var day    = days[now.getDay()];
    var dd     = now.getDate();
    var month  = months[now.getMonth()];
    var shift  = getShift(now.getHours());
    return day + ', ' + dd + ' ' + month + ' · Shift ' + shift;
  }

  /* ── toast ── */
  var toastRetryFn = null;
  var toastEl = document.getElementById('toast');
  toastEl.addEventListener('click', function () {
    toastEl.classList.remove('show');
    if (typeof toastRetryFn === 'function') toastRetryFn();
  });

  function showToast(msg, retryFn) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastRetryFn = (typeof retryFn === 'function') ? retryFn : null;
  }

  /* ── render helpers ── */

  function renderGreeting() {
    var sub = document.getElementById('headerSub');
    if (sub) sub.textContent = formatDateLine();
  }

  function renderPending(pendingActions) {
    var section  = document.getElementById('pendingSection');
    var badge    = document.getElementById('pendingBadge');
    var grid     = document.getElementById('pendingGrid');
    var actions  = pendingActions && pendingActions.length ? pendingActions : [];

    if (actions.length === 0) {
      /* All-clear */
      section.innerHTML =
        '<div class="lnd-section-title success-bar fade-in">' +
        '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>' +
        'All Clear</div>' +
        '<div class="all-clear-body fade-in">No pending actions right now.</div>';
      return;
    }

    badge.textContent = String(actions.length);

    var tilesHtml = '';
    for (var i = 0; i < actions.length; i++) {
      var a = actions[i];
      var isLast = (i === actions.length - 1);
      var isOdd  = (actions.length % 2 !== 0);
      var full   = (isLast && isOdd) ? ' full-width' : '';
      tilesHtml +=
        '<div class="pending-tile' + full + ' fade-in" data-module="' + a.module + '">' +
        '<div class="pending-tile-module">' + a.module + '</div>' +
        '<div class="pending-tile-detail">' + a.detail + '</div>' +
        '</div>';
    }
    grid.innerHTML = tilesHtml;

    grid.addEventListener('click', function (e) {
      var tile = e.target.closest('.pending-tile');
      if (!tile) return;
      navigateTo(tile.getAttribute('data-module'));
    });
  }

  function renderModules(todayCounts) {
    var counts  = todayCounts || {};
    var icons = {
      'PO':       '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>',
      'GRN':      '<svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>',
      'IQC':      '<svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><path d="M12 3a9 9 0 100 18A9 9 0 0012 3z"/></svg>',
      'IPQC':     '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2m-3.5-7.5-1.5 1.5m-9 9-1.5 1.5m13 0-1.5-1.5m-9-9L4.5 4.5"/></svg>',
      'OQC':      '<svg viewBox="0 0 24 24"><path d="M20 7l-8 5-8-5"/><path d="M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>',
      'Gatepass': '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
      'Dispatch': '<svg viewBox="0 0 24 24"><path d="M3 7h13v10H3z"/><path d="M16 10h4l1 4v3h-5z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
      'Production': '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l5-3v14M10 21V7l5-3v17M15 21V11l5-3v13"/></svg>',
      'Records':  '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h6"/></svg>',
      'KPI':      '<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
    };
    var groups = [
      { label: 'Inbound',    modules: [{ name: 'PO', form: 'PO' }, { name: 'GRN', form: 'GRN' }, { name: 'IQC', form: 'IQC' }] },
      { label: 'In-Process', modules: [{ name: 'IPQC', form: 'IPQC' }, { name: 'Production', form: 'Production' }] },
      { label: 'Outbound',   modules: [{ name: 'OQC', form: 'OQC' }, { name: 'Gatepass', form: 'Gatepass' }, { name: 'Dispatch', form: 'Dispatch' }] },
      { label: 'Reports',    modules: [{ name: 'KPI', form: 'KPI' }, { name: 'Records', form: 'Records' }] }
    ];

    function tileHtml(m) {
      var cnt = counts[m.name];
      var chipHtml;
      if (m.name === 'Records' || m.name === 'KPI') {
        chipHtml = '<span class="module-count-chip">→</span>';
      } else if (cnt === 0 || cnt === '0') {
        chipHtml = '<span class="module-count-chip zero">0</span>';
      } else {
        chipHtml = '<span class="module-count-chip">' + (cnt != null ? String(cnt) : '0') + '</span>';
      }
      var iconSvg = icons[m.name] || '';
      return '<div class="module-tile fade-in" data-form="' + m.form + '" role="button" aria-label="Open ' + m.name + '">' +
        '<span class="module-tile-icon" aria-hidden="true">' + iconSvg + '</span>' +
        '<span class="module-tile-name">' + m.name + '</span>' +
        chipHtml + '</div>';
    }

    var html = '';
    for (var g = 0; g < groups.length; g++) {
      var grp = groups[g];
      var tiles = '';
      for (var j = 0; j < grp.modules.length; j++) tiles += tileHtml(grp.modules[j]);
      html += '<div class="module-group">' +
              '<div class="module-group-label">' + grp.label + '</div>' +
              '<div class="module-grid">' + tiles + '</div>' +
              '</div>';
    }

    var container = document.getElementById('moduleGroups');
    container.innerHTML = html;

    container.addEventListener('click', function (e) {
      var tile = e.target.closest('.module-tile');
      if (!tile) return;
      navigateTo(tile.getAttribute('data-form'));
    });
  }

  /* ── main render ── */

  function renderLanding(result) {
    if (!result) return;
    renderGreeting();
    renderPending(result.pendingActions);
    renderModules(result.todayCounts);
  }

  function loadState() {
    google.script.run
      .withSuccessHandler(renderLanding)
      .withFailureHandler(function () {
        showToast('Could not load shift data. Tap to retry.', loadState);
      })
      .getQmsLandingState();
  }

  loadState();

}());
</script>

</body>
</html>
