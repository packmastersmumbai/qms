    .count-chip.iqc-chip .cc-lbl { color: #1D4ED8; }

<script>
// ── Toast helper ──
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ── Navigate to a form ──
function goForm(type) {
  var btn = document.getElementById('btn-' + type);
  if (btn) { btn.classList.add('loading'); }
  google.script.run
    .withSuccessHandler(function(html) {
      document.open();
      document.write(html);
      document.close();
    })
    .withFailureHandler(function(err) {
      if (btn) btn.classList.remove('loading');
      showToast('Could not open ' + type, 'error');
      console.error(err);
    })
    .getFormHtml(type);
}

// ── Wire action buttons ──
['GRN', 'IQC', 'IPQC', 'OQC', 'Gatepass', 'Records'].forEach(function(type) {
  var btn = document.getElementById('btn-' + type);
  if (btn) {
    btn.addEventListener('click', function() { goForm(type); });
  }
});

// ── Populate state from server ──
function applyState(result) {
  document.getElementById('loadOverlay').classList.add('hidden');

  if (!result || result.authenticated === false) {
    // Redirect to DWM login, passing from=qms so it returns here after auth
    window.location.href = '?app=dwm&login=1&from=qms';
    return;
  }

  // Operator chip
  var nameEl = document.getElementById('operatorName');
  nameEl.textContent = result.operatorName || 'Operator';
  document.getElementById('operatorChip').classList.remove('loading');

  // Today counts
  var counts = result.todayCounts || {};
  document.getElementById('cntGrn').textContent = counts['GRN_LOG'] != null ? counts['GRN_LOG'] : '0';
  document.getElementById('cntIqc').textContent = counts['IQC_LOG'] != null ? counts['IQC_LOG'] : '0';
  document.getElementById('cntOqc').textContent = counts['OQC_LOG'] != null ? counts['OQC_LOG'] : '0';
}

// ── On load: retrieve sessionId and call server ──
window.addEventListener('load', function() {
  var sessionId = sessionStorage.getItem('dwmSessionId') || '';

  // Even without a sessionId, call the server — it will return authenticated:false
  google.script.run
    .withSuccessHandler(applyState)
    .withFailureHandler(function(err) {
      document.getElementById('loadOverlay').classList.add('hidden');
      showToast('Could not load session state', 'error');
      console.error(err);
    })
    .getQmsLandingState(sessionId);
});
</script>
