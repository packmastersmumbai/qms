<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pack Masters QMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Tokens sourced from DESIGN.md — kept as legacy --pm-* names for in-file refs */
    :root {
      --pm-navy:    #0D1B6E;   /* DESIGN.md primary */
      --pm-navy-2:  #1A2D9E;   /* DESIGN.md primary-hover */
      --pm-sky:     #0070F3;   /* DESIGN.md link */
      --pm-bg:      #F5F7FA;   /* DESIGN.md canvas */
      --pm-card:    #FFFFFF;
      --pm-border:  #E5E7EB;   /* DESIGN.md hairline */
      --pm-rule:    #EEF1F5;
      --pm-text:    #0F172A;
      --pm-muted:   #6B7280;
      --pm-faint:   #94A3B8;
      --pm-pass:    #16A34A;
      --pm-fail:    #DC2626;
      --pm-warn:    #F97316;
      --pm-hold:    #D97706;
      --pm-prog:    #2563EB;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--pm-bg);
      color: var(--pm-text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      font-size: 13px;
    }
    h1, h2, h3, .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    button { font-family: inherit; cursor: pointer; }

    /* ──────────────────────────────────────────────────────────────
       LAYOUT BREAKPOINTS
       Mobile  : <  768px — single 430px column, fixed top bar + bottom nav
       Tablet  : 768-1023 — wider column 640px, no two-pane yet
       Desktop : >= 1024px — two-pane (main 720, aside 320), no bottom nav,
                 top bar spans full width.
       ────────────────────────────────────────────────────────────── */

    /* Shell — mobile */
    .pm-shell { max-width: 430px; margin: 0 auto; position: relative; }

    /* ── Top bar ── */
    .pm-top {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: 48px; z-index: 50;
      background: var(--pm-navy);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    }
    .pm-top-btn {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; background: transparent; border: 0;
      transition: background .15s ease;
    }
    .pm-top-btn:hover { background: rgba(255,255,255,0.10); }
    .pm-top-btn svg { width: 18px; height: 18px; }
    .pm-top-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff; font-weight: 700; font-size: 14px;
      letter-spacing: 0.3px;
      display: flex; align-items: center; gap: 8px;
    }
    .pm-top-title small {
      color: rgba(255,255,255,0.55);
      font-weight: 600; font-size: 9px;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 6px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 4px;
    }

    /* ── Bottom nav ── */
    .pm-bn {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: 52px; z-index: 50;
      background: #fff; border-top: 1px solid var(--pm-border);
      display: grid; grid-template-columns: repeat(5, 1fr);
    }
    .pm-bn-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      background: transparent; border: 0;
      color: var(--pm-faint);
      font-size: 9.5px; font-weight: 600;
      letter-spacing: 0.2px;
      transition: color .15s ease;
    }
    .pm-bn-btn.is-active { color: var(--pm-sky); }
    .pm-bn-btn svg { width: 18px; height: 18px; stroke-width: 1.75; }
    .pm-bn-btn.is-active svg { stroke-width: 2.2; }

    main { padding: 52px 10px 68px; }

    /* ── Hero band ──
       Replaces the old flat date strip. Sits flush under the top bar,
       carries date + shift + persona pill in a single navy-ink panel.
       Gives the page an anchor without competing with the tiles. */
    .pm-hero {
      margin: 0 -10px 8px;
      padding: 10px 12px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F5F7FA 100%);
      border-bottom: 1px solid var(--pm-rule);
    }
    .pm-hero-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pm-hero-date {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px; font-weight: 700;
      color: var(--pm-text);
      letter-spacing: -0.2px;
      line-height: 1.15;
    }
    .pm-hero-day {
      font-size: 10px; font-weight: 500;
      color: var(--pm-muted);
      margin-top: 1px;
      letter-spacing: 0.2px;
    }
    .pm-hero-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .pm-shift {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; font-weight: 700;
      color: var(--pm-navy);
      background: #EEF1FA;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    /* ── Hairline rule ── */
    .pm-rule {
      height: 1px;
      background: linear-gradient(to right, var(--pm-rule), transparent);
      margin: 6px 0;
    }

    /* ── Section label ──
       Slightly larger (10.5px) with a 4px navy dot prefix so groups
       scan as separate phases (Receive / Make / Ship / Resolve / Manage)
       without leaning on colored cards. */
    .pm-sec {
      display: flex; align-items: center; justify-content: space-between;
      margin: 10px 2px 4px;
    }
    .pm-sec-l {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10.5px; font-weight: 700;
      color: var(--pm-muted);
      letter-spacing: 1.6px; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .pm-sec-l::before {
      content: '';
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--pm-navy);
      opacity: 0.85;
    }
    .pm-sec-link {
      font-size: 11.5px; font-weight: 600; color: var(--pm-sky);
      background: transparent; border: 0; padding: 0;
    }
    .pm-sec-link:hover { text-decoration: underline; }
    /* Collapsible section header */
    .pm-sec-toggle { display:flex; align-items:center; gap:5px; background:transparent; border:0; padding:0; cursor:pointer; }
    .pm-sec-chev { width:12px; height:12px; color:var(--pm-faint); transition:transform .15s ease; transform:rotate(90deg); }
    .pm-sec.collapsed .pm-sec-chev { transform:rotate(0deg); }
    .pm-collapse-body { overflow:hidden; transition:max-height .2s ease, opacity .15s ease; }
    .pm-collapse-body.collapsed { max-height:0 !important; opacity:0; }

    /* ── Alerts (compact stacked rows, NOT a wall) ──
       Old design used 10 boxed amber cards stacking vertically — they ate
       half the viewport. New rows are 36px hairline rows on the page
       background with a single thin amber-left bar, separated by 1px
       rules. Reads as a list, not a warning wall. */
    .pm-alert-list {
      display: flex; flex-direction: column;
      margin: 0 0 6px;
      background: #fff;
      border: 1px solid #FDE9CF;
      border-radius: 10px;
      overflow: hidden;
    }
    .pm-alert-list .pm-alert-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: #FFF7ED;
      border-bottom: 1px solid #FDE9CF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10.5px; font-weight: 700;
      color: #9A3412;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .pm-alert-head svg { width: 13px; height: 13px; stroke-width: 2; }
    .pm-alert-head-count {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 700;
      background: #FFEDD5; color: #9A3412;
      padding: 2px 8px; border-radius: 999px;
      letter-spacing: 0;
    }
    .pm-alert {
      display: flex; align-items: center; gap: 10px;
      background: transparent;
      border: 0; border-bottom: 1px solid var(--pm-rule);
      border-left: 3px solid var(--pm-warn);
      padding: 9px 12px;
      min-height: 44px;
      color: var(--pm-text);
      width: 100%; box-sizing: border-box;
      text-align: left;
      cursor: pointer;
      transition: background .12s ease;
    }
    .pm-alert:last-child { border-bottom: 0; }
    .pm-alert:hover { background: #FFFBF5; }
    .pm-alert:active { background: #FFF7ED; }
    .pm-alert-icon { display: none; }  /* icon now lives in the header */
    .pm-alert-body { flex: 1; min-width: 0; }
    .pm-alert-text {
      font-size: 12.5px; font-weight: 600; line-height: 1.3;
      color: var(--pm-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pm-alert-refs {
      font-size: 10.5px; color: var(--pm-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pm-alert-chev { flex-shrink: 0; color: var(--pm-faint); }
    .pm-alert-chev svg { width: 14px; height: 14px; stroke-width: 2; }
    .pm-alert-more {
      width: 100%;
      background: #FFF7ED; border: 0;
      border-top: 1px solid #FDE9CF;
      color: #9A3412;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase;
      padding: 9px;
      cursor: pointer;
    }
    .pm-alert-more:hover { background: #FFEDD5; }

    /* ── Stat strip ── */
    .pm-stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: #fff;
      border: 1px solid var(--pm-border);
      border-radius: 10px;
      overflow: hidden;
      min-height: 44px;
    }
    .pm-stat {
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 8px 4px;
      background: transparent; border: 0;
      border-right: 1px solid var(--pm-rule);
      transition: background .12s ease;
    }
    .pm-stat:last-child { border-right: 0; }
    .pm-stat:hover { background: #f8fafc; }
    .pm-stat:active { background: #f1f5f9; }
    .pm-stat-icon {
      width: 14px; height: 14px;
      color: var(--pm-muted);
      flex-shrink: 0;
    }
    .pm-stat-icon svg { width: 100%; height: 100%; stroke-width: 1.8; }
    .pm-stat-label {
      font-size: 9.5px; font-weight: 700;
      color: var(--pm-muted);
      letter-spacing: 0.6px; text-transform: uppercase;
    }
    .pm-stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 700;
      color: var(--pm-navy);
      letter-spacing: -0.3px;
      line-height: 1;
    }
    .pm-stat.is-fail .pm-stat-val { color: var(--pm-fail); }
    .pm-stat.is-warn .pm-stat-icon { color: var(--pm-warn); }
    .pm-stat.is-warn .pm-stat-val { color: var(--pm-warn); }

    /* ── Module tile grid (compact) ── */
    .pm-group { margin-top: 2px; margin-bottom: 6px; }
    .pm-tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .pm-tile {
      position: relative;
      display: flex; flex-direction: column;
      gap: 4px;
      padding: 7px 8px 8px;
      min-height: 68px;
      background: #fff;
      border: 1px solid var(--pm-border);
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      transition: border-color .12s ease, box-shadow .12s ease, transform .08s ease;
      overflow: visible;
    }
    .pm-tile:hover {
      border-color: var(--pm-navy);
      box-shadow: 0 1px 4px rgba(13,27,110,0.08), 0 4px 12px rgba(13,27,110,0.07);
      transform: translateY(-1px);
    }
    .pm-tile:active { transform: scale(0.98); }
    .pm-tile-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 4px;
    }
    .pm-tile-icon {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: #EEF1FA;
      color: var(--pm-navy);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .pm-tile-icon svg { width: 12px; height: 12px; stroke-width: 1.9; }
    /* Group-tinted icon backgrounds. Subtle so the page stays neutral
       but you can tell Receive from Ship from Resolve at a glance. */
    .pm-tile[data-group="Receive"] .pm-tile-icon { background: #E0F2FE; color: #0369A1; }
    .pm-tile[data-group="Make"]    .pm-tile-icon { background: #EDE9FE; color: #6D28D9; }
    .pm-tile[data-group="Ship"]    .pm-tile-icon { background: #DCFCE7; color: #15803D; }
    .pm-tile[data-group="Resolve"] .pm-tile-icon { background: #FEE2E2; color: #B91C1C; }
    .pm-tile[data-group="Manage"]  .pm-tile-icon { background: #EEF1FA; color: var(--pm-navy); }
    .pm-tile-count {
      flex-shrink: 0;
      min-width: 18px; height: 17px;
      padding: 0 5px;
      display: inline-flex; align-items: center; justify-content: center;
      background: #EEF1FA;
      color: var(--pm-navy);
      border: 0; border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; font-weight: 700;
      cursor: pointer;
      transition: background .12s ease;
    }
    .pm-tile-count:hover { background: #DBE4F7; }
    .pm-tile-count.is-zero { background: transparent; color: var(--pm-faint); }
    .pm-tile-count.is-attn { background: #FEF3C7; color: #B45309; }
    .pm-tile-count.is-na { background: transparent; color: var(--pm-faint); }
    .pm-tile-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px; font-weight: 700;
      color: var(--pm-text);
      letter-spacing: 0px;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .pm-tile-meta {
      font-size: 9px; font-weight: 500;
      color: var(--pm-muted);
      line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pm-tile-add {
      position: absolute; top: 6px; right: 6px;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      background: var(--pm-sky);
      color: #fff;
      border: 0; border-radius: 5px;
      font-size: 13px; font-weight: 600; line-height: 1;
      cursor: pointer;
      transition: background .12s ease;
    }
    .pm-tile-add:hover { background: var(--pm-navy-2); }

    /* Tile statuses */
    .pm-tile.has-pending { border-left: 3px solid var(--pm-hold); }
    .pm-tile.has-fail    { border-left: 3px solid var(--pm-fail); }

    /* ── Activity row ── */
    .pm-act-card {
      background: #fff;
      border: 1px solid var(--pm-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .pm-act {
      display: flex; align-items: center;
      gap: 10px;
      padding: 9px 8px 9px 0;
      min-height: 44px;
      background: transparent; border: 0; width: 100%;
      border-bottom: 1px solid var(--pm-rule);
      position: relative;
      text-align: left;
      cursor: pointer;
      transition: background .12s ease;
    }
    .pm-act:last-child { border-bottom: 0; }
    .pm-act:hover { background: #f8fafc; }
    .pm-act::before {
      content: ''; flex-shrink: 0;
      width: 3px; align-self: stretch;
      background: var(--pm-faint);
      margin-right: 8px;
    }
    .pm-act.s-pass::before { background: var(--pm-pass); }
    .pm-act.s-fail::before { background: var(--pm-fail); }
    .pm-act.s-warn::before { background: var(--pm-warn); }
    .pm-act.s-hold::before { background: var(--pm-hold); }
    .pm-act.s-prog::before { background: var(--pm-prog); }
    .pm-act-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 700;
      color: var(--pm-navy);
      letter-spacing: -0.2px;
      flex-shrink: 0;
    }
    .pm-act-mid { flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 6px;
      overflow: hidden;
    }
    .pm-act-status {
      flex-shrink: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 3px;
      letter-spacing: 0.3px;
    }
    .pm-act-status.s-pass { background: #dcfce7; color: #15803d; }
    .pm-act-status.s-fail { background: #fee2e2; color: #b91c1c; }
    .pm-act-status.s-warn { background: #ffedd5; color: #9a3412; }
    .pm-act-status.s-hold { background: #fef9c3; color: #854d0e; }
    .pm-act-status.s-prog { background: #dbeafe; color: #1e40af; }
    .pm-act-status.s-grey { background: #f1f5f9; color: var(--pm-muted); }
    .pm-act-time {
      font-size: 10px; color: var(--pm-faint);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pm-act-chev {
      width: 14px; height: 14px;
      color: var(--pm-faint);
      flex-shrink: 0; margin-right: 2px;
    }
    .pm-act-chev svg { width: 100%; height: 100%; stroke-width: 1.8; }

    /* ── Skeleton ── */
    @keyframes pm-shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    .pm-skel {
      display: inline-block;
      background: linear-gradient(90deg, #eef2f7 25%, #dde3eb 50%, #eef2f7 75%);
      background-size: 200% 100%;
      animation: pm-shimmer 1.6s ease-in-out infinite;
      border-radius: 4px;
      color: transparent;
      vertical-align: middle;
    }

    /* ── Reveal animation ── */
    @keyframes pm-rise {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pm-rise { animation: pm-rise .3s cubic-bezier(.22, 1, .36, 1) both; }

    /* ── Loader (clipboard aesthetic, per DESIGN.md) ─────────────
       Flat canvas, small navy spinner, indeterminate progress hairline.
       No gradients, no glow, no conveyor animation. */
    .pm-loader {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--pm-bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .pm-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .pm-loader-logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--pm-text);
      font-size: 14px; font-weight: 700; letter-spacing: 0.2px;
      display: flex; align-items: center; gap: 10px;
    }
    .pm-loader-logo .pm-logo-mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--pm-navy);
      display: flex; align-items: center; justify-content: center;
    }
    .pm-loader-logo svg { width: 14px; height: 14px; color: #fff; stroke-width: 2; }
    .pm-loader-sub {
      color: var(--pm-muted);
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.4px; text-transform: uppercase;
    }
    .pm-belt {
      position: relative;
      width: 160px; height: 2px;
      overflow: hidden;
      background: var(--pm-border);
      border-radius: 999px;
    }
    /* Suppress legacy belt boxes — keep nodes for backward DOM compat */
    .pm-belt-track, .pm-belt-box { display: none !important; }
    .pm-belt-progress {
      position: absolute; top: 0; left: 0;
      height: 100%; width: 0%;
      background: var(--pm-navy);
      transition: width .4s ease;
    }
    /* Indeterminate sweep when no explicit progress is set */
    .pm-belt-progress.indeterminate {
      width: 30% !important;
      animation: pm-belt-sweep 1.4s ease-in-out infinite;
    }
    @keyframes pm-belt-sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(360%); }
    }
    @keyframes pm-spin { to { transform: rotate(360deg); } }

    /* Toast */
    #toast {
      position: fixed; left: 50%; transform: translateX(-50%) translateY(8px);
      bottom: 70px;
      background: var(--pm-navy); color: #fff;
      padding: 9px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      box-shadow: 0 8px 22px rgba(15,23,42,0.25);
      opacity: 0; pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 9998; white-space: nowrap; max-width: 92vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    #toast.error { background: var(--pm-fail); }

    /* Operator picker (compact) */
    #opModal { position:fixed; inset:0; background:rgba(30,58,95,0.75); z-index:99990; display:flex; align-items:flex-end; justify-content:center; }
    #opModal.hidden { display:none; }
    .op-sheet { background:#fff; border-radius:14px 14px 0 0; width:100%; max-width:430px; padding:18px 14px 28px; }
    .op-names-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; max-height:260px; overflow-y:auto; margin-bottom:12px; }
    .op-name-btn { min-height:40px; border:1.5px solid var(--pm-border); border-radius:6px; background:#fff; font-size:12.5px; font-weight:600; color:var(--pm-text); text-align:left; padding:6px 10px; transition:background .12s, border-color .12s; }
    .op-name-btn.op-selected, .op-name-btn:active { background:#eff6ff; border-color:var(--pm-navy); color:var(--pm-navy); }
    .op-confirm-btn { width:100%; min-height:44px; background:var(--pm-navy); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:700; }
    .op-confirm-btn:disabled { background:var(--pm-faint); cursor:not-allowed; }

    /* GAS banner cover */
    #__gas_cover__ { position:fixed; bottom:0; left:0; right:0; height:30px; background:var(--pm-bg); z-index:2147483647; pointer-events:none; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .pm-rise, .pm-skel, .pm-belt-box, .pm-loader { animation: none !important; transition: none !important; }
    }
    /* Hero KPI strip */
    .pm-kpi-hero { display:grid; grid-template-columns: repeat(3, 1fr); gap:5px; }
    .pm-kpi-card {
      background:#fff;
      border:1px solid var(--pm-border);
      border-left:3px solid var(--pm-border);
      border-radius:8px;
      padding:7px 8px 8px;
      display:flex; flex-direction:column; gap:2px;
      cursor:pointer;
      transition: background .12s, border-color .12s;
      position:relative; overflow:hidden;
    }
    .pm-kpi-card:hover { background:#fafbfc; border-color:var(--pm-muted); }
    .pm-kpi-card.is-err { border-color:#fed7aa; background:#fff7ed; }
    .pm-kpi-card.s-good { border-left-color:var(--pm-pass); }
    .pm-kpi-card.s-bad  { border-left-color:var(--pm-fail); }
    .pm-kpi-card.s-warn { border-left-color:#d97706; }
    .pm-kpi-card.s-na   { border-left-color:#cbd5e1; }
    .pm-kpi-top { display:flex; justify-content:space-between; align-items:center; gap:4px; }
    .pm-kpi-label {
      font-family:'Plus Jakarta Sans', sans-serif;
      font-size:8.5px; font-weight:700;
      color:var(--pm-muted);
      letter-spacing:.8px; text-transform:uppercase;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .pm-kpi-mid { display:flex; align-items:baseline; gap:2px; margin-top:1px; }
    .pm-kpi-val {
      font-family:'JetBrains Mono', monospace;
      font-size:17px; font-weight:700;
      color:var(--pm-text);
      letter-spacing:-0.5px; line-height:1.05;
    }
    .pm-kpi-unit { font-size:9px; color:var(--pm-muted); font-weight:600; }
    .pm-kpi-note {
      font-size:8.5px; font-weight:500;
      color:var(--pm-muted);
      line-height:1.2;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .pm-kpi-note.s-good { color:var(--pm-pass); }
    .pm-kpi-note.s-bad  { color:var(--pm-fail); }
    .pm-kpi-note.s-warn { color:#b45309; }
    .pm-kpi-note.s-na   { color:var(--pm-faint); }
    .pm-kpi-empty { grid-column:1/-1; padding:10px; text-align:center; color:var(--pm-muted); font-size:11px; background:#fff; border:1px dashed var(--pm-border); border-radius:8px; }
    /* Drill tiles */
    .pm-kpi-drill { display:grid; grid-template-columns: repeat(3, 1fr); gap:5px; }
    .pm-kpi-drow { background:#fff; border:1px solid var(--pm-border); border-left-width:3px; border-radius:8px; padding:5px 7px; display:flex; flex-direction:column; gap:1px; overflow:hidden; }
    .pm-kpi-drow.is-err { border-color:#fed7aa; background:#fff7ed; }
    .pm-kpi-drow.s-good { border-left-color:var(--pm-pass); }
    .pm-kpi-drow.s-bad  { border-left-color:var(--pm-fail); }
    .pm-kpi-drow.s-warn { border-left-color:#d97706; }
    .pm-kpi-drow.s-na   { border-left-color:#cbd5e1; }
    .pm-kpi-dlbl { font-size:8.5px; font-weight:700; color:var(--pm-muted); letter-spacing:0.4px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pm-kpi-dsub { font-size:8.5px; font-weight:600; color:var(--pm-faint); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pm-kpi-dsub.s-good { color:var(--pm-pass); }
    .pm-kpi-dsub.s-bad  { color:var(--pm-fail); }
    .pm-kpi-dsub.s-warn { color:#d97706; }
    .pm-kpi-dval { font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:800; color:var(--pm-navy); letter-spacing:-0.5px; line-height:1.1; }
    .pm-kpi-dval.is-good { color: var(--pm-pass); }
    .pm-kpi-dval.is-bad { color: var(--pm-fail); }

    /* ══════════════════════════════════════════════════════════════
       TABLET (>= 640px) — wider column, no two-pane yet
       ════════════════════════════════════════════════════════════ */
    @media (min-width: 640px) and (max-width: 1023px) {
      .pm-shell { max-width: 640px; }
      .pm-top   { max-width: 640px; }
      .pm-bn    { max-width: 640px; }
      .pm-tiles { grid-template-columns: repeat(4, 1fr); }
      .pm-kpi-hero { grid-template-columns: repeat(4, 1fr); }
    }

    /* ══════════════════════════════════════════════════════════════
       DESKTOP (>= 1024px) — two-pane, no bottom nav, hero is sidebar
       ════════════════════════════════════════════════════════════ */
    @media (min-width: 1024px) {
      body { background: var(--pm-bg); }

      /* Top bar spans full width with content centered */
      .pm-top {
        max-width: none;
        left: 0; right: 0; transform: none;
        padding: 0 24px;
        height: 56px;
        justify-content: flex-start;
        gap: 16px;
      }
      .pm-top-title { font-size: 16px; flex: 0 0 auto; }
      .pm-top > div:last-child { margin-left: auto; }
      .pm-top-btn { width: 38px; height: 38px; }
      .pm-top-btn svg { width: 20px; height: 20px; }

      /* Bottom nav hidden on desktop */
      .pm-bn { display: none !important; }

      /* Shell becomes the two-pane grid. Width sized for comfortable
         reading at 1440px+ monitors without going edge-to-edge on 4K. */
      .pm-shell {
        max-width: 1280px;
        padding: 0 28px;
      }
      main {
        padding: 76px 0 32px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        grid-template-areas:
          "hero  hero"
          "alert aside"
          "mods  aside"
          "recent aside";
        column-gap: 28px;
        row-gap: 16px;
        align-items: start;
      }
      .pm-hero        { grid-area: hero; }
      #alertList      { grid-area: alert; }
      #moduleGroups   { grid-area: mods; }
      #recentSection  { grid-area: recent; }
      #pmAside        { grid-area: aside; align-self: start; display: flex; flex-direction: column; gap: 6px; }
      /* Hero spans full width above the two columns. White card with
         hairline + soft shadow so it stands out against the canvas. */
      .pm-hero {
        margin: 0;
        grid-column: 1 / -1;
        grid-row: 1;
        padding: 20px 24px;
        background: #FFFFFF;
        border: 1px solid var(--pm-border);
        border-radius: 14px;
        box-shadow: 0 1px 4px rgba(13,27,110,0.06);
      }
      .pm-hero-date { font-size: 24px; letter-spacing: -0.4px; }
      .pm-hero-day  { font-size: 13px; }
      .pm-shift     { font-size: 11px; padding: 6px 14px; }

      /* Sidebar section headers hug their bodies (no top margin) so
         the KPI stack reads as a single column unit. */
      #pmAside .pm-sec:first-child { margin-top: 0; }
      #pmAside .pm-sec { margin: 8px 2px 6px; }

      /* Tile grid — desktop */
      .pm-tiles { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .pm-tile { min-height: 76px; padding: 9px 10px; }
      .pm-tile-icon { width: 24px; height: 24px; }
      .pm-tile-icon svg { width: 13px; height: 13px; }
      .pm-tile-label { font-size: 12px; }
      .pm-tile-meta { font-size: 9.5px; }
      .pm-tile-count { height: 19px; font-size: 10px; min-width: 20px; }

      /* KPI sidebar — 2-col grid to avoid tall single-column stack */
      .pm-kpi-hero  { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .pm-kpi-card  { padding: 8px 10px; }
      .pm-kpi-val   { font-size: 18px; }
      .pm-kpi-drill { grid-template-columns: repeat(2, 1fr); gap: 5px; }

      /* Section labels look heavier on desktop */
      .pm-sec-l { font-size: 11px; }

      /* Alerts list sits to the right; less aggressive cap */
      .pm-alert-list { margin-bottom: 12px; }

      /* Recent activity card */
      .pm-act-card {
        background: #fff;
        border: 1px solid var(--pm-border);
        border-radius: 12px;
      }
      .pm-act { padding-left: 12px; padding-right: 12px; }
    }

    /* Loader sits over everything regardless of viewport */
    .pm-loader { width: 100vw; }

    /* ══════════════════════════════════════════════════════════════
       SIDE MENU DRAWER (mobile + desktop)
       Triggered by the hamburger button in the top bar.
       Mobile: slides in from the left, full 280px width.
       Desktop: same drawer, used when user explicitly opens it.
       ════════════════════════════════════════════════════════════ */
    .pm-menu-backdrop {
      position: fixed; inset: 0;
      background: rgba(13,27,110,0.45);
      z-index: 9990;
      opacity: 0; visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
    }
    .pm-menu-backdrop.is-open { opacity: 1; visibility: visible; }
    .pm-menu {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 284px; max-width: 84vw;
      background: #fff;
      z-index: 9991;
      transform: translateX(-100%);
      transition: transform .25s cubic-bezier(.22,1,.36,1);
      display: flex; flex-direction: column;
      box-shadow: 4px 0 24px rgba(13,27,110,0.18);
    }
    .pm-menu.is-open { transform: translateX(0); }
    .pm-menu-head {
      padding: 18px 18px 14px;
      background: var(--pm-navy);
      color: #fff;
      display: flex; align-items: center; gap: 12px;
    }
    .pm-menu-head-mark {
      width: 36px; height: 36px;
      border-radius: 9px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.20);
      display: flex; align-items: center; justify-content: center;
    }
    .pm-menu-head-mark svg { width: 18px; height: 18px; color: #fff; }
    .pm-menu-head-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.2px;
    }
    .pm-menu-head-sub {
      font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1px; text-transform: uppercase;
      margin-top: 2px;
    }
    .pm-menu-body {
      flex: 1; overflow-y: auto;
      padding: 8px 0 16px;
    }
    .pm-menu-section {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px; font-weight: 700;
      color: var(--pm-muted);
      letter-spacing: 1.4px; text-transform: uppercase;
      padding: 14px 18px 6px;
    }
    .pm-menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 18px;
      background: transparent; border: 0;
      width: 100%; text-align: left;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px; font-weight: 600;
      color: var(--pm-text);
      transition: background .12s ease;
    }
    .pm-menu-item:hover { background: var(--pm-bg); }
    .pm-menu-item.is-current { background: #EEF1FA; color: var(--pm-navy); }
    .pm-menu-item-icon {
      width: 18px; height: 18px;
      color: var(--pm-muted);
      flex-shrink: 0;
    }
    .pm-menu-item.is-current .pm-menu-item-icon { color: var(--pm-navy); }
    .pm-menu-item-icon svg { width: 100%; height: 100%; stroke-width: 1.9; }
    .pm-menu-item-meta {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 700;
      color: var(--pm-muted);
      background: var(--pm-bg);
      padding: 2px 7px; border-radius: 999px;
    }
    .pm-menu-foot {
      padding: 12px 18px;
      border-top: 1px solid var(--pm-rule);
      font-size: 10.5px; color: var(--pm-muted);
      font-family: 'JetBrains Mono', monospace;
      display: flex; justify-content: space-between; align-items: center;
    }

    /* ══════════════════════════════════════════════════════════════
       DESKTOP TOP-NAV LINKS
       Inline nav in the top bar (replaces bottom nav, hidden < 1024px).
       ════════════════════════════════════════════════════════════ */
    .pm-topnav { display: none; }
    @media (min-width: 1024px) {
      .pm-topnav {
        display: flex; align-items: center; gap: 2px;
        margin-left: 24px;
      }
      .pm-topnav-btn {
        display: inline-flex; align-items: center; gap: 8px;
        height: 36px; padding: 0 14px;
        background: transparent; border: 0;
        color: rgba(255,255,255,0.75);
        font-family: 'Inter', sans-serif;
        font-size: 13px; font-weight: 600;
        letter-spacing: 0.1px;
        border-radius: 8px;
        cursor: pointer;
        transition: background .12s ease, color .12s ease;
      }
      .pm-topnav-btn:hover { background: rgba(255,255,255,0.10); color: #fff; }
      .pm-topnav-btn.is-active {
        background: rgba(255,255,255,0.15);
        color: #fff;
      }
      .pm-topnav-btn svg { width: 16px; height: 16px; stroke-width: 1.9; }
    }
  </style>

<script>
(function () {
  'use strict';

  /* ═════════════ CONFIG ═════════════ */
  var CACHE_KEY = 'pmqms_landing_v6';
  var ALERTS_VISIBLE = 3;  // Collapse beyond this; user can expand
  var CACHE_TTL_MS = 12 * 60 * 60 * 1000;

  /* ═════════════ HELPERS ═════════════ */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function getShift(h) {
    if (h >= 6 && h < 14) return 'A';
    if (h >= 14 && h < 22) return 'B';
    return 'C';
  }

  /* ── Date + shift (hero band) ── */
  (function () {
    var now = new Date();
    var dayShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var dayLong  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months   = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var dl = $('dateLine');
    if (dl) dl.textContent = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    var dy = $('dayLine');
    if (dy) dy.textContent = dayLong[now.getDay()];
    var sp = $('shiftPill');
    if (sp) sp.textContent = 'SHIFT ' + getShift(now.getHours());
  }());

  /* ═════════════ TOAST ═════════════ */
  var _toastTimer = null;
  var toastEl = $('toast');
  function showToast(msg, isError) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.className = isError ? 'show error' : 'show';
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function () { toastEl.className = isError ? 'error' : ''; }, 2800);
  }
  window.showToast = showToast;

  /* ═════════════ NAVIGATION + PREFETCH ═════════════ */
  var _prefetchCache = {};
  function navigateTo(formName, opts) {
    // Pass an intent hint (e.g. {mode:'new'}) to the target form via sessionStorage.
    // Forms opt in by reading sessionStorage.pmFormIntent on boot.
    try {
      if (opts && opts.mode) {
        sessionStorage.setItem('pmFormIntent', JSON.stringify({ form: formName, mode: opts.mode }));
      } else {
        sessionStorage.removeItem('pmFormIntent');
      }
    } catch (e) {}
    // Prefer shared sessionStorage-backed cache (survives across pages)
    if (window.PMHtmlCache && typeof window.PMHtmlCache.navigate === 'function') {
      window.PMHtmlCache.navigate(formName);
      return;
    }
    if (_prefetchCache[formName]) {
      var html = _prefetchCache[formName];
      document.open(); document.write(html); document.close();
      return;
    }
    showLoader('Opening ' + formName);
    google.script.run
      .withSuccessHandler(function (html) { document.open(); document.write(html); document.close(); })
      .withFailureHandler(function () { hideLoader(); showToast('Could not open ' + formName, true); })
      .getFormHtml(formName);
  }
  window.navigateTo = navigateTo;

  /* Records with module filter — passes via sessionStorage */
  function navigateToRecords(moduleName, opts) {
    try {
      sessionStorage.setItem('pmRecordsFilter', moduleName);
      opts = opts || {};
      // Default: when coming from a tile, show all-time (so pending old records appear)
      sessionStorage.setItem('pmRecordsPeriod', opts.period || 'ALL');
      if (opts.pendingOnly) sessionStorage.setItem('pmRecordsPendingOnly', '1');
    } catch (e) {}
    navigateTo('Records');
  }
  window.navigateToRecords = navigateToRecords;

  /* Open a single document detail view directly.
   * Mapped types (GRN/IQC/OQC/Gatepass) → DocView_F via getDocViewHtml(type, docNo).
   * NCR / IPQC / CustomerReturn → open their form with a sessionStorage hint
   * so the form auto-opens that doc's detail sheet on boot. */
  var DOCVIEW_TYPES = { GRN: 1, IQC: 1, OQC: 1, Gatepass: 1, PO: 1 };
  function navigateToRecord(moduleName, docNo) {
    if (!docNo) { navigateToRecords(moduleName); return; }
    if (DOCVIEW_TYPES[moduleName]) {
      showLoader('Opening ' + docNo);
      google.script.run
        .withSuccessHandler(function (html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function (e) { hideLoader(); showToast('Could not open ' + docNo, true); })
        .getDocViewHtml(moduleName, docNo);
      return;
    }
    // Fallback: open the module form with a stash so it can auto-open the doc
    try { sessionStorage.setItem('pmAutoOpenDoc', docNo); } catch (e) {}
    navigateTo(moduleName);
  }
  window.navigateToRecord = navigateToRecord;

  function showMoreMenu() {
    var items = [
      { label: 'Warehouse',       form: 'Warehouse',     icon: 'i-boxes' },
      { label: 'Customer Return', form: 'CustomerReturn',icon: 'i-undo' },
      { label: 'Dispatch',        form: 'Dispatch',      icon: 'i-truck' },
      { label: 'Import CSV',      form: 'ImportCSV',     icon: 'i-records' }
    ];
    var html = items.map(function (i) {
      return '<button onclick="navigateTo(\'' + i.form + '\');this.closest(\'#moreSheet\').remove()" ' +
        'style="width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:13px;font-weight:600;color:var(--pm-text);background:transparent;border:0;border-bottom:1px solid var(--pm-border);text-align:left;font-family:inherit;">' +
        '<svg width="16" height="16" style="color:var(--pm-navy);"><use href="#' + i.icon + '"/></svg>' + i.label + '</button>';
    }).join('');
    var sheet = document.createElement('div');
    sheet.id = 'moreSheet';
    sheet.style.cssText = 'position:fixed;inset:0;z-index:9998;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,58,95,0.55);';
    sheet.innerHTML = '<div style="background:#fff;width:100%;max-width:430px;border-radius:14px 14px 0 0;overflow:hidden;">' +
      '<div style="padding:12px 14px;font-family:\'Plus Jakarta Sans\',sans-serif;font-size:9.5px;font-weight:700;color:var(--pm-muted);text-transform:uppercase;letter-spacing:1.4px;border-bottom:1px solid var(--pm-border);">More modules</div>' +
      html + '</div>';
    sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.remove(); });
    document.body.appendChild(sheet);
  }
  window.showMoreMenu = showMoreMenu;
  function showSideMenu() {
    var menu = $('pmMenu');
    var back = $('pmMenuBackdrop');
    if (!menu || !back) return;
    menu.classList.add('is-open');
    back.classList.add('is-open');
    menu.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    // refresh persona label inside the menu
    try {
      var p = (localStorage.getItem('pmqms_persona') || 'Manager');
      var pl = $('pmMenuPersona'); if (pl) pl.textContent = p;
      var pm = $('pmMenuPersonaMeta'); if (pm) pm.textContent = p.slice(0,3);
    } catch (e) {}
  }
  function closeSideMenu() {
    var menu = $('pmMenu');
    var back = $('pmMenuBackdrop');
    if (!menu || !back) return;
    menu.classList.remove('is-open');
    back.classList.remove('is-open');
    menu.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  // ESC closes the drawer
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSideMenu();
  });
  window.showSideMenu = showSideMenu;
  window.closeSideMenu = closeSideMenu;

  /* ═════════════ OPERATOR PICKER ═════════════ */
  function getOperatorName() { try { return sessionStorage.getItem('pmOperatorName') || ''; } catch (e) { return ''; } }
  function setOperatorName(n) { try { sessionStorage.setItem('pmOperatorName', n); } catch (e) {} }
  function showOperatorPicker(list, onConfirm) {
    var existing = $('opModal'); if (existing) existing.remove();
    var modal = document.createElement('div');
    modal.id = 'opModal';
    var btns = (list || []).map(function (n) {
      var name = typeof n === 'string' ? n : (n.name || String(n));
      return '<button class="op-name-btn" data-name="' + name.replace(/"/g, '&quot;') + '">' + name + '</button>';
    }).join('');
    modal.innerHTML = '<div class="op-sheet"><div style="font-size:14px;font-weight:700;color:var(--pm-navy);margin-bottom:4px;font-family:\'Plus Jakarta Sans\',sans-serif;">Who are you?</div><div style="font-size:11px;color:var(--pm-muted);margin-bottom:12px;">Select your name</div><div class="op-names-grid" id="opNamesGrid">' + btns + '</div><button class="op-confirm-btn" id="opConfirmBtn" disabled>Confirm</button></div>';
    document.body.appendChild(modal);
    var selected = '';
    modal.querySelector('#opNamesGrid').addEventListener('click', function (e) {
      var btn = e.target.closest('.op-name-btn'); if (!btn) return;
      modal.querySelectorAll('.op-name-btn').forEach(function (b) { b.classList.remove('op-selected'); });
      btn.classList.add('op-selected');
      selected = btn.dataset.name;
      modal.querySelector('#opConfirmBtn').disabled = false;
    });
    modal.querySelector('#opConfirmBtn').addEventListener('click', function () {
      if (!selected) return;
      setOperatorName(selected); modal.remove();
      if (typeof onConfirm === 'function') onConfirm(selected);
    });
  }
  window.QMS = window.QMS || {};
  window.QMS.getOperatorName = getOperatorName;
  window.QMS.setOperatorName = setOperatorName;
  window.QMS.requireOperator = function (list, cb) { var n = getOperatorName(); if (n) { cb(n); return; } showOperatorPicker(list, cb); };
  window.QMS.showOperatorPicker = showOperatorPicker;

  /* ═════════════ MODULE CATALOG (workflow order) ═════════════ */
  var GROUPS = [
    { label: 'Receive', modules: [
      { name: 'PO',         form: 'PO',         icon: 'i-clipboard-list', countKey: 'PO' },
      { name: 'GRN',        form: 'GRN',        icon: 'i-package',         countKey: 'GRN' },
      { name: 'IQC',        form: 'IQC',        icon: 'i-flask',           countKey: 'IQC' }
    ]},
    { label: 'Make', modules: [
      { name: 'IPQC',       form: 'IPQC',       icon: 'i-gauge',           countKey: 'IPQC' },
      { name: 'Production', form: 'Production', icon: 'i-factory',         countKey: 'Production' }
    ]},
    { label: 'Ship', modules: [
      { name: 'OQC',        form: 'OQC',        icon: 'i-shield-check',    countKey: 'OQC' },
      { name: 'Dispatch',   form: 'Dispatch',   icon: 'i-truck',           countKey: 'Dispatch' }
    ]},
    { label: 'Resolve', modules: [
      { name: 'NCR',        form: 'NCR',        icon: 'i-octagon-alert',   countKey: 'NCR', noNew: true },
      { name: 'Returns',    form: 'CustomerReturn', icon: 'i-undo',        countKey: 'CustomerReturn' },
      { name: 'Control Plan', form: 'ControlPlan', icon: 'i-ruler',        countKey: null }
    ]},
    { label: 'Manage', modules: [
      { name: 'KPI Dashboard', form: 'KPI',       icon: 'i-trending',      countKey: null },
      { name: 'Warehouse',     form: 'Warehouse', icon: 'i-boxes',         countKey: null },
      { name: 'Masters',       form: 'Masters',   icon: 'i-users-cog',     countKey: null }
    ]}
  ];

  /* Short meta line per module given counts.
   * Now uses status breakdowns when available — e.g. "5 PENDING · 3 HOLD"
   * instead of duplicating the count. */
  function moduleMeta(m, n, breakdown) {
    if (n == null) {
      var hints = {
        'KPI Dashboard': 'Trends · failure rate · OTD',
        'Warehouse':     'Stock by location · movements',
        'Masters':       'Suppliers · materials · inspectors',
        'Control Plan':  'Per-product param matrix'
      };
      return hints[m.name] || '';
    }
    if (n === 0) return 'Nothing pending';
    // Build breakdown text from server-provided distribution
    if (breakdown && typeof breakdown === 'object') {
      var keys = Object.keys(breakdown);
      if (keys.length > 0) {
        // Sort by count desc, take top 3
        keys.sort(function(a,b){ return breakdown[b] - breakdown[a]; });
        var parts = keys.slice(0, 3).map(function(k){
          return breakdown[k] + ' ' + k.toLowerCase().replace(/_/g, ' ');
        });
        return parts.join(' · ');
      }
    }
    return 'pending';
  }

  /* ═════════════ STATUS CLASSIFIER ═════════════ */
  function statusClass(status) {
    var s = String(status || '').toUpperCase();
    if (s === 'ACCEPTED' || s === 'RELEASED' || s === 'PASS')      return 's-pass';
    if (s === 'REJECTED' || s === 'FAIL')                          return 's-fail';
    if (s === 'OPEN' || s === 'PENDING_DISPOSITION')               return 's-warn';
    if (s.indexOf('HOLD') >= 0 || s.indexOf('PENDING') >= 0)       return 's-hold';
    if (s === 'IN_PROGRESS')                                       return 's-prog';
    if (s === 'CLOSED')                                            return 's-grey';
    return 's-grey';
  }

  /* ═════════════ ALERT → ROUTING + DOC EXTRACTION ═════════════
   * Returns { module, docNo } so the click goes straight to that record.
   * Module is what Records.js expects (GRN/IQC/OQC/NCR/CustomerReturn/Gatepass/IPQC).
   * docNo is pulled from the action's typed fields if present, else parsed
   * out of `detail` (which usually contains "… · PM/<TYPE>/<id> · …").
   */
  function alertRoute(action) {
    var detail = String(action.detail || '');
    var lower = detail.toLowerCase();
    // Doc extractors — typed fields take precedence
    var docNo = action.grnNo || action.oqcNo || action.ncrNo || action.rtnNo || action.sessionId || '';
    if (!docNo) {
      var m = detail.match(/(PM\/[A-Z]+\/[A-Z0-9\-/]+)/i);
      if (m) docNo = m[1];
    }

    // Route to whichever Records list will contain that doc
    var module = 'ALL';
    if (lower.indexOf('iqc needed') >= 0 || lower.indexOf('awaiting iqc') >= 0) {
      // The doc IS a GRN; we want to find it under GRN records (then user runs IQC from there)
      module = 'GRN';
    } else if (lower.indexOf('dispatch pending') >= 0) {
      // Doc is an OQC; route to OQC records
      module = 'OQC';
    } else if (lower.indexOf('open session') >= 0) {
      module = 'IPQC';
    } else if (lower.indexOf('ncr') >= 0) {
      module = 'NCR';
    } else if (lower.indexOf('return') >= 0) {
      module = 'CustomerReturn';
    } else if (lower.indexOf('gatepass') >= 0) {
      module = 'Gatepass';
    }
    return { module: module, docNo: docNo };
  }

  /* ═════════════ RENDER ═════════════ */
  /* Shorten verbose details like
     "IQC needed · PM/GRN/2026-037 · CAN-M_TIN-PLT - 5L Rectangular Tin Can"
     →  "IQC needed · GRN/2026-037 · CAN-M_TIN-PLT" (drop PM/ prefix, drop description tail)
  */
  function shortenDetail(d) {
    if (!d) return '';
    var parts = String(d).split('·').map(function (s) { return s.trim(); });
    if (parts.length >= 2) parts[1] = parts[1].replace(/^PM\//, '');
    if (parts.length >= 3) parts[2] = parts[2].split(' - ')[0]; // drop long product name
    return parts.slice(0, 3).join(' · ');
  }

  function alertRowHtml(a, i) {
    var r = alertRoute(a);
    return '<button class="pm-alert pm-rise" style="animation-delay:' + (i * 30) + 'ms;" ' +
      'onclick="navigateToRecord(\'' + r.module + '\',\'' + esc(r.docNo) + '\')" aria-label="' + esc(a.detail) + '">' +
      '<div class="pm-alert-body">' +
        '<div class="pm-alert-text">' + esc(shortenDetail(a.detail)) + '</div>' +
      '</div>' +
      '<span class="pm-alert-chev"><svg><use href="#i-chev"/></svg></span>' +
      '</button>';
  }
  function alertHeadHtml(total) {
    return '<div class="pm-alert-head">' +
      '<svg><use href="#i-alert-tri"/></svg>' +
      '<span>Action required</span>' +
      '<span class="pm-alert-head-count">' + total + '</span>' +
    '</div>';
  }

  function renderAlerts(pendingActions) {
    var el = $('alertList');
    if (!el) return;
    if (!pendingActions || !pendingActions.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
    var total = pendingActions.length;
    var capped = total > ALERTS_VISIBLE;
    var visible = capped ? pendingActions.slice(0, ALERTS_VISIBLE) : pendingActions;
    var html = alertHeadHtml(total) + visible.map(alertRowHtml).join('');
    if (capped) {
      html += '<button class="pm-alert-more" onclick="window.PM.expandAlerts()">Show ' + (total - ALERTS_VISIBLE) + ' more</button>';
    }
    el.innerHTML = html;
    el.style.display = '';
  }
  function expandAlerts() {
    var cached = readCache() || {};
    var full = cached.pendingActions || [];
    var el = $('alertList');
    el.innerHTML = alertHeadHtml(full.length) + full.map(alertRowHtml).join('');
  }

  // renderStatStrip removed — stat strip retired in v2 (counts live on tiles now).

  function renderGroups(counts, breakdowns) {
    var c = counts || {};
    var b = breakdowns || {};
    var tiles = (SETTINGS && SETTINGS.tiles) || null;

    var html = GROUPS.map(function (g) {

      }).map(function (m) {

        // Click → Records (pending-only) if work waiting; else open form.

        if (n == null) {

          countHtml = '<button class="pm-tile-count' + (n === 0 ? ' is-zero' : attnCls) + '" ' +

        }
        // Status class for left-border

        return '<div class="pm-tile' + stateCls + ' pm-rise" role="button" tabindex="0" ' +
          'data-group="' + esc(groupName) + '" ' +

          'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' + tileClick + '}" ' +
          'aria-label="Open ' + esc(m.name) + '">' +
          '<div class="pm-tile-top">' +
            '<span class="pm-tile-icon"><svg><use href="#' + m.icon + '"/></svg></span>' +
            countHtml +
          '</div>' +
          '<div class="pm-tile-label">' + esc(m.name) + '</div>' +
          (meta ? '<div class="pm-tile-meta">' + esc(meta) + '</div>' : '') +
          addHtml +
          '</div>';
      }).join('');
      if (!rows) return '';
      return '<div class="pm-sec"><span class="pm-sec-l">' + esc(g.label) + '</span></div>' +
        '<div class="pm-group"><div class="pm-tiles">' + rows + '</div></div>';
    }).join('');
    $('moduleGroups').innerHTML = html;
  }

  /* ═════════════ LOADER ═════════════ */
  var loaderEl = $('pmLoader');
  var loaderProg = $('pmLoaderProgress');
  var loaderSub = $('pmLoaderSub');
  var loaderProgress = 0, loaderInterval = null;
  var _topSpinner = null;
  function _getTopSpinner() { return _topSpinner || (_topSpinner = document.getElementById('topRefreshSpinner')); }
  function showTopSpinner() { var s = _getTopSpinner(); if (s) s.style.display = 'inline-block'; }
  function hideTopSpinner() { var s = _getTopSpinner(); if (s) s.style.display = 'none'; }

  function showLoader(msg) {

  function startLoaderProgress() {
    loaderProgress = 8;
    if (loaderProg) loaderProg.style.width = loaderProgress + '%';
    loaderInterval = setInterval(function () {
      loaderProgress += (92 - loaderProgress) * 0.04;
      if (loaderProg) loaderProg.style.width = loaderProgress + '%';
    }, 180);
  }

  /* ═════════════ CACHE ═════════════ */
  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (!p || !p.savedAt || (Date.now() - p.savedAt) > CACHE_TTL_MS) return null;
      return p.data || null;
    } catch (e) { return null; }
  }
  function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: data })); } catch (e) {}
  }
  function readFullCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY + '_full');
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (!p || !p.savedAt || (Date.now() - p.savedAt) > CACHE_TTL_MS) return null;
      return p.data || null;
    } catch (e) { return null; }
  }
  function writeFullCache(bundle) {
    try { localStorage.setItem(CACHE_KEY + '_full', JSON.stringify({ savedAt: Date.now(), data: bundle })); } catch (e) {}
  }

  /* ═════════════ PERSONA ═════════════ */
  var PERSONAS = ['Operator', 'Manager'];
  function getPersona() {
    try { return localStorage.getItem('pmqms_persona') || 'Manager'; } catch (e) { return 'Manager'; }
  }
  function setPersonaLocal(p) {
    try { localStorage.setItem('pmqms_persona', p); sessionStorage.setItem('pmqms_persona', p); } catch (e) {}
  }
  function refreshPersonaPill() {
    var pill = $('personaPill'); if (!pill) return;
    pill.textContent = getPersona();
  }
  function cyclePersona() {
    var cur = getPersona();
    var i = PERSONAS.indexOf(cur); if (i < 0) i = 0;
    var next = PERSONAS[(i + 1) % PERSONAS.length];
    setPersonaLocal(next);
    refreshPersonaPill();
    showToast('Persona: ' + next);
    try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
    loadState();
  }
  window.cyclePersona = cyclePersona;

  /* ═════════════ COLLAPSIBLE SECTIONS ═════════════ */
  function toggleSection(hdrId, bodyId){
    var hdr = $(hdrId), body = $(bodyId);
    if (!hdr || !body) return;
    var collapsed = hdr.classList.toggle('collapsed');
    if (collapsed) {
      body.style.maxHeight = body.scrollHeight + 'px';   // set a value to animate from
      body.offsetHeight;                                  // force reflow
      body.classList.add('collapsed');
    } else {
      body.classList.remove('collapsed');
      body.style.maxHeight = body.scrollHeight + 'px';
      setTimeout(function(){ if (!hdr.classList.contains('collapsed')) body.style.maxHeight = ''; }, 220);
    }
  }
  window.toggleSection = toggleSection;

  /* ═════════════ KPI HERO ═════════════ */
  // KPIs where a LOWER value is better (gap math + status flip).
  var KPI_LOWER_BETTER = { OTD:true, NCR_MTTR:true, AGED_STOCK:true, IPQC_REJECT:true, CR_RATE:true };
  // KPI key → sprite icon id (sprite defs already in Landing.html).
  var KPI_ICON = {
    IQC_PASS:'i-shield-check', FPY:'i-gauge', OTD:'i-truck', NCR_MTTR:'i-alert-tri',
    SUPPLIER_OTIF:'i-factory', TOP_DEFECT:'i-octagon-alert', FIFO_COMPL:'i-trending',
    AGED_STOCK:'i-boxes', DWELL:'i-clipboard-list', IPQC_REJECT:'i-ruler',
    CR_RATE:'i-undo', COST_OF_QUAL:'i-package'
  };
  function fmtKpiVal(k){
    if (k.value === null || k.value === undefined || isNaN(k.value)) return { text:'—', cls:'' };
    var n = Number(k.value);
    var text = (k.format === 'pct') ? n.toFixed(1) : (k.format === 'num') ? (Math.abs(n) >= 100 ? n.toFixed(0) : n.toFixed(1)) : String(n);
    var cls = '';
    if (k.target != null && k.format === 'pct') {
      cls = (n >= Number(k.target)) ? 'is-good' : 'is-bad';
    } else if (k.target != null && k.key === 'NCR_MTTR') {
      cls = (n <= Number(k.target)) ? 'is-good' : 'is-bad';
    }
    return { text:text, cls:cls };
  }
  // Status: 'good' | 'bad' | 'warn' | 'na' — value vs target, direction-aware.
  function kpiStatus(k){
    if (k.status === 'error') return 'bad';
    if (k.value == null || isNaN(k.value) || k.target == null) return 'na';
    var v = Number(k.value), t = Number(k.target);
    if (isNaN(v) || isNaN(t)) return 'na';
    if (KPI_LOWER_BETTER[k.key]) {
      if (v <= t) return 'good';
      return (v <= t * 1.5) ? 'warn' : 'bad';
    }
    if (v >= t) return 'good';
    return (v >= t * 0.95) ? 'warn' : 'bad';
  }
  // One-line plain-language interpretation (gap vs target).
  function kpiNote(k, status){
    if (k.status === 'error') return 'Data error';
    if (k.format === 'text') return '';                       // Top Defect / Module Dwell
    if (k.value == null || isNaN(k.value)) return 'No data';
    if (k.target == null) return '';
    var v = Number(k.value), t = Number(k.target);
    if (isNaN(v) || isNaN(t)) return '';
    if (status === 'good') return KPI_LOWER_BETTER[k.key] ? 'Within target' : 'On target';
    var lower = !!KPI_LOWER_BETTER[k.key];
    var diff = Math.abs(lower ? v - t : t - v);
    var mag = (k.format === 'pct')
      ? diff.toFixed(1) + 'pp'
      : (diff % 1 !== 0 ? diff.toFixed(1) : diff.toFixed(0)) + (k.unit || '');
    return mag + (lower ? ' over target' : ' below target');
  }
  function sparklineSvg(arr){
    if (!arr || !arr.length) return '';
    var vals = arr.filter(function(v){ return v != null && !isNaN(v); });
    if (vals.length < 2) return '';
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = (max - min) || 1;
    var w = 100, h = 14;
    var pts = arr.map(function(v, i){
      var x = (i / (arr.length - 1)) * w;
      if (v == null || isNaN(v)) return null;
      var y = h - ((v - min) / range) * h;
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var d = '';
    pts.forEach(function(p, i){
      if (p == null) return;
      d += (d ? ' L' : 'M') + p;
    });
    return '<svg class="pm-kpi-spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" width="100%" height="14">' +
      '<path d="' + d + '" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function renderKpis(kpis){
    var box = $('kpiHero');
    if (!box) return;
    var hero = (kpis || []).filter(function(k){ return k.group === 'hero'; });
    if (!hero.length) {
      box.innerHTML = '<div class="pm-kpi-empty">No KPIs visible for this persona. Tap Configure.</div>';
    } else {
      // Single-signal cards: left-edge color bar is the only status cue.
      // Value is always ink-black so numbers read fast; the note line
      // carries the colored interpretation in 9.5px text.
      box.innerHTML = hero.map(function(k){
        var fv = fmtKpiVal(k);
        var err = (k.status === 'error');
        var st = kpiStatus(k);
        var note = kpiNote(k, st);
        var title = err ? ('KPI error: ' + (k.message || '')) : k.label;
        return '<div class="pm-kpi-card s-' + st + (err ? ' is-err' : '') + ' pm-rise" title="' + esc(title) + '" onclick="navigateTo(\'KPI\')">' +
          '<div class="pm-kpi-top"><span class="pm-kpi-label">' + esc(k.label) + '</span></div>' +
          '<div class="pm-kpi-mid"><span class="pm-kpi-val">' + esc(fv.text) + '</span>' +
          '<span class="pm-kpi-unit">' + esc(k.unit || '') + '</span></div>' +
          (note ? '<div class="pm-kpi-note s-' + st + '">' + esc(note) + '</div>' : '') +
          '</div>';
      }).join('');
    }
    renderKpiDrill(kpis);
  }

  function renderKpiDrill(kpis){
    var sec = $('kpiDrillSec'); var box = $('kpiDrill');
    if (!sec || !box) return;
    var drill = (kpis || []).filter(function(k){ return k.group === 'drill'; });
    if (!drill.length) {
      sec.style.display = 'none';
      return;
    }
    sec.style.display = '';
    box.innerHTML = drill.map(function(k){
      var err = (k.status === 'error');
      var st = kpiStatus(k);
      var valTxt;
      if (k.format === 'text') {
        valTxt = (k.value == null) ? '—' : String(k.value);
      } else {
        valTxt = fmtKpiVal(k).text + (k.unit || '');
      }
      // Value colour follows status (direction-aware), not raw value≥target.
      var valCls = st === 'good' ? 'is-good' : st === 'bad' ? 'is-bad' : '';
      var note = kpiNote(k, st);
      var tgt = (k.target != null) ? ('Target ' + k.target + (k.unit || '')) : '';
      var sub = note || tgt;
      var title = err ? ('KPI error: ' + (k.message || '')) : k.label;
      return '<div class="pm-kpi-drow s-' + st + (err ? ' is-err' : '') + ' pm-rise" title="' + esc(title) + '">' +
        '<div class="pm-kpi-top"><span class="pm-kpi-dlbl">' + esc(k.label) + '</span></div>' +
        '<div class="pm-kpi-mid"><span class="pm-kpi-dval">' + esc(valTxt) + '</span></div>' +
        (sub ? '<div class="pm-kpi-dsub s-' + st + '">' + esc(sub) + '</div>' : '') +
        '</div>';
    }).join('');
  }

  /* ═════════════ MAIN LOAD ═════════════ */
  var SETTINGS = null;

  function applyData(result) {
    var alerts = result.pendingActions || [];
    renderAlerts(alerts);
    renderStatStrip(result.todayCounts || {}, alerts.length);
    renderGroups(result.todayCounts || {}, result.pendingBreakdowns || {});
    renderActivity(result.recentActivity || []);
  }

  function applyBundle(bundle) {
    if (!bundle) return;
    SETTINGS = bundle.settings || null;
    if (bundle.landing) applyData(bundle.landing);
    renderKpis(bundle.kpis || []);
  }

  function loadState() {
    refreshPersonaPill();
    /* Static shell: paint groups immediately (counts as 0) */
    renderGroups({});

    // Full bundle cache (landing + counts + settings + kpis) — instant repeat load
    var fullCached = readFullCache();
    if (fullCached) {
      applyBundle(fullCached);
      hideLoader();
      // Background refresh — update counts silently, spinner in top bar
      showTopSpinner();
      google.script.run
        .withSuccessHandler(function (bundle) {
          hideTopSpinner();
          if (!bundle) return;
          applyBundle(bundle);
          writeFullCache(bundle);
          schedulePrefetch();
        })
        .withFailureHandler(function () { hideTopSpinner(); })
        .getLandingBundleV2(getPersona());
      schedulePrefetch();
      return;
    }

    // Cold start — show loader, fetch fast bundle first (no KPIs), then KPIs lazily
    var cached = readCache();
    if (cached) {
      applyData(cached);
      hideLoader();
    } else {
      showLoader('Synchronising shift data');
      startLoaderProgress();
    }

    // Fast bundle: landing + counts + settings (no KPIs)
    google.script.run
      .withSuccessHandler(function (bundle) {
        if (!bundle) {
          if (!cached) { hideLoader(); renderError(); }
          return;
        }
        applyBundle(bundle);
        if (bundle.landing) writeCache(bundle.landing);
        hideLoader();
        schedulePrefetch();
        // Lazy-load KPIs after UI is visible
        setTimeout(function () {
          google.script.run
            .withSuccessHandler(function (fullBundle) {
              if (!fullBundle) return;
              applyBundle(fullBundle);
              writeFullCache(fullBundle);
            })
            .withFailureHandler(function () {})
            .getLandingBundleV2(getPersona());
        }, 800);
      })
      .withFailureHandler(function () {
        if (!cached) {
          hideLoader(); renderError();
          showToast('Could not load data. Tap to retry.', true);
        } else {
          showToast('Live refresh failed — showing cached data', true);
        }
      })
      .getLandingBundleV3Fast(getPersona());
  }

  /* Idle prefetch — top 4 most-used forms only, heavily staggered to not compete with data calls */
  function schedulePrefetch() {
    var targets = ['IQC', 'Production', 'GRN', 'OQC'];
    if (window.PMHtmlCache && typeof window.PMHtmlCache.prefetch === 'function') {
      window.PMHtmlCache.prefetch(targets);
      return;
    }
    var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 2000); };
    targets.forEach(function (form, i) {
      idle(function () {
        if (_prefetchCache[form]) return;
        google.script.run
          .withSuccessHandler(function (html) { _prefetchCache[form] = html; })
          .withFailureHandler(function () {})
          .getFormHtml(form);
      }, { timeout: 3000 + i * 1500 });
    });
  }

  /* GAS banner suppressor */
  (function () {
    function kill(node) {
      if (!node || node.nodeType !== 1 || node.id === '__gas_cover__') return;
      var t = node.textContent || node.innerText || '';
      if (t.indexOf('Google Apps Script') !== -1 || t.indexOf('created using Google') !== -1) {
        node.style.cssText = 'display:none!important';
      }
    }
    var obs = new MutationObserver(function (muts) { muts.forEach(function (m) { m.addedNodes.forEach(kill); }); });
    function start() { obs.observe(document.body, { childList: true }); }
    if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  }());

  /* Boot */
  window.PM = window.PM || {};
  window.PM.loadState = loadState;
  window.PM.expandAlerts = expandAlerts;
  loadState();
}());
</script>
