<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <style>
    /* file-specific styles only — never re-define Theme-owned classes */

    :root {
      --navy-hover:   #DDE6FA;
      --navy-active:  #C7D7FF;
      --navy-dark:    #1A2D9E;
      --danger-light: #FEE2E2;
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .items-list-container {
      margin-top: 8px;
    }

    .item-card {
      background: var(--navy-light);
      border: 1px solid var(--navy-active);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 6px;
      position: relative;
    }

    .item-card .item-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      padding-right: 24px;
    }

    .item-card .item-detail {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .item-card .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: none;
      border: none;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      border-radius: 6px;
    }

    .item-card .remove-btn:hover  { color: var(--danger); background: var(--danger-light); }
    .item-card .remove-btn:active { transform: scale(0.93); }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section-title-with-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item-count-badge {
      background: var(--amber);
      color: var(--navy);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.3px;
    }

    .btn-secondary {
      width: 100%;
      background: var(--navy-light);
      color: var(--navy);
      border: 1.5px solid var(--navy-active);
      border-radius: var(--radius);
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
      margin-top: 4px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      min-height: 44px;
    }
    .btn-secondary:hover  { background: var(--navy-hover); }
    .btn-secondary:active { transform: scale(0.97); background: var(--navy-active); }

    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      padding: 10px;
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
      z-index: 100;
    }

    /* IQC inline prompt — no modal overlay */
    .iqc-prompt {
      margin-bottom: 80px;
    }
    .iqc-prompt .iqc-body {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .iqc-prompt .iqc-actions {
      display: flex;
      gap: 10px;
    }
    .iqc-prompt .iqc-actions .btn-submit {
      flex: 1;
    }
    .iqc-prompt .iqc-actions .btn-secondary {
      flex: 1;
      margin-top: 0;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="pm-header">
  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4l-6 6 6 6"/>
    </svg>
  </button>
  <span class="page-title">New GRN</span>
  <span class="doc-badge" id="docBadge">Loading…</span>
</div>

<div id="formSections">

  <div class="section">
    <div class="section-title">Receipt Details</div>
    <div class="section-body">

      <div class="field">
        <label>Date Received</label>
        <input type="date" id="date">
      </div>

      <div class="field">
        <label>Supplier</label>
        <select id="supplier">
          <option value="">— Select Supplier —</option>
        </select>
      </div>

      <div class="field">
        <label>PO Reference</label>
        <input type="text" id="poRef" placeholder="PO number">
      </div>

      <div class="field">
        <label>Invoice No.</label>
        <input type="text" id="invoiceNo" placeholder="Supplier invoice number">
      </div>

      <div class="field">
        <label>Storage Zone</label>
        <select id="storageZone">
          <option value="Quarantine Zone">Quarantine Zone</option>
          <option value="Approved Zone">Approved Zone</option>
          <option value="Rejected Zone">Rejected Zone</option>
          <option value="Production Zone">Production Zone</option>
          <option value="Raw Material Store">Raw Material Store</option>
        </select>
      </div>

    </div>
  </div>

  <div class="section">
    <div class="section-title section-title-with-badge">
      <span>Items</span>
      <span id="itemBadge" class="item-count-badge">0 items</span>
    </div>
    <div class="section-body">

      <div class="field">
        <label>Material</label>
        <input type="text" id="matSearch" placeholder="Type to search material…" autocomplete="off">
        <select id="material" size="3" style="margin-top:4px;"></select>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Qty Ordered</label>
          <input type="number" id="qtyOrdered" min="0" placeholder="0">
        </div>
        <div class="field">
          <label>Qty Received</label>
          <input type="number" id="qtyReceived" min="0" placeholder="0">
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Batch / Lot No.</label>
          <input type="text" id="batchNo" placeholder="Batch or lot">
        </div>
        <div class="field">
          <label>Expiry Date <span style="font-size:10px;color:var(--muted);">(opt.)</span></label>
          <input type="date" id="expiryDate">
        </div>
      </div>

      <button type="button" id="btnAddItem" class="btn-secondary">+ Add Item to GRN</button>

      <div id="itemsList" style="margin-top:8px;">
        <p style="font-size:11px;color:var(--muted);text-align:center;padding:8px 0;">No items added yet</p>
      </div>

    </div>
  </div>

  <div class="section">
    <div class="section-title">COA / Documents</div>
    <div class="section-body">
      <div class="field">
        <label>COA / Test Certificate Received</label>
        <div class="toggle-row">
          <button id="coaY">Yes</button>
          <button id="coaN">No</button>
          <button id="coaNA" class="active-na">N/A</button>
        </div>
      </div>
      <div class="field">
        <label>Remarks</label>
        <textarea id="remarks" placeholder="Any observations or notes…"></textarea>
      </div>
    </div>
  </div>

</div><!-- /#formSections -->

<!-- IQC inline prompt — shown after successful save, replaces sticky footer -->
<div id="iqcPrompt" class="section iqc-prompt hidden">
  <div class="section-title">GRN Saved</div>
  <div class="section-body">
    <p id="iqcPromptBody" class="iqc-body"></p>
    <div class="iqc-actions">
      <button class="btn-submit" id="btnIqcYes">Yes &#8594; IQC</button>
      <button class="btn-secondary" id="btnIqcNo">No, Go Home</button>
    </div>
  </div>
</div>

<div class="sticky-footer" id="stickyFooter">
  <button class="btn-submit" id="btnSubmit">Save GRN</button>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPPLIERS = [], ALL_MATS = [];
var coaVal = 'NA', supplierSel = {}, materialSel = {};
var ITEMS = [];
var docNo = '';
var sessionId = null;
var dwmTimerStarted = false;
var formSubmitted = false;
var savedResult = null;

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

function showError(e) {
  showToast(e.message || String(e), 'error');
}

// ── DWM session bridge ─────────────────────────────────────────
function initDwmSession() {
  try {
    sessionId = sessionStorage.getItem('dwmSessionId') || null;
  } catch(e) {
    sessionId = null;
  }
}

window.addEventListener('beforeunload', function() {
  if (!formSubmitted && sessionId) {
    try { google.script.run.dwmStopTimer(sessionId, false); } catch(e) {}
  }
});

// ── Init ──────────────────────────────────────────────────────
function init() {
  initDwmSession();

  var today = new Date();
  document.getElementById('date').value = today.toISOString().split('T')[0];

  google.script.run
    .withSuccessHandler(function(data) {
      SUPPLIERS = data.suppliers;
      ALL_MATS  = data.materials;
      docNo     = data.docNumber;

      document.getElementById('docBadge').textContent = docNo;

      var sel = document.getElementById('supplier');
      SUPPLIERS.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.code;
        opt.textContent = s.name;
        opt.dataset.obj = JSON.stringify(s);
        sel.appendChild(opt);
      });

      renderMaterials(ALL_MATS);
    })
    .withFailureHandler(showError)
    .getGRNFormInit();
}

function renderMaterials(mats) {
  var sel = document.getElementById('material');
  sel.innerHTML = '';
  mats.slice(0, 50).forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m.code;
    opt.textContent = '[' + m.code + '] ' + m.desc + ' (' + m.unit + ')';
    opt.dataset.obj = JSON.stringify(m);
    sel.appendChild(opt);
  });
}

function filterMaterials() {
  var q = document.getElementById('matSearch').value.toLowerCase();
  if (!q) { renderMaterials(ALL_MATS); return; }
  var filtered = ALL_MATS.filter(function(m) {
    return m.desc.toLowerCase().indexOf(q) > -1 ||
           String(m.code).toLowerCase().indexOf(q) > -1 ||
           m.category.toLowerCase().indexOf(q) > -1;
  });
  renderMaterials(filtered);
}

function onSupplierChange() {
  var sel = document.getElementById('supplier');
  var opt = sel.options[sel.selectedIndex];
  supplierSel = opt && opt.dataset.obj ? JSON.parse(opt.dataset.obj) : {};
}

function onMaterialChange() {
  var sel = document.getElementById('material');
  var opt = sel.options[sel.selectedIndex];
  materialSel = opt && opt.dataset.obj ? JSON.parse(opt.dataset.obj) : {};
}

function setCOA(btn, val) {
  coaVal = val;
  ['Y','N','NA'].forEach(function(v) {
    document.getElementById('coa' + v).className = '';
  });
  btn.className = 'active-' + (val === 'Y' ? 'yes' : val === 'N' ? 'no' : 'na');
}

function addItem() {
  var matSel = document.getElementById('material');
  if (!matSel.value) { showToast('Select a material first.', 'error'); return; }

  var matOpt = matSel.options[matSel.selectedIndex];
  if (matOpt && matOpt.dataset.obj) materialSel = JSON.parse(matOpt.dataset.obj);

  var qtyO = document.getElementById('qtyOrdered').value;
  var qtyR = document.getElementById('qtyReceived').value;
  if (!qtyO && !qtyR) { showToast('Enter at least one quantity.', 'error'); return; }

  ITEMS.push({
    materialCode: matSel.value,
    materialDesc: materialSel.desc || matSel.value,
    unit:         materialSel.unit || '',
    qtyOrdered:   qtyO || '',
    qtyReceived:  qtyR || '',
    batchNo:      document.getElementById('batchNo').value,
    expiryDate:   document.getElementById('expiryDate').value
  });

  document.getElementById('matSearch').value = '';
  document.getElementById('qtyOrdered').value = '';
  document.getElementById('qtyReceived').value = '';
  document.getElementById('batchNo').value = '';
  document.getElementById('expiryDate').value = '';
  renderMaterials(ALL_MATS);
  materialSel = {};

  renderItems();
}

function removeItem(i) {
  ITEMS.splice(i, 1);
  renderItems();
}

function renderItems() {
  var badge = document.getElementById('itemBadge');
  badge.textContent = ITEMS.length + (ITEMS.length === 1 ? ' item' : ' items');

  var el = document.getElementById('itemsList');
  if (!ITEMS.length) {
    el.innerHTML = '<p style="font-size:11px;color:var(--muted);text-align:center;padding:8px 0;">No items added yet</p>';
    return;
  }
  el.innerHTML = ITEMS.map(function(item, i) {
    return '<div class="item-card">' +
      '<button type="button" class="remove-btn" data-idx="' + i + '">×</button>' +
      '<div class="item-title">' + escHtml(item.materialDesc) + '</div>' +
      '<div class="item-detail">' +
        'Ordered: <b>' + (item.qtyOrdered || '—') + '</b> | Received: <b>' + (item.qtyReceived || '—') + '</b> ' + escHtml(item.unit) +
        (item.batchNo    ? ' &nbsp;·&nbsp; Batch: ' + escHtml(item.batchNo) : '') +
        (item.expiryDate ? ' &nbsp;·&nbsp; Exp: '   + escHtml(item.expiryDate) : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Submit ──────────────────────────────────────────────────────
function submitGRN() {
  if (!document.getElementById('date').value)     { showToast('Please enter date.', 'error'); return; }
  if (!document.getElementById('supplier').value) { showToast('Please select a supplier.', 'error'); return; }
  if (!ITEMS.length)                               { showToast('Add at least one item.', 'error'); return; }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  var supplierName = supplierSel.name || document.getElementById('supplier').value;

  var data = {
    date:         document.getElementById('date').value,
    supplierCode: document.getElementById('supplier').value,
    supplierName: supplierName,
    poRef:        document.getElementById('poRef').value,
    invoiceNo:    document.getElementById('invoiceNo').value,
    coaReceived:  coaVal,
    remarks:      document.getElementById('remarks').value,
    storageZone:  document.getElementById('storageZone').value,
    items:        ITEMS,
    sessionId:    sessionId || ''
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        formSubmitted = true;

        if (sessionId) {
          var firstItem = ITEMS[0] || {};
          var taskTitle = 'GRN: ' + supplierName + ' — ' + (firstItem.materialDesc || firstItem.materialCode || '');
          google.script.run
            .withSuccessHandler(function() {})
            .withFailureHandler(function() {})
            .autoQmsTask_(sessionId, 'GRN', taskTitle, res.docNo);
        }

        savedResult = {
          docNo: res.docNo,
          supplierName: supplierName,
          firstItem: ITEMS[0] || {}
        };

        showIqcPrompt(savedResult);
      } else {
        showToast('Error: ' + res.error, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Save GRN';
      }
    })
    .withFailureHandler(function(e) {
      showError(e);
      btn.disabled = false;
      btn.innerHTML = 'Save GRN';
    })
    .saveGRN(data);
}

// ── IQC Inline Prompt ──────────────────────────────────────────
function showIqcPrompt(result) {
  document.getElementById('iqcPromptBody').textContent =
    'GRN ' + result.docNo + ' saved. Start IQC inspection for this batch?';
  document.getElementById('stickyFooter').classList.add('hidden');
  document.getElementById('iqcPrompt').classList.remove('hidden');
  document.getElementById('iqcPrompt').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function goToIqc() {
  if (!savedResult) { goHome(); return; }
  var firstItem = savedResult.firstItem;
  try {
    sessionStorage.setItem('iqcPrefill', JSON.stringify({
      supplier: savedResult.supplierName,
      material: firstItem.materialDesc || firstItem.materialCode || '',
      batch:    firstItem.batchNo || '',
      grnRef:   savedResult.docNo
    }));
  } catch(e) {}

  google.script.run
    .withSuccessHandler(function(html) {
      document.open();
      document.write(html);
      document.close();
    })
    .withFailureHandler(function() { goHome(); })
    .getFormHtml('IQC');
}

// ── Navigation ─────────────────────────────────────────────────
function goHome() {
  var hasItems = ITEMS.length > 0;
  var hasFields = document.getElementById('supplier').value ||
                  document.getElementById('matSearch').value;
  if (!formSubmitted && (hasItems || hasFields)) {
    if (!confirm('You have unsaved changes. Leave anyway?')) return;
  }
  google.script.run
    .withSuccessHandler(function(html) {
      document.open();
      document.write(html);
      document.close();
    })
    .withFailureHandler(showError)
    .getLandingHtml();
}

// ── Event listeners ────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('itemsList').addEventListener('click', function(e) {
    var btn = e.target.closest('.remove-btn');
    if (btn) removeItem(parseInt(btn.dataset.idx, 10));
  });
  document.getElementById('btnAddItem').addEventListener('click', addItem);
  document.getElementById('btnSubmit').addEventListener('click', submitGRN);
  document.getElementById('matSearch').addEventListener('input', filterMaterials);
  document.getElementById('supplier').addEventListener('change', onSupplierChange);
  document.getElementById('material').addEventListener('change', onMaterialChange);
  document.getElementById('coaY').addEventListener('click',  function() { setCOA(this, 'Y');  });
  document.getElementById('coaN').addEventListener('click',  function() { setCOA(this, 'N');  });
  document.getElementById('coaNA').addEventListener('click', function() { setCOA(this, 'NA'); });
  document.getElementById('btnIqcYes').addEventListener('click', goToIqc);
  document.getElementById('btnIqcNo').addEventListener('click', goHome);

  init();
});
</script>
</body>
</html>
