  <style>
    /* ── GRN_F — file-local styles only ── */

    /* iOS zoom prevention — override Theme base for all inputs here */
    input, select, textarea {
      font-size: 16px !important;

      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;

    /* ── Confirmation screen ── */

    #confirmScreen.visible {
      display: block;

    #confirmScreen.fade-in {

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────
var SUPPLIERS    = [];
var ALL_MATS     = [];
var sessionId    = null;
var taskId       = null;
var formSaved    = false;
var disposition  = '';
var supplierObj  = {};   // { code, name }
var itemObj      = {};   // { code, desc, unit, category }
var savedGrn     = {};   // filled on success
var qtyManuallyEdited = false;  // track if qtyAccepted was manually changed

// ── Toast ──────────────────────────────────────────────────────────
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.className = 'toast'; }, 3500);
}

function showErr(msg) { showToast(msg, 'error'); }

// ── Session bridge ─────────────────────────────────────────────────
function initSession() {
  try { sessionId = sessionStorage.getItem('dwmSessionId') || null; } catch(e) { sessionId = null; }
}

// ── beforeunload guard ─────────────────────────────────────────────
window.addEventListener('beforeunload', function() {
  if (!formSaved && taskId && sessionId) {
    try { google.script.run.stopTimer(taskId, sessionId); } catch(e) {}
  }
});

// ── Inline error helpers ───────────────────────────────────────────
function setFieldErr(fieldId, errId, show) {
  var f = document.getElementById(fieldId);
  var e = document.getElementById(errId);
  if (!f || !e) return;
  if (show) {
    f.classList.add('field-err');
    e.style.display = 'block';
  } else {
    f.classList.remove('field-err');
    e.style.display = 'none';
  }
}

function clearAllErrors() {
  var errIds = ['f-supplier','f-item','f-batchNo','f-qtyReceived'];
  errIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.classList.remove('field-err');
  });
  ['err-supplier','err-item','err-batchNo','err-qtyReceived','err-disp'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
}

// ── Save button enable/disable ─────────────────────────────────────
function refreshSaveBtn() {
  var ok = document.getElementById('supplier').value &&
           document.getElementById('item').value &&
           document.getElementById('batchNo').value.trim() &&
           parseFloat(document.getElementById('qtyReceived').value) > 0 &&
           disposition;
  document.getElementById('btnSubmit').disabled = !ok;
}

// ── Disposition ────────────────────────────────────────────────────
var DISP_CLASS = { ACCEPT: 'sel-acc', REJECT: 'sel-rej', HOLD: 'sel-hld', AWD: 'sel-awd' };

function selectDisp(val) {
  disposition = val;
  ['ACCEPT','REJECT','HOLD','AWD'].forEach(function(d) {
    var btn = document.getElementById('d-' + d);
    if (!btn) return;
    btn.className = 'disp-btn' + (d === val ? ' ' + DISP_CLASS[d] : '');
  });
  document.getElementById('err-disp').style.display = 'none';
  refreshSaveBtn();
}

// ── Material list helpers ──────────────────────────────────────────
function buildItemSelect(mats) {
  var sel = document.getElementById('item');
  sel.innerHTML = '';
  if (!mats.length) {
    var none = document.createElement('option');
    none.value = '';
    none.textContent = 'No items found';
    sel.appendChild(none);
    sel.disabled = true;
    return;
  }
  var placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = 'Select item...';
  sel.appendChild(placeholder);
  mats.forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m.code;
    opt.textContent = '[' + m.code + '] ' + m.desc + (m.unit ? ' (' + m.unit + ')' : '');
    opt.dataset.obj = JSON.stringify(m);
    sel.appendChild(opt);
  });
  sel.disabled = false;
}

// ── On supplier change ─────────────────────────────────────────────
function onSupplierChange() {
  var sel = document.getElementById('supplier');
  var code = sel.value;
  itemObj = {};
  qtyManuallyEdited = false;

  if (!code) {
    supplierObj = {};
    document.getElementById('item').innerHTML = '<option value="">Select supplier first...</option>';
    document.getElementById('item').disabled = true;
    refreshSaveBtn();
    return;
  }

  // find supplier obj
  for (var i = 0; i < SUPPLIERS.length; i++) {
    if (SUPPLIERS[i].code === code) { supplierObj = SUPPLIERS[i]; break; }
  }

  setFieldErr('f-supplier', 'err-supplier', false);

  // Client-side filter: show all materials (no supplier-material link in current data)
  // Use category search or just show all. Per task: show all, operator can scroll.
  buildItemSelect(ALL_MATS);
  refreshSaveBtn();
}

// ── On item change ─────────────────────────────────────────────────
function onItemChange() {
  var sel = document.getElementById('item');
  var opt = sel.options[sel.selectedIndex];
  itemObj = (opt && opt.dataset.obj) ? JSON.parse(opt.dataset.obj) : {};
  setFieldErr('f-item', 'err-item', false);
  refreshSaveBtn();
}

// ── Qty Received ───────────────────────────────────────────────────
function onQtyReceivedInput() {
  var r = parseFloat(document.getElementById('qtyReceived').value) || 0;
  if (!qtyManuallyEdited) {
    document.getElementById('qtyAccepted').value = r > 0 ? r : '';
  }
  setFieldErr('f-qtyReceived', 'err-qtyReceived', false);
  refreshSaveBtn();
}

function onQtyAcceptedInput() {
  qtyManuallyEdited = true;
  var r = parseFloat(document.getElementById('qtyReceived').value) || 0;
  var a = parseFloat(document.getElementById('qtyAccepted').value) || 0;
  if (a < 0) { document.getElementById('qtyAccepted').value = 0; }
  if (a > r)  { document.getElementById('qtyAccepted').value = r; }
}

// ── Validate ───────────────────────────────────────────────────────
function validate() {
  var ok = true;

  if (!document.getElementById('supplier').value) {
    setFieldErr('f-supplier', 'err-supplier', true);
    ok = false;
  }
  if (!document.getElementById('item').value) {
    setFieldErr('f-item', 'err-item', true);
    ok = false;
  }
  if (!document.getElementById('batchNo').value.trim()) {
    setFieldErr('f-batchNo', 'err-batchNo', true);
    ok = false;
  }
  var qtyR = parseFloat(document.getElementById('qtyReceived').value) || 0;
  if (qtyR <= 0) {
    setFieldErr('f-qtyReceived', 'err-qtyReceived', true);
    ok = false;
  }
  if (!disposition) {
    document.getElementById('err-disp').style.display = 'block';
    ok = false;
  }

  return ok;
}

// ── Navigate ───────────────────────────────────────────────────────
function navigate(page) {
  google.script.run
    .withSuccessHandler(function(html) {
      document.open(); document.write(html); document.close();
    })
    .withFailureHandler(function() {})
    .getFormHtml(page);
}

// ── goHome ─────────────────────────────────────────────────────────
function goHome() {
  if (!formSaved) {
    var hasData = document.getElementById('supplier').value ||
                  document.getElementById('batchNo').value ||
                  disposition;
    if (hasData) {
      if (!confirm('Unsaved changes. Leave?')) return;
    }
  }
  navigate('Landing');
}

// ── Save ───────────────────────────────────────────────────────────
function doSave() {
  clearAllErrors();
  if (!validate()) { showErr('Please fill all required fields.'); return; }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving&hellip;';

  var qtyR = parseFloat(document.getElementById('qtyReceived').value) || 0;
  var qtyA = parseFloat(document.getElementById('qtyAccepted').value);
  if (isNaN(qtyA) || qtyA > qtyR) { qtyA = qtyR; }
  if (qtyA < 0) { qtyA = 0; }

  var data = {
    date:         new Date().toISOString().split('T')[0],
    supplierCode: supplierObj.code || document.getElementById('supplier').value,
    supplierName: supplierObj.name || '',
    poRef:        '',
    invoiceNo:    '',
    coaReceived:  'N/A',
    remarks:      document.getElementById('remarks').value,
    storageZone:  disposition === 'ACCEPT' ? 'Approved Zone' :
                  disposition === 'REJECT' ? 'Rejected Zone' :
                  disposition === 'HOLD'   ? 'Quarantine Zone' : 'Quarantine Zone',
    sessionId:    sessionId || '',
    items: [{
      materialCode: itemObj.code || document.getElementById('item').value,
      materialDesc: itemObj.desc || '',
      unit:         itemObj.unit || '',
      qtyOrdered:   qtyR,
      qtyReceived:  qtyR,
      batchNo:      document.getElementById('batchNo').value.trim(),
      expiryDate:   '',
      vehicleNo:    document.getElementById('vehicleNo').value.trim(),
      qtyAccepted:  qtyA,
      disposition:  disposition
    }]
  };

  function afterStop() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          formSaved = true;
          savedGrn = {
            grnId:        res.docNo,
            supplierCode: supplierObj.code || '',
            supplierName: supplierObj.name || '',
            itemCode:     itemObj.code || '',
            itemName:     itemObj.desc || '',
            batchNo:      data.items[0].batchNo,
            qtyReceived:  qtyR,
            qtyAccepted:  qtyA,
            disposition:  disposition
          };
          showConfirm(savedGrn);
        } else {
          var msg = (res && res.error) ? res.error : 'Unknown error';
          showErr('Save failed: ' + msg);
          btn.disabled = false;
          btn.textContent = 'SAVE GRN RECORD';
        }
      })
      .withFailureHandler(function(e) {
        showErr('Save failed: ' + (e.message || String(e)));
        btn.disabled = false;
        btn.textContent = 'SAVE GRN RECORD';
      })
      .saveGRN(data, sessionId);
  }

  // Stop timer first (if taskId available), then save
  if (taskId && sessionId) {
    try {
      google.script.run
        .withSuccessHandler(function() { afterStop(); })
        .withFailureHandler(function()  { afterStop(); })
        .stopTimer(taskId, sessionId);
    } catch(e) { afterStop(); }
  } else {
    afterStop();
  }
}

// ── Confirmation screen ────────────────────────────────────────────
function showConfirm(g) {
  // Hide form and footer
  document.getElementById('formWrap').classList.add('hidden');
  document.getElementById('stickyFooter').classList.add('hidden');

  // Populate
  document.getElementById('confGrnId').textContent  = '#' + g.grnId;
  document.getElementById('confItem').textContent   = g.itemName + ' — ' + g.supplierName;
  document.getElementById('confBatch').textContent  = 'Batch ' + g.batchNo + ' · ' + g.qtyReceived + ' units';

  var badge = document.getElementById('confBadge');
  badge.textContent = g.disposition;
  badge.className = 'confirm-badge ' + g.disposition;

  // Show with fade-in
  var cs = document.getElementById('confirmScreen');
  cs.style.display = 'block';
  // force reflow
  cs.offsetHeight; // jshint ignore:line
  cs.classList.add('visible');
  setTimeout(function() { cs.classList.add('fade-in'); }, 10);
}

// ── IQC navigation ─────────────────────────────────────────────────
function goToIqc() {
  try {
    sessionStorage.setItem('grnPrefill', JSON.stringify({
      supplierId:   savedGrn.supplierCode,
      supplierName: savedGrn.supplierName,
      itemCode:     savedGrn.itemCode,
      itemName:     savedGrn.itemName,
      batchNo:      savedGrn.batchNo,
      grnId:        savedGrn.grnId
    }));
  } catch(e) {}
  navigate('IQC');
}

// ── Init ───────────────────────────────────────────────────────────
function init() {
  initSession();

  google.script.run
    .withSuccessHandler(function(data) {
      SUPPLIERS = data.suppliers || [];
      ALL_MATS  = data.materials  || [];

      // Populate doc badge
      if (data.docNumber) {
        document.getElementById('docBadge').textContent = data.docNumber;
      }

      // Populate supplier dropdown
      var sSel = document.getElementById('supplier');
      SUPPLIERS.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.code;
        opt.textContent = s.name;
        sSel.appendChild(opt);
      });
    })
    .withFailureHandler(function(e) {
      showErr('Failed to load form data: ' + (e.message || String(e)));
    })
    .getGRNFormInit();

  // Start DWM task (fire-and-forget; store taskId)
  if (sessionId) {
    google.script.run
      .withSuccessHandler(function(tid) { taskId = tid || null; })
      .withFailureHandler(function() { taskId = null; })
      .autoQmsTask_(sessionId, 'GRN', 'GRN — incoming material', '');
  }
}

// ── Event wiring ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('backBtn').addEventListener('click', goHome);
  document.getElementById('supplier').addEventListener('change', onSupplierChange);
  document.getElementById('item').addEventListener('change', onItemChange);
  document.getElementById('qtyReceived').addEventListener('input', onQtyReceivedInput);
  document.getElementById('qtyAccepted').addEventListener('input', onQtyAcceptedInput);
  document.getElementById('batchNo').addEventListener('input', refreshSaveBtn);
  document.getElementById('btnSubmit').addEventListener('click', doSave);
  document.getElementById('btnIqc').addEventListener('click', goToIqc);
  document.getElementById('btnHome').addEventListener('click', function() { navigate('Landing'); });

  // Disposition buttons
  var dispBtns = document.querySelectorAll('.disp-btn');
  for (var i = 0; i < dispBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        selectDisp(btn.getAttribute('data-disp'));
      });
    })(dispBtns[i]);
  }

  init();
});
</script>
</body>
</html>
