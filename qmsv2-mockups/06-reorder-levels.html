<body class="bg-surface font-body-sm text-on-surface flex flex-col h-[884px] overflow-hidden">
<!-- Fixed Header Area -->
<header class="flex-none bg-surface z-50 shadow-sm border-b border-outline-variant">
<!-- Top App Bar -->
<div class="flex items-center h-12 px-margin-mobile w-full">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min -ml-3 flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface ml-2 truncate">Re-order Levels</h1>
</div>
<!-- Search Bar -->
<div class="px-margin-mobile pb-3">
<div class="relative flex items-center h-12 bg-surface-container-lowest border border-outline-variant rounded-lg focus-within:border-secondary focus-within:ring-1 focus-within:ring-secondary transition-all">
<span class="material-symbols-outlined text-outline ml-3">search</span>
<input class="w-full h-full bg-transparent border-none focus:ring-0 text-body-lg text-on-surface placeholder:text-outline px-3" placeholder="Find material..." type="text"/>
</div>
</div>
<!-- Filter Chips -->
<div class="flex items-center gap-2 px-margin-mobile pb-3 overflow-x-auto no-scrollbar">
<button class="flex-none h-8 px-4 rounded-full bg-primary-container text-on-primary font-interactive-label text-[14px] leading-tight transition-colors">All</button>
<button class="flex-none h-8 px-4 rounded-full border border-outline text-on-surface-variant font-interactive-label text-[14px] leading-tight hover:bg-surface-container transition-colors">RM</button>
<button class="flex-none h-8 px-4 rounded-full border border-outline text-on-surface-variant font-interactive-label text-[14px] leading-tight hover:bg-surface-container transition-colors">PM</button>
<button class="flex-none h-8 px-4 rounded-full border border-outline text-on-surface-variant font-interactive-label text-[14px] leading-tight hover:bg-surface-container transition-colors">FG</button>
</div>
</header>
<!-- Main Content List -->
<main class="flex-1 overflow-y-auto pb-24">
<div class="flex flex-col">
<!-- Item 1: Low Stock -->
<div class="relative flex items-center justify-between p-4 min-h-touch-target-min border-b border-outline-variant bg-surface group hover:bg-surface-container-lowest transition-colors">
<div class="absolute left-0 top-0 bottom-0 w-[3px] bg-error"></div>
<div class="flex flex-col gap-1 flex-1 pl-2">
<span class="font-interactive-label text-interactive-label text-on-surface">HDPE Pellets</span>
<span class="font-mono text-xs text-outline">RM-102</span>
</div>
<div class="flex flex-col items-end gap-1.5 w-1/2">
<div class="flex items-center gap-2">
<span class="font-mono text-[13px] text-on-surface-variant">150 kg</span>
<div aria-label="Low stock status" class="w-2 h-2 rounded-full bg-error"></div>
</div>
<div class="flex items-center">
<input aria-label="Re-order level for HDPE Pellets" class="w-16 h-8 text-right font-mono text-[13px] text-on-surface border border-outline-variant rounded bg-surface-container-lowest px-2 py-1 focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" type="text" value="500"/>
<span class="font-mono text-[13px] text-outline ml-1">kg</span>
</div>
</div>
</div>
<!-- Item 2: OK Stock -->
<div class="relative flex items-center justify-between p-4 min-h-touch-target-min border-b border-outline-variant bg-surface group hover:bg-surface-container-lowest transition-colors">
<div class="absolute left-0 top-0 bottom-0 w-[3px] bg-transparent"></div>
<div class="flex flex-col gap-1 flex-1 pl-2">
<span class="font-interactive-label text-interactive-label text-on-surface">Resin</span>
<span class="font-mono text-xs text-outline">RM-042</span>
</div>
<div class="flex flex-col items-end gap-1.5 w-1/2">
<div class="flex items-center gap-2">
<span class="font-mono text-[13px] text-on-surface-variant">1200 kg</span>
<!-- Using semantic green for OK state as requested -->
<div aria-label="OK stock status" class="w-2 h-2 rounded-full bg-[#059669]"></div>
</div>
<div class="flex items-center">
<input aria-label="Re-order level for Resin" class="w-16 h-8 text-right font-mono text-[13px] text-on-surface border border-outline-variant rounded bg-surface-container-lowest px-2 py-1 focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" type="text" value="400"/>
<span class="font-mono text-[13px] text-outline ml-1">kg</span>
</div>
</div>
</div>
<!-- Item 3: Low Stock (Edge) -->
<div class="relative flex items-center justify-between p-4 min-h-touch-target-min border-b border-outline-variant bg-surface group hover:bg-surface-container-lowest transition-colors">
<div class="absolute left-0 top-0 bottom-0 w-[3px] bg-error"></div>
<div class="flex flex-col gap-1 flex-1 pl-2">
<span class="font-interactive-label text-interactive-label text-on-surface">Steel Coil</span>
<span class="font-mono text-xs text-outline">RM-089</span>
</div>
<div class="flex flex-col items-end gap-1.5 w-1/2">
<div class="flex items-center gap-2">
<span class="font-mono text-[13px] text-on-surface-variant">800 kg</span>
<div aria-label="Low stock status" class="w-2 h-2 rounded-full bg-error"></div>
</div>
<div class="flex items-center">
<input aria-label="Re-order level for Steel Coil" class="w-16 h-8 text-right font-mono text-[13px] text-on-surface border border-outline-variant rounded bg-surface-container-lowest px-2 py-1 focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" type="text" value="800"/>
<span class="font-mono text-[13px] text-outline ml-1">kg</span>
</div>
</div>
</div>

<div class="relative flex items-center justify-between p-4 min-h-touch-target-min border-b border-outline-variant bg-surface group hover:bg-surface-container-lowest transition-colors">
<div class="absolute left-0 top-0 bottom-0 w-[3px] bg-transparent"></div>
<div class="flex flex-col gap-1 flex-1 pl-2">
<span class="font-interactive-label text-interactive-label text-on-surface">Polycarbonate</span>
<span class="font-mono text-xs text-outline">RM-055</span>
</div>
<div class="flex flex-col items-end gap-1.5 w-1/2">
<div class="flex items-center gap-2">
<span class="font-mono text-[13px] text-on-surface-variant">2200 kg</span>

</div>
</div>
</div>
</div>

<button class="w-full h-touch-target-min bg-primary-container text-on-primary font-interactive-label text-interactive-label rounded-lg opacity-40 cursor-not-allowed transition-all flex items-center justify-center" disabled="">
            Save changes
