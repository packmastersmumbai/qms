<!-- FormKit — shared QMS form design system. Include in <head> via:  <?!= include('FormKit') ?>
     Mirrors the QMS v2 cockpit's Stitch / Material Design 3 tokens as plain CSS (no CDN, so it
     works inside the GAS double-iframe where cdn.tailwindcss.com is unreliable). Component
     classes are prefixed `fk-` so they never clash with a form's existing `.prd-*`/`.param-*`. -->
<style>
  :root {
    /* Stitch / M3 palette (verbatim from QMSV2 tailwind.config) */
    --fk-primary:            #000747;
    --fk-primary-container:  #0d1b6e;
    --fk-navy:               #1e3a5f;  /* shared header anchor already used across forms */
    --fk-surface:            #f9f9ff;
    --fk-surface-container:  #e7eefe;
    --fk-surface-low:        #f0f3ff;
    --fk-card:               #ffffff;
    --fk-on-surface:         #151c27;
    --fk-on-surface-variant: #454651;
    --fk-outline:            #767682;
    --fk-outline-variant:    #c6c5d3;
    --fk-pass:               #16a34a;
    --fk-fail:               #dc2626;
    --fk-warn:               #d97706;
    --fk-na:                 #64748b;
    --fk-accent:             #0ea5e9;
    /* radii + rhythm */
    --fk-r-sm: .25rem; --fk-r: .5rem; --fk-r-md: .75rem; --fk-r-lg: 1rem;
    --fk-space: 8px;
    --fk-shadow: 0 2px 8px rgba(15,23,42,.08);
    --fk-shadow-up: 0 -4px 12px rgba(15,23,42,.06);
    --fk-tap: 44px;
    --fk-font: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --fk-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }

  /* Icon FOUT: hide Material Symbols ligature text until the font is ready.
     A tiny inline script (added per page) sets <html class="fonts-ready"> on load. */
  .material-symbols-outlined { visibility: hidden; }
  html.fonts-ready .material-symbols-outlined { visibility: visible; }

  /* ── Page shell ─────────────────────────────────────────────────────────── */
  .fk-page {
    max-width: 768px; margin: 0 auto; width: 100%;
    padding: 16px 16px 96px;      /* bottom clearance for the sticky footer */
    display: flex; flex-direction: column; gap: 16px;
    color: var(--fk-on-surface); font-family: var(--fk-font);
  }
  @media (min-width: 900px) { .fk-page { max-width: 820px; } }

  /* ── Card ───────────────────────────────────────────────────────────────── */
  .fk-card {
    background: var(--fk-card);
    border: 1px solid var(--fk-outline-variant);
    border-radius: var(--fk-r-md);
    box-shadow: var(--fk-shadow);
    overflow: hidden;                /* keeps the header strip's corners aligned */
  }
  .fk-card-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .fk-card-head {
    background: var(--fk-navy); color: #fff;
    padding: 10px 16px;
    font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  /* Standalone light section label (no navy bar) */
  .fk-sec {
    font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
    color: var(--fk-on-surface-variant); margin: 2px 0 6px;
  }

  /* ── Fields ─────────────────────────────────────────────────────────────── */
  .fk-field { display: flex; flex-direction: column; gap: 6px; }
  .fk-label { font-size: 13px; font-weight: 600; color: var(--fk-on-surface); }
  .fk-label .req { color: var(--fk-fail); }
  .fk-label .opt { color: var(--fk-on-surface-variant); font-weight: 500; }
  .fk-input, .fk-select {
    height: var(--fk-tap); width: 100%;
    border: 1.5px solid var(--fk-outline-variant);
    border-radius: var(--fk-r); padding: 0 12px;
    font-size: 15px; color: var(--fk-on-surface); background: var(--fk-card);
    font-family: var(--fk-font); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .fk-input.mono, .fk-select.mono { font-family: var(--fk-mono); }
  .fk-input:focus, .fk-select:focus {
    border-color: var(--fk-accent);
    box-shadow: 0 0 0 4px rgba(14,165,233,.15);
  }
  .fk-input::placeholder { color: #94a3b8; }
  .fk-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fk-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* ── PASS / FAIL / NA segmented group ───────────────────────────────────── */
  .fk-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fk-seg.two { grid-template-columns: repeat(2, 1fr); }
  .fk-seg-btn {
    height: 40px; border: 1.5px solid var(--fk-outline-variant); border-radius: var(--fk-r);
    background: var(--fk-card); color: var(--fk-on-surface-variant);
    font-size: 12px; font-weight: 700; letter-spacing: .04em; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .fk-seg-btn:hover { border-color: var(--fk-outline); }
  .fk-seg-btn.is-pass { background: var(--fk-pass); border-color: var(--fk-pass); color: #fff; }
  .fk-seg-btn.is-fail { background: var(--fk-fail); border-color: var(--fk-fail); color: #fff; }
  .fk-seg-btn.is-na   { background: var(--fk-na);   border-color: var(--fk-na);   color: #fff; }

  /* ── Tabs (pill) ────────────────────────────────────────────────────────── */
  .fk-tabs {
    display: flex; gap: 4px; background: var(--fk-surface-container);
    padding: 4px; border-radius: var(--fk-r-lg);
  }
  .fk-tab {
    flex: 1; min-height: 38px; border: 0; border-radius: var(--fk-r-md);
    background: transparent; color: var(--fk-on-surface-variant);
    font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s;
  }
  .fk-tab.active { background: var(--fk-card); color: var(--fk-primary); box-shadow: var(--fk-shadow); }

  /* ── Sticky footer + buttons ────────────────────────────────────────────── */
  .fk-footer {
    position: fixed; bottom: 0; left: 0; width: 100%; z-index: 40;
    background: var(--fk-card); border-top: 1px solid var(--fk-outline-variant);
    box-shadow: var(--fk-shadow-up); padding: 12px 16px;
  }
  .fk-footer-inner { max-width: 768px; margin: 0 auto; display: flex; gap: 10px; }
  .fk-btn {
    min-height: var(--fk-tap); border: 0; border-radius: var(--fk-r); cursor: pointer;
    font-size: 15px; font-weight: 700; padding: 0 18px; letter-spacing: .01em;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity .15s, background .15s;
  }
  .fk-btn:disabled { opacity: .45; cursor: not-allowed; }
  .fk-btn-primary { flex: 1; background: var(--fk-primary); color: #fff; }
  .fk-btn-pass    { flex: 1; background: var(--fk-pass); color: #fff; }
  .fk-btn-ghost   { background: transparent; color: var(--fk-primary); border: 1.5px solid var(--fk-outline-variant); }

  /* Sticky-per-pane save (for tabbed forms without a fixed footer) */
  .fk-save-sticky {
    position: sticky; bottom: 8px; z-index: 20; width: 100%;
    box-shadow: 0 4px 14px rgba(0,7,71,.28);
  }

  /* ── Main navigation bar (auto-injected) ────────────────────────────────── */
  /* Fixed at the very bottom on every form. When a .fk-footer (sticky Save bar)
     exists, the injector lifts it to sit ABOVE this nav so neither is cut off, and
     pads the body so form content clears both. Height 56px. */
  .fk-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50;
    height: 56px; background: var(--fk-card);
    border-top: 1px solid var(--fk-outline-variant);
    box-shadow: 0 -2px 8px rgba(15,23,42,.05);
    display: flex; align-items: stretch;
  }
  .fk-nav-inner { max-width: 768px; margin: 0 auto; width: 100%; display: flex; }
  .fk-nav-btn {
    flex: 1; border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--fk-on-surface-variant); font-family: var(--fk-font);
    font-size: 10px; font-weight: 600; letter-spacing: .02em;
    transition: color .15s;
  }
  .fk-nav-btn:hover, .fk-nav-btn:active { color: var(--fk-primary); }
  .fk-nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
<script>
(function () {
  // FormKit main-nav: one bottom bar (Home / Records / KPIs / Warehouse) injected into
  // every form that includes FormKit. Uses inline SVG (no icon-font dependency) so the
  // mini-icons always render. Navigates via the SPA's navigateTo(); falls back to a
  // server getFormHtml() fetch if navigateTo isn't present.
  var NAV = [
    { key: 'QMSV2',     label: 'Home',      d: 'M3 11l9-8 9 8M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10' },
    { key: 'Records',   label: 'Records',   d: 'M8 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2h-2M8 3a2 2 0 002 2h4a2 2 0 002-2M8 3a2 2 0 012-2h4a2 2 0 012 2M9 12h6M9 16h6' },
    { key: 'KPI',       label: 'KPIs',      d: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
    { key: 'Warehouse', label: 'Warehouse', d: 'M3 21V8l9-5 9 5v13M3 21h18M9 21v-6h6v6' }
  ];
  function go(key) {
    try {
      if (typeof window.navigateTo === 'function') { window.navigateTo(key); return; }
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function (html) {
          document.open(); document.write(html); document.close();
        }).getFormHtml(key);
        return;
      }
    } catch (e) {}
  }
  function build() {
    if (document.getElementById('fkNav')) return;
    var nav = document.createElement('nav');
    nav.className = 'fk-nav'; nav.id = 'fkNav';
    var inner = document.createElement('div'); inner.className = 'fk-nav-inner';
    NAV.forEach(function (item) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'fk-nav-btn';
      b.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + item.d + '"/></svg><span>' + item.label + '</span>';
      b.addEventListener('click', function () { go(item.key); });
      inner.appendChild(b);
    });
    nav.appendChild(inner);
    document.body.appendChild(nav);

    // Lift any save footer/button to sit ABOVE the 56px nav so it isn't cut off.
    // Handles both fixed footers and sticky-per-pane save buttons (Production's .prd-save,
    // which sticks 8px from the bottom and would otherwise overlap the nav).
    var NAV_H = 56;
    ['.fk-footer', '#stickyBar', '#stickyFooter', '#ipqcActionBar', '#dispStickyFooter', '.prd-save', '.fk-save-sticky']
      .forEach(function (sel) {
        document.querySelectorAll(sel).forEach(function (el) {
          var cs = getComputedStyle(el);
          if (cs.position === 'fixed') { el.style.bottom = NAV_H + 'px'; }
          else if (cs.position === 'sticky') { el.style.bottom = (NAV_H + 8) + 'px'; }
        });
      });
    // Reserve bottom space on the body so form content clears the nav (+footer if any).
    var hasFooter = !!document.querySelector('.fk-footer, #stickyBar, #stickyFooter, #ipqcActionBar, #dispStickyFooter');
    var pad = NAV_H + (hasFooter ? 76 : 8);
    document.body.style.paddingBottom = pad + 'px';
    // If the form has its OWN bottom nav (IPQC's #ipqcBottomNav, NCR's tab-bar, etc.),
    // hide it in favour of this single unified bar to avoid two stacked nav rows.
    document.querySelectorAll('nav').forEach(function (n) {
      if (n.id === 'fkNav') return;
      var cs = getComputedStyle(n);
      if (cs.position === 'fixed' && parseInt(cs.bottom, 10) === 0) { n.style.display = 'none'; }
    });
    var own = document.getElementById('ipqcBottomNav');
    if (own) { own.style.display = 'none'; }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();
</script>
