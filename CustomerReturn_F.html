  <meta charset="UTF-8">

  <style>
    /* Compact responsive layout — widen container; triage list flows multi-column. */
    #crMain { max-width: 42rem; }
    @media (min-width: 768px) {
      #crMain { max-width: 64rem; }
      #triageList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: var(--pm-page, #f8fafc);
      font-family: 'Inter', sans-serif;
      color: #0f172a;
      min-height: 100dvh;
    }
    h1, h2, h3, h4, h5, h6, .font-headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Toast */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #222; color: #fff; padding: 8px 18px; border-radius: 20px;
      font-size: 13px; opacity: 0; transition: opacity 0.2s; z-index: 1000;
      white-space: nowrap;
    }
    #toast.show    { opacity: 1; }
    #toast.error   { background: #dc2626; }
    #toast.warning { background: #d97706; }
  </style>

</head>
<body class="pb-20">

      <!-- Explicit destination, not history.back(). Navigation is document.write-based,
           so before SPA history existed Back left the app entirely; and even with it,
           a directly-opened form has no internal entry to step back to. -->
      <button onclick="pmGoBack_()" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-white/10">
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
      </button>
      <span class="text-lg font-bold">Returns Management</span>
    </div>
    <span class="bg-[#d97706] text-white text-xs font-bold px-3 py-1 rounded-full" id="openCount">0 open</span>
  </header>

  <!-- Tabs (pill chips) -->
  <div class="flex gap-2 bg-white px-4 py-3 sticky top-14 z-30 border-b border-slate-200">

      Triage
    </button>
    <button class="cr-tab flex-1 h-9 px-4 text-[12px] font-semibold uppercase tracking-wider rounded-full transition-colors"
            id="tab-new" onclick="switchTab('new')">
      New Return
    </button>
  </div>

  <!-- Main Content -->
  <main id="crMain" class="p-4 flex flex-col gap-4 mx-auto w-full">

    <!-- TRIAGE PANE -->
    <div id="paneTriage">
      <div id="triageList" class="text-center py-16 text-slate-400">
        <span class="material-symbols-outlined text-5xl mb-3 opacity-40">hourglass_empty</span>
        <p class="text-sm">Loading…</p>
      </div>
    </div>

    <!-- NEW RETURN PANE -->
    <div id="paneNew" style="display:none;">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col gap-4">

        <div class="flex gap-3">
          <div class="flex flex-col gap-1 flex-1">
            <label class="text-sm font-medium text-slate-600">Return No.</label>
            <input id="fDocNo" disabled
              class="h-12 w-full border border-slate-300 rounded-lg px-3 text-base bg-slate-50 text-slate-500 cursor-not-allowed" />
          </div>
          <div class="flex flex-col gap-1 flex-1">
            <label class="text-sm font-medium text-slate-600">Return Date</label>
            <input type="date" id="fDate"
              class="h-12 w-full border border-slate-300 rounded-lg px-3 text-base focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-slate-600">Customer</label>
          <select id="fCustomer"
            class="h-12 w-full border border-slate-300 rounded-lg px-3 text-base bg-white focus:border-sky-400 focus:ring-2 focus:ring-sky-100">
            <option value="">— select —</option>
          </select>
        </div>

        <!-- Original Gatepass — dropdown, dependent on the selected customer. -->
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-slate-600">Original Gatepass No.</label>
          <select id="fGatepass" disabled
            class="h-12 w-full border border-slate-300 rounded-lg px-3 text-base bg-white focus:border-sky-400 focus:ring-2 focus:ring-sky-100 disabled:bg-slate-50 disabled:text-slate-400">
            <option value="">— select customer first —</option>
          </select>
        </div>

        <!-- Items from the selected gatepass — tick the ones being returned + enter return qty. -->
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-slate-600">Items Returned</label>
          <div id="fItems" class="flex flex-col gap-2">
            <div class="text-[13px] text-slate-400 py-4 text-center border border-dashed border-slate-200 rounded-lg">
              Select a gatepass to list its items.
            </div>
          </div>

        <div class="flex flex-col gap-1">

          <textarea id="fReason" placeholder="Why was this returned?" rows="3"

            <button type="button" data-defect="WRONG_PRODUCT" class="defect-chip h-8 px-3 rounded-full bg-slate-100 text-slate-600 text-[12px] font-semibold uppercase tracking-wider">Wrong Product</button>
            <button type="button" data-defect="QUALITY" class="defect-chip h-8 px-3 rounded-full bg-slate-100 text-slate-600 text-[12px] font-semibold uppercase tracking-wider">Quality</button>
            <button type="button" data-defect="LABELING" class="defect-chip h-8 px-3 rounded-full bg-slate-100 text-slate-600 text-[12px] font-semibold uppercase tracking-wider">Labeling</button>
            <button type="button" data-defect="OTHER" class="defect-chip h-8 px-3 rounded-full bg-slate-100 text-slate-600 text-[12px] font-semibold uppercase tracking-wider">Other</button>
          </div>

        <!-- Photo upload (fix #23) -->
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-slate-600">Evidence Photos</label>
          <label class="w-full h-24 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-sky-400 hover:bg-sky-50 transition-colors">
            <input type="file" accept="image/*" multiple class="hidden" id="fPhotos">
            <span class="material-symbols-outlined text-slate-400 text-[32px]">photo_camera</span>
            <span class="text-[12px] text-slate-500 mt-1">Tap to capture or attach</span>
          </label>
          <div id="fPhotosPreview" class="flex gap-2 flex-wrap"></div>
        </div>

        <button id="btnSave" onclick="saveReturn()"
          class="w-full h-14 bg-[#1e3a5f] hover:bg-[#162d4a] text-white rounded-xl text-base font-semibold transition-colors shadow-sm mt-1 disabled:opacity-50 disabled:cursor-not-allowed">
          Save Return
        </button>
      </div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    /* ── state ── */
    var INIT = null;
    var OPEN_RETURNS = [];
    var DISPOSITIONS = [];
    var GATEPASSES = [];       // returnable gatepasses for the selected customer
    var CURRENT_GP = null;     // the selected gatepass object (with .items)

    /* ── utils ── */
    function showToast(msg, kind) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show' + (kind === 'error' ? ' error' : '');
      setTimeout(function(){ t.className = ''; }, 2400);
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ── tabs ── */
    function switchTab(name) {
      var isT = name === 'triage';
      var tabT = document.getElementById('tab-triage');
      var tabN = document.getElementById('tab-new');
      var base = 'cr-tab flex-1 h-9 px-4 text-[12px] font-semibold uppercase tracking-wider rounded-full transition-colors ';
      tabT.className = base + (isT ? 'bg-[#1e3a5f] text-white' : 'bg-slate-100 text-slate-500');
      tabN.className = base + (!isT ? 'bg-[#1e3a5f] text-white' : 'bg-slate-100 text-slate-500');
      document.getElementById('paneTriage').style.display = isT ? '' : 'none';
      document.getElementById('paneNew').style.display    = isT ? 'none' : '';
    }

    /* ── defect chip selector ── */
    var _selectedDefect = '';
    document.addEventListener('click', function(e){
      var btn = e.target.closest('.defect-chip');
      if (!btn) return;
      document.querySelectorAll('.defect-chip').forEach(function(b){
        b.className = 'defect-chip h-8 px-3 rounded-full bg-slate-100 text-slate-600 text-[12px] font-semibold uppercase tracking-wider';
      });
      btn.className = 'defect-chip h-8 px-3 rounded-full bg-[#1e3a5f] text-white text-[12px] font-semibold uppercase tracking-wider';
      _selectedDefect = btn.dataset.defect || '';
    });

    /* ── photo preview ── */
    document.addEventListener('change', function(e){
      if (e.target && e.target.id === 'fPhotos') {
        var prev = document.getElementById('fPhotosPreview');
        prev.innerHTML = '';
        var files = e.target.files || [];
        for (var i = 0; i < files.length; i++) {
          var url = URL.createObjectURL(files[i]);
          var img = document.createElement('img');
          img.src = url;
          img.className = 'w-16 h-16 rounded-lg object-cover border border-slate-200';
          prev.appendChild(img);
        }
      }
    });

    /* ── init ── */
    function loadInit() {
      google.script.run
        .withSuccessHandler(function(data){
          INIT = data;
          document.getElementById('fDocNo').value = data.docNumber || '';
          document.getElementById('fDate').value  = data.today || '';
          var cust = document.getElementById('fCustomer');
          cust.innerHTML = '<option value="">— select —</option>' +
            (data.customers || []).map(function(c){
              var code = c.code || c.customerCode || '';
              var name = c.name || c.customerName || '';
              return '<option value="' + escapeHtml(code) + '" data-name="' + escapeHtml(name) + '">' +
                     escapeHtml(name || code) + '</option>';
            }).join('');
          var rec = document.getElementById('fReceivedBy');
          rec.innerHTML = '<option value="">— select —</option>' +
            (data.inspectors || []).map(function(i){
              var n = i.name || i;
              return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</option>';
            }).join('');
          // Customer → fetch its returnable gatepasses; gatepass → render its items.
          cust.addEventListener('change', onCustomerChange);
          document.getElementById('fGatepass').addEventListener('change', onGatepassChange);
        })
        .withFailureHandler(function(e){ showToast('Init failed: ' + (e.message || e), 'error'); })
        .getCustomerReturnFormInit();

      google.script.run
        .withSuccessHandler(function(list){ DISPOSITIONS = list || []; })
        .withFailureHandler(function(){})
        .getCustomerReturnDispositions();

      reloadTriage();
    }

    function reloadTriage() {
      var box = document.getElementById('triageList');
      box.innerHTML = '<div class="text-center py-16 text-slate-400">' +
        '<span class="material-symbols-outlined text-5xl mb-3 opacity-40">hourglass_empty</span>' +
        '<p class="text-sm">Loading…</p></div>';
      google.script.run
        .withSuccessHandler(function(list){
          OPEN_RETURNS = list || [];
          document.getElementById('openCount').textContent = OPEN_RETURNS.length + ' open';
          renderTriage();
        })
        .withFailureHandler(function(e){
          box.innerHTML = '<div class="text-center py-16 text-slate-400">' +
            '<span class="material-symbols-outlined text-5xl mb-3">warning</span>' +
            '<p class="text-sm">Load failed: ' + escapeHtml(e.message || e) + '</p></div>';
        })
        .getOpenCustomerReturns();
    }

    function renderTriage() {
      var box = document.getElementById('triageList');
      if (!OPEN_RETURNS.length) {
        box.innerHTML = '<div class="text-center py-16 text-slate-400">' +
          '<span class="material-symbols-outlined text-5xl mb-3 opacity-40">check_circle</span>' +
          '<p class="text-sm">No open returns. All triaged.</p></div>';
        return;
      }
      box.innerHTML = '<div class="flex flex-col gap-3">' +
        OPEN_RETURNS.map(function(r){
          return [
            '<div class="bg-white rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-[#ca8a04] overflow-hidden" data-rtn="' + escapeHtml(r.rtnNo) + '">',
              /* card header */
              '<div class="flex justify-between items-center px-4 py-3 bg-amber-50 border-b border-amber-100">',
                '<span class="text-sm font-bold text-[#1e3a5f]">' + escapeHtml(r.rtnNo) + '</span>',
                '<span class="bg-[#d97706] text-white text-xs font-semibold px-3 py-1 rounded-full">' + escapeHtml(r.returnDate) + '</span>',
              '</div>',
              /* card body */
              '<div class="px-4 py-3 flex flex-col gap-1 text-sm">',
                '<div class="flex gap-2"><span class="text-slate-400 w-24 shrink-0 text-xs">Customer</span><span class="text-slate-700">' + escapeHtml(r.customerName || r.customerCode) + '</span></div>',
                '<div class="flex gap-2"><span class="text-slate-400 w-24 shrink-0 text-xs">Product</span><span class="text-slate-700">' + escapeHtml(r.productDesc || r.productCode) + '</span></div>',
                '<div class="flex gap-2"><span class="text-slate-400 w-24 shrink-0 text-xs">FG Batch</span><span class="text-slate-700">' + escapeHtml(r.fgBatchNo) + '</span></div>',
                '<div class="flex gap-2"><span class="text-slate-400 w-24 shrink-0 text-xs">Qty</span><span class="text-slate-700">' + escapeHtml(r.qtyReturned) + ' ' + escapeHtml(r.unit || '') + '</span></div>',
                '<div class="flex gap-2"><span class="text-slate-400 w-24 shrink-0 text-xs">Gatepass</span><span class="text-slate-700">' + escapeHtml(r.originalGatepass || '—') + '</span></div>',
                '<div class="flex gap-2"><span class="text-slate-400 w-24 shrink-0 text-xs">Received By</span><span class="text-slate-700">' + escapeHtml(r.receivedBy) + '</span></div>',
                r.returnReason ? '<div class="mt-2 bg-slate-50 rounded-lg px-3 py-2 border-l-4 border-[#d97706] text-slate-500 italic text-xs">' + escapeHtml(r.returnReason) + '</div>' : '',
              '</div>',
              /* stacked disposition options (fix #21) */
              '<div class="flex flex-col gap-2 px-4 pb-2 pt-1" data-disp-group="' + escapeHtml(r.rtnNo) + '">',
                '<button class="disp-opt h-12 w-full border-2 border-slate-200 bg-white text-slate-700 rounded-lg flex items-center gap-3 px-4 text-left font-semibold transition-all" data-disp="RESTOCK">',
                  '<span class="material-symbols-outlined text-[#16a34a]">recycling</span>',
                  '<span class="text-sm">Restock to FG warehouse</span>',
                '</button>',
                '<button class="disp-opt h-12 w-full border-2 border-slate-200 bg-white text-slate-700 rounded-lg flex items-center gap-3 px-4 text-left font-semibold transition-all" data-disp="REWORK">',
                  '<span class="material-symbols-outlined text-[#2563eb]">build</span>',
                  '<span class="text-sm">Rework / Repair</span>',
                '</button>',
                '<button class="disp-opt h-12 w-full border-2 border-slate-200 bg-white text-slate-700 rounded-lg flex items-center gap-3 px-4 text-left font-semibold transition-all" data-disp="SCRAP">',
                  '<span class="material-symbols-outlined text-[#dc2626]">delete</span>',
                  '<span class="text-sm">Scrap (raises NCR)</span>',
                '</button>',
              '</div>',
              '<div class="px-4 pb-4">',
                '<button class="apply-disp h-12 w-full bg-[#1e3a5f] hover:bg-[#162d4a] text-white rounded-lg text-sm font-semibold uppercase tracking-wider disabled:opacity-40" disabled onclick="applyDispFromCard(\'' + escapeHtml(r.rtnNo) + '\')">',
                  'Apply Disposition',
                '</button>',
              '</div>',
            '</div>'
          ].join('');
        }).join('') + '</div>';
    }

    /* ── stacked disposition: select option then Apply ── */
    document.addEventListener('click', function(e){
      var btn = e.target.closest('.disp-opt');
      if (!btn) return;
      var card = btn.closest('[data-rtn]');
      if (!card) return;
      card.querySelectorAll('.disp-opt').forEach(function(b){
        b.className = 'disp-opt h-12 w-full border-2 border-slate-200 bg-white text-slate-700 rounded-lg flex items-center gap-3 px-4 text-left font-semibold transition-all';
      });
      btn.className = 'disp-opt h-12 w-full border-2 border-[#1e3a5f] bg-[#eff6ff] text-[#1e3a5f] rounded-lg flex items-center gap-3 px-4 text-left font-semibold transition-all';
      card.dataset.pickedDisp = btn.dataset.disp || '';
      var apply = card.querySelector('.apply-disp');
      if (apply) apply.disabled = !card.dataset.pickedDisp;
    });

    function applyDispFromCard(rtnNo) {
      var card = document.querySelector('[data-rtn="' + rtnNo + '"]');
      var d = card && card.dataset.pickedDisp;
      if (!d) return;
      dispose(rtnNo, d);
    }
    window.applyDispFromCard = applyDispFromCard;

    function dispose(rtnNo, disposition) {
      var card = document.querySelector('[data-rtn="' + rtnNo + '"]');
      if (card) card.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
      var remarks = '';
      if (disposition !== 'RESTOCK') {
        remarks = prompt('Remarks for ' + disposition + ' on ' + rtnNo + ' (auto-raises NCR):', '');
        if (remarks === null) {
          if (card) card.querySelectorAll('button').forEach(function(b){ b.disabled = false; });
          return;
        }
      }
      google.script.run
        .withSuccessHandler(function(res){
          if (!res || !res.success) {
            showToast('Failed: ' + (res && res.error || 'unknown'), 'error');
            if (card) card.querySelectorAll('button').forEach(function(b){ b.disabled = false; });
            return;
          }
          if (card) card.parentNode.removeChild(card);
          OPEN_RETURNS = OPEN_RETURNS.filter(function(r){ return r.rtnNo !== rtnNo; });
          document.getElementById('openCount').textContent = OPEN_RETURNS.length + ' open';
          if (!OPEN_RETURNS.length) renderTriage();
          showToast(disposition + ' recorded' + (res.ncrNo ? ' — NCR ' + res.ncrNo : ''));
          var hasWarnings = (res.warnings && res.warnings.length) || res.ncrError;
          if (hasWarnings) {
            var msgs = (res.warnings && res.warnings.length) ? res.warnings : [res.ncrError];
            setTimeout(function(){ showToast('⚠ ' + msgs.join(' | '), 'warning'); }, 600);
          }
        })
        .withFailureHandler(function(e){
          showToast('Error: ' + (e.message || e), 'error');
          if (card) card.querySelectorAll('button').forEach(function(b){ b.disabled = false; });
        })
        .disposeCustomerReturn({ rtnNo: rtnNo, disposition: disposition, disposedBy: getCurrentUserName(), remarks: remarks });
    }

    function getCurrentUserName() {
      var sel = document.getElementById('fReceivedBy');
      return sel && sel.value ? sel.value : '';
    }

    /* ── cascading gatepass → items ── */
    function onCustomerChange() {
      var custOpt = document.getElementById('fCustomer').selectedOptions[0];
      var custName = custOpt ? (custOpt.dataset.name || custOpt.textContent) : '';
      var gpSel = document.getElementById('fGatepass');
      CURRENT_GP = null; renderItems();
      gpSel.disabled = true;
      gpSel.innerHTML = '<option value="">Loading gatepasses…</option>';
      if (!custName) { gpSel.innerHTML = '<option value="">— select customer first —</option>'; return; }
      google.script.run
        .withSuccessHandler(function(res){
          GATEPASSES = (res && res.gatepasses) || [];
          if (!GATEPASSES.length) {
            gpSel.innerHTML = '<option value="">— no gatepasses for this customer —</option>';
            gpSel.disabled = true; return;
          }
          gpSel.innerHTML = '<option value="">— select gatepass —</option>' +
            GATEPASSES.map(function(g){
              var n = g.items ? g.items.length : 0;
              return '<option value="' + escapeHtml(g.gpNo) + '">' +
                escapeHtml(g.gpNo) + (g.date ? ' · ' + escapeHtml(g.date) : '') +
                ' · ' + n + ' item' + (n === 1 ? '' : 's') + '</option>';
            }).join('');
          gpSel.disabled = false;
        })
        .withFailureHandler(function(e){ gpSel.innerHTML = '<option value="">Load failed</option>'; showToast('Gatepass load failed: ' + (e.message || e), 'error'); })
        .getReturnableGatepasses(custName);
    }

    function onGatepassChange() {
      var gpNo = document.getElementById('fGatepass').value;
      CURRENT_GP = GATEPASSES.filter(function(g){ return g.gpNo === gpNo; })[0] || null;
      renderItems();
    }

    function renderItems() {
      var box = document.getElementById('fItems');
      if (!CURRENT_GP || !CURRENT_GP.items || !CURRENT_GP.items.length) {
        box.innerHTML = '<div class="text-[13px] text-slate-400 py-4 text-center border border-dashed border-slate-200 rounded-lg">Select a gatepass to list its items.</div>';
        return;
      }
      box.innerHTML = CURRENT_GP.items.map(function(it, i){
        var label = (it.materialDesc || it.materialCode || 'Item ' + (i + 1));
        var shipped = (it.qty !== '' ? it.qty : '?') + (it.unit ? ' ' + it.unit : '');
        return '<div class="js-ri border border-slate-200 rounded-lg p-3 flex flex-col gap-2" data-i="' + i + '">' +
            '<label class="flex items-start gap-2 cursor-pointer">' +
              '<input type="checkbox" class="js-ri-check mt-1 w-4 h-4 accent-sky-600" data-i="' + i + '">' +
              '<span class="flex-1 min-w-0">' +
                '<span class="block text-[14px] font-medium text-slate-700 truncate">' + escapeHtml(label) + '</span>' +
                '<span class="block text-[12px] text-slate-400">Code ' + escapeHtml(it.materialCode || '—') + ' · shipped ' + escapeHtml(shipped) + '</span>' +
              '</span>' +
            '</label>' +
            '<div class="js-ri-qtyrow hidden flex-col gap-2 pl-6">' +
              '<div class="flex items-center gap-2">' +
                '<input type="number" min="0" step="any" placeholder="Return qty" class="js-ri-qty h-10 w-32 border border-slate-300 rounded-lg px-2 text-base focus:border-sky-400 focus:ring-2 focus:ring-sky-100">' +
                '<span class="text-[13px] text-slate-500">' + escapeHtml(it.unit || '') + '</span>' +
              '</div>' +
              '<input type="text" placeholder="FG Batch No." value="' + escapeHtml(it.batch || '') + '" class="js-ri-batch h-10 w-full border border-slate-300 rounded-lg px-2 text-base focus:border-sky-400 focus:ring-2 focus:ring-sky-100">' +
            '</div>' +
          '</div>';
      }).join('');
      // toggle qty row on check
      Array.prototype.forEach.call(box.querySelectorAll('.js-ri-check'), function(cb){
        cb.addEventListener('change', function(){
          var row = cb.closest('.js-ri').querySelector('.js-ri-qtyrow');
          if (cb.checked) {
            row.classList.remove('hidden'); row.style.display = 'flex';
            var q = row.querySelector('.js-ri-qty');
            if (q && !q.value && CURRENT_GP.items[cb.dataset.i].qty) q.value = CURRENT_GP.items[cb.dataset.i].qty;
          } else {
            row.classList.add('hidden'); row.style.display = '';
          }
        });
      });
    }

    // Collect checked items into the multi-item save payload.
    function collectReturnItems() {
      var out = [];
      if (!CURRENT_GP) return out;
      Array.prototype.forEach.call(document.querySelectorAll('#fItems .js-ri'), function(rowEl){
        var cb = rowEl.querySelector('.js-ri-check');
        if (!cb || !cb.checked) return;
        var it = CURRENT_GP.items[Number(cb.dataset.i)];
        var qtyEl = rowEl.querySelector('.js-ri-qty');
        var batchEl = rowEl.querySelector('.js-ri-batch');
        out.push({
          productCode: it.materialCode || '',
          productDesc: it.materialDesc || '',
          fgBatchNo:   (batchEl && batchEl.value.trim()) || it.batch || '',
          qtyReturned: Number(qtyEl && qtyEl.value) || 0,
          unit:        it.unit || ''
        });
      });
      return out;
    }

    function saveReturn() {
      var items = collectReturnItems();
      var data = {
        returnDate:       document.getElementById('fDate').value,
        customerCode:     document.getElementById('fCustomer').value,
        customerName:     (function(){ var o = document.getElementById('fCustomer').selectedOptions[0]; return o ? o.dataset.name || o.textContent : ''; })(),
        originalGatepass: document.getElementById('fGatepass').value,
        returnReason:     document.getElementById('fReason').value.trim(),
        receivedBy:       document.getElementById('fReceivedBy').value,
        remarks:          document.getElementById('fRemarks').value.trim(),
        defectCategory:   _selectedDefect || '',
        items:            items
      };
      if (!data.customerCode)        { showToast('Customer is required', 'error'); return; }
      if (!data.originalGatepass)    { showToast('Select a gatepass', 'error'); return; }
      if (!items.length)             { showToast('Tick at least one item to return', 'error'); return; }
      if (items.some(function(it){ return !it.qtyReturned; })) { showToast('Enter return qty for each ticked item', 'error'); return; }
      if (!data.receivedBy)          { showToast('Received By required', 'error'); return; }

      var btn = document.getElementById('btnSave');
      // Offline gate + 30s watchdog + double-tap block (Phase 2E) — this form had
      // none, so a dropped connection left Save disabled with no message.
      var _g = (window.QMS && QMS.attachSaveGuard)
        ? QMS.attachSaveGuard(btn, 'Save Return', { onMessage: function (m) { showToast(m, 'error'); } })
        : { proceed: function () { return true; }, wrap: function (f) { return f; }, wrapFail: function (f) { return f; } };
      if (!_g.proceed()) return;

      btn.disabled = true;
      btn.textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(_g.wrap(function(res){
          btn.disabled = false;
          btn.textContent = 'Save Return';
          if (!res || !res.success) {
            showToast('Save failed: ' + (res && res.error || 'unknown'), 'error');
            return;
          }
          showToast('Return ' + res.rtnNo + ' saved');
          if (res.warnings && res.warnings.length) {
            setTimeout(function(){ showToast('⚠ ' + res.warnings.join(' | '), 'warning'); }, 600);
          }
          // Upload any selected photos
          var photoInput = document.getElementById('fPhotos');
          var files = (photoInput && photoInput.files) ? photoInput.files : [];
          if (files.length) {
            showToast('Uploading ' + files.length + ' photo(s)…');
            Array.prototype.forEach.call(files, function(f){
              var reader = new FileReader();
              reader.onload = function(ev){
                var b64 = (ev.target.result || '').split(',')[1] || '';
                if (!b64) return;
                google.script.run
                  .withSuccessHandler(function(){})
                  .withFailureHandler(function(err){ showToast('Photo upload failed: ' + err.message, 'error'); })
                  .uploadCustomerReturnPhoto({ rtnNo: res.rtnNo, base64: b64, filename: f.name, mimeType: f.type || 'image/jpeg' });
              };
              reader.readAsDataURL(f);
            });
          }
          // Reset form
          CURRENT_GP = null; GATEPASSES = [];
          var gpSel = document.getElementById('fGatepass');
          gpSel.innerHTML = '<option value="">— select customer first —</option>'; gpSel.disabled = true;
          renderItems();
          document.getElementById('fReason').value     = '';
          document.getElementById('fRemarks').value    = '';
          if (photoInput) photoInput.value = '';
          document.getElementById('fPhotosPreview').innerHTML = '';
          document.querySelectorAll('.defect-chip').forEach(function(b){
            b.className = 'defect-chip h-8 px-3 rounded-full bg-slate-100 text-slate-600 text-[12px] font-semibold uppercase tracking-wider';
          });
          _selectedDefect = '';
          loadInit();
          switchTab('triage');
        }))
        .withFailureHandler(_g.wrapFail(function(e){
          btn.disabled = false;
          btn.textContent = 'Save Return';
          showToast('Save error: ' + (e.message || e), 'error');
        }))
        .saveCustomerReturnMulti(data);
    }

    /* ── boot ── */
    window.addEventListener('load', function(){
      var startTab = 'triage';
      try {
        var raw = sessionStorage.getItem('pmFormIntent');
        if (raw) {
          var intent = JSON.parse(raw);
          if (intent && intent.form === 'CustomerReturn' && intent.mode === 'new') {
            startTab = 'new';
          }
          sessionStorage.removeItem('pmFormIntent');
        }
      } catch (e) {}
      switchTab(startTab);
      loadInit();
      // Records → CR with a specific docNo: scroll to the triage card on render.
      try {
        var auto = sessionStorage.getItem('pmAutoOpenDoc');
        if (auto) {
          sessionStorage.removeItem('pmAutoOpenDoc');
          setTimeout(function(){
            var card = document.querySelector('[data-cr-doc="' + auto + '"]');
            if (card) card.scrollIntoView({behavior:'smooth', block:'center'});
          }, 800);
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
