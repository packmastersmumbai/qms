    fg:           { label:'FG',           color:'#0d9488' },
    wip:          { label:'WIP',          color:'#7c3aed' },
    quarantine:   { label:'Quarantine',   color:'#d97706' },
    rework:       { label:'Rework',       color:'#ea580c' },
    unclassified: { label:'Unclassified', color:'#be123c' }
  };

  // ── State ──
  var activeTab    = 'rm';
  var stockViewCache = null;
  var loadState    = {};
  var cache        = { locations: null, stock: null, materials: null };
  var editingLocationId = null;
  var searchTimer  = null;
  var currentAction = null;

  // Active filter values
  var filters = { type:'rm', item:'', status:'', age:'', location:'' };

  // ── Helpers ──
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Age badge — 6-band monthly color scale ──
  function ageBand(n) {
    if (n === null || n === undefined || n === '' || isNaN(Number(n))) return null;
    n = Number(n);
    if (n <  15) return { bg:'#dcfce7', col:'#15803d', label: n + 'd' };
    if (n <  30) return { bg:'#fef9c3', col:'#a16207', label: n + 'd' };
    if (n <  45) return { bg:'#ffedd5', col:'#c2410c', label: n + 'd' };
    if (n <  60) return { bg:'#fee2e2', col:'#dc2626', label: n + 'd' };
    if (n <  90) return { bg:'#fecaca', col:'#b91c1c', label: n + 'd' };
    return           { bg:'#450a0a',  col:'#fca5a5', label: n + 'd' };
  }
  function ageBadge(d) {
    var b = ageBand(d);
    if (!b) return '';
    return '<span style="background:' + b.bg + ';color:' + b.col + ';font-size:10px;font-weight:700;padding:2px 7px;border-radius:9999px;display:inline-block;">' + b.label + '</span>';
  }
  function ageCategory(d) {
    var n = Number(d);
    if (isNaN(n) || d === null || d === undefined || d === '') return '';
    if (n <  15) return '<15d';
    if (n <  30) return '15-30d';
    if (n <  45) return '30-45d';
    if (n <  60) return '45-60d';
    if (n <  90) return '60-90d';
    return '90d+';
  }

  function iqcBadge(s) {
    var cfg = {
      'ACCEPTED':{ bg:'#dcfce7', c:'#16a34a' }, 'CLOSED':{ bg:'#dbeafe', c:'#1d4ed8' },
      'REJECTED':{ bg:'#fee2e2', c:'#dc2626' }, 'HOLD':{ bg:'#fff7ed', c:'#ea580c' },
      'PENDING': { bg:'#f1f5f9', c:'#64748b' }
    };
    var u = String(s || 'PENDING').toUpperCase();
    var c = cfg[u] || cfg['PENDING'];
    return '<span class="iqc-badge" style="background:' + c.bg + ';color:' + c.c + ';">' + esc(u) + '</span>';
  }

  // ── Merge all stock types into one flat array ──
  function allRows() {
    if (!stockViewCache) return [];
    var out = [];
    ['rm','pm','fg','wip','quarantine','rework','unclassified'].forEach(function(t) {
      (stockViewCache[t] || []).forEach(function(r) { out.push(Object.assign({}, r, { _type: t })); });
    });
    return out;
  }

  // ── Build flat row for table (normalise field names across types) ──
  function normalise(r) {
    var t = r._type;
    return {
      _type:    t,
      item:     r.materialDesc || r.materialCode || r.fgDesc || r.fgCode || '',
      code:     r.materialCode || r.fgCode || '',
      batch:    r.batchNo || r.jobId || r.reworkId || '',
      location: r.location || '—',
      date:     r.grnDate || r.oqcDate || r.date || r.since || '',
      status:   r.iqcStatus || r.status || '',
      qty:      r.qty != null ? r.qty : (r.fgQty != null ? r.fgQty : null),
      unit:     r.unit || r.fgUom || '',
      ageDays:  r.ageDays != null ? r.ageDays : null,
      extra:    t === 'rm'           ? esc(r.supplier)
              : t === 'pm'           ? esc(r.supplier)
              : t === 'fg'           ? esc(r.customer)
              : t === 'wip'          ? esc(r.ipqcId)
              : t === 'quarantine'   ? esc(r.sourceRef)
              : t === 'rework'       ? esc(r.source)
              // Unclassified exists to expose a bad/missing LOCATIONS Type, so the
              // most useful thing to surface is the unresolved type itself.
              : t === 'unclassified' ? esc(r.locType || '(blank)')
              : ''
    };
  }

  // ── Filter predicate ──
  function passes(n) {
    if (filters.type   && n._type !== filters.type) return false;
    if (filters.item   && n.code !== filters.item && n.item.toLowerCase().indexOf(filters.item.toLowerCase()) === -1) return false;
    if (filters.status && n.status.toUpperCase() !== filters.status) return false;
    if (filters.age    && ageCategory(n.ageDays) !== filters.age) return false;
    if (filters.location && n.location !== filters.location) return false;
    return true;
  }
  function passesSearch(n, q) {
    if (!q) return true;
    return [n.item, n.code, n.batch, n.location, n.extra, n.date, n.status].some(function(v) {
      return String(v || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  // ── Dropdown filter bar ──
  function buildDropdowns() {
    var bar = document.getElementById('dropdownFilters');
    if (!bar) return;
    var tab = activeTab;
    var isStock = !!TYPE_META[tab];
    if (!isStock) { bar.innerHTML = ''; updateSummary([]); return; }

    var rows = allRows().map(normalise);

    // unique item codes for current type
    var itemMap = {}; // code → label
    rows.filter(function(r){ return r._type === tab; }).forEach(function(r) {
      if (r.code) itemMap[r.code] = r.item || r.code;
    });
    var itemEntries = Object.keys(itemMap).sort().map(function(c) { return { val: c, label: itemMap[c] }; });

    // unique statuses for current type
    var statusSet = {};
    rows.filter(function(r){ return r._type === tab; }).forEach(function(r) {
      if (r.status) statusSet[r.status.toUpperCase()] = 1;
    });
    var statusVals = Object.keys(statusSet).sort();

    // unique locations for current type
    var locSet = {};
    rows.filter(function(r){ return r._type === tab; }).forEach(function(r) {
      if (r.location && r.location !== '—') locSet[r.location] = 1;
    });
    var locVals = Object.keys(locSet).sort();

    var AGE_OPTS = ['<15d','15-30d','30-45d','45-60d','60-90d','90d+'];

    function sel(id, placeholder, opts, currentVal) {
      var isActive = currentVal ? ' active-filter' : '';
      var html = '<select id="' + id + '" class="f-select' + isActive + '">';
      html += '<option value="">' + placeholder + '</option>';
      opts.forEach(function(o) {
        var v = o.val !== undefined ? o.val : o;
        var l = o.label !== undefined ? o.label : o;
        html += '<option value="' + esc(v) + '"' + (currentVal === v ? ' selected' : '') + '>' + esc(l) + '</option>';
      });
      html += '</select>';
      return html;
    }

    var html = '';
    if (itemEntries.length) html += sel('fItem', 'All items', itemEntries, filters.item);
    if (statusVals.length)  html += sel('fStatus', 'Any status', statusVals, filters.status);
    html += sel('fAge', 'Any age', AGE_OPTS, filters.age);
    if (locVals.length)     html += sel('fLoc', 'All locations', locVals, filters.location);

    bar.innerHTML = html;

    var fItem   = document.getElementById('fItem');
    var fStatus = document.getElementById('fStatus');
    var fAge    = document.getElementById('fAge');
    var fLoc    = document.getElementById('fLoc');
    if (fItem)   fItem.addEventListener('change',   function(){ filters.item     = this.value; applyFilters(); });
    if (fStatus) fStatus.addEventListener('change', function(){ filters.status   = this.value; applyFilters(); });
    if (fAge)    fAge.addEventListener('change',    function(){ filters.age      = this.value; applyFilters(); });
    if (fLoc)    fLoc.addEventListener('change',    function(){ filters.location = this.value; applyFilters(); });
  }

  function applyFilters() {
    buildDropdowns();
    var q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    renderStockTable(q);
  }

  // ── Summary bar ──
  function updateSummary(groups, flatRows) {
    var bar = document.getElementById('summaryBar');
    if (!bar) return;
    if (!groups || !groups.length) { bar.innerHTML = ''; return; }
    var totalMats  = allRows().filter(function(r){ return r._type === filters.type; });
    var totalGroups = groupByMaterial(totalMats.map(normalise)).length;
    var qtySum = 0, hasQty = false, unit = '';
    flatRows.forEach(function(r) {
      if (r.qty != null && !isNaN(Number(r.qty))) { qtySum += Number(r.qty); hasQty = true; unit = r.unit || unit; }
    });
    var html = '<span class="summary-pill"><strong>' + groups.length + '</strong>&nbsp;of ' + totalGroups + ' items · ' + flatRows.length + ' lots</span>';
    if (hasQty) html += '<span class="summary-pill">Total: <strong>' + qtySum.toLocaleString() + '</strong>&nbsp;' + esc(unit) + '</span>';
    bar.innerHTML = html;
  }

  // ── Level 1: group batch-rows by material code → summary row ──
  function groupByMaterial(rows) {
    var order = [], map = {};
    rows.forEach(function(r) {
      var key = r.code || r.item;
      if (!map[key]) {
        map[key] = { code: r.code, item: r.item, unit: r.unit, _type: r._type, batches: [], totalQty: 0, worstAge: null };
        order.push(key);
      }
      var g = map[key];
      g.batches.push(r);
      if (r.qty != null && !isNaN(Number(r.qty))) g.totalQty += Number(r.qty);
      // track worst (oldest) age for the summary badge
      if (r.ageDays != null && !isNaN(Number(r.ageDays))) {
        if (g.worstAge === null || Number(r.ageDays) > g.worstAge) g.worstAge = Number(r.ageDays);
      }
    });
    // sort batches within each group oldest-first
    order.forEach(function(key) {
      map[key].batches.sort(function(a, b) {
        return (b.ageDays != null ? Number(b.ageDays) : 0) - (a.ageDays != null ? Number(a.ageDays) : 0);
      });
    });
    return order.map(function(k) { return map[k]; });
  }

  // ── Render stock table — Level 1 summary rows ──
  var expandedGroups = {};   // key → true/false

  function renderStockTable(q) {
    var wrap  = document.getElementById('stockWrap');
    var thead = document.getElementById('stockThead');
    var tbody = document.getElementById('stockTbody');
    if (!wrap || !thead || !tbody) return;

    var t = filters.type || 'rm';
    var flatRows = allRows().map(normalise).filter(passes).filter(function(r){ return passesSearch(r, q); });

    // summary uses unique materials
    var groups = groupByMaterial(flatRows);
    updateSummary(groups, flatRows);

    if (!groups.length) {
      wrap.style.display = 'none';
      document.getElementById('stockSkelWrap').innerHTML =
        '<div class="wh-empty">' + (q || hasActiveFilter() ? 'No results. <a onclick="clearAll()">Clear filters</a>' : 'Nothing in ' + t.toUpperCase() + '.') + '</div>';
      return;
    }

    document.getElementById('stockSkelWrap').innerHTML = '';
    wrap.style.display = '';

    var typeColor = (TYPE_META[t] || {}).color || '#1e3a5f';

    // Header — Level 1 columns
    thead.innerHTML = '<tr>' +
      '<th style="width:28px;"></th>' +
      '<th>Item</th><th>Code</th>' +
      '<th style="text-align:right;">Batches</th>' +
      '<th style="text-align:right;">Total Qty</th>' +
      '<th>Worst Age</th>' +
    '</tr>';

    window._whGroups = groups;

    tbody.innerHTML = groups.map(function(g, gi) {
      var isOpen = !!expandedGroups[g.code];
      var summaryRow = '<tr class="grp-summary stripe-' + t + '" data-gi="' + gi + '" onclick="toggleGroup(this)">' +
        '<td style="padding-left:10px;width:28px;"><span class="chevron' + (isOpen ? ' open' : '') + '">›</span></td>' +
        '<td class="wrap" style="font-weight:600;">' + esc(g.item) + '</td>' +
        '<td style="font-size:11px;color:#64748b;">' + esc(g.code) + '</td>' +
        '<td style="text-align:right;font-size:12px;color:#94a3b8;">' + g.batches.length + '</td>' +
        '<td style="text-align:right;font-weight:700;font-size:14px;color:' + typeColor + ';">' + g.totalQty.toLocaleString() + ' <span style="font-size:10px;font-weight:400;color:#94a3b8;">' + esc(g.unit) + '</span></td>' +
        '<td>' + (g.worstAge !== null ? ageBadge(g.worstAge) : '') + '</td>' +
      '</tr>';

      var batchRows = '';
      if (isOpen) {
        batchRows = g.batches.map(function(r, bi) {
          var statusHtml = '';
          if (t === 'rm' || t === 'pm' || t === 'fg') statusHtml = iqcBadge(r.status);
          else if (r.status) statusHtml = '<span style="background:#f1f5f9;color:#475569;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;">' + esc(r.status) + '</span>';

          return '<tr class="batch-row" data-gi="' + gi + '" data-bi="' + bi + '" onclick="toggleLedger(this)">' +
            '<td style="border-left:3px solid ' + typeColor + ';background:#fafafa;"></td>' +
            '<td style="background:#fafafa;padding-left:20px;font-size:12px;" colspan="1">' +
              '<span style="font-weight:600;color:#1e3a5f;">' + esc(r.batch || '—') + '</span>' +
              '<span style="margin-left:8px;font-size:11px;color:#64748b;">' + esc(r.location) + '</span>' +
            '</td>' +
            '<td style="background:#fafafa;font-size:11px;color:#64748b;">' + esc(r.date) + '</td>' +
            '<td style="background:#fafafa;text-align:right;">' + statusHtml + '</td>' +
            '<td style="background:#fafafa;text-align:right;font-weight:700;font-size:13px;color:' + typeColor + ';">' + (r.qty != null ? r.qty : '—') + ' <span style="font-size:10px;font-weight:400;color:#94a3b8;">' + esc(r.unit) + '</span></td>' +
            '<td style="background:#fafafa;">' + ageBadge(r.ageDays) + '</td>' +
          '</tr>';
        }).join('');
      }

      return summaryRow + batchRows;
    }).join('');
  }

  window.toggleGroup = function(tr) {
    var gi = parseInt(tr.getAttribute('data-gi'), 10);
    var g  = (window._whGroups || [])[gi];
    if (!g) return;
    var key = g.code;
    expandedGroups[key] = !expandedGroups[key];
    collapseActiveLedger();
    var q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    renderStockTable(q);
    // scroll the expanded row into view
    requestAnimationFrame(function() {
      var rows = document.querySelectorAll('.grp-summary[data-gi="' + gi + '"]');
      if (rows[0]) rows[0].scrollIntoView({ block:'nearest', behavior:'smooth' });
    });
  };

  function td(v, wrap) {
    return '<td' + (wrap ? ' class="wrap"' : '') + '>' + esc(v) + '</td>';
  }

  // ── Ledger Drawer (Level 3 — batch tap) ──
  var MVT_COLOR = {
    'GRN_RECEIPT':'#16a34a','CUSTOMER_RETURN_IN':'#16a34a',
    'OQC_RELEASE':'#0ea5e9','DISPATCH':'#dc2626','GATEPASS':'#dc2626',
    'LOCATION_TRANSFER':'#0ea5e9','SCRAP':'#dc2626','SAMPLE':'#d97706',
    'ISSUE_TO_PRODUCTION':'#7c3aed'
  };

  var _activeLedgerRow = null; // tracks the currently open batch <tr>

  function buildLedgerTable(mvts, typeColor, unit) {
    if (!mvts || !mvts.length) {
      return '<div style="padding:12px 0;text-align:center;color:#94a3b8;font-size:12px;">No transactions recorded for this batch.</div>';
    }
    var running = 0;
    var entries = mvts.map(function(m) {
      var isIn = Number(m.qtyIn) > 0;
      running += (isIn ? Number(m.qtyIn) : -Number(m.qtyOut));
      return { m: m, running: running };
    });
    return '<table class="ledger-table">' +
        '<thead><tr>' +
          '<th>Type</th>' +
          '<th>Ref / Location</th>' +
          '<th style="text-align:right;">Qty</th>' +
          '<th style="text-align:right;">Balance</th>' +
          '<th style="text-align:right;">Date</th>' +
        '</tr></thead>' +
        '<tbody>' +
        entries.map(function(entry) {
          var m    = entry.m;
          var col  = MVT_COLOR[m.txnType] || '#64748b';
          var isIn = Number(m.qtyIn) > 0;
          var delta = isIn ? ('+' + m.qtyIn) : ('−' + m.qtyOut);
          var ref  = [m.locationId, m.refDocNo, m.operator].filter(Boolean).join(' · ');
          return '<tr>' +
            '<td><span class="lt-dot" style="background:' + col + ';"></span>' +
              '<span class="lt-type" style="color:' + col + ';">' + esc((m.txnType||'').replace(/_/g,' ')) + '</span></td>' +
            '<td><span class="lt-ref">' + esc(ref) + '</span></td>' +
            '<td style="text-align:right;"><span class="lt-delta" style="color:' + col + ';">' + delta + '</span></td>' +
            '<td style="text-align:right;"><span class="lt-bal">' + entry.running + '</span></td>' +
            '<td style="text-align:right;"><span class="lt-ts">' + esc(m.timestamp||'') + '</span></td>' +
          '</tr>';
        }).join('') +
        '</tbody></table>' +
      '<div style="margin-top:8px;padding:6px 10px;background:#f0fdf4;border-radius:6px;display:flex;justify-content:space-between;align-items:center;">' +
        '<span style="font-size:10px;font-weight:700;color:#15803d;text-transform:uppercase;letter-spacing:.4px;">Closing Stock</span>' +
        '<span style="font-size:14px;font-weight:700;color:' + typeColor + ';">' + running + ' ' + esc(unit) + '</span>' +
      '</div>';
  }

  function collapseActiveLedger() {
    if (!_activeLedgerRow) return;
    _activeLedgerRow.classList.remove('ledger-open');
    var next = _activeLedgerRow.nextSibling;
    if (next && next.classList && next.classList.contains('ledger-expand-row')) next.remove();
    _activeLedgerRow = null;
  }

  window.toggleLedger = function(tr) {
    var gi  = parseInt(tr.getAttribute('data-gi'), 10);
    var bi  = parseInt(tr.getAttribute('data-bi'), 10);

    // Collapse if tapping the already-open row
    if (_activeLedgerRow === tr) { collapseActiveLedger(); return; }

    // Collapse any previously open ledger
    collapseActiveLedger();

    var g   = (window._whGroups || [])[gi];
    if (!g) return;
    var row = g.batches[bi];
    if (!row) return;

    var typeColor = (TYPE_META[row._type] || {}).color || '#1e3a5f';
    var colCount  = tr.cells.length;

    // Insert expand row immediately after the batch row
    var expandTr = document.createElement('tr');
    expandTr.className = 'ledger-expand-row';
    expandTr.innerHTML = '<td colspan="' + colCount + '">' +
      '<div class="ledger-expand-inner">' +
        '<div class="ledger-section">All Transactions · ' + esc(row.batch || row.code) + '</div>' +
        '<div id="ledgerMoves" style="margin-top:4px;"><div style="padding:10px 0;text-align:center;color:#94a3b8;font-size:12px;">Loading…</div></div>' +
      '</div>' +
    '</td>';

    tr.classList.add('ledger-open');
    tr.parentNode.insertBefore(expandTr, tr.nextSibling);
    _activeLedgerRow = tr;

    google.script.run
      .withSuccessHandler(function(mvts) {
        var el = document.getElementById('ledgerMoves');
        if (!el) return;
        el.innerHTML = buildLedgerTable(mvts, typeColor, row.unit || '');
      })
      .withFailureHandler(function() {
        var el = document.getElementById('ledgerMoves');
        if (el) el.innerHTML = '<div style="padding:10px 0;text-align:center;color:#dc2626;font-size:12px;">Could not load transactions.</div>';
      })
      .getStockLedgerForBatch(row.code, row.batch);
  };

  function hasActiveFilter() {
    return filters.item || filters.status || filters.age || filters.location;
  }

  window.clearAll = function() {
    filters.item = ''; filters.status = ''; filters.age = ''; filters.location = '';
    document.getElementById('searchInput').value = '';
    buildDropdowns();
    renderStockTable('');
  };

  // ── Skeleton ──
  function showSkeleton() {
    document.getElementById('stockSkelWrap').innerHTML =
      [0,1,2,3,4].map(function(){ return '<div style="height:36px;background:#e2e8f0;border-radius:6px;margin-bottom:4px;animation:skel-pulse .8s ease-in-out infinite;"></div>'; }).join('');
    var wrap = document.getElementById('stockWrap');
    if (wrap) wrap.style.display = 'none';
  }

  // ── Movements ──
  function loadMovements() {
    var list = document.getElementById('movementsList');
    list.innerHTML = '<div class="wh-empty"><span class="material-symbols-outlined text-[36px] block mb-2 opacity-30">hourglass_top</span>Loading…</div>';
    google.script.run
      .withSuccessHandler(function(rows) {
        loadState.movements = 'loaded';
        renderMovements(rows || []);
      })
      .withFailureHandler(function(e) {
        loadState.movements = 'error';
        list.innerHTML = '<div class="wh-empty" style="color:#dc2626;">Failed. <a onclick="retryTab(\'movements\')">Retry</a></div>';
      })
      .getStockMovements(100);
  }

  function renderMovements(rows) {
    var list = document.getElementById('movementsList');
    if (!rows.length) {
      list.innerHTML = '<div class="wh-empty"><span class="material-symbols-outlined text-[36px] block mb-2 opacity-30">swap_horiz</span>No movements yet.</div>';
      return;
    }
    var typeColor = {
      'GRN_RECEIPT':'#16a34a','CUSTOMER_RETURN_IN':'#16a34a',
      'OQC_RELEASE':'#0ea5e9','DISPATCH':'#dc2626','GATEPASS':'#dc2626',
      'LOCATION_TRANSFER':'#0ea5e9','SCRAP':'#dc2626','SAMPLE':'#d97706',
      'ISSUE_TO_PRODUCTION':'#7c3aed'
    };
    list.innerHTML = rows.map(function(r) {
      var col = typeColor[r.txnType] || '#64748b';
      var qty = r.qtyIn > 0 ? ('+' + r.qtyIn) : ('−' + r.qtyOut);
      return '<div class="mv-card" style="border-left:4px solid ' + col + ';">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">' +
          '<span style="font-size:12px;font-weight:700;color:#1e3a5f;">' + esc(r.materialCode) + (r.batchOrLotNo ? ' · ' + esc(r.batchOrLotNo) : '') + '</span>' +
          '<span style="font-size:11px;color:#94a3b8;">' + esc(r.timestamp) + '</span>' +
        '</div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;">' +
          '<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:' + col + ';">' + esc((r.txnType||'').replace(/_/g,' ')) + '</span>' +
          '<span style="font-size:14px;font-weight:700;color:' + col + ';">' + qty + '</span>' +
        '</div>' +
        '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">' + esc(r.locationId || '—') + (r.refDocNo ? ' · ' + esc(r.refDocNo) : '') + (r.operator ? ' · ' + esc(r.operator) : '') + '</div>' +
      '</div>';
    }).join('');
  }

  // ── Locations ──
  function locTypeChipClass(t) {
    var u = String(t||'').toUpperCase();
    if (u === 'QUARANTINE') return 'q';
    if (u === 'SCRAP') return 's';
    if (u === 'SAMPLE') return 'sm';
    return '';
  }

  function renderLocations(rows, q) {
    var tbody = document.getElementById('tbody-locations');
    var filtered = q ? rows.filter(function(r){
      return Object.keys(r).some(function(k){ return String(r[k]||'').toLowerCase().indexOf(q) !== -1; });
    }) : rows;
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="wh-empty">' + (q ? 'No results.' : 'No locations. Tap + to add.') + '</div></td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(function(r) {
      var cap = r.capacityQty ? (esc(r.capacityQty) + ' ' + esc(r.capacityUnit||'')) : '';
      return '<tr class="loc-row" data-loc-id="' + esc(r.id) + '">' +
        '<td>' + esc(r.id) + '</td><td>' + esc(r.label||r.id) + '</td>' +
        '<td><span class="loc-chip ' + locTypeChipClass(r.type) + '">' + esc(r.type||'') + '</span></td>' +
        '<td>' + esc(r.section) + '</td><td>' + esc(r.aisle) + '</td><td>' + esc(r.rack) + '</td><td>' + cap + '</td>' +
      '</tr>';
    }).join('');
  }

  // ── Tab switching ──
  var STOCK_TABS = { rm:1, fg:1, wip:1, quarantine:1, rework:1 };

  function switchTab(tab) {
    if (tab === activeTab) return;
    activeTab = tab;
    var isStock = !!STOCK_TABS[tab];

    // reset item/status/location filters on tab change; keep age
    filters.type = tab;
    filters.item = ''; filters.status = ''; filters.location = '';

    // tab buttons
    document.querySelectorAll('[data-tab]').forEach(function(el) {
      var a = el.getAttribute('data-tab') === tab;
      el.className = el.className.replace(/tab-btn-(active|inactive)/g, '');
      el.classList.add(a ? 'tab-btn-active' : 'tab-btn-inactive');
    });

    // panels: stock tabs all share #panel-stock
    document.querySelectorAll('.tab-panel').forEach(function(p) {
      var show = isStock ? p.id === 'panel-stock' : p.id === 'panel-' + tab;
      p.classList.toggle('active', show);
    });

    document.getElementById('searchInput').value = '';
    var fz = document.getElementById('filterZone');
    fz.style.display = isStock ? '' : 'none';

    if (isStock) {
      buildDropdowns();
      if (stockViewCache) {
        renderStockTable('');
      } else if (!loadState.stock) {
        loadStock();
      }
    } else if (tab === 'movements') {
      if (!loadState.movements) loadMovements();
    } else if (tab === 'lowstock') {
      if (!loadState.lowstock) loadLowStock();
    } else if (tab === 'locations') {
      if (!loadState.locations) loadLocationsData();
    }
  }

  function loadLowStock() {
    loadState.lowstock = 'loading';
    var list = document.getElementById('lowstockList');
    list.innerHTML = '<div class="wh-empty">Loading…</div>';
    google.script.run
      .withSuccessHandler(function(rows) {
        cache.lowstock = rows || [];
        loadState.lowstock = 'loaded';
        renderLowStock(cache.lowstock);
      })
      .withFailureHandler(function(e) {
        loadState.lowstock = 'error';
        list.innerHTML = '<div class="wh-empty" style="color:#dc2626;">Load failed. <a onclick="retryTab(\'lowstock\')">Retry</a></div>';
      })
      .getLowStockItems();
  }

  function renderLowStock(rows) {
    var list = document.getElementById('lowstockList');
    if (!rows.length) {
      list.innerHTML = '<div class="wh-empty">No materials at or below their re-order level. ✓</div>';
      return;
    }
    list.innerHTML = rows.map(function(r) {
      var u = r.unit ? ' ' + r.unit : '';
      return '<div class="ls-card">'
        +   '<div><div class="ls-name">' + esc(r.desc) + '</div>'
        +     '<div class="ls-code">' + esc(r.code) + '</div></div>'
        +   '<div class="ls-qty"><div><span class="ls-have">' + r.onHand + u + '</span>'
        +     ' <span class="ls-rol">/ ' + r.reorderLevel + u + '</span></div>'
        +     '<span class="ls-short">short ' + r.shortBy + u + '</span></div>'
        + '</div>';
    }).join('');
  }

  function loadStock() {
    loadState.stock = 'loading';
    showSkeleton();
    google.script.run
      .withSuccessHandler(function(data) {
        stockViewCache = data || { rm:[], fg:[], wip:[], quarantine:[], rework:[] };
        loadState.stock = 'loaded';
        filters.type = activeTab;
        buildDropdowns();
        renderStockTable('');
      })
      .withFailureHandler(function(e) {
        loadState.stock = 'error';
        document.getElementById('stockSkelWrap').innerHTML =
          '<div class="wh-empty" style="color:#dc2626;">Load failed. <a onclick="retryTab(\'stock\')">Retry</a></div>';
        showToast('Could not load stock.', 'error');
      })
      .getStockView();
  }

  function loadLocationsData() {
    loadState.locations = 'loading';
    google.script.run
      .withSuccessHandler(function(rows) {
        cache.locations = rows || [];
        loadState.locations = 'loaded';
        renderLocations(cache.locations, '');
      })
      .withFailureHandler(function(e) {
        loadState.locations = 'error';
        document.getElementById('tbody-locations').innerHTML =
          '<tr><td colspan="7"><div class="wh-empty" style="color:#dc2626;">Load failed. <a onclick="retryTab(\'locations\')">Retry</a></div></td></tr>';
      })
      .getLocations();
  }

  window.retryTab = function(tab) {
    if (tab === 'stock') { stockViewCache = null; loadState.stock = null; loadStock(); return; }
    loadState[tab] = null;
    if (tab === 'movements') loadMovements();
    if (tab === 'lowstock') loadLowStock();
    if (tab === 'locations') loadLocationsData();
  };

  // ── Search ──
  pmReady(function() {
    if (!checkRole()) return;

    document.getElementById('backBtn').addEventListener('click', function() {
      google.script.run
        .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
        .withFailureHandler(function(){}).getFormHtml('Landing');
    });

    document.getElementById('whTabBar').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-tab]');
      if (btn) switchTab(btn.getAttribute('data-tab'));
    });

    document.getElementById('searchInput').addEventListener('input', function() {
      var val = this.value;
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function() {
        var q = val.toLowerCase().trim();
        if (STOCK_TABS[activeTab] && loadState.stock === 'loaded') {
          renderStockTable(q);
        } else if (activeTab === 'locations' && cache.locations) {
          renderLocations(cache.locations, q);
        }
      }, 220);
    });

    // FAB
    document.getElementById('fabAction').addEventListener('click', function() { toggleActionMenu(); });
    document.getElementById('actionMenu').addEventListener('click', function(e) {
      var b = e.target.closest('[data-action]');
      if (!b) return;
      toggleActionMenu(false);
      var promises = [];
      if (!cache.stock) promises.push(new Promise(function(res){
        google.script.run.withSuccessHandler(function(r){
          cache.stock = r || [];
          google.script.run.withSuccessHandler(function(m){
            cache.materials = m || [];
            var mm = {}; cache.materials.forEach(function(x){ mm[String(x.code).trim()] = x; });
            cache.stock.forEach(function(s){ var x = mm[String(s.materialCode).trim()]||{}; s.desc = x.desc||''; s.unit = x.unit||''; });
            res();
          }).withFailureHandler(function(){ res(); }).getMaterials();
        }).withFailureHandler(function(){ res(); }).getStockSummary();
      }));
      if (!cache.locations) promises.push(new Promise(function(res){
        google.script.run.withSuccessHandler(function(r){ cache.locations = r||[]; res(); })
          .withFailureHandler(function(){ res(); }).getLocations();
      }));
      Promise.all(promises).then(function(){ openAction(b.getAttribute('data-action')); });
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('btnCancel').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
    document.getElementById('btnSubmit').addEventListener('click', submitAction);
    document.getElementById('btnDelete').addEventListener('click', deleteCurrentLocation);
    document.getElementById('tbody-locations').addEventListener('click', function(e){
      var tr = e.target.closest('tr.loc-row');
      if (tr) openEditLocation(tr.getAttribute('data-loc-id'));
    });
    document.getElementById('pmToast').addEventListener('click', function(){ this.className = 'pm-toast'; });


    // initial load
    filters.type = 'rm';
    buildDropdowns();
    loadStock();
  });

  // ── Role gate ──
  function checkRole() {
    var role = sessionStorage.getItem('userRole') || '';
    var chip = document.getElementById('roleChip');
    if (chip && role) { chip.textContent = role.charAt(0).toUpperCase() + role.slice(1); chip.classList.remove('hidden'); }
    if (role === 'user') {
      google.script.run
        .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
        .withFailureHandler(function(){}).getFormHtml('Landing');
      return false;
    }
    return true;
  }

  // ── Action menu / modal ──
  function toggleActionMenu(force) {
    var menu = document.getElementById('actionMenu');
    var fab  = document.getElementById('fabAction');
    var open = (force === undefined) ? !menu.classList.contains('open') : force;
    menu.classList.toggle('open', open);
    fab.classList.toggle('open', open);
  }

  function openAction(action) {
    currentAction = action;
    var titles = { transfer:'Transfer Stock', issue:'Issue RM to Production', scrap:'Record Scrap', sample:'Take Sample', newLocation:'Add Location' };
    document.getElementById('modalTitle').textContent = titles[action] || action;
    document.getElementById('modalBody').innerHTML = fieldsFor(action);
    document.getElementById('btnSubmit').disabled = false;
    document.getElementById('btnSubmit').textContent = 'Submit';
    document.getElementById('btnDelete').style.display = 'none';
    editingLocationId = null;
    document.getElementById('modalOverlay').classList.add('show');
    if (['transfer','issue','scrap','sample'].indexOf(action) !== -1) bindBalanceHint();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    currentAction = null; editingLocationId = null;
    document.getElementById('btnDelete').style.display = 'none';
  }

  function openEditLocation(locId) {
    var row = (cache.locations||[]).find(function(l){ return String(l.id)===String(locId); });
    if (!row) { showToast('Location not found.','error'); return; }
    currentAction = 'newLocation'; editingLocationId = row.id;
    document.getElementById('modalTitle').textContent = 'Edit Location';
    document.getElementById('modalBody').innerHTML = fieldsFor('newLocation');
    document.getElementById('btnSubmit').disabled = false;
    document.getElementById('btnSubmit').textContent = 'Save';
    document.getElementById('btnDelete').style.display = '';
    document.getElementById('modalOverlay').classList.add('show');
    ['id','type','label','floor','section','aisle','rack','shelf','bin','capacityQty','capacityUnit'].forEach(function(k){
      var el = document.querySelector('#modalBody [data-key="'+k+'"]');
      if (el && row[k]!=null) el.value = row[k];
    });
    var idEl = document.querySelector('#modalBody [data-key="id"]');
    if (idEl) idEl.readOnly = true;
  }

  function deleteCurrentLocation() {
    if (!editingLocationId) return;
    if (!confirm('Delete location "'+editingLocationId+'"?\n\nIf it has stock history it will be marked inactive instead.')) return;
    var btn = document.getElementById('btnDelete');
    btn.disabled = true; btn.textContent = 'Deleting...';
    google.script.run
      .withSuccessHandler(function(res){
        btn.disabled = false; btn.textContent = 'Delete';
        if (res && res.success === false) { showToast(res.error||'Delete failed.','error'); return; }
        showToast((res&&res.message)||(res&&res.soft?'Marked inactive.':'Deleted.'),'success');
        closeModal(); loadState.locations = null; loadLocationsData();
      })
      .withFailureHandler(function(e){ btn.disabled=false; btn.textContent='Delete'; showToast((e&&e.message)?e.message:'Delete failed.','error'); })
      .deleteLocation(editingLocationId);
  }

  function stockOpts() {
    var s = cache.stock||[];
    if (!s.length) return '<option value="">(no stock on hand)</option>';
    return '<option value="">— Choose lot —</option>' + s.map(function(x){
      var v = [x.materialCode,x.batchOrLotNo,x.locationId].join('|');
      return '<option value="'+esc(v)+'">'+esc(x.materialCode+' / '+x.batchOrLotNo+' @ '+x.locationId+' ('+x.balance+' '+(x.unit||''))+')</option>';
    }).join('');
  }

  function locOpts(excl) {
    return '<option value="">— Choose location —</option>' + (cache.locations||[]).filter(function(l){ return l.id!==excl; }).map(function(l){
      return '<option value="'+esc(l.id)+'">'+esc(l.id+' — '+(l.label||l.type))+'</option>';
    }).join('');
  }

  function fieldsFor(action) {
    if (action==='transfer') return ''+
      '<div class="field-row"><label>Source Lot<span class="req">*</span></label><select data-key="lot">'+stockOpts()+'</select></div>'+
      '<div class="balance-hint" id="balHint" style="display:none;"><span class="material-symbols-outlined text-[16px]">info</span><span></span></div>'+
      '<div class="field-row"><label>Destination<span class="req">*</span></label><select data-key="toLocationId">'+locOpts()+'</select></div>'+
      '<div class="field-row-2col"><div class="field-row"><label>Qty<span class="req">*</span></label><input type="number" data-key="qty" step="any" min="0"></div>'+
      '<div class="field-row"><label>Transferred By</label><input type="text" data-key="transferredBy"></div></div>'+
      '<div class="field-row"><label>Reason</label><input type="text" data-key="reason"></div>';
    if (action==='issue') return ''+
      '<div class="field-row"><label>Source Lot<span class="req">*</span></label><select data-key="lot">'+stockOpts()+'</select></div>'+
      '<div class="balance-hint" id="balHint" style="display:none;"><span class="material-symbols-outlined text-[16px]">info</span><span></span></div>'+
      '<div class="field-row-2col"><div class="field-row"><label>Qty<span class="req">*</span></label><input type="number" data-key="qtyToIssue" step="any" min="0"></div>'+
      '<div class="field-row"><label>Production Order</label><input type="text" data-key="productionOrderNo" placeholder="auto if blank"></div></div>'+
      '<div class="field-row"><label>Issued By</label><input type="text" data-key="issuedBy"></div>';
    if (action==='scrap') return ''+
      '<div class="field-row"><label>Source Lot<span class="req">*</span></label><select data-key="lot">'+stockOpts()+'</select></div>'+
      '<div class="balance-hint" id="balHint" style="display:none;"><span class="material-symbols-outlined text-[16px]">info</span><span></span></div>'+
      '<div class="field-row-2col"><div class="field-row"><label>Qty Scrap<span class="req">*</span></label><input type="number" data-key="qtyScrap" step="any" min="0"></div>'+
      '<div class="field-row"><label>Destination</label><input type="text" data-key="scrapDestination" placeholder="e.g. RBP Vendor"></div></div>'+
      '<div class="field-row"><label>Reason<span class="req">*</span></label><input type="text" data-key="scrapReason"></div>'+
      '<div class="field-row"><label>Recorded By</label><input type="text" data-key="recordedBy"></div>';
    if (action==='sample') return ''+
      '<div class="field-row"><label>Source Lot<span class="req">*</span></label><select data-key="lot">'+stockOpts()+'</select></div>'+
      '<div class="balance-hint" id="balHint" style="display:none;"><span class="material-symbols-outlined text-[16px]">info</span><span></span></div>'+
      '<div class="field-row-2col"><div class="field-row"><label>Qty<span class="req">*</span></label><input type="number" data-key="qtySample" step="any" min="0"></div>'+
      '<div class="field-row"><label>Stored At</label><input type="text" data-key="locationStored" value="SAMPLE-CABINET"></div></div>'+
      '<div class="field-row"><label>Purpose<span class="req">*</span></label><input type="text" data-key="samplePurpose"></div>'+
      '<div class="field-row"><label>Taken By</label><input type="text" data-key="takenBy"></div>';
    if (action==='newLocation') return ''+
      '<div class="field-row-2col"><div class="field-row"><label>ID<span class="req">*</span></label><input type="text" data-key="id" placeholder="LOC-RM-01"></div>'+
      '<div class="field-row"><label>Type<span class="req">*</span></label><select data-key="type">'+
        ['RM','FG','QUARANTINE','SCRAP','SAMPLE','FG_HOLD'].map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join('')+
      '</select></div></div>'+
      '<div class="field-row"><label>Label</label><input type="text" data-key="label"></div>'+
      '<div class="field-row-2col"><div class="field-row"><label>Floor</label><input type="text" data-key="floor"></div><div class="field-row"><label>Section</label><input type="text" data-key="section"></div></div>'+
      '<div class="field-row-2col"><div class="field-row"><label>Aisle</label><input type="text" data-key="aisle"></div><div class="field-row"><label>Rack</label><input type="text" data-key="rack"></div></div>'+
      '<div class="field-row-2col"><div class="field-row"><label>Shelf</label><input type="text" data-key="shelf"></div><div class="field-row"><label>Bin</label><input type="text" data-key="bin"></div></div>'+
      '<div class="field-row-2col"><div class="field-row"><label>Capacity Qty</label><input type="number" data-key="capacityQty" step="any" min="0"></div><div class="field-row"><label>Capacity Unit</label><input type="text" data-key="capacityUnit" placeholder="kg / pcs"></div></div>';
    return '';
  }

  function bindBalanceHint() {
    var sel  = document.querySelector('#modalBody select[data-key="lot"]');
    var hint = document.getElementById('balHint');
    if (!sel||!hint) return;
    sel.addEventListener('change', function(){
      var parts = (sel.value||'').split('|');
      if (parts.length!==3||!parts[0]) { hint.style.display='none'; return; }
      var lot = (cache.stock||[]).find(function(s){ return s.materialCode===parts[0]&&s.batchOrLotNo===parts[1]&&s.locationId===parts[2]; });
      if (!lot) { hint.style.display='none'; return; }
      hint.querySelector('span:last-child').textContent = 'Available: '+lot.balance+' '+(lot.unit||'')+' @ '+lot.locationId;
      hint.className = 'balance-hint'+(lot.balance>0?'':' warn');
      hint.style.display='flex';
    });
  }

  function collectFormData() {
    var data = {};
    document.querySelectorAll('#modalBody [data-key]').forEach(function(el){
      var k = el.getAttribute('data-key'), v = el.value;
      data[k] = el.type==='number' ? (v===''?'':Number(v)) : (typeof v==='string'?v.trim():v);
    });
    if (data.lot) {
      var p = data.lot.split('|');
      data.materialCode = p[0]; data.batchOrLotNo = p[1]; data.fromLocationId = p[2]; data.locationId = p[2];
      delete data.lot;
    }
    return data;
  }

  function validate(action, data) {
    function req(k,l){ var v=data[k]; return (!v&&v!==0)?l+' is required.':null; }
    if (action==='transfer')    return req('materialCode','Source lot')||req('toLocationId','Destination')||req('qty','Qty')||(data.fromLocationId===data.toLocationId?'Source and destination must differ.':null);
    if (action==='issue')       return req('materialCode','Source lot')||req('qtyToIssue','Qty');
    if (action==='scrap')       return req('materialCode','Source lot')||req('qtyScrap','Qty')||req('scrapReason','Reason');
    if (action==='sample')      return req('materialCode','Source lot')||req('qtySample','Qty')||req('samplePurpose','Purpose');
    if (action==='newLocation') return req('id','ID')||req('type','Type');
    return null;
  }

  function submitAction() {
    var data = collectFormData();
    var err  = validate(currentAction, data);
    if (err) { showToast(err,'error'); return; }
    var btn = document.getElementById('btnSubmit');
    btn.disabled=true; btn.textContent='Submitting...';
    var fnMap = { transfer:'recordLocationTransfer', issue:'issueRMForProduction', scrap:'recordScrap', sample:'recordSample', newLocation:'saveLocation' };
    var fn = fnMap[currentAction];
    if (currentAction==='scrap')  { data.refDocType=data.refDocType||'MANUAL'; data.refDocNo=data.refDocNo||''; }
    if (currentAction==='sample') { data.refDocType=data.refDocType||'MANUAL'; data.refDocNo=data.refDocNo||''; }
    google.script.run
      .withSuccessHandler(function(res){
        if (res&&res.success===false){ btn.disabled=false; btn.textContent='Submit'; showToast(res.error||'Action failed.','error'); return; }
        showToast('Done.','success'); closeModal();
        stockViewCache=null; loadState.stock=null; loadState.locations=null;
        loadStock();
      })
      .withFailureHandler(function(e){ btn.disabled=false; btn.textContent='Submit'; showToast((e&&e.message)?e.message:'Action failed.','error'); })
      [fn](data);
  }

  // ── Toast ──
  var toastTimer = null;
  function showToast(msg, type) {
    var t = document.getElementById('pmToast');
    t.textContent = msg;
    t.className = 'pm-toast show'+(type?' '+type:'');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className='pm-toast'; }, type==='error'?5000:3000);
  }

})();
</script>
</div>
</body>
</html>
