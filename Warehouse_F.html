<!DOCTYPE html>
<html lang="en">
<head>
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse — Pack Masters QMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; min-height: max(884px, 100dvh); }
    h1, h2, h3, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }

    /* Tab strip active state managed by JS */
    .tab-btn-active   { color: #0ea5e9; border-bottom: 2px solid #0ea5e9; font-weight: 600; }
    .tab-btn-inactive { color: #64748b; border-bottom: 2px solid transparent; font-weight: 500; }

    /* Tab panels */
    .tab-panel          { display: none; }
    .tab-panel.active   { display: block; animation: fadeIn 0.15s ease; }
    @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }

    /* Skeleton pulse */
    @keyframes skel-pulse { 0%{opacity:.4}50%{opacity:1}100%{opacity:.4} }
    .skel-bar { display:inline-block; height:13px; background:#e2e8f0; border-radius:4px; animation:skel-pulse 0.8s ease-in-out infinite; }

    /* Qty pill */
    .qty-pill      { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; background:#1e3a5f; color:#fff; }
    .qty-pill.zero { background:#94a3b8; }

    /* Location type chip */
    .loc-chip    { display:inline-block; font-size:10px; padding:2px 7px; border-radius:12px; background:#e2e8f0; color:#1e3a5f; font-weight:600; }
    .loc-chip.q  { background:#FFE9D6; color:#B5650F; }
    .loc-chip.s  { background:#FCD9D9; color:#A4271A; }
    .loc-chip.sm { background:#E7EBFA; color:#4F4E96; }

    /* Balance hint */
    .balance-hint      { font-size:12px; font-weight:600; color:#0369a1; padding:8px 12px; background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; display:flex; align-items:center; gap:6px; margin-bottom:12px; }
    .balance-hint.warn { color:#A4271A; background:#FCD9D9; border-color:#f9a8a8; }

    /* Empty state */
    .wh-empty   { text-align:center; padding:32px 16px; font-size:13px; color:#64748b; }
    .wh-empty a { color:#0ea5e9; cursor:pointer; text-decoration:underline; }

    /* Stock table */
    .wh-table { width:100%; border-collapse:collapse; }
    .wh-table thead th {
      background:#f1f5f9; color:#1e3a5f; font-size:11px; font-weight:700;
      text-transform:uppercase; letter-spacing:.5px; padding:8px 10px;
      text-align:left; white-space:nowrap;
      position:sticky; top:calc(56px + 44px + 52px); z-index:10;
    }
    .wh-table tbody tr  { border-bottom:1px solid #e2e8f0; }
    .wh-table tbody tr:nth-child(even) { background:#f8fafc; }
    .wh-table tbody td  { padding:10px; font-size:12px; color:#0f172a; vertical-align:middle; }
    .loc-row { cursor:pointer; }
    .loc-row:hover { background:#eff6ff !important; }

    /* FAB + action menu */
    .action-bar  { position:fixed; right:18px; bottom:22px; z-index:200; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .action-menu { display:none; flex-direction:column; gap:4px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:6px; box-shadow:0 6px 18px rgba(30,58,95,0.18); }
    .action-menu.open { display:flex; }
    .action-menu button { background:transparent; border:none; font-family:inherit; font-size:13px; font-weight:600; color:#1e3a5f; padding:10px 16px; border-radius:8px; text-align:left; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:8px; }
    .action-menu button:hover { background:#f0f9ff; }
    .fab-action { width:56px; height:56px; border-radius:50%; background:#0ea5e9; color:#fff; border:none; font-size:24px; cursor:pointer; box-shadow:0 4px 12px rgba(14,165,233,0.35); font-family:inherit; transition:transform .15s; display:flex; align-items:center; justify-content:center; }
    .fab-action:hover { transform:translateY(-2px); }
    .fab-action.open  { transform:rotate(45deg); }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(11,42,74,0.55); display:none; align-items:flex-end; justify-content:center; z-index:1000; }
    .modal-overlay.show { display:flex; animation:fadeIn .15s ease; }
    @media (min-width:600px) { .modal-overlay { align-items:center; } }
    .modal-card { background:#fff; width:100%; max-width:540px; max-height:90vh; border-radius:12px 12px 0 0; display:flex; flex-direction:column; overflow:hidden; animation:slideUp .2s ease; }
    @media (min-width:600px) { .modal-card { border-radius:12px; } }
    @keyframes slideUp { from{transform:translateY(20px);opacity:.8} to{transform:translateY(0);opacity:1} }
    .modal-header  { padding:16px 18px; background:#1e3a5f; color:#fff; display:flex; align-items:center; justify-content:space-between; }
    .modal-title   { font-size:15px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; }
    .modal-close   { background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer; padding:0 6px; font-family:inherit; }
    .modal-body    { padding:16px 18px; overflow-y:auto; flex:1; }
    .field-row     { margin-bottom:12px; }
    .field-row label { display:block; font-size:11px; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; }
    .field-row label .req { color:#dc2626; margin-left:2px; }
    .field-row input, .field-row select, .field-row textarea {
      width:100%; box-sizing:border-box; height:44px;
      border:1.5px solid #d1d5db; border-radius:8px; padding:0 12px;
      font-size:14px; font-family:inherit; color:#0f172a; background:#fff;
      transition:border-color .15s;
    }
    .field-row textarea { height:auto; min-height:68px; padding:10px 12px; resize:vertical; }
    .field-row input:focus, .field-row select:focus, .field-row textarea:focus { outline:none; border-color:#0ea5e9; box-shadow:0 0 0 3px rgba(14,165,233,.1); }
    .field-row-2col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .modal-footer  { padding:12px 18px; border-top:1px solid #e2e8f0; display:flex; gap:10px; justify-content:flex-end; }
    .btn           { height:44px; padding:0 20px; border-radius:8px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; border:none; }
    .btn:disabled  { opacity:.5; cursor:not-allowed; }
    .btn-primary   { background:#1e3a5f; color:#fff; }
    .btn-primary:hover:not(:disabled) { background:#162e4f; }
    .btn-ghost     { background:transparent; color:#64748b; }
    .btn-ghost:hover { background:#f1f5f9; }
    .btn-danger    { background:#dc2626; color:#fff; }

    /* Toast */
    .pm-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(8px); min-width:220px; max-width:360px; padding:12px 18px; border-radius:10px; font-size:13px; font-weight:500; color:#fff; z-index:1500; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; text-align:center; }
    .pm-toast.show { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
    .pm-toast.success { background:#16a34a; }
    .pm-toast.error   { background:#dc2626; cursor:pointer; }

    /* Search input icon padding override */
    .search-with-icon { padding-left: 2.5rem !important; }
  </style>

<script>
(function() {
  'use strict';

  var activeTab = 'rm';
  var cache = { rm: null, fg: null, wip: null, quarantine: null, rework: null, locations: null, materials: null, movements: null };
  var stockViewCache = null;
  var loadState = {};
  var editingLocationId = null;
  var searchTimer = null;
  var currentAction = null;

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function td(v) { return '<td>' + esc(v) + '</td>'; }

  function locTypeChipClass(t) {
    var u = String(t || '').toUpperCase();
    if (u === 'QUARANTINE') return 'q';
    if (u === 'SCRAP') return 's';
    if (u === 'SAMPLE') return 'sm';
    return '';
  }

  /* ── Tabs ── */
  function switchTab(tab) {
    if (tab === activeTab) return;
    activeTab = tab;
    document.querySelectorAll('[data-tab]').forEach(function(el) {
      var isActive = el.getAttribute('data-tab') === tab;
      el.className = el.className.replace(/tab-btn-(active|inactive)/g, '');
      el.classList.add(isActive ? 'tab-btn-active' : 'tab-btn-inactive');
    });
    document.querySelectorAll('.tab-panel').forEach(function(p) {
      p.classList.toggle('active', p.id === 'panel-' + tab);
    });
    document.getElementById('searchInput').value = '';
    if (!loadState[tab]) loadTab(tab);
  }

  var STOCK_VIEW_TABS = { rm:1, fg:1, wip:1, quarantine:1, rework:1 };

  /* ── Skeleton ── */
  function showSkeleton(tab) {
    var el = document.getElementById('cards-' + tab);
    if (!el) return;
    var html = '';
    for (var r = 0; r < 4; r++) {
      html += '<div class="bg-white rounded-[12px] border border-[#e2e8f0] shadow-card p-4 mb-3">' +
        '<div class="skel-bar w-2/5 mb-2" style="height:16px;"></div>' +
        '<div class="skel-bar w-3/5 mb-3" style="height:12px;"></div>' +
        '<div class="flex gap-2"><div class="skel-bar w-16" style="height:22px;"></div><div class="skel-bar w-20" style="height:22px;"></div></div>' +
        '</div>';
    }
    el.innerHTML = html;
  }

  /* ── Load ── */
  function loadMovements() {
    var list = document.getElementById('movementsList');
    list.innerHTML = '<div class="bg-white rounded-[12px] p-8 border border-[#e2e8f0] shadow-card text-center text-[#94a3b8] text-[13px]">' +
      '<span class="material-symbols-outlined text-[40px] block mb-2 opacity-40">hourglass_top</span>Loading movements…</div>';
    google.script.run
      .withSuccessHandler(function(rows){
        loadState['movements'] = 'loaded';
        renderMovements(rows || []);
      })
      .withFailureHandler(function(e){
        loadState['movements'] = 'error';
        list.innerHTML = '<div class="bg-white rounded-[12px] p-8 border border-[#e2e8f0] shadow-card text-center text-[#dc2626] text-[13px]">Load failed: ' + esc(e.message || e) + '</div>';
      })
      .getStockMovements(100);
  }

  function renderMovements(rows) {
    var list = document.getElementById('movementsList');
    if (!rows.length) {
      list.innerHTML = '<div class="bg-white rounded-[12px] p-8 border border-[#e2e8f0] shadow-card text-center text-[#94a3b8] text-[13px]">' +
        '<span class="material-symbols-outlined text-[40px] block mb-2 opacity-40">swap_horiz</span>No movements recorded yet.</div>';
      return;
    }
    var typeColor = {
      'GRN_RECEIPT':           '#16a34a',
      'CUSTOMER_RETURN_IN':    '#16a34a',
      'OQC_RELEASE':           '#0ea5e9',
      'DISPATCH':              '#dc2626',
      'GATEPASS':              '#dc2626',
      'LOCATION_TRANSFER':     '#0ea5e9',
      'SCRAP':                 '#dc2626',
      'SAMPLE':                '#d97706',
      'ISSUE_TO_PRODUCTION':   '#7c3aed'
    };
    list.innerHTML = rows.map(function(r){
      var col = typeColor[r.txnType] || '#64748b';
      var qty = r.qtyIn > 0 ? ('+' + r.qtyIn) : ('−' + r.qtyOut);
      return '<div class="bg-white rounded-[12px] border border-[#e2e8f0] shadow-card p-3" style="border-left:4px solid ' + col + ';">' +
        '<div class="flex items-center justify-between mb-1">' +
          '<span class="font-headline text-[13px] font-bold text-[#1e3a5f]">' + esc(r.materialCode) + ' · ' + esc(r.batchOrLotNo || '—') + '</span>' +
          '<span class="text-[11px] text-[#64748b]">' + esc(r.timestamp) + '</span>' +
        '</div>' +
        '<div class="flex items-center justify-between">' +
          '<span class="text-[11px] font-semibold uppercase tracking-wider" style="color:' + col + ';">' + esc(r.txnType.replace(/_/g, ' ')) + '</span>' +
          '<span class="text-[14px] font-bold" style="color:' + col + ';">' + qty + '</span>' +
        '</div>' +
        '<div class="text-[11px] text-[#64748b] mt-1">' + esc(r.locationId || '—') + (r.refDocNo ? ' · ' + esc(r.refDocNo) : '') + (r.operator ? ' · ' + esc(r.operator) : '') + '</div>' +
      '</div>';
    }).join('');
  }

  function loadTab(tab) {
    loadState[tab] = 'loading';
    if (tab === 'movements') { loadMovements(); return; }
    if (tab === 'locations') {
      google.script.run
        .withSuccessHandler(function(rows) { cache.locations = rows || []; loadState.locations = 'loaded'; renderTab('locations', ''); })
        .withFailureHandler(function(e) { onError('locations', e); })
        .getLocations();
      return;
    }
    if (STOCK_VIEW_TABS[tab]) {
      showSkeleton(tab);
      if (stockViewCache) {
        loadState[tab] = 'loaded';
        renderStockTab(tab, '');
        return;
      }
      google.script.run
        .withSuccessHandler(function(data) {
          stockViewCache = data || { rm:[], fg:[], wip:[], quarantine:[], rework:[] };
          ['rm','fg','wip','quarantine','rework'].forEach(function(t){ loadState[t] = 'loaded'; });
          renderStockTab(tab, '');
        })
        .withFailureHandler(function(e) { onError(tab, e); })
        .getStockView();
    }
  }

  function onError(tab, err) {
    loadState[tab] = 'error';
    var el = document.getElementById('cards-' + tab) || document.getElementById('tbody-' + tab);
    if (el) el.innerHTML = '<div class="wh-empty" style="color:#dc2626;">Could not load. <a onclick="retryTab(\'' + tab + '\')">Retry</a></div>';
    showToast('Could not load ' + tab + '.', 'error');
  }
  window.retryTab = function(tab) { if (STOCK_VIEW_TABS[tab]) stockViewCache = null; loadState[tab] = null; loadTab(tab); };
  window.showLedger = function(matCode, batchNo) {
    showToast('Ledger: ' + matCode + (batchNo ? ' · ' + batchNo : ''), 'info');
  };

  /* ── Age badge ── */
  function ageBadge(d) {
    if (d === null || d === undefined || d === '') return '';
    var n = Number(d);
    if (isNaN(n)) return '';
    var bg = n < 15 ? '#dcfce7' : n < 30 ? '#fff7ed' : '#fee2e2';
    var col = n < 15 ? '#16a34a' : n < 30 ? '#ea580c' : '#dc2626';
    return '<span style="background:' + bg + ';color:' + col + ';" class="text-[10px] font-bold px-2 py-0.5 rounded-full">' + n + 'd</span>';
  }

  function iqcBadge(s) {
    var cfg = {
      'ACCEPTED':{'bg':'#dcfce7','c':'#16a34a'}, 'CLOSED':{'bg':'#dbeafe','c':'#1d4ed8'},
      'REJECTED':{'bg':'#fee2e2','c':'#dc2626'}, 'HOLD':{'bg':'#fff7ed','c':'#ea580c'},
      'PENDING':{'bg':'#f1f5f9','c':'#64748b'}
    };
    var u = String(s || 'PENDING').toUpperCase();
    var c = cfg[u] || cfg['PENDING'];
    return '<span style="background:' + c.bg + ';color:' + c.c + ';" class="text-[10px] font-bold px-2 py-0.5 rounded-full">' + esc(u) + '</span>';
  }

  function stockCard(fields, qty, unit) {
    var rows = fields.map(function(f) {
      return '<div><div style="font-size:10px;color:#78909C;font-weight:600;text-transform:uppercase;letter-spacing:.3px;">' + f[0] + '</div>' +
             '<div style="font-size:12px;color:#263238;margin-top:1px;">' + (f[1] || '—') + '</div></div>';
    });
    return '<div class="bg-white rounded-[12px] border border-[#e2e8f0] shadow-card p-4 mb-3">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;">' + rows.join('') + '</div>' +
      (qty != null ? '<div style="text-align:right;margin-top:8px;font-size:20px;font-weight:700;color:#1e3a5f;">' + esc(qty) + ' <span style="font-size:12px;font-weight:400;color:#64748b;">' + esc(unit || '') + '</span></div>' : '') +
    '</div>';
  }

  function renderStockTab(tab, query) {
    var el = document.getElementById('cards-' + tab);
    if (!el || !stockViewCache) return;
    var rows = stockViewCache[tab] || [];
    var q = (query || '').toLowerCase();
    if (q) rows = rows.filter(function(r) {
      return Object.values ? Object.values(r).some(function(v){ return String(v||'').toLowerCase().indexOf(q) !== -1; })
        : Object.keys(r).some(function(k){ return String(r[k]||'').toLowerCase().indexOf(q) !== -1; });
    });

    if (!rows.length) {
      el.innerHTML = '<div class="wh-empty">' + (q ? 'No results. <a onclick="clearSearch()">Clear</a>' : 'Nothing here.') + '</div>';
      return;
    }

    var html = rows.map(function(r) {
      if (tab === 'rm') return stockCard([
        ['Material', esc(r.materialDesc || r.materialCode)],
        ['Batch', esc(r.batchNo)],
        ['Supplier', esc(r.supplier)],
        ['Location', esc(r.location)],
        ['GRN Date', esc(r.grnDate)],
        ['IQC', iqcBadge(r.iqcStatus) + (r.ageDays != null ? ' ' + ageBadge(r.ageDays) : '')]
      ], r.qty, r.unit);

      if (tab === 'fg') return stockCard([
        ['Product', esc(r.materialDesc || r.materialCode)],
        ['Batch', esc(r.batchNo)],
        ['Customer', esc(r.customer)],
        ['Location', esc(r.location)],
        ['OQC Date', esc(r.oqcDate)],
        ['OQC Ref', esc(r.oqcRef) + (r.ageDays != null ? ' ' + ageBadge(r.ageDays) : '')]
      ], r.qty, r.unit);

      if (tab === 'wip') return stockCard([
        ['Job ID', esc(r.jobId)],
        ['Product', esc(r.fgDesc || r.fgCode)],
        ['IPQC ID', esc(r.ipqcId)],
        ['Status', '<span style="background:#E3F2FD;color:#1565C0;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9999px;">' + esc(r.status) + '</span>'],
        ['Since', esc(r.date instanceof Date ? r.date.toLocaleDateString('en-IN') : r.date)],
        ['FG Target', esc(r.fgQty) + ' ' + esc(r.fgUom)]
      ], null, null);

      if (tab === 'quarantine') return stockCard([
        ['Material', esc(r.materialDesc || r.materialCode)],
        ['Batch', esc(r.batchNo)],
        ['Location', esc(r.location)],
        ['Source Ref', esc(r.sourceRef)],
        ['Since', esc(r.since)],
        ['Age', ageBadge(r.ageDays)]
      ], r.qty, r.unit);

      if (tab === 'rework') return stockCard([
        ['Rework ID', esc(r.reworkId)],
        ['Material', esc(r.materialDesc || r.materialCode)],
        ['Batch', esc(r.batchNo)],
        ['Source', esc(r.source)],
        ['Since', esc(r.since)],
        ['Status / Age', '<span style="background:#FFF9C4;color:#795548;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9999px;">' + esc(r.status) + '</span> ' + ageBadge(r.ageDays)]
      ], r.qty, r.unit);

      return '';
    }).join('');
    el.innerHTML = html;
  }

  /* ── Render (locations only — stock tabs use renderStockTab) ── */
  function renderTab(tab, query) {
    if (STOCK_VIEW_TABS[tab]) { renderStockTab(tab, query); return; }
    var rows = cache.locations || [];
    var q = (query || '').toLowerCase();
    var filtered = q ? rows.filter(function(r){
      return Object.keys(r).some(function(k){ return String(r[k]||'').toLowerCase().indexOf(q) !== -1; });
    }) : rows;
    var tbody = document.getElementById('tbody-' + tab);
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="wh-empty">' + (q ? 'No results. <a onclick="clearSearch()">Clear</a>' : 'No locations. Tap + to add.') + '</div></td></tr>';
      return;
    }
    var html = '';
    filtered.forEach(function(r) {
      var cap = r.capacityQty ? (esc(r.capacityQty) + ' ' + esc(r.capacityUnit || '')) : '';
      html += '<tr class="loc-row" data-loc-id="' + esc(r.id) + '">' +
        td(r.id) + td(r.label || r.id) +
        '<td><span class="loc-chip ' + locTypeChipClass(r.type) + '">' + esc(r.type || '') + '</span></td>' +
        td(r.section) + td(r.aisle) + td(r.rack) + td(cap) +
      '</tr>';
    });
    tbody.innerHTML = html;
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    renderTab(activeTab, '');
  }
  window.clearSearch = clearSearch;

  /* ── Action menu + modal ── */
  function toggleActionMenu(force) {
    var menu = document.getElementById('actionMenu');
    var fab  = document.getElementById('fabAction');
    var open = (force === undefined) ? !menu.classList.contains('open') : force;
    menu.classList.toggle('open', open);
    fab.classList.toggle('open', open);
  }

  function openAction(action) {
    currentAction = action;
    var title, body;
    switch (action) {
      case 'transfer':    title = 'Transfer Stock';          body = fieldsFor('transfer'); break;
      case 'issue':       title = 'Issue RM to Production';  body = fieldsFor('issue'); break;
      case 'scrap':       title = 'Record Scrap';            body = fieldsFor('scrap'); break;
      case 'sample':      title = 'Take Sample';             body = fieldsFor('sample'); break;
      case 'newLocation': title = 'Add Location';            body = fieldsFor('newLocation'); break;
    }
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('btnSubmit').disabled = false;
    document.getElementById('btnSubmit').textContent = 'Submit';
    document.getElementById('btnDelete').style.display = 'none';
    editingLocationId = null;
    document.getElementById('modalOverlay').classList.add('show');
    if (action === 'transfer' || action === 'issue' || action === 'scrap' || action === 'sample') {
      bindBalanceHint();
    }
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    currentAction = null;
    editingLocationId = null;
    document.getElementById('btnDelete').style.display = 'none';
  }

  function openEditLocation(locId) {
    var row = (cache.locations || []).find(function(l){ return String(l.id) === String(locId); });
    if (!row) { showToast('Location not found.', 'error'); return; }
    currentAction = 'newLocation';
    editingLocationId = row.id;
    document.getElementById('modalTitle').textContent = 'Edit Location';
    document.getElementById('modalBody').innerHTML = fieldsFor('newLocation');
    document.getElementById('btnSubmit').disabled = false;
    document.getElementById('btnSubmit').textContent = 'Save';
    document.getElementById('btnDelete').style.display = '';
    document.getElementById('modalOverlay').classList.add('show');
    var keys = ['id','type','label','floor','section','aisle','rack','shelf','bin','capacityQty','capacityUnit'];
    keys.forEach(function(k){
      var el = document.querySelector('#modalBody [data-key="' + k + '"]');
      if (el && row[k] != null) el.value = row[k];
    });
    var idEl = document.querySelector('#modalBody [data-key="id"]');
    if (idEl) idEl.readOnly = true;
  }

  function deleteCurrentLocation() {
    if (!editingLocationId) return;
    if (!confirm('Delete location "' + editingLocationId + '"?\n\nIf the location has stock history, it will be marked inactive instead.')) return;
    var btn = document.getElementById('btnDelete');
    btn.disabled = true; btn.textContent = 'Deleting...';
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = 'Delete';
        if (res && res.success === false) { showToast(res.error || 'Delete failed.', 'error'); return; }
        showToast((res && res.message) || (res && res.soft ? 'Marked inactive.' : 'Deleted.'), 'success');
        closeModal();
        loadState.locations = null;
        loadTab('locations');
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Delete';
        showToast((e && e.message) ? e.message : 'Delete failed.', 'error');
      })
      .deleteLocation(editingLocationId);
  }

  function stockOpts() {
    var stock = cache.stock || [];
    if (!stock.length) return '<option value="">(no stock on hand)</option>';
    return '<option value="">— Choose lot —</option>' + stock.map(function(s) {
      var v = [s.materialCode, s.batchOrLotNo, s.locationId].join('|');
      var lbl = s.materialCode + ' / ' + s.batchOrLotNo + ' @ ' + s.locationId + ' (' + s.balance + ' ' + (s.unit || '') + ')';
      return '<option value="' + esc(v) + '">' + esc(lbl) + '</option>';
    }).join('');
  }

  function locOpts(excludeId) {
    var locs = cache.locations || [];
    return '<option value="">— Choose location —</option>' + locs.filter(function(l){
      return l.id !== excludeId;
    }).map(function(l) {
      return '<option value="' + esc(l.id) + '">' + esc(l.id + ' — ' + (l.label || l.type)) + '</option>';
    }).join('');
  }

  function fieldsFor(action) {
    if (action === 'transfer') {
      return '' +
        '<div class="field-row"><label>Source Lot<span class="req">*</span></label><select data-key="lot">' + stockOpts() + '</select></div>' +
        '<div class="balance-hint" id="balHint" style="display:none;"><span class="material-symbols-outlined text-[16px]">info</span><span></span></div>' +
        '<div class="field-row"><label>Destination Location<span class="req">*</span></label><select data-key="toLocationId">' + locOpts() + '</select></div>' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>Qty<span class="req">*</span></label><input type="number" data-key="qty" step="any" min="0"></div>' +
          '<div class="field-row"><label>Transferred By</label><input type="text" data-key="transferredBy"></div>' +
        '</div>' +
        '<div class="field-row"><label>Reason</label><input type="text" data-key="reason"></div>';
    }
    if (action === 'issue') {
      return '' +
        '<div class="field-row"><label>Source Lot<span class="req">*</span></label><select data-key="lot">' + stockOpts() + '</select></div>' +
        '<div class="balance-hint" id="balHint" style="display:none;"><span class="material-symbols-outlined text-[16px]">info</span><span></span></div>' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>Qty<span class="req">*</span></label><input type="number" data-key="qtyToIssue" step="any" min="0"></div>' +
          '<div class="field-row"><label>Production Order</label><input type="text" data-key="productionOrderNo" placeholder="auto if blank"></div>' +
        '</div>' +
        '<div class="field-row"><label>Issued By</label><input type="text" data-key="issuedBy"></div>';
    }
    if (action === 'scrap') {
      return '' +
        '<div class="field-row"><label>Source Lot<span class="req">*</span></label><select data-key="lot">' + stockOpts() + '</select></div>' +
        '<div class="balance-hint" id="balHint" style="display:none;"><span class="material-symbols-outlined text-[16px]">info</span><span></span></div>' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>Qty Scrap<span class="req">*</span></label><input type="number" data-key="qtyScrap" step="any" min="0"></div>' +
          '<div class="field-row"><label>Destination</label><input type="text" data-key="scrapDestination" placeholder="e.g. RBP Vendor"></div>' +
        '</div>' +
        '<div class="field-row"><label>Reason<span class="req">*</span></label><input type="text" data-key="scrapReason"></div>' +
        '<div class="field-row"><label>Recorded By</label><input type="text" data-key="recordedBy"></div>';
    }
    if (action === 'sample') {
      return '' +
        '<div class="field-row"><label>Source Lot<span class="req">*</span></label><select data-key="lot">' + stockOpts() + '</select></div>' +
        '<div class="balance-hint" id="balHint" style="display:none;"><span class="material-symbols-outlined text-[16px]">info</span><span></span></div>' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>Qty Sample<span class="req">*</span></label><input type="number" data-key="qtySample" step="any" min="0"></div>' +
          '<div class="field-row"><label>Stored At</label><input type="text" data-key="locationStored" value="SAMPLE-CABINET"></div>' +
        '</div>' +
        '<div class="field-row"><label>Purpose<span class="req">*</span></label><input type="text" data-key="samplePurpose"></div>' +
        '<div class="field-row"><label>Taken By</label><input type="text" data-key="takenBy"></div>';
    }
    if (action === 'newLocation') {
      return '' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>ID<span class="req">*</span></label><input type="text" data-key="id" placeholder="LOC-RM-01"></div>' +
          '<div class="field-row"><label>Type<span class="req">*</span></label><select data-key="type">' +
            ['RM','FG','QUARANTINE','SCRAP','SAMPLE','FG_HOLD'].map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join('') +
          '</select></div>' +
        '</div>' +
        '<div class="field-row"><label>Label</label><input type="text" data-key="label"></div>' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>Floor</label><input type="text" data-key="floor"></div>' +
          '<div class="field-row"><label>Section</label><input type="text" data-key="section"></div>' +
        '</div>' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>Aisle</label><input type="text" data-key="aisle"></div>' +
          '<div class="field-row"><label>Rack</label><input type="text" data-key="rack"></div>' +
        '</div>' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>Shelf</label><input type="text" data-key="shelf"></div>' +
          '<div class="field-row"><label>Bin</label><input type="text" data-key="bin"></div>' +
        '</div>' +
        '<div class="field-row-2col">' +
          '<div class="field-row"><label>Capacity Qty</label><input type="number" data-key="capacityQty" step="any" min="0"></div>' +
          '<div class="field-row"><label>Capacity Unit</label><input type="text" data-key="capacityUnit" placeholder="kg / pcs"></div>' +
        '</div>';
    }
    return '';
  }

  function bindBalanceHint() {
    var sel = document.querySelector('#modalBody select[data-key="lot"]');
    var hint = document.getElementById('balHint');
    if (!sel || !hint) return;
    function update() {
      var parts = (sel.value || '').split('|');
      if (parts.length !== 3 || !parts[0]) { hint.style.display = 'none'; return; }
      var lot = (cache.stock || []).find(function(s){
        return s.materialCode === parts[0] && s.batchOrLotNo === parts[1] && s.locationId === parts[2];
      });
      if (!lot) { hint.style.display = 'none'; return; }
      var span = hint.querySelector('span:last-child');
      if (span) span.textContent = 'Available: ' + lot.balance + ' ' + (lot.unit || '') + ' @ ' + lot.locationId;
      hint.className = 'balance-hint' + (lot.balance > 0 ? '' : ' warn');
      hint.style.display = 'flex';
    }
    sel.addEventListener('change', update);
  }

  function collectFormData() {
    var data = {};
    document.querySelectorAll('#modalBody [data-key]').forEach(function(el) {
      var k = el.getAttribute('data-key');
      var v = el.value;
      if (el.type === 'number') v = (v === '' ? '' : Number(v));
      else if (typeof v === 'string') v = v.trim();
      data[k] = v;
    });
    if (data.lot) {
      var p = data.lot.split('|');
      data.materialCode   = p[0];
      data.batchOrLotNo   = p[1];
      data.fromLocationId = p[2];
      data.locationId     = p[2];
      delete data.lot;
    }
    return data;
  }

  function validate(action, data) {
    function req(k, label) {
      var v = data[k];
      if (v === null || v === undefined || v === '' || (typeof v === 'string' && !v.trim())) {
        return label + ' is required.';
      }
      return null;
    }
    if (action === 'transfer') {
      return req('materialCode', 'Source lot')
          || req('toLocationId', 'Destination location')
          || req('qty', 'Qty')
          || (data.fromLocationId === data.toLocationId ? 'Source and destination must differ.' : null);
    }
    if (action === 'issue')  return req('materialCode', 'Source lot') || req('qtyToIssue', 'Qty');
    if (action === 'scrap')  return req('materialCode', 'Source lot') || req('qtyScrap', 'Qty scrap') || req('scrapReason', 'Reason');
    if (action === 'sample') return req('materialCode', 'Source lot') || req('qtySample', 'Qty sample') || req('samplePurpose', 'Purpose');
    if (action === 'newLocation') return req('id', 'ID') || req('type', 'Type');
    return null;
  }

  function submitAction() {
    var data = collectFormData();
    var err = validate(currentAction, data);
    if (err) { showToast(err, 'error'); return; }

    var btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.textContent = 'Submitting...';

    var fn, payload = data;
    switch (currentAction) {
      case 'transfer':    fn = 'recordLocationTransfer'; break;
      case 'issue':       fn = 'issueRMForProduction'; break;
      case 'scrap':       fn = 'recordScrap'; payload.refDocType = data.refDocType || 'MANUAL'; payload.refDocNo = data.refDocNo || ''; break;
      case 'sample':      fn = 'recordSample'; payload.refDocType = data.refDocType || 'MANUAL'; payload.refDocNo = data.refDocNo || ''; break;
      case 'newLocation': fn = 'saveLocation'; break;
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success === false) {
          btn.disabled = false; btn.textContent = 'Submit';
          showToast(res.error || 'Action failed.', 'error');
          return;
        }
        showToast('Done.', 'success');
        closeModal();
        loadState.stock = null;
        loadState.locations = null;
        loadTab(activeTab);
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Submit';
        showToast((e && e.message) ? e.message : 'Action failed.', 'error');
      })
      [fn](payload);
  }

  /* ── Toast ── */
  var toastTimer = null;
  function showToast(msg, type) {
    var t = document.getElementById('pmToast');
    t.textContent = msg;
    t.className = 'pm-toast show' + (type ? ' ' + type : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = 'pm-toast'; }, type === 'error' ? 5000 : 3000);
  }

  /* ── Role gate ── */
  function checkRole() {
    var role = sessionStorage.getItem('userRole') || '';
    var chip = document.getElementById('roleChip');
    if (chip && role) {
      chip.textContent = role.charAt(0).toUpperCase() + role.slice(1);
      chip.classList.remove('hidden');
    }
    if (role === 'user') {
      google.script.run
        .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
        .withFailureHandler(function(){}).getFormHtml('Landing');
      return false;
    }
    return true;
  }

  /* ── Init ── */
  document.addEventListener('DOMContentLoaded', function() {
    if (!checkRole()) return;

    document.getElementById('backBtn').addEventListener('click', function() {
      google.script.run
        .withSuccessHandler(function(html){ document.open(); document.write(html); document.close(); })
        .withFailureHandler(function(){}).getFormHtml('Landing');
    });

    document.getElementById('whTabBar').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-tab]');
      if (btn) switchTab(btn.getAttribute('data-tab'));
    });

    document.getElementById('searchInput').addEventListener('input', function() {
      var val = this.value;
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function() {
        if (loadState[activeTab] === 'loaded') renderTab(activeTab, val);
      }, 250);
    });

    document.getElementById('fabAction').addEventListener('click', function() {
      toggleActionMenu();
    });

    document.getElementById('actionMenu').addEventListener('click', function(e) {
      var b = e.target.closest('[data-action]');
      if (!b) return;
      toggleActionMenu(false);
      var promises = [];
      if (!cache.stock) promises.push(new Promise(function(res){
        google.script.run.withSuccessHandler(function(r){
          cache.stock = r || []; loadState.stock = 'loaded';
          google.script.run.withSuccessHandler(function(m){
            cache.materials = m || [];
            var mm = {}; cache.materials.forEach(function(x){ mm[String(x.code).trim()] = x; });
            cache.stock.forEach(function(s){ var x = mm[String(s.materialCode).trim()] || {}; s.desc = x.desc || ''; s.unit = x.unit || ''; });
            res();
          }).withFailureHandler(function(){ res(); }).getMaterials();
        }).withFailureHandler(function(){ res(); }).getStockSummary();
      }));
      if (!cache.locations) promises.push(new Promise(function(res){
        google.script.run.withSuccessHandler(function(r){ cache.locations = r || []; loadState.locations = 'loaded'; res(); })
          .withFailureHandler(function(){ res(); }).getLocations();
      }));
      Promise.all(promises).then(function(){ openAction(b.getAttribute('data-action')); });
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('btnCancel').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.getElementById('btnSubmit').addEventListener('click', submitAction);
    document.getElementById('btnDelete').addEventListener('click', deleteCurrentLocation);

    document.getElementById('tbody-locations').addEventListener('click', function(e) {
      var tr = e.target.closest('tr.loc-row');
      if (!tr) return;
      openEditLocation(tr.getAttribute('data-loc-id'));
    });

    document.getElementById('pmToast').addEventListener('click', function() {
      this.className = 'pm-toast';
    });

    loadTab('rm');
  });

})();
</script>
</div><!-- /.pm-page-wrap -->
</body>
</html>
