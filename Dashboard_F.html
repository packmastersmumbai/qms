<body>

<div class="pm-header">
  <div class="logo-box">PM</div>
  <div class="header-text">
    <span class="logo-text">QMS Dashboard</span>
    <span class="logo-sub">Pack Masters</span>
  </div>
</div>

<div class="tab-bar" id="typeTabs">
  <button class="tab-btn active" data-type="ALL">All</button>
  <button class="tab-btn" data-type="GRN">GRN</button>
  <button class="tab-btn" data-type="IQC">IQC</button>
  <button class="tab-btn" data-type="IPQC">IPQC</button>
  <button class="tab-btn" data-type="OQC">OQC</button>
  <button class="tab-btn" data-type="GP">Gatepass</button>
</div>

<div class="dash-filter">
  <select id="fRange">
    <option value="TODAY">Today</option>
    <option value="WEEK" selected>This Week</option>
    <option value="MONTH">This Month</option>
    <option value="ALL">All Time</option>
  </select>
  <button class="btn-refresh" id="btnRefresh">Refresh</button>
  <span id="lastRefresh"></span>
</div>

<div class="sum-row" id="sumRow">
  <div class="sum-card total">  <div class="sc-num" id="cTotal">—</div><div class="sc-lbl">Total</div></div>
  <div class="sum-card pass">   <div class="sc-num" id="cPass">—</div> <div class="sc-lbl">Accepted</div></div>
  <div class="sum-card fail">   <div class="sc-num" id="cFail">—</div> <div class="sc-lbl">Rejected</div></div>
  <div class="sum-card hold">   <div class="sc-num" id="cHold">—</div> <div class="sc-lbl">Hold</div></div>
  <div class="sum-card pending"><div class="sc-num" id="cPend">—</div> <div class="sc-lbl">Pending</div></div>
  <div class="sum-card-defect" id="cIPQCCard">
    <div class="sc-num" id="cIPQCRate">—</div>
    <div class="sc-lbl">Defect Rate</div>
  </div>
</div>

<div class="recent-section">
  <div class="recent-hdr">
    <span class="recent-hdr-title" id="recentTitle">Recent Entries</span>
    <span class="recent-hdr-count" id="recentCount"></span>
  </div>
  <div id="recList">
    <div class="state-box">
      <span class="spinner"></span>
      <div class="msg" style="margin-top:8px;">Loading…</div>
    </div>
  </div>
</div>

<div class="rec-detail-panel" id="detailPanel">
  <div class="rec-detail-hdr">
    <span class="rec-detail-title" id="detailTitle">Detail</span>
    <button class="rec-detail-close" id="detailClose">✕</button>
  </div>
  <div class="rec-detail-grid" id="detailGrid"></div>
  <div class="rec-detail-actions" id="detailActions"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var sessionId = sessionStorage.getItem('dwmSessionId') || '';

var allRows    = [];
var activeTab  = 'ALL';
var openCardEl = null;
var currentSlice = [];

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btnRefresh').addEventListener('click', loadData);
  document.getElementById('detailClose').addEventListener('click', closeDetail);

  document.getElementById('typeTabs').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    switchTab(btn.dataset.type);
  });

  document.getElementById('recList').addEventListener('click', function(e) {
    var card = e.target.closest('.r-card');
    if (!card) return;
    var idx = parseInt(card.dataset.idx, 10);
    showDetail(currentSlice[idx], card);
  });

  document.getElementById('detailActions').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.action === 'wa')   sendWADetail();
    if (btn.dataset.action === 'open') openFullRecord();
  });

  loadData();
});

function loadData() {
  document.getElementById('recList').innerHTML =
    '<div class="state-box"><span class="spinner"></span><div class="msg" style="margin-top:8px;">Loading\u2026</div></div>';
  closeDetail();

  var range = document.getElementById('fRange').value;

  google.script.run
    .withSuccessHandler(function(data) {
      if (!data || !data.rows) {
        var msg = (data && data.error) ? data.error : 'No data. Run Setup from QMS System menu first.';
        document.getElementById('recList').innerHTML =
          '<div class="state-box"><span class="icon">\u26a0\ufe0f</span><div class="msg">' + esc(msg) + '</div></div>';
        return;
      }
      allRows = data.rows;
      renderCounts(data.counts);
      renderList(filteredRows());
      document.getElementById('lastRefresh').textContent =
        'at ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    })
    .withFailureHandler(function(e) {
      document.getElementById('recList').innerHTML =
        '<div class="state-box"><span class="icon">\u26a0\ufe0f</span><div class="msg">Load error: ' +
        esc((e && e.message) || String(e)) + '</div></div>';
    })
    .getDashboardData({ type: 'ALL', range: range });

  google.script.run
    .withSuccessHandler(renderIPQCRate)
    .withFailureHandler(function() { renderIPQCRate(null); })
    .getIPQCDefectRate();
}

function switchTab(type) {
  activeTab = type;
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.type === type);
  });
  closeDetail();
  renderList(filteredRows());
}

function filteredRows() {
  if (activeTab === 'ALL') return allRows;
  return allRows.filter(function(r) { return r.type === activeTab; });
}

function renderCounts(c) {
  if (!c) return;
  var rows = filteredRows();
  if (activeTab !== 'ALL') {
    c = buildCounts(rows);
  }
  document.getElementById('cTotal').textContent = c.total;
  document.getElementById('cPass').textContent  = c.pass;
  document.getElementById('cFail').textContent  = c.fail;
  document.getElementById('cHold').textContent  = c.hold || 0;
  document.getElementById('cPend').textContent  = c.pending || 0;
}

function buildCounts(rows) {
  var c = { total: rows.length, pass: 0, fail: 0, hold: 0, pending: 0 };
  rows.forEach(function(r) {
    var s = (r.status || '').toUpperCase();
    if (s === 'ACCEPTED' || s === 'RELEASED' || s === 'ISSUED' || s === 'CLOSED') c.pass++;
    else if (s === 'REJECTED') c.fail++;
    else if (s === 'HOLD')     c.hold++;
    else                       c.pending++;
  });
  return c;
}

function renderIPQCRate(data) {
  var card = document.getElementById('cIPQCCard');
  var el   = document.getElementById('cIPQCRate');
  if (!data || !data.total || data.total === 0) {
    el.textContent = '—';
    card.style.background = 'var(--navy)';
    return;
  }
  var rate = parseFloat(data.rate) || 0;
  el.textContent = data.rate;
  card.style.background = rate === 0 ? 'var(--success)' : rate > 5 ? 'var(--hold)' : 'var(--navy)';
}

function renderList(rows) {
  var title = activeTab === 'ALL' ? 'Recent Entries' : activeTab + ' \u2014 Recent';
  document.getElementById('recentTitle').textContent = title;

  renderCounts(buildCounts(rows));

  if (!rows || rows.length === 0) {
    document.getElementById('recentCount').textContent = '';
    document.getElementById('recList').innerHTML =
      '<div class="state-box"><span class="icon">\ud83d\udcad</span>' +
      '<div class="msg">No records for this period</div></div>';
    currentSlice = [];
    return;
  }

  var slice = rows.slice(0, 10);
  currentSlice = slice;
  document.getElementById('recentCount').textContent = rows.length + ' total, showing ' + slice.length;

  var html = '';
  slice.forEach(function(r, i) {
    var typeLower = r.type ? r.type.toLowerCase() : '';
    var dispType  = r.type === 'GP' ? 'Gatepass' : r.type;
    html +=
      '<div class="r-card" data-type="' + esc(r.type) + '" data-idx="' + i + '">' +
        '<div class="r-top">' +
          '<span class="r-docno">' + esc(r.docNo) + '</span>' +
          '<span class="r-date">' + esc(r.date) + '</span>' +
        '</div>' +
        '<div class="r-name">' + esc(r.party || r.material || '') + '</div>' +
        '<div class="r-foot">' +
          '<span class="badge badge-' + typeLower + '">' + esc(dispType) + '</span>' +
          statusBadge(r.status) +
          '<span class="r-inspector">' + esc(r.inspector || '') + '</span>' +
        '</div>' +
      '</div>';
  });

  document.getElementById('recList').innerHTML = html;
}

function showDetail(r, cardEl) {
  if (openCardEl === cardEl) {
    closeDetail();
    return;
  }
  openCardEl = cardEl;

  var panel    = document.getElementById('detailPanel');
  var d        = r.detail || {};
  var dispType = r.type === 'GP' ? 'Gatepass' : r.type;

  document.getElementById('detailTitle').innerHTML =
    '<span class="badge badge-' + (r.type || '').toLowerCase() + '">' + esc(dispType) + '</span> ' +
    esc(r.docNo);

  var items    = buildDetailItems(r, d);
  var gridHtml = '';
  items.forEach(function(item) {
    var val = (item[1] !== undefined && item[1] !== null && item[1] !== '') ? item[1] : '—';
    gridHtml +=
      '<div class="di-label">' + esc(item[0]) + '</div>' +
      '<div class="di-value">' + val + '</div>';
  });
  document.getElementById('detailGrid').innerHTML = gridHtml;

  var actHtml = '';
  if (r.type !== 'IPQC') {
    actHtml +=
      '<button class="btn-detail-wa" data-action="wa">Send WhatsApp</button>' +
      '<button class="btn-detail-open" data-action="open">Open Record</button>';
  }
  document.getElementById('detailActions').innerHTML = actHtml;

  cardEl.parentNode.insertBefore(panel, cardEl.nextSibling);
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetail() {
  var panel = document.getElementById('detailPanel');
  panel.classList.remove('open');
  openCardEl = null;
}

function buildDetailItems(r, d) {
  if (r.type === 'GRN') {
    return [
      ['GRN No.',      d.grnNo    || r.docNo],
      ['Date',         r.date],
      ['Supplier',     d.supplier || r.party],
      ['PO Ref',       d.poRef],
      ['Invoice No.',  d.invoiceNo],
      ['Material',     d.material || r.material],
      ['Batch',        d.batch    || r.batch],
      ['Qty Ordered',  d.qtyOrdered],
      ['Qty Received', d.qtyReceived],
      ['COA',          d.coa],
      ['IQC Status',   statusBadge(d.iqcStatus)],
      ['Remarks',      d.remarks  || '—']
    ];
  } else if (r.type === 'IQC') {
    return [
      ['IQC No.',      d.iqcNo    || r.docNo],
      ['GRN Ref',      d.grnRef],
      ['Date',         r.date],
      ['Supplier',     d.supplier || r.party],
      ['Material',     d.material || r.material],
      ['Batch',        d.batch    || r.batch],
      ['Inspector',    d.inspector|| r.inspector],
      ['Sample Size',  d.sampleSize],
      ['Disposition',  statusBadge(d.disposition)],
      ['Accepted Qty', d.acceptedQty !== undefined ? d.acceptedQty : '—'],
      ['Rejected Qty', d.rejectedQty !== undefined ? d.rejectedQty : '—'],
      ['Remarks',      d.remarks  || '—']
    ];
  } else if (r.type === 'OQC') {
    return [
      ['OQC No.',    d.oqcNo     || r.docNo],
      ['Date',       r.date],
      ['Customer',   d.customer  || r.party],
      ['Batch / PO', d.batchPO   || r.batch],
      ['Material',   d.material  || r.material],
      ['Inspector',  d.inspector || r.inspector],
      ['Sample Size',d.sampleSize],
      ['Decision',   statusBadge(d.releaseDecision)],
      ['Remarks',    d.remarks   || '—']
    ];
  } else if (r.type === 'IPQC') {
    return [
      ['Session',    d.sessionId   || r.docNo],
      ['Product',    d.productName || r.material],
      ['Batch',      d.batch       || r.batch],
      ['Inspector',  d.inspector   || r.inspector],
      ['Line',       d.line        || '—'],
      ['Rounds',     d.rounds      || '—'],
      ['Start',      d.startTime   || '—'],
      ['End',        d.endTime     || '—'],
      ['Status',     statusBadge(r.status)]
    ];
  } else if (r.type === 'GP') {
    return [
      ['Gatepass No.',  d.gpNo     || r.docNo],
      ['Date',          r.date],
      ['Dispatch Type', d.dispatchType],
      ['Party',         d.party    || r.party],
      ['Material',      d.materialDesc || r.material],
      ['Qty',           d.qty],
      ['Vehicle No.',   d.vehicleNo|| '—'],
      ['Authorized By', d.authorizedBy || '—'],
      ['Status',        statusBadge(r.status)]
    ];
  }
  return [['Doc No.', r.docNo], ['Date', r.date], ['Status', statusBadge(r.status)]];
}

function openFullRecord() {
  if (!openCardEl) return;
  var idx = parseInt(openCardEl.dataset.idx, 10);
  var r   = currentSlice[idx];
  if (!r) return;
  var docType = r.type === 'GP' ? 'Gatepass' : r.type;
  google.script.run
    .withSuccessHandler(function(html) {
      if (html) { document.open(); document.write(html); document.close(); }
    })
    .withFailureHandler(function(err) {
      showToast('Error: ' + ((err && err.message) || String(err)), 'error');
    })
    .getDocViewHtml(docType, r.docNo);
}

function sendWADetail() {
  if (!openCardEl) return;
  var idx = parseInt(openCardEl.dataset.idx, 10);
  var r   = currentSlice[idx];
  if (!r) return;
  var rec = {
    type: r.type, docNo: r.docNo, date: r.date,
    supplier: r.party, material: r.material, batch: r.batch,
    inspector: r.inspector, status: r.status,
    disposition: r.status, releaseDecision: r.status,
    customer: r.party, batchPO: r.batch,
    grnNo: r.detail && r.detail.grnRef,
    ncrRef: r.detail && r.detail.ncrRef
  };
  google.script.run
    .withSuccessHandler(function(url) { window.open(url, '_blank'); })
    .withFailureHandler(function(err) {
      showToast('WhatsApp error: ' + ((err && err.message) || String(err)), 'error');
    })
    .getWhatsAppURLForRecord(rec);
}

function statusBadge(s) {
  if (!s) s = 'PENDING';
  var su  = s.toUpperCase();
  var cls = (su === 'ACCEPTED' || su === 'RELEASED' || su === 'CLOSED') ? 'pass' :
             su === 'REJECTED'                                           ? 'fail' :
             su === 'HOLD'                                               ? 'hold' :
            (su === 'ISSUED'   || su === 'OPEN')                        ? 'awd'  : 'pending';
  return '<span class="badge badge-' + cls + '">' + esc(s) + '</span>';
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

function esc(s) {
  if (!s && s !== 0) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>
