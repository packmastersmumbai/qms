<script>
var allRows = [];
var activeTab = 'ALL';
var selectedRecord = null;
var selectedCardEl = null;

/* ── Data Loading ── */
function loadData() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('loadingMsg').innerHTML = '<span class="spinner"></span> Loading records…';
  document.getElementById('kanbanBoard').style.display = 'none';
  closeDetail();
  console.log('[Dashboard] loadData called, range=' + document.getElementById('fRange').value);

  google.script.run
    .withSuccessHandler(function(data) {
      try {
        if (!data || !data.rows) {
          var errMsg = (data && data.error) ? data.error : 'No data returned. Run Setup from QMS System menu first.';
          document.getElementById('loadingMsg').innerHTML = '❌ ' + errMsg;
          return;
        }
        allRows = data.rows;
        renderTabCounts(allRows);
        renderKanban(filteredRows());
        renderCounts(data.counts);
        document.getElementById('lastRefresh').textContent =
          'Refreshed ' + new Date().toLocaleTimeString('en-IN');
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('kanbanBoard').style.display = 'grid';
      } catch(jsErr) {
        document.getElementById('loadingMsg').innerHTML =
          '❌ Render error: ' + jsErr.message;
      }
    })
    .withFailureHandler(function(e) {
      console.log('[Dashboard] FAIL name=' + (e && e.name) + ' msg=' + (e && e.message));
      document.getElementById('loadingMsg').innerHTML =
        '❌ Error: ' + (e ? (e.message || e.name || JSON.stringify(e)) : 'unknown');
    })
    .getDashboardData({ type: 'ALL', range: document.getElementById('fRange').value });
}

/* ── Tab Switching (client-side filter) ── */
function switchTab(type) {
  activeTab = type;
  document.querySelectorAll('.type-tab').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.type === type);
  });
  closeDetail();
  renderKanban(filteredRows());
  renderCounts(buildCounts(filteredRows()));
}

function filteredRows() {
  if (activeTab === 'ALL') return allRows;
  return allRows.filter(function(r) { return r.type === activeTab; });
}

/* ── Tab Counts ── */
function renderTabCounts(rows) {
  var counts = { ALL: rows.length, GRN: 0, IQC: 0, OQC: 0, GP: 0 };
  rows.forEach(function(r) { if (counts[r.type] !== undefined) counts[r.type]++; });
  ['ALL','GRN','IQC','OQC','GP'].forEach(function(t) {
    document.getElementById('tc-' + t).textContent = counts[t];
  });
}

/* ── Summary Counts ── */
function buildCounts(rows) {
  var c = { total: rows.length, pass: 0, fail: 0, hold: 0, pending: 0 };
  rows.forEach(function(r) {
    var s = (r.status || '').toUpperCase();
    if (s === 'ACCEPTED' || s === 'RELEASED' || s === 'ISSUED') c.pass++;
    else if (s === 'REJECTED')                                  c.fail++;
    else if (s === 'HOLD')                                      c.hold++;
    else                                                        c.pending++;
  });
  return c;
}

function renderCounts(c) {
  document.getElementById('cTotal').textContent = c.total;
  document.getElementById('cPass').textContent  = c.pass;
  document.getElementById('cFail').textContent  = c.fail;
  document.getElementById('cPend').textContent  = (c.hold || 0) + (c.pending || 0);
}

/* ── Kanban Render ── */
function renderKanban(rows) {
  var cols = { pending: [], accepted: [], rejected: [], hold: [] };
  rows.forEach(function(r, globalIdx) {
    var s = (r.status || '').toUpperCase();
    var bucket = s === 'ACCEPTED' || s === 'RELEASED' || s === 'ISSUED' ? 'accepted' :
                 s === 'REJECTED'                                        ? 'rejected' :
                 s === 'HOLD'                                            ? 'hold' : 'pending';
    // store original index into allRows for detail lookup
    r._filteredIdx = globalIdx;
    cols[bucket].push(r);
  });

  ['pending','accepted','rejected','hold'].forEach(function(bucket) {
    var container = document.getElementById('col-' + bucket);
    container.innerHTML = '';
    document.getElementById('cnt-' + bucket).textContent = cols[bucket].length;

    if (cols[bucket].length === 0) {
      container.innerHTML = '<div class="empty-col">No records</div>';
      return;
    }
    cols[bucket].forEach(function(r) {
      var card = document.createElement('div');
      card.className = 'k-card';
      card.dataset.type = r.type;
      card.dataset.idx = r._filteredIdx;
      card.onclick = function() { showDetail(r._filteredIdx, card); };

      // Find original index in allRows for detail
      card.innerHTML =
        '<div class="k-card-top">' +
          '<span class="k-docno">' + r.docNo + '</span>' +
          '<span class="k-date">' + r.date + '</span>' +
        '</div>' +
        '<div class="k-party">' + (r.party || '—') + '</div>' +
        '<div class="k-material">' + (r.material || '—') + '</div>' +
        '<div class="k-footer">' +
          '<span class="badge badge-' + r.type.toLowerCase() + '">' + r.type + '</span>' +
          '<span class="k-inspector">' + (r.inspector || '') + '</span>' +
        '</div>';
      container.appendChild(card);
    });
  });
}

/* ── Detail Panel ── */
function showDetail(idx, cardEl) {
  // Deselect previous
  if (selectedCardEl) selectedCardEl.classList.remove('selected');
  selectedCardEl = cardEl;
  if (cardEl) cardEl.classList.add('selected');

  var r = filteredRows()[idx];
  selectedRecord = r;
  var d = r.detail || {};
  var panel = document.getElementById('detailPanel');

  document.getElementById('detailTitle').innerHTML =
    '<span class="badge badge-' + r.type.toLowerCase() + '">' + r.type + '</span> ' +
    r.docNo + ' &nbsp;' + statusBadge(r.status);

  // Hide optional sections
  document.getElementById('paramDetail').style.display = 'none';
  document.getElementById('qtyChips').style.display = 'none';

  var items = [];
  if (r.type === 'GRN') {
    items = [
      ['GRN No.',     d.grnNo    || r.docNo],
      ['Date',        r.date],
      ['Supplier',    d.supplier || r.party],
      ['PO Ref',      d.poRef],
      ['Invoice No.', d.invoiceNo],
      ['Material',    d.material || r.material],
      ['Batch No.',   d.batch || r.batch],
      ['Unit',        d.unit],
      ['Qty Ordered', d.qtyOrdered],
      ['Qty Received',d.qtyReceived],
      ['COA',         d.coa],
      ['Expiry',      d.expiry],
      ['IQC Status',  statusBadge(d.iqcStatus)],
      ['Remarks',     d.remarks || '—']
    ];
  } else if (r.type === 'IQC') {
    items = [
      ['IQC No.',     d.iqcNo    || r.docNo],
      ['GRN Ref',     d.grnRef],
      ['Date',        r.date],
      ['Supplier',    d.supplier || r.party],
      ['Material',    d.material || r.material],
      ['Batch No.',   d.batch    || r.batch],
      ['Inspector',   d.inspector || r.inspector],
      ['AQL Level',   d.aql],
      ['Sample Size', d.sampleSize],
      ['Disposition', statusBadge(d.disposition)],
      ['NCR Ref',     d.ncrRef   || '—'],
      ['Remarks',     d.remarks  || '—']
    ];

    // Qty chips
    var accQty = d.acceptedQty;
    var rejQty  = d.rejectedQty;
    if (accQty !== '' && accQty !== undefined && accQty !== null) {
      document.getElementById('qtyAccepted').textContent = '✔ Accepted: ' + accQty;
      document.getElementById('qtyRejected').textContent = '✖ Rejected: ' + (rejQty !== '' && rejQty !== undefined ? rejQty : '0');
      document.getElementById('qtyChips').style.display = 'block';
    }

    // Param grid
    if (d.params) {
      var pLabels = {
        qty:'Quantity', pkg:'Packaging', colour:'Colour', shape:'Shape/Form',
        dims:'Dimensions', weight:'Net Weight', clean:'Cleanliness',
        odour:'Odour', label:'Label', msds:'MSDS/SDS', shelf:'Shelf Life', coa:'COA'
      };
      var pg = document.getElementById('paramDetailGrid');
      pg.innerHTML = '';
      Object.keys(pLabels).forEach(function(k) {
        var v = d.params[k];
        if (v === '' || v === undefined || v === null) v = '—';
        var bg = v === 'PASS' ? '#DCFCE7' : v === 'FAIL' ? '#FEE2E2' : '#F3F4F6';
        var tc = v === 'PASS' ? '#15803D' : v === 'FAIL' ? '#B91C1C' : '#6B7280';
        pg.innerHTML += '<div style="background:' + bg + ';border-radius:6px;padding:6px 8px;">' +
          '<div style="font-size:10px;color:var(--muted);">' + pLabels[k] + '</div>' +
          '<div style="font-size:12px;font-weight:600;color:' + tc + ';">' + v + '</div></div>';
      });
      document.getElementById('paramDetail').style.display = 'block';
    }
  } else if (r.type === 'OQC') {
    var ch = d.checks || {};
    items = [
      ['OQC No.',       d.oqcNo     || r.docNo],
      ['Date',          r.date],
      ['Customer',      d.customer  || r.party],
      ['Batch / PO',    d.batchPO   || r.batch],
      ['Material',      d.material  || r.material],
      ['Inspector',     d.inspector || r.inspector],
      ['IPQC Reviewed', d.ipqcReviewed],
      ['Sample Size',   d.sampleSize],
      ['Fill Weight',   ch.fillWeight || '—'],
      ['Label',         ch.label      || '—'],
      ['Seal',          ch.seal       || '—'],
      ['Appearance',    ch.appearance || '—'],
      ['Cust Spec',     ch.custSpec   || '—'],
      ['Decision',      statusBadge(d.releaseDecision)],
      ['Remarks',       d.remarks     || '—']
    ];
  }

  var grid = document.getElementById('detailGrid');
  grid.innerHTML = items.map(function(item) {
    return '<div class="detail-item">' +
      '<div class="di-label">' + item[0] + '</div>' +
      '<div class="di-value">' + (item[1] !== undefined && item[1] !== null && item[1] !== '' ? item[1] : '—') + '</div></div>';
  }).join('');

  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('paramDetail').style.display = 'none';
  document.getElementById('qtyChips').style.display = 'none';
  if (selectedCardEl) selectedCardEl.classList.remove('selected');
  selectedCardEl = null;
  selectedRecord = null;
}

/* ── Helpers ── */
function statusBadge(s) {
  if (!s) s = 'PENDING';
  var su = s.toUpperCase();
  var cls = su === 'ACCEPTED' || su === 'RELEASED' ? 'pass' :
            su === 'REJECTED'                       ? 'fail' :
            su === 'HOLD'                           ? 'hold' :
            su.indexOf('DEVIATION') > -1            ? 'awd'  : 'pending';
  return '<span class="badge badge-' + cls + '">' + s + '</span>';
}

function openFullRecord() {
  if (!selectedRecord) return;
  // DocView expects 'Gatepass' not 'GP'
  var docType = selectedRecord.type === 'GP' ? 'Gatepass' : selectedRecord.type;
  var docNo   = selectedRecord.docNo;
  document.getElementById('detailPanel').innerHTML =
    '<div style="text-align:center;padding:24px;color:var(--muted);">Loading document…</div>';
  google.script.run
    .withSuccessHandler(function(html) {
      if (html) { document.open(); document.write(html); document.close(); }
    })
    .withFailureHandler(function(err) {
      showToast('Error: ' + (err && err.message ? err.message : String(err)), 'error');
    })
    .getDocViewHtml(docType, docNo);
}

function sendWADetail() {
  if (!selectedRecord) return;
  var rec = {
    type:            selectedRecord.type,
    docNo:           selectedRecord.docNo,
    date:            selectedRecord.date,
    grnNo:           selectedRecord.detail && selectedRecord.detail.grnRef,
    supplier:        selectedRecord.party,
    material:        selectedRecord.material,
    batch:           selectedRecord.batch,
    inspector:       selectedRecord.inspector,
    status:          selectedRecord.status,
    disposition:     selectedRecord.status,
    releaseDecision: selectedRecord.status,
    customer:        selectedRecord.party,
    batchPO:         selectedRecord.batch,
    ncrRef:          selectedRecord.detail && selectedRecord.detail.ncrRef
  };
  google.script.run
    .withSuccessHandler(function(url) { window.open(url, '_blank'); })
    .getWhatsAppURLForRecord(rec);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

// Call directly — document.write() context may not fire window.onload
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadData);
} else {
  loadData();
