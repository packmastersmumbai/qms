<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Dashboard - Pack Masters QMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <?!= include('HtmlCache') ?>
  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 60px;
    }

    /* ── Header override for dashboard layout ── */
    .pm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      min-height: 56px;
    }
    .hdr-left  { font-size: 15px; font-weight: 700; color: #fff; }
    .hdr-center { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.8); }
    .hdr-right { display: flex; align-items: center; }
    .role-chip {
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 12px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── Tab bar ── */
    .tab-bar {
      background: var(--navy-light);
      border-bottom: none;
      top: 56px;
      z-index: 99;
      height: 44px;
      display: flex;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      height: 44px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .tab-btn.active {
      background: var(--white);
      color: var(--navy);
      font-weight: 700;
      border-bottom: 3px solid var(--navy);
      border-radius: 4px 4px 0 0;
      margin-bottom: 0;
    }

    /* ── Filter bar ── */
    .filter-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      position: sticky;
      top: 100px;
      z-index: 98;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 100px;
    }
    .filter-group label {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .filter-group input[type="date"] {
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      background: var(--white);
      color: var(--text);
      width: 100%;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .filter-group input[type="date"]:focus {
      outline: none;
      border-color: var(--navy);
    }
    #fRangeChips {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }
    .range-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .range-chip.active {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    /* ── Summary grid ── */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px 12px;
    }
    @media (min-width: 900px) {
      .summary-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .sum-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      padding: 12px;
      border-left: 3px solid var(--border);
    }
    .sum-card .sc-lbl {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    @media (max-width: 599px) {
      .sum-card .sc-lbl { font-size: 10px; }
    }
    .sum-card .sc-num {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .sum-card.total   { border-left-color: var(--navy);    }
    .sum-card.total   .sc-num { color: var(--navy); }
    .sum-card.pass    { border-left-color: var(--success); }
    .sum-card.pass    .sc-num { color: var(--success); }
    .sum-card.fail    { border-left-color: var(--amber);   }
    .sum-card.fail    .sc-num { color: var(--danger); }
    .sum-card.pending { border-left-color: var(--amber);   }
    .sum-card.pending .sc-num { color: var(--amber); }

    /* Skeleton pulse */
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1;   }
    }
    .skel {
      background: var(--navy-light);
      border-radius: 4px;
      animation: skeleton-pulse 0.8s ease-in-out infinite;
    }
    .skel-card {
      background: var(--navy-light);
      border-radius: var(--radius);
      animation: skeleton-pulse 0.8s ease-in-out infinite;
      height: 72px;
    }

    /* ── Table section ── */
    .table-section {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      margin: 0 10px 10px;
      overflow: hidden;
    }
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table.rec-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 380px;
    }
    table.rec-table thead th {
      background: var(--navy-light);
      color: var(--navy);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 2px solid var(--border);
    }
    table.rec-table thead th.col-time   { width: 60px; }
    table.rec-table thead th.col-id     { width: 90px; }
    table.rec-table thead th.col-mid    { }
    table.rec-table thead th.col-result { width: 80px; }
    table.rec-table thead th.col-op     { width: 100px; }
    @media (max-width: 599px) {
      table.rec-table thead th.col-op,
      table.rec-table tbody td.col-op { display: none; }
    }
    table.rec-table tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    table.rec-table tbody tr:nth-child(even):not(.detail-row) { background: #FAFBFF; }
    table.rec-table tbody tr:hover:not(.detail-row)  { background: var(--navy-light); }
    table.rec-table tbody tr.row-fail   { background: #FEF2F2 !important; }
    table.rec-table tbody tr.row-pending { background: #FFFBEB !important; }
    table.rec-table tbody td {
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text);
      vertical-align: middle;
    }
    table.rec-table tbody td.col-time { color: var(--muted); font-size: 11px; }

    /* Result chip */
    .chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .chip-pass    { background: #DCFCE7; color: var(--success); }
    .chip-fail    { background: #FEE2E2; color: var(--danger);  }
    .chip-pending { background: #FEF3C7; color: var(--amber);   }
    .chip-hold    { background: #FEF3C7; color: var(--hold);    }
    .chip-open    { background: #DBEAFE; color: #1D4ED8;        }

    /* Detail row */
    tr.detail-row td {
      padding: 0;
      cursor: default;
    }
    tr.detail-row td > div {
      background: var(--navy-light);
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.2s ease, opacity 0.2s ease;
      opacity: 0;
    }
    tr.detail-row.open td > div {
      max-height: 500px;
      opacity: 1;
    }
    .detail-inner {
      padding: 12px;
    }
    .detail-close-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .btn-detail-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      font-family: inherit;
      padding: 2px 6px;
    }
    .detail-fields {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
    }
    .detail-fields .df-lbl {
      font-size: 10px;
      font-weight: 600;
      color: var(--navy);
      text-transform: uppercase;
      white-space: nowrap;
      padding: 3px 0;
    }
    .detail-fields .df-val {
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
      padding: 3px 0;
      word-break: break-word;
    }

    /* Skeleton rows */
    .skel-row td { padding: 10px 12px; }
    .skel-row td .skel-bar {
      height: 14px;
      border-radius: 4px;
      background: var(--navy-light);
      animation: skeleton-pulse 0.8s ease-in-out infinite;
    }

    /* Empty + error state */
    .empty-row td {
      text-align: center;
      padding: 24px 12px;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      height: 40px;
      cursor: default;
    }

    /* Toast */
    .toast { cursor: pointer; }

    /* Loading overlay */
    .table-loading { opacity: 0.6; pointer-events: none; transition: opacity 0.15s; }
    .table-loaded  { opacity: 1;   transition: opacity 0.2s ease; }
  </style>
</head>
<body class="pm-wide">
<div class="pm-page-wrap">

<!-- Header -->
<div class="pm-header">
  <span class="hdr-left">Pack Masters</span>
  <span class="hdr-center">Dashboard</span>
  <div class="hdr-right">
    <span class="role-chip" id="roleChip"></span>
  </div>
</div>

<!-- Tab bar -->
<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-module="GRN">GRN</button>
  <button class="tab-btn" data-module="IQC">IQC</button>
  <button class="tab-btn" data-module="IPQC">IPQC</button>
  <button class="tab-btn" data-module="OQC">OQC</button>
  <button class="tab-btn" data-module="GP">Gatepass</button>
</div>

<!-- Filter bar -->
<div class="filter-bar">
  <div id="fRangeChips">
    <button class="range-chip active" data-range="TODAY">Today</button>
    <button class="range-chip" data-range="WEEK">Week</button>
    <button class="range-chip" data-range="MONTH">Month</button>
    <button class="range-chip" data-range="ALL">All</button>
  </div>
</div>

<!-- Summary cards -->
<div class="summary-grid" id="sumGrid">
  <div class="skel-card"></div>
  <div class="skel-card"></div>
  <div class="skel-card"></div>
  <div class="skel-card"></div>
</div>

<!-- Records table -->
<div class="table-section" id="tableSection">
  <div class="table-wrap">
    <table class="rec-table" id="recTable">
      <thead id="recThead">
        <tr>
          <th class="col-time">Time</th>
          <th class="col-id">GRN ID</th>
          <th class="col-mid">Item</th>
          <th class="col-result">Disposition</th>
          <th class="col-op">Operator</th>
        </tr>
      </thead>
      <tbody id="recTbody">
        <tr class="skel-row"><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td class="col-op"><div class="skel-bar"></div></td></tr>
        <tr class="skel-row"><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td class="col-op"><div class="skel-bar"></div></td></tr>
        <tr class="skel-row"><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td class="col-op"><div class="skel-bar"></div></td></tr>
        <tr class="skel-row"><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td class="col-op"><div class="skel-bar"></div></td></tr>
        <tr class="skel-row"><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td><div class="skel-bar"></div></td><td class="col-op"><div class="skel-bar"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────
var activeModule = 'GRN';
var activeRange  = 'TODAY';
var currentRows  = [];
var openDetailIdx = -1;   // index into currentRows of the open detail row
var loading = false;

// ── Init ───────────────────────────────────────────────────────────
pmReady(function() {
  // Role chip
  var roleEl = document.getElementById('roleChip');
  if (roleEl) roleEl.style.display = 'none';

  // Tab events
  document.getElementById('tabBar').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn || btn.classList.contains('active')) return;
    switchModule(btn.dataset.module, btn);
  });

  // Range chip events
  document.getElementById('fRangeChips').addEventListener('click', function(e) {
    var chip = e.target.closest('.range-chip');
    if (!chip || chip.classList.contains('active')) return;
    document.querySelectorAll('.range-chip').forEach(function(c) { c.classList.remove('active'); });
    chip.classList.add('active');
    activeRange = chip.dataset.range;
    loadData();
  });

  // Toast retry
  document.getElementById('toast').addEventListener('click', function() {
    if (this.dataset.retry === '1') loadData();
  });

  loadData();
});

// ── Module switch ──────────────────────────────────────────────────
function switchModule(mod, btn) {
  activeModule = mod;
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  openDetailIdx = -1;
  renderTableHead();
  loadData();
}

// ── Load data ──────────────────────────────────────────────────────
function loadData() {
  if (loading) return;
  loading = true;

  var section = document.getElementById('tableSection');
  section.classList.add('table-loading');
  renderSkeletonCards();

  var filter = { type: activeModule, range: activeRange };

  google.script.run
    .withSuccessHandler(function(data) {
      loading = false;
      section.classList.remove('table-loading');
      section.classList.add('table-loaded');
      setTimeout(function() { section.classList.remove('table-loaded'); }, 300);

      if (!data || data.rows === null || data.rows === undefined) {
        var msg = (data && data.error) ? data.error : 'No data returned from server.';
        renderSummaryCards({ total: 0, pass: 0, fail: 0, hold: 0, pending: 0 });
        renderEmpty(msg);
        showToast('Error: ' + msg, 'error', true);
        return;
      }

      currentRows = data.rows || [];
      openDetailIdx = -1;
      renderSummaryCards(data.counts || buildCounts(currentRows));
      renderTableHead();
      renderRows(currentRows);
    })
    .withFailureHandler(function(err) {
      loading = false;
      section.classList.remove('table-loading');
      var msg = (err && err.message) ? err.message : String(err);
      renderSummaryCards({ total: 0, pass: 0, fail: 0, hold: 0, pending: 0 });
      renderEmpty('Failed to load. Tap the error banner to retry.');
      showToast('Load error: ' + msg, 'error', true);
    })
    .getDashboardData(filter);
}

// ── Counts ─────────────────────────────────────────────────────────
function buildCounts(rows) {
  var c = { total: rows.length, pass: 0, fail: 0, hold: 0, pending: 0 };
  rows.forEach(function(r) {
    var s = (r.status || '').toUpperCase();
    if (s === 'ACCEPTED' || s === 'RELEASED' || s === 'ISSUED' || s === 'CLOSED') c.pass++;
    else if (s === 'REJECTED') c.fail++;
    else if (s === 'HOLD')     c.hold++;
    else                       c.pending++;
  });
  return c;
}

// ── Skeleton cards ─────────────────────────────────────────────────
function renderSkeletonCards() {
  var g = document.getElementById('sumGrid');
  g.innerHTML =
    '<div class="skel-card"></div>' +
    '<div class="skel-card"></div>' +
    '<div class="skel-card"></div>' +
    '<div class="skel-card"></div>';
}

// ── Summary cards ──────────────────────────────────────────────────
function renderSummaryCards(c) {
  if (!c) c = { total: 0, pass: 0, fail: 0, hold: 0, pending: 0 };
  document.getElementById('sumGrid').innerHTML =
    card('total',   'TOTAL',   c.total) +
    card('pass',    'PASS',    c.pass)  +
    card('fail',    'FAIL',    c.fail)  +
    card('pending', 'PENDING', (c.pending || 0) + (c.hold || 0));
}
function card(cls, lbl, val) {
  return '<div class="sum-card ' + cls + '">' +
    '<div class="sc-lbl">' + lbl + '</div>' +
    '<div class="sc-num">' + (val !== undefined ? val : '—') + '</div>' +
    '</div>';
}

// ── Table head per module ──────────────────────────────────────────
var MODULE_COLS = {
  GRN:  ['Time', 'GRN ID',  'Item',    'Disposition', 'Operator'],
  IQC:  ['Time', 'IQC ID',  'GRN Ref', 'Result',      'Operator'],
  IPQC: ['Time', 'IPQC ID', 'Line',    'Result',      'Operator'],
  OQC:  ['Time', 'OQC ID',  'Batch',   'Result',      'Operator'],
  GP:   ['Time', 'GP ID',   'Party',   'Status',      'Operator']
};

function renderTableHead() {
  var cols = MODULE_COLS[activeModule] || MODULE_COLS['GRN'];
  var th = document.getElementById('recThead');
  th.innerHTML = '<tr>' +
    '<th class="col-time">'   + esc(cols[0]) + '</th>' +
    '<th class="col-id">'     + esc(cols[1]) + '</th>' +
    '<th class="col-mid">'    + esc(cols[2]) + '</th>' +
    '<th class="col-result">' + esc(cols[3]) + '</th>' +
    '<th class="col-op">'     + esc(cols[4]) + '</th>' +
    '</tr>';
}

// ── Row renderer ───────────────────────────────────────────────────
function renderRows(rows) {
  var tbody = document.getElementById('recTbody');
  if (!rows || rows.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No records found for this filter.</td></tr>';
    return;
  }

  var html = '';
  rows.forEach(function(r, i) {
    var time    = extractTime(r.date, r.rawDate);
    var mid     = getMidCell(r);
    var chipHtml = statusChip(r.status);
    var rowCls  = getRowClass(r.status);

    html +=
      '<tr class="data-row ' + rowCls + '" data-idx="' + i + '">' +
        '<td class="col-time">' + esc(time) + '</td>' +
        '<td class="col-id">'   + esc(r.docNo || '') + '</td>' +
        '<td class="col-mid">'  + esc(mid) + '</td>' +
        '<td class="col-result">' + chipHtml + '</td>' +
        '<td class="col-op">'   + esc(r.inspector || '') + '</td>' +
      '</tr>' +
      '<tr class="detail-row" id="dr-' + i + '">' +
        '<td colspan="5"><div id="dp-' + i + '"></div></td>' +
      '</tr>';
  });

  tbody.innerHTML = html;

  if (!tbody._tapsAttached) {
    tbody._tapsAttached = true;
    tbody.addEventListener('click', function(e) {
      var row = e.target.closest('tr.data-row');
      if (!row) return;
      var idx = parseInt(row.dataset.idx, 10);
      toggleDetail(idx);
    });
  }
}

function renderEmpty(msg) {
  var tbody = document.getElementById('recTbody');
  tbody.innerHTML = '<tr class="empty-row"><td colspan="5">' + esc(msg) + '</td></tr>';
}

function renderSkeleton() {
  var tbody = document.getElementById('recTbody');
  var html = '';
  for (var i = 0; i < 5; i++) {
    html += '<tr class="skel-row">' +
      '<td><div class="skel-bar"></div></td>' +
      '<td><div class="skel-bar"></div></td>' +
      '<td><div class="skel-bar"></div></td>' +
      '<td><div class="skel-bar"></div></td>' +
      '<td class="col-op"><div class="skel-bar"></div></td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
}

// ── Mid-column value per module ────────────────────────────────────
function getMidCell(r) {
  switch (r.type) {
    case 'GRN':  return r.material || r.party || '';
    case 'IQC':  return (r.detail && r.detail.grnRef) ? r.detail.grnRef : (r.material || '');
    case 'IPQC': return (r.detail && r.detail.line) ? r.detail.line : (r.material || '');
    case 'OQC':  return r.batch || r.material || '';
    case 'GP':   return r.party || r.material || '';
    default:     return r.material || r.party || '';
  }
}

// ── Time extraction ────────────────────────────────────────────────
function extractTime(dateStr, rawDate) {
  if (rawDate) {
    var d = new Date(rawDate);
    if (!isNaN(d)) {
      var h = d.getHours(), m = d.getMinutes();
      return pad2(h) + ':' + pad2(m);
    }
  }
  return '';
}
function pad2(n) { return n < 10 ? '0' + n : String(n); }

// ── Row class ──────────────────────────────────────────────────────
function getRowClass(status) {
  var s = (status || '').toUpperCase();
  if (s === 'REJECTED' || s === 'FAIL') return 'row-fail';
  if (s === 'PENDING' || s === 'OPEN' || !s) return 'row-pending';
  return '';
}

// ── Status chip ────────────────────────────────────────────────────
function statusChip(status) {
  if (!status) status = 'PENDING';
  var s  = status.toUpperCase();
  var cls, label;
  if (s === 'ACCEPTED' || s === 'RELEASED' || s === 'CLOSED') {
    cls = 'chip-pass'; label = s === 'CLOSED' ? 'CLOSED' : s === 'RELEASED' ? 'PASS' : 'PASS';
  } else if (s === 'REJECTED') {
    cls = 'chip-fail'; label = 'FAIL';
  } else if (s === 'HOLD') {
    cls = 'chip-hold'; label = 'HOLD';
  } else if (s === 'ISSUED' || s === 'OPEN') {
    cls = 'chip-open'; label = s;
  } else {
    cls = 'chip-pending'; label = 'PENDING';
  }
  return '<span class="chip ' + cls + '">' + esc(label) + '</span>';
}

// ── Inline detail panel ────────────────────────────────────────────
function toggleDetail(idx) {
  if (openDetailIdx === idx) {
    closeDetail(idx);
    openDetailIdx = -1;
    return;
  }
  if (openDetailIdx >= 0) closeDetail(openDetailIdx);
  openDetailIdx = idx;
  openDetail(idx);
}

function openDetail(idx) {
  var row = currentRows[idx];
  if (!row) return;
  var dp  = document.getElementById('dp-' + idx);
  var dr  = document.getElementById('dr-' + idx);
  if (!dp || !dr) return;

  var fields = buildDetailFields(row);
  var fieldsHtml = '';
  fields.forEach(function(f) {
    fieldsHtml +=
      '<div class="df-lbl">' + esc(f[0]) + '</div>' +
      '<div class="df-val">' + esc(f[1]) + '</div>';
  });

  dp.innerHTML =
    '<div class="detail-inner">' +
      '<div class="detail-close-row">' +
        '<button class="btn-detail-close" onclick="closeDetail(' + idx + ');openDetailIdx=-1;">Close ×</button>' +
      '</div>' +
      '<div class="detail-fields">' + fieldsHtml + '</div>' +
    '</div>';

  dr.classList.add('open');
  dr.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetail(idx) {
  var dr = document.getElementById('dr-' + idx);
  if (dr) dr.classList.remove('open');
}

// ── Build detail fields per row type ──────────────────────────────
function buildDetailFields(r) {
  var d = r.detail || {};
  var out = [];
  function add(lbl, val) {
    out.push([lbl, (val !== undefined && val !== null && val !== '') ? String(val) : '—']);
  }

  if (r.type === 'GRN') {
    add('GRN No.',      d.grnNo      || r.docNo);
    add('Date',         r.date);
    add('Supplier',     d.supplier   || r.party);
    add('PO Ref',       d.poRef);
    add('Invoice No.',  d.invoiceNo);
    add('Material',     d.material   || r.material);
    add('Batch',        d.batch      || r.batch);
    add('Qty Ordered',  d.qtyOrdered);
    add('Qty Received', d.qtyReceived);
    add('COA',          d.coa);
    add('Expiry',       d.expiry);
    add('IQC Status',   d.iqcStatus  || r.status);
    add('Remarks',      d.remarks);
  } else if (r.type === 'IQC') {
    add('IQC No.',      d.iqcNo      || r.docNo);
    add('GRN Ref',      d.grnRef);
    add('Date',         r.date);
    add('Supplier',     d.supplier   || r.party);
    add('Material',     d.material   || r.material);
    add('Batch',        d.batch      || r.batch);
    add('Inspector',    d.inspector  || r.inspector);
    add('AQL',          d.aql);
    add('Sample Size',  d.sampleSize);
    add('Disposition',  d.disposition || r.status);
    add('Accepted Qty', d.acceptedQty);
    add('Rejected Qty', d.rejectedQty);
    add('NCR Ref',      d.ncrRef);
    add('Remarks',      d.remarks);
  } else if (r.type === 'IPQC') {
    add('Session',      d.sessionId  || r.docNo);
    add('Date',         r.date);
    add('Product',      d.productName || r.material);
    add('Product Code', d.productCode);
    add('Batch',        d.batch      || r.batch);
    add('Inspector',    d.inspector  || r.inspector);
    add('Line',         d.line);
    add('Rounds',       d.rounds);
    add('Start Time',   d.startTime);
    add('End Time',     d.endTime);
    add('Status',       d.status     || r.status);
  } else if (r.type === 'OQC') {
    add('OQC No.',      d.oqcNo      || r.docNo);
    add('Date',         r.date);
    add('Customer',     d.customer   || r.party);
    add('Batch / PO',   d.batchPO    || r.batch);
    add('Material',     d.material   || r.material);
    add('Inspector',    d.inspector  || r.inspector);
    add('Sample Size',  d.sampleSize);
    add('IPQC Reviewed',d.ipqcReviewed);
    add('Decision',     d.releaseDecision || r.status);
    add('IPQC Ref',     d.ipqcSessionRef);
    add('Remarks',      d.remarks);
  } else if (r.type === 'GP') {
    add('Gatepass No.', d.gpNo       || r.docNo);
    add('Date',         r.date);
    add('Dispatch Type',d.dispatchType);
    add('OQC Ref',      d.oqcRef);
    add('Party',        d.party      || r.party);
    add('Material Code',d.materialCode);
    add('Material',     d.materialDesc || r.material);
    add('Qty',          d.qty);
    add('Unit',         d.unit);
    add('Vehicle No.',  d.vehicleNo);
    add('Driver',       d.driverName);
    add('Transporter',  d.transporter);
    add('Authorized By',d.authorizedBy);
    add('Security',     d.securityGuard);
    add('Dispatch Zone',d.dispatchZone);
    add('Status',       d.status     || r.status);
    add('Remarks',      d.remarks);
  } else {
    add('Doc No.',  r.docNo);
    add('Date',     r.date);
    add('Status',   r.status);
    add('Inspector',r.inspector);
  }
  return out;
}

// ── Toast ──────────────────────────────────────────────────────────
function showToast(msg, type, retryable) {
  var t = document.getElementById('toast');
  t.textContent = retryable ? msg + ' Tap to retry.' : msg;
  t.dataset.retry = retryable ? '1' : '0';
  t.className = 'toast show' + (type ? ' ' + type : '');
  if (!retryable) {
    setTimeout(function() { t.className = 'toast'; }, 3500);
  }
}

// ── Error state ────────────────────────────────────────────────────
function showError(msg) {
  renderSummaryCards({ total: 0, pass: 0, fail: 0, hold: 0, pending: 0 });
  renderEmpty(msg);
  showToast(msg, 'error', false);
}

// ── XSS escape ─────────────────────────────────────────────────────
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#39;');
}
