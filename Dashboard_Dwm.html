<style>
.dh {
  position: sticky; top: 0; z-index: 100;
  background: var(--navy); color: #fff;
  height: 52px; padding: 0 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.dh-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dh-name {
  font-size: 14px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;
}
.dh-role {
  font-size: 10px; font-weight: 700;
  background: var(--amber); color: var(--navy);
  padding: 2px 7px; border-radius: 9999px; flex-shrink: 0;
}
.dh-actions { display: flex; gap: 4px; flex-shrink: 0; }
.dh-actions button {
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  width: 36px; height: 36px; border-radius: 8px; font-size: 16px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background 0.15s;
}
.dh-actions button:hover { background: rgba(255,255,255,0.25); }

/* ── 4-Tab bar ── */
.tab-bar {
  display: flex; background: #fff;
  border-bottom: 2px solid var(--border);
  position: sticky; top: 52px; z-index: 90;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 1; min-width: 72px; text-align: center; padding: 10px 4px 8px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  background: transparent; color: var(--muted);
  border: none; border-bottom: 3px solid transparent;
  margin-bottom: -2px; transition: all 0.15s;
  font-family: inherit; white-space: nowrap;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.tab-btn.active { color: var(--navy); border-bottom-color: var(--amber); }
.tab-count {
  display: inline-block; padding: 1px 5px; border-radius: 10px;
  font-size: 10px; font-weight: 600; margin-left: 3px;
  background: var(--navy-light); color: var(--navy);
}
.tab-btn.active .tab-count { background: #FFF3CD; color: #92600A; }

/* ── Filter chips (inline below tab bar) ── */
.filter-row {
  display: flex; gap: 6px; padding: 7px 12px;
  background: #fff; border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  position: sticky; top: 94px; z-index: 89;
}
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 4px 11px; border-radius: 20px;
  font-size: 11px; font-weight: 600; cursor: pointer;
  border: 1.5px solid var(--border); background: #fff; color: var(--muted);
  font-family: inherit; transition: all 0.15s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.chip.overdue.active { background: var(--danger); border-color: var(--danger); }
.df-custom {
  border: 1.5px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 11px; font-family: inherit;
  color: var(--text); background: #fff; outline: none; display: none;
}
.df-custom.visible { display: block; }
.df-custom:focus { border-color: var(--navy); }

/* ── Category group header ── */
.grp-header {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--navy-light); padding: 6px 12px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  color: var(--navy); letter-spacing: 0.5px; cursor: pointer;
  border-bottom: 1px solid var(--border); user-select: none;
}
.grp-header .grp-toggle { font-size: 10px; opacity: 0.6; }
.grp-body { overflow: hidden; transition: max-height 0.2s ease; }
.grp-body.collapsed { max-height: 0 !important; }

/* ── Task row ── */
.task-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  background: #fff; cursor: pointer; min-height: 0;
  transition: background 0.1s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.task-row:active { background: #F0F4FF; }
.task-row.done-row { opacity: 0.7; }

/* Priority dot */
.prio-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.dot-high   { background: var(--danger); }
.dot-medium { background: var(--amber); }
.dot-low    { background: #D1D5DB; }

/* Row title */
.row-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex-shrink: 1; min-width: 0; flex: 1;
}
.row-title.done-text { text-decoration: line-through; color: var(--muted); }

/* Row meta group */
.row-meta {
  display: flex; align-items: center; gap: 4px; flex-shrink: 0;
  overflow: hidden;
}
.mc {
  display: inline-block; font-size: 10px; font-weight: 500;
  padding: 2px 5px; border-radius: 4px; white-space: nowrap;
}
.mc-proj     { background: var(--navy-light); color: var(--navy); }
.mc-cat      { background: #F3F4F6; color: var(--muted); }
.mc-assignee { background: #F0FDF4; color: #166534; }
.mc-due-over { background: #FEE2E2; color: #991B1B; font-weight: 600; }
.mc-due-today{ background: #FEF3C7; color: #92400E; font-weight: 600; }
.mc-elapsed  { font-size: 10px; font-weight: 700; color: var(--danger); font-variant-numeric: tabular-nums; }

/* ── Loading / empty ── */
.ld-center {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px; gap: 12px; color: var(--muted);
}
.ld-spin {
  width: 32px; height: 32px; border: 3px solid #E5E7EB;
  border-top-color: var(--navy); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* ── Pagination ── */
.pagination {
  display: flex; justify-content: center; align-items: center;
  gap: 10px; padding: 14px 12px;
}
.pg-btn {
  padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
  border: 1.5px solid var(--border); background: #fff; color: var(--text);
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.pg-btn:hover { background: var(--navy-light); border-color: var(--navy); color: var(--navy); }
.pg-btn:disabled { opacity: 0.4; cursor: default; }
.pg-info { font-size: 12px; color: var(--muted); font-weight: 500; }

/* ── FAB ── */
.fab {
  position: fixed;
  right: max(16px, calc(50% - 214px + 16px));
  bottom: 20px;
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--navy); color: #fff;
  border: none; font-size: 24px;
  box-shadow: 0 4px 12px rgba(13,27,110,0.35);
  cursor: pointer; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.fab:active { transform: scale(0.94); }

@keyframes flash-ok {
  0% { background: #D1FAE5; }
  100% { background: #fff; }
}
.flash-ok { animation: flash-ok 0.6s ease; }

/* ── Timer buttons ── */
.timer-btn {
  flex-shrink: 0;
  width: 36px; height: 36px; border-radius: 50%;
  border: none; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; transition: all 0.15s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.play-btn { background: var(--navy-light); color: var(--navy); }
.play-btn:active { background: var(--navy); color: #fff; transform: scale(0.93); }
.stop-btn { background: #FEE2E2; color: var(--danger); }
.stop-btn:active { transform: scale(0.93); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="dh">
  <div class="dh-left">
    <span class="dh-name" id="dName">…</span>
    <span class="dh-role" id="dRole"></span>
  </div>
  <div class="dh-actions">
    <button id="adminBtn" style="display:none" title="Admin" id="adminBtn">⚙</button>
    <button id="refreshBtn" title="Refresh">↻</button>
    <button id="logoutBtn" title="Logout">⏻</button>
  </div>
</div>

<!-- 4-TAB BAR -->
<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-tab="active">Active <span class="tab-count" id="tc-active">0</span></button>
  <button class="tab-btn" data-tab="open">Open <span class="tab-count" id="tc-open">0</span></button>

<div class="filter-row" id="dateRow" style="display:none">
  <button class="chip active" data-df="today">Today</button>
  <button class="chip" data-df="week">This Week</button>
  <button class="chip" data-df="custom">Custom</button>
  <input class="df-custom" id="customDate" type="date">
</div>

<!-- BOARD -->
<div id="board">
  <div class="ld-center"><div class="ld-spin"></div><span>Loading…</span></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn">+</button>

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
var S = {
  me: {}, projects: [], categories: [],
  shared: [], own: [],
  activeTimer: null,
  tab: 'active',
  filter: 'all',
  dateFilter: 'today',
  customDate: '',
  page: 1,
  pageSize: 50,
  collapsed: {}   // grpKey → true
};

var tickInterval = null;
var PRIO_ORDER = { high: 0, medium: 1, low: 2 };

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
window.addEventListener('load', function () {
  if (!dwmGetSession()) { dwmGoto('login'); return; }

  var n = localStorage.getItem('dwmUserName');
  var r = localStorage.getItem('dwmUserRole');
  if (n) document.getElementById('dName').textContent = n;
  if (r) { document.getElementById('dRole').textContent = r; setAdminBtn(r); }

  document.getElementById('tabBar').addEventListener('click', onTabClick);
  document.getElementById('filterRow').addEventListener('click', onFilterClick);
  document.getElementById('dateRow').addEventListener('click', onDateChipClick);
  document.getElementById('customDate').addEventListener('change', onCustomDate);
  document.getElementById('refreshBtn').addEventListener('click', loadFull);
  document.getElementById('logoutBtn').addEventListener('click', onLogout);
  document.getElementById('adminBtn').addEventListener('click', function () { dwmGoto('admin'); });
  document.getElementById('fabBtn').addEventListener('click', newTask);
  document.getElementById('board').addEventListener('click', onBoardClick);

  loadFull();
});

// ═══════════════════════════════════════════════
// DATA LOAD
// ═══════════════════════════════════════════════
function loadFull() {
  var sid = dwmGetSession();
  if (!sid) { dwmGoto('login'); return; }
  var btn = document.getElementById('refreshBtn');
  btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none';
  document.getElementById('board').innerHTML =
    '<div class="ld-center"><div class="ld-spin"></div><span>Loading…</span></div>';

  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(function (e) {
      btn.style.opacity = ''; btn.style.pointerEvents = '';
      dwmShowToast('Connection error', 'error');
      console.error(e);
    })
    .getDashboardFull(sid);
}

function onData(d) {
  var btn = document.getElementById('refreshBtn');
  btn.style.opacity = ''; btn.style.pointerEvents = '';

  if (d.status !== 'success') {
    if (d.message && d.message.indexOf('Session expired') >= 0) {
      dwmSetSession(''); dwmGoto('login'); return;
    }
    dwmShowToast(d.message || 'Error loading data', 'error');
    document.getElementById('board').innerHTML =
      '<div class="ld-center"><span>' + esc(d.message || 'Error') + '</span></div>';
    return;
  }

  S.me         = d.me         || {};
  S.projects   = d.projects   || [];
  S.categories = d.categories || [];
  S.shared     = d.shared     || [];
  S.own        = d.own        || [];
  S.activeTimer = d.activeTimer || null;

  if (S.me.name) {
    document.getElementById('dName').textContent = S.me.name;
    document.getElementById('dRole').textContent = S.me.role || '';
    localStorage.setItem('dwmUserName', S.me.name);
    localStorage.setItem('dwmUserRole', S.me.role || '');
    setAdminBtn(S.me.role);
  }

  S.page = 1;
  updateCounts();
  renderBoard();
}

// ═══════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════
function onTabClick(e) {
  var btn = e.target.closest('.tab-btn');
  if (!btn) return;
  var tab = btn.dataset.tab;
  if (!tab || tab === S.tab) return;
  S.tab = tab;
  S.page = 1;
  document.querySelectorAll('.tab-btn').forEach(function (el) {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  var showFilter = (tab === 'active' || tab === 'open');
  var showDate   = (tab === 'done');
  document.getElementById('filterRow').style.display = showFilter ? '' : 'none';
  document.getElementById('dateRow').style.display   = showDate   ? '' : 'none';
  renderBoard();
}

function onFilterClick(e) {
  var btn = e.target.closest('.chip');
  if (!btn || !btn.dataset.filter) return;
  S.filter = btn.dataset.filter;
  S.page = 1;
  document.querySelectorAll('#filterRow .chip').forEach(function (el) {
    el.classList.toggle('active', el.dataset.filter === S.filter);
  });
  renderBoard();
}

function onDateChipClick(e) {
  var btn = e.target.closest('.chip');
  if (!btn || !btn.dataset.df) return;
  S.dateFilter = btn.dataset.df;
  S.page = 1;
  document.querySelectorAll('#dateRow .chip').forEach(function (el) {
    el.classList.toggle('active', el.dataset.df === S.dateFilter);
  });
  var ci = document.getElementById('customDate');
  ci.classList.toggle('visible', S.dateFilter === 'custom');
  if (S.dateFilter !== 'custom') renderBoard();
}

function onCustomDate(e) {
  S.customDate = e.target.value;
  S.page = 1;
  if (S.customDate) renderBoard();
}

function onBoardClick(e) {
  // Group header collapse toggle
  var grp = e.target.closest('.grp-header');
  if (grp) {
    var key = grp.dataset.grp;
    S.collapsed[key] = !S.collapsed[key];
    var body = document.querySelector('.grp-body[data-grp="' + key + '"]');
    if (body) body.classList.toggle('collapsed', !!S.collapsed[key]);
    var tog = grp.querySelector('.grp-toggle');
    if (tog) tog.textContent = S.collapsed[key] ? '▶' : '▼';
    return;
  }
  // Timer button tap (play/stop) — must check before row tap
  var timerBtn = e.target.closest('.timer-btn');
  if (timerBtn) {
    e.stopPropagation();
    var action = timerBtn.dataset.action;
    var tid = timerBtn.dataset.taskId;
    if (action === 'play') onPlayTap(tid);
    else if (action === 'stop') onStopTap(tid);
    return;
  }

  // Task row tap → open edit
  var row = e.target.closest('.task-row');
  if (row && row.dataset.taskId) editTask(row.dataset.taskId);
}

// ═══════════════════════════════════════════════
// COUNTS
// ═══════════════════════════════════════════════
function updateCounts() {
  var all = allTasks();
  document.getElementById('tc-active').textContent  = all.filter(function (t) { return t.status === 'in_progress'; }).length;
  document.getElementById('tc-open').textContent    = all.filter(function (t) { return t.status === 'open'; }).length;
  document.getElementById('tc-done').textContent    = all.filter(function (t) { return t.status === 'done'; }).length;
  document.getElementById('tc-blocked').textContent = all.filter(function (t) { return t.status === 'not_done'; }).length;
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function renderBoard() {
  stopTick();
  var tab = S.tab;
  var all = allTasks();
  var tasks;

  if (tab === 'active')  tasks = all.filter(function (t) { return t.status === 'in_progress'; });
  else if (tab === 'open')    tasks = all.filter(function (t) { return t.status === 'open'; });
  else if (tab === 'done')    tasks = all.filter(function (t) { return t.status === 'done'; });
  else                        tasks = all.filter(function (t) { return t.status === 'not_done'; });

  // Chip filter for active/open
  if (tab === 'active' || tab === 'open') {
    if (S.filter === 'mine') {
      tasks = tasks.filter(function (t) { return t.assignedTo === S.me.userId; });
    } else if (S.filter === 'overdue') {
      var today = todayStr();
      tasks = tasks.filter(function (t) { return t.dueDate && t.dueDate < today; });
    }
  }

  // Date filter for done
  if (tab === 'done') {
    var td = todayStr();
    if (S.dateFilter === 'today') {
      tasks = tasks.filter(function (t) { return (t.updatedAt || '').substring(0, 10) === td; });
    } else if (S.dateFilter === 'week') {
      var wa = weekAgoStr();
      tasks = tasks.filter(function (t) {
        var d = (t.updatedAt || '').substring(0, 10);
        return d >= wa && d <= td;
      });
    } else if (S.dateFilter === 'custom' && S.customDate) {
      tasks = tasks.filter(function (t) {
        return (t.updatedAt || '').substring(0, 10) === S.customDate;
      });
    }
  }

  // Sort
  tasks.sort(function (a, b) {
    if (tab === 'done') return (b.updatedAt || '') > (a.updatedAt || '') ? 1 : -1;
    return (PRIO_ORDER[a.priority] || 1) - (PRIO_ORDER[b.priority] || 1);
  });

  if (!tasks.length) {
    document.getElementById('board').innerHTML = emptyHtml(tab);
    return;
  }

  // Pagination for done
  var html = '';
  if (tab === 'done') {
    var total  = tasks.length;
    var pages  = Math.ceil(total / S.pageSize);
    var start  = (S.page - 1) * S.pageSize;
    var slice  = tasks.slice(start, start + S.pageSize);
    // Group by date for done tab
    html = renderGrouped(slice, function (t) { return (t.updatedAt || '').substring(0, 10) || 'Unknown'; }, true);
    if (pages > 1) {
      html += '<div class="pagination">';
      html += '<button class="pg-btn" data-pg="-1"' + (S.page <= 1 ? ' disabled' : '') + '>← Prev</button>';
      html += '<span class="pg-info">Page ' + S.page + ' / ' + pages + ' (' + total + ')</span>';
      html += '<button class="pg-btn" data-pg="1"' + (S.page >= pages ? ' disabled' : '') + '>Next →</button>';
      html += '</div>';
    }
  } else {
    // Group by category
    html = renderGrouped(tasks, function (t) { return cname(t.categoryId) || 'Uncategorised'; }, tab === 'done');
  }

  document.getElementById('board').innerHTML = html;

  // Restore collapse state
  Object.keys(S.collapsed).forEach(function (key) {
    if (!S.collapsed[key]) return;
    var body = document.querySelector('.grp-body[data-grp="' + key + '"]');
    var hdr  = document.querySelector('.grp-header[data-grp="' + key + '"]');
    if (body) body.classList.add('collapsed');
    if (hdr) { var tog = hdr.querySelector('.grp-toggle'); if (tog) tog.textContent = '▶'; }
  });

  // Pagination click
  document.querySelectorAll('.pg-btn[data-pg]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      S.page += parseInt(btn.dataset.pg, 10);
      renderBoard();
      window.scrollTo(0, 0);
    });
  });

  if (tab === 'active') startTick();
}

function renderGrouped(tasks, keyFn, isDone) {
  var groups = {};
  var order  = [];
  tasks.forEach(function (t) {
    var k = keyFn(t);
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(t);
  });

  var html = '';
  order.forEach(function (key) {
    var rows = groups[key];
    var collapsed = !!S.collapsed[key];
    html += '<div class="grp-header" data-grp="' + esc(key) + '">';
    html += esc(key) + ' <span style="opacity:0.5;font-size:10px;font-weight:500">(' + rows.length + ')</span>';
    html += '<span class="grp-toggle">' + (collapsed ? '▶' : '▼') + '</span></div>';
    html += '<div class="grp-body' + (collapsed ? ' collapsed' : '') + '" data-grp="' + esc(key) + '" style="max-height:9999px">';
    rows.forEach(function (t) { html += rowHtml(t, isDone); });
    html += '</div>';
  });
  return html;
}

function emptyHtml(tab) {
  var msgs = { active: 'No active tasks', open: 'No open tasks', done: 'No completed tasks', blocked: 'No blocked tasks' };
  var icons = { active: '▶', open: '○', done: '✓', blocked: '✕' };
  return '<div class="ld-center"><span style="font-size:32px;margin-bottom:4px">' + (icons[tab] || '○') + '</span>' +
         '<span>' + (msgs[tab] || 'No tasks') + '</span></div>';
}

// ═══════════════════════════════════════════════
// ROW HTML
// ═══════════════════════════════════════════════
function rowHtml(t, isDone) {
  var prio = t.priority || 'medium';
  var dotCls = 'dot-' + prio;
  var titleCls = 'row-title' + (isDone ? ' done-text' : '');
  var proj = pname(t.projectId);
  var cat  = cname(t.categoryId);

  var assigneeName = '';
  if (t.assignedTo && t.assignedTo !== S.me.userId) assigneeName = t.assignedTo;

  var today = todayStr();
  var dueMc = '';
  if (t.dueDate && !isDone) {
    if (t.dueDate < today) dueMc = '<span class="mc mc-due-over">⚠ ' + esc(t.dueDate) + '</span>';
    else if (t.dueDate === today) dueMc = '<span class="mc mc-due-today">Today</span>';
  }

  var isActive = S.activeTimer && S.activeTimer.taskId === t.taskId;
  var elapsed = isActive
    ? '<span class="mc mc-elapsed" id="el-' + esc(t.taskId) + '" data-start="' + esc(S.activeTimer.startTime) + '">0:00</span>'
    : '';

  // Play/Stop button — shown on open and in_progress rows only
  var timerBtn = '';
  if (!isDone && t.status !== 'not_done') {
    if (isActive) {
      timerBtn = '<button class="timer-btn stop-btn" data-action="stop" data-task-id="' + esc(t.taskId) + '" title="Stop timer">⏹</button>';
    } else {
      timerBtn = '<button class="timer-btn play-btn" data-action="play" data-task-id="' + esc(t.taskId) + '" title="Start timer">▶</button>';
    }
  }

  return '<div class="task-row' + (isDone ? ' done-row' : '') + '" data-task-id="' + esc(t.taskId) + '">' +
    '<span class="prio-dot ' + dotCls + '"></span>' +
    '<span class="' + titleCls + '">' + esc(t.title) + '</span>' +
    '<span class="row-meta">' +
      (proj ? '<span class="mc mc-proj">' + esc(proj) + '</span>' : '') +
      (cat  ? '<span class="mc mc-cat">'  + esc(cat)  + '</span>' : '') +
      (assigneeName ? '<span class="mc mc-assignee">' + esc(assigneeName) + '</span>' : '') +
      dueMc + elapsed +
    '</span>' +
    timerBtn +
  '</div>';
}

// ═══════════════════════════════════════════════
// ROW TAP → OPTIMISTIC STATUS CYCLE
// ═══════════════════════════════════════════════
function onRowTap(taskId) {
  if (S.tab === 'done') { editTask(taskId); return; }

  var task = findTask(taskId);
  if (!task) return;

  var next;
  if      (task.status === 'open')        next = 'in_progress';
  else if (task.status === 'in_progress') next = 'done';
  else if (task.status === 'not_done')    next = 'open';
  else { editTask(taskId); return; }

  var prev = task.status;
  task.status = next;
  updateCounts();
  renderBoard();

  var sid = dwmGetSession();
  google.script.run
    .withSuccessHandler(function (r) {
      if (r.status !== 'success') {
        dwmShowToast(r.message || 'Update failed', 'error');
        task.status = prev;
        updateCounts(); renderBoard();
      } else {
        dwmShowToast('→ ' + next.replace('_', ' '), 'success');
      }
    })
    .withFailureHandler(function () {
      dwmShowToast('Network error — retry', 'error');
      task.status = prev;
      updateCounts(); renderBoard();
    })
    .changeStatus(sid, taskId, next);
}

// ═══════════════════════════════════════════════
// PLAY / STOP TIMER
// ═══════════════════════════════════════════════
function onPlayTap(taskId) {
  var sid = dwmGetSession();
  var task = findTask(taskId);
  if (!task) return;
  // Mark in_progress optimistically
  if (task.status === 'open') { task.status = 'in_progress'; updateCounts(); }
  S.activeTimer = { taskId: taskId, startTime: new Date().toISOString() };
  renderBoard();
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.status === 'success') {
        if (r.startTime) S.activeTimer.startTime = r.startTime;
        renderBoard();
      } else {
        dwmShowToast(r && r.message ? r.message : 'Could not start timer', 'error');
        S.activeTimer = null; renderBoard();
      }
    })
    .withFailureHandler(function() {
      dwmShowToast('Network error', 'error');
      S.activeTimer = null; renderBoard();
    })
    .startTimer(sid, taskId);
}

function onStopTap(taskId) {
  var sid = dwmGetSession();
  S.activeTimer = null;
  renderBoard();
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || r.status !== 'success') dwmShowToast(r && r.message ? r.message : 'Could not stop timer', 'error');
      else dwmShowToast('Timer stopped', 'success');
    })
    .withFailureHandler(function() { dwmShowToast('Network error', 'error'); })
    .stopTimer(sid, taskId);
}

// ═══════════════════════════════════════════════
// ELAPSED TICKER
// ═══════════════════════════════════════════════
function startTick() {
  stopTick();
  if (!document.querySelector('[data-start]')) return;
  tickInterval = setInterval(function () {
    var nodes = document.querySelectorAll('[data-start]');
    if (!nodes.length) { stopTick(); return; }
    nodes.forEach(function (el) {
      var ms = Date.now() - new Date(el.getAttribute('data-start')).getTime();
      el.textContent = dwmHms(ms);
    });
  }, 1000);
}
function stopTick() {
  if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
}

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function editTask(taskId) {
  var url = __DWM_SCRIPT_URL__ + '?app=dwm&page=taskform&taskId=' + encodeURIComponent(taskId);
  try { window.top.location.href = url; }
  catch (e) { dwmShowContinueOverlay_url(url, 'Edit Task'); }
}

function newTask() {
  var url = __DWM_SCRIPT_URL__ + '?app=dwm&page=taskform';
  try { window.top.location.href = url; }
  catch (e) { dwmShowContinueOverlay_url(url, 'New Task'); }
}

// ═══════════════════════════════════════════════
// LOGOUT
// ═══════════════════════════════════════════════
function onLogout() {
  var sid = dwmGetSession();
  google.script.run
    .withSuccessHandler(function () { dwmSetSession(''); dwmGoto('login'); })
    .withFailureHandler(function ()  { dwmSetSession(''); dwmGoto('login'); })
    .logout(sid);
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function esc(s) { return dwmEscape(String(s || '')); }
function allTasks() { return S.own.concat(S.shared); }

function pname(id) {
  var p = (S.projects || []).find(function (x) { return x.id === id; });
  return p ? p.name : '';
}
function cname(id) {
  var c = (S.categories || []).find(function (x) { return x.id === id; });
  return c ? c.name : '';
}
function findTask(taskId) {
  var all = allTasks();
  for (var i = 0; i < all.length; i++) if (all[i].taskId === taskId) return all[i];
  return null;
}
function setAdminBtn(role) {
  var el = document.getElementById('adminBtn');
  if (el) el.style.display = (role === 'owner' || role === 'master') ? '' : 'none';
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function weekAgoStr() {
  var d = new Date(Date.now() - 7 * 24 * 3600 * 1000);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function pad2(n) { return String(n).padStart(2, '0'); }
