<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KPI Dashboard — Pack Masters</title>

  <!-- Tailwind CDN -->
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f2f5; color: #0f172a; }
    h1,h2,h3,h4,h5,h6 { font-family: 'Plus Jakarta Sans', sans-serif; }

    /* ── Skeleton animation ── */
    @keyframes skel-pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    .skel { background: #cbd5e1; border-radius: 6px; animation: skel-pulse .8s ease-in-out infinite; }

    /* ── Sparkline draw animation ── */
    .sparkline-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* ── Scrollbar hide for chip row ── */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Custom date range row ── */
    #customRange { display: none; align-items: center; gap: 6px; flex-wrap: wrap; }
    #customRange.show { display: flex; }
    #customRange input[type="date"] {
      height: 34px; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 0 8px; font-size: 13px; color: #0f172a;
      background: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ── Toast ── */
    #kpiToast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #c62828; color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 20px; border-radius: 8px; z-index: 9999;
      display: none; cursor: pointer; white-space: nowrap;
    }
    #kpiToast.show { display: block; }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 500;
      overflow-y: auto; padding: 20px;
    }
    .modal-overlay.open { display: block; }
    .modal-box {
      background: #fff; border-radius: 12px;
      max-width: 780px; margin: 0 auto;
      padding: 20px; font-size: 13px;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-title { font-size: 15px; font-weight: 700; color: #1e3a5f; font-family: 'Plus Jakarta Sans', sans-serif; }
    .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #64748b; line-height: 1; }
    .modal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .modal-table th {
      text-align: left; font-size: 10px; font-weight: 700;
      text-transform: uppercase; color: #1e3a5f;
      background: #f1f5f9; padding: 7px 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .modal-table td { padding: 7px 10px; border-bottom: 1px solid #e2e8f0; }
    .modal-table tr:last-child td { border-bottom: none; }
    .modal-empty { text-align: center; padding: 20px; color: #64748b; font-size: 12px; }

    /* ── OTD tabs ── */
    .otd-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
    .otd-tab {
      font-size: 11px; font-weight: 600; padding: 5px 12px;
      border-radius: 20px; cursor: pointer;
      background: #f1f5f9; color: #1e3a5f; border: none;
    }
    .otd-tab.active { background: #1e3a5f; color: #fff; }

    /* ── Tile status border ── */
    .tile-green { border-left: 4px solid #16a34a !important; }
    .tile-amber  { border-left: 4px solid #d97706 !important; }
    .tile-red    { border-left: 4px solid #dc2626 !important; }
    .tile-grey   { border-left: 4px solid #94a3b8 !important; }

    /* ── Value color helpers ── */
    .val-green { color: #16a34a; }
    .val-amber  { color: #d97706; }
    .val-red    { color: #dc2626; }
    .val-grey   { color: #94a3b8; }

    /* ── Delta ── */
    .tile-delta { font-size: 11px; font-weight: 600; margin-left: 6px; display: inline-block; vertical-align: middle; }
    .tile-delta.up   { color: #16a34a; }
    .tile-delta.down { color: #dc2626; }

    /* ── Syncing overlay spin ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; display: inline-block; }

    /* ── Period chip active ── */
    .period-chip.active { background: #1e3a5f; color: #fff; }
    .period-chip { cursor: pointer; }
  </style>

<script>
(function() {
  'use strict';

  // KPI_F.html — consolidated onto getQmsKpis (KpiConfig.js) as of 2026-05-20.
  // The old getKPIDashboard / kpiLoadContext_ / kpiOTD_ etc. are deprecated in KPI.js.
  // Drill-down modals (FPY, Supplier Defect, OTD PO detail) still call getKPIDrilldown
  // from KPI.js because no equivalent exists in KpiConfig.js.
  // Persona defaults to 'Manager' on the KPI page (all KPIs visible).

  var PERSONA = 'Manager';
  var state = { periodOpts: { preset: 'THIS_MONTH' }, kpisData: null };

  // ── Helpers ──
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function toast(msg) {
    var el = document.getElementById('kpiToast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 3000);
  }
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }
  window.closeModal = closeModal;

  // ── Period chip selector ──
  document.querySelectorAll('.period-chip').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.period-chip').forEach(function(b) {
        b.classList.remove('active', 'bg-[#1e3a5f]', 'text-white');
        b.classList.add('bg-white', 'text-[#374151]');
      });
      btn.classList.add('active');
      btn.classList.remove('bg-white', 'text-[#374151]');
      btn.classList.add('bg-[#1e3a5f]', 'text-white');

      var preset = btn.getAttribute('data-preset');
      var customRange = document.getElementById('customRange');
      if (preset === 'CUSTOM') {
        customRange.classList.add('show');
        return;
      }
      customRange.classList.remove('show');
      state.periodOpts = { preset: preset };
      load(false);
    });
  });

  document.getElementById('applyCustom').addEventListener('click', function() {
    var from = document.getElementById('customFrom').value;
    var to   = document.getElementById('customTo').value;
    if (!from || !to) { toast('Please select both dates.'); return; }
    state.periodOpts = { preset: 'CUSTOM', fromISO: from, toISO: to };
    load(false);
  });

  // ── Refresh — flushes KpiConfig cache keys (pmqms_kpis_*) + legacy kpi:v1:* ──
  document.getElementById('refreshBtn').addEventListener('click', function() {
    load(true);
  });

  // ── Logo → back ──
  document.getElementById('logoBtn').addEventListener('click', function() {
    google.script.run
      .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
      .withFailureHandler(function() {})
      .getFormHtml('Landing');
  });

  // ── Bottom nav routing ──
  function kpiGoto(formName) {
    google.script.run
      .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
      .withFailureHandler(function() { toast('Could not open ' + formName); })
      .getFormHtml(formName);
  }
  function bindNav(id, target) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', function() { kpiGoto(target); });
  }
  bindNav('navHome',    'Landing');
  bindNav('navRecords', 'Records');
  bindNav('navMasters', 'Masters');

  var navMoreEl = document.getElementById('navMore');
  if (navMoreEl) {
    navMoreEl.addEventListener('click', function() {
      var existing = document.getElementById('kpiMoreSheet');
      if (existing) { existing.remove(); return; }
      var items = [
        { label: 'Warehouse',       form: 'Warehouse' },
        { label: 'Customer Return', form: 'CustomerReturn' },
        { label: 'Dispatch',        form: 'Dispatch' },
        { label: 'Import CSV',      form: 'ImportCSV' }
      ];
      var html = items.map(function(i) {
        return '<button class="kpiMoreItem" data-form="' + i.form + '" style="width:100%;display:block;padding:14px 16px;font-size:14px;font-weight:600;color:#0f172a;background:transparent;border:0;border-bottom:1px solid #e2e8f0;text-align:left;cursor:pointer;font-family:inherit;">' + i.label + '</button>';
      }).join('');
      var sheet = document.createElement('div');
      sheet.id = 'kpiMoreSheet';
      sheet.style.cssText = 'position:fixed;inset:0;z-index:9998;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,58,95,0.55);';
      sheet.innerHTML = '<div style="background:#fff;width:100%;max-width:600px;border-radius:14px 14px 0 0;overflow:hidden;">' +
        '<div style="padding:12px 14px;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1.4px;border-bottom:1px solid #e2e8f0;">More modules</div>' +
        html + '</div>';
      sheet.addEventListener('click', function(e) {
        if (e.target === sheet) { sheet.remove(); return; }
        var b = e.target.closest('.kpiMoreItem');
        if (b) { var f = b.getAttribute('data-form'); sheet.remove(); kpiGoto(f); }
      });
      document.body.appendChild(sheet);
    });
  }

  // ── Sparkline SVG (inline, data-driven) ──
  function sparklineSvg(data, color) {
    var vals = (data || []).map(Number).filter(function(v) { return !isNaN(v); });
    if (vals.length < 2) return '';
    var min = Math.min.apply(null, vals);
    var max = Math.max.apply(null, vals);
    var W = 100, H = 40;
    var range = max - min || 1;
    var pts = vals.map(function(v, i) {
      var x = Math.round((i / (vals.length - 1)) * W);
      var y = Math.round(H - ((v - min) / range) * (H - 4) - 2);
      return x + ',' + y;
    }).join(' ');
    return '<svg class="w-full h-full" preserveAspectRatio="none" viewBox="0 0 ' + W + ' ' + H + '">' +
      '<polyline class="sparkline-path" points="' + pts + '" fill="none" stroke="' + (color || '#6366F1') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  // ── KPI value formatting ──
  function fmtVal(kpi) {
    if (kpi.value == null) return '—';
    if (kpi.format === 'pct') return kpi.value.toFixed(1) + '%';
    if (kpi.format === 'num') {
      var n = kpi.value;
      var s = (n % 1 !== 0) ? n.toFixed(1) : String(n);
      return s + (kpi.unit || '');
    }
    return String(kpi.value);
  }

  // ── KPI status from value vs target ──
  // For pct KPIs: higher is better (green ≥ target, amber ≥ target*0.95, else red).
  // For num KPIs where lower is better (OTD=Dispatch TAT, NCR_MTTR, AGED_STOCK):
  //   green ≤ target, amber ≤ target*1.5, else red.
  var KPI_LOWER_IS_BETTER = { OTD: true, NCR_MTTR: true, AGED_STOCK: true };
  function kpiStatus(kpi) {
    if (kpi.value == null) return 'grey';
    if (kpi.target == null) return 'grey';
    var v = Number(kpi.value);
    var t = Number(kpi.target);
    if (isNaN(v) || isNaN(t)) return 'grey';
    if (KPI_LOWER_IS_BETTER[kpi.key]) {
      if (v <= t) return 'green';
      if (v <= t * 1.5) return 'amber';
      return 'red';
    }
    // Higher is better
    if (v >= t) return 'green';
    if (v >= t * 0.95) return 'amber';
    return 'red';
  }

  // ── Icon map by KPI key ──
  var KPI_ICON = {
    IQC_PASS: 'science', FPY: 'bar_chart', OTD: 'local_shipping',
    NCR_MTTR: 'warning', SUPPLIER_OTIF: 'factory', TOP_DEFECT: 'bug_report',
    FIFO_COMPL: 'swap_vert', AGED_STOCK: 'inventory', DWELL: 'timer',
    IPQC_REJECT: 'cancel', CR_RATE: 'sync', COST_OF_QUAL: 'paid'
  };

  // ── Status → color / label ──
  var statusColor = { green: '#16a34a', amber: '#d97706', red: '#dc2626', grey: '#94a3b8' };
  var statusLabel = { green: 'GOOD', amber: 'AMBER', red: 'CRITICAL', grey: '—' };

  function statusBadge(status) {
    var c = statusColor[status] || '#94a3b8';
    var lbl = statusLabel[status] || status;
    return '<div class="flex items-center gap-1">' +
      '<div class="w-2 h-2 rounded-full" style="background:' + c + '"></div>' +
      '<span class="text-[10px] font-bold" style="color:' + c + '">' + lbl + '</span>' +
      '</div>';
  }

  // ── Generic tile builder ──
  function buildTile(id, status, icon, title, valueHtml, subHtml, sparkData, wide) {
    var col = statusColor[status] || '#94a3b8';
    var sparkHtml = sparkData
      ? '<div class="absolute top-1/2 -translate-y-1/2 left-0 w-full h-[40px] opacity-60 z-0 pointer-events-none">' + sparklineSvg(sparkData, col) + '</div>'
      : '';
    return '<div class="bg-white rounded-2xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.08)] border border-[#e2e8f0] tile-' + status +
      ' flex flex-col justify-between h-[140px] relative overflow-hidden cursor-pointer select-none' +
      (wide ? ' col-span-2' : '') + '" id="' + esc(id) + '">' +
      '<div class="flex items-start justify-between">' +
        '<span class="text-[11px] font-medium text-[#374151] leading-tight max-w-[80%]">' + esc(title) + '</span>' +
        '<span class="material-symbols-outlined text-[#64748b] text-[18px]">' + esc(icon) + '</span>' +
      '</div>' +
      '<div class="mt-2 relative z-10">' +
        '<span class="text-[32px] font-bold font-headline" style="color:' + col + '">' + valueHtml + '</span>' +
      '</div>' +
      sparkHtml +
      '<div class="flex items-center justify-between mt-auto z-10 pt-2 border-t border-[#f1f5f9]">' +
        '<span class="text-[11px] text-[#64748b]">' + subHtml + '</span>' +
        statusBadge(status) +
      '</div>' +
    '</div>';
  }

  // ── Drill-down row builder (for non-hero / group='drill' KPIs) ──
  function buildDrillRow(kpi, status) {
    var col = statusColor[status] || '#94a3b8';
    var tgtStr = kpi.target != null ? ('target ' + kpi.target + (kpi.unit || '')) : '';
    return '<div class="bg-white rounded-xl p-3 shadow-[0_1px_4px_rgba(0,0,0,0.06)] border border-[#e2e8f0] tile-' + status +
      ' flex items-center justify-between gap-3 col-span-2" id="tile-' + esc(kpi.key) + '">' +
      '<div class="flex flex-col min-w-0">' +
        '<span class="text-[11px] font-medium text-[#374151] truncate">' + esc(kpi.label) + '</span>' +
        '<span class="text-[10px] text-[#94a3b8]">' + esc(tgtStr) + '</span>' +
      '</div>' +
      '<div class="flex items-center gap-2 flex-shrink-0">' +
        '<span class="text-[22px] font-bold" style="color:' + col + '">' + esc(fmtVal(kpi)) + '</span>' +
        statusBadge(status) +
      '</div>' +
    '</div>';
  }

  // ── Render tiles from getQmsKpis array ──
  function renderTiles(kpis) {
    state.kpisData = kpis;
    var grid = document.getElementById('tileGrid');
    grid.innerHTML = '';

    var heroCount = 0;
    kpis.forEach(function(kpi) {
      if (kpi.status === 'error') return; // skip error entries in grid
      var status = kpiStatus(kpi);
      var icon = KPI_ICON[kpi.key] || 'insights';
      var valStr = fmtVal(kpi);
      var tgtStr = kpi.target != null ? ('target ' + kpi.target + (kpi.unit || '')) : '';

      if (kpi.group === 'hero') {
        heroCount++;
        var isWide = false; // 2-col grid: no wide for hero by default
        grid.innerHTML += buildTile('tile-' + kpi.key, status, icon,
          kpi.label, esc(valStr), esc(tgtStr), kpi.sparkline, isWide);
      } else {
        grid.innerHTML += buildDrillRow(kpi, status);
      }
    });

    if (heroCount === 0 && kpis.length === 0) {
      grid.innerHTML = '<div class="col-span-2 text-center text-[#64748b] text-[13px] py-8">No KPI data available.</div>';
    }

    // Wire drill-down clicks for KPIs that have getKPIDrilldown support
    // (FPY IQC failures, Supplier Defect full list, OTD PO detail tabs)
    wiredDrillClick('tile-FPY',           openFPYModal);
    wiredDrillClick('tile-SUPPLIER_OTIF', openSDModal);
    wiredDrillClick('tile-OTD',           openOTDModal);
  }

  function wiredDrillClick(id, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', fn);
  }

  // ── Drill-down openers (still call getKPIDrilldown in KPI.js — kept for drill detail) ──
  function openFPYModal() {
    document.getElementById('fpyModal').classList.add('open');
    document.getElementById('fpyModalBody').innerHTML = '<p class="modal-empty">Loading…</p>';
    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('fpyModalBody').innerHTML = buildSimpleTable(result.columns, result.rows, 'No FPY failures in period.');
      })
      .withFailureHandler(function(e) {
        document.getElementById('fpyModalBody').innerHTML = '<p class="modal-empty" style="color:#c62828;">Error: ' + esc(e && e.message) + '</p>';
      })
      .getKPIDrilldown('fpy', state.periodOpts, {});
  }

  function openSDModal() {
    document.getElementById('sdModal').classList.add('open');
    document.getElementById('sdModalBody').innerHTML = '<p class="modal-empty">Loading…</p>';
    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('sdModalBody').innerHTML = buildSimpleTable(result.columns, result.rows, 'No supplier defect data.');
      })
      .withFailureHandler(function(e) {
        document.getElementById('sdModalBody').innerHTML = '<p class="modal-empty" style="color:#c62828;">Error: ' + esc(e && e.message) + '</p>';
      })
      .getKPIDrilldown('supplierDefect', state.periodOpts, {});
  }

  function openOTDModal() {
    document.getElementById('otdModal').classList.add('open');
    document.getElementById('otdTabs').innerHTML = '';
    document.getElementById('otdModalBody').innerHTML = '<p class="modal-empty">Loading…</p>';
    google.script.run
      .withSuccessHandler(function(result) {
        var tabs = result.tabs || [];
        var tabBar = document.getElementById('otdTabs');
        tabBar.innerHTML = '';
        tabs.forEach(function(tab, i) {
          var btn = document.createElement('button');
          btn.className = 'otd-tab' + (i === 0 ? ' active' : '');
          btn.textContent = tab.label;
          btn.addEventListener('click', function() {
            document.querySelectorAll('.otd-tab').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById('otdModalBody').innerHTML = buildSimpleTable(result.columns, tab.rows, 'No records.');
          });
          tabBar.appendChild(btn);
        });
        if (tabs.length > 0) {
          document.getElementById('otdModalBody').innerHTML = buildSimpleTable(result.columns, tabs[0].rows, 'No records.');
        } else {
          document.getElementById('otdModalBody').innerHTML = '<p class="modal-empty">No OTD detail data. (OTD here = Dispatch TAT; PO promise-date drill requires CUSTOMER_ORDERS sheet.)</p>';
        }
      })
      .withFailureHandler(function(e) {
        document.getElementById('otdModalBody').innerHTML = '<p class="modal-empty" style="color:#c62828;">Error: ' + esc(e && e.message) + '</p>';
      })
      .getKPIDrilldown('otd', state.periodOpts, {});
  }

  function buildSimpleTable(columns, rows, emptyMsg) {
    if (!rows || rows.length === 0) return '<p class="modal-empty">' + esc(emptyMsg || 'No data.') + '</p>';
    var html = '<div style="overflow-x:auto;"><table class="modal-table"><thead><tr>';
    (columns || []).forEach(function(c) { html += '<th>' + esc(c) + '</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach(function(row) {
      html += '<tr>';
      (row || []).forEach(function(v) { html += '<td>' + esc(v) + '</td>'; });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  // ── Open a dedicated web-app page in a new tab ──
  function openWebAppPage(page, from, to) {
    var qs = '?page=' + encodeURIComponent(page) +
             '&from=' + encodeURIComponent(from || '') +
             '&to='   + encodeURIComponent(to   || '');
    google.script.run
      .withSuccessHandler(function(url) {
        try { window.open(url + qs, '_blank'); }
        catch(e) { toast('Pop-up blocked — allow pop-ups for this site.'); }
      })
      .withFailureHandler(function() { toast('Could not get web app URL.'); })
      .getScriptUrl();
  }

  // ── Summary card ──
  function renderSummary(kpis, periodLabel) {
    document.getElementById('summaryTitle').textContent = (periodLabel || 'Period') + ' Summary';
    var rows = kpis.map(function(kpi) {
      return [kpi.label, fmtVal(kpi)];
    });
    document.getElementById('summaryBody').innerHTML = rows.map(function(r){
      return '<div class="flex items-center justify-between py-1 border-b border-[#f1f5f9] last:border-0">' +
        '<span>' + esc(r[0]) + '</span>' +
        '<span class="font-semibold text-[#0f172a]">' + esc(r[1]) + '</span></div>';
    }).join('') || '<span class="text-[#94a3b8] text-[12px]">No data.</span>';
  }

  // ── Load ──
  function load(flush) {
    document.getElementById('dashFooter').textContent = 'Loading…';
    var icon = document.getElementById('refreshIcon');
    icon.classList.add('animate-spin');
    if (flush) {
      // Flush both cache namespaces: legacy kpi:v1:* (KPI.js) + pmqms_kpis_* (KpiConfig.js)
      google.script.run
        .withSuccessHandler(function() { fetchDash(); })
        .withFailureHandler(function() { fetchDash(); })
        .kpiCacheFlush();
    } else {
      fetchDash();
    }
  }

  function fetchDash() {
    // Call getQmsKpis (KpiConfig.js) — single source of truth for KPI values.
    // Second arg is periodOpts so period chips work correctly.
    google.script.run
      .withSuccessHandler(function(kpis) {
        kpis = kpis || [];
        renderTiles(kpis);
        var periodLabel = kpis._periodLabel || state.periodOpts.preset || 'Period';
        var when = kpis._computedAtISO ? String(kpis._computedAtISO).slice(11, 16) : '';
        document.getElementById('dashFooter').textContent =
          periodLabel + (when ? ' · updated ' + when : '');
        renderSummary(kpis, periodLabel);
        document.getElementById('refreshIcon').classList.remove('animate-spin');
      })
      .withFailureHandler(function(e) {
        toast('KPI load failed: ' + (e && e.message ? e.message : 'unknown error'));
        document.getElementById('dashFooter').textContent = 'Error loading KPI data.';
        document.getElementById('refreshIcon').classList.remove('animate-spin');
      })
      .getQmsKpis(PERSONA, state.periodOpts);
  }

  // ── Init ──
  load(false);

}());
</script>
<?!= include('BottomNav') ?>
</body>
