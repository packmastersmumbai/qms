<script>
(function() {
  'use strict';

  var TABS = ['suppliers', 'materials', 'customers', 'inspectors', 'fg', 'parameters'];
  var activeTab = 'suppliers';
  var cache = {};
  var loadState = {};
  var searchTimer = null;

  // Map UI tab → server master type
  var TYPE_BY_TAB = {
    suppliers:  'supplier',
    materials:  'material',
    customers:  'customer',
    inspectors: 'inspector',
    fg:         'fg',
    parameters: 'parameter'
  };

  // Per-type field schemas: { key, label, required, type, options?, placeholder?, widthHalf? }
  var SCHEMA = {
    supplier: [
      { key: 'code',     label: 'Code',     required: true,  type: 'text', widthHalf: true },
      { key: 'approved', label: 'Approved', required: true,  type: 'select', options: ['Y','N'], widthHalf: true },
      { key: 'name',     label: 'Name',     required: true,  type: 'text' },
      { key: 'contact',  label: 'Contact',  required: false, type: 'text', widthHalf: true },
      { key: 'phone',    label: 'Phone',    required: false, type: 'text', widthHalf: true },
      { key: 'material', label: 'Material', required: false, type: 'text' },
      { key: 'city',     label: 'City',     required: false, type: 'text' }
    ],
    material: [
      { key: 'code',            label: 'Code',             required: true,  type: 'text', widthHalf: true },
      { key: 'unit',            label: 'Unit',             required: true,  type: 'text', widthHalf: true },
      { key: 'desc',            label: 'Description',      required: true,  type: 'text' },
      { key: 'category',        label: 'Category',         required: true,  type: 'text', widthHalf: true },
      { key: 'defaultLocation', label: 'Default Location', required: false, type: 'text', widthHalf: true }
    ],
    customer: [
      { key: 'code',     label: 'Code',     required: true,  type: 'text', widthHalf: true },
      { key: 'city',     label: 'City',     required: false, type: 'text', widthHalf: true },
      { key: 'name',     label: 'Name',     required: true,  type: 'text' },
      { key: 'contact',  label: 'Contact',  required: false, type: 'text', widthHalf: true },
      { key: 'phone',    label: 'Phone',    required: false, type: 'text', widthHalf: true },
      { key: 'email',    label: 'Email',    required: false, type: 'email' },
      { key: 'products', label: 'Products', required: false, type: 'text' }
    ],
    inspector: [
      { key: 'name',   label: 'Name',   required: true,  type: 'text' },
      { key: 'role',   label: 'Role',   required: false, type: 'text', widthHalf: true },
      { key: 'dept',   label: 'Dept',   required: false, type: 'text', widthHalf: true },
      { key: 'phone',  label: 'Phone',  required: false, type: 'text', widthHalf: true },
      { key: 'notify', label: 'Notify', required: true,  type: 'select', options: ['Y','N'], widthHalf: true }
    ],
    fg: [
      { key: 'code', label: 'Code', required: true, type: 'text', widthHalf: true },
      { key: 'uom',  label: 'UOM',  required: true, type: 'text', widthHalf: true },
      { key: 'name', label: 'Name', required: true, type: 'text' }
    ],
    parameter: [
      { key: 'code',       label: 'Code',        required: true,  type: 'text', widthHalf: true },
      { key: 'unit',       label: 'Unit',        required: false, type: 'text', widthHalf: true },
      { key: 'name',       label: 'Parameter Name', required: true, type: 'text' },
      { key: 'stdValue',   label: 'Std Value',   required: false, type: 'text' },
      { key: 'tolMin',     label: 'Tol Min',     required: false, type: 'number', widthHalf: true },
      { key: 'tolMax',     label: 'Tol Max',     required: false, type: 'number', widthHalf: true },
      { key: 'methodType', label: 'Method Type', required: false, type: 'text', widthHalf: true },
      { key: 'tools',      label: 'Tools',       required: false, type: 'text', widthHalf: true },
      { key: 'checkBrief', label: 'Check Brief', required: false, type: 'textarea' },
      { key: 'docRef',     label: 'Doc Ref',     required: false, type: 'text', widthHalf: true },
      { key: 'docNumber',  label: 'Doc No.',     required: false, type: 'text', widthHalf: true }
    ]
  };

  // Identity key per type (used to find existing record for edit/delete)
  var ID_KEY = {
    supplier: 'code', material: 'code', customer: 'code',
    inspector: 'name', fg: 'code', parameter: 'code'
  };

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function td(v) { return '<td>' + esc(v) + '</td>'; }

  function getRole() { return sessionStorage.getItem('userRole') || ''; }

  function checkRole() {
    var role = getRole();
    var chip = document.getElementById('roleChip');
    if (chip && role) {
      chip.textContent = role.charAt(0).toUpperCase() + role.slice(1);
      chip.style.display = '';
    }
    if (role === 'user') {
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() {})
        .getFormHtml('Landing');
      return false;
    }
    return true;
  }

  function switchTab(tab) {
    if (tab === activeTab) return;
    activeTab = tab;
    TABS.forEach(function(t) {
      var btn = document.querySelector('[data-tab="' + t + '"]');
      var panel = document.getElementById('panel-' + t);
      if (btn)   btn.classList.toggle('active', t === tab);
      if (panel) panel.classList.toggle('active', t === tab);
    });
    document.getElementById('searchInput').value = '';
    if (!loadState[tab]) loadTab(tab);
  }

  var SKEL_COLS = { suppliers: 5, materials: 5, customers: 7, inspectors: 5, fg: 4, parameters: 10 };

  function showSkeleton(tab) {
    var tbody = document.getElementById('tbody-' + tab);
    if (!tbody) return;
    var cols = SKEL_COLS[tab] || 4;
    var html = '';
    var widths = [55, 70, 62, 80, 58, 66, 72];
    for (var r = 0; r < 6; r++) {
      html += '<tr>';
      for (var c = 0; c < cols; c++) {
        html += '<td><span class="skel-bar" style="width:' + widths[(r + c) % widths.length] + '%">&nbsp;</span></td>';
      }
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function loadTab(tab) {
    loadState[tab] = 'loading';
    showSkeleton(tab);
    var fnName = ({
      suppliers: 'getSuppliers', materials: 'getMaterials', customers: 'getCustomers',
      inspectors: 'getInspectors', fg: 'getFG', parameters: 'getParameters'
    })[tab];
    google.script.run
      .withSuccessHandler(function(rows) { onLoaded(tab, rows || []); })
      .withFailureHandler(function(e) { onError(tab, e); })
      [fnName]();
  }

  function onLoaded(tab, rows) {
    loadState[tab] = 'loaded';
    cache[tab] = rows;
    renderTab(tab, '');
  }

  function onError(tab, err) {
    loadState[tab] = 'error';
    var tbody = document.getElementById('tbody-' + tab);
    var cols = SKEL_COLS[tab] || 4;
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="' + cols + '">' +
        '<div class="masters-empty">Could not load data. ' +
        '<a onclick="retryTab(\'' + tab + '\')">Tap to retry.</a></div></td></tr>';
    }
    showToast('Could not load ' + tab + '.', 'error');
  }

  window.retryTab = function(tab) { loadState[tab] = null; loadTab(tab); };

  function rowHtml(tab, r, idx) {
    var ds = ' data-tab="' + tab + '" data-idx="' + idx + '"';
    switch (tab) {
      case 'suppliers':  return '<tr' + ds + '>' + td(r.code) + td(r.name) + td(r.contact) + td(r.phone) + td(r.material) + '</tr>';
      case 'materials':  return '<tr' + ds + '>' + td(r.code) + td(r.desc) + td(r.unit) + td(r.category) + td(r.defaultLocation) + '</tr>';
      case 'customers':  return '<tr' + ds + '>' + td(r.code) + td(r.name) + td(r.contact) + td(r.phone) + td(r.email) + td(r.products) + td(r.city) + '</tr>';
      case 'inspectors': return '<tr' + ds + '>' + td(r.name) + td(r.role) + td(r.dept) + td(r.phone) + td(r.notify) + '</tr>';
      case 'fg':         return '<tr' + ds + '>' + td(r.code) + td(r.name || r.description) + td(r.uom) + td(r.category) + '</tr>';
      case 'parameters': return '<tr' + ds + '>' +
        td(r.code) + td(r.name) + td(r.unit) + td(r.stdValue) + td(r.tolMin) + td(r.tolMax) +
        '<td><span class="method-chip">' + esc(r.methodType || '') + '</span></td>' +
        td(r.tools) + td(r.docRef) + td(r.docNumber) + '</tr>';
    }
    return '';
  }

  function renderTab(tab, query) {
    var rows = cache[tab] || [];
    var q = (query || '').toLowerCase();
    var filtered = rows;
    if (q) {
      filtered = rows.filter(function(r) {
        return Object.keys(r).some(function(k) {
          var v = r[k];
          return v && String(v).toLowerCase().indexOf(q) !== -1;
        });
      });
    }

    var tbody = document.getElementById('tbody-' + tab);
    if (!tbody) return;

    if (!filtered.length) {
      var cols = SKEL_COLS[tab] || 4;
      var msg = q
        ? 'No results for &ldquo;' + esc(query) + '&rdquo;. <a onclick="clearSearch()">Clear search</a>'
        : 'No ' + tab + ' found. Tap + to add.';
      tbody.innerHTML = '<tr><td colspan="' + cols + '"><div class="masters-empty">' + msg + '</div></td></tr>';
      return;
    }

    // We need to preserve idx into ORIGINAL cache so edit gets correct record;
    // build via original index lookup.
    var origIdxByRef = new Map();
    rows.forEach(function(r, i) { origIdxByRef.set(r, i); });

    var html = '';
    filtered.forEach(function(r) {
      var origIdx = origIdxByRef.get(r);
      html += rowHtml(tab, r, origIdx);
    });
    tbody.innerHTML = html;
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    renderTab(activeTab, '');
  }
  window.clearSearch = clearSearch;

  /* ── Modal ── */
  var modalState = { mode: 'add', type: '', origIdKey: null };

  function openModal(tab, rowIdx) {
    var type = TYPE_BY_TAB[tab];
    var schema = SCHEMA[type];
    if (!schema) return;
    var isEdit = (rowIdx !== null && rowIdx !== undefined && rowIdx !== -1);
    var data = isEdit ? (cache[tab][rowIdx] || {}) : {};

    modalState.mode = isEdit ? 'edit' : 'add';
    modalState.type = type;
    modalState.origIdKey = isEdit ? data[ID_KEY[type]] : null;

    document.getElementById('modalTitle').textContent =
      (isEdit ? 'Edit ' : 'Add ') + tabLabel(tab);

    var body = document.getElementById('modalBody');
    var halfBuf = null;
    var html = '';
    schema.forEach(function(f) {
      var val = data[f.key];
      var fieldHtml = buildField(f, val, isEdit);
      if (f.widthHalf) {
        if (halfBuf === null) { halfBuf = fieldHtml; }
        else {
          html += '<div class="field-row-2col">' + halfBuf + fieldHtml + '</div>';
          halfBuf = null;
        }
      } else {
        if (halfBuf !== null) { html += '<div class="field-row-2col">' + halfBuf + '<div></div></div>'; halfBuf = null; }
        html += fieldHtml;
      }
    });
    if (halfBuf !== null) html += '<div class="field-row-2col">' + halfBuf + '<div></div></div>';
    body.innerHTML = html;

    document.getElementById('btnDelete').style.display = isEdit ? '' : 'none';
    document.getElementById('btnSave').disabled = false;
    document.getElementById('btnSave').textContent = 'Save';
    document.getElementById('modalOverlay').classList.add('show');
  }

  function buildField(f, val, isEdit) {
    var reqMark = f.required ? '<span class="req">*</span>' : '';
    var disabledIdAttr = (isEdit && ID_KEY[modalState.type] === f.key) ? ' disabled' : '';
    var safeVal = esc(val == null ? '' : val);
    var input;
    if (f.type === 'select') {
      var opts = (f.options || []).map(function(o) {
        var sel = (String(val) === String(o)) ? ' selected' : '';
        return '<option value="' + esc(o) + '"' + sel + '>' + esc(o) + '</option>';
      }).join('');
      input = '<select data-key="' + esc(f.key) + '"' + disabledIdAttr + '>' + opts + '</select>';
    } else if (f.type === 'textarea') {
      input = '<textarea data-key="' + esc(f.key) + '" rows="2">' + safeVal + '</textarea>';
    } else {
      input = '<input type="' + esc(f.type) + '" data-key="' + esc(f.key) + '" value="' + safeVal + '"' + disabledIdAttr + '>';
    }
    return '<div class="field-row"><label>' + esc(f.label) + reqMark + '</label>' + input + '</div>';
  }

  function tabLabel(tab) {
    return ({
      suppliers: 'Supplier', materials: 'Material', customers: 'Customer',
      inspectors: 'Inspector', fg: 'FG Item', parameters: 'Parameter'
    })[tab] || tab;
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

  function collectFormData() {
    var inputs = document.querySelectorAll('#modalBody [data-key]');
    var data = {};
    inputs.forEach(function(el) {
      var k = el.getAttribute('data-key');
      var v = el.value;
      if (el.tagName === 'INPUT' && el.type === 'number') {
        v = (v === '' ? '' : Number(v));
      } else if (typeof v === 'string') {
        v = v.trim();
      }
      data[k] = v;
    });
    // Preserve original ID even though field was disabled (disabled inputs still post via .value, but be safe)
    if (modalState.mode === 'edit' && modalState.origIdKey != null) {
      data[ID_KEY[modalState.type]] = modalState.origIdKey;
    }
    return data;
  }

  function validate(type, data) {
    var schema = SCHEMA[type] || [];
    for (var i = 0; i < schema.length; i++) {
      var f = schema[i];
      if (f.required) {
        var v = data[f.key];
        if (v === null || v === undefined || v === '' || (typeof v === 'string' && !v.trim())) {
          return f.label + ' is required.';
        }
      }
    }
    if (type === 'parameter') {
      if (data.tolMin !== '' && data.tolMax !== '' && Number(data.tolMin) > Number(data.tolMax)) {
        return 'Tol Min must be ≤ Tol Max.';
      }
    }
    if (type === 'customer' && data.email) {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return 'Invalid email format.';
    }
    return null;
  }

  function onSave() {
    var type = modalState.type;
    var data = collectFormData();
    var err = validate(type, data);
    if (err) { showToast(err, 'error'); return; }

    var saveBtn = document.getElementById('btnSave');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    google.script.run
      .withSuccessHandler(function() {
        showToast('Saved.', 'success');
        closeModal();
        // Refresh the active tab
        loadState[activeTab] = null;
        loadTab(activeTab);
        // If we edited materials and FG view exists, invalidate FG too
        if (type === 'material' || type === 'fg') {
          loadState['materials'] = null;
          loadState['fg'] = null;
        }
      })
      .withFailureHandler(function(e) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        showToast((e && e.message) ? e.message : 'Save failed.', 'error');
      })
      .saveMaster(type, data);
  }

  function onDelete() {
    var type = modalState.type;
    var id = modalState.origIdKey;
    if (!id) return;
    if (!confirm('Delete ' + tabLabel(activeTab) + ' "' + id + '"? This cannot be undone.')) return;

    var btn = document.getElementById('btnDelete');
    btn.disabled = true;
    btn.textContent = 'Deleting...';

    google.script.run
      .withSuccessHandler(function() {
        showToast('Deleted.', 'success');
        closeModal();
        loadState[activeTab] = null;
        loadTab(activeTab);
        if (type === 'material' || type === 'fg') {
          loadState['materials'] = null;
          loadState['fg'] = null;
        }
        btn.disabled = false;
        btn.textContent = 'Delete';
      })
      .withFailureHandler(function(e) {
        btn.disabled = false;
        btn.textContent = 'Delete';
        showToast((e && e.message) ? e.message : 'Delete failed.', 'error');
      })
      .deleteMaster(type, id);
  }

  /* ── Toast ── */
  var toastTimer = null;
  function showToast(msg, type) {
    var t = document.getElementById('pmToast');
    t.textContent = msg;
    t.className = 'pm-toast show' + (type ? ' ' + type : '');
    if (toastTimer) clearTimeout(toastTimer);
    var delay = type === 'error' ? 5000 : 3000;
    toastTimer = setTimeout(function() { t.className = 'pm-toast'; }, delay);
  }

  /* ── Init ── */
  document.addEventListener('DOMContentLoaded', function() {
    if (!checkRole()) return;

    document.getElementById('backBtn').addEventListener('click', function() {
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() {})
        .getFormHtml('Landing');
    });

    document.getElementById('mastersTabBar').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-tab]');
      if (btn) switchTab(btn.getAttribute('data-tab'));
    });

    document.getElementById('searchInput').addEventListener('input', function() {
      var val = this.value;
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function() {
        if (loadState[activeTab] === 'loaded') renderTab(activeTab, val);
      }, 250);
    });

    // Row click → edit
    document.body.addEventListener('click', function(e) {
      var tr = e.target.closest('tr[data-tab]');
      if (!tr) return;
      var tab = tr.getAttribute('data-tab');
      var idx = parseInt(tr.getAttribute('data-idx'), 10);
      if (isNaN(idx)) return;
      openModal(tab, idx);
    });

    document.getElementById('fabAdd').addEventListener('click', function() {
      openModal(activeTab, -1);
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('btnCancel').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.getElementById('btnSave').addEventListener('click', onSave);
    document.getElementById('btnDelete').addEventListener('click', onDelete);

    document.getElementById('pmToast').addEventListener('click', function() {
      this.className = 'pm-toast';
    });

    loadTab('suppliers');
  });

})();
</script>
</body>
</html>
