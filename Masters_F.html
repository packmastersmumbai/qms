<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <style>
    /* ── Tab bar ── */
    .masters-tabs {
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--navy-light);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 56px;
      z-index: 90;
      scrollbar-width: none;
    }
    .masters-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex-shrink: 0;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active {
      color: var(--navy);
      background: var(--navy-light);
      border-bottom-color: var(--navy);
    }

    /* ── Search bar ── */
    .masters-search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px 0;
    }
    .search-input {
      flex: 1;
      height: 36px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 0 11px;
      font-size: 12px;
      font-weight: 400;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.15s;
    }
    .search-input:focus { outline: none; border-color: var(--navy); }

    /* ── Read-only notice ── */
    .readonly-notice {
      margin: 10px 10px 0;
      padding: 8px 12px;
      background: var(--navy-light);
      border-left: 3px solid var(--navy);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--navy);
    }

    /* ── Table panel ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .masters-table-wrap {
      margin: 10px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }

    .masters-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }
    .masters-table thead th {
      background: var(--navy-light);
      color: var(--navy);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      position: sticky;
      top: calc(56px + 45px);
      z-index: 10;
    }
    .masters-table tbody tr {
      border-bottom: 1px solid var(--border);
      min-height: 44px;
    }
    .masters-table tbody tr:last-child { border-bottom: none; }
    .masters-table tbody tr:nth-child(even) { background: #FAFBFF; }
    .masters-table tbody td {
      padding: 10px 10px;
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
      vertical-align: middle;
      min-height: 44px;
    }

    .method-chip {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 12px;
      background: var(--navy-light);
      color: var(--navy);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── Skeleton ── */
    @keyframes skeleton-pulse {
      0%   { opacity: 0.4; }
      50%  { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .skel-bar {
      display: inline-block;
      height: 13px;
      background: var(--navy-light);
      border-radius: 4px;
      animation: skeleton-pulse 0.8s ease-in-out infinite;
    }

    /* ── Empty / error states ── */
    .masters-empty {
      text-align: center;
      padding: 32px 16px;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }
    .masters-empty a {
      color: var(--navy);
      cursor: pointer;
      text-decoration: underline;
    }

    /* ── Toast ── */
    .pm-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      min-width: 220px;
      max-width: 320px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--white);
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      text-align: center;
    }
    .pm-toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .pm-toast.success { background: var(--success); }
    .pm-toast.error   { background: var(--danger); cursor: pointer; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<div class="pm-header">
  <button class="back-btn" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6"/></svg>

<!-- ── Tab bar ── -->
<div class="masters-tabs" id="mastersTabBar">
  <button class="tab-btn active" data-tab="suppliers">Suppliers</button>
  <button class="tab-btn" data-tab="materials">Materials</button>
  <button class="tab-btn" data-tab="customers">Customers</button>
  <button class="tab-btn" data-tab="parameters">Parameters</button>
</div>

<!-- ── Read-only notice ── -->
<div class="readonly-notice">View only — contact system admin to modify master data.</div>

<!-- ── Search bar ── -->
<div class="masters-search-bar">
  <input class="search-input" id="searchInput" type="search" placeholder="Search..." autocomplete="off">
</div>

<!-- ── Panels ── -->

<!-- SUPPLIERS -->

  <div class="masters-table-wrap">
    <table class="masters-table">
      <thead>
        <tr>
          <th style="width:80px;">Code</th>

  </div>
</div>

<!-- MATERIALS -->
<div class="tab-panel" id="panel-materials">
  <div class="masters-table-wrap">
    <table class="masters-table">
      <thead>
        <tr>
          <th style="width:90px;">Code</th>
          <th>Description</th>
          <th style="width:70px;">Unit</th>
          <th style="width:110px;">Category</th>
          <th style="width:140px;">Default Location</th>
        </tr>
      </thead>
      <tbody id="tbody-materials"></tbody>
    </table>
  </div>
</div>

<!-- CUSTOMERS -->
<div class="tab-panel" id="panel-customers">
  <div class="masters-table-wrap">
    <table class="masters-table">
      <thead>
        <tr>
          <th style="width:80px;">Code</th>
          <th>Name</th>
          <th style="width:130px;">Contact</th>
          <th style="width:120px;">Phone</th>
          <th style="width:180px;">Email</th>
          <th style="width:140px;">Products</th>
          <th style="width:100px;">City</th>
        </tr>
      </thead>
      <tbody id="tbody-customers"></tbody>
    </table>
  </div>
</div>

<!-- PARAMETERS -->
<div class="tab-panel" id="panel-parameters">
  <div class="masters-table-wrap">
    <table class="masters-table">
      <thead>
        <tr>
          <th style="width:72px;">Code</th>
          <th>Parameter</th>
          <th style="width:60px;">Unit</th>
          <th style="width:72px;">Std</th>
          <th style="width:60px;">Min</th>
          <th style="width:60px;">Max</th>
          <th style="width:100px;">Method</th>
          <th style="width:140px;">Tools</th>
          <th style="width:100px;">Doc Ref</th>
          <th style="width:90px;">Doc No.</th>
        </tr>
      </thead>
      <tbody id="tbody-parameters"></tbody>
    </table>
  </div>
</div>

<div class="pm-toast" id="pmToast"></div>

<script>
(function() {
  'use strict';

  var TABS = ['suppliers', 'materials', 'customers', 'parameters'];
  var activeTab = 'suppliers';
  var cache = {};        // cache[tab] = array of rows
  var loadState = {};    // cache[tab] = 'loading' | 'loaded' | 'error'
  var searchTimer = null;

  /* ── XSS helper ── */
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function td(v) { return '<td>' + esc(v) + '</td>'; }

  /* ── Role gate ── */
  function getRole() {
    return sessionStorage.getItem('userRole') || '';
  }

  function checkRole() {
    var role = getRole();
    var chip = document.getElementById('roleChip');
    if (chip && role) {
      chip.textContent = role.charAt(0).toUpperCase() + role.slice(1);
      chip.style.display = '';
    }
    if (role === 'user') {
      google.script.run
        .withSuccessHandler(function(html) {
          document.open(); document.write(html); document.close();
        })
        .withFailureHandler(function() {})
        .getFormHtml('Landing');
      return false; // caller must not proceed
    }
    return true;
  }

  /* ── Tab switching ── */
  function switchTab(tab) {
    if (tab === activeTab) return;
    activeTab = tab;

    TABS.forEach(function(t) {
      var btn = document.querySelector('[data-tab="' + t + '"]');
      var panel = document.getElementById('panel-' + t);
      if (btn)   btn.classList.toggle('active', t === tab);
      if (panel) panel.classList.toggle('active', t === tab);
    });

    document.getElementById('searchInput').value = '';

    if (!loadState[tab]) {
      loadTab(tab);
    }
  }

  /* ── Skeleton ── */
  var SKEL_COLS = { suppliers: 5, materials: 5, customers: 7, parameters: 10 };

  function showSkeleton(tab) {
    var tbody = document.getElementById('tbody-' + tab);
    if (!tbody) return;
    var cols = SKEL_COLS[tab] || 4;
    var html = '';
    var widths = [55, 70, 62, 80, 58, 66, 72];
    for (var r = 0; r < 6; r++) {
      html += '<tr>';
      for (var c = 0; c < cols; c++) {
        html += '<td><span class="skel-bar" style="width:' + widths[(r + c) % widths.length] + '%">&nbsp;</span></td>';
      }
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  /* ── Load functions ── */
  function loadTab(tab) {
    loadState[tab] = 'loading';
    showSkeleton(tab);

    var fn, handler;
    switch (tab) {
      case 'suppliers':
        google.script.run
          .withSuccessHandler(function(rows) { onLoaded(tab, rows || []); })
          .withFailureHandler(function(e) { onError(tab, e); })
          .getSuppliers();
        break;
      case 'materials':
        google.script.run
          .withSuccessHandler(function(rows) { onLoaded(tab, rows || []); })
          .withFailureHandler(function(e) { onError(tab, e); })
          .getMaterials();
        break;
      case 'customers':
        google.script.run
          .withSuccessHandler(function(rows) { onLoaded(tab, rows || []); })
          .withFailureHandler(function(e) { onError(tab, e); })
          .getCustomers();
        break;
      case 'parameters':
        google.script.run
          .withSuccessHandler(function(rows) { onLoaded(tab, rows || []); })
          .withFailureHandler(function(e) { onError(tab, e); })
          .getParameters();
        break;
    }
  }

  function onLoaded(tab, rows) {
    loadState[tab] = 'loaded';
    cache[tab] = rows;
    renderTab(tab, '');
  }

  function onError(tab, err) {
    loadState[tab] = 'error';
    var tbody = document.getElementById('tbody-' + tab);
    var cols = SKEL_COLS[tab] || 4;
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="' + cols + '">' +
        '<div class="masters-empty">Could not load data. ' +
        '<a onclick="retryTab(\'' + tab + '\')">Tap to retry.</a></div></td></tr>';
    }
    showToast('Could not load ' + tab + '.', 'error');
  }

  window.retryTab = function(tab) {
    loadState[tab] = null;
    loadTab(tab);
  };

  /* ── Render functions ── */
  function renderTab(tab, query) {
    var rows = cache[tab] || [];
    var q = (query || '').toLowerCase();
    if (q) {
      rows = rows.filter(function(r) {
        return Object.values(r).some(function(v) {
          return v && String(v).toLowerCase().indexOf(q) !== -1;
        });
      });
    }

    var tbody = document.getElementById('tbody-' + tab);
    if (!tbody) return;

    if (!rows.length) {
      var cols = SKEL_COLS[tab] || 4;
      var msg = q
        ? 'No results for &ldquo;' + esc(query) + '&rdquo;. <a onclick="clearSearch()">Clear search</a>'
        : 'No ' + tab + ' found.';
      tbody.innerHTML = '<tr><td colspan="' + cols + '"><div class="masters-empty">' + msg + '</div></td></tr>';
      return;
    }

    var html = '';
    switch (tab) {
      case 'suppliers':
        rows.forEach(function(r) {
          html += '<tr>' + td(r.code) + td(r.name) + td(r.contact) + td(r.phone) + td(r.material) + '</tr>';
        });
        break;
      case 'materials':
        rows.forEach(function(r) {
          html += '<tr>' + td(r.code) + td(r.desc) + td(r.unit) + td(r.category) + td(r.defaultLocation) + '</tr>';
        });
        break;
      case 'customers':
        rows.forEach(function(r) {
          html += '<tr>' + td(r.code) + td(r.name) + td(r.contact) + td(r.phone) + td(r.email) + td(r.products) + td(r.city) + '</tr>';
        });
        break;
      case 'parameters':
        rows.forEach(function(r) {
          html += '<tr>' +
            td(r.code) + td(r.name) + td(r.unit) + td(r.stdValue) + td(r.tolMin) + td(r.tolMax) +
            '<td><span class="method-chip">' + esc(r.methodType || '') + '</span></td>' +
            td(r.tools) + td(r.docRef) + td(r.docNumber) +
          '</tr>';
        });
        break;
    }
    tbody.innerHTML = html;
  }

  /* ── Search ── */
  function clearSearch() {
    document.getElementById('searchInput').value = '';
    renderTab(activeTab, '');
  }
  window.clearSearch = clearSearch;

  /* ── Toast ── */
  var toastTimer = null;
  function showToast(msg, type) {
    var t = document.getElementById('pmToast');
    t.textContent = msg;
    t.className = 'pm-toast show' + (type ? ' ' + type : '');
    if (toastTimer) clearTimeout(toastTimer);
    var delay = type === 'error' ? 5000 : 3000;
    toastTimer = setTimeout(function() { t.className = 'pm-toast'; }, delay);
  }

  /* ── Init ── */
  document.addEventListener('DOMContentLoaded', function() {
    if (!checkRole()) return;

    document.getElementById('backBtn').addEventListener('click', function() {
      google.script.run
        .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
        .withFailureHandler(function() {})
        .getFormHtml('Landing');
    });

    document.getElementById('mastersTabBar').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-tab]');
      if (btn) switchTab(btn.getAttribute('data-tab'));
    });

    document.getElementById('searchInput').addEventListener('input', function() {
      var val = this.value;
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function() {
        if (loadState[activeTab] === 'loaded') {
          renderTab(activeTab, val);
        }
      }, 250);
    });

    document.getElementById('pmToast').addEventListener('click', function() {
      this.className = 'pm-toast';
    });

    // Load first tab
    loadTab('suppliers');
  });

})();
</script>
</body>
</html>
