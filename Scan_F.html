<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scan — Pack Masters QMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Plus Jakarta Sans',sans-serif; background:#0f172a; color:#f8fafc; margin:0; min-height:100dvh; -webkit-tap-highlight-color:transparent; }
    .wrap { max-width:520px; margin:0 auto; padding:16px; }
    .card { background:#1e293b; border-radius:12px; padding:16px; margin-bottom:12px; }
    h1 { font-size:18px; margin:0 0 8px 0; font-weight:700; }
    h2 { font-size:14px; margin:0 0 8px 0; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:0.04em; }
    .pin-display { font-size:36px; letter-spacing:18px; text-align:center; padding:16px; background:#0f172a; border-radius:8px; margin-bottom:12px; min-height:48px; font-weight:700; color:#f8fafc; }
    .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .key { background:#334155; color:#f8fafc; border:none; border-radius:10px; padding:18px 0; font-size:24px; font-weight:600; cursor:pointer; touch-action:manipulation; }
    .key:active { background:#475569; transform:scale(0.97); }
    .key.action { background:#0ea5e9; }
    .key.danger { background:#7f1d1d; }
    .who { display:flex; justify-content:space-between; align-items:center; padding:12px; background:#0f172a; border-radius:8px; margin-bottom:12px; }
    .who-name { font-weight:700; font-size:16px; }
    .who-meta { font-size:12px; color:#94a3b8; }
    .logout { background:#7f1d1d; color:#fee2e2; border:none; padding:8px 14px; border-radius:6px; font-size:13px; cursor:pointer; }
    .chokepoint-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .chokepoint { background:#334155; padding:18px 12px; text-align:center; border-radius:10px; border:none; color:#f8fafc; font-weight:600; cursor:pointer; touch-action:manipulation; }
    .chokepoint:active { transform:scale(0.97); }
    .chokepoint.active { background:#0ea5e9; box-shadow:0 0 0 3px rgba(14,165,233,0.3); }
    .chokepoint .verb { display:block; font-size:18px; margin-bottom:4px; }
    .chokepoint .label { display:block; font-size:11px; opacity:0.7; }
    .lot-input { width:100%; box-sizing:border-box; padding:14px; font-size:18px; background:#0f172a; border:2px solid #334155; border-radius:8px; color:#f8fafc; margin-bottom:12px; font-family:inherit; }
    .lot-input:focus { outline:none; border-color:#0ea5e9; }
    .btn-primary { width:100%; padding:16px; font-size:16px; font-weight:700; background:#10b981; color:#fff; border:none; border-radius:10px; cursor:pointer; }
    .btn-primary:active { background:#059669; }
    .btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
    .recent { font-size:13px; }
    .recent-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #334155; }
    .recent-row:last-child { border-bottom:none; }
    .recent-row .verb { font-weight:700; color:#10b981; }
    .recent-row .lot { color:#cbd5e1; }
    .recent-row .ts { font-size:11px; color:#64748b; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#10b981; color:#fff; padding:12px 20px; border-radius:8px; font-weight:600; z-index:50; opacity:0; transition:opacity 0.3s; pointer-events:none; }
    .toast.show { opacity:1; }
    .toast.error { background:#dc2626; }
    .toast.warn  { background:#f59e0b; }
    .wifi-pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#0f172a; border-radius:999px; font-size:11px; color:#94a3b8; }
    .wifi-dot { width:8px; height:8px; border-radius:50%; background:#10b981; }
    .wifi-dot.warn { background:#f59e0b; }
    .wifi-dot.bad  { background:#dc2626; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- WHO-ARE-YOU GATE (name pick; no PIN, no Google sign-in) -->
    <div id="gate" class="card">
      <h1>Pack Masters Scan</h1>
      <h2 id="gateMsg">Who are you?</h2>
      <select id="opSelect" class="lot-input"><option value="">Loading…</option></select>
      <button id="opOk" class="btn-primary" disabled>Continue</button>
    </div>

    <!-- MAIN UI (hidden until identity resolved) -->
    <div id="main" class="hidden">
      <div class="card">
        <div class="who">
          <div>
            <div class="who-name" id="whoName">—</div>
            <div class="who-meta" id="whoMeta">Signed in</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <span class="wifi-pill"><span id="wifiDot" class="wifi-dot"></span><span id="wifiText">Wi-Fi</span></span>
          </div>
        </div>

        <h2>Step 1 — Tap the chokepoint sticker name</h2>
        <div class="chokepoint-grid">
          <button class="chokepoint" data-loc="LOC|GATE-IN"><span class="verb">RECEIVE</span><span class="label">Gate-In</span></button>
          <button class="chokepoint" data-loc="LOC|GATE-OUT"><span class="verb">SHIP</span><span class="label">Gate-Out</span></button>
          <button class="chokepoint" data-loc="LOC|FLOOR-1-IN"><span class="verb">UP-1</span><span class="label">1st-Floor-In</span></button>
          <button class="chokepoint" data-loc="LOC|FLOOR-2-IN"><span class="verb">UP-2</span><span class="label">2nd-Floor-In</span></button>
        </div>
      </div>

      <div class="card">
        <h2 id="step2Title">Step 2 — Type/scan the lot ID</h2>

        <!-- Gate-In only: GRN → item → qty (driven by real GRN data) -->
        <div id="receiveFields" class="hidden">
          <select id="grnSelect" class="lot-input"><option value="">— select GRN —</option></select>
          <select id="grnItemSelect" class="lot-input" disabled><option value="">— select item —</option></select>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="number" id="qtyInput" class="lot-input" style="flex:1;margin-bottom:0;" placeholder="Quantity received" inputmode="decimal" min="0" step="any">
            <span id="grnQtyHint" style="font-size:12px;color:#94a3b8;white-space:nowrap;"></span>
          </div>
          <input type="text" id="matInput" class="hidden">
        </div>

        <!-- Non-Gate-In: free lot id -->
        <input type="text" id="lotInput" class="lot-input" placeholder="e.g. PM/GRN/2026-0123  or supplier batch" autocomplete="off" autocapitalize="characters">

        <button id="checkBtn" class="btn-primary" disabled>Check lot</button>

        <!-- Confirm card — shows the previewed real effect before writing -->
        <div id="confirmCard" class="hidden" style="margin-top:12px;padding:12px;background:#0f172a;border-radius:8px;border:1px solid #334155;">
          <div id="confirmText" style="font-size:14px;margin-bottom:10px;line-height:1.4;"></div>
          <div style="display:flex;gap:8px;">
            <button id="confirmBtn" class="btn-primary" style="flex:1;">Confirm</button>
            <button id="cancelBtn" class="logout" style="flex:0 0 auto;">Cancel</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Recent scans (last 5)</h2>
        <div id="recent" class="recent"><div style="color:#64748b;padding:8px 0;">No scans yet.</div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    var operator = null;       // { name, role, shift }
    var operators = [];        // [{name, role, shift}]
    var selectedLoc = null;
    var recent = [];
    var LS_KEY = 'pmScanOperator';

    // ---------- Identity (self-selected name; no PIN, no Google sign-in) ----------
    var opSelect = document.getElementById('opSelect');
    var opOk = document.getElementById('opOk');

    function loadOperators(){
      google.script.run
        .withSuccessHandler(function(list){
          operators = list || [];
          if (!operators.length) {
            document.getElementById('gateMsg').textContent = 'No operators set up. Add names to the OPERATORS sheet.';
            opSelect.innerHTML = '<option value="">(none)</option>';
            return;
          }
          opSelect.innerHTML = '<option value="">— select your name —</option>' +
            operators.map(function(o){
              var meta = [o.role, o.shift && (o.shift + ' shift')].filter(Boolean).join(' · ');
              return '<option value="'+escapeHtml(o.name)+'">'+escapeHtml(o.name)+(meta?' ('+escapeHtml(meta)+')':'')+'</option>';
            }).join('');
          // Auto-resume last operator on this device.
          var saved = '';
          try { saved = localStorage.getItem(LS_KEY) || ''; } catch(e){}
          if (saved && operators.some(function(o){ return o.name === saved; })) {
            opSelect.value = saved;
            enterAs(saved);
            return;
          }
          opOk.disabled = true;
        })
        .withFailureHandler(function(e){
          document.getElementById('gateMsg').textContent = 'Could not load operators: ' + (e.message||e) + ' — reload to retry.';
        })
        .getOperators();
    }

    opSelect.addEventListener('change', function(){ opOk.disabled = !opSelect.value; });
    opOk.addEventListener('click', function(){ if (opSelect.value) enterAs(opSelect.value); });

    function enterAs(name){
      var found = operators.filter(function(o){ return o.name === name; })[0] || { name:name, role:'', shift:'' };
      operator = found;
      try { localStorage.setItem(LS_KEY, name); } catch(e){}
      document.getElementById('whoName').textContent = found.name;
      var meta = [found.role, found.shift && (found.shift + ' shift')].filter(Boolean).join(' · ');
      document.getElementById('whoMeta').innerHTML = (meta || 'Operator') + ' · <a href="#" id="switchOp" style="color:#0ea5e9;">switch</a>';
      document.getElementById('switchOp').addEventListener('click', function(ev){
        ev.preventDefault();
        operator = null; selectedLoc = null;
        try { localStorage.removeItem(LS_KEY); } catch(e){}
        document.getElementById('main').classList.add('hidden');
        document.getElementById('gate').classList.remove('hidden');
        opSelect.value = ''; opOk.disabled = true;
        stopWifiHeartbeat();
      });
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      startWifiHeartbeat();
    }

    loadOperators();

    // ---------- Chokepoint selection ----------
    var GATE_IN = 'LOC|GATE-IN';
    var grnSelect = document.getElementById('grnSelect');
    var grnItemSelect = document.getElementById('grnItemSelect');
    var grnQtyHint = document.getElementById('grnQtyHint');
    var grnsLoaded = false;
    var currentItems = [];   // items of the selected GRN

    document.querySelectorAll('.chokepoint').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('.chokepoint').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        selectedLoc = b.getAttribute('data-loc');
        var isGateIn = selectedLoc === GATE_IN;
        // Gate-In: GRN→item→qty dropdowns. Other chokepoints: free lot id.
        document.getElementById('receiveFields').classList.toggle('hidden', !isGateIn);
        document.getElementById('lotInput').classList.toggle('hidden', isGateIn);
        document.getElementById('step2Title').textContent = isGateIn
          ? 'Step 2 — Pick the GRN and item received'
          : 'Step 2 — Type/scan the lot ID';
        if (isGateIn && !grnsLoaded) loadGRNs();
        hideConfirm();
        refreshCheckState();
      });
    });

    // ---------- Gate-In: GRN + item dropdowns ----------
    function loadGRNs(){
      grnSelect.innerHTML = '<option value="">Loading GRNs…</option>';
      google.script.run
        .withSuccessHandler(function(grns){
          grnsLoaded = true;
          if (!grns || !grns.length) { grnSelect.innerHTML = '<option value="">(no GRNs found)</option>'; return; }
          grnSelect.innerHTML = '<option value="">— select GRN —</option>' +
            grns.map(function(g){
              var label = g.grnNo + (g.supplierName ? ' · ' + g.supplierName : '') + (g.date ? ' · ' + g.date : '');
              return '<option value="'+escapeHtml(g.grnNo)+'">'+escapeHtml(label)+'</option>';
            }).join('');
        })
        .withFailureHandler(function(e){ grnSelect.innerHTML = '<option value="">(load failed)</option>'; toast('GRN load failed: '+(e.message||e),'error'); })
        .getRecentGRNs();
    }

    grnSelect.addEventListener('change', function(){
      grnItemSelect.innerHTML = '<option value="">Loading items…</option>';
      grnItemSelect.disabled = true; currentItems = []; grnQtyHint.textContent = '';
      qtyInput.value = ''; lotInput.value = ''; matInput.value = '';
      refreshCheckState();
      if (!grnSelect.value) { grnItemSelect.innerHTML = '<option value="">— select item —</option>'; return; }
      google.script.run
        .withSuccessHandler(function(items){
          currentItems = items || [];
          if (!currentItems.length) { grnItemSelect.innerHTML = '<option value="">(no items)</option>'; return; }
          grnItemSelect.disabled = false;
          grnItemSelect.innerHTML = '<option value="">— select item —</option>' +
            currentItems.map(function(it, i){
              var label = (it.materialDesc || it.materialCode) + ' · ' + (it.batchNo || '(no batch)');
              return '<option value="'+i+'">'+escapeHtml(label)+'</option>';
            }).join('');
        })
        .withFailureHandler(function(e){ grnItemSelect.innerHTML = '<option value="">(load failed)</option>'; toast('Item load failed: '+(e.message||e),'error'); })
        .getGRNItems(grnSelect.value);
    });

    grnItemSelect.addEventListener('change', function(){
      var it = currentItems[Number(grnItemSelect.value)];
      if (!it) { grnQtyHint.textContent = ''; lotInput.value=''; matInput.value=''; qtyInput.value=''; refreshCheckState(); return; }
      lotInput.value = it.batchNo || '';        // lot id = GRN batch
      matInput.value = it.materialCode || '';
      var grnQty = it.qtyReceived || it.qtyOrdered || 0;
      qtyInput.value = grnQty || '';            // prefill with GRN qty (editable)
      grnQtyHint.textContent = 'GRN: ' + grnQty + (it.unit ? ' ' + it.unit : '');
      refreshCheckState();
    });

    // ---------- Lot input + check + confirm ----------
    var lotInput = document.getElementById('lotInput');
    var matInput = document.getElementById('matInput');
    var qtyInput = document.getElementById('qtyInput');
    var checkBtn = document.getElementById('checkBtn');
    [lotInput, matInput, qtyInput].forEach(function(el){ el.addEventListener('input', refreshCheckState); });

    function refreshCheckState(){
      var ok = operator && selectedLoc && lotInput.value.trim().length;
      if (selectedLoc === GATE_IN) ok = ok && matInput.value.trim().length && Number(qtyInput.value) > 0;
      checkBtn.disabled = !ok;
    }

    function hideConfirm(){ document.getElementById('confirmCard').classList.add('hidden'); }

    checkBtn.addEventListener('click', function(){
      if (checkBtn.disabled) return;
      var lotId = lotInput.value.trim();
      checkBtn.disabled = true; checkBtn.textContent = 'Checking…';
      google.script.run
        .withSuccessHandler(function(look){
          checkBtn.disabled = false; checkBtn.textContent = 'Check lot';
          if (!look) { toast('Lookup failed','error'); return; }
          showConfirm(look, lotId);
        })
        .withFailureHandler(function(e){
          checkBtn.disabled = false; checkBtn.textContent = 'Check lot';
          toast('Lookup failed: '+(e.message||e),'error');
        })
        .lookupLotForScan(lotId, selectedLoc);
    });

    function showConfirm(look, lotId){
      var card = document.getElementById('confirmCard');
      var txt = document.getElementById('confirmText');
      var confirmBtn = document.getElementById('confirmBtn');
      if (selectedLoc === GATE_IN) {
        // Gate-In: receive uses typed qty/material; show that.
        if (!look.ok && look.blockReason) { txt.innerHTML = '<span style="color:#f59e0b;">'+escapeHtml(look.blockReason)+'</span>'; confirmBtn.style.display='none'; }
        else { txt.innerHTML = 'Receive <b>'+escapeHtml(qtyInput.value)+'</b> of <b>'+escapeHtml(matInput.value)+'</b><br>lot '+escapeHtml(lotId)+' → Gate-In'; confirmBtn.style.display=''; }
      } else if (!look.ok) {
        txt.innerHTML = '<span style="color:#f59e0b;">'+escapeHtml(look.blockReason||'Not allowed')+'</span>';
        confirmBtn.style.display = 'none';
      } else {
        txt.innerHTML = escapeHtml(look.preview || 'Proceed?');
        confirmBtn.style.display = '';
      }
      card.classList.remove('hidden');
    }

    document.getElementById('cancelBtn').addEventListener('click', hideConfirm);

    document.getElementById('confirmBtn').addEventListener('click', function(){
      if (!operator || !selectedLoc) return;
      var lotId = lotInput.value.trim();
      if (!lotId) return;
      var btn = this; btn.disabled = true; btn.textContent='Saving…';
      var t0 = Date.now();
      var payload = { operator: operator.name, locationId: selectedLoc, lotId: lotId, confirmed: true };
      if (selectedLoc === GATE_IN) { payload.qty = Number(qtyInput.value) || 0; payload.materialCode = matInput.value.trim(); }
      google.script.run
        .withSuccessHandler(function(res){
          recordWifi('OK', Date.now()-t0);
          addRecent(res);
          var msg = res.action === 'RECEIVE' ? ('Received '+res.qtyMoved+' · '+lotId)
                  : res.action === 'SHIP'    ? ('Dispatched '+res.qtyMoved+' · '+lotId)
                  : ('Moved '+res.qtyMoved+' → '+res.toLocation);
          toast(msg, 'ok');
          lotInput.value=''; matInput.value=''; qtyInput.value='';
          btn.disabled=false; btn.textContent='Confirm'; hideConfirm(); refreshCheckState();
        })
        .withFailureHandler(function(e){
          recordWifi('ERROR', Date.now()-t0);
          toast('Scan failed: '+(e.message||e),'error');
          btn.disabled=false; btn.textContent='Confirm';
        })
        .recordScan(payload);
    });

    function addRecent(res){
      recent.unshift(res);
      if (recent.length > 5) recent.pop();
      var html = recent.map(function(r){
        var t = (r.ts || '').slice(11,16); // HH:MM
        return '<div class="recent-row"><div><span class="verb">'+r.verb+'</span> &nbsp;<span class="lot">'+escapeHtml(r.lotId||'')+'</span></div><div class="ts">'+t+'</div></div>';
      }).join('');
      document.getElementById('recent').innerHTML = html || '<div style="color:#64748b;padding:8px 0;">No scans yet.</div>';
    }
    function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

    // ---------- Toast ----------
    var toastEl = document.getElementById('toast'); var toastTimer = 0;
    function toast(msg, kind){
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (kind==='error'?' error':kind==='warn'?' warn':'');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toastEl.className='toast'; }, 2200);
    }

    // ---------- Wi-Fi heartbeat ----------
    var wifiTimer = 0, wifiFailStreak = 0;
    function startWifiHeartbeat(){
      if (wifiTimer) clearInterval(wifiTimer);
      probeOnce();
      wifiTimer = setInterval(probeOnce, 60000);
    }
    function stopWifiHeartbeat(){ if (wifiTimer) clearInterval(wifiTimer); wifiTimer=0; }
    function probeOnce(){
      var t0 = Date.now(), to = setTimeout(function(){ markWifi('TIMEOUT', 10000); }, 10000);
      google.script.run
        .withSuccessHandler(function(){ clearTimeout(to); markWifi('OK', Date.now()-t0); })
        .withFailureHandler(function(){ clearTimeout(to); markWifi('ERROR', Date.now()-t0); })
        .pingScan();
    }
    function markWifi(status, ms){
      var dot = document.getElementById('wifiDot'), text = document.getElementById('wifiText');
      if (status === 'OK') {
        wifiFailStreak = 0;
        dot.className = 'wifi-dot' + (ms > 3000 ? ' warn' : '');
        text.textContent = (ms > 3000 ? 'Slow' : 'OK') + ' · ' + ms + 'ms';
      } else {
        wifiFailStreak++;
        dot.className = 'wifi-dot bad';
        text.textContent = 'Offline (' + status.toLowerCase() + ')';
      }
      recordWifi(status, ms);
    }
    function recordWifi(status, ms){
      if (!operator || !selectedLoc) return;
      google.script.run.recordWifiProbe({ locationId: selectedLoc, latency_ms: ms, status: status });
    }
  </script>
</body>
</html>
