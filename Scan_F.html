  <style>
    body { font-family:'Plus Jakarta Sans',sans-serif; background:#0f172a; color:#f8fafc; margin:0; min-height:100dvh; -webkit-tap-highlight-color:transparent; }
    .wrap { max-width:520px; margin:0 auto; padding:16px; }

    h1 { font-size:18px; margin:0 0 8px 0; font-weight:700; }

    .pin-display { font-size:36px; letter-spacing:18px; text-align:center; padding:16px; background:#0f172a; border-radius:8px; margin-bottom:12px; min-height:48px; font-weight:700; color:#f8fafc; }

    .who-name { font-weight:700; font-size:16px; }
    .who-meta { font-size:12px; color:#94a3b8; }

    .chokepoint .label { display:block; font-size:11px; opacity:0.7; }

    .recent-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #334155; }
    .recent-row:last-child { border-bottom:none; }
    .recent-row .verb { font-weight:700; color:#10b981; }

<body>
  <div class="wrap">
    <!-- PIN GATE -->
    <div id="gate" class="card">
      <h1>Pack Masters Scan</h1>
      <h2>Enter your PIN</h2>
      <div id="pinDisplay" class="pin-display"></div>
      <div class="keypad">
        <button class="key" data-d="1">1</button>
        <button class="key" data-d="2">2</button>
        <button class="key" data-d="3">3</button>
        <button class="key" data-d="4">4</button>
        <button class="key" data-d="5">5</button>
        <button class="key" data-d="6">6</button>
        <button class="key" data-d="7">7</button>
        <button class="key" data-d="8">8</button>
        <button class="key" data-d="9">9</button>
        <button class="key danger" id="pinClr">clr</button>
        <button class="key" data-d="0">0</button>
        <button class="key action" id="pinOk">OK</button>
      </div>
    </div>

    <!-- MAIN UI (hidden until login) -->
    <div id="main" class="hidden">
      <div class="card">
        <div class="who">
          <div>
            <div class="who-name" id="whoName">—</div>
            <div class="who-meta" id="whoMeta">—</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <span class="wifi-pill"><span id="wifiDot" class="wifi-dot"></span><span id="wifiText">Wi-Fi</span></span>
            <button class="logout" id="logoutBtn">Logout</button>
          </div>
        </div>

        <h2>Step 1 — Tap the chokepoint sticker name</h2>
        <div class="chokepoint-grid">
          <button class="chokepoint" data-loc="LOC|GATE-IN"><span class="verb">RECEIVE</span><span class="label">Gate-In</span></button>
          <button class="chokepoint" data-loc="LOC|GATE-OUT"><span class="verb">SHIP</span><span class="label">Gate-Out</span></button>
          <button class="chokepoint" data-loc="LOC|FLOOR-1-IN"><span class="verb">UP-1</span><span class="label">1st-Floor-In</span></button>
          <button class="chokepoint" data-loc="LOC|FLOOR-2-IN"><span class="verb">UP-2</span><span class="label">2nd-Floor-In</span></button>
        </div>
      </div>

      <div class="card">
        <h2>Step 2 — Type/scan the lot ID</h2>
        <input type="text" id="lotInput" class="lot-input" placeholder="e.g. PM/GRN/2026-0123  or supplier batch" autocomplete="off" autocapitalize="characters">
        <button id="submitBtn" class="btn-primary" disabled>Record scan</button>
      </div>

      <div class="card">
        <h2>Recent scans (last 5)</h2>
        <div id="recent" class="recent"><div style="color:#64748b;padding:8px 0;">No scans yet.</div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    var operator = null;       // {pin, displayName, role, shift}
    var selectedLoc = null;
    var recent = [];

    // ---------- PIN flow ----------
    var pinBuf = '';
    var pinDisplay = document.getElementById('pinDisplay');
    function renderPin(){ pinDisplay.textContent = pinBuf.replace(/./g,'•'); }
    document.querySelectorAll('.key[data-d]').forEach(function(b){
      b.addEventListener('click', function(){
        if (pinBuf.length >= 6) return;
        pinBuf += b.getAttribute('data-d');
        renderPin();
      });
    });
    document.getElementById('pinClr').addEventListener('click', function(){ pinBuf=''; renderPin(); });
    document.getElementById('pinOk').addEventListener('click', tryLogin);

    function tryLogin(){
      if (pinBuf.length < 3) { toast('PIN too short','error'); return; }
      google.script.run
        .withSuccessHandler(function(op){
          if (!op) { toast('Unknown PIN','error'); pinBuf=''; renderPin(); return; }
          operator = op;
          document.getElementById('whoName').textContent = op.displayName;
          document.getElementById('whoMeta').textContent = (op.role||'') + ' · ' + (op.shift||'') + ' shift';
          document.getElementById('gate').classList.add('hidden');
          document.getElementById('main').classList.remove('hidden');
          startWifiHeartbeat();
        })
        .withFailureHandler(function(e){ toast('Login error: '+e.message,'error'); })
        .resolveOperator(pinBuf);
    }

    document.getElementById('logoutBtn').addEventListener('click', function(){
      operator = null; selectedLoc = null; pinBuf=''; renderPin();
      document.getElementById('main').classList.add('hidden');
      document.getElementById('gate').classList.remove('hidden');
      stopWifiHeartbeat();
    });

    // ---------- Chokepoint selection ----------
    document.querySelectorAll('.chokepoint').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('.chokepoint').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        selectedLoc = b.getAttribute('data-loc');
        refreshSubmitState();
      });
    });

    // ---------- Lot input + submit ----------
    var lotInput = document.getElementById('lotInput');
    lotInput.addEventListener('input', refreshSubmitState);
    function refreshSubmitState(){
      document.getElementById('submitBtn').disabled = !(operator && selectedLoc && lotInput.value.trim().length);
    }

    document.getElementById('submitBtn').addEventListener('click', function(){
      if (!operator || !selectedLoc) return;
      var lotId = lotInput.value.trim();
      if (!lotId) return;
      var btn = this; btn.disabled = true; btn.textContent='Saving…';
      var t0 = Date.now();
      google.script.run
        .withSuccessHandler(function(res){
          var dt = Date.now() - t0;
          recordWifi('OK', dt);
          addRecent(res);
          toast('Scanned: ' + res.verb + ' · ' + lotId, 'ok');
          lotInput.value=''; btn.disabled=false; btn.textContent='Record scan';
          // Keep chokepoint selected — typical use is multiple scans at the same doorway
        })
        .withFailureHandler(function(e){
          recordWifi('ERROR', Date.now()-t0);
          toast('Scan failed: '+(e.message||e),'error');
          btn.disabled=false; btn.textContent='Record scan';
        })
        .recordScan({ pin: operator.pin, locationId: selectedLoc, lotId: lotId });
    });

    function addRecent(res){
      recent.unshift(res);
      if (recent.length > 5) recent.pop();
      var html = recent.map(function(r){
        var t = (r.ts || '').slice(11,16); // HH:MM
        return '<div class="recent-row"><div><span class="verb">'+r.verb+'</span> &nbsp;<span class="lot">'+escapeHtml(r.lotId||'')+'</span></div><div class="ts">'+t+'</div></div>';
      }).join('');
      document.getElementById('recent').innerHTML = html || '<div style="color:#64748b;padding:8px 0;">No scans yet.</div>';
    }
    function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

    // ---------- Toast ----------
    var toastEl = document.getElementById('toast'); var toastTimer = 0;
    function toast(msg, kind){
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (kind==='error'?' error':kind==='warn'?' warn':'');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toastEl.className='toast'; }, 2200);
    }

    // ---------- Wi-Fi heartbeat ----------
    var wifiTimer = 0, wifiFailStreak = 0;
    function startWifiHeartbeat(){
      if (wifiTimer) clearInterval(wifiTimer);
      probeOnce();
      wifiTimer = setInterval(probeOnce, 60000);
    }
    function stopWifiHeartbeat(){ if (wifiTimer) clearInterval(wifiTimer); wifiTimer=0; }
    function probeOnce(){
      var t0 = Date.now(), to = setTimeout(function(){ markWifi('TIMEOUT', 10000); }, 10000);
      google.script.run
        .withSuccessHandler(function(){ clearTimeout(to); markWifi('OK', Date.now()-t0); })
        .withFailureHandler(function(){ clearTimeout(to); markWifi('ERROR', Date.now()-t0); })
        .pingScan();
    }
    function markWifi(status, ms){
      var dot = document.getElementById('wifiDot'), text = document.getElementById('wifiText');
      if (status === 'OK') {
        wifiFailStreak = 0;
        dot.className = 'wifi-dot' + (ms > 3000 ? ' warn' : '');
        text.textContent = (ms > 3000 ? 'Slow' : 'OK') + ' · ' + ms + 'ms';
      } else {
        wifiFailStreak++;
        dot.className = 'wifi-dot bad';
        text.textContent = 'Offline (' + status.toLowerCase() + ')';
      }
      recordWifi(status, ms);
    }
    function recordWifi(status, ms){
      if (!operator || !selectedLoc) return;
      google.script.run.recordWifiProbe({ pin: operator.pin, locationId: selectedLoc, latency_ms: ms, status: status });
    }
  </script>
</body>
</html>
