  <meta charset="UTF-8">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <style>
    /* Arbitrary-value SPACING utilities do not exist in this project's static
       Tailwind block (no JIT), so they silently resolve to 0 and content slid
       under the fixed header / sticky footer. Declared as real CSS here.
       Verified in-browser: a probe div with pt-[96px] computes to 0px. */
    body      { padding-bottom: 80px; }
    #ncrMain  { margin-top: 56px; padding-top: 60px; }

    body {
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: max(884px, 100dvh);
    }
    /* Compact responsive list (bundle lacks md: grid utils, so plain CSS).
       NCR is a list view — flow the cards in a multi-column grid on desktop. */
    #ncrMain { max-width: 32rem; }
    @media (min-width: 768px) {
      /* 960px matches the filter tab bar above and every other QMS screen.
         The 2-col card grid is KEPT — NCR is a triage list, not a form. */
      #ncrMain { max-width: 960px; }
      #ncrBody { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    @media (min-width: 1100px) {
      #ncrBody { grid-template-columns: repeat(3, 1fr); }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Status / source chip colours */
    .status-open        { background-color: #f97316; }
    .status-in-progress { background-color: #2563eb; }
    .status-closed      { background-color: #6b7280; }
    .source-chip        { background-color: #1e3a5f; }

    /* Busy overlay */
    .ncr-busy { opacity: 0.45; pointer-events: none; }

    /* Hide scrollbar for filter chips */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Toast */
    #toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%);
      background: #1e3a5f; color: white;
      padding: 10px 20px; border-radius: 9999px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.22);
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none; z-index: 400;
      white-space: nowrap;
    }
    #toast.show     { opacity: 1; }
    #toast.err      { background: #c1334b; }
    /* ── Touch targets ────────────────────────────────────────────────────
       DESIGN.md mandates 48px minimum for gloved shop-floor use. Measured at
       390px: the status filter tabs were 32px, the back button 40px, and the
       NCR disposition buttons 44px. Disposition is an irreversible decision
       (scrap / supplier-return), so it gets the full 48px.
       h-[32px]/h-[44px] are inline utilities, so these need the same
       specificity or higher — hence the id/class scoping. */
    #ncrFilterTabs .ncr-tab { min-height: 48px; }
    header button.w-10 { width: 48px; height: 48px; }
    /* Disposition actions: 48px tall. These are IRREVERSIBLE decisions
       (scrap / supplier-return sit beside use-as-is), so they get the full
       gloved minimum rather than 44px. */
    .ncr-disp-btn { min-height: 48px; }
    /* "Verified — Close NCR" is the terminal action on a nonconformance and
       measured 44px (its h-[44px] utility is not in the static bundle). It is
       JS-built with no id, so it is targeted by its onclick handler. */
    button[onclick^="showCloseModal"] { min-height: 48px; }

    /* Desktop pointer: shrink back to a compact toolbar. */
    @media (min-width: 900px) and (pointer: fine) {
      #ncrFilterTabs .ncr-tab { min-height: 32px; }
      header button.w-10 { width: 40px; height: 40px; }
      .ncr-disp-btn { min-height: 38px; }
    }
  </style>

<script>
  /* ─────────────────────────── STATE ─────────────────────────── */
  var DISPOSITIONS = [];
  var WHO = '';
  var pendingCloseDocNo = null;
  var ALL_NCRS = [];
  var activeFilter = 'ALL';

  /* ─────────────────────────── INIT ──────────────────────────── */
  function init() {
    google.script.run
      .withSuccessHandler(function(d) { DISPOSITIONS = d; })
      .getNCRDispositions();

    // Session.getActiveUser is server-only; in a web app client context it's
    // undefined. Use the operator name set by OperatorPicker / QMS pill so
    // the Disposition By / Closed By audit columns are not blank.
    try {
      if (window.QMS && typeof window.QMS.getOperatorName === 'function') {
        WHO = window.QMS.getOperatorName() || '';
      }
    } catch(e) {}

    loadList();
  }

  /* ─────────────────────────── FILTER TABS ───────────────────── */
  function setFilter(f) {
    activeFilter = f;
    document.querySelectorAll('.ncr-tab').forEach(function(btn) {
      var isActive = btn.dataset.filter === f;
      btn.className = 'ncr-tab flex-shrink-0 h-[32px] px-4 text-[12px] font-semibold rounded-full transition-all ' +
        (isActive ? 'bg-[#1e3a5f] text-white' : 'bg-[#f1f5f9] text-[#64748b] hover:text-[#1e3a5f]');
    });
    var filtered = f === 'ALL' ? ALL_NCRS : ALL_NCRS.filter(function(r) { return r.status === f; });
    renderList(filtered);
  }

  /* ─────────────────────────── LOAD ──────────────────────────── */
  function maybeAutoOpen() {
    try {
      var d = sessionStorage.getItem('pmAutoOpenDoc');
      if (d) {
        sessionStorage.removeItem('pmAutoOpenDoc');
        var hit = ALL_NCRS.find(function(r) { return r.docNo === d; });
        if (hit) {
          // Wait one tick so the card is in the DOM
          setTimeout(function() { showDetail(d); }, 50);
        }
      }
    } catch (e) {}
  }
  function onLoaded(rows) { ALL_NCRS = rows; renderList(rows); maybeAutoOpen(); }
  function loadList() {
    var runner = google.script.run
      .withFailureHandler(function(e) {
        google.script.run
          .withSuccessHandler(onLoaded)
          .withFailureHandler(function(e2) { toast('Load failed: ' + e2.message, true); })
          .getOpenNCRs();
      });
    if (typeof runner.getAllNCRs === 'function') {
      runner.withSuccessHandler(onLoaded).getAllNCRs();
    } else {
      google.script.run
        .withSuccessHandler(onLoaded)
        .withFailureHandler(function(e) { toast('Load failed: ' + e.message, true); })
        .getOpenNCRs();
    }
  }

  /* ─────────────────────────── RENDER ────────────────────────── */
  function renderList(rows) {
    var body = document.getElementById('ncrBody');
    document.getElementById('ncrCountBadge').textContent = rows.length;

    if (!rows || rows.length === 0) {
      body.innerHTML =
        '<div class="flex flex-col items-center justify-center py-20 text-[#94a3b8]">' +
          '<span class="material-symbols-outlined text-[56px] mb-3 opacity-40" ' +
                'style="font-variation-settings:\'FILL\' 1;">check_circle</span>' +
          '<p class="text-[14px] font-semibold">No NCRs found</p>' +
          '<p class="text-[12px] mt-1 opacity-70">Nothing matches the current filter.</p>' +
        '</div>';
      return;
    }

    var html = rows.map(function(r) {
      var isInProgress = r.status === 'IN_PROGRESS';
      var isClosed     = r.status === 'CLOSED';
      var statusLabel  = isInProgress ? 'IN PROGRESS' : (isClosed ? 'CLOSED' : 'OPEN');
      var statusCls    = isInProgress ? 'status-in-progress' : (isClosed ? 'status-closed' : 'status-open');

      /* Disposition buttons */
      var actionsHtml;
      if (isClosed) {
        // CLOSED records show neither disposition picker nor a Close button —
        // closeNCR will reject any attempt server-side, so we hide it client-side too.
        actionsHtml = '';
      } else if (isInProgress) {
        actionsHtml =
          '<button class="w-full h-[44px] bg-[#1e3a5f] text-white ' +
                  'font-semibold text-[13px] rounded-lg hover:bg-[#162d4a] ' +
                  'transition-colors active:scale-[0.98]" ' +
                  'onclick="showCloseModal(\'' + esc(r.docNo) + '\')">' +
            '<span class="material-symbols-outlined text-[16px] align-middle mr-1">verified</span>' +
            'Close NCR — verify &amp; sign off' +
          '</button>';
      } else {
        var btnCount = DISPOSITIONS.length;
        actionsHtml = '<div class="grid gap-2" style="grid-template-columns:repeat(' +
          Math.min(btnCount, 3) + ',1fr)">';
        actionsHtml += DISPOSITIONS.map(function(d, i) {
          /* If 5 dispositions, last one spans full row (matching original logic) */
          var extraCls = (btnCount === 5 && i === 4) ? ' col-span-3' : '';
          /* ncr-disp-btn carries the 48px touch minimum in CSS. h-[44px] is an
             arbitrary utility absent from the static Tailwind bundle, so it
             never applied — the observed height came from padding alone. */
          return '<button class="ncr-disp-btn h-[44px] rounded-lg border-2 border-[#d1d5db] text-[#374151] ' +
                          'font-medium text-[13px] transition-colors hover:border-[#0ea5e9] ' +
                          'hover:text-[#0ea5e9] active:scale-[0.97]' + extraCls + '" ' +
                          'onclick="pick(\'' + esc(r.docNo) + '\',\'' + esc(d) + '\')">' +
                   esc(d) +
                 '</button>';
        }).join('');
        actionsHtml += '</div>';
      }

      /* Defect icon: in-progress = warning, open = error */
      var defectIcon     = isInProgress ? 'warning'      : 'error';
      var defectIconColor= isInProgress ? 'text-[#f59e0b]': 'text-[#ef4444]';

      /* Disposition info row (only for in-progress) */
      var dispoRow = '';
      if (isInProgress) {
        var dispoText = r.disposition || '—';
        if (r.dispositionBy) dispoText += ' — ' + r.dispositionBy;
        if (r.dispositionAt) dispoText += ' (' + r.dispositionAt + ')';
        dispoRow = detailRow('Disposition', dispoText);
        if (r.capaRef) dispoRow += detailRow('CAPA Ref', r.capaRef);
      }

      return '' +
        '<div class="bg-white rounded-[12px] p-4 border border-[#e2e8f0] ' +
              'shadow-[0_2px_8px_rgba(0,0,0,0.08)] relative overflow-hidden cursor-pointer ' +
              (isInProgress ? 'border-l-4 border-l-[#2563eb]' : isClosed ? 'border-l-4 border-l-[#6b7280]' : 'border-l-4 border-l-[#f97316]') + '" ' +
             'id="card-' + esc(r.docNo) + '" ' +
             'onclick="if(!event.target.closest(\'button\'))showDetail(\'' + esc(r.docNo) + '\')">' +

          /* Header row */
          '<div class="flex justify-between items-start mb-3">' +
            '<div class="flex flex-col gap-1">' +
              '<span class="font-headline text-[15px] font-bold text-[#1e3a5f] tracking-tight">' +
                esc(r.docNo) +
              '</span>' +
              '<div class="flex items-center gap-2 mt-0.5">' +
                '<span class="source-chip rounded-full px-3 py-1 text-[11px] font-bold text-white ' +
                             'leading-none tracking-wider">' +
                  esc(r.source) +
                '</span>' +
                '<span class="' + statusCls + ' rounded-full px-3 py-1 text-[11px] font-bold ' +
                             'text-white leading-none tracking-wider">' +
                  statusLabel +
                '</span>' +
              '</div>' +
            '</div>' +
            '<span class="text-[12px] text-[#64748b] font-medium">' + esc(r.date) + '</span>' +
          '</div>' +

          /* Material / batch details */
          '<div class="flex flex-col gap-1.5 mb-3">' +
            '<p class="text-[14px] font-medium text-[#374151]">' + esc(r.materialDesc || '—') + '</p>' +
            '<div class="flex items-center gap-1.5 text-[12px] text-[#64748b]">' +
              '<span class="material-symbols-outlined text-[14px]">inventory_2</span>' +
              '<span>Batch: <span class="font-medium text-[#374151]">' + esc(r.batchNo || '—') + '</span></span>' +
            '</div>' +
            (r.qtyAffected
              ? '<div class="flex items-center gap-1.5 text-[12px] text-[#64748b]">' +
                  '<span class="material-symbols-outlined text-[14px]">scale</span>' +
                  '<span>Qty: <span class="font-medium text-[#374151]">' + esc(r.qtyAffected) + '</span></span>' +
                '</div>'
              : '') +
            (r.sourceRef
              ? '<div class="flex items-center gap-1.5 text-[12px] text-[#64748b]">' +
                  '<span class="material-symbols-outlined text-[14px]">link</span>' +
                  '<span class="font-medium text-[#0ea5e9]">' + esc(r.sourceRef) + '</span>' +
                '</div>'
              : '') +
          '</div>' +

          /* Disposition rows (in-progress only) */
          (dispoRow
            ? '<div class="bg-slate-50 rounded-lg p-3 mb-3 text-[12px] space-y-1.5">' + dispoRow + '</div>'
            : '') +

          /* Defect description */
          (r.defectDesc
            ? '<div class="mt-0 pt-3 border-t border-slate-100 flex items-start gap-2 mb-3">' +
                '<span class="material-symbols-outlined ' + defectIconColor + ' text-[16px] mt-0.5">' +
                  defectIcon +
                '</span>' +
                '<p class="text-[13px] text-[#64748b] leading-relaxed">' + esc(r.defectDesc) + '</p>' +
              '</div>'
            : '<div class="border-t border-slate-100 mb-3"></div>') +

          /* Action buttons */
          '<div>' + actionsHtml + '</div>' +

        '</div>';
    }).join('');

    body.innerHTML = html;
  }

  /* ─────────────────── DETAIL ROW HELPER ─────────────────────── */
  function detailRow(label, value) {
    if (value === '' || value === null || value === undefined) value = '—';
    return '<div class="flex justify-between items-start">' +
             '<span class="text-[12px] text-[#64748b] font-medium">' + esc(label) + '</span>' +
             '<span class="text-[12px] text-[#374151] font-semibold text-right ml-4">' + esc(value) + '</span>' +
           '</div>';
  }

  /* ─────────────────── CLOSE MODAL ───────────────────────────── */
  function showCloseModal(docNo) {
    pendingCloseDocNo = docNo;
    document.getElementById('closeDocNo').textContent = docNo;
    document.getElementById('closeCapaRef').value  = '';
    document.getElementById('closeEffective').value = '';
    document.getElementById('closeNotes').value    = '';
    var m = document.getElementById('closeModal');
    m.classList.remove('hidden');
    m.classList.add('flex');
  }
  function hideCloseModal() {
    var m = document.getElementById('closeModal');
    m.classList.add('hidden');
    m.classList.remove('flex');
    pendingCloseDocNo = null;
  }
  function submitClose() {
    if (!pendingCloseDocNo) return;
    var eff = document.getElementById('closeEffective').value;
    if (!eff)           { toast('Pick an effectiveness check result.', true); return; }
    if (eff === 'FAIL') { toast('FAIL means NCR stays open — re-do CAPA.', true); return; }

    var payload = {
      capaRef:       document.getElementById('closeCapaRef').value.trim(),
      effectiveness: eff,
      notes:         document.getElementById('closeNotes').value.trim(),
      closedBy:      WHO
    };
    var btn = document.getElementById('closeSubmit');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        if (res && res.success) {
          toast('NCR ' + pendingCloseDocNo + ' closed.');
          var card = document.getElementById('card-' + pendingCloseDocNo);
          if (card) card.remove();
          hideCloseModal();
          var remaining = document.querySelectorAll('[id^="card-"]').length;
          document.getElementById('ncrCountBadge').textContent = remaining;
          if (remaining === 0) renderList([]);
        } else {
          toast('Error: ' + (res && res.error || 'unknown'), true);
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false;
        toast('Failed: ' + e.message, true);
      })
      .closeNCR(pendingCloseDocNo, payload);
  }

  /* ─────────────────── DISPOSITION PICK ──────────────────────── */
  function pick(docNo, dispo) {
    var card = document.getElementById('card-' + docNo);
    if (card) card.classList.add('ncr-busy');

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          toast(docNo + ' → ' + dispo);
          if (card) card.remove();
          var remaining = document.querySelectorAll('[id^="card-"]').length;
          document.getElementById('ncrCountBadge').textContent = remaining;
          if (remaining === 0) renderList([]);
        } else {
          if (card) card.classList.remove('ncr-busy');
          toast('Error: ' + (res && res.error || 'unknown'), true);
        }
      })
      .withFailureHandler(function(e) {
        if (card) card.classList.remove('ncr-busy');
        toast('Failed: ' + e.message, true);
      })
      .setNCRDisposition(docNo, dispo, WHO);
  }

  /* ─────────────────── UTILITIES ─────────────────────────────── */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function toast(msg, isErr) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (isErr ? ' err' : '');
    setTimeout(function() { t.className = isErr ? 'err' : ''; }, 2800);
  }

  /* ─────────────────── DETAIL BOTTOM SHEET (fix #19) ─────────── */
  var detailDocNo = null;

  function showDetail(docNo) {
    var r = ALL_NCRS.find(function(x){ return x.docNo === docNo; });
    if (!r) { toast('Record not found', true); return; }
    detailDocNo = docNo;

    document.getElementById('dtlDocNo').textContent = r.docNo;
    document.getElementById('dtlMeta').textContent =
      (r.date || '—') + ' · ' + (r.source || 'NCR');

    /* Chips */
    var isInProgress = r.status === 'IN_PROGRESS';
    var isClosed = r.status === 'CLOSED';
    var statusLabel = isInProgress ? 'IN PROGRESS' : (isClosed ? 'CLOSED' : 'OPEN');
    var statusCls = isInProgress ? 'status-in-progress' : (isClosed ? 'status-closed' : 'status-open');
    document.getElementById('dtlChips').innerHTML =
      '<span class="source-chip rounded-full px-3 py-1 text-[11px] font-bold text-white tracking-wider">' + esc(r.source || '') + '</span>' +
      '<span class="' + statusCls + ' rounded-full px-3 py-1 text-[11px] font-bold text-white tracking-wider">' + statusLabel + '</span>';

    /* Doc fields */
    var docFields = [
      ['Material',  r.materialDesc],
      ['Batch No',  r.batchNo],
      ['Qty Affected', r.qtyAffected],
      ['Source Ref', r.sourceRef],
      ['Defect',    r.defectDesc],
      ['Raised By', r.raisedBy],
      ['Raised At', r.raisedAt || r.date]
    ];
    document.getElementById('dtlDocFields').innerHTML =
      docFields.map(function(f){ return detailRow(f[0], f[1]); }).join('');

    /* Disposition fields */
    var dispoFields = [
      ['Disposition',    r.disposition],
      ['Disposition By', r.dispositionBy],
      ['Disposition At', r.dispositionAt],
      ['CAPA Ref',       r.capaRef],
      ['Effectiveness',  r.effectiveness],
      ['Closure Notes',  r.closureNotes]
    ];
    document.getElementById('dtlDispoFields').innerHTML =
      dispoFields.map(function(f){ return detailRow(f[0], f[1]); }).join('');

    /* Photos */
    var photos = r.photos || r.photoUrls || [];
    var photosEl = document.getElementById('dtlPhotos');
    if (photos.length) {
      photosEl.innerHTML = photos.map(function(p){
        var url = typeof p === 'string' ? p : (p.url || '');
        return '<a href="' + esc(url) + '" target="_blank" class="block w-[72px] h-[72px] rounded-lg overflow-hidden border border-[#e2e8f0]">' +
               '<img src="' + esc(url) + '" alt="evidence" class="w-full h-full object-cover"/></a>';
      }).join('');
    } else {
      photosEl.innerHTML = '<span class="text-[12px] text-[#94a3b8] italic">No photos uploaded yet.</span>';
    }

    /* Timeline */
    var events = [];
    if (r.raisedAt || r.date) events.push({ when: r.raisedAt || r.date, who: r.raisedBy || '—', label: 'NCR raised', color: '#f97316' });
    if (r.dispositionAt)      events.push({ when: r.dispositionAt, who: r.dispositionBy || '—', label: 'Disposition: ' + (r.disposition || '—'), color: '#2563eb' });
    if (r.closedAt)           events.push({ when: r.closedAt, who: r.closedBy || '—', label: 'NCR closed', color: '#6b7280' });
    var timelineEl = document.getElementById('dtlTimeline');
    if (events.length) {
      timelineEl.innerHTML = events.map(function(ev){
        return '<li class="relative">' +
          '<span class="absolute -left-[22px] top-1 w-3 h-3 rounded-full border-2 border-white" style="background:' + ev.color + '"></span>' +
          '<div class="text-[12px] font-semibold text-[#0f172a]">' + esc(ev.label) + '</div>' +
          '<div class="text-[11px] text-[#64748b]">' + esc(ev.when) + ' · ' + esc(ev.who) + '</div>' +
        '</li>';
      }).join('');
    } else {
      timelineEl.innerHTML = '<li class="text-[12px] text-[#94a3b8] italic">No events.</li>';
    }

    /* Footer: show "Close NCR" only when IN_PROGRESS */
    var closeBtn = document.getElementById('dtlCloseNcrBtn');
    if (isInProgress) closeBtn.classList.remove('hidden');
    else closeBtn.classList.add('hidden');

    var sheet = document.getElementById('detailSheet');
    sheet.classList.remove('hidden');
    sheet.classList.add('flex');
  }

  function hideDetail() {
    var sheet = document.getElementById('detailSheet');
    sheet.classList.add('hidden');
    sheet.classList.remove('flex');
    detailDocNo = null;
  }
  window.showDetail = showDetail;
  window.hideDetail = hideDetail;

  function closeNcrFromDetail() {
    if (!detailDocNo) return;
    var docNo = detailDocNo;
    hideDetail();
    showCloseModal(docNo);
  }
  window.closeNcrFromDetail = closeNcrFromDetail;

  // Photo upload — base64 to Drive via uploadNCRPhoto
  document.addEventListener('change', function(e){
    if (!e.target || e.target.id !== 'dtlPhotoUpload') return;
    if (!detailDocNo) { toast('Open an NCR first.', true); return; }
    var files = e.target.files || [];
    if (!files.length) return;
    var docNo = detailDocNo;
    Array.prototype.forEach.call(files, function(f){
      var reader = new FileReader();
      reader.onload = function(ev){
        var b64 = (ev.target.result || '').split(',')[1] || '';
        if (!b64) return;
        google.script.run
          .withSuccessHandler(function(res){
            if (res && res.success) {
              toast('Photo uploaded.');
              // Re-render the photos block in-place
              var photos = res.photos || [];
              var photosEl = document.getElementById('dtlPhotos');
              photosEl.innerHTML = photos.map(function(url){
                return '<a href="' + esc(url) + '" target="_blank" class="block w-[72px] h-[72px] rounded-lg overflow-hidden border border-[#e2e8f0]">' +
                       '<img src="' + esc(url) + '" alt="evidence" class="w-full h-full object-cover"/></a>';
              }).join('');
              // Also patch ALL_NCRS so subsequent opens show the upload
              for (var i = 0; i < ALL_NCRS.length; i++) {
                if (ALL_NCRS[i].docNo === docNo) { ALL_NCRS[i].photos = photos; break; }
              }
            } else {
              toast('Upload failed: ' + (res && res.error || 'unknown'), true);
            }
          })
          .withFailureHandler(function(err){ toast('Upload failed: ' + err.message, true); })
          .uploadNCRPhoto({ ncrDocNo: docNo, base64: b64, filename: f.name, mimeType: f.type || 'image/jpeg' });
      };
      reader.readAsDataURL(f);
    });
    e.target.value = '';
  });

  /* ─────────────────── NAV ────────────────────────────────────── */
  function ncrGoto(formName) {
    google.script.run
      .withSuccessHandler(function(html) { document.open(); document.write(html); document.close(); })
      .withFailureHandler(function() { toast('Could not open ' + formName, true); })
      .getFormHtml(formName);
  }
  window.ncrGoto = ncrGoto;

  function ncrShowMore() {
    var existing = document.getElementById('ncrMoreSheet');
    if (existing) { existing.remove(); return; }
    var items = [
      { label: 'Warehouse',       form: 'Warehouse' },
      { label: 'Customer Return', form: 'CustomerReturn' },
      { label: 'Dispatch',        form: 'Dispatch' },
      { label: 'Import CSV',      form: 'ImportCSV' }
    ];
    var html = items.map(function(i) {
      return '<button class="ncrMoreItem" data-form="' + i.form + '" style="width:100%;display:block;padding:14px 16px;font-size:14px;font-weight:600;color:#0f172a;background:transparent;border:0;border-bottom:1px solid #e2e8f0;text-align:left;cursor:pointer;font-family:inherit;">' + i.label + '</button>';
    }).join('');
    var sheet = document.createElement('div');
    sheet.id = 'ncrMoreSheet';
    sheet.style.cssText = 'position:fixed;inset:0;z-index:9998;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,58,95,0.55);';
    sheet.innerHTML = '<div style="background:#fff;width:100%;max-width:600px;border-radius:14px 14px 0 0;overflow:hidden;">' +
      '<div style="padding:12px 14px;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1.4px;border-bottom:1px solid #e2e8f0;">More modules</div>' +
      html + '</div>';
    sheet.addEventListener('click', function(e) {
      if (e.target === sheet) { sheet.remove(); return; }
      var b = e.target.closest('.ncrMoreItem');
      if (b) { var f = b.getAttribute('data-form'); sheet.remove(); ncrGoto(f); }
    });
    document.body.appendChild(sheet);
  }
  window.ncrShowMore = ncrShowMore;

  /* ─────────────────── BOOT ───────────────────────────────────── */
  init();
</script>
</body>
</html>
