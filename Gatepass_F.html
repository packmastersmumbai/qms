<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
</head>
<body>

<div class="pm-header">
  <a onclick="goHome()" style="color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;margin-right:4px;text-decoration:none;">‹</a>
  <span class="logo-text">🚚 New Gatepass</span>
  <span class="doc-badge" id="docBadge">Loading…</span>
</div>

<div style="padding-bottom:80px;">

  <div class="section">
    <div class="section-title">Dispatch Details</div>
    <div class="section-body">

      <div class="field">
        <label>Date</label>
        <input type="date" id="date">
      </div>

      <div class="field">
        <label>Type</label>
        <select id="type">
          <option value="Outgoing Delivery">Outgoing Delivery</option>
          <option value="Supplier Return">Supplier Return</option>
          <option value="Job Work">Job Work</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label>OQC Reference <span style="font-size:10px;color:#9CA3AF;">(if applicable)</span></label>
        <input type="text" id="oqcRef" placeholder="e.g. PM/OQC/2026-001">
      </div>

      <div class="field">
        <label>Customer / Party</label>
        <select id="party" onchange="onPartyChange()">
          <option value="">— Select Party —</option>
        </select>
      </div>

      <div class="field">
        <label>Vehicle No.</label>
        <input type="text" id="vehicleNo" placeholder="Truck/vehicle registration number">
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field">
          <label>Driver Name</label>
          <input type="text" id="driverName" placeholder="Driver name">
        </div>
        <div class="field">
          <label>Transporter</label>
          <input type="text" id="transporter" placeholder="Transport company">
        </div>
      </div>

      <div class="field">
        <label>Dispatch Zone</label>
        <select id="dispatchZone">
          <option value="Dispatch Bay">Dispatch Bay</option>
          <option value="Finished Goods Store">Finished Goods Store</option>
          <option value="Production Zone">Production Zone</option>
          <option value="Raw Material Store">Raw Material Store</option>
          <option value="Quarantine Zone">Quarantine Zone</option>
        </select>
      </div>

    </div>
  </div>

  <div class="section">
    <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Materials / Items</span>
      <span id="itemBadge" style="background:var(--amber);color:var(--navy);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;">0 added</span>
    </div>
    <div class="section-body">

      <div class="field">
        <label>Material / Product</label>
        <input type="text" id="matSearch" placeholder="Type to search material…" oninput="filterMaterials()" autocomplete="off">
        <select id="material" size="3" style="margin-top:4px;" onchange="onMaterialChange()"></select>
      </div>

      <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;">
        <div class="field">
          <label>Quantity</label>
          <input type="number" id="qty" min="0" placeholder="0">
        </div>
        <div class="field">
          <label>Unit</label>
          <input type="text" id="unit" placeholder="KG / PC" readonly style="background:#F9FAFB;color:#6B7280;">
        </div>
      </div>

      <button type="button" onclick="addItem()" style="width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:4px;">+ Add Item</button>

      <div id="itemsList" style="margin-top:8px;">
        <p style="font-size:11px;color:var(--muted);text-align:center;padding:8px 0;">No items added yet</p>
      </div>

    </div>
  </div>

  <div class="section">
    <div class="section-title">Authorization</div>
    <div class="section-body">

      <div class="field">
        <label>Authorized By</label>
        <select id="authorizedBy">
          <option value="">— Select —</option>
        </select>
      </div>

      <div class="field">
        <label>Security Guard on Duty</label>
        <input type="text" id="securityGuard" placeholder="Name of security guard on duty">
      </div>

      <div class="field">
        <label>Remarks</label>
        <textarea id="remarks" placeholder="Any notes or observations…"></textarea>
      </div>

    </div>
  </div>

</div>

<!-- Sticky footer -->
<div style="position:fixed;bottom:0;left:0;right:0;background:var(--white);padding:10px;border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(0,0,0,0.06);">
  <button class="btn-submit" id="btnSubmit" onclick="submitGatepass()">Issue Gatepass ✓</button>
</div>

<div class="toast" id="toast"></div>

<script>
var ALL_PARTIES = [], ALL_MATS = [];
var partySel = {}, materialSel = {};
var ITEMS = [];
var docNo = '';

function init() {
  var today = new Date();
  document.getElementById('date').value = today.toISOString().split('T')[0];

  google.script.run
    .withSuccessHandler(function(data) {
      docNo = data.docNumber;
      document.getElementById('docBadge').textContent = docNo;

      ALL_PARTIES = data.parties;
      var pSel = document.getElementById('party');
      data.parties.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p.code;
        opt.textContent = p.name + (p.type ? ' (' + p.type + ')' : '');
        opt.dataset.obj = JSON.stringify(p);
        pSel.appendChild(opt);
      });

      var aSel = document.getElementById('authorizedBy');
      data.personnel.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name + ' — ' + p.role;
        aSel.appendChild(opt);
      });

      ALL_MATS = data.materials;
      renderMaterials(ALL_MATS);
    })
    .withFailureHandler(function(e) { showToast(e.message, 'error'); })
    .getGatpassFormInit();
}

function renderMaterials(mats) {
  var sel = document.getElementById('material');
  sel.innerHTML = '';
  mats.slice(0, 50).forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m.code;
    opt.textContent = '[' + m.code + '] ' + m.desc + ' (' + m.unit + ')';
    opt.dataset.obj = JSON.stringify(m);
    sel.appendChild(opt);
  });
}

function filterMaterials() {
  var q = document.getElementById('matSearch').value.toLowerCase();
  if (!q) { renderMaterials(ALL_MATS); return; }
  var filtered = ALL_MATS.filter(function(m) {
    return m.desc.toLowerCase().indexOf(q) > -1 ||
           String(m.code).toLowerCase().indexOf(q) > -1 ||
           m.category.toLowerCase().indexOf(q) > -1;
  });
  renderMaterials(filtered);
}

function onPartyChange() {
  var sel = document.getElementById('party');
  var opt = sel.options[sel.selectedIndex];
  partySel = opt && opt.dataset.obj ? JSON.parse(opt.dataset.obj) : {};
}

function onMaterialChange() {
  var sel = document.getElementById('material');
  var opt = sel.options[sel.selectedIndex];
  materialSel = opt && opt.dataset.obj ? JSON.parse(opt.dataset.obj) : {};
  if (materialSel.unit) {
    document.getElementById('unit').value = materialSel.unit;
  }
}

function addItem() {
  var matSel = document.getElementById('material');
  if (!matSel.value) { showToast('Select a material first.', 'error'); return; }

  var matOpt = matSel.options[matSel.selectedIndex];
  if (matOpt && matOpt.dataset.obj) materialSel = JSON.parse(matOpt.dataset.obj);

  var qty = document.getElementById('qty').value;
  if (!qty) { showToast('Enter quantity.', 'error'); return; }

  ITEMS.push({
    materialCode: matSel.value,
    materialDesc: materialSel.desc || matSel.value,
    qty:          qty,
    unit:         document.getElementById('unit').value || materialSel.unit || ''
  });

  // Clear item fields
  document.getElementById('matSearch').value = '';
  document.getElementById('qty').value = '';
  document.getElementById('unit').value = '';
  renderMaterials(ALL_MATS);
  materialSel = {};

  renderItems();
}

function removeItem(i) {
  ITEMS.splice(i, 1);
  renderItems();
}

function renderItems() {
  var badge = document.getElementById('itemBadge');
  badge.textContent = ITEMS.length + (ITEMS.length === 1 ? ' item' : ' items');

  var el = document.getElementById('itemsList');
  if (!ITEMS.length) {
    el.innerHTML = '<p style="font-size:11px;color:var(--muted);text-align:center;padding:8px 0;">No items added yet</p>';
    return;
  }
  el.innerHTML = ITEMS.map(function(item, i) {
    return '<div style="background:#F0F4FF;border:1px solid #C7D7FF;border-radius:8px;padding:8px 10px;margin-bottom:6px;position:relative;">' +
      '<button type="button" onclick="removeItem(' + i + ')" style="position:absolute;top:5px;right:8px;background:none;border:none;font-size:18px;cursor:pointer;color:#9CA3AF;line-height:1;">×</button>' +
      '<div style="font-size:12px;font-weight:600;color:var(--navy);padding-right:24px;">' + escHtml(item.materialDesc) + '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:3px;">Qty: <b>' + escHtml(item.qty) + ' ' + escHtml(item.unit) + '</b></div>' +
    '</div>';
  }).join('');
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function submitGatepass() {
  if (!document.getElementById('date').value)        { showToast('Please enter a date.', 'error'); return; }
  if (!document.getElementById('party').value)       { showToast('Please select a party.', 'error'); return; }
  if (!ITEMS.length)                                  { showToast('Add at least one item.', 'error'); return; }
  if (!document.getElementById('authorizedBy').value){ showToast('Please select who is authorizing.', 'error'); return; }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  var data = {
    date:          document.getElementById('date').value,
    type:          document.getElementById('type').value,
    oqcRef:        document.getElementById('oqcRef').value,
    partyCode:     document.getElementById('party').value,
    partyName:     partySel.name || document.getElementById('party').value,
    vehicleNo:     document.getElementById('vehicleNo').value,
    driverName:    document.getElementById('driverName').value,
    transporter:   document.getElementById('transporter').value,
    authorizedBy:  document.getElementById('authorizedBy').value,
    securityGuard: document.getElementById('securityGuard').value,
    remarks:       document.getElementById('remarks').value,
    dispatchZone:  document.getElementById('dispatchZone').value,
    items:         ITEMS
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        showToast('Gatepass Issued: ' + res.docNo, 'success');
        btn.innerHTML = 'Issued ✓';
        setTimeout(function() { goHome(); }, 1500);
      } else {
        showToast('Error: ' + res.error, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Issue Gatepass ✓';
      }
    })
    .withFailureHandler(function(e) {
      showToast(e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Issue Gatepass ✓';
    })
    .saveGatepass(data);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

window.onload = init;
</script>
</body>
</html>
