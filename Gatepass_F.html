<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <?!= HtmlService.createHtmlOutputFromFile('Theme').getContent(); ?>
  <style>
    /* ── Gatepass-specific styles ── */
    .gp-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      padding: 5px 12px 4px;
      background: var(--navy);
    }

    /* Disposition row */
    .disp-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 10px 0;
    }
    .disp-pick-btn {
      height: 52px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      letter-spacing: 0.5px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s ease;
    }
    .disp-pick-btn:active {
      transform: scale(0.97);
      transition: transform 0.08s ease;
    }
    .disp-pick-btn.approved {
      background: #F0FDF4;
      border-color: var(--success);
      color: var(--success);
    }
    .disp-pick-btn.rejected {
      background: #FEF2F2;
      border-color: var(--danger);
      color: var(--danger);
    }
    .disp-pick-btn.pulse-warn {
      animation: disp-pulse 0.6s ease;
    }
    @keyframes disp-pulse {
      0%   { border-color: var(--amber); box-shadow: 0 0 0 0 rgba(232,160,32,0.5); }
      50%  { border-color: var(--amber); box-shadow: 0 0 0 6px rgba(232,160,32,0); }
      100% { border-color: var(--border); box-shadow: none; }
    }

    /* Sticky footer — navy bg per spec */
    .gp-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--navy);
      padding: 10px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gp-footer-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gp-save-btn {
      background: var(--amber);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .gp-save-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .gp-save-btn:not(:disabled):active {
      transform: scale(0.97);
      transition: transform 0.08s ease;
    }

    /* Warning chip */
    .warn-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #FEF3C7;
      color: #92600A;
      font-size: 11px;
      font-weight: 600;
      border-radius: 20px;
      padding: 4px 10px;
      margin-top: 4px;
    }

    /* Confirmation screen */
    .confirm-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 100px;
      text-align: center;
    }
    .confirm-icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: confirm-pop 0.3s ease forwards;
    }
    @keyframes confirm-pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .confirm-icon-circle svg {
      width: 40px;
      height: 40px;
      stroke: var(--navy);
      stroke-width: 3;
      fill: none;
    }
    .confirm-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .confirm-doc {
      font-size: 24px;
      font-weight: 700;
      color: var(--navy);
      border-bottom: 3px solid var(--amber);
      padding-bottom: 2px;
      margin-bottom: 24px;
      display: inline-block;
    }
    .confirm-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      padding: 5px 12px;
      background: var(--navy-light);
      color: var(--navy);
    }
    .chip.approved {
      background: #DCFCE7;
      color: #15803D;
    }
    .chip.rejected {
      background: #FEE2E2;
      color: #B91C1C;
    }
    .chip-label {
      font-weight: 400;
      opacity: 0.65;
      margin-right: 2px;
    }
    .confirm-home-btn {
      width: 100%;
      max-width: 320px;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    .confirm-home-btn:active {
      background: #0A1450;
    }

    /* Force 16px on all text inputs per spec */
    .field input[type="text"],
    .field input[type="number"],
    .field textarea {
      font-size: 16px !important;
    }
  </style>
</head>
<body>

<!-- ── SCREEN 1: Entry Form ── -->
<div id="screenForm">

  <div class="pm-header">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4l-6 6 6 6"/>
      </svg>
    </button>
    <span class="page-title">Gatepass</span>
    <span class="doc-badge" id="docBadge">GATE</span>
  </div>

  <!-- Section 1: MATERIAL -->
  <div class="section">
    <div class="gp-section-label">MATERIAL</div>
    <div class="section-body">

      <div class="field">
        <label>Material Type</label>
        <select id="materialType">
          <option value="Finished Goods">Finished Goods</option>
          <option value="Raw Material Return">Raw Material Return</option>
          <option value="Waste">Waste</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field" id="fieldOqcRef">
        <label>OQC Reference <span style="color:var(--danger)">*</span></label>
        <select id="oqcRef">
          <option value="">— Loading released OQCs… —</option>
        </select>
        <div class="hint">Select the released OQC batch being dispatched</div>
        <div id="oqcRefWarn" style="display:none;font-size:11px;color:var(--amber);margin-top:4px;font-weight:600;">
          ⚠ No released OQC records found. Proceed manually.
        </div>
      </div>

      <div class="field">
        <label>Description <span style="color:var(--danger)">*</span></label>
        <input type="text" id="description" placeholder="Material description" required>
      </div>

      <div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div>
          <label>Qty <span style="color:var(--danger)">*</span></label>
          <input type="number" id="qty" min="0.01" step="any" inputmode="decimal"
                 placeholder="0.00" required>
        </div>
        <div>
          <label>Unit</label>
          <select id="unit">
            <option value="Pcs">Pcs</option>
            <option value="Kg">Kg</option>
            <option value="Ltrs">Ltrs</option>
            <option value="Boxes">Boxes</option>
            <option value="Rolls">Rolls</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

    </div>
  </div>

  <!-- Section 2: VEHICLE -->
  <div class="section">
    <div class="gp-section-label">VEHICLE</div>
    <div class="section-body">

      <div class="field">
        <label>Vehicle No. <span style="color:var(--danger)">*</span></label>
        <input type="text" id="vehicleNo" placeholder="e.g. MH04 AB 1234" required>
      </div>

      <div class="field">
        <label>Driver Name <span style="color:var(--danger)">*</span></label>
        <input type="text" id="driverName" placeholder="Driver's full name" required>
      </div>

      <div class="field">
        <label>Purpose</label>
        <input type="text" id="purpose"
               placeholder="e.g. Customer delivery, return to supplier">
      </div>

    </div>
  </div>

  <!-- Section 3: AUTHORIZATION -->
  <div class="section">
    <div class="gp-section-label">AUTHORIZATION</div>
    <div class="section-body">

      <div class="field">
        <label>Authorized By <span style="color:var(--danger)">*</span></label>
        <select id="authorizedBy" required>
          <option value="">— Loading… —</option>
        </select>
        <div id="authWarn" style="display:none">
          <span class="warn-chip">&#9888; No authorized users found.</span>
        </div>
      </div>

      <div class="field">
        <label>Remarks</label>
        <textarea id="remarks" rows="3" placeholder="Optional notes…"></textarea>
      </div>

    </div>
  </div>

  <!-- Disposition row -->
  <div class="disp-row">
    <button class="disp-pick-btn" id="btnApproved" type="button">APPROVED</button>
    <button class="disp-pick-btn" id="btnRejected" type="button">REJECTED</button>
  </div>
  <!-- spacer so content clears sticky footer -->
  <div style="height:72px;"></div>

</div><!-- #screenForm -->

<!-- ── SCREEN 2: Confirmation ── -->
<div id="screenConfirm" style="display:none">
  <div class="pm-header">
    <span class="page-title" style="text-align:center;flex:1">Gatepass Saved</span>
  </div>
  <div class="confirm-wrap">
    <div class="confirm-icon-circle">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="confirm-title">Gatepass Saved</div>
    <div class="confirm-doc" id="confirmDocNo">#—</div>
    <div class="confirm-chips" id="confirmChips"></div>
    <button class="confirm-home-btn" id="btnHome">Back to Home</button>
  </div>
</div>

<!-- Sticky footer (only visible on screen 1) -->
<div class="gp-footer" id="gpFooter">
  <div class="gp-footer-label" id="footerLabel">Finished Goods</div>
  <button class="gp-save-btn" id="btnSave" disabled>Save Gatepass &#8594;</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────
var _today      = '';
var _docNo      = '';
var _disposition = '';   // 'APPROVED' | 'REJECTED'
var _saved      = false;
// ── Utility ────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

function trunc(s, n) {
  s = String(s || '');
  return s.length > n ? s.slice(0, n) + '…' : s;
}

// ── Validation / save-button state ────────────────────────────────────
function refreshSaveBtn() {
  var isFG    = document.getElementById('materialType').value === 'Finished Goods';
  var oqcOk   = !isFG || document.getElementById('oqcRef').value !== '';
  var ok = (
    document.getElementById('description').value.trim() !== '' &&
    document.getElementById('qty').value.trim() !== '' &&
    parseFloat(document.getElementById('qty').value) >= 0.01 &&
    document.getElementById('vehicleNo').value.trim() !== '' &&
    document.getElementById('driverName').value.trim() !== '' &&
    document.getElementById('authorizedBy').value !== '' &&
    _disposition !== '' &&
    oqcOk
  );
  document.getElementById('btnSave').disabled = !ok;
}

// ── Disposition buttons ────────────────────────────────────────────────
function setDisposition(val) {
  _disposition = val;
  var bA = document.getElementById('btnApproved');
  var bR = document.getElementById('btnRejected');
  bA.className = 'disp-pick-btn' + (val === 'APPROVED' ? ' approved' : '');
  bR.className = 'disp-pick-btn' + (val === 'REJECTED' ? ' rejected' : '');
  refreshSaveBtn();
}

function pulseDispBtns() {
  var bA = document.getElementById('btnApproved');
  var bR = document.getElementById('btnRejected');
  bA.classList.remove('pulse-warn');
  bR.classList.remove('pulse-warn');
  // force reflow
  void bA.offsetWidth;
  bA.classList.add('pulse-warn');
  bR.classList.add('pulse-warn');
}

// ── Footer label sync ─────────────────────────────────────────────────
function syncFooterLabel() {
  var sel = document.getElementById('materialType');
  document.getElementById('footerLabel').textContent =
    sel.options[sel.selectedIndex].text;
}

// ── Load init data ─────────────────────────────────────────────────────
function loadInit() {
  google.script.run
    .withSuccessHandler(onInitData)
    .withFailureHandler(function(e) { showToast('Load error: ' + e.message, 'error'); })
    .getGatpassFormInit();

  google.script.run
    .withSuccessHandler(onOqcRefsLoaded)
    .withFailureHandler(function(e) {
      document.getElementById('oqcRefWarn').style.display = '';
      document.getElementById('oqcRefWarn').textContent = 'OQC load error: ' + (e && e.message ? e.message : e);
      showToast('OQC load error: ' + (e && e.message ? e.message : e), 'error');
    })
    .getReleasedOQCsForGatepass();
}

function onOqcRefsLoaded(refs) {
  var sel = document.getElementById('oqcRef');
  sel.innerHTML = '';
  if (!refs || refs.length === 0) {
    document.getElementById('oqcRefWarn').style.display = '';
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '— No released OQC found —';
    sel.appendChild(opt);
    refreshSaveBtn();
    return;
  }
  var ph = document.createElement('option');
  ph.value = '';
  ph.textContent = '— Select OQC record —';
  sel.appendChild(ph);
  refs.forEach(function(r) {
    var opt = document.createElement('option');
    opt.value = r.docNo;
    opt.textContent = r.label;
    opt.dataset.customer = r.customer || '';
    opt.dataset.material = r.material || '';
    opt.dataset.batch    = r.batchPO  || '';
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function() {
    var opt = this.options[this.selectedIndex];
    if (opt && opt.dataset.material) {
      document.getElementById('description').value = opt.dataset.material;
    }
    refreshSaveBtn();
  });
  refreshSaveBtn();
}

function onInitData(data) {
  _today = (data && data.today) || new Date().toISOString().split('T')[0];
  _docNo = (data && data.docNumber) || '';
  document.getElementById('docBadge').textContent = _docNo || 'GATE';

  var personnel = (data && data.personnel) || [];
  var users = personnel.map(function(p) { return { name: p.name || p.code || String(p) }; });
  onUsersLoaded(users);
}

function onUsersLoaded(users) {
  var sel = document.getElementById('authorizedBy');
  sel.innerHTML = '';

  if (!users || users.length === 0) {
    showAuthWarn();
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '— No users found —';
    sel.appendChild(opt);
    return;
  }

  var placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = '— Select —';
  sel.appendChild(placeholder);

  users.forEach(function(u) {
    var opt = document.createElement('option');
    opt.value = u.name;
    opt.textContent = u.name;
    sel.appendChild(opt);
  });
  refreshSaveBtn();
}

function showAuthWarn() {
  document.getElementById('authWarn').style.display = '';
}

// ── Save ───────────────────────────────────────────────────────────────
function doSave() {
  // Validate required
  var desc    = document.getElementById('description').value.trim();
  var qtyRaw  = document.getElementById('qty').value.trim();
  var vehicle = document.getElementById('vehicleNo').value.trim();
  var driver  = document.getElementById('driverName').value.trim();
  var authBy  = document.getElementById('authorizedBy').value;

  if (!desc)    { showToast('Description is required.', 'error'); return; }
  if (!qtyRaw || parseFloat(qtyRaw) < 0.01) {
    showToast('Enter a valid quantity.', 'error'); return;
  }
  if (!vehicle) { showToast('Vehicle number is required.', 'error'); return; }
  if (!driver)  { showToast('Driver name is required.', 'error'); return; }
  if (!authBy)  { showToast('Select an authorized user.', 'error'); return; }
  if (!_disposition) {
    pulseDispBtns();
    showToast('Select APPROVED or REJECTED.', 'error');
    return;
  }

  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  var matType = document.getElementById('materialType').value;
  var unit    = document.getElementById('unit').value;
  var purpose = document.getElementById('purpose').value.trim();
  var remarks = document.getElementById('remarks').value.trim();

  var oqcRefVal = document.getElementById('oqcRef') ? document.getElementById('oqcRef').value : '';
  var data = {
    date:         _today,
    type:         matType,
    oqcRef:       oqcRefVal,
    partyName:    '',
    vehicleNo:    vehicle,
    driverName:   driver,
    transporter:  '',
    authorizedBy: authBy,
    disposition:  _disposition,
    operatorName: window.QMS ? window.QMS.getOperatorName() : '',
    remarks:      (purpose ? 'Purpose: ' + purpose + (remarks ? '. ' + remarks : '') : remarks),
    sessionId:    '',
    items: [{
      materialCode: '',
      materialDesc: desc,
      qty:          parseFloat(qtyRaw),
      unit:         unit
    }]
  };

  callSaveGatepass(data, matType, desc, parseFloat(qtyRaw), unit, vehicle);
}

function callSaveGatepass(data, matType, desc, qty, unit, vehicle) {
  google.script.run
    .withSuccessHandler(function(res) { onSaveSuccess(res, matType, desc, qty, unit, vehicle); })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message, 'error');
      var btn = document.getElementById('btnSave');
      btn.disabled = false;
      btn.innerHTML = 'Save Gatepass &#8594;';
    })
    .saveGatepass(data);
}

function onSaveSuccess(res, matType, desc, qty, unit, vehicle) {
  if (!res || !res.success) {
    showToast('Error: ' + (res ? res.error : 'Unknown'), 'error');
    var btn = document.getElementById('btnSave');
    btn.disabled = false;
    btn.innerHTML = 'Save Gatepass &#8594;';
    return;
  }
  _saved = true;
  showConfirmation(res.docNo, matType, desc, qty, unit, vehicle);
}

// ── Confirmation screen ────────────────────────────────────────────────
function showConfirmation(docNo, matType, desc, qty, unit, vehicle) {
  document.getElementById('screenForm').style.display  = 'none';
  document.getElementById('gpFooter').style.display    = 'none';
  document.getElementById('screenConfirm').style.display = '';

  document.getElementById('confirmDocNo').textContent = '#' + (docNo || _docNo);

  var chips = document.getElementById('confirmChips');
  chips.innerHTML = '';

  function makeChip(label, val, extraClass) {
    var c = document.createElement('span');
    c.className = 'chip' + (extraClass ? ' ' + extraClass : '');
    c.innerHTML = '<span class="chip-label">' + escHtml(label) + '</span>' + escHtml(val);
    return c;
  }

  chips.appendChild(makeChip('Type', matType));
  chips.appendChild(makeChip('Item', trunc(desc, 20)));
  chips.appendChild(makeChip('Qty', qty + ' ' + unit));
  chips.appendChild(makeChip('Vehicle', vehicle));

  var dispChip = document.createElement('span');
  dispChip.className = 'chip ' + (_disposition === 'APPROVED' ? 'approved' : 'rejected');
  dispChip.textContent = _disposition;
  chips.appendChild(dispChip);
}

// ── Wire up events ─────────────────────────────────────────────────────
function bindEvents() {
  document.getElementById('backBtn').addEventListener('click', function() {
    if (_saved) { goHome(); return; }
    if (confirm('Discard this entry and go back?')) goHome();
  });

  document.getElementById('btnHome').addEventListener('click', function() {
    goHome();
  });

  document.getElementById('btnApproved').addEventListener('click', function() {
    setDisposition('APPROVED');
  });

  document.getElementById('btnRejected').addEventListener('click', function() {
    setDisposition('REJECTED');
  });

  document.getElementById('btnSave').addEventListener('click', doSave);

  // Uppercase vehicle on blur
  document.getElementById('vehicleNo').addEventListener('blur', function() {
    this.value = this.value.toUpperCase();
  });

  // Footer label tracks material type
  document.getElementById('materialType').addEventListener('change', function() {
    var isFG = this.value === 'Finished Goods';
    document.getElementById('fieldOqcRef').style.display = isFG ? '' : 'none';
    syncFooterLabel();
    refreshSaveBtn();
  });
  // Show OQC ref on initial load (default is Finished Goods)
  document.getElementById('fieldOqcRef').style.display = '';

  // Refresh save state on any required field change
  var watchIds = ['description', 'qty', 'vehicleNo', 'driverName', 'authorizedBy'];
  watchIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', refreshSaveBtn);
    el.addEventListener('change', refreshSaveBtn);
  });
}

// ── Boot ───────────────────────────────────────────────────────────────
window.onload = function() {
  bindEvents();
  syncFooterLabel();
  loadInit();
};
</script>
</body>
</html>
